  },

  /* ----- Negocjacje „na skrzynkę piwa i kiełbasę” ----- */
  // Zwraca 'ok' | 'refuse' | 'scandal' i od razu pokazuje powiadomienie na ekranie
  beerDeal(who, p, binary) { return Engine.foodDeal('piwo', who, p, binary); },
  // Swojski poczęstunek zamiast pieniędzy: 'ok' | 'refuse' | 'scandal' + powiadomienie na ekranie
  foodDeal(kind, who, p, binary) {
    const F = DATA.foods[kind] || DATA.foods.piwo;
    const o = Selectors.foodOdds(kind, p, binary);
    if (binary) { const fail = o.scandal + o.refuse; o.scandal = fail * 0.5; o.refuse = fail * 0.5; }   // przy podwyżce: część porażek to tylko zawód, nie afera
    Engine.money(F.label, -Selectors.foodCost(kind));
    gameState.stats.beerDeals = (gameState.stats.beerDeals || 0) + 1;
    const r = Math.random();
    if (r < o.ok) {
      Engine.alert(F.icon, F.title, who + ' ' + F.success, 'good', true);
      return 'ok';
    }
    if (r < o.ok + o.scandal) {
      Engine.echo('food', 1, { kind, who, pid: p ? p.id : null, choice: F.label + ' w negocjacjach (' + who + ')', from: 'Negocjacje' }, [2, 5]);
      Engine.addLog('😬 ' + who + ' wyszedł obrażony. Coś czuć, że ta historia jeszcze wróci…', 'event');
      return 'scandal';
    }
    Engine.alert('😒', 'Nie przeszło', who + ' odsunął talerz: „Panie Prezesie, ja chcę pieniędzy, nie ' + (kind === 'smalec' ? 'smalcu' : kind === 'golonka' ? 'golonki' : kind === 'salceson' ? 'salcesonu' : 'piwa') + '”.', 'warn', true);
    return 'refuse';
  },
  // Echo nieudanych negocjacji „przy stole”: historia ląduje w mediach po kilku tygodniach
  foodScandal(a) {
    const kind = a.kind, who = a.who, F = DATA.foods[kind];
    const p = a.pid ? gameState.squad.find((x) => x.id === a.pid) : null;
    {
      const lvl = gameState.club.leagueLevel;
      const media = lvl >= 5 ? 'Ogólnopolskie media' : lvl >= 3 ? 'Portal powiatowy' : 'Cała wieś';
      let extra = '';
      if (kind === 'smalec') {   // mała afera: memy, bez wpisu do kartoteki
        Engine.applyEffects({ fans: -3 });
        extra = 'Memy ze słoikiem smalcu krążą po całym powiecie. Kibice -3%.';
      } else {
        const fans = -Math.round(Math.min(14, 3 + lvl * 1.5) * (kind === 'golonka' ? 1.2 : 1));
        Engine.applyEffects({ fans });
        Engine.addScandal('afera obyczajowa: ' + F.label.toLowerCase() + ' w negocjacjach (' + who + ')');
        Engine.shiftDNA(-2);
        extra = 'Reputacja w dół, kibice ' + fans + '%.';
        if (kind === 'salceson') {
          const fine = Math.round(300 * Selectors.econ());
          Engine.money('Kara: akcyza i sanepid (bimber)', -fine);
          if (p) p.injured = Math.max(p.injured || 0, 1);
          extra += ' Kara ' + Utils.formatMoney(fine) + (p ? ', a ' + p.nick + ' tydzień leży z zatruciem.' : '.');
        }
        if (kind === 'golonka') { Engine.applyEffects({ lockerRoom: -4 }); extra += ' Szatnia wstydzi się za prezesa (-4%).'; }
      }
      Engine.alert('📰', 'AFERA OBYCZAJOWA!', media + ': „Prezes ' + Selectors.clubDisplayName() + ' ' + F.scandal + '”. ' + extra, 'bad', true);
      Engine.xPost('portal', 'SKANDAL: prezes ' + Selectors.clubDisplayName() + ' ' + F.scandal + '! ' + F.icon + '📸');
    }
  },
  buyTransferBeer(id) {
    if (Selectors.transferBanned()) return;   // ban transferowy Związku
    const t = gameState.transfer;
    const p = t.open && t.market.find((x) => x.id === id);
    if (!p || p.beerTried || !Selectors.beerAllowed() || gameState.squad.length >= CONFIG.maxSquad || gameState.finance.budget < Selectors.beerCost()) return;
    p.beerTried = true;
    const res = Engine.beerDeal(Selectors.playerName(p), p);
    if (res === 'ok') {
      t.market = t.market.filter((x) => x.id !== id);
      delete p.fee; delete p.beerTried;
      gameState.squad.push(p);
      t.bought++;
      Engine.addLog('🍺 Transfer za skrzynkę piwa i kiełbasę: ' + Selectors.playerName(p) + ' dołącza do klubu (' + p.wage + ' zł/tydz.).', 'decision');
    } else if (res === 'scandal') {
      t.market = t.market.filter((x) => x.id !== id);   // obrażony – nie chce słyszeć o klubie
    } else {
      p.fee = Math.round(p.fee * 1.1 / 10) * 10;          // poczuł się niedoceniony – cena w górę
    }
  },

  /* ----- Akademia U19 ----- */
  makeJunior(age) {
    const A = Selectors.academy();
    const bonus = Selectors.levelSkillBonus();
    const p = Engine.makePlayer({ ageMin: age, ageMax: age, skillMin: Math.max(1, A.skill[0] + bonus - 1), skillMax: A.skill[1] + bonus - 1 });
    p.wage = 0;   // junior gra za dres i obiad
    p.potential = Math.max(p.skill, Math.min(Selectors.leagueSkillCap() + 2, p.potential + A.room + Selectors.u19Lvl('recruiter')));
    if (Math.random() < A.talent + Selectors.u19Lvl('recruiter') * 0.05) Engine.markTalent(p);
    p.youthPro = Utils.rand(DATA.youthTraits.pros);
    p.youthCon = Utils.rand(DATA.youthTraits.cons);
    if (p.youthCon.startsWith('Kontuzjogenny')) p.fragile = true;
    p.u19Apps = 0;
    return p;
  },
  u19Init() {
    gameState.u19 = { squad: [], table: {}, coach: null, recruiter: null, graduates: [], log: [], last: null };
    [15, 15, 16, 16, 16, 17, 17, 17, 18, 18, 18, 16].forEach((age) => gameState.u19.squad.push(Engine.makeJunior(age)));
    Engine.u19NewSeason();
  },
  u19NewSeason() {
    const u = gameState.u19;
    const names = gameState.league.rivals.map((r) => r.name).concat(DATA.rivals.map((r) => r.name)).filter((n, i, a) => a.indexOf(n) === i).slice(0, 11);
    u.table = {};
    [Selectors.u19Name()].concat(names.map((n) => n + ' U19')).forEach((t) => { u.table[t] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
  },
  // Kolejka ligi juniorów – równolegle z meczem pierwszej drużyny
  u19Match() {
    const u = gameState.u19;
    if (!u || !u.squad.length) return;
    const me = Selectors.u19Name();
    if (!u.table[me]) Engine.u19NewSeason();
    const exiles = gameState.squad.filter((p) => p.exiled && !(p.injured > 0));   // zesłani seniorzy grają z juniorami
    const eleven = exiles.concat(u.squad.slice().sort((a, b) => b.skill - a.skill)).slice(0, 11);
    const filler = Math.max(1, Selectors.academy().skill[0] + Selectors.levelSkillBonus() - 1);   // braki w składzie łata chłopak z rocznika
    const avg = (eleven.reduce((s, p) => s + p.skill, 0) + Math.max(0, 11 - eleven.length) * filler) / 11;
    const ourS = (0.45 + avg * 0.13) * (1 + Selectors.u19Lvl('coach') * 0.04);
    const oppS = (0.45 + (1.6 + Selectors.levelSkillBonus()) * 0.13) * Utils.randRange(0.8, 1.2);   // przeciętna akademia rywala
    const others = Object.keys(u.table).filter((t) => t !== me);
    const opp = Utils.rand(others);
    const gf = Utils.poisson(1.3 * Math.pow(ourS / oppS, 1.3)), ga = Utils.poisson(1.3 * Math.pow(oppS / ourS, 1.3));
    const rec = (t, f, a) => { const r = u.table[t]; r.p++; r.gf += f; r.ga += a; if (f > a) { r.w++; r.pts += 3; } else if (f === a) { r.d++; r.pts++; } else r.l++; };
    rec(me, gf, ga); rec(opp, ga, gf);
    Utils.shuffle(others.filter((t) => t !== opp)).forEach((t, i, arr) => { if (i % 2 === 0 && arr[i + 1]) { const a = Utils.poisson(1.3), b = Utils.poisson(1.3); rec(t, a, b); rec(arr[i + 1], b, a); } });
    eleven.forEach((p) => { p.u19Apps = (p.u19Apps || 0) + 1; p.u19Total = (p.u19Total || 0) + 1; });
    // strzelcy i noty juniorów
    const scorers = [];
    for (let i = 0; i < gf; i++) {
      const sc = Utils.weightedPick(eleven, (x) => ({ GK: 0.05, DEF: 0.7, MID: 2.5, FWD: 5 }[x.pos]) * x.skill);
      if (sc) {
        sc.u19Goals = (sc.u19Goals || 0) + 1; sc.u19GoalsTotal = (sc.u19GoalsTotal || 0) + 1; scorers.push(sc.nick);
        const as = Math.random() < 0.75 && Utils.weightedPick(eleven.filter((x) => x !== sc), (x) => ({ GK: 0.1, DEF: 1.2, MID: 4, FWD: 2.5 }[x.pos]) * x.skill);
        if (as) { as.u19Assists = (as.u19Assists || 0) + 1; as.u19AssistsTotal = (as.u19AssistsTotal || 0) + 1; }
      }
    }
    eleven.forEach((x) => {   // kartki juniorów: temperament jak w seniorach
      const t = x.temper != null ? x.temper : 0.4;
      if (Math.random() < 0.004 * (0.5 + t * 2)) x.u19Reds = (x.u19Reds || 0) + 1;
      else if (Math.random() < 0.06 * (0.4 + t * 1.6)) x.u19Yellows = (x.u19Yellows || 0) + 1;
    });
    eleven.forEach((x) => {
      const r = Math.round(Utils.clamp(6 + (gf - ga) * 0.35 + scorers.filter((n) => n === x.nick).length * 0.8 + (x.skill - avg) * 0.25 + Utils.randRange(-1, 1), 2, 10) * 10) / 10;
      x.u19RatingSum = (x.u19RatingSum || 0) + r; x.u19RatingN = (x.u19RatingN || 0) + 1;
      x.u19Form = (x.u19Form || []).concat([r]).slice(-5);
    });
    u.form = (u.form || []).concat([gf > ga ? 'W' : gf === ga ? 'D' : 'L']).slice(-5);
    u.last = { opp, gf, ga, scorers };
  },
  // Co tydzień: łowcy perełek z innych klubów tylko obserwują – ruch wykonują po okienku transferowym
  u19Poachers() {
    const u = gameState.u19;
    if (!u) return;
    const rec = Selectors.u19Lvl('recruiter');
    u.squad.slice().forEach((p) => {
      if (p.secured || p.age < 17 || !Selectors.isGem(p)) return;
      if (!p.watch && Math.random() < 0.25) {
        p.watch = 1;
        p.watchClub = Engine.otherClubName(Utils.randInt(1, 3));
        if (rec) Engine.alert('👀', 'Łowcy talentów w akademii', 'Skauci klubu ' + p.watchClub + ' obserwują ' + Selectors.playerName(p) + ' z U19. Zabezpiecz go kontraktem przed końcem okienka transferowego – wtedy łowcy wykonują ruch!', 'warn');
        return;
      }
      if (p.watch) p.watch++;
    });
  },
  // Koniec sezonu, tuż po zamknięciu okienka: łowcy podkradają niezabezpieczone perełki, 19-latkowie czekają na decyzję
  u19WindowVerdict(season) {
    const u = gameState.u19;
    if (!u) return;
    const rec = Selectors.u19Lvl('recruiter');
    const stolen = [];
    u.squad.slice().forEach((p) => {
      if (p.secured || p.age < 17 || !Selectors.isGem(p)) return;
      const chance = Utils.clamp((p.watch ? 0.3 + Math.min(p.watch, 12) * 0.025 : 0.12) + (p.age >= 19 ? 0.1 : 0) - rec * 0.06, 0.05, 0.75);
      if (Math.random() >= chance) return;
      const club = p.watchClub || Engine.otherClubName(Utils.randInt(1, 3));
      u.squad = u.squad.filter((x) => x.id !== p.id);
      stolen.push({ name: Selectors.playerName(p), club, ovr: Selectors.ovr(p), age: p.age, talent: !!p.talent });
      Engine.addLog('🕵️ ' + club + ' podkradł z U19: ' + Selectors.playerName(p) + '.', 'event');
    });
    if (stolen.length) {
      Engine.applyEffects({ fans: -3 * stolen.length });
      gameState.poachReport = { season, stolen };
    }
    const grads = u.squad.filter((p) => p.age >= 19);
    u.squad = u.squad.filter((p) => p.age < 19);
    u.graduates = u.graduates.concat(grads);
    if (u.graduates.length) Engine.pushDecision('u19Graduate');
  },
  u19Secure(id) {

  },
  hireU19(role, idx) {

  fireU19(role) { if (gameState.u19) gameState.u19[role] = null; },
  // Koniec sezonu: rozwój, 19-latkowie do decyzji, nabór nowych
  u19SeasonEnd(summary) {
    const u = gameState.u19;
    if (!u) return;
    const pos = Selectors.u19Standings().findIndex((r) => r.team === Selectors.u19Name()) + 1;
    const grew = [];
    u.squad.forEach((p) => {
      let gain = Engine.develop(p, Math.round((p.u19Apps || 0) * 1.3), false);
      if (Math.random() < Selectors.u19Lvl('coach') * 0.15 && p.skill < Selectors.potential(p)) { p.skill++; gain++; }   // trener juniorów
      if (gain) grew.push(p.nick + ' +' + gain);
      p.u19Prev = { season: gameState.calendar.season, apps: p.u19Apps || 0, goals: p.u19Goals || 0, assists: p.u19Assists || 0, avg: p.u19RatingN ? Math.round(p.u19RatingSum / p.u19RatingN * 10) / 10 : null, yellows: p.u19Yellows || 0, reds: p.u19Reds || 0 };   // do decyzji o 19-latku
      p.age++; p.u19Apps = 0; p.u19Goals = 0; p.u19Assists = 0; p.u19Yellows = 0; p.u19Reds = 0; p.u19RatingSum = 0; p.u19RatingN = 0;   // nowy sezon juniorów
    });
    u.form = [];
    // Juniorzy wracają z wypożyczeń – starsi o rok, ograni w seniorach
    const back = [];
    gameState.u19Loans = (gameState.u19Loans || []).filter((l) => {
      if (l.until > gameState.calendar.season) return true;
      const p = l.player;
      const apps = l.apps != null ? l.apps : Utils.randInt(12, 20);
      const gw = { GK: 0, DEF: 0.05, MID: 0.15, FWD: 0.35 }[p.pos];
      p.u19Prev = { season: gameState.calendar.season, apps, goals: l.goals != null ? l.goals : Math.round(apps * gw * Utils.randRange(0.5, 1.5)), assists: l.assists != null ? l.assists : Math.round(apps * (p.pos === 'MID' ? 0.18 : 0.08) * Utils.randRange(0.5, 1.5)),
        avg: l.apps ? Math.round(l.ratingSum / l.apps * 10) / 10 : Math.round(Utils.randRange(6, 7.4) * 10) / 10, yellows: Utils.randInt(0, 4), reds: Math.random() < 0.08 ? 1 : 0, loanClub: l.club };
      const before = l.ovrStart != null ? l.ovrStart : Selectors.ovr({ ...p, formHistory: [] });
      const gain = (l.midGain || 0) + Engine.develop(p, apps * 1.5, true) + (!l.midGain && Math.random() < 0.4 ? Engine.develop(p, apps, true) : 0);
      p.age++;
      u.squad.push(p);
      Engine.loanReturnNote(p, l.club, before, p.u19Prev, true);
      back.push(p.nick + (gain ? ' +' + gain : ''));
      if (gain) summary.growth.push(Selectors.playerName(p) + ' +' + gain + ' (wypożyczenie juniora: ' + l.club + ')');
      return false;
    });
    const grads = u.squad.filter((p) => p.age >= 19);   // decyzja o nich zapada po okienku transferowym
    const young = u.squad.length - grads.length;
    const A = Selectors.academy();
    const n = Math.min(Math.max(0, 16 - young), Math.max(A.cands + Selectors.u19Lvl('recruiter'), 12 - young));   // nabór utrzymuje co najmniej 12 juniorów
    const fresh = [];
    for (let i = 0; i < n; i++) { const p = Engine.makeJunior(Utils.randInt(15, 16)); u.squad.push(p); fresh.push(p.nick + (p.talent ? ' 💎' : '')); }
    summary.u19 = '🌱 ' + Selectors.u19Name() + ': ' + (pos ? pos + '. miejsce w lidze juniorów' : 'sezon bez meczów') + (grads.length ? ' · 19 lat kończą (decyzja po okienku): ' + grads.map((p) => p.nick).join(', ') : '') + (fresh.length ? ' · nabór: ' + fresh.join(', ') : '') + (back.length ? ' · wracają z wypożyczeń: ' + back.join(', ') : '');
    Engine.u19NewSeason();
  },

  // Tryb automatyczny: dyrektor sam kupuje w oknie transferowym – pod potrzeby składu, styl trenera i budżet
  directorAct() {
    const dir = gameState.director;
    const t = gameState.transfer;
    if (!dir || !dir.hired || dir.mode !== 'auto' || !t.open) return;
    const lvl = dir.hired.level;
    const e = Selectors.econ();
    if (dir.windowSeason !== t.season) { dir.windowSeason = t.season; dir.windowBuys = []; dir.windowSells = []; dir.windowLoans = []; }   // ruchy tego okienka – do raportu
    dir.windowSells = dir.windowSells || []; dir.windowLoans = dir.windowLoans || [];
    const team = Selectors.teamOvr();
    const keep = (p) => p.id === gameState.star.playerId || p.legend || p.favorite || p.loan;
    const posCount = (pos) => gameState.squad.filter((x) => x.pos === pos).length;
    const minPos = { GK: 2, DEF: 5, MID: 5, FWD: 3 };
    // 1) Sprzedaż niechcianych: żądający transferu, słabi i starzy ponad potrzeby pozycji
    const sellCands = gameState.squad.filter((p) => !keep(p) && (p.demandOut || Selectors.ovr(p) <= team - 7 || (p.age >= 32 && Selectors.ovr(p) < team)))
      .sort((a, b) => (b.demandOut ? 1 : 0) - (a.demandOut ? 1 : 0) || Selectors.ovr(a) - Selectors.ovr(b));
    const sellMax = (lvl >= 3 ? 3 : lvl >= 2 ? 2 : 1) - dir.windowSells.length;
    for (const p of sellCands.slice(0, Math.max(0, sellMax))) {
      if (gameState.squad.length <= CONFIG.minSquad + 1 || (!p.demandOut && posCount(p.pos) <= minPos[p.pos])) continue;
      const price = Selectors.sellPrice(p);
      const row = { name: Selectors.playerName(p), pos: DATA.positions[p.pos].label, ovr: Selectors.ovr(p), fee: price, why: p.demandOut ? 'żądał transferu' : p.age >= 32 ? 'wiek' : 'za słaby' };
      Engine.sellTransfer(p.id);
      dir.windowSells.push(row);
    }
    // 2) Wypożyczenia młodych bez szans na grę – ograją się gdzie indziej
    const loanCands = gameState.squad.filter((p) => !keep(p) && p.age <= 21 && Selectors.potential(p) > p.skill && Selectors.ovr(p) <= team - 4);
    for (const p of loanCands.slice(0, Math.max(0, (lvl >= 2 ? 2 : 1) - dir.windowLoans.length))) {
      if (gameState.squad.length <= CONFIG.minSquad + 1 || posCount(p.pos) <= minPos[p.pos]) continue;
      const fee = Selectors.loanOutFee(p);
      Engine.loanOut(p.id);
      const l = gameState.loansOut[gameState.loansOut.length - 1];
      dir.windowLoans.push({ name: Selectors.playerName(p), pos: DATA.positions[p.pos].label, ovr: Selectors.ovr(p), fee, club: l && l.player.id === p.id ? l.club : '' });
    }
    // 3) Utalentowani juniorzy bez miejsca w kadrze – na wypożyczenie, żeby grali i rośli
    const u = gameState.u19;
    if (u) {
      const done = dir.windowLoans.filter((x) => x.junior).length;
      const jMax = (lvl >= 3 ? 3 : lvl >= 2 ? 2 : 1) - done;
      u.squad.filter((p) => p.age >= 17 && p.age < 19 && (p.talent || Selectors.potentialStars(p) >= 3))
        .sort((a, b) => Selectors.potential(b) - Selectors.potential(a)).slice(0, Math.max(0, jMax)).forEach((p) => {
          if (u.squad.length <= 11) return;   // juniorzy muszą mieć z kim grać
          const club = Engine.otherClubName(Math.random() < 0.5 ? 0 : -1);
          u.squad = u.squad.filter((x) => x.id !== p.id);
          delete p.watch; delete p.watchClub;   // na wypożyczeniu nikt go nie podkradnie
          gameState.u19Loans = (gameState.u19Loans || []).concat([{ player: p, club, until: t.season, ovrStart: Selectors.ovr({ ...p, formHistory: [] }) }]);
          dir.windowLoans.push({ id: p.id, name: Selectors.playerName(p), pos: DATA.positions[p.pos].label + ' · U19', ovr: Selectors.ovr(p), fee: 0, club, junior: true });
          Engine.addLog('📤 Dyrektor wypożycza juniora ' + Selectors.playerName(p) + ' (' + p.age + ' l.) do ' + club + ' – sezon regularnej gry w seniorach.', 'decision');
        });
    }
    if (Selectors.transferBanned()) { dir.log = ['Ban transferowy – tylko sprzedaż i wypożyczenia.'].concat(dir.log || []).slice(0, 4); return; }
    let budget = Math.max(0, gameState.finance.budget - 500 * e) * (0.3 + lvl * 0.07);
    const style = Selectors.coach().style;
    const bought = [];
    // Analiza formacji: braki ilościowe i słabe ogniwa w wyjściowej jedenastce na każdej pozycji
    const needs = Selectors.squadNeeds();
    const noise = Math.max(0, 4 - lvl) * 3;   // słabszy dyrektor częściej się myli
    let tries = 0;
    for (let k = 0; k < (lvl >= 3 ? 3 : 2); k++) {
      if (gameState.squad.length >= CONFIG.maxSquad) break;
      const pool = t.market.filter((p) => p.fee <= budget && p.fee <= gameState.finance.budget);
      if (!pool.length) break;
      const gainOf = (p) => Selectors.ovr(p) - needs[p.pos].weakest;
      const score = (p) => needs[p.pos].score + gainOf(p) * (1 + lvl * 0.25) + Engine.profileFit(p, style) * (2 + lvl) - p.fee / (60 * e) + (p.age <= 23 ? 2 : 0) + Utils.randRange(-1, 1) * noise;
      const best = pool.sort((a, b) => score(b) - score(a))[0];
      const n = needs[best.pos];
      if (!n.short && gainOf(best) < (lvl >= 3 ? 2 : -3)) break;   // nie kupuje zapchajdziur – lepszy dyrektor jest bardziej wybredny
      const fee = best.fee;
      const why = n.short ? 'łata dziurę: brak ' + n.short + ' (' + DATA.positions[best.pos].label.toLowerCase() + ')' : gainOf(best) > 0 ? 'wzmocnienie: +' + gainOf(best) + ' OVR względem najsłabszego w składzie' : 'zmiennik';
      if (!Engine.buyTransfer(best.id)) { if (t.market.includes(best) || ++tries > 6) break; k--; continue; }   // odmowa – dyrektor szuka dalej
      dir.windowBuys = (dir.windowBuys || []).concat([{ id: best.id, name: Selectors.playerName(best), pos: DATA.positions[best.pos].label, ovr: Selectors.ovr(best), fee, wage: best.wage, why }]);
      budget -= fee;
      Object.assign(needs, Selectors.squadNeeds());
      bought.push(Selectors.playerName(best) + ' (' + DATA.positions[best.pos].label.toLowerCase() + ', OVR ' + Selectors.ovr(best) + ', ' + Utils.formatMoney(fee) + ')');
    }
    const moves = dir.windowSells.length + dir.windowLoans.length;
    const msg = (bought.length ? 'Kupił: ' + bought.join('; ') : 'Nie znalazł nikogo wartego tych pieniędzy do kupienia.') + (moves ? ' Sprzedał: ' + dir.windowSells.length + ', wypożyczył: ' + dir.windowLoans.length + '.' : '');
    dir.log = [msg].concat(dir.log || []).slice(0, 4);
    t.news = ['🧑‍💼 Dyrektor: ' + msg].concat(t.news || []).slice(0, 4);
    Engine.alert('🧑‍💼', 'Dyrektor Sportowy w oknie transferowym', msg, bought.length ? 'good' : 'info');
  },

  /* ----- Puchar Polski ----- */
  cupSetup() {
    const lvl = gameState.club.leagueLevel;
    if (gameState.club.region == null) gameState.club.region = Utils.randInt(0, DATA.cupRegions.length - 1);   // województwo klubu
    const season = gameState.calendar.season;
    // Szczebel centralny: III liga wzwyż albo zdobywca wojewódzkiego PP z poprzedniego sezonu
    const central = lvl >= 5 || gameState.cupQualified === season;
    const start = central ? 0 : lvl >= 3 ? 1 : 0;   // okręgówka i IV liga wchodzą od II rundy strefy
    gameState.cup = { season, path: central ? 'central' : 'regional', idx: start, start, alive: true, won: false, wonRegional: false, history: [], earned: 0 };
    if (central && lvl < 5) Engine.addLog('🏆 Jako zdobywca ' + Selectors.cupRegion()[0] + 'ego Pucharu Polski gramy w tym sezonie w ogólnopolskim Pucharze Polski!', 'system');
    Engine.cupDraw();
  },
  // Losowanie rywala na najbliższą rundę – od razu trafia do terminarza
  cupDraw() {
    const c = gameState.cup;
    const R = c && Selectors.cupRounds(c)[c.idx];
    if (!R || !c.alive) { if (c) c.next = null; return null; }
    const lvl = gameState.club.leagueLevel;
    const fl = Math.floor(lvl);
    let oppLvl = Utils.clamp(Utils.randInt(Math.max(R.opp[0], fl - 2), Math.min(R.opp[1], Math.max(R.opp[0], fl + 2))), 1, 8);
    if (oppLvl === 3 && Selectors.hasVLiga() && Math.random() < 0.5) oppLvl = 3.5;   // w województwach z V ligą także jej kluby
    const L = DATA.leagueLevels[oppLvl];
    const P = Selectors.leaguePool(oppLvl);   // szczebel regionalny: kluby z własnego województwa / grupy
    const cand = P ? P.filter((n) => n !== gameState.club.name) : [];
    const fresh = cand.filter((n) => !gameState.league.rivals.some((r) => r.name === n));
    const opp = cand.length ? Utils.rand(fresh.length >= 4 ? fresh : cand) : Utils.rand(DATA.rivals).name;
    const final = !!R.final;
    c.next = { idx: c.idx, opp, oppLvl, oppS: Math.round(L.rivalBase * Utils.randRange(0.9, 1.1) * 100) / 100, final, home: !final && (oppLvl > lvl ? false : Math.random() < 0.5) };
    return c.next;
  },
  cupWeek(kolejka) {
    const c = gameState.cup;
    if (!c || !c.alive || c.season !== gameState.calendar.season) return;
    const R = Selectors.cupRounds(c)[c.idx];
    if (!R || Selectors.euroKolejka(R.k) !== kolejka) return;
    const lvl = gameState.club.leagueLevel;
    const regional = c.path === 'regional';
    const cname = Selectors.cupName(c);
    const venue = R.venue === 'narodowy' ? { name: 'PGE Narodowy, Warszawa', att: [40000, 58000] } : R.venue === 'region' ? { name: Selectors.cupRegion()[1], att: [3000, 9000] } : null;
    const nx = c.next && c.next.idx === c.idx ? c.next : Engine.cupDraw();   // rywal wylosowany wcześniej – widoczny w terminarzu
    const { opp, oppLvl, oppS, final, home } = nx;
    gameState.midweekWeek = gameState.calendar.week;   // zmęczenie po meczu w środku tygodnia
    const m = Engine.playMatchday({ opp, oppS, home: final ? false : home, neutral: final, venue, comp: cname, hype: 1.1 + c.idx * 0.12, round: R.label, oppLeague: DATA.leagueLevels[oppLvl].name });
    gameState.cupMatch = m;
    let won = m.gf > m.ga, pens = '';
    if (m.gf === m.ga) { const pen = Engine.penalties(oppS); won = pen.won; pens = pen.score; }
    const e = Selectors.econ();
    const box = { header: '🏆 Puchar Polski', title: R.label + ' · ' + DATA.leagueLevels[oppLvl].name, round: R.label, oppLeague: DATA.leagueLevels[oppLvl].name, final,
      legs: [{ label: final ? 'Finał' : 'Mecz', opp, home: final ? true : home, neutral: final, gf: m.gf, ga: m.ga, pens, goals: m.goals, cards: m.cards, att: m.att, income: m.income, tactic: m.tactic }], verdict: '', money: 0 };
    c.history.unshift(R.label + ': ' + opp + ' ' + m.gf + ':' + m.ga + (pens ? ' (k. ' + pens + ')' : '') + (won ? ' ✅' : ' ❌'));
    if (won) {
      const prize = Math.round((regional ? 150 : 300) * e * (1 + c.idx * (regional ? 0.4 : 0.6)));
      Engine.money(cname + ': premia za ' + R.label, prize);
      m.money.push({ label: 'Premia za awans (' + (regional ? 'WPP' : 'PP') + ')', amount: prize });
      c.earned += prize; box.money += prize;
      Engine.applyEffects({ fans: final ? (regional ? +8 : +15) : +2 });
      if (final && regional) {   // wojewódzki PP: trofeum i przepustka do szczebla centralnego
        c.alive = false; c.wonRegional = true; c.next = null;
        gameState.cupQualified = gameState.calendar.season + 1;
        Engine.addTrophy('🏆', cname, 'ppw');
        box.verdict = '🏆 ' + cname.toUpperCase() + '! Awans do ogólnopolskiego Pucharu Polski w przyszłym sezonie.';
        Engine.alert('🏆', cname + '!', 'Finał na: ' + venue.name + '. Trofeum w gablocie, a w przyszłym sezonie gramy w Pucharze Polski z ligowcami – droga na PGE Narodowy otwarta!', 'good', true);
        Engine.xPost('portal', Selectors.clubDisplayName() + ' zdobywa ' + cname + ' na ' + venue.name + '! Za rok szczebel centralny. 🏆');
      } else if (final) {
        c.alive = false; c.won = true; c.next = null;
        Engine.addTrophy('🏆', 'Puchar Polski', 'pp');
        box.verdict = '🏆 PUCHAR POLSKI W GABLOCIE!';
        Engine.alert('🏆', 'PUCHAR POLSKI!', Selectors.clubDisplayName() + ' zdobywa Puchar Polski! Trofeum trafia do gablotki.' + (lvl === 8 ? ' Do tego eliminacje Ligi Europy.' : ''), 'good', true);
        Engine.xPost('portal', 'SENSACJA NA NARODOWYM! ' + Selectors.clubDisplayName() + ' z Pucharem Polski! 🏆');
      } else {
        c.idx++;
        const d = Engine.cupDraw();
        box.verdict = '✅ Awans! Dalej: ' + Selectors.cupRounds(c)[c.idx].label + (d ? ' – ' + d.opp : '');
      }
    } else {
      c.alive = false;
      c.next = null;
      box.verdict = '❌ Odpadamy z rozgrywek: ' + cname + ' (' + R.label + ').';
    }
    m.cupInfo.verdict = box.verdict;
    m.cupInfo.pens = pens;
    m.cupInfo.won = won;
    gameState.cupReport = null;
  },
  addTrophy(icon, name, kind, lvl) {
    if (!gameState.trophies) gameState.trophies = [];
    gameState.trophies.push({ icon, name, season: gameState.calendar.season, league: Selectors.leagueName(), kind: kind || null, lvl: lvl || gameState.club.leagueLevel });
  },

  /* ----- Europejskie puchary ----- */
  euroSetup(q) {
    const C = DATA.euro.comps[q.comp];
    gameState.euro = { season: gameState.calendar.season, comp: q.comp, origin: q.comp, path: q.path, stage: q.comp === 'UEL' ? 'Q3' : 'Q2',
      lp: null, done: false, result: '', earned: 0, history: [], venue: 'home', asked: [] };
    gameState.stats.euroSeasons = (gameState.stats.euroSeasons || 0) + 1;
    Engine.addLog('🇪🇺 Sezon w Europie: ' + C.name + ' – start od etapu „' + DATA.euro.stages[gameState.euro.stage].label + '”.', 'system');
  },
  euroOpponent(stage) {
    const eu = gameState.euro;
    const s = Math.round((DATA.euro.comps[eu.comp].base + DATA.euro.stages[stage].add + Utils.randRange(-0.15, 0.15)) * 100) / 100;
    const tier = s < 2.6 ? 0 : s < 2.95 ? 1 : s < 3.35 ? 2 : 3;
    const used = eu.history.map((x) => x.opp);
    const pool = DATA.euro.clubs[tier].filter((n) => !used.includes(n));
    return { name: Utils.rand(pool.length ? pool : DATA.euro.clubs[tier]), s, tier };
  },
  // 13.73: mecz europejski na pełnym silniku meczowym (jak liga i Puchar Polski): skład, zmęczenie, kartki, asysty, noty, MVP, bilety i gastro
  // 13.74: tabela fazy ligowej – 35 prawdziwych klubów + my; siła wg pozycji na liście
  euroBuildLp() {
    const eu = gameState.euro;
    const C = DATA.euro.comps[eu.comp];
    const list = DATA.euro.lp[eu.comp].slice();
    list.splice(Utils.randInt(24, 35), 1);   // zwalniamy miejsce z dołu stawki
    const base = C.base + DATA.euro.stages.LP.add;
    eu.lpTable = {};
    list.forEach((name, i) => { eu.lpTable[name] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, s: Math.round((base + 0.38 - 0.76 * i / (list.length - 1)) * 100) / 100 }; });
    eu.lpTable[US] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, s: 0 };
    eu.lpPlayed = [];
  },
  // 13.79: drabinka fazy pucharowej – baraż (9–24), 1/8 (1–8 + zwycięzcy baraży), 1/4, 1/2, finał
  euroKoTie(a, b, from) { const t = { a, b, from: from == null ? null : from, l1: null, l2: null, pens: '', w: null }; if (b === US) { t.a = US; t.b = a; } return t; },
  euroBuildKo() {
    const eu = gameState.euro;
    const st = Selectors.euroLpStandings().map((r) => r.team);
    eu.ko = { KPO: [], R16: [], QF: [], SF: [], F: [] };
    for (let i = 0; i < 8; i++) eu.ko.KPO.push(Engine.euroKoTie(st[8 + i], st[23 - i]));
    for (let i = 0; i < 8; i++) eu.ko.R16.push(Engine.euroKoTie(st[i], null, 7 - i));   // rywal: zwycięzca baraży (pary 9/24 → 1. miejsce itd.)
  },
  euroKoStr: (name) => { const T = gameState.euro.lpTable || {}; return (T[name] && T[name].s) || 3; },
  // Mecz cudzej pary: poisson wg siły, gospodarz z lekką przewagą
  euroKoLeg(t, leg, neutral) {
    const sa = Engine.euroKoStr(t.a), sb = Engine.euroKoStr(t.b), r = sa / sb;
    const adv = neutral ? 1 : leg === 1 ? 1 / 1.08 : 1.08;   // 1. mecz u B, rewanż u A
    return [Utils.poisson(Math.max(0.15, 1.3 * Math.pow(r, 1.6) * adv)), Utils.poisson(Math.max(0.15, 1.3 * Math.pow(1 / r, 1.6) / adv))];
  },
  euroKoDecide(t) {
    const ga = t.l1[0] + (t.l2 ? t.l2[0] : 0), gb = t.l1[1] + (t.l2 ? t.l2[1] : 0);
    if (ga !== gb) { t.w = ga > gb ? t.a : t.b; return; }
    const pa = Utils.clamp(0.5 + (Engine.euroKoStr(t.a) - Engine.euroKoStr(t.b)) * 0.2, 0.3, 0.7);
    const aw = Math.random() < pa;
    t.pens = aw ? Utils.randInt(4, 5) + ':' + Utils.randInt(2, 3) : Utils.randInt(2, 3) + ':' + Utils.randInt(4, 5);
    t.w = aw ? t.a : t.b;
  },
  euroKoFill(stg) {
    const ko = gameState.euro.ko;
    if (stg === 'KPO') { ko.R16.forEach((t) => { if (!t.b && ko.KPO[t.from] && ko.KPO[t.from].w) { const n = Engine.euroKoTie(t.a, ko.KPO[t.from].w, t.from); Object.assign(t, n); } }); return; }
    const nxt = { R16: 'QF', QF: 'SF', SF: 'F' }[stg];
    if (!nxt || ko[nxt].length) return;
    const w = ko[stg].map((t) => t.w);
    for (let i = 0; i + 1 < w.length; i += 2) ko[nxt].push(Engine.euroKoTie(w[i], w[i + 1]));
  },
  // Cudze pary rozgrywane w tych samych tygodniach co nasze mecze (także po naszym odpadnięciu)
  euroKoTick(kolejka) {
    const eu = gameState.euro;
    if (!eu || eu.season !== gameState.calendar.season) return;
    Engine.euroEnsureKo();
    if (!eu.ko) return;
    ['KPO', 'R16', 'QF', 'SF', 'F'].forEach((stg) => {
      const ties = eu.ko[stg];
      if (!ties.length) return;
      const k = Selectors.euroKolejka(DATA.euro.stages[stg].kolejka), single = stg === 'F';
      ties.forEach((t) => {
        if (!t.a || !t.b || t.w || t.a === US) return;
        if (!t.l1 && kolejka >= k) t.l1 = Engine.euroKoLeg(t, 1, single);
        if (!single && t.l1 && !t.l2 && kolejka >= k + 1) t.l2 = Engine.euroKoLeg(t, 2);
        if (t.l1 && (single || t.l2)) Engine.euroKoDecide(t);
      });
      if (ties.every((t) => t.w)) Engine.euroKoFill(stg);
    });
  },
  // Stary zapis (sprzed 13.79) już w fazie pucharowej: odtwarzamy drabinkę z naszą dotychczasową drogą
  euroEnsureKo() {
    const eu = gameState.euro;
    const KO = ['KPO', 'R16', 'QF', 'SF', 'F'];
    if (eu.ko || !eu.lp || !eu.lp.rank || eu.lp.played < DATA.euro.comps[eu.comp].lpGames) return;
    if (!KO.includes(eu.stage) && !eu.done) return;
    if (eu.lp && !eu.lpTable) Engine.euroRebuildLp();
    Engine.euroBuildKo();
    const cur = KO.indexOf(eu.stage);
    KO.forEach((stg, i) => {
      if (i > cur && cur >= 0) return;
      eu.ko[stg].forEach((t) => {
        if (!t.a || !t.b) return;
        if (t.a === US) {
          if (i < cur) { t.l1 = [1, 1]; t.l2 = stg === 'F' ? null : [1, 0]; t.w = US; }
          else if (eu.done && !String(eu.result || '').startsWith('🏆')) { t.l1 = [0, 1]; t.l2 = stg === 'F' ? null : [1, 1]; t.w = t.b; }
          else if (eu.tie) t.l1 = [eu.tie.gf, eu.tie.ga];
          return;
        }
        if (i < cur || eu.done) { t.l1 = Engine.euroKoLeg(t, 1, stg === 'F'); if (stg !== 'F') t.l2 = Engine.euroKoLeg(t, 2); Engine.euroKoDecide(t); }
      });
      if (eu.ko[stg].every((t) => t.w)) Engine.euroKoFill(stg);
    });
  },
  euroKoOur: () => { const eu = gameState.euro; return eu.ko && eu.ko[eu.stage] ? eu.ko[eu.stage].find((t) => t.a === US) : null; },

  // 13.77: zapis sprzed 13.74 – faza ligowa rozegrana bez tabeli: odtwarzamy ją z naszego bilansu
  euroRebuildLp() {
    const eu = gameState.euro, lp = eu.lp || { played: 0, pts: 0, gf: 0, ga: 0 };
    const played = lp.played || 0;
    const w = Math.min(played, Math.floor((lp.pts || 0) / 3)), d = Math.min(played - w, (lp.pts || 0) - w * 3);
    const zone = (k) => (k <= 8 ? 0 : k <= 24 ? 1 : 2);
    for (let tries = 0; tries < 40; tries++) {   // powtarzamy, aż nasze miejsce zgadza się z zapisanym (albo choć strefa)
      Engine.euroBuildLp();
      const T = eu.lpTable;
      const opps = Utils.shuffle(Object.keys(T).filter((n) => n !== US)).slice(0, played);
      opps.forEach((o) => { Engine.euroLpRow(T[o], Utils.poisson(1.2), Utils.poisson(1.4)); Engine.euroLpOthers([US, o]); });
      Object.assign(T[US], { p: played, w, d, l: Math.max(0, played - w - d), gf: lp.gf || 0, ga: lp.ga || 0, pts: lp.pts || 0 });
      eu.lpPlayed = opps;
      const pos = Selectors.euroLpStandings().findIndex((r) => r.team === US) + 1;
      if (!lp.rank || pos === lp.rank || (tries > 25 && zone(pos) === zone(lp.rank))) break;
    }
  },
  // Mecze kolejki fazy ligowej bez naszego udziału (pary losowane z pozostałych drużyn)
  euroLpOthers(skip) {
    const T = gameState.euro.lpTable;
    const rest = Utils.shuffle(Object.keys(T).filter((n) => !skip.includes(n)));
    for (let i = 0; i + 1 < rest.length; i += 2) {
      const a = T[rest[i]], b = T[rest[i + 1]];
      const r = a.s / b.s;
      const ag = Utils.poisson(Math.max(0.15, 1.35 * Math.pow(r, 1.6) * 1.1)), bg = Utils.poisson(Math.max(0.15, 1.35 * Math.pow(1 / r, 1.6) / 1.1));
      Engine.euroLpRow(a, ag, bg); Engine.euroLpRow(b, bg, ag);
    }
  },
  euroLpRow(r, gf, ga) { r.p++; r.gf += gf; r.ga += ga; if (gf > ga) { r.w++; r.pts += 3; } else if (gf === ga) { r.d++; r.pts++; } else r.l++; },
  // Pozostałe mecze kolejki fazy ligowej (symulacja w tle, tylko nasze rozgrywki)
  euroLpRound(opp, gf, ga) {
    const T = gameState.euro.lpTable;
    Engine.euroLpRow(T[US], gf, ga);
    if (T[opp]) Engine.euroLpRow(T[opp], ga, gf);
    Engine.euroLpOthers([US, opp]);
  },
  // Rywal najbliższego meczu losowany z wyprzedzeniem (widoczny w terminarzu)
  euroNextOpp() {
    const eu = gameState.euro;
    const ourKo = eu.ko && eu.ko[eu.stage] ? eu.ko[eu.stage].find((t) => t.a === US) : null;
    const key = eu.stage + ':' + (eu.lp ? eu.lp.played : 0) + (ourKo ? ':' + ourKo.b : '');
    if (!eu.nextOpp || eu.nextOpp.key !== key) {
      let opp = null;
      if (eu.stage === 'LP' && !eu.lpTable) Engine.euroBuildLp();   // stary zapis w trakcie fazy ligowej
      const T = eu.lpTable;
      if (T && eu.stage === 'LP') {
        const cand = Object.keys(T).filter((n) => n !== US && !(eu.lpPlayed || []).includes(n));
        const name = Utils.rand(cand);
        opp = { name, s: T[name].s, tier: T[name].s >= 3.3 ? 3 : T[name].s >= 3 ? 2 : 1 };
      } else if (eu.ko && Engine.euroKoOur()) {
        const t = Engine.euroKoOur();

        else return { name: 'zwycięzca baraży', s: 3.3, tier: 2 };   // para jeszcze nieznana – nie zapamiętujemy
      } else if (T && ['KPO', 'R16', 'QF', 'SF', 'F'].includes(eu.stage)) {
        // faza pucharowa: rywale z tabeli fazy ligowej (baraż – miejsca 9–24, dalej czołówka)
        const order = Selectors.euroLpStandings().map((r) => r.team).filter((n) => n !== US && !eu.history.some((h) => h.opp === n && h.stage !== 'LP'));
        const pool = eu.stage === 'KPO' ? order.slice(8, 24) : order.slice(0, eu.stage === 'R16' ? 16 : 8);
        const name = Utils.rand(pool.length ? pool : order);
        opp = { name, s: Math.round((T[name].s + DATA.euro.stages[eu.stage].add - DATA.euro.stages.LP.add) * 100) / 100, tier: 3 };
      }
      eu.nextOpp = { key, opp: opp || Engine.euroOpponent(eu.stage) };
    }
    return eu.nextOpp.opp;
  },
  euroMatch(opp, home, neutral, label) {
    const eu = gameState.euro;

    Object.entries(m.scorerCount || {}).forEach(([id, n]) => { const p = gameState.squad.find((x) => String(x.id) === String(id)); if (p) p.euroGoals = (p.euroGoals || 0) + n; });
    if (home && !neutral) {   // europejski wieczór: komplet na trybunach i ceny ×2 (zwykła bramka już policzona przez silnik meczu)

      Engine.euroMoney('Bilety: europejski komplet (' + full + ' widzów, ceny UEFA ×2)', extra);

    }
    // Ranking UEFA: punkty za wynik
    const pts = m.gf > m.ga ? 2 : m.gf === m.ga ? 1 : 0;
    gameState.stats.uefaPts = (gameState.stats.uefaPts || 0) + pts;
    eu.uefaPts = (eu.uefaPts || 0) + pts;
    m.cupInfo.uefa = pts;
    return { gf: m.gf, ga: m.ga, scorers: m.goals.filter((g) => g.us).map((g) => g.name), m };
  },
  euroMoney(label, amount) {

    if (amount > 0) gameState.euro.earned += amount;

  },
  // Wywoływane w każdej kolejce ligowej: jeśli w tym tygodniu jest europejski wieczór – gramy
  euroWeek(kolejka) {
    const eu = gameState.euro;
    if (!Selectors.euroLive()) return;
    const st = DATA.euro.stages[eu.stage];
    const C = DATA.euro.comps[eu.comp];
    const e = Selectors.econ();
    // 13.73: dwumecz rozłożony na dwa tygodnie – rewanż w następnej kolejce po pierwszym meczu
    const returnLeg = eu.tie && eu.tie.stage === eu.stage && kolejka > eu.tie.k;
    let due = false;
    if (returnLeg) due = true;
    else if (eu.tie) due = false;
    else if (eu.stage === 'LP') due = eu.lp && Selectors.euroKolejka(st.kolejki[eu.lp.played]) === kolejka;
    else due = Selectors.euroKolejka(st.kolejka) === kolejka;
    if (!due) return;
    gameState.midweekWeek = gameState.calendar.week;
    Engine.applyEffects({ fans: +2 });
    const stageBefore = eu.stage;
    let verdict = '';
    let pens = '';
    let good = true;   // ton ramki z werdyktem (zielony/czerwony)
    if (eu.stage === 'LP') {
      const opp = Engine.euroNextOpp();
      const lp = eu.lp;
      const home = lp.played % 2 === 0;
      const m = Engine.euroMatch(opp, home, false, st.label + ' · ' + (lp.played + 1) + '. kolejka');
      lp.played++; lp.gf += m.gf; lp.ga += m.ga;
      const res = m.gf > m.ga ? 'W' : m.gf === m.ga ? 'D' : 'L';
      lp.pts += { W: 3, D: 1, L: 0 }[res];
      if (eu.lpTable) { Engine.euroLpRound(opp.name, m.gf, m.ga); eu.lpPlayed = (eu.lpPlayed || []).concat(opp.name); }
      Engine.euroMoney('Premia UEFA za wynik', Math.round({ W: 6000, D: 2000, L: 0 }[res] * C.mult * e));
      eu.history.unshift({ stage: 'LP', opp: opp.name, text: C.short + ' · ' + lp.played + '. kolejka fazy ligowej: ' + (home ? 'dom' : 'wyjazd') + ' ' + m.gf + ':' + m.ga + ' z ' + opp.name });
      verdict = 'Faza ligowa: ' + lp.pts + ' pkt po ' + lp.played + ' z ' + C.lpGames + ' meczów' + (eu.lpTable ? ' · ' + (Selectors.euroLpStandings().findIndex((r) => r.team === US) + 1) + '. miejsce w tabeli' : '');
      good = res !== 'L';
      if (lp.played >= C.lpGames) {
        const rank = eu.lpTable ? Selectors.euroLpStandings().findIndex((r) => r.team === US) + 1 : Utils.clamp(Math.round(36 - lp.pts * (C.lpGames === 6 ? 3 : 2.2) + Utils.randInt(-2, 2)), 1, 36);   // miejsce z prawdziwej tabeli
        lp.rank = rank;
        if (eu.lpTable) Engine.euroBuildKo();   // 13.79: drabinka fazy pucharowej
        if (rank <= 8) Engine.euroAdvance('R16', 'Faza ligowa: ' + rank + '. miejsce – prosto do 1/8 finału!');
        else if (rank <= 24) Engine.euroAdvance('KPO', 'Faza ligowa: ' + rank + '. miejsce – baraż o 1/8 finału.');
        else { Engine.euroOut(rank + '. miejsce w fazie ligowej – koniec przygody z Europą.'); good = false; }
        verdict = eu.done ? eu.result : '✅ Faza ligowa zakończona: ' + rank + '. miejsce (' + lp.pts + ' pkt) · dalej: ' + DATA.euro.stages[eu.stage].label;
      }
    } else if (st.tie && !returnLeg) {
      const opp = Engine.euroNextOpp();
      const m = Engine.euroMatch(opp, false, false, st.label + ' · 1. mecz');
      eu.tie = { stage: eu.stage, k: kolejka, opp, gf: m.gf, ga: m.ga };
      const kt = Engine.euroKoOur(); if (kt) kt.l1 = [m.gf, m.ga];
      verdict = '1. mecz: ' + m.gf + ':' + m.ga + ' na wyjeździe. Rewanż u siebie za tydzień.';
      good = m.gf >= m.ga;
      eu.history.unshift({ stage: eu.stage, opp: opp.name, text: C.short + ' · ' + st.label + ', 1. mecz: ' + opp.name + ' ' + m.gf + ':' + m.ga + ' (wyjazd)' });
    } else if (st.tie) {
      const t = eu.tie;
      const m = Engine.euroMatch(t.opp, true, false, st.label + ' · rewanż');
      eu.tie = null;
      const gf = t.gf + m.gf, ga = t.ga + m.ga;
      let won = gf > ga;
      if (gf === ga) { const pen = Engine.penalties(t.opp.s); won = pen.won; pens = pen.score; }
      const agg = gf + ':' + ga + (pens ? ', karne ' + pens : '');
      if (['Q2', 'Q3', 'PO'].includes(eu.stage)) Engine.euroMoney('Premia UEFA: ' + st.label, Math.round(C.qualFee * e));
      const kt = Engine.euroKoOur(); if (kt) { kt.l2 = [m.gf, m.ga]; kt.pens = pens ? (won ? pens : pens) : ''; kt.w = won ? US : kt.b; }
      eu.history.unshift({ stage: eu.stage, opp: t.opp.name, text: C.short + ' · ' + st.label + ': ' + t.opp.name + ' dwumecz ' + agg + (won ? ' ✅' : ' ❌') });
      Engine.euroTieResult(won);
      good = won;
      verdict = 'Dwumecz ' + agg + ' · ' + (eu.done ? eu.result : (won ? '✅ Awans! Dalej: ' : '↘️ Odpadamy, ale gramy dalej: ') + DATA.euro.comps[eu.comp].name + ' · ' + DATA.euro.stages[eu.stage].label);
    } else {
      // Finał: jeden mecz na neutralnym stadionie
      const opp = Engine.euroNextOpp();
      const m = Engine.euroMatch(opp, false, true, 'FINAŁ');
      let won = m.gf > m.ga;
      if (m.gf === m.ga) { const pen = Engine.penalties(opp.s); won = pen.won; pens = pen.score; }
      const kf = Engine.euroKoOur(); if (kf) { kf.l1 = [m.gf, m.ga]; kf.pens = pens; kf.w = won ? US : kf.b; }
      eu.history.unshift({ stage: 'F', opp: opp.name, text: C.short + ' · FINAŁ: ' + opp.name + ' ' + m.gf + ':' + m.ga + (pens ? ' (k. ' + pens + ')' : '') + (won ? ' 🏆' : '') });
      eu.done = true;
      if (won) {
        eu.result = '🏆 ZDOBYWCA PUCHARU: ' + C.name + '!';
        gameState.stats.euroTrophies = (gameState.stats.euroTrophies || 0) + 1;
        Engine.euroMoney('Premia UEFA za zwycięstwo w finale', Math.round(60000 * C.mult * e));
        Engine.applyEffects({ fans: +25, lockerRoom: +15 });
        Engine.addLog('🏆🏆🏆 ' + Selectors.clubDisplayName() + ' WYGRYWA ' + C.name.toUpperCase() + '! Od remizy do europejskiego tronu! [kibice +25%, szatnia +15%]', 'system');
        Engine.xPost('portal', 'NIEPRAWDOPODOBNE! ' + Selectors.clubDisplayName() + ' z pucharem ' + C.name + '! Pan Heniek kosi boisko w kształcie pucharu. 🏆🇪🇺');
      } else {
        eu.result = '🥈 Finał ' + C.name + ' – przegrany, ale co za sezon!';
        Engine.applyEffects({ fans: +10 });
      }
      verdict = eu.result;
      good = won;
    }
    const em = Engine._euroM;
    if (em) {
      em.cupInfo.verdict = verdict;
      em.cupInfo.won = good;
      em.cupInfo.uefaLine = '📊 Ranking UEFA: +' + (em.cupInfo.uefa || 0) + ' pkt · sezon ' + (eu.uefaPts || 0) + ' · łącznie ' + (gameState.stats.uefaPts || 0);
      em.cupInfo.pens = pens;
    }
    Engine._euroM = null;
    if (eu.stage !== stageBefore || eu.done) Engine.euroBest();
    // Europejskie wieczory rodzą unikalne historie
    if (!gameState.pendingDecisions.some((id) => DATA.decisions[id].cutscene)) Engine.maybeEuroCutscene(stageBefore === 'Q2' || (stageBefore === 'Q3' && eu.origin === 'UEL'));
  },
  euroTieResult(won) {
    const eu = gameState.euro;
    const idx = DATA.euro.order.indexOf(eu.stage);
    const next = DATA.euro.order[idx + 1];
    if (won) {
      if (eu.stage === 'SF') return Engine.euroAdvance('F', '');
      if (eu.stage === 'PO') return Engine.euroAdvance('LP', '');
      return Engine.euroAdvance(next, '');
    }
    // Przegrana w eliminacjach: spadek do niższego pucharu (gwarancje jak w prawdziwym systemie UEFA)
    const lower = DATA.euro.comps[eu.comp].lower;
    if (['Q2', 'Q3', 'PO'].includes(eu.stage) && lower) {
      const C = DATA.euro.comps[lower];
      const from = DATA.euro.comps[eu.comp].name;
      eu.comp = lower;
      Engine.addLog('↘️ Odpadamy z eliminacji: ' + from + ', ale zostajemy w Europie: ' + C.name + '.', 'system');
      return Engine.euroAdvance(next, '');
    }
    Engine.euroOut('Odpadamy: ' + DATA.euro.stages[eu.stage].label + '.');
  },
  euroAdvance(stage, note) {
    const eu = gameState.euro;

    const e = Selectors.econ();

      eu.lp = { played: 0, pts: 0, gf: 0, ga: 0, rank: null };

      Engine.applyEffects({ fans: +8 });

      Engine.xPost('portal', Selectors.clubDisplayName() + ' w fazie ligowej ' + C.name + '! Gmina zamawia autokary do Europy. 🇪🇺');
    } else if (DATA.euro.stages[stage].reach) {
