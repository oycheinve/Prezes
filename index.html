          <div class="text-sm text-paper-300">Poziom ${s.club.leagueLevel}: <span class="text-amber-glow">${Selectors.leagueName()}</span> · 📊 ${gameState.season.table[US] && gameState.season.table[US].p ? Selectors.ourPosition() + '. miejsce' : 'przed 1. kolejką'}</div>
          <div class="text-sm text-paper-300">🏟️ ${Utils.escape(Selectors.stadiumName())}</div>
          <div class="text-sm text-paper-300 mt-1">📅 ${Selectors.weekLabel()}</div>
        </div>

        <div class="bg-desk-900 border border-desk-600 p-3 flex flex-col justify-center">
          <div class="text-xs text-paper-400 uppercase tracking-widest">Budżet klubu</div>
          <div class="font-type text-3xl ${budgetClass} crt">${Utils.formatMoney(s.finance.budget)}</div>
          <div class="text-xs text-paper-400 mt-1">Wypłaty: <span class="text-paper-200">${Utils.formatMoney(Selectors.weeklyPayroll())}/tydz.</span></div>
          <div class="text-xs text-paper-400">DNA: <span class="text-paper-200 italic">„${Utils.escape(Selectors.dnaLabel())}”</span></div>
        </div>

        ${UI.meter('Szatnia', '🧦', s.morale.lockerRoom)}
        ${UI.meter('Kibice', '📣', s.morale.fans)}

        ${UI.matchBox()}
      </div>
    </header>`;
  },

  matchBox() {
    const fx = Selectors.currentFixture();
    const w = gameState.weather;
    const rival = Selectors.rival(fx.rival);
    const inPreseason = !Selectors.isMatchWeek();
    const kolejka = gameState.calendar.round + 1;
    const form = gameState.record.form.map((r) => {
      const c = { W: 'bg-grass', D: 'bg-amber-glow text-ink-900', L: 'bg-stamp' }[r];
      return `<span class="inline-block w-5 text-center text-[10px] font-bold ${c}">${{ W: 'W', D: 'R', L: 'P' }[r]}</span>`;
    }).join(' ');
    const head = inPreseason
      ? 'Start ligi za ' + (CONFIG.preseasonWeeks + 1 - gameState.calendar.week) + ' tyg.'
      : 'Kolejka ' + kolejka + ' – w tym tygodniu';
    const extra = !inPreseason && fx.home
      ? ' · szac. ' + Engine.estimateAttendance(fx) + ' widzów'
      : '';
    return `
    <div class="bg-desk-900 border border-desk-600 p-3 flex items-center gap-3 md:col-span-2 xl:col-span-1 min-w-0">
      <div class="text-4xl" title="${Utils.escape(w.label)}">${w.icon}</div>
      <div class="min-w-0">
        <div class="text-xs text-paper-400 uppercase tracking-widest">${head}</div>
        <div class="text-paper-100 font-bold">${fx.home ? 'vs' : '@'} ${Utils.escape(fx.rival)} ${rival.derby ? '<span class="text-stamp whitespace-nowrap">🔥 KOSA</span>' : ''}</div>
        <div class="text-xs text-paper-300">${fx.home ? 'U siebie' : 'Na wyjeździe'}${extra} · ${inPreseason ? 'za oknem: ' : ''}${Utils.escape(w.label)}</div>
        ${form ? `<div class="mt-1 text-paper-100">${form}</div>` : ''}
      </div>
    </div>`;
  },

  meter(label, icon, value) {
    return `
    <div class="bg-desk-900 border border-desk-600 p-3 flex flex-col justify-center">
      <div class="flex justify-between text-xs uppercase tracking-widest text-paper-400">
        <span>${icon} ${label}</span><span class="text-paper-200">${value}%</span>
      </div>
      <div class="mt-2 h-4 bg-desk-700 border border-desk-600">
        <div class="h-full ${Selectors.moodColor(value)} bar-stripes transition-all duration-500" style="width:${value}%"></div>
      </div>
      <div class="text-xs text-paper-300 mt-1">${Selectors.moodLabel(value)}</div>
    </div>`;
  },

  navigation() {
    const items = DATA.tabs.map((t) => {
      const active = t.id === gameState.activeTab;
      const locked = !UI.tabRenderers[t.id];
      return `
      <button data-action="switch-tab" data-tab="${t.id}"
        class="flex-shrink-0 lg:w-full text-left px-4 py-3 border-l-4 font-mono text-sm transition-colors
        ${active ? 'border-amber-glow bg-desk-700 text-amber-glow' : 'border-transparent text-paper-300 hover:bg-desk-800 hover:text-paper-100'}">
        <span class="mr-2">${t.icon}</span>${t.label}${locked ? ' <span class="text-paper-400">🔒</span>' : ''}
      </button>`;
    }).join('');

    return `
    <nav class="lg:w-60 bg-desk-900 lg:border-r border-b lg:border-b-0 border-desk-600 lg:py-4">
      <div class="hidden lg:block px-4 pb-3 text-xs text-paper-400 uppercase tracking-[0.3em]">Pokoje klubowe</div>
      <div class="flex lg:flex-col overflow-x-auto">${items}</div>
      <div class="flex lg:flex-col gap-3 px-4 py-3 lg:pt-6 text-xs">
        <span class="text-grass">💾 Autozapis: Tydzień ${gameState.calendar.week}</span>
        <button data-action="exit-menu" class="text-paper-400 hover:text-paper-100 underline underline-offset-4 text-left">Wyjdź do menu</button>
        <button data-action="reset-game" class="text-paper-400 hover:text-stamp underline underline-offset-4 text-left">Rzuć papierami (nowa gra)</button>
      </div>
    </nav>`;
  },

  activeTabContent() {
    const renderer = UI.tabRenderers[gameState.activeTab] || UI.underConstruction;
    return renderer();
  },

  // Rejestr zakładek – kolejne moduły dodają tu swój renderer.
  tabRenderers: {
    desk: () => UI.deskTab(),
    table: () => UI.tableTab(),
    finance: () => UI.financeTab(),
    staff: () => UI.staffTab(),
    squad: () => UI.squadTab(),
    scouting: () => UI.scoutingTab(),
    virtualx: () => UI.virtualXTab(),
  },

  underConstruction() {
    const tab = DATA.tabs.find((t) => t.id === gameState.activeTab);
    const idx = DATA.tabs.indexOf(tab) % DATA.underConstruction.length;
    return `
    <section class="paper text-ink-900 p-8 max-w-2xl mx-auto mt-6 relative">
      <div class="stamp absolute top-4 right-4 px-3 py-1 font-type text-sm">ZAMKNIĘTE</div>
      <h2 class="font-type text-3xl mb-4">${tab.icon} ${tab.label}</h2>
      <p class="text-lg">${DATA.underConstruction[idx]}</p>
      <p class="text-sm text-ink-700 mt-6">Na drzwiach kartka: „Wracam za 5 min” — data: lipiec 2017.</p>
    </section>`;
  },

  /* ---------- Wspólne klocki UI ---------- */
  card(letter, title, subtitle, body, extraClass = '') {
    return `
    <section class="paper text-ink-900 p-5 ${extraClass}">
      <div class="flex items-baseline gap-3 border-b-2 border-ink-900 pb-2 mb-4">
        <span class="font-type text-3xl text-stamp">${letter}</span>
        <div><h3 class="font-type text-xl leading-tight">${title}</h3><p class="text-xs text-ink-700">${subtitle}</p></div>
      </div>
      ${body}
    </section>`;
  },

  choice(action, value, active, title, desc) {
    return `
    <button data-action="${action}" data-value="${value}"
      class="btn-press w-full text-left px-3 py-2 border-2 border-ink-900 ${active ? 'bg-ink-900 text-paper-100' : 'bg-paper-200 hover:bg-paper-300 shadow-[0_3px_0_#211d18]'}">
      <span class="font-type block">${active ? '☑' : '☐'} ${title}</span>
      ${desc ? `<span class="text-xs ${active ? 'text-paper-300' : 'text-ink-700'}">${desc}</span>` : ''}
    </button>`;
  },

  smallBtn(action, attrs, label, disabled, variant = 'ink') {
    const colors = variant === 'stamp'
      ? 'bg-stamp text-paper-100 hover:bg-red-700'
      : 'bg-ink-900 text-paper-100 hover:bg-ink-700';
    return `<button data-action="${action}" ${attrs} ${disabled ? 'disabled' : ''}
      class="btn-press px-3 py-1.5 text-sm font-bold border-2 border-ink-900 ${disabled ? 'bg-paper-300 text-paper-400 cursor-not-allowed' : colors + ' shadow-[0_3px_0_#3d362c]'}">${label}</button>`;
  },

  bar(value, colorClass) {
    return `<div class="h-4 bg-paper-300 border border-ink-900 mt-1"><div class="h-full ${colorClass} bar-stripes" style="width:${Utils.clamp(value, 0, 100)}%"></div></div>`;
  },

  profileBadge(profile) {
    const pr = DATA.profiles[profile];
    return `<span class="inline-block px-1.5 text-[10px] font-bold ${pr.color}" title="Pasuje do: ${pr.label}">${pr.short}</span>`;
  },

  /* ---------- ZAKŁADKA: BIURKO ---------- */
  deskTab() {
    return `
    <div class="grid gap-6 xl:grid-cols-[1.1fr_1fr]">
      <section>
        <h2 class="font-type text-2xl text-amber-glow crt mb-3">📌 Pilne Sprawy / Decyzje</h2>
        ${UI.decisions()}
      </section>

      <section>
        <h2 class="font-type text-2xl text-amber-glow crt mb-3">📒 Dziennik Zdarzeń</h2>
        ${UI.logPanel()}
      </section>
    </div>`;
  },

  decisions() {
    if (gameState.pendingDecisions.length === 0) {
      return `
      <div class="paper text-ink-900 p-6 text-center">
        <p class="font-type text-xl">Biurko puste.</p>
        <p class="text-sm text-ink-700 mt-1">Tylko kubek z napisem „Najlepszy Dziadek” i pieczątka klubowa bez tuszu.</p>
      </div>`;
    }
    return gameState.pendingDecisions.map((id) => {
      const d = DATA.decisions[id];
      const cols = d.options.length >= 3 ? 'grid-cols-1' : 'sm:grid-cols-2';   // 3 opcje: pełna szerokość, żeby długie słowa się mieściły
      const opts = d.options.map((o, i) => `
        <button data-action="resolve-decision" data-decision="${d.id}" data-option="${i}"
          class="btn-press w-full min-w-0 text-left px-4 py-3 bg-paper-200 hover:bg-paper-300 border-2 border-ink-900 shadow-[0_3px_0_#211d18] [overflow-wrap:anywhere]">
          <span class="font-type text-lg block">▸ ${Utils.escape(o.label)}</span>
          <span class="text-xs text-ink-700">${Utils.escape(Utils.val(o.hint))}</span>
        </button>`).join('');
      return `
      <article class="paper text-ink-900 p-6 relative mb-4">
        <div class="stamp absolute top-3 right-3 px-2 py-0.5 font-type text-xs">PILNE</div>
        <div class="text-xs uppercase tracking-widest text-ink-700">Od: ${Utils.escape(Utils.val(d.from))}</div>
        <h3 class="font-type text-2xl mt-1 mb-3 pr-16">${Utils.escape(Utils.val(d.title))}</h3>
        <p class="leading-relaxed mb-5">${Utils.escape(Utils.val(d.body))}</p>
        <div class="grid gap-3 ${cols}">${opts}</div>
      </article>`;
    }).join('');
  },

  logPanel() {
    // Tygodnie od najnowszego, wpisy w tygodniu chronologicznie (czyta się jak raport).
    const groups = [];
    gameState.log.forEach((entry) => {
      let g = groups.find((x) => x.week === entry.week);
      if (!g) { g = { week: entry.week, entries: [] }; groups.push(g); }
      g.entries.unshift(entry);
    });

    const typeStyle = {
      system:   'border-ink-900',
      decision: 'border-stamp',
      event:    'border-amber-glow',
      match:    'border-grass font-bold',
      coach:    'border-grass italic',
      finance:  'border-ink-700',
      summary:  'border-ink-900 font-bold bg-paper-200 py-1',
      flavor:   'border-paper-400',
    };
    const seenId = UI.lastSeenLogId;
    UI.lastSeenLogId = gameState.ui.lastLogId;

    const html = groups.map((g) => `
      <div class="mb-4">
        <div class="font-type text-sm text-ink-900 border-b border-dashed border-ink-700 mb-2">— Tydzień ${g.week} —</div>
        <ul class="space-y-2">
          ${g.entries.map((e) => `
            <li class="border-l-4 ${typeStyle[e.type] || typeStyle.flavor} pl-3 text-sm leading-snug text-ink-900 ${e.id > seenId ? 'log-new' : ''}">${Utils.escape(e.text)}</li>
          `).join('')}
        </ul>
      </div>`).join('');

    return `<div class="paper text-ink-900 p-5 max-h-[36rem] overflow-y-auto scroll-thin">${html || '<p class="text-sm">Pusto. Nawet plotek brak.</p>'}</div>`;
  },

  /* ---------- ZAKŁADKA: TABELA ---------- */
  tableTab() {
    const rows = Selectors.standings().map((r, i) => {
      const us = r.team === US;
      const rival = Selectors.rival(r.team);
      return `
      <tr class="border-b border-dashed border-paper-400 ${us ? 'bg-amber-glow/40 font-bold' : ''}">
        <td class="py-1.5 pr-2 text-right font-type">${i + 1}.</td>
        <td class="py-1.5 pr-2">${Utils.escape(Selectors.teamName(r.team))}${rival && rival.derby ? ' <span class="text-stamp text-xs">🔥</span>' : ''}</td>
        <td class="text-center">${r.p}</td><td class="text-center">${r.w}</td><td class="text-center">${r.d}</td><td class="text-center">${r.l}</td>
        <td class="text-center whitespace-nowrap">${r.gf}:${r.ga}</td>
        <td class="text-center font-type text-lg">${r.pts}</td>
      </tr>`;
    }).join('');
    const results = gameState.season.lastResults.map((m) => {
      const us = m.home === US || m.away === US;
      return `<li class="${us ? 'font-bold' : ''}">${Utils.escape(Selectors.teamName(m.home))} <b>${m.hg}:${m.ag}</b> ${Utils.escape(Selectors.teamName(m.away))}</li>`;
    }).join('');
    const upcoming = [];
    for (let i = gameState.calendar.round; i < Math.min(gameState.calendar.round + 4, gameState.season.rounds.length); i++) {
      const f = Selectors.fixtureAt(i);
      upcoming.push(`<li>Kolejka ${i + 1}: ${f.home ? 'u siebie vs' : 'wyjazd do'} <b>${Utils.escape(f.rival)}</b>${Selectors.rival(f.rival).derby ? ' <span class="text-stamp">🔥 KOSA</span>' : ''}</li>`);
    }
    return `
    <h2 class="font-type text-3xl text-amber-glow crt mb-1">📊 Tabela B-klasy · Sezon ${gameState.calendar.season}</h2>
    <p class="text-paper-400 text-sm mb-5">Wywieszona na drzwiach remizy. Ktoś długopisem dopisał nam 3 punkty – nieważne.</p>
    <div class="grid gap-6 xl:grid-cols-[1.6fr_1fr]">
      ${UI.card('§', 'Tabela', 'M – mecze, W – wygrane, R – remisy, P – porażki', `
        <div class="overflow-x-auto"><table class="w-full text-sm">
          <tr class="text-xs uppercase text-ink-700"><th></th><th class="text-left">Drużyna</th><th>M</th><th>W</th><th>R</th><th>P</th><th>Bramki</th><th>Pkt</th></tr>
          ${rows}
        </table></div>`)}
      <div class="grid gap-6 content-start">
        ${UI.card('⚽', 'Ostatnia kolejka', 'Wyniki zebrane telefonicznie przez pana Ryśka', results ? `<ul class="text-sm space-y-1">${results}</ul>` : '<p class="text-sm">Liga jeszcze nie ruszyła.</p>')}
        ${UI.card('📅', 'Najbliższe mecze', 'Terminarz z faksu Związku', upcoming.length ? `<ul class="text-sm space-y-1">${upcoming.join('')}</ul>` : '<p class="text-sm">Koniec sezonu.</p>')}
      </div>
    </div>`;
  },

  /* ---------- ZAKŁADKA: SZTAB I TRENER ---------- */
  staffTab() {
    const c = gameState.coach;
    const coach = Selectors.coach();
    const style = DATA.styles[coach.style];
    const lineup = Selectors.projectedLineup();
    const chem = Engine.chemistry(lineup);
    const chemColor = chem >= 65 ? 'bg-grass' : chem >= 45 ? 'bg-amber-glow' : 'bg-stamp';
    const carpetReady = gameState.calendar.week - c.lastCarpetWeek >= CONFIG.carpetCooldown;
    const isTemp = c.id === 'mirek';

    const coachCard = UI.card('A', 'Trener: ' + Utils.escape(coach.name), Utils.escape(coach.title) + ', ' + coach.age + ' l. · w klubie od Tygodnia ' + c.hiredWeek, `
      <p class="text-sm mb-3">${Utils.escape(coach.desc)}</p>
      <div class="grid sm:grid-cols-2 gap-3 mb-3 text-sm">
        <div class="bg-paper-200 border border-paper-400 p-2">Styl: <b>${style.label}</b><br><span class="text-xs text-ink-700">„${style.motto}” · ustawienie ${style.formation.slice(1).join('-')}</span></div>
        <div class="bg-paper-200 border border-paper-400 p-2">Pensja: <b>${Utils.formatMoney(coach.weekly)}/tydz.</b><br><span class="text-xs text-ink-700">${coach.prefers === 'veterans' ? 'Faworyzuje starych wyjadaczy' : coach.prefers === 'youth' ? 'Stawia na młodzież' : 'Wybiera po umiejętnościach'}</span></div>
      </div>
      <div class="mb-3">
        <div class="flex justify-between text-sm"><span>Chemia taktyczna: <b>${Selectors.chemLabel(chem)}</b></span><span>${chem}%</span></div>
        ${UI.bar(chem, chemColor)}
        <p class="text-xs text-ink-700 mt-1">Zgranie stylu trenera z profilami zawodników w jego wyjściowej jedenastce (+ wpływ sztabu). Niska chemia = głupie straty i narzekania w raportach.</p>
      </div>
      ${c.lastReport ? `<blockquote class="border-l-4 border-grass pl-3 italic text-sm mb-3">„${Utils.escape(c.lastReport)}”</blockquote>` : ''}
      <div class="flex flex-wrap gap-2">
        ${UI.smallBtn('carpet-coach', '', '🟥 Wezwij na dywanik', !carpetReady)}
        ${isTemp ? '' : UI.smallBtn('fire-coach', 'data-mode="severance"', 'Zwolnij z odprawą (' + Utils.formatMoney(Engine.severance()) + ')', gameState.finance.budget < Engine.severance(), 'stamp')}
        ${isTemp ? '' : UI.smallBtn('fire-coach', 'data-mode="cold"', 'Zwolnij bez odprawy (foch szatni)', false, 'stamp')}
      </div>
      <p class="text-xs text-ink-700 mt-2">${carpetReady ? 'Dywanik: krótka rozmowa ostrzegawcza. Zwykle mobilizuje, czasem obraża.' : 'Na dywanik można wezwać ponownie w Tygodniu ' + (c.lastCarpetWeek + CONFIG.carpetCooldown) + '.'}</p>
    `);

    const market = Object.entries(DATA.coaches).filter(([id]) => id !== 'mirek' && id !== c.id).map(([id, co]) => {
      const st = DATA.styles[co.style];
      const testLineup = (() => { const prev = c.id; c.id = id; const l = Engine.pickLineup([]); const ch = Engine.chemistry(l); c.id = prev; return ch; })();
      return `
      <div class="border-b border-dashed border-paper-400 py-3">
        <div class="flex justify-between gap-3 items-start">
          <div>
            <div class="font-type text-lg">${Utils.escape(co.name)} <span class="text-sm font-mono text-ink-700">– ${Utils.escape(co.title)}</span></div>
            <div class="text-sm">Styl: <b>${st.label}</b> („${st.motto}”) · podpis ${Utils.formatMoney(co.sign)} · <b>${Utils.formatMoney(co.weekly)}/tydz.</b></div>
            <div class="text-xs text-ink-700">${Utils.escape(co.desc)}</div>
            <div class="text-xs mt-1">Przewidywana chemia z naszą kadrą: <b>${testLineup}%</b> (${Selectors.chemLabel(testLineup)})</div>
          </div>
          <div class="flex-shrink-0">${UI.smallBtn('hire-coach', `data-id="${id}"`, 'Zatrudnij', !isTemp || gameState.finance.budget < co.sign)}</div>
        </div>
      </div>`;
    }).join('');

    const staffRows = Object.entries(DATA.staffSlots).map(([slot, def]) => {
      const m = gameState.staff[slot];
      const cand = DATA.staffCandidates[slot];
      const canHireExt = !m || m.kind === 'volunteer';
      return `
      <div class="border-b border-dashed border-paper-400 py-3">
        <div class="text-xs uppercase tracking-widest text-ink-700">${def.icon} ${def.label}</div>
        ${m ? `
          <div class="flex justify-between gap-3 items-start mt-1">
            <div>
              <div class="font-bold">${m.kind === 'veteran' ? '🏅 ' : ''}${Utils.escape(m.name)}</div>
              <div class="text-xs text-ink-700">${Utils.escape(m.desc)}</div>
              <div class="text-xs">${m.wage ? Utils.formatMoney(m.wage) + '/tydz.' : 'społecznie'}${m.chem ? ' · chemia +' + m.chem : ''}${m.lockerBase ? ' · atmosfera +' + m.lockerBase : ''}</div>
            </div>
            <div class="flex-shrink-0">${m.kind === 'volunteer' ? '' : UI.smallBtn('fire-staff', `data-slot="${slot}"`, 'Zwolnij', false, 'stamp')}</div>
          </div>` : '<div class="text-sm italic text-ink-700 mt-1">Wakat. Krzesło stoi puste, na nim worek z piłkami.</div>'}
        ${canHireExt ? `
          <div class="flex justify-between gap-3 items-start mt-2 bg-paper-200 p-2">
            <div>
              <div class="text-sm"><b>Kandydat z zewnątrz:</b> ${Utils.escape(cand.name)}</div>
              <div class="text-xs text-ink-700">${Utils.escape(cand.desc)} · ${Utils.formatMoney(cand.wage)}/tydz.${cand.chem ? ' · chemia +' + cand.chem : ''}${cand.lockerBase ? ' · atmosfera +' + cand.lockerBase : ''}</div>
            </div>
            <div class="flex-shrink-0">${UI.smallBtn('hire-staff', `data-slot="${slot}"`, 'Zatrudnij', false)}</div>
          </div>` : ''}
      </div>`;
    }).join('');

    return `
    <h2 class="font-type text-3xl text-amber-glow crt mb-1">📋 Sztab i Trener</h2>
    <p class="text-paper-400 text-sm mb-5">Prezes nie ustawia składu ani taktyki. Prezes zatrudnia, zwalnia i wzywa na dywanik.</p>
    <div class="grid gap-6 xl:grid-cols-2">
      ${coachCard}
      ${UI.card('B', 'Giełda Trenerów', isTemp ? 'Pan Mirek chętnie odda gwizdek. Wybierz następcę.' : 'Żeby zatrudnić nowego, najpierw zwolnij obecnego.', market)}
      ${UI.card('C', 'Sztab Pomocniczy', 'Miejsce dla weteranów po taniości. Zewnętrzni są drodzy – emerytowane Legendy pracują za dychę.', staffRows + `
        <p class="text-xs text-ink-700 mt-3">Koszt sztabu: <b>${Utils.formatMoney(Selectors.staffWages())}/tydz.</b> Gdy Ulubieniec lub Legenda (35+) kończy karierę po sezonie, sam zgłosi się na Biurko.</p>`, 'xl:col-span-2')}
    </div>`;
  },

  /* ---------- ZAKŁADKA: KADRA I SZATNIA ---------- */
  squadTab() {
    const coach = Selectors.coach();
    const lineup = Selectors.projectedLineup();

  /* ---------- ZAKŁADKA: SKAUTING I MŁODZIEŻ ---------- */

            <div class="text-xs uppercase tracking-widest text-ink-700">${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l.</div>

      <div class="text-xs text-ink-700 mb-2">Kadra: <b>${gameState.squad.length}/${CONFIG.maxSquad}</b>${full ? ' – <span class="text-stamp font-bold">pełna! Najpierw komuś podziękuj w Kadrze.</span>' : ''} · Trener gra stylem: <b>${DATA.styles[coach.style].label}</b></div>
      ${cands ? `<div class="grid gap-3 md:grid-cols-2">${cands}</div>` : '<p class="text-sm italic">Notes Szwagra pusty. Ostatnio zapisał tylko numer do pani z loterii fantowej.</p>'}
    `, 'xl:col-span-2');

    const lvl = DATA.youthLevels[Selectors.youthLevel()];
    const ups = Object.entries(DATA.youthUpgrades).map(([id, u]) => {
      const owned = sc.youthUpgrades[id];
      return `
      <div class="border-b border-dashed border-paper-400 py-2 flex justify-between gap-3 items-center">
        <div>
          <div class="font-bold">${owned ? '✅ ' : ''}${Utils.escape(u.label)} <span class="font-normal text-ink-700">– ${Utils.formatMoney(u.cost)}</span></div>

        </div>
        <div class="flex-shrink-0">${owned ? '<span class="text-xs font-bold text-grass">ZROBIONE</span>' : UI.smallBtn('buy-youth', `data-id="${id}"`, 'Kup', budget < u.cost)}</div>
      </div>`;

    const juniors = gameState.squad.filter((p) => p.age <= 19).map((p) =>
      `<li>${p.talent ? '💎 ' : ''}<b>${Utils.escape(Selectors.playerName(p))}</b> – ${p.age} l., ${DATA.positions[p.pos].label.toLowerCase()} · ${Selectors.skillLabel(p.skill)}</li>`).join('');

      <h4 class="font-type mb-1">Inwestycje w szkółkę</h4>
      ${ups}
      <h4 class="font-type mt-4 mb-1">Wyciągnij juniora z Orlika</h4>
      <p class="text-xs text-ink-700 mb-2">Raz na rundę możesz ściągnąć jednego chłopaka do pierwszej drużyny (oprócz 2 juniorów na koniec sezonu).</p>
      ${UI.smallBtn('pull-junior', '', pulled ? 'W tej rundzie już wyciągnięty' : '🌱 Wyciągnij juniora', pulled || full)}
      <h4 class="font-type mt-4 mb-1">Młodzież w kadrze (do 19 lat)</h4>
      ${juniors ? `<ul class="text-sm space-y-1">${juniors}</ul>` : '<p class="text-sm italic">Brak. Sami starzy wyjadacze i kolana na taśmach.</p>'}
    `);

    return `
    <h2 class="font-type text-3xl text-amber-glow crt mb-1">🔭 Skauting i Młodzież</h2>
    <p class="text-paper-400 text-sm mb-5">Prezes nie wybiera składu – ale wybiera, kto w ogóle wejdzie do szatni.</p>
    <div class="grid gap-6 xl:grid-cols-2">
      ${scoutCard}
      ${youthCard}
      ${UI.card('C', 'Notatki Szwagra', 'Złote myśli z objazdów', `
        <ul class="text-sm space-y-2 list-disc pl-5">
          <li>„Profil zawodnika ważniejszy niż ksywa. Jak trener chce tiki-taki, to drwala mu nie wciskaj.”</li>
          <li>„Ja zawsze trochę przesadzam. Ale tylko trochę. Plus minus jedna klasa.”</li>
          <li>„Najlepsi grajkowie są na festynach strażackich. Najgorsi – też.”</li>
          <li>„W szatni jest 22 haczyki. Więcej ludzi nie wejdzie, bo ławka się złamie.”</li>
        </ul>`)}
    </div>`;
  },

  reportCard() {
    const rep = gameState.lastReport;
    const body = !rep
      ? '<p class="text-sm">Jeszcze nic nie rozliczono. Pani Halinka ostrzy ołówek.</p>'
      : `<table class="w-full text-sm">
          ${rep.lines.map((l) => `<tr class="border-b border-dashed border-paper-400"><td class="py-1 pr-2">${Utils.escape(l.label)}</td><td class="py-1 text-right font-bold ${l.amount < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(l.amount)}</td></tr>`).join('')}
          <tr><td class="pt-2 font-type text-lg">RAZEM</td><td class="pt-2 text-right font-type text-lg ${rep.total < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(rep.total)}</td></tr>
        </table>`;
    return UI.card('§', 'Bilans ostatniego tygodnia' + (rep ? ' (Tydzień ' + rep.week + ')' : ''), 'Wszystko, co wpłynęło i wypłynęło z kasetki.', body);

  ticketsCard() {
    const md = gameState.matchday;
    const ticketBtns = Object.entries(DATA.tickets).map(([id, t]) => UI.choice('set-ticket', id, md.ticket === id, t.label, t.desc)).join('');
    const sausageBtns = Object.entries(DATA.sausages).map(([id, s]) =>
      UI.choice('set-sausage', id, md.sausage === id, s.label + ' – ' + s.price + ' zł', s.desc + ' Zysk: ' + (s.price - s.cost) + ' zł/szt.')).join('');

    const next = Selectors.nextHomeFixture();
    const st = gameState.seasonTickets;
    let preview = '<p class="text-sm">W tym sezonie u siebie już nie gramy.</p>';
    if (next) {
      const est = Engine.estimateAttendance(next.fixture);
      const holders = st.roundsLeft > 0 ? Math.min(st.holders, est) : 0;
      preview = `<p class="text-sm">Najbliższy mecz u siebie: <b>Kolejka ${next.kolejka} vs ${Utils.escape(next.fixture.rival)}</b>${Selectors.rival(next.fixture.rival).derby ? ' <span class="text-stamp font-bold">🔥 KOSA – podwójne zainteresowanie!</span>' : ''}.<br>
        Szacowana frekwencja przy obecnej pogodzie: <b>~${est}</b> widzów${holders ? `, w tym ${holders} karnetowiczów (nie płacą na bramce)` : ''}.</p>`;
    }
    const ticketsInfo = st.roundsLeft > 0
      ? `Karnety: ${st.holders} posiadaczy, ważne jeszcze ${st.roundsLeft} kolejek.`
      : 'Karnety: brak aktywnych.';

    return UI.card('A', 'Bilety i Budka z Kiełbaskami', 'Catering u Pana Zenka. Kasa fiskalna: zeszyt w kratkę.', `
      <div class="bg-paper-200 border border-paper-400 p-3 mb-4">${preview}<p class="text-xs text-ink-700 mt-1">${ticketsInfo}</p></div>
      <h4 class="font-type mb-2">Cena biletu</h4>
      <div class="grid gap-2 mb-5">${ticketBtns}</div>
      <h4 class="font-type mb-2">Menu w budce Pana Zenka</h4>
      <div class="grid gap-2">${sausageBtns}</div>
      <p class="text-xs text-ink-700 mt-3">☀️ W słońcu grill sprzedaje o 30% więcej, w ulewie Zenek siedzi pod parasolem i liczy straty. Ofensywny trener przyciąga ~10% więcej widzów, defensywny ~10% mniej.</p>
    `);
  },

  merchCard() {
    const m = gameState.merch;
    const favorites = gameState.squad.filter((p) => p.favorite).length;
    const rows = Object.entries(DATA.merch).map(([id, item]) => {
      const cost = item.batch * item.unitCost;
      return `
      <tr class="border-b border-dashed border-paper-400">

      <h4 class="font-type mb-2">Narzut</h4>
      <div class="grid gap-2">${markupBtns}</div>
    `);
  },

      const burned = s.burned.includes(id);
      return `
      <div class="border-b border-dashed border-paper-400 py-3 ${burned ? 'opacity-50' : ''}">
        <div class="flex justify-between gap-3 items-start">
          <div>
            <div class="font-type text-lg">${Utils.escape(sp.name)}</div>
            <div class="text-sm"><b>${Utils.formatMoney(sp.weekly)}/tydz.</b> · ${sp.clubPrefix ? 'Dopisek do nazwy: „' + Utils.escape(sp.clubPrefix) + '”' : 'Stadion: ' + Utils.escape(sp.stadiumName)}${Engine.describeEffects(sp.signEffects)}</div>
            <div class="text-xs text-ink-700">${Utils.escape(sp.pitch)}</div>
            <div class="text-xs text-stamp">${Utils.escape(sp.requirement)}</div>
          </div>
          <div class="flex-shrink-0">${burned ? '<span class="stamp inline-block px-2 text-xs font-type">SPALONY</span>' : UI.smallBtn('sign-sponsor', `data-id="${id}"`, 'Podpisz', !!s.active)}</div>
        </div>
      </div>`;
    }).join('');
    return UI.card('C', 'Sponsor Tytularny', 'Lokalny biznes chętny, by jego logo oglądało 80 osób i dwie krowy. Jeden naraz.', `
      ${body}
      ${offers}
      <p class="text-xs text-ink-700 mt-3">Skandale w kartotece klubu: <b>${gameState.club.scandals}</b>. Kto raz zerwie umowę, ten nie wraca.</p>
    `);
  },

  loansCard() {
    const L = gameState.loans;
    const takenRows = Object.entries(DATA.lenders).map(([id, l]) => {
      const active = L.taken.find((x) => x.id === id);
      return `
      <div class="border-b border-dashed border-paper-400 py-2 flex justify-between gap-3 items-center">
        <div>
          <div class="font-bold">${Utils.escape(l.name)}</div>
          <div class="text-xs text-ink-700">${Utils.formatMoney(l.amount)} → ${l.installments} rat × ${Utils.formatMoney(l.rate)} (oddajesz ${Utils.formatMoney(l.installments * l.rate)}). ${Utils.escape(l.note)}</div>
          ${active ? `<div class="text-xs text-stamp font-bold">Spłacasz: zostało ${active.remaining} rat (${Utils.formatMoney(active.remaining * active.rate)})</div>` : ''}
        </div>
        <div class="flex-shrink-0">${UI.smallBtn('take-loan', `data-id="${id}"`, 'Pożycz', !!active)}</div>
      </div>`;
    }).join('');
    const givenRows = Object.entries(DATA.borrowers).map(([id, b]) => {
      const active = L.given.find((x) => x.id === id);
      return `
      <div class="border-b border-dashed border-paper-400 py-2 flex justify-between gap-3 items-center">
        <div>
          <div class="font-bold">${Utils.escape(b.name)}</div>
          <div class="text-xs text-ink-700">Chce ${Utils.formatMoney(b.amount)}, odda ${Utils.formatMoney(b.returns)} za ${b.weeks} tyg. ${Utils.escape(b.plea)}</div>
          ${active ? `<div class="text-xs text-grass font-bold">Pożyczone! Termin zwrotu: Tydzień ${active.dueWeek}${active.delays ? ' (przesunięty ' + active.delays + '×)' : ''}</div>` : ''}
        </div>
        <div class="flex-shrink-0">${UI.smallBtn('lend-money', `data-id="${id}"`, 'Daj', !!active || gameState.finance.budget < b.amount)}</div>
      </div>`;
    }).join('');
    return UI.card('D', 'Pożyczki Międzyklubowe', 'Chwilówki u prezesów. Umowa ustna, świadek: barman.', `
      <h4 class="font-type mb-1">Pożycz od innego prezesa</h4>
      ${takenRows}
      <h4 class="font-type mt-4 mb-1">Pożycz komuś nasze nadwyżki</h4>
      ${givenRows}
      <p class="text-xs text-ink-700 mt-3">Raty schodzą automatycznie co tydzień. Dłużnicy czasem „zapominają”…</p>
    `);
  },

  stadiumCard() {
    const st = gameState.stadium;
    const pitchColor = st.pitch >= 60 ? 'bg-grass' : st.pitch >= 30 ? 'bg-amber-glow' : 'bg-stamp';
    const upgrades = Object.entries(DATA.upgrades).map(([id, u]) => {
      const owned = st.upgrades[id];
      return `
      <div class="border-b border-dashed border-paper-400 py-2 flex justify-between gap-3 items-center">
        <div>
          <div class="font-bold">${owned ? '✅ ' : ''}${Utils.escape(u.label)} <span class="font-normal text-ink-700">– ${Utils.formatMoney(u.cost)}</span></div>
          <div class="text-xs text-ink-700">${Utils.escape(u.desc)}</div>
        </div>
        <div class="flex-shrink-0">${owned ? '<span class="text-xs font-bold text-grass">ZROBIONE</span>' : UI.smallBtn('buy-upgrade', `data-id="${id}"`, 'Kup', gameState.finance.budget < u.cost)}</div>
      </div>`;
    }).join('');
    return UI.card('E', 'Infrastruktura: ' + Utils.escape(Selectors.stadiumName()), 'Obiekt z duszą. I z kretami.', `
      <div class="mb-3">
        <div class="flex justify-between text-sm"><span>Stan murawy: <b>${Selectors.pitchLabel(st.pitch)}</b></span><span>${st.pitch}%</span></div>
        ${UI.bar(st.pitch, pitchColor)}
        <p class="text-xs text-ink-700 mt-1">Każdy mecz u siebie niszczy murawę (w deszczu mocno). Zła murawa = loteria wyników i mniej widzów.</p>
      </div>
      <ul class="text-sm list-disc pl-5 mb-4">${Selectors.facilityLabels().map((f) => `<li>${Utils.escape(f)}</li>`).join('')}</ul>
      <h4 class="font-type mb-1">Inwestycje</h4>
      ${upgrades}
    `, 'xl:col-span-2');
  },
};

/* ---------------------------------------------------------------------
   6. OBSŁUGA ZDARZEŃ – delegacja po data-action
   --------------------------------------------------------------------- */
const App = {
  // Po każdej akcji: zapis + odświeżenie widoku.
  commit() {
    Storage.save();
    UI.renderAll();
  },
};

const Actions = {
  'pick-club'(el) {
    const input = document.getElementById('club-name');
    if (input) { input.value = el.dataset.name; input.focus(); }
  },

  'start-game'() {
    const input = document.getElementById('club-name');
    const name = (input ? input.value : '').trim();
    if (!name) {
      gameState.ui.startError = 'Klub bez nazwy to jak bramka bez siatki. Wpisz coś, Prezesie!';
      const err = document.getElementById('start-error');
      if (err) err.textContent = gameState.ui.startError;
      if (input) { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); }
      return;
    }
    const existing = Storage.load();
    if (existing && existing.club.name && !confirm('W szufladzie jest zapis klubu ' + existing.club.name + '. Nowa prezesura go nadpisze. Kontynuować?')) return;
    Engine.startGame(name);
    App.commit();
    window.scrollTo(0, 0);
  },

  'load-game'() {
    const saved = Storage.load();
    if (!saved) return;
    gameState = saved;
    gameState.screen = 'game';
    App.commit();
    window.scrollTo(0, 0);
  },

  'clear-save'() {
    if (confirm('Spalić teczkę z zapisem? Tego nie da się cofnąć.')) {
      Storage.clear();
      UI.renderAll();
    }
  },

  'exit-menu'() {
    Storage.save();
    gameState = createInitialState();
    UI.renderAll();
  },

  'switch-tab'(el) {
    gameState.activeTab = el.dataset.tab;
    App.commit();
  },

  'resolve-decision'(el) {
    Engine.resolveDecision(el.dataset.decision, Number(el.dataset.option));
    App.commit();
  },

  'next-week'() {
    if (Engine.nextWeek()) {
      gameState.activeTab = 'desk';
      App.commit();
      window.scrollTo(0, 0);
    }
  },

  'set-ticket'(el)   { if (DATA.tickets[el.dataset.value]) gameState.matchday.ticket = el.dataset.value; App.commit(); },
  'set-sausage'(el)  { if (DATA.sausages[el.dataset.value]) gameState.matchday.sausage = el.dataset.value; App.commit(); },
  'set-markup'(el)   { if (DATA.merchMarkups[el.dataset.value]) gameState.merch.markup = el.dataset.value; App.commit(); },
  'order-merch'(el)  { Engine.orderMerch(el.dataset.item); App.commit(); },
  'sign-sponsor'(el) { Engine.signSponsor(el.dataset.id); App.commit(); },
  'end-sponsor'() {
    const sp = Selectors.sponsor();
    if (sp && confirm('Wypowiedzieć umowę z: ' + sp.name + '? Ten sponsor już nie wróci.')) {
      Engine.endSponsor('📝 Prezes wypowiedział umowę sponsorską z: ' + sp.name + '. Trzasnęły drzwi.');
      App.commit();
    }
  },
  'take-loan'(el)    { Engine.takeLoan(el.dataset.id); App.commit(); },
  'lend-money'(el)   { Engine.lendMoney(el.dataset.id); App.commit(); },
  'buy-upgrade'(el)  { Engine.buyUpgrade(el.dataset.id); App.commit(); },

  'hire-coach'(el)   { Engine.hireCoach(el.dataset.id); App.commit(); },
  'fire-coach'(el) {
    const coach = Selectors.coach();
    const cold = el.dataset.mode === 'cold';
    if (confirm('Zwolnić trenera ' + coach.name + (cold ? ' BEZ odprawy? Szatnia się obrazi.' : ' z odprawą ' + Utils.formatMoney(Engine.severance()) + '?'))) {
      Engine.fireCoach(!cold);
      App.commit();
    }
  },
  'carpet-coach'()   { Engine.carpetCoach(); App.commit(); },
  'hire-staff'(el)   { Engine.hireStaff(el.dataset.slot); App.commit(); },
  'fire-staff'(el) {
    const m = gameState.staff[el.dataset.slot];
    if (m && confirm('Zwolnić ze sztabu: ' + m.name + '?')) { Engine.fireStaff(el.dataset.slot); App.commit(); }
  },
  'release-player'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (!p) return;
    const warn = p.legend ? ' To LEGENDA KLUBU – kibice i szatnia tego nie wybaczą!' : p.favorite ? ' To Ulubieniec Trybun – kibice się wściekną!' : '';
    if (confirm('Podziękować za grę: ' + Selectors.playerName(p) + '?' + warn)) {
      Engine.releasePlayer(p.id);
      App.commit();
    }
  },

  'send-scout'()       { Engine.sendScout(); App.commit(); },
  'sign-candidate'(el) { Engine.signCandidate(el.dataset.id); App.commit(); },
  'buy-youth'(el)      { Engine.buyYouthUpgrade(el.dataset.id); App.commit(); },
  'pull-junior'()      { Engine.pullJunior(); App.commit(); },
  'x-post'(el)         { Engine.officialPost(el.dataset.tone); App.commit(); },

  'reset-game'() {
    if (confirm('Na pewno rzucasz papierami? Zapis zostanie skasowany, a klub zostanie bez prezesa (znowu).')) {
      Storage.clear();
      gameState = createInitialState();
      UI.renderAll();
    }
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = Actions[el.dataset.action];
  if (handler) handler(el, e);
});

window.addEventListener('resize', () => UI.fitActionBar());

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'club-name') Actions['start-game']();
});

/* START */
UI.renderAll();
</script>
</body>
</html>
