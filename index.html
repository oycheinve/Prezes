    const req = c.kind === 'fans' ? 'Zrywa, gdy Zadowolenie Kibiców spadnie poniżej ' + c.threshold + '%.'
      : c.kind === 'losses' ? 'Zrywa po ' + c.threshold + ' porażkach z rzędu.'
      : 'Zrywa po ' + c.threshold + (c.threshold === 1 ? ' skandalu' : ' skandalach') + ' w trakcie umowy.';
    return {
      ...c, signEffects: {}, requirement: req,
      breaks: (s) => (c.kind === 'fans' ? s.morale.fans < c.threshold : c.kind === 'losses' ? s.record.lossStreak >= c.threshold : s.club.scandals - s.sponsor.scandalsAtSign >= c.threshold),
      breakLog: '„' + c.name + '” zrywa umowę: „Nie tak się umawialiśmy, Prezesie”.',
    };
  },

  // Rynek sponsorów: spaleni znikają po 8 tygodniach, a wolne miejsca zajmują nowi – warunki zależą od atrakcyjności klubu
  refreshSponsors(force = false) {
    const s = gameState.sponsor;
    const week = gameState.calendar.week;
    Object.keys(s.custom).forEach((id) => { if (s.custom[id].expires && week >= s.custom[id].expires && s.active !== id) delete s.custom[id]; });
    const available = Selectors.sponsorOffers().filter((id) => !s.burned.includes(id) && id !== s.active && id !== 'local');
    if (!force && available.length >= 2) return;
    const used = Object.values(s.custom).map((c) => c.name).concat(Object.values(DATA.sponsors).map((x) => x.name));
    const pool = DATA.sponsorPool.filter((t) => !used.includes(t.name));
    const promo = Selectors.promo();
    for (let i = available.length; i < 3 && pool.length; i++) {
      const t = pool.splice(Utils.randInt(0, pool.length - 1), 1)[0];
      s.gen = (s.gen || 0) + 1;
      const id = 'g' + s.gen;
      s.custom[id] = { id, name: t.name, kind: t.kind, threshold: t.threshold, stadiumName: t.stadiumName, clubPrefix: t.clubPrefix, pitch: t.pitch,
        weekly: Math.round(t.base * (0.55 + promo / 90)), expires: week + 26 };
      Engine.addLog('📨 Nowa oferta sponsorska: „' + t.name + '”.', 'finance');
    }
  },

  // W klubie zawsze jest przynajmniej jeden sponsor – w razie potrzeby lokalny, symboliczny
  ensureSponsor() {
    const s = gameState.sponsor;
    if (s.active) return;
    s.active = 'local';
    s.signedWeek = gameState.calendar.week;
    s.scandalsAtSign = gameState.club.scandals;
    Engine.addLog('🛒 Pani Grażynka ze sklepu „U Grażynki” zostaje sponsorem klubu: „Bez umowy, ale coś zawsze dorzucę”.', 'finance');
  },

  signSponsor(id) {
    const sp = Selectors.sponsorDef(id);
    const s = gameState.sponsor;
    if (!sp || sp.fallback || Selectors.hasRealSponsor() || s.burned.includes(id)) return;
    if (s.active === 'local') Engine.addLog('🛒 Pani Grażynka ustępuje miejsca większemu sponsorowi. „Jakby co – jestem w sklepie.”', 'finance');
    s.active = id;
    s.signedWeek = gameState.calendar.week;
    s.scandalsAtSign = gameState.club.scandals;
    Engine.applyEffects(sp.signEffects);
    Engine.addLog('🤝 Podpisano umowę sponsorską z: ' + sp.name + ' (' + Utils.formatMoney(Selectors.sponsorWeekly(sp)) + '/tydz.).' + Engine.describeEffects(sp.signEffects), 'finance');
  },

  endSponsor(logText) {
    const s = gameState.sponsor;
    if (!Selectors.hasRealSponsor()) return;   // lokalnego sponsora nie da się zerwać
    const lost = Selectors.sponsor();
    Engine.crisis('sponsor', '🚨', 'SPONSOR ZERWAŁ UMOWĘ!', lost.name + ' odchodzi – klub traci kluczowe źródło finansowania (' + Utils.formatMoney(Selectors.sponsorWeekly(lost)) + '/tydz.). ' + (logText || '').replace(/^\S+\s/, ''));
    s.burned.push(s.active);
    s.burnedAt[s.active] = gameState.calendar.week;
    s.active = null;
    s.strikes = 0;   // nowy sponsor zaczyna z czystą kartą
    Engine.addLog(logText, 'event');
    Engine.ensureSponsor();
  },

  /* ----- Pożyczki ----- */
  // Gospodarka innych klubów: kasa i obrót tworzone przy pierwszym użyciu
  clubEco(name) {
    if (!gameState.economy) gameState.economy = {};
    let ec = gameState.economy[name];
    if (!ec) {
      const str = (gameState.season.strength && gameState.season.strength[name]) || Selectors.rival(name).strength || 1.3;
      const e = Selectors.econ();
      ec = gameState.economy[name] = { cash: Math.round(Utils.randRange(1200, 3500) * e * (str / 1.3)), income: Math.round((220 + str * 120) * e), loan: null, crisis: false };
    }
    return ec;
  },

  // Co tydzień: wyniki i obroty zmieniają kasę rywali; w dołku biorą pożyczki, bogaci inwestują w skład, zadłużeni słabną
  leagueEconomyTick() {
    const e = Selectors.econ();
    const s = gameState.season;
    gameState.league.rivals.forEach((r) => {
      const ec = Engine.clubEco(r.name);
      const res = (s.lastResults || []).find((m) => m.home === r.name || m.away === r.name);
      let delta = Math.round(ec.income * Utils.randRange(-0.3, 0.3));
      if (res && Selectors.isMatchWeek()) {
        const gf = res.home === r.name ? res.hg : res.ag, ga = res.home === r.name ? res.ag : res.hg;
        delta += gf > ga ? Math.round(60 * e) : gf < ga ? -Math.round(60 * e) : 0;
        // miejsce w tabeli: czołówka przyciąga kibiców i sponsorów, dół traci
        const pos = Selectors.standings().findIndex((x) => x.team === r.name) + 1;
        const n = Selectors.leagueSize();
        if (pos) delta += Math.round(((n + 1) / 2 - pos) * 12 * e * 10 / n);
      }
      if (Math.random() < 0.03) {   // nieprzewidziany wydatek: kara, remont, zaległy ZUS
        const hit = Math.round(Utils.randInt(600, 2000) * e);
        delta -= hit;
        if (Math.random() < 0.4) Engine.xPost('portal', r.name + ': ' + Utils.rand(['kara Związku', 'zalany blaszak', 'zaległy ZUS', 'spalony bus']) + ' kosztuje klub ' + Utils.formatMoney(hit) + '. 😬');
      }
      delta -= Math.round(ec.cash * 0.04);   // bogaci wydają więcej, zadłużeni tną koszty
      ec.cash += delta;
      if (ec.loan) Engine.rivalInstallment(r.name, ec);
      const credit = Selectors.clubCredit(r.name);
      if (!ec.loan && ec.cash < 200 * e && credit >= 0.1 && !((ec.blockedUntil || 0) > gameState.calendar.week)) {
        const amount = Math.round(1500 * e * Utils.clamp(credit, 0.25, 2.5) / 50) * 50;
        ec.loan = { amount, remaining: 10, rate: Math.ceil(amount * (1.2 + Math.max(0, 1 - credit) * 0.15) / 10 / 5) * 5 };
        ec.cash += amount;
        if (Math.random() < 0.5) Engine.xPost('portal', r.name + ' ratuje się pożyczką ' + Utils.formatMoney(amount) + '. Prezes zapewnia, że „to tylko chwilowo”. 💸');
      }
      const str = s.strength[r.name] || r.strength;
      if (ec.cash > 3500 * e && Math.random() < 0.1) {
        ec.cash -= Math.round(1500 * e);
        s.strength[r.name] = Math.min(r.strength + 0.35, str + 0.04);
        Engine.xPost('portal', r.name + ' sypie groszem: nowi zawodnicy i nowe stroje. Rywale mają się czego bać. 💰');
      }
      const crisis = ec.cash < -1500 * e;
      if (crisis) s.strength[r.name] = Math.max(0.8, str - 0.01);
      else if (ec.cash > 0 && str < r.strength) s.strength[r.name] = Math.min(r.strength, str + 0.005);   // po wyjściu z długów klub wraca do formy
      if (crisis && !ec.crisis) Engine.xPost('portal', 'Kryzys w ' + r.name + '! Zawodnicy bez wypłat, prezes nie odbiera telefonu. 📉');
      ec.crisis = crisis;
    });
  },

  // Rata pożyczki klubu z ligi: płaci, spóźnia się albo – po 3 zaległych ratach – ogłasza niewypłacalność
  rivalInstallment(name, ec) {
    const loan = ec.loan;
    const e = Selectors.econ();
    const canPay = ec.cash >= loan.rate || (ec.cash > -800 * e && Math.random() < 0.75) || Math.random() < 0.15;   // mały debet zwykle jeszcze się udźwignie
    if (canPay) {
      ec.cash -= loan.rate;
      if (loan.missed >= 2) Engine.debtEvent(name, 'caught', '✅', name + ' nadrabia zaległości', 'Klub zapłacił zaległą ratę. Banki wracają do rozmów, wiarygodność rośnie.', 'good');
      loan.missed = 0;
      if (--loan.remaining <= 0) {
        ec.loan = null;
        ec.paidOff = (ec.paidOff || 0) + 1;
        ec.trust = Math.min(1, (ec.trust || 0) + 0.2);
        Engine.debtEvent(name, 'paid', '💰', name + ' spłaca dług', 'Ostatnia rata pożyczki ' + Utils.formatMoney(loan.amount) + ' zapłacona. Wiarygodność klubu w lidze w górę – łatwiej o kolejne pożyczki i transfery.', 'good');
      }
      return;
    }
    loan.missed = (loan.missed || 0) + 1;
    loan.rate = Math.ceil(loan.rate * 1.05 / 5) * 5;         // odsetki karne
    ec.trust = Math.max(-1, (ec.trust || 0) - 0.1);
    if (loan.missed === 1) Engine.debtEvent(name, 'late', '⚠️', name + ' nie płaci raty', 'Pierwsza zaległa rata (' + Utils.formatMoney(loan.rate) + '). Odsetki karne, bank dzwoni do prezesa. Wiarygodność w dół.', 'warn');
    if (loan.missed >= 3) {
      // upadłość tylko przy naprawdę pustej kasie – inaczej bank rozkłada dług na dłużej
      if (ec.cash < -2000 * e) Engine.clubDefault(name, ec);
      else {
        loan.missed = 0;
        loan.remaining += 3;
        Engine.debtEvent(name, 'restructure', '🏦', name + ' restrukturyzuje dług', 'Bank rozłożył zaległości na 3 dodatkowe raty. Klub uniknął upadłości, ale wiarygodność mocno w dół.', 'warn');
      }
    }
  },
  clubDefault(name, ec) {
    const e = Selectors.econ();
    const lost = ec.loan ? ec.loan.remaining * ec.loan.rate : 0;
    ec.loan = null;
    ec.defaults = (ec.defaults || 0) + 1;
    ec.trust = -1;
    ec.blockedUntil = gameState.calendar.week + 20;           // nikt im nie pożyczy przez 20 tygodni
    const s = gameState.season;
    s.strength[name] = Math.max(0.8, (s.strength[name] || Selectors.rival(name).strength) - 0.2);   // zawodnicy bez wypłat odchodzą
    if (!gameState.league.fireSale.includes(name)) gameState.league.fireSale.push(name);
    if (gameState.transfer.open) Engine.addFireSale(name);
    Engine.debtEvent(name, 'default', '🚨', name + ' NIEWYPŁACALNY!', 'Bank umarza ' + Utils.formatMoney(lost) + ' i wpisuje klub na czarną listę.', 'bad');
  },
  // Skaut transferowy: lepsi zawodnicy w okazyjnych cenach (klub sprzedającego ma kłopoty, kontrakt się kończy…)
  scoutBargains() {
    const l = Selectors.staffLevel('skaut');
    const t = gameState.transfer;
    if (!l || !t.open) return;
    const bonus = Selectors.levelSkillBonus(), e = Selectors.econ();
    const found = [];
    for (let i = 0; i < Selectors.scoutBargainCount(); i++) {
      const lift = Math.floor(l / 2);
      const p = Engine.makePlayer({ ageMin: 18, ageMax: 29, skillMin: 5 + bonus + lift, skillMax: 8 + bonus + lift, pos: Utils.rand(['DEF', 'MID', 'FWD', 'MID']) });
      if (p.age <= 21 && Math.random() < l * 0.08) Engine.markTalent(p);
      p.wage = Math.max(5, Math.round((p.skill * 6 - 8) * e / 5) * 5);
      const discount = 0.3 + l * 0.04 + Utils.randRange(-0.05, 0.05);
      p.fee = Math.max(20, Math.round((50 + p.skill * 28) * e * (1 - discount) / 10) * 10);
      p.bargain = Math.round(discount * 100);
      t.market.unshift(Engine.fakeHistory(p, Engine.otherClubName(0)));
      found.push(Selectors.playerName(p) + ' (OVR ' + Selectors.ovr(p) + ')');
    }
    if (found.length) t.news = ['🔭 Skaut wynalazł okazje: ' + found.join(', ')].concat(t.news || []).slice(0, 4);
  },
  // Zawodnicy klubu w upadłości trafiają na giełdę taniej
  addFireSale(name) {
    const t = gameState.transfer;
    if (!t.open || t.market.some((p) => p.fromClub === name && p.fireSale) || t.market.filter((p) => p.fireSale).length >= 4) return;
    const bonus = Selectors.levelSkillBonus(), e = Selectors.econ();
    for (let i = 0; i < 2; i++) {
      const p = Engine.makePlayer({ ageMin: 20, ageMax: 30, skillMin: 5 + bonus, skillMax: 8 + bonus, pos: Utils.rand(['DEF', 'MID', 'FWD']) });
      p.wage = Math.max(5, Math.round((p.skill * 6 - 8) * e / 5) * 5);
      p.fee = Math.max(20, Math.round((50 + p.skill * 28) * e * 0.55 / 10) * 10);   // 45% taniej – klub musi sprzedać
      p.fireSale = true;
      t.market.push(Engine.fakeHistory(p, name));
    }
  },
  debtEvent(club, kind, icon, title, text, tone) {
    // Długi innych klubów nie generują powiadomień – widać je tylko w Tabela → Kasa
    gameState.debtNews.push({ club, kind, week: gameState.calendar.week, text: icon + ' ' + title });
    return;
    // ostrzeżenia o tym samym klubie najwyżej raz na 12 tygodni – ważne wieści (spłata, upadłość) zawsze
    const ec = Engine.clubEco(club);
    if (tone === 'warn') {
      if (gameState.calendar.week - (ec.warnWeek || -99) < 12 || gameState.calendar.week - (gameState.ui.warnWeek || -99) < 4) return;
      ec.warnWeek = gameState.ui.warnWeek = gameState.calendar.week;
    }
    Engine.alert(icon, title, text, tone);
  },
  // Powiadomienie na ekranie (znika po tygodniu albo po kliknięciu)
  alert(icon, title, text, tone = 'info', top = false) {
    gameState.ui.alertSeq = (gameState.ui.alertSeq || 0) + 1;
    // Złe wieści z tego samego tygodnia trafiają do otwartego komunikatu kryzysowego zamiast do rogu ekranu
    const open = tone === 'bad' && (gameState.crisisQueue || []).find((c) => c.week === gameState.calendar.week);
    if (open) { const l = title + ': ' + text; if (!open.lines.includes(l)) open.lines = open.lines.concat([l]).slice(-5); Engine.addLog(icon + ' ' + title + ' – ' + text, 'finance'); return; }
    gameState.alerts.unshift({ id: gameState.ui.alertSeq, week: gameState.calendar.week, icon, title, text, tone, top });   // top = widoczne także nad giełdą i scenkami
    gameState.alerts = gameState.alerts.slice(0, 4);
    Engine.addLog(icon + ' ' + title + ' – ' + text, 'finance');
  },

  takeLoan(id) {
    const l = DATA.lenders[id];
    const o = Selectors.loanOffer(id);
    if (!l || !o.available) return;
    if (l.club) Engine.clubEco(l.club).cash -= o.amount;   // prezes pożycza z kasy swojego klubu
    gameState.loans.taken.push({ id, remaining: o.installments, rate: o.rate, amount: o.amount });
    Engine.money('Pożyczka: ' + l.name, o.amount);
    Engine.addLog('💸 ' + l.name + ' pożyczył ' + Utils.formatMoney(o.amount) + '. Spłata: ' + o.installments + ' rat po ' + Utils.formatMoney(o.rate) + '. ' + l.note, 'finance');
    if (o.crisis) Engine.alert('🌀', 'Pożyczka ratunkowa', 'Dziura załatana na chwilę, ale raty ' + Utils.formatMoney(o.rate) + '/tydz. przez ' + o.installments + ' tyg. Nieopłacona rata = odsetki karne. Uważaj na spiralę długu!', 'warn');
  },

  budkaUpgrade() {
    const b = gameState.budka;
    const next = DATA.budka.levels[(b.level || 1) + 1];
    if (!next) return;
    const cost = Math.round(next.cost * Selectors.econ() / 10) * 10;
    if (gameState.finance.budget < cost || Selectors.buildOf('budka', 'budka') || !Selectors.buildFree()) return;
    Engine.money('Rozbudowa budki: ' + next.name, -cost);
    Engine.startBuild('budka', 'budka', Selectors.budkaWeeks((b.level || 1) + 1), next.name);   // 13.87: rozbudowa budki też trwa
  },
  budkaSetPrice(id, delta) {
    const it = DATA.budka.items[id];
    if (!it || !Selectors.budkaMenu().includes(id)) return;
    gameState.budka.prices[id] = Utils.clamp(Selectors.budkaPrice(id) + delta, 1, it.base * 3);
  },

  /* ----- Infrastruktura ----- */
  buildStadium() {
    const st = gameState.stadium;
    const next = DATA.stadiumLevels[(st.level || 0) + 1];
    const cost = next && Selectors.stadiumCost((st.level || 0) + 1);
    if (!next || gameState.finance.budget < cost || Selectors.buildOf('stadium', 'stadium') || !Selectors.buildFree()) return;
    Engine.money('Rozbudowa stadionu: ' + next.name, -cost);
    Engine.startBuild('stadium', 'stadium', Selectors.stadiumWeeks((st.level || 0) + 1), next.name);
  },

  upgradeFacility(id) {
    const st = gameState.stadium;
    if (!st.tiers) st.tiers = {};
    const next = (DATA.upgradeTiers[id] || [])[Selectors.upgradeTier(id)];
    const cost = next && Selectors.tierCost(next);
    if (!st.upgrades[id] || !next || gameState.club.leagueLevel < next.minLevel || gameState.finance.budget < cost || Selectors.buildOf('tier', id) || !Selectors.buildFree()) return;
    Engine.money('Modernizacja: ' + next.label, -cost);
    Engine.startBuild('tier', id, Selectors.tierWeeks(next), next.label);
  },

  buyUpgrade(id) {
    const u = DATA.upgrades[id];
    const cost = Selectors.upgradeCost(id);
    if (!u || gameState.stadium.upgrades[id] || gameState.finance.budget < cost || Selectors.buildOf('up', id) || !Selectors.buildFree()) return;
    const label = Selectors.upgradeLabel(id, Selectors.band());
    Engine.money('Inwestycja: ' + label, -cost);
    if (!gameState.stadium.upgradeBand) gameState.stadium.upgradeBand = {};
    gameState.stadium.upgradeBand[id] = Selectors.band();   // obiekt zapamiętuje, w jakich realiach go zbudowano
    Engine.startBuild('up', id, Selectors.upgradeWeeks(id), label);
  },

  // 13.84: budowa trwa – pieniądze od razu, efekt po oddaniu obiektu
  startBuild(kind, id, weeks, label) {
    const st = gameState.stadium;
    if (!st.builds) st.builds = [];
    st.builds.push({ kind, id, ready: gameState.calendar.week + weeks, label });
    Engine.addLog('🏗️ Ruszyła budowa: ' + label + ' – potrwa ' + weeks + ' tyg. Ekipa pana Józka już kopie fundamenty.', 'finance');
  },
  finishBuild(b) {
    const st = gameState.stadium;
    if (b.kind === 'up') {
      st.upgrades[b.id] = true;
      if (b.id === 'roller') st.pitch = Utils.clamp(st.pitch + 30, 0, 100);
      if (b.id === 'boiler') Engine.applyEffects({ lockerRoom: +8 });
    } else if (b.kind === 'tier') {
      if (!st.tiers) st.tiers = {};
      const next = (DATA.upgradeTiers[b.id] || [])[Selectors.upgradeTier(b.id)];
      st.tiers[b.id] = Selectors.upgradeTier(b.id) + 1;
      if (next && next.lockerBase) Engine.applyEffects({ lockerRoom: +3 });
    } else if (b.kind === 'stadium') {
      st.level = (st.level || 0) + 1;
      Engine.applyEffects({ fans: +4 });
    } else if (b.kind === 'budka') {
      const bd = gameState.budka; bd.level = (bd.level || 1) + 1;
      const L = DATA.budka.levels[bd.level];
      Engine.applyEffects({ fans: +2 });
      if (L) Engine.addLog('🏪 W menu budki nowe pozycje: ' + L.items.map((id) => DATA.budka.items[id].label).join(', ') + '. [kibice +2%]', 'finance');
    } else if (b.kind === 'shop') {
      const m = gameState.merch; m.level = (m.level || 1) + 1;
      const L = DATA.shopLevels[m.level];
      Engine.applyEffects({ fans: +2 });
      if (L) Engine.addLog('🛍️ Nowy asortyment w sklepie: ' + L.items.map((id) => DATA.merch[id].label).join(', ') + '. [kibice +2%]', 'finance');
    }
    Engine.addLog('✂️ Oddano do użytku: ' + b.label + '. Wójt przeciął wstęgę nożyczkami z sekretariatu.' + (b.kind === 'stadium' ? ' [kibice +4%]' : ''), 'finance');
    Engine.alert('🏗️', 'Budowa zakończona', b.label + ' – oddane do użytku.', 'good');
  },

  // Hooki wykonywane po kliknięciu [NASTĘPNY TYDZIEŃ], po kolei.
  // Rozliczają bieżący tydzień, a na końcu przesuwają kalendarz.
  weeklyHooks: [
    function openReport() {
      gameState.alerts = [];   // nowy tydzień = czysty ekran (stare powiadomienia znikają)
      gameState.report = { week: gameState.calendar.week, lines: [], homeMatch: false, result: null };
    },
    function rollFlavor() {
      const entry = Utils.rand(DATA.weeklyFlavor);
      Engine.applyEffects(entry.effects, 'Zdarzenia losowe');
      Engine.addLog(entry.text + Engine.describeEffects(entry.effects), entry.effects ? 'event' : 'flavor');
    },
    function matchday() {
      if (Selectors.isMatchWeek()) Engine.playMatchday();
    },
    function mediaStrategyTick() {
      // Pasywny wpływ strategii medialnej (bez cotygodniowego postowania)
      const id = Selectors.mediaStrategy();
      const w = gameState.calendar.week;
      if (w % 2 === 0) Engine.mediaPost();
      if (id === 'neutral' && w % 4 === 0 && gameState.club.professionalism < 40) Engine.shiftDNA(+1);
      if (id === 'spicy') {
        if (w % 4 === 0) Engine.shiftDNA(-1);
        const fx = Selectors.currentFixture();
        if (Selectors.isMatchWeek() && Selectors.rival(fx.rival).derby) Engine.applyEffects({ lockerRoom: +3 });
        if (Math.random() < 0.08) {
          const fine = Math.round(300 * Selectors.econ());
          Engine.money('Kara OZPN: wpis na Wirtualnym X', -fine);
          Engine.addLog('⚖️ Wydział Dyscypliny OZPN ukarał klub za „zadziorny” wpis na X: ' + Utils.formatMoney(fine) + '.', 'event');
        }
      }
    },
    function leagueEconomy() {
      Engine.leagueEconomyTick();
    },
    function socialFeed() {
      const ctx = gameState.report.matchCtx;
      if (ctx) Engine.matchPosts(ctx);
      else if (Math.random() < 0.6) { const [who, text] = Utils.rand(DATA.xGossip); Engine.xPost(who, text); }
    },
    function constructionTick() {
      const st = gameState.stadium;
      if (!st.builds || !st.builds.length) return;
      const done = st.builds.filter((b) => gameState.calendar.week >= b.ready);
      st.builds = st.builds.filter((b) => gameState.calendar.week < b.ready);
      done.forEach((b) => Engine.finishBuild(b));
    },
    function pitchInspection() {
      // 13.72: od II ligi delegat ocenia płytę – fatalna murawa to kara i krytyka (zmusza do inwestycji)
      const lvl = gameState.club.leagueLevel;
      if (lvl < 6 || !Selectors.isMatchWeek() || !Selectors.currentFixture().home) return;
      const e = Selectors.pitchScore(gameState.stadium.pitch);
      if (e >= 30 || gameState.calendar.week - (gameState.stadium.lastPitchFine || -99) < 4) return;
      gameState.stadium.lastPitchFine = gameState.calendar.week;
      const fine = Math.round(120 * Selectors.econ() / 10) * 10;
      Engine.money('Kara: stan murawy (delegat PZPN)', -fine);
      Engine.applyEffects({ fans: -2 });
      Engine.alert('🟫', 'Delegat krytykuje murawę', 'Stan płyty: „' + Selectors.pitchLabel(gameState.stadium.pitch) + '”. Kara ' + Utils.formatMoney(fine) + ' i drwiny w studiu TV. Czas zainwestować w murawę.', 'bad');
      Engine.addLog('🟫 Delegat PZPN: murawa „' + Selectors.pitchLabel(gameState.stadium.pitch) + '”. Kara ' + Utils.formatMoney(fine) + '. [kibice -2%]', 'system');
    },
    function shopManager() {
      // Kierownik sklepu: pensja co tydzień, a przed dniem meczowym dokupuje partie, by półki nie świeciły pustkami
      const m = gameState.merch;
      if (!m.manager) return;
      if ((m.level || 1) < Selectors.shopManagerLevel) { m.manager = false; return; }
      Engine.money('Kierownik sklepu (pensja)', -Selectors.shopManagerWage());
      const bought = [];
      Selectors.shopItems().forEach((id) => {
        const item = DATA.merch[id];
        const target = Math.max(Math.ceil(Selectors.merchEstimate(id) * 2.2), Math.ceil(item.batch / 2));
        let n = 0;
        while ((m.stock[id] || 0) < target && n < 4 && gameState.finance.budget >= item.batch * item.unitCost) {
          Engine.money('Kierownik sklepu: dostawa', -item.batch * item.unitCost);
          m.stock[id] = (m.stock[id] || 0) + item.batch; n++;
        }
        if (n) bought.push(item.icon + '×' + n * item.batch);
      });
      m.managerLast = bought.join(' ');
      if (bought.length) Engine.addLog('👔 Kierownik sklepu uzupełnił magazyn: ' + bought.join(', ') + '.', 'finance');
    },
    function merchSales() {
      const m = gameState.merch;
      const favorites = gameState.squad.filter((p) => p.favorite).length;
      const parts = [];
      let income = 0;
      m.last = {};
      Selectors.shopItems().forEach((id) => {
        if (!(m.stock[id] > 0)) return;
        const item = DATA.merch[id];
        let d = item.demand * Math.sqrt(Selectors.revEcon()) * (0.4 + gameState.morale.fans / 60) * Selectors.merchDemand(id) * Utils.randRange(0.5, 1.5);
        if (item.favoriteBoost) d *= 1 + 0.25 * Math.min(favorites, 4);   // koszulki z nazwiskiem ulubieńca
        d *= Selectors.upgradeProd('merch');                                // tablica wyników, sklep z witryną
        d *= Selectors.passPolicy().merch || 1;                             // fanatycy z tanich karnetów kupują szaliki
        d *= Selectors.formFactor();                                       // passa zwycięstw albo kryzys
        if (gameState.report.result === 'W') d *= 1.5;
        if (gameState.report.homeMatch) d *= 1.4;
        const sold = Math.min(m.stock[id], Math.floor(d) + (Math.random() < d % 1 ? 1 : 0));
        if (sold <= 0) return;
        m.stock[id] -= sold;
        if (m.stock[id] === 0 && !m.manager) Engine.alert('📦', 'Wyprzedane: ' + item.label, 'Rozeszło się do ostatniej sztuki! Zamów nową partię w Finanse → Sklep, zanim kibice pójdą do konkurencji.', 'warn');
        m.soldTotal += sold;
        income += sold * Engine.merchPrice(id);
        m.last[id] = sold;
        parts.push(item.label + ' ×' + sold);
      });
      // Konsekwencje cennika: nastroje kibiców (rozliczane raz w miesiącu), burza przy zdzierstwie
      const spi = Selectors.shopPriceIndex();
      const shopFans = spi > 1.6 ? -3 : spi > 1.3 ? -1 : spi < 0.75 ? 1 : 0;
      if (shopFans) gameState.monthly.fans += shopFans;
      if (spi > 1.6 && Math.random() < 0.15) Engine.xPost('ultras', 'Szalik za ' + Engine.merchPrice('scarf') + ' zł?! Prezes chyba myśli, że to Real Madryt. BOJKOT SKLEPIKU! 😡');
      if (income > 0) {
        gameState.monthly.merch += income;
        Engine.money('Sklepik fanowski', income);
        const lm = gameState.lastMatch;
        if (lm && lm.week === gameState.calendar.week) lm.money.push({ label: 'Sklepik: ' + parts.join(', '), amount: income });   // bilans meczu z koszulkami i szalikami
        Engine.addLog('🛍️ Sklepik: ' + parts.join(', ') + ' → ' + Utils.formatMoney(income) + '.', 'finance');
      }
    },
    function sponsorIncome() {
      // Gmina dokłada do sportu zawsze – mało, ale regularnie (wyżej: miasto, województwo)
      Engine.money('Dotacja gminna na sport', Math.round(CONFIG.municipalGrant * Selectors.econ()));
      const s = gameState.sponsor;
      Engine.ensureSponsor();
      Engine.refreshSponsors();
      const sp = Selectors.sponsorDef(s.active);
      // Cierpliwość: chwilowy dołek nie zrywa umowy – sponsor odchodzi po kilku złych tygodniach albo przy katastrofie
      if (Selectors.hasRealSponsor()) {
        const t = Selectors.debtThresholds();
        const row = gameState.season.table[US];
        const catastrophe = Selectors.debtRatio() > CONFIG.debtBailiffRatio || (row && row.p >= 8 && Selectors.ourPosition() === Selectors.leagueSize() && gameState.record.lossStreak >= 4);
        const unhappy = sp.breaks(gameState) || catastrophe;
        s.strikes = unhappy ? (s.strikes || 0) + 1 : Math.max(0, (s.strikes || 0) - 1);
        if (unhappy) s.cutThisWeek = Selectors.sponsorTier().cut; else s.cutThisWeek = 0;
        if (unhappy && s.strikes === 2) Engine.alert('😟', 'Sponsor niezadowolony', sp.name + ' dzwoni z pretensjami: „Jeszcze trochę i się rozstaniemy”. Popraw sytuację w ciągu kilku tygodni.', 'warn');
        const T = Selectors.sponsorTier();
        if (s.strikes >= (catastrophe ? T.crash : T.patience)) { s.strikes = 0; s.cutThisWeek = 0; Engine.endSponsor('❌ ' + sp.breakLog); }   // zerwał – od razu wchodzi lokalny sponsor
      }
      const payer = Selectors.sponsor();
      if (payer !== sp) { Engine.money('Sponsor: ' + payer.name, Selectors.sponsorWeekly(payer)); return; }
      const cut = s.cutThisWeek ? Math.round(Selectors.sponsorWeekly(sp) * s.cutThisWeek) : 0;   // potrącenie za kryzys (wyższe ligi)
      Engine.money('Sponsor: ' + sp.name + (cut ? ' (potrącenie za wyniki)' : ''), Selectors.sponsorWeekly(sp) - cut);
      Engine.addLog('💼 Sponsor „' + sp.name + '”: ' + Utils.formatMoney(Selectors.sponsorWeekly(sp) - cut) + (cut ? ' – potrącił ' + Utils.formatMoney(cut) + ' za kryzys' : ' wpłynęło na konto (a raczej przyszło w kopercie)') + '.', 'finance');
    },
    function payroll() {
      const players = Selectors.squadWages();
      const coach = Selectors.coachWeekly();
      const staff = Selectors.staffWages();
      Engine.money('Zawodnicy (paliwo, skrzynki, stypendia)', -players);
      Engine.money('Pensja trenera', -coach);
      Engine.money('Sztab pomocniczy', -staff);
      Engine.addLog('💵 Wypłaty: zawodnicy ' + Utils.formatMoney(players) + (coach ? ', trener ' + Utils.formatMoney(coach) : '') + (staff ? ', sztab ' + Utils.formatMoney(staff) : '') + '. Koperty rozdawał pan Rysiek w szatni.', 'finance');
    },
    function loansTick() {
      const L = gameState.loans;
      L.taken.forEach((loan) => {
        const lender = DATA.lenders[loan.id];
        if (gameState.finance.budget < loan.rate) {
          Engine.addScandal(lender.name + ' rozpowiada po wsi, że klub nie ma na raty', true);
          if ((loan.penalties || 0) < 4) {   // utrata płynności: każda nieopłacona rata dokłada kolejną (odsetki karne)
            loan.penalties = (loan.penalties || 0) + 1;
            loan.remaining++;
            Engine.alert('🌀', 'Spirala długu', lender.name + ' nalicza odsetki karne: +1 rata (' + Utils.formatMoney(loan.rate) + '). Zostało ' + (loan.remaining - 1) + ' rat.', 'bad');
          }
        }
        Engine.money('Rata: ' + lender.name, -loan.rate);
        if (lender.club) Engine.clubEco(lender.club).cash += loan.rate;
        loan.remaining--;
        if (loan.remaining === 0) {
          Engine.alert('✅', 'Pożyczka spłacona', 'Ostatnia rata dla: ' + lender.name + '. Klub nic już nie jest winien. Na pożegnanie postawił flaszkę.', 'good');
          gameState.debtNews.push({ kind: 'ourPaid', week: gameState.calendar.week, text: '✅ Spłaciliśmy pożyczkę: ' + lender.name });
        }
      });
      L.taken = L.taken.filter((l) => l.remaining > 0);

    },
    function fixedCosts() {
      const e = Selectors.econ();
      const lime = Math.round(Utils.randInt(15, 25) * e * (gameState.club.character === 'rural' ? 0.8 : 1)), power = Math.round(Utils.randInt(20, 35) * e), laundry = Math.round(Utils.randInt(25, 40) * e);
      Engine.money('Koszty stałe (wapno, prąd, pranie)', -(lime + power + laundry));
      Engine.addLog('🧾 Koszty stałe: wapno do linii ' + lime + ' zł, prąd w blaszaku ' + power + ' zł, pranie strojów u pani Krysi ' + laundry + ' zł.', 'finance');
    },
    function stadiumUpkeep() {
      gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch + 3 + Selectors.upgradeSum('pitchRegen'), 0, 100);
    },
    function squadTopUp() {
      // Za mało ludzi? Trener łapie kogoś spod sklepu.
      while (gameState.squad.length < CONFIG.minSquad) {
        const u = gameState.u19;
        if (Selectors.transferBanned() && u && u.squad.length) {   // ban: zamiast łapanki – najstarszy junior z własnej akademii
          const j = u.squad.slice().sort((a, b) => b.age - a.age || b.skill - a.skill)[0];
          u.squad = u.squad.filter((x) => x.id !== j.id);
          j.wage = Selectors.gradWage(j);
          gameState.squad.push(j);
          Engine.addLog('⛔ Ban transferowy – brakuje ludzi, więc do kadry awansuje junior ' + Selectors.playerName(j) + ' (' + j.age + ' l.).', 'event');
          continue;
        }
        const p = Engine.generatePlayer({ ageMin: 18, ageMax: 34, skillMin: 2 + Selectors.levelSkillBonus(), skillMax: 4 + Selectors.levelSkillBonus(), wageMin: 5, wageMax: Math.round(10 * Selectors.econ()) });
        Engine.addLog('🙋 Z łapanki spod sklepu: ' + Selectors.playerName(p) + ' (' + p.age + ' l.). „Grałem kiedyś w trampkarzach, to się nada.”', 'event');
      }
    },
    function starRebellion() {
      Engine.starTick();
      // kontuzje się goją; dobry fizjoterapeuta czasem przyspiesza powrót o tydzień
      const fizjo = Selectors.staffLevel('fizjo');
      gameState.squad.forEach((p) => {
        if (!(p.injured > 0)) return;
        p.injured -= fizjo >= 3 && p.injured > 1 && Math.random() < fizjo * 0.08 ? 2 : 1;
        if (p.injured <= 0) { p.injured = 0; delete p.injuryLabel; }
      });
    },
    function academy() {
      if (Selectors.isMatchWeek()) Engine.u19Poachers();
    },
    function academyBuild() {
      Engine.academyTick();
    },
    function loans() {
      Engine.loanTick();   // nasi na wypożyczeniach grają co kolejkę
    },
    function exiles() {
      if (gameState.calendar.week > CONFIG.preseasonWeeks) Engine.exileTick();   // skruszeni zesłańcy
    },
    function echoes() {
      Engine.echoTick();   // skutki dawnych decyzji
    },
    function butcher() {
      const b = gameState.budka;
      if (b && b.cheapMeat && Selectors.isMatchWeek()) b.cheapMeat++;   // licznik meczów na tanim mięsie
    },
    function monthlyPrices() {
      if (gameState.calendar.week % 4 === 0) Engine.monthlySettlement();
    },
    function disciplinaryCase() {
      const d = gameState.dark;
      if (d.stingWeek && gameState.calendar.week >= d.stingWeek) { d.stingWeek = 0; Engine.journalistSting(); }   // grom z jasnego nieba
      if (d.caseOpen && (gameState.calendar.week - d.caseWeek) % 3 === 2) {
        Engine.alert('⚖️', 'Związek analizuje sprawę…', Utils.rand(['Wydział Dyscypliny przesłuchuje świadków. Kara zapadnie po sezonie.', 'Komisja ogląda nagranie klatka po klatce. Prezes nie śpi po nocach.', 'Rzecznik Związku: „Sprawa jest rozwojowa”. Wyrok po ostatniej kolejce.', 'Prawnik klubu mówi, że „może być różnie”. Związek wciąż myśli nad karą.']), 'warn');
      }
    },
    function coachHabits() {
      const w = gameState.calendar.week;
      if (Selectors.coachTrait('drinker') && Math.random() < 0.12) { Engine.applyEffects({ lockerRoom: -3 }); Engine.addLog('🍷 ' + Selectors.coach().name + ' przyszedł na trening „po imieninach”. Chłopaki widzieli. [szatnia -3%]', 'event'); }
      if (Selectors.coachTrait('discipline') && w % 4 === 0) Engine.shiftDNA(+1);
    },
    function moraleDrift() {
      const drift = (v, target) => (v < target ? v + 1 : v > target ? v - 1 : v);
      gameState.morale.lockerRoom = drift(gameState.morale.lockerRoom, Selectors.lockerBaseline());
      gameState.morale.fans = drift(gameState.morale.fans, 50);
    },
    function debts() {
      Engine.debtCheck();
    },
    function closeReport() {
      const rep = gameState.report;
      rep.total = rep.lines.reduce((sum, l) => sum + l.amount, 0);
      rep.budgetAfter = gameState.finance.budget;
      // Regularne przychody (bez pożyczek i wyprzedaży) – miara, ile klub jest w stanie udźwignąć długu
      const inc = rep.lines.filter((l) => l.amount > 0 && !/^Pożyczka|^Wyprzedaż|^Sprzedaż|^Klauzula|^Licytacja|^Ekwiwalent/.test(l.label)).reduce((sum, l) => sum + l.amount, 0);
      const f = gameState.finance;
      f.incomeAvg = Math.round((f.incomeAvg != null ? f.incomeAvg * 0.85 + inc * 0.15 : inc) * 10) / 10;
      Engine.addLog('📊 Bilans tygodnia: ' + Utils.signedMoney(rep.total) + '. Stan konta: ' + Utils.formatMoney(rep.budgetAfter) + '.', 'summary');
      if (gameState.finance.budget < 0) Engine.addLog('⚠️ Konto na minusie! Pani z Banku Spółdzielczego dzwoni trzeci raz. Prezes udaje, że nie ma zasięgu.', 'event');
      gameState.lastReport = rep;
      gameState.report = null;
    },
    function advanceCalendar() {
      gameState.calendar.week += 1;
      gameState.weather = Utils.rand(DATA.weather);
    },
    function scheduleDecisions() {
      if (!Selectors.isMatchWeek()) return;
      if (gameState.calendar.round === 0) Engine.offerTicketPolicy();   // cennik biletów na sezon
      if (gameState.calendar.round === 0 && !Selectors.strategyLocked()) Engine.pushDecision('mediaStrategy');
      const fx = Selectors.currentFixture();
      Engine.maybeLockerCall();
      Engine.maybePassat();
      Engine.maybeBalance();
    },
    function cutscenes() {
      if (gameState.calendar.week > CONFIG.preseasonWeeks) Engine.maybeCutscene();
    },
  ],

  nextWeek() {
    if (!Engine.canAdvanceWeek()) return false;
    Engine.weeklyHooks.forEach((hook) => { if (gameState.screen === 'game') hook(); });
    Engine.checkGameOver();
    return true;
  },
};

/* Selektory – obliczenia pochodne od stanu (bez modyfikacji) */
const Selectors = {
  leagueName: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).name,
  econ: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).econ,
  levelSkillBonus: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).skillBonus,
  sponsorWeekly: (sp) => (sp.fallback
    ? Math.round((30 + Selectors.promo() * 0.6) * Selectors.revEcon())   // symboliczny lokalny sponsor: rośnie z atrakcyjnością klubu
    : Math.round(sp.weekly * Selectors.revEcon() * Selectors.sponsorTier().mult * ({ neutral: 1.1, spicy: 0.9 }[Selectors.mediaStrategy()] || 1))),
  // 13.72: powaga sponsorów rośnie z ligą – większe kontrakty, ale mniej cierpliwości i potrącenia za słabe wyniki
  sponsorTier: (lvl = gameState.club.leagueLevel) => [
    { label: 'lokalny biznes', mult: 1, patience: 5, crash: 3, cut: 0 },
    { label: 'firma regionalna', mult: 1.3, patience: 4, crash: 3, cut: 0.2 },
    { label: 'ogólnopolska marka', mult: 1.7, patience: 3, crash: 2, cut: 0.35 },
  ][Selectors.band(lvl)],
  mediaStrategy: () => gameState.x.strategy || 'neutral',
  strategyLocked: () => gameState.x.strategySeason === gameState.calendar.season,
  coachNeedsPro: (co) => gameState.club.leagueLevel >= DATA.proLicenseLevel && (co.license || 0) < 4,
  coachOffer: (co) => ({ sign: Math.round(co.sign * Selectors.econ()), weekly: Math.round(co.weekly * Selectors.econ()) }),
  coachWeekly: () => (gameState.coach.id === 'mirek' ? 0 : (gameState.coach.weekly || Selectors.coach().weekly)) + (gameState.coach.figurehead ? gameState.coach.figurehead.weekly : 0),
  coachLicense: () => Math.max(gameState.coach.license != null ? gameState.coach.license : (Selectors.coach().license || 0), Selectors.coach().license || 0),
  coachLicenseReq: (level = gameState.club.leagueLevel) => DATA.coachLicenseReq[level] || 0,
  // Licencja spełniona przez trenera albo przez „trenera na papierze” (figuranta)
  coachLicenseOk: (level = gameState.club.leagueLevel) => Math.max(Selectors.coachLicense(), gameState.coach.figurehead ? gameState.coach.figurehead.license : 0) >= Selectors.coachLicenseReq(level),
  courseCost: (to) => Math.round(DATA.coachCourseCost[to] * Math.max(1, Selectors.econ() / 4)),
  licensedCoachFor: (req) => { const c = Selectors.coachMarket().filter((x) => (x.license || 0) >= req).sort((a, b) => a.sign - b.sign)[0]; return c ? c.id : null; },
  raiseAmount: () => Math.max(15, Math.round(15 * Selectors.econ() / 5) * 5),
  passatSellAmount: () => Math.round(1200 * Selectors.econ() / 100) * 100,
  passatBuyAmount: () => Math.round(800 * Selectors.econ() / 100) * 100,
  aferaRisk: () => (gameState.club.professionalism < -50 ? 0.75 : 0.25),   // „pod lupą” prokuratury
  underInvestigation: () => gameState.club.professionalism < -50,
  // Feta rośnie z klubem: liga, trofea i rodzaj sukcesu
  fetaScale: () => Selectors.econ() * (1 + (gameState.trophies || []).length * 0.05) * ({ title: 1.6, euro: 1.3, promo: 1.15 }[(gameState.lastSeason || {}).outcome] || 1),
  fetaCost: (base) => Math.round(base * Selectors.fetaScale() / 10) * 10,
  fetaTier: () => { const l = gameState.club.leagueLevel; return l >= 7 ? 2 : l >= 4 ? 1 : 0; },
  lifelineAmount: (base) => Math.round(base * Selectors.econ() / 100) * 100,
  brakeAmount: (base) => Math.round(base * Selectors.econ() / 10) * 10,
  debtThresholds: () => {
    const e = Selectors.econ();
    return { warn: CONFIG.debtWarn * e, bailiff: CONFIG.debtBailiff * e, gameOver: CONFIG.debtGameOver * e };
  },
  licenseMissing: (level, skipCoach) => {
    const up = gameState.stadium.upgrades;
    const miss = [];
    if (level === 2 && !up.boiler && !up.roller) miss.push('Bojler albo Walec');
    if (level >= 3) {
      if (!up.boiler) miss.push(DATA.upgrades.boiler.label);
      if (!up.roller) miss.push(DATA.upgrades.roller.label);
    }
    Object.keys(DATA.upgrades).forEach((id) => {
      const u = DATA.upgrades[id];
      if (u.licenseLevel && level >= u.licenseLevel && !up[id]) miss.push(Selectors.upgradeLabel(id));
    });
    if (!skipCoach && !Selectors.coachLicenseOk(level)) miss.push('Trener z licencją ' + DATA.coachLicenses[Selectors.coachLicenseReq(level)]);
    const needCap = DATA.licenseCapacity[level] || 0;
    if ((gameState.stadium.level || 0) < needCap) miss.push('Trybuny: min. ' + DATA.stadiumLevels[needCap].capacity + ' miejsc');
    return miss;
  },
  isMatchWeek: () => gameState.calendar.week > CONFIG.preseasonWeeks,
  // Struktura ligi: liczba drużyn w bieżącej tabeli i strefy wg klasy rozgrywkowej
  leagueSize: () => Object.keys(gameState.season.table || {}).length || 1 + gameState.league.rivals.length,
  rundaLen: () => Math.max(1, Math.round((gameState.season.rounds || []).length / 2) || CONFIG.roundsPerRunda),
  leagueRules: (level = gameState.club.leagueLevel) => {
    const L = DATA.leagueLevels[level] || DATA.leagueLevels[1];
    const max = DATA.leagueLevels.length - 1;
    return { up: level < max ? L.up || 0 : 0, upPO: level < max ? L.upPO || [] : [], down: level > 1 ? L.down || 0 : 0, downPO: level > 1 ? L.downPO : null, euro: L.euro || [], top: level === max };
  },
  // Strefa miejsca w tabeli: title / up / upPO / euro / downPO / down / last (dno B-klasy) / null
  zoneOf: (pos, n = Selectors.leagueSize()) => {
    const r = Selectors.leagueRules();
    if (r.top && pos === 1) return 'title';
    if (pos <= r.up) return 'up';
    if (r.upPO.includes(pos)) return 'upPO';
    if (r.euro.includes(pos)) return 'euro';
    if (r.down && pos > n - r.down) return 'down';
    if (r.downPO && pos === n - r.down) return 'downPO';
    if (!r.down && pos === n) return 'last';
    return null;
  },
  fixtureAt: (roundIdx) => {
    const round = gameState.season.rounds[roundIdx];
    if (!round) return null;
    const f = round.find((x) => x.home === US || x.away === US);
    return { rival: f.home === US ? f.away : f.home, home: f.home === US };
  },
  currentFixture: () => Selectors.fixtureAt(gameState.calendar.round),
  rival: (name) => gameState.league.rivals.find((r) => r.name === name) || DATA.rivals.find((r) => r.name === name) || { name, strength: 1.3, derby: false },
  teamName: (id) => (id === US ? Selectors.clubDisplayName() : id),
  coach: () => Selectors.coachDef(gameState.coach.id) || DATA.coaches.mirek,
  // Trener z danych albo wygenerowany na giełdzie (zapisany razem z klubem)
  coachDef: (id) => DATA.coaches[id] || (gameState.coach.custom && gameState.coach.custom.id === id ? gameState.coach.custom : null)
    || ((gameState.coachMarket && gameState.coachMarket.list) || []).find((c) => c.id === id) || null,
  coachTrait: (t) => (Selectors.coach().traits || []).includes(t),
  // Giełda trenerów: wraz z ligą coraz lepsi, drożsi i bardziej profesjonalni kandydaci
  coachMarket: () => {
    const lvl = gameState.club.leagueLevel;
    const cm = gameState.coachMarket;
    if (!cm || cm.level !== lvl || cm.season !== gameState.calendar.season) Engine.refreshCoachMarket();
    const statics = Object.keys(DATA.coaches).filter((id) => id !== 'mirek' && DATA.coaches[id].levels && lvl >= DATA.coaches[id].levels[0] && lvl <= DATA.coaches[id].levels[1]);
    return statics.map((id) => DATA.coaches[id]).concat(gameState.coachMarket.list).filter((c) => c.id !== gameState.coach.id);
  },
  sponsor: () => (gameState.sponsor.active ? Selectors.sponsorDef(gameState.sponsor.active) : null),
  playerName: (p) => (p.noNick ? p.first + ' ' + p.last : p.first + ' \u201e' + p.nick + '\u201d ' + p.last),
  shortName: (p) => (p.noNick ? p.first + ' ' + p.last : '\u201e' + p.nick + '\u201d ' + p.last),   // Kacper Chudy gra pod własnym nazwiskiem
  nickQ: (p) => (p.noNick ? p.first + ' ' + p.last : '\u201e' + p.nick + '\u201d'),
  clubDisplayName: () => {
    const sp = Selectors.sponsor();
    return sp && sp.clubPrefix ? sp.clubPrefix + ' ' + gameState.club.name : gameState.club.name;
  },
  stadiumName: () => {
    const sp = Selectors.sponsor();
    return sp && sp.stadiumName ? sp.stadiumName : gameState.stadium.baseName;
  },
  standings: () => Object.entries(gameState.season.table)
    .map(([team, r]) => ({ team, ...r }))
    .sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf),
  ourPosition: () => Selectors.standings().findIndex((r) => r.team === US) + 1,
  squadWages: () => gameState.squad.reduce((s, p) => s + p.wage, 0),
  staffWages: () => Object.values(gameState.staff).reduce((s, m) => s + (m ? m.wage : 0), 0) + Selectors.extraStaffWages(),
  // Pensje sztabu akademii i dyrektora sportowego
  // 13.86: płatny sztab (do cięć przy groźbie upadłości)
  paidStaff: () => {
    const e = Selectors.econ(), out = [];
    Object.entries(DATA.staffSlots).forEach(([slot, def]) => { const m = gameState.staff[slot]; if (m && m.kind === 'external' && m.wage > 0) out.push({ type: 'staff', key: slot, role: def.label, name: m.name, wage: m.wage }); });
    const d = gameState.director && gameState.director.hired; if (d) out.push({ type: 'director', key: 'director', role: 'Dyrektor sportowy', name: d.name, wage: Math.round(d.wage * e) });
    const u = gameState.u19 || {};
    if (u.coach) out.push({ type: 'u19', key: 'coach', role: 'Trener U19', name: u.coach.name, wage: Math.round(u.coach.wage * e) });
    if (u.recruiter) out.push({ type: 'u19', key: 'recruiter', role: 'Rekruter U19', name: u.recruiter.name, wage: Math.round(u.recruiter.wage * e) });
    if (gameState.merch && gameState.merch.manager) out.push({ type: 'shop', key: 'shop', role: 'Kierownik sklepu', name: 'kierownik', wage: Selectors.shopManagerWage() });
    return out;
  },
  extraStaffWages: () => {
    const u = gameState.u19, d = gameState.director;
    const e = Selectors.econ();
    return Math.round(((u && u.coach ? u.coach.wage : 0) + (u && u.recruiter ? u.recruiter.wage : 0) + (d && d.hired ? d.hired.wage : 0)) * e);
  },
  u19Name: () => Selectors.clubDisplayName() + ' U19',
  u19Lvl: (role) => (gameState.u19 && gameState.u19[role] ? gameState.u19[role].level : 0),
  u19Standings: () => Object.entries((gameState.u19 && gameState.u19.table) || {}).map(([team, r]) => ({ team, ...r })).sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga)),
  // Perełka: talent albo wysoki sufit – na takich polują inne kluby
  isGem: (p) => p.talent || Selectors.potentialStars(p) >= 4,
  gradWage: (p) => Math.max(5, Math.round((p.skill * 6 - 8) * Selectors.econ() * 0.6 / 5) * 5),
  secureCost: (p) => Math.round(150 * Selectors.econ() * (1 + Selectors.potentialStars(p)) / 10) * 10,
  weeklyPayroll: () => Selectors.squadWages() + Selectors.coachWeekly() + Selectors.staffWages() + Selectors.shopManagerCost(),
  // 13.71: kierownik sklepu – od poziomu 3 sklepu („Sklep klubowy”), pensja rośnie z ligą
  shopManagerLevel: 3,
  shopManagerWage: () => Math.max(30, Math.round(35 * Selectors.econ() / 10) * 10),
  shopManagerCost: () => (gameState.merch && gameState.merch.manager ? Selectors.shopManagerWage() : 0),
  // Spodziewana sprzedaż gadżetu w meczu domowym (bez losowości) – pod nią kierownik ustala zapas
  merchEstimate: (id) => {
    const item = DATA.merch[id];
    const favorites = gameState.squad.filter((p) => p.favorite).length;
    let d = item.demand * Math.sqrt(Selectors.revEcon()) * (0.4 + gameState.morale.fans / 60) * Selectors.merchDemand(id) * Selectors.upgradeProd('merch') * (Selectors.passPolicy().merch || 1) * 1.4;
    if (item.favoriteBoost) d *= 1 + 0.25 * Math.min(favorites, 4);
    return d;
  },
  lockerBaseline: () => {
    const legends = gameState.squad.filter((p) => p.legend).length;
    const leaders = gameState.squad.filter((p) => p.tag === 'leader').length;
    const staff = Object.values(gameState.staff).reduce((s, m) => s + (m ? m.lockerBase : 0), 0);
    const facilities = Selectors.upgradeSum('lockerBase');   // bojler, siłownia, świetlica…
    const coachMood = (Selectors.coachTrait('motivator') ? 6 : 0) - (Selectors.coachTrait('discipline') ? 6 : 0);
    return Utils.clamp(50 + facilities + Math.min(9, legends * 3) + leaders * 2 + staff + coachMood, 30, 85);
  },
  dnaLabel: () => {
    const v = gameState.club.professionalism;
    let label = DATA.dnaLevels[0].label;
    DATA.dnaLevels.forEach((l) => { if (v >= l.min) label = l.label; });
    return label;
  },
  handleFrom: (name) => {
    const words = String(name).trim().split(/\s+/);
    return (words[words.length - 1] || 'Klub').replace(/[^\p{L}\p{N}]/gu, '') || 'Klub';
  },
  clubHandle: () => Selectors.handleFrom(gameState.club.town || gameState.club.name),
  presName: () => gameState.club.president || 'Prezes',
  townType: () => DATA.townTypes[gameState.club.character] || null,
  colors: () => DATA.clubColors[gameState.club.colors] || null,
  colorsNick: () => (Selectors.colors() ? Selectors.colors().nick : ''),
  defaultStadium: (town) => 'Boisko Gminne przy Remizie' + (town ? ' w ' + town : ''),
  stadiumCapacity: () => DATA.stadiumLevels[gameState.stadium.level || 0].capacity,
  // 13.70: ceny ulepszeń rosną z rangą ligi: (współczynnik ligi / współczynnik szczebla bazowego)^0.7, w widełkach 0,5–12×
  costScale: (ref = 1, lvl = gameState.club.leagueLevel) => { const now = (DATA.leagueLevels[lvl] || DATA.leagueLevels[1]).econ, base = (DATA.leagueLevels[ref] || DATA.leagueLevels[1]).econ; return Utils.clamp(Math.pow(now / base, 0.7), 0.5, 12); },
  niceCost: (v) => { const step = v >= 100000 ? 5000 : v >= 20000 ? 1000 : v >= 5000 ? 500 : v >= 1000 ? 100 : 10; return Math.max(step, Math.round(v / step) * step); },
  scaledCost: (base, ref) => Selectors.niceCost(base * Selectors.costScale(ref)),
  upgradeRef: (id) => { const u = DATA.upgrades[id], f = DATA.upgradeFlavor[id]; return (f && f.ref) || u.licenseLevel || 1; },
  upgradeCost: (id, noDiscount) => Selectors.niceCost(Selectors.scaledCost(DATA.upgrades[id].cost, Selectors.upgradeRef(id)) * (Selectors.upgradeRef(id) >= 4 ? 1.5 : 1) * (!noDiscount && id === 'roller' && gameState.club.character === 'rural' ? 0.75 : 1)),   // 13.84: zaawansowane ×1,5
  tierCost: (t) => Selectors.niceCost(Selectors.scaledCost(t.cost, t.minLevel || 1) * 1.6),   // 13.84: modernizacje droższe
  stadiumRef: (i) => { const k = DATA.licenseCapacity.findIndex((c) => c >= i); return k > 0 ? k : 8; },
  stadiumCost: (i) => Selectors.niceCost(Selectors.scaledCost(DATA.stadiumLevels[i].cost, Selectors.stadiumRef(i)) * (i >= 3 ? 1.5 : 1)),
  // 13.84: czas budowy (tygodnie) i ekipy budowlane – najwyżej 2 budowy naraz
  buildSlots: 2,
  builds: () => (gameState.stadium.builds || []),
  buildOf: (kind, id) => Selectors.builds().find((b) => b.kind === kind && b.id === id) || null,
  buildFree: () => Selectors.builds().length < Selectors.buildSlots,
  upgradeWeeks: (id) => ({ roller: 1, boiler: 1, toilets: 1, parking: 2, kiosk: 2, scoreboard: 2, tvcams: 3, gym: 3, shop: 3, irrigation: 3, roof: 3, clubhouse: 4, lights: 4, var: 4, monitoring: 4, vip: 5, stand: 6, training: 6, academyHall: 8 }[id] || 3),
  tierWeeks: (t) => 3 + Math.round((t.minLevel || 1) * 0.9),
  budkaWeeks: (lvl) => [0, 0, 1, 2, 3, 5][lvl] || 3,
  shopWeeks: (lvl) => [0, 0, 1, 2, 4, 6][lvl] || 3,
  stadiumWeeks: (i) => [0, 3, 5, 8, 12, 16][i] || 10,
  buildLeft: (b) => Math.max(0, b.ready - gameState.calendar.week),
  academyCost: (i) => Selectors.scaledCost(DATA.academyLevels[i].cost, DATA.academyRef[i] || 1),
  // Szczebel opisów: 0 – amatorski (B-klasa–V liga), 1 – półzawodowy (IV–III liga), 2 – zawodowy (II liga–Ekstraklasa)
  band: (lvl = gameState.club.leagueLevel) => (lvl >= 6 ? 2 : lvl >= 4 ? 1 : 0),
  upgradeBandOf: (id) => { const b = (gameState.stadium.upgradeBand || {})[id]; return gameState.stadium.upgrades[id] && b != null ? b : Selectors.band(); },
  upgradeLabel: (id, b = Selectors.upgradeBandOf(id)) => { const f = DATA.upgradeFlavor[id]; return f ? f.l[b] : DATA.upgrades[id].label; },
  upgradeDesc: (id, b = Selectors.upgradeBandOf(id)) => { const f = DATA.upgradeFlavor[id]; return f ? f.d[b] + ' ' + f.fx : DATA.upgrades[id].desc; },
  // Nazwa klubu z formularza: przedrostek (z listy albo własny) + miejscowość
  formClubName: (f) => [(f.prefix === 'custom' ? f.customPrefix : f.prefix).trim(), f.town.trim()].filter(Boolean).join(' '),
  youthLevel: () => Math.min(DATA.youthLevels.length - 1, Math.round(Selectors.academyLevel() * 0.7)),
  academyLevel: () => (gameState.academy && gameState.academy.level) || 0,
  academy: () => DATA.academyLevels[Selectors.academyLevel()],
  callPlayer: () => gameState.squad.find((p) => p.id === gameState.calls.playerId) || null,
  starPlayer: () => gameState.squad.find((p) => p.id === gameState.star.playerId) || null,
  rebel: () => { const p = Selectors.starPlayer(); return !!(gameState.star.rebel && p && !p.benched); },
  starFee: (p) => Math.round(Selectors.feeFromValue(Selectors.marketValue(p)) * 1.5 / 10) * 10,   // klub z wyższej ligi płaci premię
  calmCost: (p) => Math.round(p.skill * 80 * Selectors.econ() / 10) * 10,
  transferBanned: () => { const b = gameState.transferBan; return !!(b && gameState.calendar.season > b.from && gameState.calendar.season <= b.until); },
  transferOffers: () => gameState.pendingDecisions.filter((id) => DATA.decisions[id] && DATA.decisions[id].transfer),
  // OVR 1–99: klasa zawodnika skorygowana o aktualną formę (noty z ostatnich meczów)
  // Skala: B-klasa ok. 43–61, Ekstraklasa ok. 72–90; krajowy sufit 92 – OVR 93–99 tylko dla gwiazd europejskich pucharów
  ovr: (p) => {
    const hist = p.formHistory || [];
    const form = hist.length ? Utils.clamp((hist.reduce((s, r) => s + r, 0) / hist.length - 6) * 1.5, -4, 4) : 0;
    return Math.round(Utils.clamp(32 + p.skill * 3.6 + form, 1, p.euroApps ? 99 : CONFIG.domesticOvrCap));   // 93–99 tylko po meczach w Europie
  },
  // Sufit rozwoju zależny od ligi klubu: zawodnik nie urośnie dużo ponad poziom rozgrywek
  leagueSkillCap: () => (Selectors.euroThisSeason() ? 18 : Math.min(CONFIG.domesticMaxSkill, 9 + Selectors.levelSkillBonus())),
  leagueOvrRange: () => { const b = Selectors.levelSkillBonus(); return [Math.round(32 + (3 + b) * 3.6), Math.round(32 + (8 + b) * 3.6)]; },
  teamOvr: () => { const l = Selectors.projectedLineup(); return l.length ? Math.round(l.reduce((s, p) => s + Selectors.ovr(p), 0) / l.length) : 0; },
  potential: (p) => Math.min(CONFIG.maxSkill, Math.max(p.skill, p.potential != null ? p.potential : p.skill + (p.age <= 23 ? 2 : 0))),
  potentialStars: (p) => Utils.clamp(Math.round((Selectors.potential(p) - 2) / 2.8), 1, 5),
  // Ukryta zdolność kredytowa (0–3): kasa, tygodniowe wpływy, zaległe raty, debet, strajk, skandale
  // Stan klubu przed/po decyzji – do planszy konsekwencji
  clubSnapshot: () => ({
    budget: gameState.finance.budget, fans: gameState.morale.fans, locker: gameState.morale.lockerRoom,
    dna: gameState.club.professionalism, scandals: gameState.club.scandals, squad: gameState.squad.length, pitch: gameState.stadium.pitch,
  }),
  clubDeltas: (a, b) => [
    ['💰', 'Kasa', b.budget - a.budget, (v) => Utils.signedMoney(v)],
    ['📣', 'Kibice', b.fans - a.fans, (v) => (v > 0 ? '+' : '') + v + '%'],
    ['🧑‍🤝‍🧑', 'Szatnia', b.locker - a.locker, (v) => (v > 0 ? '+' : '') + v + '%'],
    ['🧬', 'Wizerunek (DNA)', b.dna - a.dna, (v) => (v > 0 ? '+' : '') + v],
    ['📰', 'Skandale', b.scandals - a.scandals, (v) => (v > 0 ? '+' : '') + v, true],
    ['👟', 'Kadra', b.squad - a.squad, (v) => (v > 0 ? '+' : '') + v + ' zaw.'],
    ['🌱', 'Murawa', b.pitch - a.pitch, (v) => (v > 0 ? '+' : '') + v],
  ].filter(([, , v]) => v).map(([icon, label, v, fmt, inverse]) => ({ icon, label, text: fmt(v), good: inverse ? v < 0 : v > 0 })),
  // Jeden wzór zdolności kredytowej dla wszystkich klubów w lidze
  creditFrom: ({ cash, income, owed }) => {
    const e = Selectors.econ();
    return Utils.clamp(0.2 + Math.max(0, cash) / (5000 * e) + income / (2000 * e) - owed / (3000 * e) - Math.max(0, -cash) / (1500 * e), 0, 3);
  },
  // Wiarygodność klubu: finanse + historia spłat (spłacone długi w górę, zaległości i upadłość w dół)
  clubCredit: (name) => {
    const ec = Engine.clubEco(name);
    const base = Selectors.creditFrom({ cash: ec.cash, income: ec.income, owed: ec.loan ? ec.loan.remaining * ec.loan.rate : 0 });
    return Math.round(Utils.clamp(base + (ec.trust || 0) * 0.3 - (ec.loan && ec.loan.missed ? 0.15 * ec.loan.missed : 0), 0, 3) * 100) / 100;
  },
  creditScore: () => {
    const e = Selectors.econ();
    const b = gameState.finance.budget;
    const rep = gameState.lastReport;
    const income = rep ? rep.lines.filter((l) => l.amount > 0).reduce((s, l) => s + l.amount, 0) : 300 * e;
    const owed = gameState.loans.taken.reduce((s, l) => s + l.remaining * l.rate, 0);
    let s = Selectors.creditFrom({ cash: b, income, owed });
    if (gameState.debt.strike) s -= 0.3;
    if (gameState.debt.deepWeeks > 0) s -= 0.5;
    s -= gameState.club.scandals * 0.03;
    return Math.round(Utils.clamp(s, 0, 3) * 100) / 100;
  },
  creditLabel: (s) => (s < 0.4 ? ['🔴', 'tragiczna', 1] : s < 0.9 ? ['🟠', 'słaba', 2] : s < 1.5 ? ['🟡', 'przyzwoita', 3] : s < 2.2 ? ['🟢', 'dobra', 4] : ['💚', 'znakomita', 5]),
  // Oferta pożyczkodawcy liczona na bieżąco: kwota rośnie z kondycją, w kryzysie maleje i drożeje
  loanOffer: (id) => {
    const l = DATA.lenders[id];
    const s = Selectors.creditScore();
    const e = Selectors.econ();
    const b = gameState.finance.budget;
    const crisis = b < 0;   // dołek finansowy: lichwiarze ratują klub, ale drogo – droga do spirali długu
    const cashFactor = crisis ? Utils.clamp(0.6 + -b / (5000 * e), 0.6, 1.6) : Utils.clamp(0.4 + Math.max(0, b) / (4000 * e), 0.4, 2.2);   // limit skaluje się do stanu konta (na minusie – do wielkości dziury)
    const amount = Math.max(100, Math.round(l.base * e * Utils.clamp(s, crisis ? 0.6 : 0.25, 2.5) * cashFactor / 50) * 50);
    const interest = l.interest + Math.max(0, 1 - s) * 0.15 + (crisis && id !== 'lombard' ? 0.2 : 0);
    const rate = Math.ceil(amount * interest / l.installments / 5) * 5;
    const activeN = gameState.loans.taken.filter((x) => x.id === id).length;
    const active = l.stack ? activeN >= l.stack : activeN > 0;
    let amt = amount;
    let clubBroke = false;
    if (l.club) {   // prezes pożycza z kasy swojego klubu – nie da więcej, niż klub ma
      const cap = Math.floor(Math.max(0, Engine.clubEco(l.club).cash) * 0.7 / 50) * 50;
      clubBroke = cap < 300;
      amt = Math.min(amount, cap);
    }
    const r = l.club ? Math.ceil(amt * interest / l.installments / 5) * 5 : rate;
    const scoreOk = s >= l.minScore || (crisis && id !== 'bank');   // na minusie prezesi pożyczają mimo słabej zdolności – bank nadal nie
    const offOnly = l.crisisOnly && !crisis;
    const available = !active && scoreOk && !clubBroke && !offOnly;
    const reason = active ? 'spłacasz' : offOnly ? 'tylko w kryzysie' : !scoreOk ? (id === 'bank' ? 'brak zdolności' : 'nie ufa') : clubBroke ? 'sam bez kasy' : '';
    return { amount: amt, rate: r, installments: l.installments, total: r * l.installments, available, reason, club: l.club, crisis, activeN };
  },

  // Mocne i słabe strony zawodnika – wyliczone z jego danych, do świadomych zakupów
  prosCons: (p) => {
    const pros = [], cons = [];
    const team = Selectors.teamOvr(), ovr = Selectors.ovr(p);
    const wages = gameState.squad.map((x) => x.wage);
    const avgWage = wages.length ? wages.reduce((s, w) => s + w, 0) / wages.length : 10;
    const ps = p.prevSeason;
    if (ovr >= team + 5) pros.push('Od razu wzmocni skład (OVR ' + ovr + ' przy średniej ' + team + ')');
    else if (ovr <= team - 5) cons.push('Na start raczej rezerwowy (OVR ' + ovr + ' przy średniej ' + team + ')');
    if (p.age <= 21 && Selectors.potential(p) > p.skill) pros.push('Młody – jeszcze urośnie');
    if (Selectors.potentialStars(p) >= 4 && Selectors.potential(p) > p.skill) pros.push('Wysoki sufit rozwoju');
    if (p.talent) pros.push('Perełka – rozwija się szybciej');
    if (p.age >= 31) cons.push('Wiek – forma będzie spadać');
    if (ps && ps.apps >= 5 && ps.avg != null && ps.avg >= 7) pros.push('Świetny zeszły sezon (nota ' + Selectors.ratingText(ps.avg) + ')');
    if (ps && ps.apps >= 5 && ps.avg != null && ps.avg < 5.6) cons.push('Słaby zeszły sezon (nota ' + Selectors.ratingText(ps.avg) + ')');
    if (ps && ps.apps < 5) cons.push('Mało grał w zeszłym sezonie');
    const ours = gameState.squad.includes(p);   // nasz zawodnik: bez etykiet z giełdy
    if (!ours && !p.loan && Selectors.signChance(p) < 1) cons.push('Wymagający – zgoda na transfer ok. ' + Math.round(Selectors.signChance(p) * 100) + '%');
    if (p.bargain && !ours) pros.push('Okazja wyszukana przez skauta – ok. ' + p.bargain + '% poniżej ceny rynkowej');
    if (p.fireSale && !ours) pros.push('Wyprzedaż – klub ' + (p.fromClub || '') + ' niewypłacalny, cena ok. 45% niższa');
    if (ps && (p.pos === 'FWD' || p.pos === 'MID') && ps.apps && ps.goals / ps.apps >= 0.35) pros.push('Skuteczny pod bramką (' + ps.goals + ' goli)');
    if (p.wage >= avgWage * 1.6) cons.push('Wysoka pensja (' + p.wage + ' zł/tydz.)');
    else if (p.wage <= avgWage * 0.7) pros.push('Tani w utrzymaniu');
    if (p.tag === 'leader') pros.push('Lider szatni');
    if ((p.temper || 0) >= 0.7) cons.push('Przecinak – łapie kartki i pauzy');
    else if (p.temper != null && p.temper <= 0.2) pros.push('Dżentelmen – rzadko kartki');
    if (p.tag === 'freekick') pros.push('Specjalista od stałych fragmentów');
    if (p.tag === 'worker') cons.push('Pracuje na budowie – bywa nieobecny');
    if (p.tag === 'party') cons.push('Imprezowicz – zdarza się kac na meczu');
    if (Engine.profileFit(p, Selectors.coach().style) >= 1) pros.push('Pasuje do stylu trenera');
    return { pros: pros.slice(0, 3), cons: cons.slice(0, 3) };
  },
  loanOutFee: (p) => Math.max(10, Math.round(Selectors.sellPrice(p) * 0.25 / 10) * 10),
  sellPrice: (p) => Math.max(20, Math.round(Selectors.feeFromValue(Selectors.marketValue(p)) * 0.85 * (p.listed ? 1.15 : 1) * (1 + Selectors.directorSellBonus()) / 10) * 10),   // ok. 85% wartości; lista +15%, dyrektor negocjuje lepiej   // lista +15%, dyrektor negocjuje lepiej   // lista transferowa: kupcy wiedzą, +15%
  cutTarget: () => gameState.squad.find((p) => p.id === gameState.cutscenes.targetId) || null,
  cutTransferFee: () => { const p = Selectors.cutTarget(); return p ? Math.round(p.skill * 160 * Selectors.econ()) : 0; },
  // Ukryty poziom osoby w sztabie (0 = wakat); starsze zapisy bez poziomu = przeciętny
  staffRawLevel: (slot) => { const m = gameState.staff[slot]; return m ? (m.level != null ? m.level : m.kind === 'volunteer' ? 1 : 2) : 0; },
  // 13.72: standard ligi – fachowiec poniżej minimum rynku tej ligi jest „przestarzały” i daje połowę efektu
  staffStandard: (lvl = gameState.club.leagueLevel) => Math.max(1, 1 + Math.floor((lvl - 1) * 0.6) - 2),
  staffOutdated: (slot) => { const r = Selectors.staffRawLevel(slot); return r > 0 && r < Selectors.staffStandard(); },
  staffLevel: (slot) => { const r = Selectors.staffRawLevel(slot); return Selectors.staffOutdated(slot) ? r * 0.5 : r; },
  upgradeTier: (id) => ((gameState.stadium.tiers || {})[id] || 0),
  // Premie z obiektów razem z ich kolejnymi poziomami
  upgradeSum: (key) => Object.keys(DATA.upgrades).reduce((s, id) => {
    if (!gameState.stadium.upgrades[id]) return s;
    const tiers = (DATA.upgradeTiers[id] || []).slice(0, Selectors.upgradeTier(id));
    return s + (DATA.upgrades[id][key] || 0) + tiers.reduce((t, x) => t + (x[key] || 0), 0);
  }, 0),
  upgradeProd: (key) => Object.keys(DATA.upgrades).reduce((s, id) => {
    if (!gameState.stadium.upgrades[id]) return s;
    const tiers = (DATA.upgradeTiers[id] || []).slice(0, Selectors.upgradeTier(id));
    return s * (DATA.upgrades[id][key] || 1) * tiers.reduce((t, x) => t * (x[key] || 1), 1);
  }, 1),
  // Ukryta atrakcyjność promocyjna klubu (0–100): kibice, wyniki, liga, DNA, obiekty, media
  // Nastroje biznesowe po wynikach: passa zwycięstw napędza bilety, gadżety i catering, kryzys je dusi
  formFactor: () => {
    const form = (gameState.record && gameState.record.form) || [];
    let f = 1 + form.reduce((s, r) => s + (r === 'W' ? 0.05 : r === 'L' ? -0.05 : 0), 0);
    const last3 = form.slice(-3);
    if (last3.length === 3 && last3.every((r) => r === 'W')) f += 0.1;
    if (last3.length === 3 && last3.every((r) => r === 'L')) f -= 0.1;
    const t = gameState.season.table && gameState.season.table[US];
    if (t && t.p >= 3) { const n = Selectors.leagueSize(), pos = Selectors.ourPosition(); if (pos <= Math.ceil(n / 3)) f += 0.05; else if (pos > n - Math.ceil(n / 3)) f -= 0.05; }
    return Utils.clamp(f, 0.65, 1.4);
  },
  formLabel: () => { const f = Selectors.formFactor(); const pct = Math.round((f - 1) * 100); return (pct > 0 ? '+' : '') + pct + '%' + (pct >= 15 ? ' 🔥 passa' : pct <= -15 ? ' 🧊 kryzys' : ''); },
  weeksToMonth: () => 4 - (gameState.calendar.week % 4),
  passPolicy: () => DATA.passPolicies[(gameState.matchday.pass && gameState.matchday.pass.season === gameState.calendar.season && gameState.matchday.pass.policy) || 'brak'] || DATA.passPolicies.brak,
  passHolders: () => (gameState.matchday.pass && gameState.matchday.pass.season === gameState.calendar.season ? gameState.matchday.pass.holders : 0),
  // Prognoza karnetów: ilu kupi i ile wpłynie z góry (cena skaluje się z liczbą meczów u siebie)
  passForecast: (id) => {
    const pp = DATA.passPolicies[id];
    if (!pp || !pp.share) return { holders: 0, revenue: 0 };
    const homeGames = Math.max(1, Math.round((gameState.season.rounds || []).length / 2));
    const base = (25 + gameState.morale.fans * 1.1) * Selectors.econ();
    const holders = Math.min(Math.round(Selectors.stadiumCapacity() * 0.8), Math.round(base * pp.share * (gameState.club.character === 'suburban' && id === 'vip' ? 1.5 : 1)));
    const price = Math.round(pp.passPrice * homeGames / 9 / 5) * 5;
    return { holders, price, revenue: holders * price };
  },
  promo: () => {
    const t = gameState.season.table[US];
    const posScore = t && t.p ? Math.round((1 - (Selectors.ourPosition() - 1) / Math.max(1, Selectors.leagueSize() - 1)) * 27 + 3) : 15;
    const form = gameState.record.form.filter((r) => r === 'W').length * 2;
    const media = { neutral: 2, populist: 5, spicy: 3 }[Selectors.mediaStrategy()] || 0;
    return Math.round(Utils.clamp(gameState.morale.fans * 0.3 + posScore + gameState.club.leagueLevel * 5 + gameState.club.professionalism * 0.15
      + Selectors.upgradeSum('promo') + media + form + (Selectors.coachTrait('mediaStar') ? 6 : 0) + (Selectors.euroThisSeason() ? 10 : 0) + (Selectors.passPolicy().promo || 0) - gameState.club.scandals * 2, 0, 100));
  },
  sponsorDef: (id) => (id === 'local' ? DATA.localSponsor : DATA.sponsors[id] || Engine.customSponsor(id)),
  hasRealSponsor: () => !!gameState.sponsor.active && gameState.sponsor.active !== 'local',
  // Oferty widoczne na rynku: bazowi i nowi sponsorzy; spaleni znikają po 8 tygodniach
  sponsorOffers: () => {
    const s = gameState.sponsor;
    const week = gameState.calendar.week;
    return Object.keys(DATA.sponsors).concat(Object.keys(s.custom))
      .filter((id) => !s.burned.includes(id) || week - (s.burnedAt[id] != null ? s.burnedAt[id] : -99) < 8);
  },
  // Prognoza mediów i bukmacherów przed sezonem (zamrażana przy pierwszym meczu)
  seasonPreview: () => {
    if (gameState.season.preview && gameState.calendar.round > 0) return gameState.season.preview;
    const lineup = Engine.pickLineup([]);
    const ours = Engine.teamStrength(lineup, Engine.chemistry(lineup));
    const pos = 1 + gameState.league.rivals.filter((r) => (gameState.season.strength[r.name] || r.strength) > ours).length;
    const frac = (pos - 1) / Math.max(1, gameState.league.rivals.length);
    const stars = frac <= 0.12 ? 5 : frac <= 0.34 ? 4 : frac <= 0.56 ? 3 : frac <= 0.78 ? 2 : 1;
    const odds = (1.25 + frac * 13).toFixed(2);
    const quote = ['', '„Czarny koń? Raczej czarna owca. Spadek murowany.”', '„Walka o utrzymanie do ostatniej kolejki.”', '„Środek tabeli – i to będzie sukces.”', '„Ciemny koń ligi. Kibice mogą marzyć.”', '„Główny faworyt do awansu. Inni grają o drugie miejsce.”'][stars];
    return { pos, stars, odds, quote };
  },
  // Kryzys sportowy: seria porażek, brak wygranej od 5 meczów, strefa spadkowa albo dramatycznie mało punktów.
  // Drużyna w czołówce tabeli nigdy nie jest w kryzysie – wtedy nikt nie żąda głowy trenera.
  teamStruggling: () => {
    const t = gameState.season.table[US];
    if (!t || t.p < 3 || gameState.coach.id === 'mirek') return false;
    const n = Selectors.leagueSize(), pos = Selectors.ourPosition();
    if (pos <= Math.ceil(n / 3)) return false;
    const form = gameState.record.form || [];
    const last3 = form.slice(-3);
    const lossStreak = last3.length === 3 && last3.every((r) => r === 'L');
    const winless = form.length >= 5 && !form.includes('W');
    const zone = t.p >= 4 && ['down', 'downPO', 'last'].includes(Selectors.zoneOf(pos, n));
    const pointsCrisis = t.p >= 6 && t.pts / t.p < 0.85;
    return lossStreak || winless || zone || pointsCrisis;
  },
  crisisReason: () => {
    const t = gameState.season.table[US];
    const form = gameState.record.form || [];
    if (form.slice(-3).length === 3 && form.slice(-3).every((r) => r === 'L')) return 'trzy porażki z rzędu';
    if (form.length >= 5 && !form.includes('W')) return 'pięć meczów bez zwycięstwa';
    if (['down', 'downPO', 'last'].includes(Selectors.zoneOf(Selectors.ourPosition()))) return Selectors.ourPosition() + '. miejsce – strefa spadkowa';
    return t ? t.pts + ' pkt w ' + t.p + ' meczach' : 'słabe wyniki';
  },
  euroBid: () => { const p = gameState.squad.find((x) => x.id === gameState.cutscenes.targetId); return p ? Math.round((Selectors.sellPrice(p) * 3 + 20000 * Selectors.econ() * Selectors.euroComp().mult) / 1000) * 1000 : 0; },
  /* Skrzynka piwa i kiełbasa: im niższa liga i bardziej wiejski klub, tym większa szansa; wyżej – ryzyko afery */
  beerAllowed: () => gameState.club.leagueLevel <= 5,
  beerCost: () => Math.round(60 * (1 + (gameState.club.leagueLevel - 1) * 0.5) / 5) * 5,
  // Szansa, że zawodnik spokojnie przyjmie odmowę podwyżki: atmosfera, lojalność, wiek, poziom ligi
  // Szansa na foch szatni po zwolnieniu trenera: zależy od odprawy, wyników i tego, jak długo był w klubie
  fireFochChance: (withSeverance) => {
    const weeks = gameState.calendar.week - (gameState.coach.hiredWeek || 0);
    let c = (withSeverance ? 0.15 : 0.55) + Math.min(0.2, weeks / 100) - (Selectors.teamStruggling() ? 0.2 : 0);
    return Utils.clamp(c, 0.05, 0.8);
  },
  temperLabel: (p) => { const t = p.temper != null ? p.temper : 0.4; return t >= 0.7 ? '🔪 przecinak (często kartki)' : t >= 0.45 ? '💢 ostry w odbiorze' : t <= 0.2 ? '🎩 dżentelmen (rzadko kartki)' : '🙂 spokojny'; },
  // Ikona klubu: legenda z długim stażem albo ogromną liczbą meczów
  isClubIcon: (p) => p.legend && (p.seasons >= 6 || p.apps >= 100),
  veteranLevel: (p) => Utils.clamp(2 + Math.floor((p.apps || 0) / 80) + (p.goals >= 40 ? 1 : 0), 2, 5),
  // Sztab: realne i mierzalne efekty każdej roli
  assistantMult: () => 1 + Selectors.staffLevel('asystent') * 0.15,          // mnożnik jakości trenera
  fatiguePenalty: () => {
    // mecz w środku tygodnia (puchar, Europa) męczy – dobry fizjoterapeuta przyspiesza regenerację
    const mw = gameState.midweekWeek;
    if (!mw || gameState.calendar.week - mw > 1) return 0;
    return 0.06 * (1 - Selectors.staffLevel('fizjo') * 0.18);
  },
  directorSellBonus: () => (gameState.director && gameState.director.hired ? gameState.director.hired.level * 0.08 : 0),
  staffEffect: (slot) => {
    const l = Selectors.staffLevel(slot);
    if (!l) return '';
    if (Selectors.staffOutdated(slot)) return '🔻 Za słaby na ' + Selectors.leagueName() + ' – efekt o połowę, wymień na lepszego';
    if (slot === 'asystent') return 'Trener ×' + Selectors.assistantMult().toFixed(2) + ' skuteczności, +' + (l * 1.2).toFixed(1) + '% siły, szybszy rozwój młodych';
    if (slot === 'fizjo') return 'Kontuzje -' + Math.round(l * 17) + '%, krótsze leczenie, zmęczenie po meczach w tygodniu -' + Math.round(l * 18) + '%';
    if (slot === 'kierownik') return 'Nieobecności na meczach -' + Math.round(l * 12) + '%';
    if (slot === 'skaut') return 'Okazje na giełdzie: ' + Selectors.scoutBargainCount() + ' zawodn. taniej o ok. ' + Math.round((0.3 + l * 0.04) * 100) + '%';
    if (slot === 'masazysta') return 'Lepsza atmosfera w szatni';
    return '';
  },
  scoutBargainCount: () => { const l = Selectors.staffLevel('skaut'); return l ? Math.ceil(l / 2) : 0; },
  refusalAcceptChance: (p) => {
    let c = 0.5 + (gameState.morale.lockerRoom - 50) * 0.012;
    if (p && (p.favorite || p.legend)) c += 0.1;
    if (p && p.age >= 30) c += 0.08;
    if (p && p.tag === 'leader') c += 0.05;
    if (gameState.club.leagueLevel >= 7) c -= 0.15;   // zawodowcy mają agentów
    return Utils.clamp(c, 0.2, 0.9);
  },
  foodAllowed: (kind) => { const r = DATA.foodLevels[kind]; const l = gameState.club.leagueLevel; return !r || (l >= r[0] && l <= r[1]); },
  foodCost: (kind) => Math.max(10, Math.round(Selectors.beerCost() * (DATA.foods[kind] || DATA.foods.piwo).cost / 5) * 5),
  foodOdds: (kind, p, binary) => {
    const F = DATA.foods[kind] || DATA.foods.piwo;
    const o = Selectors.beerOdds(p);
    let ok = Utils.clamp(o.ok + F.ok + (kind === 'salceson' && p && p.age >= 28 ? 0.06 : 0) + (kind === 'golonka' && p && p.tag === 'party' ? -0.15 : 0), 0.02, 0.9);
    if (binary) ok *= 0.75;   // podwyżka „w naturze”: albo pełen sukces, albo afera – trudniej niż przy zwykłym prezencie
    const scandalShare = o.scandal / Math.max(0.01, 1 - o.ok);
    const scandal = Utils.clamp((1 - ok) * scandalShare * (kind === 'salceson' ? 1.2 : kind === 'smalec' ? 0.8 : 1), 0.03, 0.95);
    return { ok, scandal, refuse: Math.max(0, 1 - ok - scandal) };
  },
  beerOdds: (p) => {
    const lvl = gameState.club.leagueLevel;
    let ok = [0, 0.72, 0.6, 0.47, 0.33, 0.2, 0.1, 0.05, 0.02][Math.floor(lvl)] || 0.02;
    if (gameState.club.character === 'rural') ok += 0.08;
    ok -= Math.max(0, gameState.club.professionalism - 50) * 0.003;          // „profesjonalny” klub – wstyd tak załatwiać
    if (p) {
      ok -= Math.max(0, Selectors.ovr(p) - Selectors.teamOvr() - 3) * 0.02;  // lepszy zawodnik = większe wymagania
      if (p.age >= 30) ok += 0.08;                                           // weteran z okolicy machnie ręką
      if (p.age <= 20) ok -= 0.05;                                           // młodzi chcą kasy na telefon
      if (p.tag === 'party') ok += 0.1;
    }
    ok = Utils.clamp(ok, 0.02, 0.85);
    const scandal = Utils.clamp((1 - ok) * ([0, 0.18, 0.25, 0.35, 0.5, 0.65, 0.8, 0.9, 0.95][Math.floor(lvl)] || 0.9), 0.03, 0.9);   // wyżej = media czujniejsze
    return { ok, scandal, refuse: Math.max(0, 1 - ok - scandal) };
  },
  euroThisSeason: () => !!(gameState.euro && gameState.euro.season === gameState.calendar.season),
  euroLive: () => Selectors.euroThisSeason() && !gameState.euro.done,
  euroComp: (c) => DATA.euro.comps[c || (gameState.euro && gameState.euro.comp) || 'UCL'],
  // kolejka ligowa danego etapu (terminarz pucharów dopasowany do liczby kolejek)
  shopItems: () => { const lvl = (gameState.merch && gameState.merch.level) || 1; return DATA.shopLevels.slice(1, lvl + 1).flatMap((L) => L.items); },
  // Popyt na gadżet zależy od jego ceny względem bazowej
  merchDemand: (id) => Utils.clamp(Math.pow(DATA.merch[id].basePrice / Math.max(1, Engine.merchPrice(id)), 1.8), 0.08, 2.2),
  shopPriceIndex: () => { const it = Selectors.shopItems(); return it.reduce((s, id) => s + Engine.merchPrice(id), 0) / Math.max(1, it.reduce((s, id) => s + DATA.merch[id].basePrice, 0)); },
  // Kryzys finansowy: głęboki dług otwiera cięcia i wyprzedaż „po taniości”
  // Dług w relacji do zarobków: ile tygodni wszystkich przychodów klubu potrzeba na spłatę dziury i rat
  incomeWeekly: () => Math.max(60 * Selectors.econ(), gameState.finance.incomeAvg != null ? gameState.finance.incomeAvg : 300 * Selectors.econ()),
  debtHole: () => Math.max(0, -gameState.finance.budget) + gameState.loans.taken.reduce((s, l) => s + l.remaining * l.rate, 0),
  debtRatio: () => (gameState.finance.budget < 0 ? Selectors.debtHole() / Selectors.incomeWeekly() : 0),
  debtCrisis: () => gameState.finance.budget < Selectors.debtThresholds().warn,
  fireSalePrice: (p) => Math.max(10, Math.round((p.id === gameState.star.playerId ? Selectors.starFee(p) : Selectors.sellPrice(p)) * 0.45 / 10) * 10),
  budkaMenu: () => { const lvl = (gameState.budka && gameState.budka.level) || 1; return DATA.budka.levels.slice(1, lvl + 1).flatMap((L) => L.items); },
  budkaPrice: (id) => { const pr = gameState.budka && gameState.budka.prices[id]; return pr != null ? pr : DATA.budka.items[id].base; },
  budkaOpen: () => !!(gameState.stadium.upgrades && gameState.stadium.upgrades.kiosk),   // 13.85: budka po inwestycji „Blaszana budka u Szwagra”
  budkaCost: (id) => { const it = DATA.budka.items[id]; return it.meat && gameState.budka && gameState.budka.cheapMeat ? Math.max(1, Math.round(it.cost * 0.5)) : it.cost; },
  // Popyt na pozycję: cena względem „uczciwej” – za drogo kolejka znika, tanio schodzi szybciej
  budkaDemand: (id) => Utils.clamp(Math.pow(DATA.budka.items[id].base / Math.max(1, Selectors.budkaPrice(id)), 1.7), 0.12, 1.8),
  budkaPriceIndex: () => { const m = Selectors.budkaMenu(); return m.reduce((s, id) => s + Selectors.budkaPrice(id), 0) / Math.max(1, m.reduce((s, id) => s + DATA.budka.items[id].base, 0)); },
  // Zgoda zawodnika na transfer: gwiazdy ponad poziom klubu wybrzydzają (pomaga sława klubu i dobre nastroje)
  signChance: (p) => {
    const over = Selectors.ovr(p) - Selectors.teamOvr();
    if (over < 6) return 1;
    return Utils.clamp(0.85 - (over - 6) * 0.07 + (gameState.morale.fans - 50) / 300 + (Selectors.euroThisSeason() ? 0.1 : 0), 0.15, 0.95);
  },
  // Prestiż klubu przyciąga lepszych fachowców: trofea, kibice, stadion, Europa
  loansAll: () => (gameState.loansOut || []).map((l) => ({ ...l, junior: false })).concat((gameState.u19Loans || []).map((l) => ({ ...l, junior: true }))),
  clubPrestige: () => {
    const t = (gameState.trophies || []).length;
    const pts = Math.min(3, t * 0.5) + (gameState.morale.fans >= 70 ? 0.5 : 0) + (gameState.stadium.level || 0) * 0.25 + (Selectors.euroThisSeason() ? 1 : 0);
    return Math.round(pts * 10) / 10;
  },
  prestigeBonus: () => (Selectors.clubPrestige() >= 2 ? 1 : 0),
  // Najwyższy poziom fachowca, który zechce przyjść do klubu (liga + prestiż)
  staffCap: (kind) => {
    const l = gameState.club.leagueLevel, b = Selectors.prestigeBonus();
    if (kind === 'director') return Utils.clamp(1 + Math.floor((l - 1) / 2) + b, 1, 4);
    if (kind === 'u19') return Utils.clamp(1 + Math.floor((l - 1) / 3) + b, 1, 3);
    return Utils.clamp(1 + Math.floor((l - 1) * 0.6) + b, 1, 5);
  },
  // Liga, od której fachowiec danego poziomu przychodzi (bez premii za prestiż)
  staffFromLeague: (kind, level) => { for (let l = 1; l <= 8; l++) { const cap = kind === 'director' ? 1 + Math.floor((l - 1) / 2) : kind === 'u19' ? 1 + Math.floor((l - 1) / 3) : 1 + Math.floor((l - 1) * 0.6); if (cap >= level) return DATA.leagueLevels[l].name; } return DATA.leagueLevels[8].name; },
  // Dziury w składzie: ilu brakuje na pozycji i jak słaby jest najsłabszy z wyjściowej jedenastki
  squadNeeds: () => {
    const min = { GK: 2, DEF: 6, MID: 6, FWD: 4 }, xi = { GK: 1, DEF: 4, MID: 4, FWD: 2 };
    const team = Selectors.teamOvr();
    const out = {};
    Object.keys(min).forEach((pos) => {
      const list = gameState.squad.filter((p) => p.pos === pos && !p.loan && !p.exiled).map((p) => Selectors.ovr(p)).sort((a, b) => b - a);
      const short = Math.max(0, min[pos] - list.length);
      const starters = list.slice(0, xi[pos]);
      const weakest = starters.length < xi[pos] ? 0 : starters[starters.length - 1];
      const avg = starters.length ? starters.reduce((a, b) => a + b, 0) / starters.length : 0;
