    if (c.favScorers.length) extra.push(['grazynka', c.favScorers[0] + ' znowu strzelił! Dziś mortadela dla niego gratis 🥩']);
    // Zawsze jest o czym pogadać pod sklepem
    extra.push(Utils.rand([
      ['wyjadacz', 'Sędzia dziś jak zwykle: widział tylko to, co chciał. Czyli nic.'],
      ['soltys', 'Dziękuję wszystkim za doping. Proszę nie parkować na trawniku przy kościele.'],
      ['grazynka', 'Po meczu kiełbasa -20%! Kto pierwszy, ten lepszy 🌭'],
      ['portal', 'Relacja z meczu ' + club + ' – ' + c.rival + ' już na naszym portalu. Zdjęcia robił wnuczek pani Krysi.'],
    ]));
    // Post o wyniku już poszedł; dokładamy 1–2 komentarze (afery i derby mają pierwszeństwo).
    const limit = Math.min(3, Math.max(Utils.randInt(1, 2), must.length));
    must.concat(Utils.shuffle(extra)).slice(0, limit).forEach(([who, text]) => {
      if (who.startsWith('@')) Engine.xPostRaw('😤', who, text);
      else Engine.xPost(who, text);
    });
  },

  // Strategia medialna: raz na sezon
  setMediaStrategy(id) {
    const x = gameState.x;
    const st = DATA.mediaStrategies[id];
    if (!st || x.strategySeason === gameState.calendar.season) return false;
    x.strategy = id;
    x.strategySeason = gameState.calendar.season;
    gameState.pendingDecisions = gameState.pendingDecisions.filter((d) => d !== 'mediaStrategy');
    Engine.addLog('📱 Strategia medialna na sezon ' + gameState.calendar.season + ': ' + st.icon + ' ' + st.label + '.', 'decision');
    Engine.mediaPost();
    return true;
  },

  // Post z profilu klubu w tonie strategii (bez kosztów i efektów – sam klimat feedu)
  mediaPost() {
    const st = DATA.mediaStrategies[Selectors.mediaStrategy()];
    const t = DATA.xTones[st.tone];
    const fx = Selectors.currentFixture();
    const text = st.tone === 'humble' ? Utils.rand(t.texts)
      : st.tone === 'hype' ? Utils.rand(t.texts)(fx.rival)
      : t.texts[Selectors.rival(fx.rival).derby ? 'rival' : Utils.rand(['ref', 'union'])](fx.rival);
    Engine.xPost('official', text, true);
  },

  /* ----- Telefony z szatni ----- */
  // Po podwyżkę dzwonią tylko ci, którzy wyraźnie przerastają drużynę albo błyszczą formą – albo gdy klubowi wyraźnie się powodzi.
  maybeLockerCall() {
    const c = gameState.calls;
    const suburban = gameState.club.character === 'suburban';   // letnicy płacą więcej, to i chłopaki wołają częściej
    if (gameState.pendingDecisions.includes('wageDemand') || gameState.calendar.week - c.lastWeek < (suburban ? 7 : 9)) return;
    const lineup = Engine.pickLineup([]);
    if (!lineup.length) return;
    const avgSkill = lineup.reduce((s, p) => s + p.skill, 0) / lineup.length;
    const e = Selectors.econ();
    const rep = gameState.lastReport;
    const clubBoom = gameState.record.winStreak >= 3 || (rep && rep.total >= 500 * e) || gameState.finance.budget >= 5000 * e
      || (gameState.calendar.round <= 2 && ['promo', 'title'].includes(gameState.lastSeason.outcome));
    const shining = (p) => p.skill >= avgSkill + 1.5 || (p.lastRating != null && p.lastRating >= 7.8) || (Selectors.avgRating(p) != null && p.seasonRatingCount >= 3 && Selectors.avgRating(p) >= 7);
    let pool = gameState.squad.filter((p) => lineup.includes(p) && shining(p));
    if (!pool.length && clubBoom) pool = gameState.squad.filter((p) => p.favorite || (lineup.includes(p) && p.skill >= avgSkill + 0.5));
    if (!pool.length || Math.random() > (suburban ? 0.45 : 0.35)) return;
    const p = Utils.rand(pool);
    const partner = Math.random() < 0.4;
    Object.assign(c, {
      lastWeek: gameState.calendar.week, playerId: p.id,
      caller: partner ? 'partner' : 'self', callerName: partner ? Utils.rand(DATA.partners) : '',
      rival: Utils.rand(gameState.league.rivals).name,
    });
    Engine.pushDecision('wageDemand');
  },

  /* ----- Cut-scenki: losowe filmowe sceny z trudną decyzją ----- */
  maybeCutscene() {
    const cs = gameState.cutscenes;
    if (gameState.calendar.week - cs.lastWeek < 8 || gameState.pendingDecisions.some((id) => DATA.decisions[id].cutscene)) return;
    if (Math.random() > 0.15) return;
    const pool = Object.keys(DATA.decisions).filter((id) => {
      const d = DATA.decisions[id];
      const lvl = gameState.club.leagueLevel;
      const okLevel = !d.levels || (lvl >= d.levels[0] && lvl <= d.levels[1]);   // scenki dopasowane do klasy rozgrywkowej
      return d.cutscene && !d.cutscene.scripted && okLevel && !cs.recent.includes(id) && (!d.available || d.available());
    });
    if (!pool.length) return;
    const id = Utils.rand(pool);
    if (DATA.decisions[id].prepare) DATA.decisions[id].prepare();
    cs.lastWeek = gameState.calendar.week;
    cs.recent = [id].concat(cs.recent).slice(0, 8);
    Engine.pushDecision(id);
  },

  /* ----- Ciemna strona: „Spółdzielnia” ----- */
  maybePassat() {
    const d = gameState.dark;
    // Rzadki smaczek na kryzys: najwyżej raz w sezonie, długa przerwa, tylko gdy coś się pali
    if (d.fixed || d.offersThisSeason >= 1 || gameState.calendar.week - d.lastOfferWeek < 12) return;
    const kolejka = gameState.calendar.round + 1;
    const t = gameState.season.table[US];
    const contender = t && t.p > 0 && Selectors.ourPosition() <= 3;
    const crisis = gameState.finance.budget < 0 || (kolejka >= gameState.season.rounds.length * 0.75 && t && t.p > 0 && (contender || Selectors.ourPosition() >= Selectors.leagueSize() - 1));
    if (!crisis || Math.random() > 0.15) return;
    d.lastOfferWeek = gameState.calendar.week;
    d.offersThisSeason++;
    Engine.pushDecision(contender && gameState.finance.budget >= Selectors.passatBuyAmount() ? 'passatBuy' : 'passatSell');
  },

  resolveDarkDeal() {
    const d = gameState.dark;
    if (!d.fixed) return;
    const kind = d.fixed;
    d.fixed = null;
    Engine.addLog(kind === 'sell'
      ? '🎭 Bramkarz trzy razy „poślizgnął się na mokrej trawie”. Było sucho. Kibice drapią się po głowach.'
      : '🎭 Sędzia widział dziś wszystko. Szczególnie to, czego nie było. Rywale wściekli.', 'event');
    if (!d.risky) return;
    d.risky = false;
    if (Math.random() < Selectors.aferaRisk()) {
      const c = gameState.club;
      c.corruptionCaught++;
      const fine = Math.round(1000 * Selectors.econ() * c.corruptionCaught);
      const points = c.corruptionCaught >= 2 ? 6 : 3;
      Engine.addScandal('AFERA KORUPCYJNA – nagranie z czarnego Passata');
      Engine.applyEffects({ fans: -20, lockerRoom: -10 });
      Engine.money('Kara Związku: afera korupcyjna', -fine);
      Engine.shiftDNA(-20);
      gameState.season.table[US].pts -= points;
      Engine.xPost('portal', 'AFERA W ' + Selectors.leagueName().toUpperCase() + '! Nagranie z dyktafonu: „reklamówka z Biedronki”, „nikt się nie dowie”. Związek odejmuje ' + Selectors.clubDisplayName() + ' ' + points + ' pkt i nakłada ' + Utils.formatMoney(fine) + ' kary! 🎙️');
      Engine.addLog('🎙️ AFERA! Ktoś nagrał rozmowę z panem z Passata dyktafonem z Pepco. Związek: -' + points + ' pkt i ' + Utils.formatMoney(fine) + ' kary. Kibice wściekli. [kibice -20%, szatnia -10%]', 'event');
      if (Selectors.hasRealSponsor()) Engine.endSponsor('💨 Sponsor ' + Selectors.sponsor().name + ' ucieka po aferze: „Nie będziemy się tłumaczyć prokuratorowi z waszych reklamówek”.');
      if (c.corruptionCaught >= 3) {
        Engine.gameOver('Trzecia afera korupcyjna. Wydział Dyscypliny zawiesił cały zarząd, a prokuratura zabezpieczyła czarnego Passata i reklamówkę z Biedronki jako dowody.');
      } else if (c.corruptionCaught === 2) {
        gameState.season.promotionBan = true;
        if (gameState.club.leagueLevel > 1) gameState.season.forcedRelegation = true;
        Engine.addLog('⛔ DRUGA WPADKA W KARIERZE! Zakaz awansu w tym sezonie' + (gameState.club.leagueLevel > 1 ? ' i przymusowa degradacja po sezonie' : '') + '. Nad zarządem wisi widmo zawieszenia – trzecia wpadka i koniec.', 'system');
      }
    } else {
      Engine.addLog('🤫 Nikt niczego nie nagrał. Na razie.', 'event');
    }
  },

  /* ----- Sklepik ----- */
  merchPrice(itemId) {
    return Math.round(DATA.merch[itemId].basePrice * DATA.merchMarkups[gameState.merch.markup].priceMod);
  },

  orderMerch(itemId) {
    const item = DATA.merch[itemId];
    if (!item || gameState.finance.budget < item.batch * item.unitCost) return;
    const cost = item.batch * item.unitCost;
    Engine.money('Zamówienie: ' + item.label, -cost);
    gameState.merch.stock[itemId] += item.batch;
    Engine.addLog('📦 Zamówiono ' + item.batch + ' szt. „' + item.label + '” za ' + Utils.formatMoney(cost) + '. Karton stoi w szatni, zawodnicy już przymierzają.', 'finance');
  },

  /* ----- Sponsor ----- */
  // Sponsor z puli: zapisany jako dane, warunek zerwania odtwarzany z „kind” i „threshold”
  customSponsor(id) {
    const c = gameState.sponsor.custom[id];
    if (!c) return null;
    const req = c.kind === 'fans' ? 'Zrywa, gdy Zadowolenie Kibiców spadnie poniżej ' + c.threshold + '%.'
      : c.kind === 'losses' ? 'Zrywa po ' + c.threshold + ' porażkach z rzędu.'
      : 'Zrywa po ' + c.threshold + (c.threshold === 1 ? ' skandalu' : ' skandalach') + ' w trakcie umowy.';
    return {
      ...c, signEffects: {}, requirement: req,
      breaks: (s) => (c.kind === 'fans' ? s.morale.fans < c.threshold : c.kind === 'losses' ? s.record.lossStreak >= c.threshold : s.club.scandals - s.sponsor.scandalsAtSign >= c.threshold),
      breakLog: '„' + c.name + '” zrywa umowę: „Nie tak się umawialiśmy, Prezesie”.',
    };
  },

  // Rynek sponsorów: spaleni znikają po 8 tygodniach, a wolne miejsca zajmują nowi – warunki zależą od atrakcyjności klubu
  refreshSponsors(force = false) {
    const s = gameState.sponsor;
    const week = gameState.calendar.week;
    Object.keys(s.custom).forEach((id) => { if (s.custom[id].expires && week >= s.custom[id].expires && s.active !== id) delete s.custom[id]; });
    const available = Selectors.sponsorOffers().filter((id) => !s.burned.includes(id) && id !== s.active && id !== 'local');
    if (!force && available.length >= 2) return;
    const used = Object.values(s.custom).map((c) => c.name).concat(Object.values(DATA.sponsors).map((x) => x.name));
    const pool = DATA.sponsorPool.filter((t) => !used.includes(t.name));
    const promo = Selectors.promo();
    for (let i = available.length; i < 3 && pool.length; i++) {
      const t = pool.splice(Utils.randInt(0, pool.length - 1), 1)[0];
      s.gen = (s.gen || 0) + 1;
      const id = 'g' + s.gen;
      s.custom[id] = { id, name: t.name, kind: t.kind, threshold: t.threshold, stadiumName: t.stadiumName, clubPrefix: t.clubPrefix, pitch: t.pitch,
        weekly: Math.round(t.base * (0.55 + promo / 90)), expires: week + 26 };
      Engine.addLog('📨 Nowa oferta sponsorska: „' + t.name + '”.', 'finance');
    }
  },

  // W klubie zawsze jest przynajmniej jeden sponsor – w razie potrzeby lokalny, symboliczny
  ensureSponsor() {
    const s = gameState.sponsor;
    if (s.active) return;
    s.active = 'local';
    s.signedWeek = gameState.calendar.week;
    s.scandalsAtSign = gameState.club.scandals;
    Engine.addLog('🛒 Pani Grażynka ze sklepu „U Grażynki” zostaje sponsorem klubu: „Bez umowy, ale coś zawsze dorzucę”.', 'finance');
  },

  signSponsor(id) {
    const sp = Selectors.sponsorDef(id);
    const s = gameState.sponsor;
    if (!sp || sp.fallback || Selectors.hasRealSponsor() || s.burned.includes(id)) return;
    if (s.active === 'local') Engine.addLog('🛒 Pani Grażynka ustępuje miejsca większemu sponsorowi. „Jakby co – jestem w sklepie.”', 'finance');
    s.active = id;
    s.signedWeek = gameState.calendar.week;
    s.scandalsAtSign = gameState.club.scandals;
    Engine.applyEffects(sp.signEffects);
    Engine.addLog('🤝 Podpisano umowę sponsorską z: ' + sp.name + ' (' + Utils.formatMoney(Selectors.sponsorWeekly(sp)) + '/tydz.).' + Engine.describeEffects(sp.signEffects), 'finance');
  },

  endSponsor(logText) {
    const s = gameState.sponsor;
    if (!Selectors.hasRealSponsor()) return;   // lokalnego sponsora nie da się zerwać
    s.burned.push(s.active);
    s.burnedAt[s.active] = gameState.calendar.week;
    s.active = null;
    Engine.addLog(logText, 'event');
    Engine.ensureSponsor();
  },

  /* ----- Pożyczki ----- */
  // Gospodarka innych klubów: kasa i obrót tworzone przy pierwszym użyciu
  clubEco(name) {
    if (!gameState.economy) gameState.economy = {};
    let ec = gameState.economy[name];
    if (!ec) {
      const str = (gameState.season.strength && gameState.season.strength[name]) || Selectors.rival(name).strength || 1.3;
      const e = Selectors.econ();
      ec = gameState.economy[name] = { cash: Math.round(Utils.randRange(1200, 3500) * e * (str / 1.3)), income: Math.round((220 + str * 120) * e), loan: null, crisis: false };
    }
    return ec;
  },

  // Co tydzień: wyniki i obroty zmieniają kasę rywali; w dołku biorą pożyczki, bogaci inwestują w skład, zadłużeni słabną
  leagueEconomyTick() {
    const e = Selectors.econ();
    const s = gameState.season;
    gameState.league.rivals.forEach((r) => {
      const ec = Engine.clubEco(r.name);
      const res = (s.lastResults || []).find((m) => m.home === r.name || m.away === r.name);
      let delta = Math.round(ec.income * Utils.randRange(-0.3, 0.3));
      if (res && Selectors.isMatchWeek()) {
        const gf = res.home === r.name ? res.hg : res.ag, ga = res.home === r.name ? res.ag : res.hg;
        delta += gf > ga ? Math.round(60 * e) : gf < ga ? -Math.round(60 * e) : 0;
        // miejsce w tabeli: czołówka przyciąga kibiców i sponsorów, dół traci
        const pos = Selectors.standings().findIndex((x) => x.team === r.name) + 1;
        const n = Selectors.leagueSize();
        if (pos) delta += Math.round(((n + 1) / 2 - pos) * 12 * e * 10 / n);
      }
      if (Math.random() < 0.03) {   // nieprzewidziany wydatek: kara, remont, zaległy ZUS
        const hit = Math.round(Utils.randInt(600, 2000) * e);
        delta -= hit;
        if (Math.random() < 0.4) Engine.xPost('portal', r.name + ': ' + Utils.rand(['kara Związku', 'zalany blaszak', 'zaległy ZUS', 'spalony bus']) + ' kosztuje klub ' + Utils.formatMoney(hit) + '. 😬');
      }
      delta -= Math.round(ec.cash * 0.04);   // bogaci wydają więcej, zadłużeni tną koszty
      ec.cash += delta;
      if (ec.loan) {
        ec.cash -= ec.loan.rate;
        if (--ec.loan.remaining <= 0) ec.loan = null;
      }
      const credit = Selectors.clubCredit(r.name);
      if (!ec.loan && ec.cash < 200 * e && credit >= 0.1) {
        const amount = Math.round(1500 * e * Utils.clamp(credit, 0.25, 2.5) / 50) * 50;
        ec.loan = { amount, remaining: 10, rate: Math.ceil(amount * (1.2 + Math.max(0, 1 - credit) * 0.15) / 10 / 5) * 5 };
        ec.cash += amount;
        if (Math.random() < 0.5) Engine.xPost('portal', r.name + ' ratuje się pożyczką ' + Utils.formatMoney(amount) + '. Prezes zapewnia, że „to tylko chwilowo”. 💸');
      }
      const str = s.strength[r.name] || r.strength;
      if (ec.cash > 3500 * e && Math.random() < 0.1) {
        ec.cash -= Math.round(1500 * e);
        s.strength[r.name] = Math.min(r.strength + 0.35, str + 0.04);
        Engine.xPost('portal', r.name + ' sypie groszem: nowi zawodnicy i nowe stroje. Rywale mają się czego bać. 💰');
      }
      const crisis = ec.cash < -1500 * e;
      if (crisis) s.strength[r.name] = Math.max(0.8, str - 0.01);
      else if (ec.cash > 0 && str < r.strength) s.strength[r.name] = Math.min(r.strength, str + 0.005);   // po wyjściu z długów klub wraca do formy
      if (crisis && !ec.crisis) Engine.xPost('portal', 'Kryzys w ' + r.name + '! Zawodnicy bez wypłat, prezes nie odbiera telefonu. 📉');
      ec.crisis = crisis;
    });
  },

  takeLoan(id) {
    const l = DATA.lenders[id];
    const o = Selectors.loanOffer(id);
    if (!l || !o.available) return;
    if (l.club) Engine.clubEco(l.club).cash -= o.amount;   // prezes pożycza z kasy swojego klubu
    gameState.loans.taken.push({ id, remaining: o.installments, rate: o.rate, amount: o.amount });
    Engine.money('Pożyczka: ' + l.name, o.amount);
    Engine.addLog('💸 ' + l.name + ' pożyczył ' + Utils.formatMoney(o.amount) + '. Spłata: ' + o.installments + ' rat po ' + Utils.formatMoney(o.rate) + '. ' + l.note, 'finance');
  },

  lendMoney(id) {
    const b = DATA.borrowers[id];
    if (!b) return;
    const o = Selectors.borrowOffer(id);
    if (gameState.loans.given.some((x) => x.id === id) || gameState.finance.budget < o.amount) return;
    gameState.loans.given.push({ id, dueWeek: gameState.calendar.week + b.weeks, amount: o.amount, returns: o.returns, risk: o.risk, delays: 0 });
    Engine.clubEco(b.club).cash += o.amount;
    Engine.money('Pożyczono: ' + b.name, -o.amount);
    Engine.addLog('🤝 Pożyczono ' + Utils.formatMoney(o.amount) + ' – ' + b.name + '. Ma oddać ' + Utils.formatMoney(o.returns) + ' za ' + b.weeks + ' tyg. Przybił piątkę, więc na pewno odda.', 'finance');
  },

  /* ----- Infrastruktura ----- */
  buildStadium() {
    const st = gameState.stadium;
    const next = DATA.stadiumLevels[(st.level || 0) + 1];
    if (!next || gameState.finance.budget < next.cost) return;
    Engine.money('Rozbudowa stadionu: ' + next.name, -next.cost);
    st.level = (st.level || 0) + 1;
    Engine.applyEffects({ fans: +4 });
    Engine.addLog('🏗️ Rozbudowa stadionu: ' + next.name + ' (' + next.capacity + ' miejsc). Wójt przeciął wstęgę nożyczkami z sekretariatu. [kibice +4%]', 'finance');
  },

  buyUpgrade(id) {
    const u = DATA.upgrades[id];
    const cost = Selectors.upgradeCost(id);
    if (!u || gameState.stadium.upgrades[id] || gameState.finance.budget < cost) return;
    Engine.money('Inwestycja: ' + u.label, -cost);
    gameState.stadium.upgrades[id] = true;
    if (id === 'roller') gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch + 30, 0, 100);
    if (id === 'boiler') Engine.applyEffects({ lockerRoom: +8 });
    Engine.addLog('🔧 Inwestycja: ' + u.label + ' (' + Utils.formatMoney(cost) + '). Pan Heniek mówi, że „takiego luksusu tu nie było od Gierka”.', 'finance');
  },

  // Hooki wykonywane po kliknięciu [NASTĘPNY TYDZIEŃ], po kolei.
  // Rozliczają bieżący tydzień, a na końcu przesuwają kalendarz.
  weeklyHooks: [
    function openReport() {
      gameState.report = { week: gameState.calendar.week, lines: [], homeMatch: false, result: null };
    },
    function rollFlavor() {
      const entry = Utils.rand(DATA.weeklyFlavor);
      Engine.applyEffects(entry.effects, 'Zdarzenia losowe');
      Engine.addLog(entry.text + Engine.describeEffects(entry.effects), entry.effects ? 'event' : 'flavor');
    },
    function matchday() {
      if (Selectors.isMatchWeek()) Engine.playMatchday();
    },
    function mediaStrategyTick() {
      // Pasywny wpływ strategii medialnej (bez cotygodniowego postowania)
      const id = Selectors.mediaStrategy();
      const w = gameState.calendar.week;
      if (w % 2 === 0) Engine.mediaPost();
      if (id === 'neutral' && w % 4 === 0 && gameState.club.professionalism < 40) Engine.shiftDNA(+1);
      if (id === 'spicy') {
        if (w % 4 === 0) Engine.shiftDNA(-1);
        const fx = Selectors.currentFixture();
        if (Selectors.isMatchWeek() && Selectors.rival(fx.rival).derby) Engine.applyEffects({ lockerRoom: +3 });
        if (Math.random() < 0.08) {
          const fine = Math.round(300 * Selectors.econ());
          Engine.money('Kara OZPN: wpis na Wirtualnym X', -fine);
          Engine.addLog('⚖️ Wydział Dyscypliny OZPN ukarał klub za „zadziorny” wpis na X: ' + Utils.formatMoney(fine) + '.', 'event');
        }
      }
    },
    function leagueEconomy() {
      Engine.leagueEconomyTick();
    },
    function socialFeed() {
      const ctx = gameState.report.matchCtx;
      if (ctx) Engine.matchPosts(ctx);
      else if (Math.random() < 0.6) { const [who, text] = Utils.rand(DATA.xGossip); Engine.xPost(who, text); }
    },
    function merchSales() {
      const m = gameState.merch;
      const markup = DATA.merchMarkups[m.markup];
      const favorites = gameState.squad.filter((p) => p.favorite).length;
      const parts = [];
      let income = 0;
      Object.keys(DATA.merch).forEach((id) => {
        if (m.stock[id] <= 0) return;
        const item = DATA.merch[id];
        let d = item.demand * Math.sqrt(Selectors.econ()) * (0.4 + gameState.morale.fans / 60) * markup.demandMod * Utils.randRange(0.5, 1.5);
        if (item.favoriteBoost) d *= 1 + 0.25 * Math.min(favorites, 4);   // koszulki z nazwiskiem ulubieńca
        d *= Selectors.upgradeProd('merch');                                // tablica wyników, sklep z witryną
        if (gameState.report.result === 'W') d *= 1.5;
        if (gameState.report.homeMatch) d *= 1.4;
        const sold = Math.min(m.stock[id], Math.floor(d) + (Math.random() < d % 1 ? 1 : 0));
        if (sold <= 0) return;
        m.stock[id] -= sold;
        m.soldTotal += sold;
        income += sold * Engine.merchPrice(id);
        parts.push(item.label + ' ×' + sold);
      });
      if (income > 0) {
        Engine.money('Sklepik fanowski', income);
        Engine.addLog('🛍️ Sklepik: ' + parts.join(', ') + ' → ' + Utils.formatMoney(income) + '.', 'finance');
      }
    },
    function sponsorIncome() {
      // Gmina dokłada do sportu zawsze – mało, ale regularnie (wyżej: miasto, województwo)
      Engine.money('Dotacja gminna na sport', Math.round(CONFIG.municipalGrant * Selectors.econ()));
      const s = gameState.sponsor;
      Engine.ensureSponsor();
      Engine.refreshSponsors();
      const sp = Selectors.sponsorDef(s.active);
      if (sp.breaks(gameState)) Engine.endSponsor('❌ ' + sp.breakLog);   // zerwał – od razu wchodzi lokalny sponsor
      const payer = Selectors.sponsor();
      if (payer !== sp) { Engine.money('Sponsor: ' + payer.name, Selectors.sponsorWeekly(payer)); return; }
      Engine.money('Sponsor: ' + sp.name, Selectors.sponsorWeekly(sp));
      Engine.addLog('💼 Sponsor „' + sp.name + '”: ' + Utils.formatMoney(Selectors.sponsorWeekly(sp)) + ' wpłynęło na konto (a raczej przyszło w kopercie).', 'finance');
    },
    function payroll() {
      const players = Selectors.squadWages();
      const coach = Selectors.coachWeekly();
      const staff = Selectors.staffWages();
      Engine.money('Zawodnicy (paliwo, skrzynki, stypendia)', -players);
      Engine.money('Pensja trenera', -coach);
      Engine.money('Sztab pomocniczy', -staff);
      Engine.addLog('💵 Wypłaty: zawodnicy ' + Utils.formatMoney(players) + (coach ? ', trener ' + Utils.formatMoney(coach) : '') + (staff ? ', sztab ' + Utils.formatMoney(staff) : '') + '. Koperty rozdawał pan Rysiek w szatni.', 'finance');
    },
    function loansTick() {
      const L = gameState.loans;
      L.taken.forEach((loan) => {
        const lender = DATA.lenders[loan.id];
        if (gameState.finance.budget < loan.rate) Engine.addScandal(lender.name + ' rozpowiada po wsi, że klub nie ma na raty');
        Engine.money('Rata: ' + lender.name, -loan.rate);
        if (lender.club) Engine.clubEco(lender.club).cash += loan.rate;
        loan.remaining--;
        if (loan.remaining === 0) Engine.addLog('✅ Spłacono ostatnią ratę – ' + lender.name + '. Na pożegnanie postawił flaszkę.', 'finance');
      });
      L.taken = L.taken.filter((l) => l.remaining > 0);

      L.given = L.given.filter((loan) => {
        if (gameState.calendar.week < loan.dueWeek) return true;
        const b = DATA.borrowers[loan.id];
        const ec = Engine.clubEco(b.club);
        const broke = ec.cash < loan.returns && Math.random() < 0.5;   // pusta kasa w jego klubie = kolejna wymówka
        if (!broke && Math.random() >= loan.risk) {
          ec.cash -= loan.returns;
          Engine.money('Zwrot pożyczki: ' + b.name, loan.returns);
          Engine.addLog('💰 ' + b.name + ' oddał ' + Utils.formatMoney(loan.returns) + '. Z procentem! Cuda się zdarzają.', 'finance');
          return false;
        }
        loan.delays++;
        if (loan.delays >= 3) {
          const half = Math.round((loan.amount || DATA.borrowers[loan.id].amount) / 2);
          ec.cash -= half;
          Engine.money('Odzysk długu: ' + b.name, half);
          Engine.addLog('🥔 ' + b.name + ' w końcu „rozliczył się”: ' + Utils.formatMoney(half) + ' i worek ziemniaków. Reszta przepadła.', 'finance');
          return false;
        }
        loan.dueWeek += 2;
        loan.risk = Math.min(0.9, loan.risk + 0.15);
        Engine.addLog('🙄 ' + b.name + ' ' + Utils.rand(DATA.debtorExcuses) + ' Nowy termin: Tydzień ' + loan.dueWeek + '.', 'event');
        return true;
      });
    },
    function fixedCosts() {
      const e = Selectors.econ();
      const lime = Math.round(Utils.randInt(15, 25) * e * (gameState.club.character === 'rural' ? 0.8 : 1)), power = Math.round(Utils.randInt(20, 35) * e), laundry = Math.round(Utils.randInt(25, 40) * e);
      Engine.money('Koszty stałe (wapno, prąd, pranie)', -(lime + power + laundry));
      Engine.addLog('🧾 Koszty stałe: wapno do linii ' + lime + ' zł, prąd w blaszaku ' + power + ' zł, pranie strojów u pani Krysi ' + laundry + ' zł.', 'finance');
    },
    function stadiumUpkeep() {
      gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch + 3 + Selectors.upgradeSum('pitchRegen'), 0, 100);
    },
    function squadTopUp() {
      // Za mało ludzi? Trener łapie kogoś spod sklepu.
      while (gameState.squad.length < CONFIG.minSquad) {
        const p = Engine.generatePlayer({ ageMin: 18, ageMax: 34, skillMin: 2 + Selectors.levelSkillBonus(), skillMax: 4 + Selectors.levelSkillBonus(), wageMin: 5, wageMax: Math.round(10 * Selectors.econ()) });
        Engine.addLog('🙋 Z łapanki spod sklepu: ' + Selectors.playerName(p) + ' (' + p.age + ' l.). „Grałem kiedyś w trampkarzach, to się nada.”', 'event');
      }
    },
    function starRebellion() {
      Engine.starTick();
      // kontuzje się goją; dobry fizjoterapeuta czasem przyspiesza powrót o tydzień
      const fizjo = Selectors.staffLevel('fizjo');
      gameState.squad.forEach((p) => {
        if (!(p.injured > 0)) return;
        p.injured -= fizjo >= 3 && p.injured > 1 && Math.random() < fizjo * 0.08 ? 2 : 1;
        if (p.injured <= 0) { p.injured = 0; delete p.injuryLabel; }
      });
    },
    function moraleDrift() {
      const drift = (v, target) => (v < target ? v + 1 : v > target ? v - 1 : v);
      gameState.morale.lockerRoom = drift(gameState.morale.lockerRoom, Selectors.lockerBaseline());
      gameState.morale.fans = drift(gameState.morale.fans, 50);
    },
    function debts() {
      Engine.debtCheck();
    },
    function closeReport() {
      const rep = gameState.report;
      rep.total = rep.lines.reduce((sum, l) => sum + l.amount, 0);
      rep.budgetAfter = gameState.finance.budget;
      Engine.addLog('📊 Bilans tygodnia: ' + Utils.signedMoney(rep.total) + '. Stan konta: ' + Utils.formatMoney(rep.budgetAfter) + '.', 'summary');
      if (gameState.finance.budget < 0) Engine.addLog('⚠️ Konto na minusie! Pani z Banku Spółdzielczego dzwoni trzeci raz. Prezes udaje, że nie ma zasięgu.', 'event');
      gameState.lastReport = rep;
      gameState.report = null;
    },
    function advanceCalendar() {
      gameState.calendar.week += 1;
      gameState.weather = Utils.rand(DATA.weather);
    },
    function scoutReturn() {
      const sc = gameState.scouting;
      if (sc.missionReturnWeek && gameState.calendar.week >= sc.missionReturnWeek) Engine.scoutReport();
    },
    function scheduleDecisions() {
      if (!Selectors.isMatchWeek()) return;
      if (gameState.calendar.round === 0) Engine.offerTicketPolicy();   // cennik biletów na sezon
      if (gameState.calendar.round === 0 && !Selectors.strategyLocked()) Engine.pushDecision('mediaStrategy');
      const fx = Selectors.currentFixture();
      if (fx.home && Selectors.rival(fx.rival).derby && !gameState.stadium.upgrades.monitoring) Engine.pushDecision('derbySecurity');
      Engine.maybeLockerCall();
      Engine.maybePassat();
      Engine.maybeBalance();
    },
    function cutscenes() {
      if (gameState.calendar.week > CONFIG.preseasonWeeks) Engine.maybeCutscene();
    },
  ],

  nextWeek() {
    if (!Engine.canAdvanceWeek()) return false;
    Engine.weeklyHooks.forEach((hook) => { if (gameState.screen === 'game') hook(); });
    Engine.checkGameOver();
    return true;
  },
};

/* Selektory – obliczenia pochodne od stanu (bez modyfikacji) */
const Selectors = {
  leagueName: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).name,
  econ: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).econ,
  levelSkillBonus: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).skillBonus,
  sponsorWeekly: (sp) => (sp.fallback
    ? Math.round((30 + Selectors.promo() * 0.6) * Selectors.econ())   // symboliczny lokalny sponsor: rośnie z atrakcyjnością klubu
    : Math.round(sp.weekly * Selectors.econ() * ({ neutral: 1.1, spicy: 0.9 }[Selectors.mediaStrategy()] || 1))),
  mediaStrategy: () => gameState.x.strategy || 'neutral',
  strategyLocked: () => gameState.x.strategySeason === gameState.calendar.season,
  coachOffer: (co) => ({ sign: Math.round(co.sign * Selectors.econ()), weekly: Math.round(co.weekly * Selectors.econ()) }),
  coachWeekly: () => (gameState.coach.id === 'mirek' ? 0 : (gameState.coach.weekly || Selectors.coach().weekly)),
  scoutTier: () => DATA.scoutTiers[gameState.scouting.tier] || DATA.scoutTiers[0],
  raiseAmount: () => Math.max(15, Math.round(15 * Selectors.econ() / 5) * 5),
  passatSellAmount: () => Math.round(1200 * Selectors.econ() / 100) * 100,
  passatBuyAmount: () => Math.round(800 * Selectors.econ() / 100) * 100,
  aferaRisk: () => (gameState.club.professionalism < -50 ? 0.75 : 0.25),   // „pod lupą” prokuratury
  underInvestigation: () => gameState.club.professionalism < -50,
  fetaCost: (base) => Math.round(base * Selectors.econ() / 10) * 10,
  lifelineAmount: (base) => Math.round(base * Selectors.econ() / 100) * 100,
  brakeAmount: (base) => Math.round(base * Selectors.econ() / 10) * 10,
  debtThresholds: () => {
    const e = Selectors.econ();
    return { warn: CONFIG.debtWarn * e, bailiff: CONFIG.debtBailiff * e, gameOver: CONFIG.debtGameOver * e };
  },
  licenseMissing: (level) => {
    const up = gameState.stadium.upgrades;
    const miss = [];
    if (level === 2 && !up.boiler && !up.roller) miss.push('Bojler albo Walec');
    if (level >= 3) {
      if (!up.boiler) miss.push(DATA.upgrades.boiler.label);
      if (!up.roller) miss.push(DATA.upgrades.roller.label);
    }
    Object.keys(DATA.upgrades).forEach((id) => {
      const u = DATA.upgrades[id];
      if (u.licenseLevel && level >= u.licenseLevel && !up[id]) miss.push(u.label);
    });
    const needCap = DATA.licenseCapacity[level] || 0;
    if ((gameState.stadium.level || 0) < needCap) miss.push('Trybuny: min. ' + DATA.stadiumLevels[needCap].capacity + ' miejsc');
    return miss;
  },
  isMatchWeek: () => gameState.calendar.week > CONFIG.preseasonWeeks,
  // Struktura ligi: liczba drużyn w bieżącej tabeli i strefy wg klasy rozgrywkowej
  leagueSize: () => Object.keys(gameState.season.table || {}).length || 1 + gameState.league.rivals.length,
  rundaLen: () => Math.max(1, Math.round((gameState.season.rounds || []).length / 2) || CONFIG.roundsPerRunda),
  leagueRules: (level = gameState.club.leagueLevel) => {
    const L = DATA.leagueLevels[level] || DATA.leagueLevels[1];
    const max = DATA.leagueLevels.length - 1;
    return { up: level < max ? L.up || 0 : 0, upPO: level < max ? L.upPO || [] : [], down: level > 1 ? L.down || 0 : 0, downPO: level > 1 ? L.downPO : null, euro: L.euro || [], top: level === max };
  },
  // Strefa miejsca w tabeli: title / up / upPO / euro / downPO / down / last (dno B-klasy) / null
  zoneOf: (pos, n = Selectors.leagueSize()) => {
    const r = Selectors.leagueRules();
    if (r.top && pos === 1) return 'title';
    if (pos <= r.up) return 'up';
    if (r.upPO.includes(pos)) return 'upPO';
    if (r.euro.includes(pos)) return 'euro';
    if (r.down && pos > n - r.down) return 'down';
    if (r.downPO && pos === n - r.down) return 'downPO';
    if (!r.down && pos === n) return 'last';
    return null;
  },
  fixtureAt: (roundIdx) => {
    const round = gameState.season.rounds[roundIdx];
    if (!round) return null;
    const f = round.find((x) => x.home === US || x.away === US);
    return { rival: f.home === US ? f.away : f.home, home: f.home === US };
  },
  currentFixture: () => Selectors.fixtureAt(gameState.calendar.round),
  rival: (name) => gameState.league.rivals.find((r) => r.name === name) || DATA.rivals.find((r) => r.name === name) || { name, strength: 1.3, derby: false },
  teamName: (id) => (id === US ? Selectors.clubDisplayName() : id),
  coach: () => DATA.coaches[gameState.coach.id] || DATA.coaches.mirek,
  sponsor: () => (gameState.sponsor.active ? Selectors.sponsorDef(gameState.sponsor.active) : null),
  playerName: (p) => p.first + ' „' + p.nick + '” ' + p.last,
  clubDisplayName: () => {
    const sp = Selectors.sponsor();
    return sp && sp.clubPrefix ? sp.clubPrefix + ' ' + gameState.club.name : gameState.club.name;
  },
  stadiumName: () => {
    const sp = Selectors.sponsor();
    return sp && sp.stadiumName ? sp.stadiumName : gameState.stadium.baseName;
  },
  standings: () => Object.entries(gameState.season.table)
    .map(([team, r]) => ({ team, ...r }))
    .sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf),
  ourPosition: () => Selectors.standings().findIndex((r) => r.team === US) + 1,
  squadWages: () => gameState.squad.reduce((s, p) => s + p.wage, 0),
  staffWages: () => Object.values(gameState.staff).reduce((s, m) => s + (m ? m.wage : 0), 0),
  weeklyPayroll: () => Selectors.squadWages() + Selectors.coachWeekly() + Selectors.staffWages(),
  lockerBaseline: () => {
    const legends = gameState.squad.filter((p) => p.legend).length;
    const leaders = gameState.squad.filter((p) => p.tag === 'leader').length;
    const staff = Object.values(gameState.staff).reduce((s, m) => s + (m ? m.lockerBase : 0), 0);
    const facilities = Selectors.upgradeSum('lockerBase');   // bojler, siłownia, świetlica…
    return Utils.clamp(50 + facilities + Math.min(9, legends * 3) + leaders * 2 + staff, 30, 85);
  },
  dnaLabel: () => {
    const v = gameState.club.professionalism;
    let label = DATA.dnaLevels[0].label;
    DATA.dnaLevels.forEach((l) => { if (v >= l.min) label = l.label; });
    return label;
  },
  handleFrom: (name) => {
    const words = String(name).trim().split(/\s+/);
    return (words[words.length - 1] || 'Klub').replace(/[^\p{L}\p{N}]/gu, '') || 'Klub';
  },
  clubHandle: () => Selectors.handleFrom(gameState.club.town || gameState.club.name),
  presName: () => gameState.club.president || 'Prezes',
  townType: () => DATA.townTypes[gameState.club.character] || null,
  colors: () => DATA.clubColors[gameState.club.colors] || null,
  colorsNick: () => (Selectors.colors() ? Selectors.colors().nick : ''),
  defaultStadium: (town) => 'Boisko Gminne przy Remizie' + (town ? ' w ' + town : ''),
  stadiumCapacity: () => DATA.stadiumLevels[gameState.stadium.level || 0].capacity,
  upgradeCost: (id) => Math.round(DATA.upgrades[id].cost * (id === 'roller' && gameState.club.character === 'rural' ? 0.75 : 1)),
  // Nazwa klubu z formularza: przedrostek (z listy albo własny) + miejscowość
  formClubName: (f) => [(f.prefix === 'custom' ? f.customPrefix : f.prefix).trim(), f.town.trim()].filter(Boolean).join(' '),
  youthLevel: () => (gameState.scouting.youthUpgrades.dresy ? 1 : 0) + (gameState.scouting.youthUpgrades.wfista ? 2 : 0),
  youthPullKey: () => 's' + gameState.calendar.season,   // raz na okno transferowe
  callPlayer: () => gameState.squad.find((p) => p.id === gameState.calls.playerId) || null,
  starPlayer: () => gameState.squad.find((p) => p.id === gameState.star.playerId) || null,
  rebel: () => { const p = Selectors.starPlayer(); return !!(gameState.star.rebel && p && !p.benched); },
  starFee: (p) => Math.round(p.skill * 220 * Selectors.econ() / 10) * 10,
  calmCost: (p) => Math.round(p.skill * 80 * Selectors.econ() / 10) * 10,
  transferOffers: () => gameState.pendingDecisions.filter((id) => DATA.decisions[id] && DATA.decisions[id].transfer),
  // OVR 1–99: klasa zawodnika skorygowana o aktualną formę (noty z ostatnich meczów)
  // Skala: B-klasa ok. 43–61, Ekstraklasa ok. 72–90; krajowy sufit 92 – OVR 93–99 tylko dla gwiazd europejskich pucharów
  ovr: (p) => {
    const hist = p.formHistory || [];
    const form = hist.length ? Utils.clamp((hist.reduce((s, r) => s + r, 0) / hist.length - 6) * 1.5, -4, 4) : 0;
    return Math.round(Utils.clamp(32 + p.skill * 3.6 + form, 1, CONFIG.domesticOvrCap));
  },
  // Sufit rozwoju zależny od ligi klubu: zawodnik nie urośnie dużo ponad poziom rozgrywek
  leagueSkillCap: () => Math.min(CONFIG.maxSkill, 9 + Selectors.levelSkillBonus()),
  leagueOvrRange: () => { const b = Selectors.levelSkillBonus(); return [Math.round(32 + (3 + b) * 3.6), Math.round(32 + (8 + b) * 3.6)]; },
  teamOvr: () => { const l = Selectors.projectedLineup(); return l.length ? Math.round(l.reduce((s, p) => s + Selectors.ovr(p), 0) / l.length) : 0; },
  potential: (p) => Math.min(CONFIG.maxSkill, Math.max(p.skill, p.potential != null ? p.potential : p.skill + (p.age <= 23 ? 2 : 0))),
  potentialStars: (p) => Utils.clamp(Math.round((Selectors.potential(p) - 2) / 2.8), 1, 5),
  // Ukryta zdolność kredytowa (0–3): kasa, tygodniowe wpływy, zaległe raty, debet, strajk, skandale
  // Stan klubu przed/po decyzji – do planszy konsekwencji
  clubSnapshot: () => ({
    budget: gameState.finance.budget, fans: gameState.morale.fans, locker: gameState.morale.lockerRoom,
    dna: gameState.club.professionalism, scandals: gameState.club.scandals, squad: gameState.squad.length, pitch: gameState.stadium.pitch,
  }),
  clubDeltas: (a, b) => [
    ['💰', 'Kasa', b.budget - a.budget, (v) => Utils.signedMoney(v)],
    ['📣', 'Kibice', b.fans - a.fans, (v) => (v > 0 ? '+' : '') + v + '%'],
    ['🧑‍🤝‍🧑', 'Szatnia', b.locker - a.locker, (v) => (v > 0 ? '+' : '') + v + '%'],
    ['🧬', 'Wizerunek (DNA)', b.dna - a.dna, (v) => (v > 0 ? '+' : '') + v],
    ['📰', 'Skandale', b.scandals - a.scandals, (v) => (v > 0 ? '+' : '') + v, true],
    ['👟', 'Kadra', b.squad - a.squad, (v) => (v > 0 ? '+' : '') + v + ' zaw.'],
    ['🌱', 'Murawa', b.pitch - a.pitch, (v) => (v > 0 ? '+' : '') + v],
  ].filter(([, , v]) => v).map(([icon, label, v, fmt, inverse]) => ({ icon, label, text: fmt(v), good: inverse ? v < 0 : v > 0 })),
  // Jeden wzór zdolności kredytowej dla wszystkich klubów w lidze
  creditFrom: ({ cash, income, owed }) => {
    const e = Selectors.econ();
    return Utils.clamp(0.2 + Math.max(0, cash) / (5000 * e) + income / (2000 * e) - owed / (3000 * e) - Math.max(0, -cash) / (1500 * e), 0, 3);
  },
  clubCredit: (name) => { const ec = Engine.clubEco(name); return Math.round(Selectors.creditFrom({ cash: ec.cash, income: ec.income, owed: ec.loan ? ec.loan.remaining * ec.loan.rate : 0 }) * 100) / 100; },
  creditScore: () => {
    const e = Selectors.econ();
    const b = gameState.finance.budget;
    const rep = gameState.lastReport;
    const income = rep ? rep.lines.filter((l) => l.amount > 0).reduce((s, l) => s + l.amount, 0) : 300 * e;
    const owed = gameState.loans.taken.reduce((s, l) => s + l.remaining * l.rate, 0);
    let s = Selectors.creditFrom({ cash: b, income, owed });
    if (gameState.debt.strike) s -= 0.3;
    if (gameState.debt.deepWeeks > 0) s -= 0.5;
    s -= gameState.club.scandals * 0.03;
    return Math.round(Utils.clamp(s, 0, 3) * 100) / 100;
  },
  creditLabel: (s) => (s < 0.4 ? ['🔴', 'tragiczna', 1] : s < 0.9 ? ['🟠', 'słaba', 2] : s < 1.5 ? ['🟡', 'przyzwoita', 3] : s < 2.2 ? ['🟢', 'dobra', 4] : ['💚', 'znakomita', 5]),
  // Oferta pożyczkodawcy liczona na bieżąco: kwota rośnie z kondycją, w kryzysie maleje i drożeje
  loanOffer: (id) => {
    const l = DATA.lenders[id];
    const s = Selectors.creditScore();
    const amount = Math.max(100, Math.round(l.base * Selectors.econ() * Utils.clamp(s, 0.25, 2.5) / 50) * 50);
    const interest = l.interest + Math.max(0, 1 - s) * 0.15;
    const rate = Math.ceil(amount * interest / l.installments / 5) * 5;
    const active = gameState.loans.taken.some((x) => x.id === id);
    let amt = amount;
    let clubBroke = false;
    if (l.club) {   // prezes pożycza z kasy swojego klubu – nie da więcej, niż klub ma
      const cap = Math.floor(Math.max(0, Engine.clubEco(l.club).cash) * 0.7 / 50) * 50;
      clubBroke = cap < 300;
      amt = Math.min(amount, cap);
    }
    const r = l.club ? Math.ceil(amt * interest / l.installments / 5) * 5 : rate;
    const available = !active && s >= l.minScore && !clubBroke;
    const reason = active ? 'spłacasz' : s < l.minScore ? (id === 'bank' ? 'brak zdolności' : 'nie ufa') : clubBroke ? 'sam bez kasy' : '';
    return { amount: amt, rate: r, installments: l.installments, total: r * l.installments, available, reason, club: l.club };
  },
  // Prośba dłużnika: im gorzej w jego klubie, tym więcej chce i tym trudniej mu oddać
  borrowOffer: (id) => {
    const b = DATA.borrowers[id];
    const e = Selectors.econ();
    const ec = Engine.clubEco(b.club);
    const need = Utils.clamp(1 + Math.max(0, -ec.cash) / (3000 * e), 1, 2.5);
    const amount = Math.round(b.amount * e * need / 50) * 50;
    const returns = Math.round(amount * (b.returns / b.amount) / 10) * 10;
    const risk = Utils.clamp(b.risk + (ec.cash < 0 ? 0.15 : 0) + (ec.loan ? 0.1 : 0) - (ec.cash > 3000 * e ? 0.05 : 0), 0.02, 0.9);
    return { amount, returns, risk, weeks: b.weeks, cash: ec.cash };
  },
  // Mocne i słabe strony zawodnika – wyliczone z jego danych, do świadomych zakupów
  prosCons: (p) => {
    const pros = [], cons = [];
    const team = Selectors.teamOvr(), ovr = Selectors.ovr(p);
    const wages = gameState.squad.map((x) => x.wage);
    const avgWage = wages.length ? wages.reduce((s, w) => s + w, 0) / wages.length : 10;
    const ps = p.prevSeason;
    if (ovr >= team + 5) pros.push('Od razu wzmocni skład (OVR ' + ovr + ' przy średniej ' + team + ')');
    else if (ovr <= team - 5) cons.push('Na start raczej rezerwowy (OVR ' + ovr + ' przy średniej ' + team + ')');
    if (p.age <= 21 && Selectors.potential(p) > p.skill) pros.push('Młody – jeszcze urośnie');
    if (Selectors.potentialStars(p) >= 4 && Selectors.potential(p) > p.skill) pros.push('Wysoki sufit rozwoju');
    if (p.talent) pros.push('Perełka – rozwija się szybciej');
    if (p.age >= 31) cons.push('Wiek – forma będzie spadać');
    if (ps && ps.apps >= 5 && ps.avg != null && ps.avg >= 7) pros.push('Świetny zeszły sezon (nota ' + Selectors.ratingText(ps.avg) + ')');
    if (ps && ps.apps >= 5 && ps.avg != null && ps.avg < 5.6) cons.push('Słaby zeszły sezon (nota ' + Selectors.ratingText(ps.avg) + ')');
    if (ps && ps.apps < 5) cons.push('Mało grał w zeszłym sezonie');
    if (ps && (p.pos === 'FWD' || p.pos === 'MID') && ps.apps && ps.goals / ps.apps >= 0.35) pros.push('Skuteczny pod bramką (' + ps.goals + ' goli)');
    if (p.wage >= avgWage * 1.6) cons.push('Wysoka pensja (' + p.wage + ' zł/tydz.)');
    else if (p.wage <= avgWage * 0.7) pros.push('Tani w utrzymaniu');
    if (p.tag === 'leader') pros.push('Lider szatni');
    if (p.tag === 'freekick') pros.push('Specjalista od stałych fragmentów');
    if (p.tag === 'worker') cons.push('Pracuje na budowie – bywa nieobecny');
    if (p.tag === 'party') cons.push('Imprezowicz – zdarza się kac na meczu');
    if (Engine.profileFit(p, Selectors.coach().style) >= 1) pros.push('Pasuje do stylu trenera');
    return { pros: pros.slice(0, 3), cons: cons.slice(0, 3) };
  },
  loanOutFee: (p) => Math.max(10, Math.round(Selectors.sellPrice(p) * 0.25 / 10) * 10),
  sellPrice: (p) => Math.max(20, Math.round((p.skill * 35 - Math.max(0, p.age - 29) * 15 + (p.talent ? 60 : 0)) * (p.listed ? 1.15 : 1) * Selectors.econ() / 10) * 10),   // lista transferowa: kupcy wiedzą, +15%
  cutTarget: () => gameState.squad.find((p) => p.id === gameState.cutscenes.targetId) || null,
  cutTransferFee: () => { const p = Selectors.cutTarget(); return p ? Math.round(p.skill * 160 * Selectors.econ()) : 0; },
  // Ukryty poziom osoby w sztabie (0 = wakat); starsze zapisy bez poziomu = przeciętny
  staffLevel: (slot) => { const m = gameState.staff[slot]; return m ? (m.level != null ? m.level : m.kind === 'volunteer' ? 1 : 2) : 0; },
  upgradeSum: (key) => Object.keys(DATA.upgrades).reduce((s, id) => s + (gameState.stadium.upgrades[id] ? DATA.upgrades[id][key] || 0 : 0), 0),
  upgradeProd: (key) => Object.keys(DATA.upgrades).reduce((s, id) => s * (gameState.stadium.upgrades[id] && DATA.upgrades[id][key] ? DATA.upgrades[id][key] : 1), 1),
  // Ukryta atrakcyjność promocyjna klubu (0–100): kibice, wyniki, liga, DNA, obiekty, media
  promo: () => {
    const t = gameState.season.table[US];
    const posScore = t && t.p ? Math.round((1 - (Selectors.ourPosition() - 1) / Math.max(1, Selectors.leagueSize() - 1)) * 27 + 3) : 15;
    const form = gameState.record.form.filter((r) => r === 'W').length * 2;
    const media = { neutral: 2, populist: 5, spicy: 3 }[Selectors.mediaStrategy()] || 0;
    return Math.round(Utils.clamp(gameState.morale.fans * 0.3 + posScore + gameState.club.leagueLevel * 5 + gameState.club.professionalism * 0.15
      + Selectors.upgradeSum('promo') + media + form - gameState.club.scandals * 2, 0, 100));
  },
  sponsorDef: (id) => (id === 'local' ? DATA.localSponsor : DATA.sponsors[id] || Engine.customSponsor(id)),
  hasRealSponsor: () => !!gameState.sponsor.active && gameState.sponsor.active !== 'local',
  // Oferty widoczne na rynku: bazowi i nowi sponsorzy; spaleni znikają po 8 tygodniach
  sponsorOffers: () => {
    const s = gameState.sponsor;
    const week = gameState.calendar.week;
    return Object.keys(DATA.sponsors).concat(Object.keys(s.custom))
      .filter((id) => !s.burned.includes(id) || week - (s.burnedAt[id] != null ? s.burnedAt[id] : -99) < 8);
  },
  // Prognoza mediów i bukmacherów przed sezonem (zamrażana przy pierwszym meczu)
  seasonPreview: () => {
    if (gameState.season.preview && gameState.calendar.round > 0) return gameState.season.preview;
    const lineup = Engine.pickLineup([]);
    const ours = Engine.teamStrength(lineup, Engine.chemistry(lineup));
    const pos = 1 + gameState.league.rivals.filter((r) => (gameState.season.strength[r.name] || r.strength) > ours).length;
    const frac = (pos - 1) / Math.max(1, gameState.league.rivals.length);
    const stars = frac <= 0.12 ? 5 : frac <= 0.34 ? 4 : frac <= 0.56 ? 3 : frac <= 0.78 ? 2 : 1;
    const odds = (1.25 + frac * 13).toFixed(2);
    const quote = ['', '„Czarny koń? Raczej czarna owca. Spadek murowany.”', '„Walka o utrzymanie do ostatniej kolejki.”', '„Środek tabeli – i to będzie sukces.”', '„Ciemny koń ligi. Kibice mogą marzyć.”', '„Główny faworyt do awansu. Inni grają o drugie miejsce.”'][stars];
    return { pos, stars, odds, quote };
  },
  // Kryzys sportowy: seria porażek, brak wygranej od 5 meczów, strefa spadkowa albo dramatycznie mało punktów.
  // Drużyna w czołówce tabeli nigdy nie jest w kryzysie – wtedy nikt nie żąda głowy trenera.
  teamStruggling: () => {
    const t = gameState.season.table[US];
    if (!t || t.p < 3 || gameState.coach.id === 'mirek') return false;
    const n = Selectors.leagueSize(), pos = Selectors.ourPosition();
    if (pos <= Math.ceil(n / 3)) return false;
    const form = gameState.record.form || [];
    const last3 = form.slice(-3);
    const lossStreak = last3.length === 3 && last3.every((r) => r === 'L');
    const winless = form.length >= 5 && !form.includes('W');
    const zone = t.p >= 4 && ['down', 'downPO', 'last'].includes(Selectors.zoneOf(pos, n));
    const pointsCrisis = t.p >= 6 && t.pts / t.p < 0.85;
    return lossStreak || winless || zone || pointsCrisis;
  },
  crisisReason: () => {
    const t = gameState.season.table[US];
    const form = gameState.record.form || [];
    if (form.slice(-3).length === 3 && form.slice(-3).every((r) => r === 'L')) return 'trzy porażki z rzędu';
    if (form.length >= 5 && !form.includes('W')) return 'pięć meczów bez zwycięstwa';
    if (['down', 'downPO', 'last'].includes(Selectors.zoneOf(Selectors.ourPosition()))) return Selectors.ourPosition() + '. miejsce – strefa spadkowa';
    return t ? t.pts + ' pkt w ' + t.p + ' meczach' : 'słabe wyniki';
  },
  persuadeChance: (p) => {
    if (!p) return 0;
    const pos = Selectors.ourPosition(), n = Selectors.leagueSize();
    let c = 0.3;
    c += (gameState.morale.lockerRoom - 50) * 0.004;
    c += (gameState.morale.fans - 50) * 0.003;
    c += gameState.lastSeason && ['promo', 'title', 'euro', 'podium'].includes(gameState.lastSeason.outcome) ? 0.12 : 0;
    c += pos && pos <= Math.ceil(n / 4) ? 0.06 : 0;
    c += p.favorite ? 0.12 : 0;
    c += p.legend ? 0.1 : 0;
    c += p.age >= 30 ? 0.1 : p.age <= 22 ? -0.08 : 0;
    c += Selectors.coach().quality * 0.8;
    c -= Math.max(0, Selectors.ovr(p) - Selectors.teamOvr() - 7) * 0.02;   // im bardziej przerasta klub, tym trudniej
    c -= gameState.club.leagueLevel >= 7 ? 0 : 0.03;                         // z niższej ligi łatwiej uciec
    return Utils.clamp(c, 0.08, 0.8);
  },
  persuadeWage: (p) => Math.round(p.wage * 1.4 / 5) * 5 + 5,
  freeStaffSlot: () => Object.keys(DATA.staffSlots).find((k) => !gameState.staff[k]) || null,
  currentRetiree: () => gameState.retirees[0] || null,
  projectedLineup: () => Engine.pickLineup([]),
  wageLabel: (w) => (w <= 5 ? 'zwrot za paliwo' : w <= 15 ? 'paliwo + skrzynka po meczu' : 'stypendium'),
  avgRating: (p) => (p.seasonRatingCount ? Math.round(p.seasonRatingSum / p.seasonRatingCount * 10) / 10 : null),
  careerRating: (p) => (p.careerRatingCount ? Math.round(p.careerRatingSum / p.careerRatingCount * 10) / 10 : null),
  ratingText: (r) => (r == null ? '–' : r.toFixed(1)),
  skillLabel: (s) => {
    if (s >= 15) return 'Materiał na kadrę';
    if (s >= 13) return 'Ekstraklasowy wyjadacz';
    if (s >= 11) return 'Ligowy kozak';
    if (s >= 9) return 'Gwiazda powiatu';

/* ---------------------------------------------------------------------
   4. ZAPIS GRY (localStorage)
   --------------------------------------------------------------------- */
const Storage = {
  KEY: 'bklasa-prezes-save',

  save() {
    if (gameState.screen !== 'game') return;
    try { localStorage.setItem(Storage.KEY, JSON.stringify(gameState)); } catch (e) { /* brak miejsca / tryb prywatny */ }
  },

  load() {
    try {
      const raw = localStorage.getItem(Storage.KEY);
      if (!raw) return null;
      return Storage.migrate(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  },

  clear() {
    try { localStorage.removeItem(Storage.KEY); } catch (e) { /* ignorujemy */ }
  },

  // Nowe pola z createInitialState trafiają do starych zapisów automatycznie.
  migrate(saved) {
    const merge = (def, src) => {
      if (src === undefined) return def;
      if (def && typeof def === 'object' && !Array.isArray(def) && src && typeof src === 'object' && !Array.isArray(src)) {
        const out = { ...def };
        Object.keys(src).forEach((k) => { out[k] = merge(def[k], src[k]); });
        return out;
      }
      return src;
    };
    const oldVersion = saved.version || 1;
    const state = merge(createInitialState(), saved);
    state.version = CONFIG.saveVersion;
    state.ui.startError = '';
    if (!state.weather) state.weather = DATA.weather[1];
    state.pendingDecisions = (state.pendingDecisions || []).filter((id) => DATA.decisions[id]);
    state.ui.folds = {};   // akordeon: po wczytaniu wszystko zwinięte
    // Stadion z pojemnością (Krok 13.17): starsze zapisy dostają trybuny wymagane w obecnej lidze
    if (!saved.stadium || saved.stadium.level == null) state.stadium.level = DATA.licenseCapacity[state.club.leagueLevel] || 0;
    (state.squad || []).concat((state.loansOut || []).map((l) => l.player)).forEach((p) => { if (p.potential == null) Engine.rollPotential(p); });
    delete state.seasonTickets;
    if (!state.club.town) {
      const words = String(state.club.name || '').trim().split(/\s+/);
      state.club.town = words.length > 1 ? words.slice(1).join(' ') : (words[0] || 'Gmina');
    }
    if (oldVersion < 3 || !state.season.rounds || !state.season.rounds.length) {
      // Reforma ligi (10 drużyn): nowy terminarz od 1. kolejki.
      delete state.season.schedule;
      const prev = gameState; gameState = state;
      state.calendar.round = 0;
      Engine.newSeason();
      Engine.addLog('📠 Związek przysłał faksem nowy terminarz: liga rozszerzona do 10 drużyn, sezon liczy się od nowa. Kadra i sztab czekają w nowych zakładkach.', 'system');
      gameState = prev;
    }
    return state;
  },
};

const UI = {
  _uid: 0,                   // unikalne id dla clipPath w herbach SVG

  root: () => document.getElementById('app'),

  renderAll() {
    UI._uid = 0;
    UI.applyTheme(gameState.screen === 'start' ? gameState.ui.form.colors : gameState.club.colors);
    // Obszar roboczy przewija się sam – po akcji w tym samym widoku zostajemy w tym samym miejscu
    const work = document.getElementById('work');
    const key = gameState.activeTab + ':' + UI.sub(gameState.activeTab, '') + ':' + gameState.ui.deskView + ':' + gameState.calendar.week;
    const keep = work && work.dataset.key === key ? work.scrollTop : 0;
    const root = UI.root();
    root.innerHTML = gameState.screen === 'start' ? UI.startScreen()
      : gameState.screen === 'gameover' ? UI.gameOverScreen()
      : UI.gameScreen();
    const fresh = document.getElementById('work');
    if (fresh) { fresh.dataset.key = key; fresh.scrollTop = keep; }
    if (gameState.screen === 'game') UI.animateMatch();
  },

  /* ---------- Motyw: barwy klubu jako akcenty interfejsu ---------- */
  theme(colorsId) {
    const c = DATA.clubColors[colorsId] || { c1: '#10b981', c2: '#f59e0b' };
    const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const lum = (hex) => {
      const [r, g, b] = rgb(hex).map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    };
    const sat = (hex) => { const v = rgb(hex); return Math.max(...v) - Math.min(...v); };
    const usable = (hex) => lum(hex) > 0.02 && lum(hex) < 0.8 && sat(hex) > 0.2;   // bez bieli i czerni
    const pick = [c.c1, c.c2].filter(usable);
    const accent = pick.length ? pick[0] : c.c1;
    const accent2 = accent === c.c1 ? c.c2 : c.c1;
    const mix = (hex, t) => '#' + rgb(hex).map((v) => Math.round((v + (1 - v) * t) * 255).toString(16).padStart(2, '0')).join('');
    return {
      c1: c.c1, c2: c.c2, accent, accent2,
      accentText: lum(accent) < 0.2 ? mix(accent, 0.45) : accent,
      onAccent: lum(accent) > 0.4 ? '#0f172a' : '#ffffff',
    };
  },

  applyTheme(colorsId) {
    const t = UI.theme(colorsId);
    const st = document.documentElement.style;
    st.setProperty('--c1', t.c1); st.setProperty('--c2', t.c2);
    st.setProperty('--accent', t.accent); st.setProperty('--accent2', t.accent2);
    st.setProperty('--accent-text', t.accentText); st.setProperty('--on-accent', t.onAccent);
    // akcent na ciemnym tle (pasek, tytuły, menu) – jaśniejsza wersja barwy klubu
    st.setProperty('--glow-rgb', [1, 3, 5].map((i) => parseInt(t.accentText.slice(i, i + 2), 16)).join(' '));
  },

  initials(name) {
    const words = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return '?';
    if (/^[A-ZĄĆĘŁŃÓŚŹŻ]{2,4}$/.test(words[0])) return words[0];
    return words.slice(0, 3).map((w) => w[0]).join('').toUpperCase();
  },

  // Tarcza klubu w barwach (SVG); neutral = herb rywala
  crest(colorsId, name, size = 48, neutral = false) {
    const c = neutral ? { c1: '#475569', c2: '#334155' } : (DATA.clubColors[colorsId] || { c1: '#10b981', c2: '#f59e0b' });

    <svg width="${size}" height="${Math.round(size * 1.12)}" viewBox="0 0 64 72" class="flex-shrink-0 drop-shadow-lg" aria-hidden="true">
      <defs><clipPath id="${id}"><path d="M32 3 L59 11 V35 C59 52 46 63 32 69 C18 63 5 52 5 35 V11 Z"/></clipPath></defs>
      <g clip-path="url(#${id})">
        <rect width="64" height="72" fill="${c.c1}"/>
        <rect x="32" width="32" height="72" fill="${c.c2}"/>
        <rect y="24" width="64" height="20" fill="rgba(15,23,42,.55)"/>
      </g>
      <path d="M32 3 L59 11 V35 C59 52 46 63 32 69 C18 63 5 52 5 35 V11 Z" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.5"/>
      <text x="32" y="${34 + fs / 3}" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="800" font-size="${fs}" fill="#fff">${ini}</text>

            <aside class="lg:sticky lg:top-6 self-start">
              <div class="bg-paper-200 border border-paper-400 rounded-lg p-4">
                <div class="text-xs uppercase tracking-wider text-ink-700 mb-2">Plakietka klubu (podgląd)</div>
                <div id="form-preview">${UI.formPreview()}</div>
              </div>
              <p id="start-error" class="text-stamp font-bold text-sm mt-3 min-h-[1.25rem]">${Utils.escape(gameState.ui.startError)}</p>
              <button data-action="start-game"
                class="btn-press w-full mt-2 py-4 bg-amber-glow hover:brightness-110 text-ink-900 font-bold text-lg rounded-lg">
                ROZPOCZNIJ PREZESURĘ
              </button>
              <p class="text-xs text-ink-700 text-center mt-3">Podpisując, prezes zobowiązuje się do pokrycia długów za piłki, wapno i ostatni wyjazd do Bździszewa.${save && save.club.name ? ' <b>Nowa prezesura nadpisze zapis z szuflady.</b>' : ''}</p>
            </aside>
          </div>
        </section>
      </div>
    </main>`;
  },

  /* ---------- GŁÓWNY EKRAN GRY ---------- */
  /* ---------- RAMA APLIKACJI (telefon; na komputerze ta sama kolumna na środku) ---------- */
  gameScreen() {
    return `
    <div id="game-root" class="app-shell mx-auto w-full max-w-[480px] flex flex-col bg-desk-900 sm:border-x border-desk-700">
      ${UI.appHeader()}
      <main id="work" class="flex-1 min-h-0 overflow-y-auto overscroll-contain scroll-thin px-2.5 py-2">${UI.activeTabContent()}</main>
      ${UI.appDock()}
    </div>
    ${UI.playerSheet()}
    ${UI.overlay()}`;
  },

  /* ---------- EKRANY NA CAŁY EKRAN: mecz, cut-scenka, skutki decyzji ---------- */
  overlay() {
    const o = gameState.ui.overlay;
    if (o && o.type === 'match' && gameState.lastMatch) return UI.matchOverlay(gameState.lastMatch);
    if (o && o.type === 'outcome') return UI.outcomeOverlay(o);
    if (o && o.type === 'playoff' && gameState.seasonSummary && gameState.seasonSummary.playoff) return UI.playoffOverlay(gameState.seasonSummary.playoff);
    if (o && o.type === 'season' && gameState.seasonSummary) return UI.seasonOverlay(gameState.seasonSummary);
    if (o && o.type === 'transfer' && gameState.transfer.open) return UI.transferOverlay();
    // Cut-scenka czeka na decyzję – zawsze na pierwszym planie
    // Oferty transferowe w otwartym oknie czekają w zakładce „Oferty” giełdy, nie jako osobne scenki
    const cut = gameState.pendingDecisions.map((id) => DATA.decisions[id]).find((d) => d && d.cutscene && !(d.transfer && gameState.transfer.open));
    if (cut) return UI.cutsceneOverlay(cut);
    return '';
  },

  overlayFrame(inner, extraClass = '') {
    return `
    <div class="fixed inset-0 z-[70] flex justify-center bg-black/80">
      <div class="ov-in w-full max-w-[480px] h-full flex flex-col ${extraClass}" style="padding-bottom: env(safe-area-inset-bottom);">${inner}</div>
    </div>`;
  },

  matchOverlay(m) {
    const s = gameState;
    const live = UI.animatedMatch !== m.week;   // animujemy tylko raz na mecz
    const name = Selectors.clubDisplayName();
    const [label, tone] = m.result === 'W' ? ['WYGRANA', 'text-grass'] : m.result === 'L' ? ['PORAŻKA', 'text-stamp'] : ['REMIS', 'text-paper-300'];
    const total = m.money.reduce((sum, l) => sum + l.amount, 0);
    const side = (crest, n, align) => `
      <div class="flex-1 min-w-0 flex flex-col items-center gap-1.5 ${align}">
        ${crest}
        <div class="text-[13px] font-bold leading-tight text-center line-clamp-2">${Utils.escape(n)}</div>
      </div>`;
    const ourCrest = UI.crest(s.club.colors, s.club.name, 56);
    const theirCrest = UI.crest(s.club.colors, m.rival, 56, true);
    // Gol po stronie drużyny, która go strzeliła (gospodarz po lewej)
    const goals = m.goals.map((g) => `
      <li data-min="${g.min}" class="mx-goal ${live ? 'hidden' : ''} flex items-center gap-2 text-[13px] ${g.us === m.home ? '' : 'flex-row-reverse text-right'} ${g.us ? '' : 'text-paper-400'}">
        <span class="w-8 text-[11px] font-bold text-paper-400 ${g.us === m.home ? '' : 'text-right'}">${g.min}'</span>
        <span class="truncate">⚽ ${Utils.escape(g.name)}</span>
      </li>`).join('');
    const scoreAt = (min) => {
      const us = m.goals.filter((g) => g.us && g.min <= min).length, them = m.goals.filter((g) => !g.us && g.min <= min).length;
      return m.home ? us + ':' + them : them + ':' + us;
    };
    const money = m.money.map((l) => `<div class="flex justify-between gap-2 text-[12.5px]"><span class="text-paper-300 truncate">${Utils.escape(l.label)}</span><b class="whitespace-nowrap ${l.amount < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(l.amount)}</b></div>`).join('');
    return UI.overlayFrame(`
      <div class="flex-1 min-h-0 overflow-y-auto px-4 pt-5 pb-3 text-paper-100">
        <div class="text-center text-[11px] uppercase tracking-wider text-paper-400">Kolejka ${m.kolejka} · ${m.home ? 'u siebie' : 'wyjazd'}${m.derby ? ' · <span class="text-stamp font-bold">🔥 KOSA</span>' : ''}</div>
        <div class="text-center text-[11px] text-paper-400 mt-0.5">${m.weatherIcon} ${Utils.escape(m.weatherLabel)}</div>
        <div class="flex items-center gap-2 mt-5">
          ${m.home ? side(ourCrest, name, '') : side(theirCrest, m.rival, '')}
          <div class="flex-shrink-0 text-center">
            <div id="mx-score" class="text-[52px] font-extrabold leading-none tracking-tight">${live ? '0:0' : scoreAt(90)}</div>
            <div id="mx-min" class="mt-1.5 text-[12px] font-bold ${live ? 'text-amber-glow' : 'text-paper-400'}">${live ? "0'" : 'KONIEC'}</div>
          </div>
          ${m.home ? side(theirCrest, m.rival, '') : side(ourCrest, name, '')}
        </div>
        <div class="h-1 rounded-full bg-desk-700 mt-4 overflow-hidden"><div id="mx-bar" class="h-full bg-amber-glow" style="width:${live ? 0 : 100}%"></div></div>
        <ul class="space-y-1.5 mt-4">${goals || `<li class="mx-goal ${live ? 'hidden' : ''} text-center text-[13px] text-paper-400" data-min="90">Bez goli. Kibice liczyli wrony.</li>`}</ul>
        <div id="mx-final" class="${live ? 'hidden' : ''} mt-5 space-y-3">
          <div class="text-center text-[22px] font-extrabold tracking-wide ${tone}">${label}${m.sensation ? ' · SENSACJA!' : ''}</div>
          ${m.best ? `<div class="text-center text-[12.5px] text-paper-300">⭐ Gracz meczu: <b class="text-paper-100">${Utils.escape(m.best.name)}</b> (${m.best.r.toFixed(1)})</div>` : ''}
          <div class="rounded-xl bg-desk-800 px-3 py-2.5 space-y-1">
            ${m.attendance != null ? `<div class="flex justify-between text-[12.5px]"><span class="text-paper-300">🏟️ Frekwencja</span><b>${m.attendance} widzów</b></div>` : ''}
            ${money}
            <div class="flex justify-between pt-1.5 mt-1 border-t border-desk-600 text-[14px]"><span class="font-semibold">Wynik finansowy meczu</span><b class="${total < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(total)}</b></div>
          </div>
        </div>
      </div>
      <div class="flex-shrink-0 px-4 pb-4 pt-2">
        <button data-action="overlay-close" class="btn-press w-full h-14 rounded-xl bg-amber-glow text-ink-900 text-[17px] font-extrabold tracking-wider">KONTYNUUJ</button>
      </div>`, 'bg-desk-900');
  },

  // Mecz „na żywo”: zegar 0'–90', gole pojawiają się w swoich minutach, na końcu wynik finansowy
  animateMatch() {
    const m = gameState.lastMatch;
    const o = gameState.ui.overlay;
    if (!o || o.type !== 'match' || !m || UI.animatedMatch === m.week || !document.getElementById('mx-score')) return;
    UI.animatedMatch = m.week;
    clearInterval(UI.matchTimer);
    let min = 0;
    UI.matchTimer = setInterval(() => {
      min += 1;
      const el = (id) => document.getElementById(id);
      if (!el('mx-score')) { clearInterval(UI.matchTimer); return; }
      const us = m.goals.filter((g) => g.us && g.min <= min).length, them = m.goals.filter((g) => !g.us && g.min <= min).length;
      el('mx-score').textContent = m.home ? us + ':' + them : them + ':' + us;
      el('mx-min').textContent = min >= 90 ? 'KONIEC' : min + "'";
      el('mx-bar').style.width = Math.min(100, min / 90 * 100) + '%';
      document.querySelectorAll('.mx-goal').forEach((g) => { if (Number(g.dataset.min) <= min) g.classList.remove('hidden'); });
      if (min >= 90) {
        clearInterval(UI.matchTimer);
        el('mx-min').className = 'mt-1.5 text-[12px] font-bold text-paper-400';
        el('mx-final').classList.remove('hidden');
        el('mx-final').classList.add('ov-in');
      }
    }, 45);
  },

  // Dolna szuflada zawodnika (Kadra): opis, forma, ocena, potencjał, statystyki i akcje pod kciukiem
  playerSheet() {
    const id = gameState.ui.playerSheet;
    const p = id && gameState.activeTab === 'squad' ? gameState.squad.find((x) => x.id === id) : null;
    if (!p) return '';
    const lineup = Selectors.projectedLineup();
    const t = gameState.transfer;
    const canGo = gameState.squad.length > CONFIG.minSquad;
    const star = p.id === gameState.star.playerId;
    const stat = (label, value) => `<div class="rounded-lg bg-paper-200 py-1.5 min-w-0"><div class="text-[9.5px] uppercase tracking-wide text-ink-700">${label}</div><div class="text-[14px] font-bold leading-tight truncate">${value}</div></div>`;
    const hist = p.formHistory || [];
    const last = p.lastRating;
    const form = last == null ? ['–', 'brak meczów'] : last >= 7.5 ? ['🔥', 'w gazie'] : last >= 6.5 ? ['👍', 'dobra'] : last >= 5.5 ? ['😐', 'przeciętna'] : ['🥶', 'słaba'];
    const bars = hist.length ? hist.map((r) => `<div class="flex-1 rounded-sm ${r >= 7.5 ? 'bg-grass' : r >= 6 ? 'bg-ink-700' : r >= 4.5 ? 'bg-amber-400' : 'bg-stamp'}" style="height:${Math.round(r * 10)}%" title="${r.toFixed(1)}"></div>`).join('') : '<div class="text-[11px] text-ink-700 self-center">brak not</div>';
    const status = [
      lineup.includes(p) ? '<span class="text-grass font-bold">W SKŁADZIE</span>' : 'ŁAWKA',
      p.injured > 0 ? '<span class="text-stamp font-bold">🩹 kontuzja ' + p.injured + ' tyg.</span>' : '',
      p.benched ? '<span class="text-stamp font-bold">🚫 odsunięty</span>' : '',
      p.loan ? '🔁 wypożyczony z ' + Utils.escape(p.loan.from) : '',
      p.wantsOut ? '<span class="text-stamp font-bold">🚪 po sezonie do ' + Utils.escape(p.wantsOut) + '</span>' : '',
      star ? (gameState.star.rebel ? '<span class="text-stamp font-bold">🔥 buntownik</span>' : '🌟 chce odejść wyżej') : '',
      p.listed ? '📋 na liście transferowej' : '',
    ].filter(Boolean).join(' · ');
    const badges = [p.favorite ? '⭐ Ulubieniec trybun' : '', p.legend ? '🏆 Legenda klubu' : '', p.talent ? '💎 Perełka powiatu' : ''].filter(Boolean).join(' · ');
    const act = (action, label, enabled, tone, attrs = '') => `<button data-action="${action}" data-id="${p.id}" ${attrs} ${enabled ? '' : 'disabled'}
      class="btn-press h-11 px-2 rounded-xl text-[12.5px] font-bold leading-tight ${enabled ? tone : 'bg-paper-300 text-ink-700 opacity-60'}">${label}</button>`;
    const growth = p.age <= 23 && Selectors.potential(p) > p.skill;
    const actions = p.loan ? '<p class="text-[11.5px] text-ink-700 text-center py-2">Zawodnik wypożyczony – po sezonie wraca do ' + Utils.escape(p.loan.from) + '.</p>' : `
      <div class="grid grid-cols-3 gap-1.5">
        ${act('toggle-list', p.listed ? '✖ Zdejmij z listy' : '📋 Lista transferowa', true, p.listed ? 'bg-desk-600 text-paper-100' : 'bg-ink-900 text-paper-100')}
        ${act('loan-out', t.open ? (growth ? '📈 Wypożycz na rozwój' : '🤝 Wypożycz') : '🔒 Wypożycz w oknie', t.open && canGo && !star, 'bg-ink-900 text-paper-100')}
        ${act('release-player', t.open ? 'Podziękuj za grę' : '🔒 Podziękuj w oknie', t.open && canGo, 'bg-stamp text-white')}
      </div>
      <p class="text-[10.5px] text-ink-700 text-center mt-1">${t.open ? 'Okno transferowe otwarte – sprzedaż i wypożyczenia działają.' : 'Ruchy kadrowe tylko w oknie po sezonie. Lista transferowa: na giełdzie zawodnik idzie pierwszy i o 15% drożej.'}</p>`;
    return `
    <div class="fixed inset-0 z-[65] flex justify-center">
      <button data-action="player-close" aria-label="Zamknij" class="absolute inset-0 bg-black/50"></button>
      <div class="sheet-in absolute bottom-0 w-full max-w-[480px] max-h-[86vh] flex flex-col rounded-t-2xl bg-paper-100 text-ink-900" style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="flex-shrink-0 pt-2 pb-1"><div class="mx-auto w-10 h-1 rounded-full bg-paper-400"></div></div>
        <div class="flex-1 min-h-0 overflow-y-auto px-4 pb-3">
          <div class="flex items-start gap-2">
            <div class="min-w-0 flex-1">
              <div class="text-[18px] font-extrabold leading-tight">${Utils.escape(Selectors.playerName(p))}</div>
              <div class="text-[12px] text-ink-700">${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l. · ${Selectors.skillLabel(p.skill)} · ${UI.profileBadge(p.profile)}</div>
            </div>
            <div class="text-center flex-shrink-0"><div class="text-[22px] font-extrabold leading-none">${Selectors.ovr(p)}</div><div class="text-[9px] uppercase text-ink-700">OVR</div></div>
            <button data-action="player-close" class="btn-press w-9 h-9 rounded-full bg-paper-200 text-[16px] flex-shrink-0" aria-label="Zamknij">✕</button>
          </div>
          <p class="text-[13px] italic text-ink-700 leading-snug mt-1.5">„${Utils.escape(p.trait)}”</p>
          <div class="text-[11.5px] mt-1">${status}${badges ? '<br>' + badges : ''}</div>
          <div class="grid grid-cols-[1fr_1.2fr] gap-2 mt-2.5">
            <div class="rounded-lg bg-paper-200 px-2 py-1.5">
              <div class="text-[9.5px] uppercase tracking-wide text-ink-700">Forma · ${form[0]} ${form[1]}</div>
              <div class="flex items-end gap-1 h-10 mt-1">${bars}</div>
            </div>
            <div class="rounded-lg bg-paper-200 px-2 py-1.5">
              <div class="text-[9.5px] uppercase tracking-wide text-ink-700">Ocena</div>
              <div class="flex items-center gap-1.5 mt-0.5"><span class="text-[11px]">sezon</span>${UI.ratingBadge(Selectors.avgRating(p))}<span class="text-[11px]">ost.</span>${UI.ratingBadge(last)}</div>
              <div class="text-[11px] mt-0.5">kariera: <b>${Selectors.careerRating(p) != null ? Selectors.ratingText(Selectors.careerRating(p)) : '–'}</b></div>
            </div>
          </div>
          <div class="rounded-lg bg-paper-200 px-2 py-1.5 mt-2 text-[12px]">📈 Potencjał: <b>${UI.potentialText(p)}</b>${growth ? '<span class="text-ink-700"> · ' + (t.open ? 'wypożyczenie da regularną grę i szybszy rozwój' : 'bez gry rośnie wolno') + '</span>' : ''}</div>
          <div class="grid grid-cols-4 gap-1.5 mt-2 text-center">
            ${stat('Mecze', p.seasonApps)}${stat('Gole', p.seasonGoals)}${stat('W klubie', p.apps + ' m')}${stat('Gole kl.', p.goals)}
          </div>
          <div class="text-[11.5px] text-ink-700 mt-1.5">Pensja: <b class="text-ink-900">${p.wage} zł/tydz.</b> (${Selectors.wageLabel(p.wage)}) · pasuje do: ${DATA.profiles[p.profile].label}${p.loan ? '' : ' · wartość: <b class="text-ink-900">' + Utils.formatMoney(star ? Selectors.starFee(p) : Selectors.sellPrice(p)) + '</b>'}</div>
        </div>
        <div class="flex-shrink-0 px-4 pb-3 pt-2 border-t border-paper-300">${actions}</div>
      </div>
    </div>`;
  },

  ovrBadge(p) {
    const v = Selectors.ovr(p);
    // kolory względem ligi: złoty = gwiazda ligi, zielony = mocny, granat = przeciętny, szary = słaby
    const [lo, hi] = Selectors.leagueOvrRange();
    const tone = v >= hi ? 'bg-amber-400 text-ink-900' : v >= (lo + hi) / 2 + 3 ? 'bg-grass text-white' : v >= lo + 3 ? 'bg-ink-900 text-paper-100' : 'bg-paper-300 text-ink-900';
    return `<span class="inline-block min-w-[24px] px-1 rounded text-[11px] leading-[17px] font-extrabold text-center ${tone}">${v}</span>`;
  },

  // Potencjał: gwiazdki zawsze, dokładny sufit tylko z dobrym skautem w sztabie
  potentialText(p) {
    const pot = Selectors.potential(p);
    if (p.age > 26 || pot <= p.skill) return 'szczyt możliwości';
    const s = Selectors.potentialStars(p);
    return '★'.repeat(s) + '☆'.repeat(5 - s) + (Selectors.staffLevel('skaut') >= 3 ? ' (do: ' + Selectors.skillLabel(pot) + ')' : '');
  },

  // Karta statystyk zawodnika w decyzjach transferowych: liczby z bieżącego sezonu + kariera w klubie
  playerCard(p, dark = false) {
    if (!p) return '';
    const box = dark ? 'bg-desk-800 border-desk-600 text-paper-100' : 'bg-paper-200 border-paper-300 text-ink-900';
    const sub = dark ? 'text-paper-400' : 'text-ink-700';
    const stat = (label, value) => `<div class="min-w-0"><div class="text-[9.5px] uppercase tracking-wide ${sub}">${label}</div><div class="text-[15px] font-bold leading-tight">${value}</div></div>`;
    // Na przełomie sezonów (przed 1. meczem) liczy się sezon zakończony
    const ps = p.prevSeason;
    const last = !!(ps && p.seasonApps === 0 && gameState.calendar.round === 0);
    return `
      <div class="rounded-xl border ${box} px-3 py-2 mt-3">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="text-[14px] font-bold truncate">${Utils.escape(Selectors.playerName(p))}${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}${p.talent ? ' 💎' : ''}</div>
            <div class="text-[11px] ${sub}">${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l. · <b>OVR ${Selectors.ovr(p)}</b> (drużyna ${Selectors.teamOvr()}) · ${Selectors.skillLabel(p.skill)}</div>
          </div>
          ${UI.profileBadge(p.profile)}
        </div>
        <div class="grid grid-cols-4 gap-2 mt-2 text-center">
          ${stat('Mecze', last ? ps.apps : p.seasonApps)}${stat('Gole', last ? ps.goals : p.seasonGoals)}${stat('Śr. nota', UI.ratingBadge(last ? ps.avg : Selectors.avgRating(p)))}${stat('Ost. mecz', UI.ratingBadge(p.lastRating))}
        </div>
        <div class="text-[10.5px] ${sub} mt-1.5">Sezon ${last ? gameState.calendar.season - 1 + ' (zakończony)' : gameState.calendar.season} · w klubie: ${p.apps} m, ${p.goals} g${Selectors.careerRating(p) != null ? ', śr. ' + Selectors.ratingText(Selectors.careerRating(p)) : ''} · ${p.wage} zł/tydz.</div>
      </div>`;
  },

  cutsceneOverlay(d) {
    const opts = d.options.map((o, i) => `
      <button data-action="resolve-decision" data-decision="${d.id}" data-option="${i}"
        class="btn-press w-full text-left px-3.5 py-2.5 rounded-xl bg-desk-800 border border-desk-600 active:bg-desk-700">
        <span class="block text-[14px] font-semibold text-paper-100 leading-snug">${Utils.escape(Utils.val(o.label))}</span>
        <span class="block text-[11.5px] text-paper-400 leading-snug">${Utils.escape(Utils.val(o.hint))}</span>
      </button>`).join('');
    return UI.overlayFrame(`
      <div class="h-6 bg-black flex-shrink-0"></div>
      <div class="flex-1 min-h-0 overflow-y-auto px-5 py-4 text-paper-100 flex flex-col">
        <div class="cut-icon text-center text-[64px] leading-none mt-2">${d.cutscene.icon}</div>
        <div class="text-center text-[10.5px] uppercase tracking-[0.2em] text-amber-glow font-semibold mt-3">${Utils.escape(d.cutscene.place)}</div>
        <h2 class="text-center text-[24px] font-extrabold tracking-tight leading-tight mt-1">${Utils.escape(Utils.val(d.title))}</h2>
        <div class="text-center text-[11px] text-paper-400 mt-0.5">${Utils.escape(Utils.val(d.from))}</div>
        <p class="text-[14.5px] leading-relaxed text-paper-200 italic mt-4">${Utils.escape(Utils.val(d.body))}</p>
        ${d.player ? UI.playerCard(d.player(), true) : ''}
        <div class="text-[10.5px] uppercase tracking-wider text-paper-400 font-semibold mt-5 mb-1.5">Decyzja prezesa</div>
        <div class="grid gap-2">${opts}</div>
      </div>
      <div class="h-6 bg-black flex-shrink-0"></div>`, 'bg-[#0b0f16]');
  },

  // Podsumowanie roczne: miejsce, bilans, emerytury i nowi w kadrze – wszystko naraz, po ostatniej kolejce
  // Baraże: każdy mecz z wynikiem, dwumecz i karne, na końcu werdykt
  playoffOverlay(po) {
    const name = Selectors.clubDisplayName();
    const legs = po.legs.map((l) => {
      const [h, a, hg, ag] = l.home ? [name, l.opp, l.gf, l.ga] : [l.opp, name, l.ga, l.gf];
      const tone = l.gf > l.ga ? 'text-grass' : l.gf < l.ga ? 'text-stamp' : 'text-paper-200';
      return `
      <div class="rounded-xl bg-desk-800 px-3 py-2.5">
        <div class="text-[10.5px] uppercase tracking-wider text-paper-400 font-semibold">${l.label} · ${l.home ? 'u siebie' : 'wyjazd'}</div>
        <div class="flex items-center gap-2 mt-1">

        <div class="text-center text-[52px] leading-none">⚔️</div>
        <div class="text-center text-[10.5px] uppercase tracking-[0.2em] text-amber-glow font-semibold mt-3">Po sezonie</div>
        <h2 class="text-center text-[22px] font-extrabold tracking-tight mt-1">${Utils.escape(po.title)}</h2>
        <div class="space-y-1.5 mt-4">${legs}</div>
        ${po.agg ? `<div class="text-center text-[13px] text-paper-300 mt-2">Dwumecz: <b class="text-paper-100">${po.agg}</b>${po.pens ? ' · karne <b class="text-amber-glow">' + po.pens + '</b>' : ''}</div>` : ''}
        <div class="text-center text-[22px] font-extrabold mt-4 ${verdict[1]}">${verdict[0]}</div>
      </div>
      <div class="flex-shrink-0 px-4 pb-4 pt-2">

      </div>`, 'bg-[#0b0f16]');
  },

      euro: ['🇪🇺 EUROPEJSKIE PUCHARY', 'text-amber-glow'], poLost: ['💔 Przegrany baraż o awans', 'text-paper-200'], poSafe: ['😮‍💨 Utrzymanie w barażach', 'text-grass'],
      releg: ['⬇️ SPADEK', 'text-stamp'], forced: ['⚖️ Przymusowa degradacja', 'text-stamp'], banned: ['⛔ Awans odebrany za aferę', 'text-stamp'], shame: ['🏮 Czerwona latarnia', 'text-stamp'],

      <div class="rounded-xl bg-desk-800 px-3 py-2">

        ${items.length ? `<ul class="space-y-0.5">${items.map((x) => `<li class="text-[12.5px] truncate">${Utils.escape(x)}</li>`).join('')}</ul>` : `<p class="text-[12px] text-paper-400">${empty}</p>`}
      </div>`;
    return UI.overlayFrame(`
      <div class="flex-1 min-h-0 overflow-y-auto px-4 pt-6 pb-3 text-paper-100">
