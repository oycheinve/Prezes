      out[pos] = { short, weakest, avg: Math.round(avg), score: short * 12 + Math.max(0, team - avg) * 1.5 };
    });
    return out;
  },
  // Prawa TV za mecz (po zainstalowaniu kamer): rosną z ligą
  // Wartość rynkowa (zł): OVR względem typowego zawodnika ligi, wiek, talent, potencjał; stałe odchylenie osobnicze i widełki ligi
  marketValue: (p, lvl = gameState.club.leagueLevel) => {
    const L = DATA.leagueLevels[lvl] || DATA.leagueLevels[1], T = DATA.tmValues[lvl] || DATA.tmValues[1];
    const avgOvr = 32 + 3.6 * (5.5 + L.skillBonus);
    if (p.tmVar == null) p.tmVar = Math.round(Utils.randRange(0.8, 1.25) * 100) / 100;   // odchylenie: ten sam zawodnik zawsze tak samo wyceniany
    const age = p.age <= 21 ? 1.35 : p.age <= 24 ? 1.15 : p.age >= 33 ? 0.4 : p.age >= 30 ? 0.7 : 1;
    const pot = 1 + Math.max(0, Selectors.potential(p) - p.skill) * 0.06;
    const v = T.avg * Math.exp(0.13 * (Selectors.ovr({ ...p, formHistory: [] }) - avgOvr)) * age * pot * (p.talent ? 1.4 : 1) * p.tmVar * 0.7;   // 0.7: kalibracja do średnich z tabel
    const c = Utils.clamp(v, T.min, T.max);
    const step = c >= 1e6 ? 1e5 : c >= 1e5 ? 1e4 : c >= 1e4 ? 1e3 : c >= 1000 ? 100 : 10;
    return Math.round(c / step) * step;
  },
  // Cena w złotówkach gry wynika z wartości rynkowej: typowa cena ligi × (wartość/średnia)^0.7, twarde widełki 0,3–4×
  feeFromValue: (v, lvl = gameState.club.leagueLevel) => {
    const L = DATA.leagueLevels[lvl] || DATA.leagueLevels[1], T = DATA.tmValues[lvl] || DATA.tmValues[1];
    const base = (50 + (5.5 + L.skillBonus) * 28) * L.econ;
    return Math.round(Utils.clamp(base * Math.pow(v / T.avg, 0.7), base * 0.3, base * 4) / 10) * 10;
  },
  squadValue: () => gameState.squad.filter((p) => !p.loan).reduce((s, p) => s + Selectors.marketValue(p), 0),
  // Marka klubu rośnie z czasem: świeżo awansowany klub zarabia mniej (kibice, sponsorzy, TV dopiero się przekonują)
  establishedFactor: () => { const since = gameState.club.levelSince; if (since == null) return 1; const y = gameState.calendar.season - since; return y <= 0 ? 0.75 : y === 1 ? 0.88 : 1; },
  revEcon: () => Selectors.econ() * Selectors.establishedFactor(),
  tvIncome: () => (gameState.stadium.upgrades.tvcams ? Math.round(15 * Selectors.revEcon() * (1 + 0.35 * (gameState.club.leagueLevel - 1)) / 5) * 5 : 0),
  // Lista województw do <select> (alfabetycznie)
  regionOptions: (cur) => DATA.cupRegions.map((r, i) => ({ i, n: Selectors.voivodeship(i) })).sort((a, b) => a.n.localeCompare(b.n, 'pl'))
    .map((x) => `<option value="${x.i}"${String(cur) === String(x.i) ? ' selected' : ''}>${Utils.escape(x.n)}</option>`).join(''),
  // Ścieżka awansów od B-klasy do Ekstraklasy dla województwa (bieżący szczebel wyróżniony)
  promoPath: (region, cur = 0) => {
    const has = region !== '' && region != null && DATA.cupRegions[+region];
    const g = has ? [2, 0, 1, 2, 3, 1, 0, 3, 3, 1, 1, 0, 0, 3, 2, 2][+region] : null;
    const path = Selectors.levelsPath(region);
    const steps = path.map((i) => (i === 3.5 ? 'V liga' : i === 4 && has ? 'IV liga (woj. ' + Selectors.voivodeship(+region).toLowerCase() + ')' : i === 5 && has ? 'III liga gr. ' + ['I', 'II', 'III', 'IV'][g] : DATA.leagueLevels[i].name));
    return steps.map((t, k) => (path[k] === cur ? `<b class="text-ink-900 underline">${Utils.escape(t)}</b>` : Utils.escape(t))).join(' → ');
  },
  voivodeship: (i = gameState.club.region) => { const r = DATA.cupRegions[i]; return r ? r[0].replace(/ki$/, 'kie') : '–'; },
  groupLabel: (g = Selectors.leagueGroup()) => ['I (mazowiecko-podlasko-warmińsko-łódzka)', 'II (wielkopolsko-pomorsko-kujawska)', 'III (śląsko-dolnośląsko-opolsko-lubuska)', 'IV (małopolsko-podkarpacko-lubelsko-świętokrzyska)'][g],
  // Pula klubów ligi; III liga – grupa wg województwa klubu (I: Mazowsze/Podlasie/Warmia/Łódzkie, II: Wielkopolska/Pomorze/Kujawy, III: Śląsk/Dolny Śląsk/Opolskie/Lubuskie, IV: Małopolska/Podkarpacie/Lubelskie/Świętokrzyskie)
  leagueGroup: () => { const r = gameState.club.region != null ? gameState.club.region : 1; return [2, 0, 1, 2, 3, 1, 0, 3, 3, 1, 1, 0, 0, 3, 2, 2][r] || 0; },
  // 13.68: ścieżka szczebli zależna od województwa – V liga (3.5) tylko w małopolskim, mazowieckim, śląskim i wielkopolskim
  hasVLiga: (region = gameState.club.region) => region !== '' && region != null && DATA.vRegions.includes(+region),
  levelsPath: (region = gameState.club.region) => (Selectors.hasVLiga(region) ? [1, 2, 3, 3.5, 4, 5, 6, 7, 8] : [1, 2, 3, 4, 5, 6, 7, 8]),
  nextLevel: (l = gameState.club.leagueLevel) => { const P = Selectors.levelsPath(), i = P.indexOf(l); return i >= 0 ? P[Math.min(i + 1, P.length - 1)] : Math.min(8, Math.floor(l) + 1); },
  prevLevel: (l = gameState.club.leagueLevel) => { const P = Selectors.levelsPath(), i = P.indexOf(l); return i >= 0 ? P[Math.max(i - 1, 0)] : Math.max(1, Math.ceil(l) - 1); },
  stepLevel: (l, n) => { let x = l; for (let k = 0; k < Math.abs(n); k++) x = n > 0 ? Selectors.nextLevel(x) : Selectors.prevLevel(x); return x; },
  vGroup: () => { const G = DATA.vLiga.vgroups[gameState.club.region]; if (!G) return null; const i = gameState.club.vGroup; return G[i] || G[0]; },
  leaguePool: (level, region = gameState.club.region) => { const L = DATA.leagueLevels[level]; if (!L) return null; if (L.vgroups) { const G = L.vgroups[region]; return G ? (G[gameState.club.vGroup] || G[0]).clubs : Object.values(L.vgroups)[0][0].clubs; } if (L.regions && L.regions[region]) return L.regions[region]; if (level <= 3 && DATA.lowerLeagues[region]) return DATA.lowerLeagues[region][level]; return L.groups ? L.groups[Selectors.leagueGroup()] : L.pool; },
  // Czy liga ma prawdziwe kluby ułożone wg tabeli (siła zależna od miejsca)
  leagueReal: (level, region = gameState.club.region) => { const L = DATA.leagueLevels[level]; return !!(L && (L.ordered || L.vgroups || (L.regions && L.regions[region]))); },
  // Poziom rozgrywkowy klubu po nazwie (pule, grupy III ligi, województwa IV ligi)
  levelOfClub: (club) => {
    const i = DATA.leagueLevels.findIndex((L) => L && ((L.pool && L.pool.includes(club)) || (L.groups && L.groups.some((g) => g.includes(club))) || (L.regions && Object.values(L.regions).some((g) => g.includes(club)))));
    if (i > 0) return i;
    for (const r of Object.values(DATA.lowerLeagues)) for (const lv of [1, 2, 3]) if (r[lv].includes(club)) return lv;
    return Object.values(DATA.vLiga.vgroups).some((G) => G.some((g) => g.clubs.includes(club))) ? 3.5 : -1;
  },
  cupRounds: (c = gameState.cup) => (c && c.path === 'regional' ? DATA.cupRegional : DATA.cupCentral),
  cupName: (c = gameState.cup) => (c && c.path === 'regional' ? Selectors.cupRegion()[0] + ' Puchar Polski' : 'Puchar Polski'),
  cupRegion: () => { const i = gameState.club.region != null ? gameState.club.region : 0; return DATA.cupRegions[i] || DATA.cupRegions[0]; },
  // Mecz pucharowy po danej kolejce ligowej (środa), jeśli jesteśmy w grze
  cupAt: (kolejka) => {
    const c = gameState.cup;
    if (!c || !c.alive || c.season !== gameState.calendar.season) return null;
    const R = Selectors.cupRounds(c)[c.idx];
    if (!R || Selectors.euroKolejka(R.k) !== kolejka) return null;
    return { R, next: c.next && c.next.idx === c.idx ? c.next : Engine.cupDraw() };
  },
  euroLpStandings: () => {
    const T = (gameState.euro && gameState.euro.lpTable) || {};
    return Object.keys(T).map((team) => ({ team, ...T[team] })).sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf || b.s - a.s);
  },
  // 13.73: europejski mecz w tygodniu danej kolejki (do terminarza)
  // 13.75: kalendarz bieżącej fazy pucharu (znane terminy: faza ligowa do końca, oba mecze dwumeczu, finał)
  euroSchedule: () => {
    if (!Selectors.euroLive()) return [];
    const eu = gameState.euro, st = DATA.euro.stages[eu.stage], C = DATA.euro.comps[eu.comp];
    const out = [];
    if (eu.tie) return [{ k: eu.tie.k + 1, C, label: st.label + ' · rewanż', where: 'u siebie', opp: eu.tie.opp.name, next: true }];
    if (eu.stage === 'LP') {
      for (let i = eu.lp ? eu.lp.played : 0; i < C.lpGames; i++) out.push({ k: Selectors.euroKolejka(st.kolejki[i]), C, label: (i + 1) + '. kolejka fazy ligowej', where: i % 2 === 0 ? 'u siebie' : 'wyjazd', opp: i === (eu.lp ? eu.lp.played : 0) ? Engine.euroNextOpp().name : 'losowanie UEFA', next: i === (eu.lp ? eu.lp.played : 0) });
      return out;
    }
    const k = Selectors.euroKolejka(st.kolejka), opp = Engine.euroNextOpp().name;
    if (st.tie) return [{ k, C, label: st.label + ' · 1. mecz', where: 'wyjazd', opp, next: true }, { k: k + 1, C, label: st.label + ' · rewanż', where: 'u siebie', opp, next: false }];
    return [{ k, C, label: st.label, where: 'finał', opp, next: true }];
  },
  euroAt: (k) => Selectors.euroSchedule().find((x) => x.k === k) || null,
  euroKolejka: (k) => Math.max(1, Math.round(k * (gameState.season.rounds || []).length / 34)),
  // Kwalifikacja z miejsca w Ekstraklasie: 1. el. LM (mistrzowska), 2. el. LM (ligowa), 3. el. LE, 4. el. LKE
  euroQualFor: (pos) => ({ 1: { comp: 'UCL', path: 'champ' }, 2: { comp: 'UCL', path: 'league' }, 3: { comp: 'UEL', path: 'league' }, 4: { comp: 'UECL', path: 'league' } }[pos] || null),
  euroQualLabel: (q) => 'eliminacje ' + DATA.euro.comps[q.comp].name + (q.comp === 'UCL' ? (q.path === 'champ' ? ' (ścieżka mistrzowska)' : ' (ścieżka ligowa)') : q.path === 'cup' ? ' (zdobywca Pucharu Polski)' : ''),
  persuadeChance: (p) => {
    if (!p) return 0;
    const pos = Selectors.ourPosition(), n = Selectors.leagueSize();
    let c = 0.3;
    c += (gameState.morale.lockerRoom - 50) * 0.004;
    c += (gameState.morale.fans - 50) * 0.003;
    c += gameState.lastSeason && ['promo', 'title', 'euro', 'podium'].includes(gameState.lastSeason.outcome) ? 0.12 : 0;
    c += pos && pos <= Math.ceil(n / 4) ? 0.06 : 0;
    c += p.favorite ? 0.12 : 0;
    c += p.legend ? 0.1 : 0;
    c += p.age >= 30 ? 0.1 : p.age <= 22 ? -0.08 : 0;
    c += Selectors.coach().quality * 0.8;
    c -= Math.max(0, Selectors.ovr(p) - Selectors.teamOvr() - 7) * 0.02;   // im bardziej przerasta klub, tym trudniej
    c -= gameState.club.leagueLevel >= 7 ? 0 : 0.03;                         // z niższej ligi łatwiej uciec
    c += Selectors.euroThisSeason() ? 0.15 : 0;                               // kto by uciekał z pucharów?
    return Utils.clamp(c, 0.08, 0.8);
  },
  persuadeWage: (p) => Math.round(p.wage * 1.4 / 5) * 5 + 5,
  freeStaffSlot: () => Object.keys(DATA.staffSlots).find((k) => !gameState.staff[k]) || null,
  currentRetiree: () => gameState.retirees[0] || null,
  projectedLineup: () => Engine.pickLineup([]),
  wageLabel: (w) => (w <= 5 ? 'zwrot za paliwo' : w <= 15 ? 'paliwo + skrzynka po meczu' : 'stypendium'),
  avgRating: (p) => (p.seasonRatingCount ? Math.round(p.seasonRatingSum / p.seasonRatingCount * 10) / 10 : null),
  careerRating: (p) => (p.careerRatingCount ? Math.round(p.careerRatingSum / p.careerRatingCount * 10) / 10 : null),
  ratingText: (r) => (r == null ? '–' : r.toFixed(1)),
  skillLabel: (s) => {
    if (s >= 15) return 'Materiał na kadrę';
    if (s >= 13) return 'Ekstraklasowy wyjadacz';
    if (s >= 11) return 'Ligowy kozak';
    if (s >= 9) return 'Gwiazda powiatu';
    if (s >= 8) return 'Gwiazda gminy';
    if (s >= 7) return 'Ciągnie grę';
    if (s >= 6) return 'Pewniak';
    if (s >= 5) return 'Solidny rzemieślnik';
    if (s >= 4) return 'Ambitny, ale…';
    return 'Ogórek z łapanki';
  },
  chemLabel: (c) => {
    if (c >= 80) return 'Jak jedna rodzina na weselu';
    if (c >= 65) return 'Rozumieją się bez słów';
    if (c >= 50) return 'Jakoś się dogadują';
    if (c >= 35) return 'Każdy gra swoje';
    return 'Wojna domowa';
  },
  upcomingRundaName: () => (gameState.calendar.round < Selectors.rundaLen() ? 'jesienną' : 'wiosenną'),
  nextHomeFixture: () => {
    for (let i = gameState.calendar.round; i < gameState.season.rounds.length; i++) {
      const f = Selectors.fixtureAt(i);
      if (f.home) return { fixture: f, kolejka: i + 1 };
    }
    return null;
  },
  weekLabel: () => {
    const c = gameState.calendar;
    return 'Sezon ' + c.season + ' · ' + (c.week <= CONFIG.preseasonWeeks
      ? 'Tydzień ' + c.week + ' – Przedsezon'
      : 'Tydzień ' + c.week + ' – Kolejka ' + (c.round + 1));
  },
  moodLabel: (v) => {
    if (v >= 80) return 'Euforia';
    if (v >= 60) return 'Dobrze';
    if (v >= 40) return 'Tak se';
    if (v >= 20) return 'Ferment';
    return 'Bunt';
  },
  moodColor: (v) => {
    if (v >= 60) return 'bg-grass';
    if (v >= 40) return 'bg-amber-glow';
    return 'bg-stamp';
  },
  // 13.72: im wyższa liga, tym surowsi eksperci i sędziowie – ta sama murawa dostaje gorszą ocenę
  pitchStrict: (lvl = gameState.club.leagueLevel) => ({ 1: 0, 2: 3, 3: 6, 3.5: 8, 4: 10, 5: 14, 6: 18, 7: 23, 8: 28 }[lvl] || 0),
  pitchScore: (v, lvl = gameState.club.leagueLevel) => v - Selectors.pitchStrict(lvl),
  pitchLabel: (v, lvl = gameState.club.leagueLevel) => {
    const e = Selectors.pitchScore(v, lvl), b = Selectors.band(lvl);
    const L = [['Dywan (jak na wieś)', 'Przyzwoita trawa', 'Łysiny w polu karnym', 'Kretowisko', 'Kartoflisko'],
      ['Równa płyta', 'Przyzwoita trawa', 'Łysiny – sędzia kręci nosem', 'Kretowisko – uwagi delegata', 'Kartoflisko – grozi walkower'],
      ['Murawa na poziomie', 'Przeciętna – eksperci marudzą', 'Krytykowana w studiu TV', 'Skandal – nota od delegata PZPN', 'Boisko nie do gry']][b];
    return L[e >= 80 ? 0 : e >= 60 ? 1 : e >= 40 ? 2 : e >= 20 ? 3 : 4];
  },
  facilityLabels: () => [
    gameState.stadium.upgrades.boiler ? 'Blaszak z ciepłą wodą (przez pierwsze 10 minut)' : 'Blaszak bez ciepłej wody',
    gameState.stadium.upgrades.roof ? 'Trybuna: 30 krzesełek pod wiatą + skarpa' : 'Trybuna: skarpa i 6 ławek z PRL-u',
    gameState.stadium.upgrades.roller ? 'Walec Kazika stoi za bramką (Kazik czasem go zabiera)' : 'Sprzęt: grabie, taczka i kosiarka szwagra',
  ],
};

/* ---------------------------------------------------------------------
   4. ZAPIS GRY (localStorage)
   --------------------------------------------------------------------- */
const Storage = {
  KEY: 'bklasa-prezes-save',

  save() {
    if (gameState.screen !== 'game') return;
    try { localStorage.setItem(Storage.KEY, JSON.stringify(gameState)); } catch (e) { /* brak miejsca / tryb prywatny */ }
  },

  load() {
    try {
      const raw = localStorage.getItem(Storage.KEY);
      if (!raw) return null;
      return Storage.migrate(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  },

  clear() {
    try { localStorage.removeItem(Storage.KEY); } catch (e) { /* ignorujemy */ }
  },

  // Nowe pola z createInitialState trafiają do starych zapisów automatycznie.
  migrate(saved) {
    const merge = (def, src) => {
      if (src === undefined) return def;
      if (def && typeof def === 'object' && !Array.isArray(def) && src && typeof src === 'object' && !Array.isArray(src)) {
        const out = { ...def };
        Object.keys(src).forEach((k) => { out[k] = merge(def[k], src[k]); });
        return out;
      }
      return src;
    };
    const oldVersion = saved.version || 1;
    const state = merge(createInitialState(), saved);
    state.version = CONFIG.saveVersion;
    state.ui.startError = '';
    if (!state.weather) state.weather = DATA.weather[1];
    state.pendingDecisions = (state.pendingDecisions || []).filter((id) => DATA.decisions[id]);
    state.ui.folds = {};   // akordeon: po wczytaniu wszystko zwinięte
    if (state.loans && state.loans.given && state.loans.given.length) {   // Krok 13.26: nie pożyczamy już innym – stare należności wracają
      state.finance.budget += state.loans.given.reduce((s, l) => s + (l.amount || 0), 0);
    }
    if (state.loans) state.loans.given = [];
    if (!state.trophies) state.trophies = [];
    // 13.62: prawdziwe kluby od III ligi – podmiana nazw rywali w trwającym sezonie
    const lvl62 = state.club && state.club.leagueLevel;
    const L62 = lvl62 >= 5 && DATA.leagueLevels[lvl62];
    if (L62 && state.league && state.league.rivals && !state.league.rivals.some((r) => L62.pool.includes(r.name))) {
      const keep = state.club.region;
      const g = L62.groups ? L62.groups[[2, 0, 1, 2, 3, 1, 0, 3, 3, 1, 1, 0, 0, 3, 2, 2][keep != null ? keep : 1] || 0] : L62.pool;
      const map = {};
      state.league.rivals.forEach((r, i) => { map[r.name] = g[i % g.length]; r.name = map[r.name]; });
      const ren = (o) => { const out = {}; Object.keys(o || {}).forEach((k) => { out[map[k] || k] = o[k]; }); return out; };
      const sn = state.season || {};
      sn.table = ren(sn.table); sn.strength = ren(sn.strength);
      (sn.rounds || []).forEach((rd) => rd.forEach((f) => { f.home = map[f.home] || f.home; f.away = map[f.away] || f.away; }));
      (sn.lastResults || []).forEach((f) => { f.home = map[f.home] || f.home; f.away = map[f.away] || f.away; });
    }
    // 13.65: prawdziwe kluby IV ligi w województwie klubu – podmiana nazw w trwającym sezonie
    const R65 = (lvl62 === 4 && state.club.region != null && DATA.leagueLevels[4].regions[state.club.region]) || (lvl62 <= 3 && Number.isInteger(lvl62) && state.club.region != null && DATA.lowerLeagues[state.club.region] && DATA.lowerLeagues[state.club.region][lvl62].filter((n) => n !== state.club.name));   // 13.69: także B-klasa, A-klasa, okręgówka
    if (R65 && state.league && state.league.rivals && !state.league.rivals.some((r) => R65.includes(r.name))) {
      const map = {};
      state.league.rivals.forEach((r, i) => { if (i < R65.length && R65[i] !== state.club.name) { map[r.name] = R65[i]; r.name = R65[i]; } });
      const ren = (o) => { const out = {}; Object.keys(o || {}).forEach((k) => { out[map[k] || k] = o[k]; }); return out; };
      const sn = state.season || {};
      sn.table = ren(sn.table); sn.strength = ren(sn.strength);
      (sn.rounds || []).forEach((rd) => rd.forEach((f) => { f.home = map[f.home] || f.home; f.away = map[f.away] || f.away; }));
      (sn.lastResults || []).forEach((f) => { f.home = map[f.home] || f.home; f.away = map[f.away] || f.away; });
    }
    if (saved.budkaGate == null && saved.screen === 'game' && state.stadium && state.stadium.upgrades) state.stadium.upgrades.kiosk = true;   // 13.85: stare zapisy zachowują budkę
    state.budkaGate = true;
    (state.squad || []).forEach((p) => { delete p.bargain; delete p.fireSale; });   // 13.59: własni zawodnicy bez etykiet z giełdy
    if (saved.merch && saved.merch.level == null) state.merch.level = 3;   // 13.50: stare zapisy miały kubki, szaliki i koszulki
    (state.squad || []).filter((p) => p.ace).forEach((p) => { p.nick = 'Chudy'; p.noNick = true; });   // 13.46: bez „Kacperinho”
    if (!state.u19) { const prev = gameState; gameState = state; Engine.u19Init(); gameState = prev; }   // Krok 13.35: akademia U19 w starych zapisach
    // Krok 13.26: bez skautingu – szkółka przechodzi do obiektów, skaut ze sztabu odchodzi
    if (!saved.academy && state.scouting && state.scouting.youthUpgrades) state.academy.level = (state.scouting.youthUpgrades.dresy ? 1 : 0) + (state.scouting.youthUpgrades.wfista ? 1 : 0);
    if (state.activeTab === 'scouting') state.activeTab = 'desk';
    state.pendingDecisions = state.pendingDecisions.filter((id) => id !== 'derbySecurity' && id !== 'veteranStaff');
    state.retirees = [];
    // Stadion z pojemnością (Krok 13.17): starsze zapisy dostają trybuny wymagane w obecnej lidze
    if (!saved.stadium || saved.stadium.level == null) state.stadium.level = DATA.licenseCapacity[state.club.leagueLevel] || 0;
    (state.squad || []).concat((state.loansOut || []).map((l) => l.player)).forEach((p) => { if (p.potential == null) Engine.rollPotential(p); if (p.temper == null) p.temper = Engine.rollTemper(p); });
    delete state.seasonTickets;
    if (!state.club.town) {
      const words = String(state.club.name || '').trim().split(/\s+/);
      state.club.town = words.length > 1 ? words.slice(1).join(' ') : (words[0] || 'Gmina');
    }
    if (oldVersion < 3 || !state.season.rounds || !state.season.rounds.length) {
      // Reforma ligi (10 drużyn): nowy terminarz od 1. kolejki.
      delete state.season.schedule;
      const prev = gameState; gameState = state;
      state.calendar.round = 0;
      Engine.newSeason();
      Engine.addLog('📠 Związek przysłał faksem nowy terminarz: liga rozszerzona do 10 drużyn, sezon liczy się od nowa. Kadra i sztab czekają w nowych zakładkach.', 'system');
      gameState = prev;
    }
    return state;
  },
};

/* ---------------------------------------------------------------------
   5. RENDEROWANIE UI
   --------------------------------------------------------------------- */
const UI = {
  _uid: 0,                   // unikalne id dla clipPath w herbach SVG

  root: () => document.getElementById('app'),

  renderAll() {
    UI._uid = 0;
    UI.applyTheme(gameState.screen === 'start' ? gameState.ui.form.colors : gameState.club.colors);
    // Obszar roboczy przewija się sam – po akcji w tym samym widoku zostajemy w tym samym miejscu
    const work = document.getElementById('work');
    const key = gameState.activeTab + ':' + UI.sub(gameState.activeTab, '') + ':' + gameState.ui.deskView + ':' + gameState.calendar.week;
    const keep = work && work.dataset.key === key ? work.scrollTop : 0;
    const root = UI.root();
    root.innerHTML = gameState.screen === 'start' ? UI.startScreen()
      : gameState.screen === 'gameover' ? UI.gameOverScreen()
      : UI.gameScreen();
    const fresh = document.getElementById('work');
    if (fresh) { fresh.dataset.key = key; fresh.scrollTop = keep; }
    if (gameState.screen === 'game') UI.animateMatch();
  },

  /* ---------- Motyw: barwy klubu jako akcenty interfejsu ---------- */
  theme(colorsId) {
    const c = DATA.clubColors[colorsId] || { c1: '#10b981', c2: '#f59e0b' };
    const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const lum = (hex) => {
      const [r, g, b] = rgb(hex).map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    };
    const sat = (hex) => { const v = rgb(hex); return Math.max(...v) - Math.min(...v); };
    const usable = (hex) => lum(hex) > 0.02 && lum(hex) < 0.8 && sat(hex) > 0.2;   // bez bieli i czerni
    const pick = [c.c1, c.c2].filter(usable);
    const accent = pick.length ? pick[0] : c.c1;
    const accent2 = accent === c.c1 ? c.c2 : c.c1;
    const mix = (hex, t) => '#' + rgb(hex).map((v) => Math.round((v + (1 - v) * t) * 255).toString(16).padStart(2, '0')).join('');
    return {
      c1: c.c1, c2: c.c2, accent, accent2,
      accentText: lum(accent) < 0.2 ? mix(accent, 0.45) : accent,
      onAccent: lum(accent) > 0.4 ? '#0f172a' : '#ffffff',
    };
  },

  applyTheme(colorsId) {
    const t = UI.theme(colorsId);
    const st = document.documentElement.style;
    st.setProperty('--c1', t.c1); st.setProperty('--c2', t.c2);
    st.setProperty('--accent', t.accent); st.setProperty('--accent2', t.accent2);
    st.setProperty('--accent-text', t.accentText); st.setProperty('--on-accent', t.onAccent);
    // akcent na ciemnym tle (pasek, tytuły, menu) – jaśniejsza wersja barwy klubu
    st.setProperty('--glow-rgb', [1, 3, 5].map((i) => parseInt(t.accentText.slice(i, i + 2), 16)).join(' '));
  },

  initials(name) {
    const words = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return '?';
    if (/^[A-ZĄĆĘŁŃÓŚŹŻ]{2,4}$/.test(words[0])) return words[0];
    return words.slice(0, 3).map((w) => w[0]).join('').toUpperCase();
  },

  // Tarcza klubu w barwach (SVG); neutral = herb rywala
  crest(colorsId, name, size = 48, neutral = false) {
    const c = neutral ? { c1: '#475569', c2: '#334155' } : (DATA.clubColors[colorsId] || { c1: '#10b981', c2: '#f59e0b' });
    const id = 'cr' + (++UI._uid);
    const ini = Utils.escape(UI.initials(name)).slice(0, 4);
    const fs = ini.length > 2 ? 17 : 22;
    return `
    <svg width="${size}" height="${Math.round(size * 1.12)}" viewBox="0 0 64 72" class="flex-shrink-0 drop-shadow-lg" aria-hidden="true">
      <defs><clipPath id="${id}"><path d="M32 3 L59 11 V35 C59 52 46 63 32 69 C18 63 5 52 5 35 V11 Z"/></clipPath></defs>
      <g clip-path="url(#${id})">
        <rect width="64" height="72" fill="${c.c1}"/>
        <rect x="32" width="32" height="72" fill="${c.c2}"/>
        <rect y="24" width="64" height="20" fill="rgba(15,23,42,.55)"/>
      </g>
      <path d="M32 3 L59 11 V35 C59 52 46 63 32 69 C18 63 5 52 5 35 V11 Z" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.5"/>
      <text x="32" y="${34 + fs / 3}" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="800" font-size="${fs}" fill="#fff">${ini}</text>
    </svg>`;
  },

  // Koszulka meczowa w pasy klubowe (podgląd w kreatorze)
  kit(colorsId, size = 120) {
    const c = DATA.clubColors[colorsId] || { c1: '#10b981', c2: '#f59e0b' };
    const id = 'kit' + (++UI._uid);
    return `
    <svg width="${size}" height="${size}" viewBox="0 0 80 80" class="drop-shadow-xl" aria-hidden="true">
      <defs>
        <pattern id="${id}" width="12" height="80" patternUnits="userSpaceOnUse">
          <rect width="6" height="80" fill="${c.c1}"/><rect x="6" width="6" height="80" fill="${c.c2}"/>
        </pattern>
      </defs>
      <path d="M22 9 L32 5 Q40 12 48 5 L58 9 L75 23 L66 33 L59 28 L59 75 L21 75 L21 28 L14 33 L5 23 Z" fill="url(#${id})" stroke="rgba(15,23,42,.6)" stroke-width="1.5"/>
      <path d="M5 23 L22 9 L21 28 L14 33 Z M75 23 L58 9 L59 28 L66 33 Z" fill="${c.c1}" stroke="rgba(15,23,42,.6)" stroke-width="1.2"/>
      <path d="M32 5 Q40 12 48 5" fill="none" stroke="${c.c2}" stroke-width="3"/>
      <text x="40" y="52" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="18" fill="#fff" stroke="rgba(15,23,42,.7)" stroke-width="1.2" paint-order="stroke">10</text>
    </svg>`;
  },

  /* ---------- EKRAN STARTOWY ---------- */
  colorsBadge(colorsId, size = 'w-5 h-5') {
    const c = DATA.clubColors[colorsId];
    if (!c) return '';
    return `<span class="inline-block ${size} align-middle border border-paper-400 rounded-lg flex-shrink-0" title="Barwy: ${c.label}" style="background:linear-gradient(135deg, ${c.c1} 50%, ${c.c2} 50%)"></span>`;
  },

  // Podgląd klubu: herb i koszulka w barwach – odświeżany na żywo podczas pisania
  formPreview() {
    const f = gameState.ui.form;
    const name = Selectors.formClubName(f) || 'Twój Klub';
    const t = DATA.townTypes[f.character];
    const c = DATA.clubColors[f.colors];
    return `
      <div class="flex items-end justify-center gap-3 rounded-lg bg-desk-900 py-4">${UI.crest(f.colors, name, 76)}${UI.kit(f.colors, 88)}</div>
      <div class="font-type text-2xl font-bold leading-tight break-words mt-3 text-center">${Utils.escape(name)}</div>
      <div class="text-xs text-ink-700 text-center">${c ? 'Nasi ' + c.nick : ''}${f.town.trim() ? ' · ' + Utils.escape(f.town.trim()) : ''}</div>
      <div class="text-sm mt-3 space-y-1">
        <div>🏟️ ${Utils.escape(f.stadium.trim() || Selectors.defaultStadium(f.town.trim()))}</div>
        <div>${t.icon} ${t.label}</div>
        <div>🧑‍💼 ${Utils.escape(f.president.trim() || 'Prezes')}</div>
      </div>`;
  },

  /* ---------- EKRAN STARTOWY: KARTA REJESTRACYJNA KLUBU ---------- */
  startScreen() {
    if (!gameState.ui.startQuote) gameState.ui.startQuote = Utils.rand(DATA.quotes);
    const q = gameState.ui.startQuote;
    const f = gameState.ui.form;
    const save = Storage.load();

    const chip = (field, value, active, label) => `
      <button data-action="form-set" data-field="${field}" data-value="${Utils.escape(value)}"
        class="btn-press px-3 py-1.5 border border-paper-400 rounded-lg text-sm font-mono ${active ? 'bg-ink-900 text-paper-100' : 'bg-paper-200 hover:bg-paper-300 text-ink-900'}">${label}</button>`;
    const input = (field, value, placeholder, max, extra = '') => `
      <input data-field="${field}" type="text" maxlength="${max}" autocomplete="off" value="${Utils.escape(value)}" placeholder="${Utils.escape(placeholder)}"
        class="w-full px-3 py-2 bg-paper-100 border border-paper-400 rounded-lg font-type text-lg text-ink-900 placeholder:text-paper-400 focus:outline-none focus:ring-4 focus:ring-amber-glow/50 ${extra}" />`;
    const section = (no, title, body) => `
      <fieldset class="border-t border-paper-300 pt-4 mt-5">
        <legend class="text-base font-semibold pr-2"><span class="text-ink-700">${no}.</span> ${title}</legend>
        ${body}
      </fieldset>`;

    const prefixChips = DATA.clubPrefixes.map((x) => chip('prefix', x, f.prefix === x, Utils.escape(x))).join('') + chip('prefix', 'custom', f.prefix === 'custom', '✏️ Własny');
    const characterCards = Object.entries(DATA.townTypes).map(([id, t]) => `
      <button data-action="form-set" data-field="character" data-value="${id}"
        class="btn-press w-full text-left p-3 border border-paper-400 rounded-lg ${f.character === id ? 'bg-ink-900 text-paper-100' : 'bg-paper-200 hover:bg-paper-300'}">
        <span class="text-base font-semibold block">${f.character === id ? '●' : '○'} ${t.icon} ${t.label}</span>
        <span class="text-xs block ${f.character === id ? 'text-paper-300' : 'text-ink-700'}">${t.sub}</span>
        <ul class="text-xs mt-1 list-disc pl-4 ${f.character === id ? 'text-paper-200' : 'text-ink-700'}">${t.perks.map((x) => `<li>${x}</li>`).join('')}</ul>
      </button>`).join('');
    const colorSwatches = Object.entries(DATA.clubColors).map(([id, c]) => `
      <button data-action="form-set" data-field="colors" data-value="${id}"
        class="btn-press flex items-center gap-2 px-2 py-1.5 border ${f.colors === id ? 'border-ink-900 bg-paper-300 ring-2 ring-ink-900' : 'border-paper-400 bg-paper-200 hover:bg-paper-300'}">
        ${UI.colorsBadge(id, 'w-7 h-7')}<span class="text-sm">${c.label}</span>
      </button>`).join('');

    const saveBox = save && save.club.name ? `
      <section class="paper p-4 mb-6 border-l-4 border-grass">
        <div class="text-xs uppercase tracking-wider text-ink-700">W szufladzie leży teczka z zapisem</div>
        <div class="text-xl font-bold mt-1">${UI.colorsBadge(save.club.colors)} ${Utils.escape(save.club.name)}</div>
        <div class="text-sm text-ink-700">${Utils.escape(DATA.leagueLevels[save.club.leagueLevel] ? DATA.leagueLevels[save.club.leagueLevel].name : 'B-klasa')} · Sezon ${save.calendar.season}, Tydzień ${save.calendar.week} · Kasa: ${Utils.formatMoney(save.finance.budget)}</div>
        <div class="grid sm:grid-cols-[2fr_1fr] gap-3 mt-4">
          <button data-action="load-game" class="btn-press py-3 bg-grass hover:brightness-110 text-paper-100 font-semibold text-base rounded-lg">📂 WCZYTAJ GRĘ</button>
          <button data-action="clear-save" class="btn-press py-3 bg-paper-200 hover:bg-paper-300 text-stamp font-semibold text-sm border border-stamp/40 rounded-lg">🗑️ Resetuj zapis</button>
        </div>
      </section>` : '';

    return `
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-4xl">
        <header class="text-center mb-8">
          <p class="text-paper-400 text-[11px] font-medium tracking-wider uppercase mb-3">Okręgowy Związek Piłki Nożnej · Wydział Gier · Pismo L.dz. 666/B</p>
          <h1 class="font-type text-4xl sm:text-6xl font-extrabold tracking-tight text-amber-glow leading-[1.05]">B-KLASA:<br>PREZES Z ŁAPANKI</h1>
          <p class="mt-4 text-paper-300 text-base sm:text-lg">Symulator zarządzania klubem, w którym boisko dzielisz z krowami, a budżet z tajemniczym „funduszem socjalnym” kierownika drużyny.</p>
        </header>

        ${saveBox}

        <section class="paper p-4 sm:p-8 relative">
          <div class="text-[11px] font-medium uppercase tracking-wider text-ink-700">Druk OZPN nr B-1 · wypełnić drukowanymi literami</div>
          <h2 class="font-type text-xl sm:text-2xl font-bold tracking-tight mt-1">KARTA REJESTRACYJNA KLUBU</h2>
          <p class="text-sm text-ink-700 mb-2">Zgłoszenie drużyny seniorów do rozgrywek B-klasy, sezon bieżący. Opłata rejestracyjna: „co łaska”.</p>
          <blockquote class="text-sm italic border-l-2 border-paper-400 pl-3 my-4">
            „${Utils.escape(q.text)}” <span class="font-mono text-xs text-ink-700">— ${Utils.escape(q.author)}</span>
          </blockquote>

          <div class="grid grid-cols-1 gap-4 lg:grid-cols-[1.5fr_1fr]">
            <div>
              ${section('I', 'Nazwa klubu i miejscowość', `
                <div class="flex flex-wrap gap-2 mb-3">${prefixChips}</div>
                ${f.prefix === 'custom' ? `<div class="mb-3">${input('customPrefix', f.customPrefix, 'własny przedrostek, np. Coco Jambo, Sokół, Tęcza', 25)}</div>` : ''}
                ${input('town', f.town, 'Miejscowość / nazwa własna, np. Świbie, Chrząstawa', 30)}
                <button data-action="random-club" class="btn-press mt-3 px-3 py-1.5 border border-paper-400 rounded-lg bg-amber-glow hover:brightness-110 text-ink-900 text-sm font-bold">🎲 Wylosuj kultowy klub</button>
              `)}
              ${section('II', 'Województwo', `
                <select data-field="region" aria-label="Województwo klubu" class="w-full px-3 py-2 bg-white border border-paper-400 rounded-md text-[14px] text-ink-900 focus:outline-none focus:ring-2 focus:ring-amber-glow">
                  <option value=""${f.region === '' || f.region == null ? ' selected' : ''}>🎲 Losowo – niech zdecyduje OZPN</option>${Selectors.regionOptions(f.region)}
                </select>
                <p id="region-path" class="text-[11.5px] text-ink-700 mt-1.5 leading-snug">🛤️ Start w B-klasie: ${Selectors.promoPath(f.region, 1)}</p>
                <p class="text-xs text-ink-700 mt-1">Województwo przypisze klub do IV ligi i grupy III ligi po awansach oraz do wojewódzkiego Pucharu Polski (finał na stadionie regionu).</p>
              `)}
              ${section('III', 'Charakter miejscowości', `<div class="grid grid-cols-1 gap-2">${characterCards}</div>`)}
              ${section('IV', 'Barwy klubowe', `<div class="flex flex-wrap gap-2">${colorSwatches}</div>`)}
              ${section('V', 'Obiekt sportowy', `
                ${input('stadium', f.stadium, Selectors.defaultStadium(f.town.trim() || '[Miejscowość]'), 60)}
                <p class="text-xs text-ink-700 mt-1">Nazwę może później zmienić Sponsor Tytularny. Puste pole = nazwa domyślna.</p>
              `)}
              ${section('VI', 'Imię / ksywa Prezesa', `
                ${input('president', f.president, 'Prezes', 30)}
                <p class="text-xs text-ink-700 mt-1">Jak mówią na Ciebie w gminie: „Prezes Janusz”, „Prezes Mirek”… Pojawi się w pismach, telefonach i w protokole.</p>
              `)}
            </div>

            <aside class="lg:sticky lg:top-6 self-start">
              <div class="bg-paper-200 border border-paper-400 rounded-lg p-4">
                <div class="text-xs uppercase tracking-wider text-ink-700 mb-2">Plakietka klubu (podgląd)</div>
                <div id="form-preview">${UI.formPreview()}</div>
              </div>
              <p id="start-error" class="text-stamp font-bold text-sm mt-3 min-h-[1.25rem]">${Utils.escape(gameState.ui.startError)}</p>
              <button data-action="start-game"
                class="btn-press w-full mt-2 py-4 bg-amber-glow hover:brightness-110 text-ink-900 font-bold text-lg rounded-lg">
                ROZPOCZNIJ PREZESURĘ
              </button>
              <p class="text-xs text-ink-700 text-center mt-3">Podpisując, prezes zobowiązuje się do pokrycia długów za piłki, wapno i ostatni wyjazd do Bździszewa.${save && save.club.name ? ' <b>Nowa prezesura nadpisze zapis z szuflady.</b>' : ''}</p>
            </aside>
          </div>
        </section>
      </div>
    </main>`;
  },

  /* ---------- GŁÓWNY EKRAN GRY ---------- */
  /* ---------- RAMA APLIKACJI (telefon; na komputerze ta sama kolumna na środku) ---------- */
  gameScreen() {
    const overlay = UI.overlay();
    return `
    <div id="game-root" class="app-shell mx-auto w-full max-w-[480px] flex flex-col bg-desk-900 sm:border-x border-desk-700">
      ${UI.appHeader()}
      <main id="work" class="flex-1 min-h-0 overflow-y-auto overscroll-contain scroll-thin px-2.5 py-2">${UI.activeTabContent()}</main>
      ${UI.appDock()}
    </div>
    ${UI.playerSheet()}
    ${overlay || gameState.ui.playerSheet ? '' : UI.alertsBar()}
    ${overlay}
    ${overlay ? UI.alertsBar(true) : ''}`;
  },

  // Powiadomienia o długach w lidze: wyskakują u góry ekranu, klik = finanse ligi, ✕ = zamknij
  alertsBar(onlyTop) {
    const list = (gameState.alerts || []).filter((a) => !onlyTop || a.top).slice(0, 2);
    if (!list.length) return '';
    list.forEach((a) => { a.seen = true; });   // pokazane = zniknie przy następnej akcji
    const edge = { good: 'border-l-grass', warn: 'border-l-amber-400', bad: 'border-l-stamp', info: 'border-l-sky-500' };
    return `
    <div class="fixed inset-x-0 top-2 ${onlyTop ? 'z-[90]' : 'z-[60]'} flex justify-center pointer-events-none px-2">
      <div class="w-full max-w-[464px] space-y-1.5">
        ${list.map((a) => `
        <div class="ov-in pointer-events-auto flex items-start gap-2 rounded-xl bg-desk-800/95 backdrop-blur border border-desk-600 border-l-4 ${edge[a.tone] || edge.info} shadow-lg px-2.5 py-2">
          <button data-action="${a.top ? 'dismiss-alert' : 'open-alert'}" data-id="${a.id}" class="flex-1 min-w-0 text-left flex items-start gap-2">
            <span class="text-[20px] leading-none mt-0.5">${a.icon}</span>
            <span class="min-w-0">
              <span class="block text-[12.5px] font-bold text-paper-100 truncate">${Utils.escape(a.title)}</span>
              <span class="block text-[11px] text-paper-300 leading-snug line-clamp-2">${Utils.escape(a.text)}</span>
            </span>
          </button>
          <button data-action="dismiss-alert" data-id="${a.id}" class="flex-shrink-0 w-7 h-7 -mr-1 rounded-md text-paper-400 active:bg-desk-700" aria-label="Zamknij">✕</button>
        </div>`).join('')}

      </div>
    </div>`;
  },

  /* ---------- EKRANY NA CAŁY EKRAN: mecz, cut-scenka, skutki decyzji ---------- */
  overlay() {
    const o = gameState.ui.overlay;
    if (o && o.type === 'match' && gameState.lastMatch) return UI.matchOverlay(gameState.lastMatch);
    if (o && o.type === 'cupMatch' && gameState.cupMatch) return UI.matchOverlay(gameState.cupMatch);
    if (o && o.type === 'euroMatch' && gameState.euroMatch) return UI.matchOverlay(gameState.euroMatch);
    if ((gameState.crisisQueue || []).length) return UI.crisisOverlay(gameState.crisisQueue[0]);   // kryzys zatrzymuje grę
    if (o && o.type === 'cup' && gameState.cupReport) return UI.cupOverlay(gameState.cupReport);
    if (o && o.type === 'startCoach') return UI.startCoachOverlay();
    if (o && o.type === 'startSponsor') return UI.startSponsorOverlay();
    if (o && o.type === 'outcome') return UI.outcomeOverlay(o);
    if (o && o.type === 'dirReport' && gameState.directorReport) return UI.directorReportOverlay(gameState.directorReport);
    if (o && o.type === 'poach' && gameState.poachReport) return UI.poachOverlay(gameState.poachReport);
    if (o && o.type === 'loanReport' && gameState.loanReport) return UI.loanReportOverlay(gameState.loanReport);
    if (o && o.type === 'playoff' && gameState.seasonSummary && gameState.seasonSummary.playoff) return UI.playoffOverlay(gameState.seasonSummary.playoff);
    if (o && o.type === 'season' && gameState.seasonSummary) return UI.seasonOverlay(gameState.seasonSummary);
    if (o && o.type === 'youth' && gameState.youthPick && !gameState.youthPick.done) return UI.youthPickOverlay(gameState.youthPick);
    if (o && o.type === 'transfer' && gameState.transfer.open) return UI.transferOverlay();
    // Cut-scenka czeka na decyzję – zawsze na pierwszym planie
    // Oferty transferowe w otwartym oknie czekają w zakładce „Oferty” giełdy, nie jako osobne scenki
    const cut = gameState.pendingDecisions.map((id) => DATA.decisions[id]).find((d) => d && d.cutscene && !(d.transfer && gameState.transfer.open));
    if (cut) return UI.cutsceneOverlay(cut);
    return '';
  },

  overlayFrame(inner, extraClass = '') {
    return `
    <div class="fixed inset-0 z-[70] flex justify-center bg-black/80">
      <div class="ov-in w-full max-w-[480px] h-full flex flex-col ${extraClass}" style="padding-bottom: env(safe-area-inset-bottom);">${inner}</div>
    </div>`;
  },

  matchOverlay(m) {
    const s = gameState;
    const live = UI.animatedMatch !== (m.key || m.week);   // animujemy tylko raz na mecz
    const name = Selectors.clubDisplayName();
    const [label, tone] = m.result === 'W' ? ['WYGRANA', 'text-grass'] : m.result === 'L' ? ['PORAŻKA', 'text-stamp'] : ['REMIS', 'text-paper-300'];
    const total = m.money.reduce((sum, l) => sum + l.amount, 0);
    const side = (crest, n, align) => `
      <div class="flex-1 min-w-0 flex flex-col items-center gap-1.5 ${align}">
        ${crest}
        <div class="text-[13px] font-bold leading-tight text-center line-clamp-2">${Utils.escape(n)}</div>
      </div>`;
    const ourCrest = UI.crest(s.club.colors, s.club.name, 56);
    const theirCrest = UI.crest(s.club.colors, m.rival, 56, true);
    // Gol po stronie drużyny, która go strzeliła (gospodarz po lewej)
    const timeline = m.goals.concat((m.cards || []).filter((c) => c.us || c.card === 'R')).sort((a, b) => a.min - b.min);
    const goals = timeline.map((g) => `
      <li data-min="${g.min}" class="mx-goal ${live ? 'hidden' : ''} flex items-center gap-2 text-[13px] ${g.us === m.home ? '' : 'flex-row-reverse text-right'} ${g.us ? '' : 'text-paper-400'}">
        <span class="w-8 text-[11px] font-bold text-paper-400 ${g.us === m.home ? '' : 'text-right'}">${g.min}'</span>
        <span class="truncate">${g.card === 'R' ? '🟥' : g.card === 'Y' ? '🟨' : '⚽'} ${Utils.escape(g.card && !g.us ? (m.rival + ' – czerwona') : g.name)}${g.assist ? ' <span class="text-[11px] text-paper-400">(as. ' + Utils.escape(g.assist) + ')</span>' : ''}</span>
      </li>`).join('');
    const scoreAt = (min) => {
      const us = m.goals.filter((g) => g.us && g.min <= min).length, them = m.goals.filter((g) => !g.us && g.min <= min).length;
      return m.home ? us + ':' + them : them + ':' + us;
    };
    const money = m.money.map((l) => `<div class="flex justify-between gap-2 text-[12.5px]"><span class="text-paper-300 truncate">${Utils.escape(l.label)}</span><b class="whitespace-nowrap ${l.amount < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(l.amount)}</b></div>`).join('');
    return UI.overlayFrame(`
      <div class="flex-1 min-h-0 overflow-y-auto px-4 pt-5 pb-3 text-paper-100">
        <div class="text-center text-[11px] uppercase tracking-wider ${m.cupInfo ? (m.cupInfo.euro ? 'text-sky-300' : 'text-amber-glow') + ' font-semibold' : 'text-paper-400'}">${m.cupInfo ? (m.cupInfo.icon || '🏆') + ' ' + Utils.escape(m.cupInfo.comp || 'Puchar Polski') + ' · ' + Utils.escape(m.cupInfo.round) + ' · ' + (m.cupInfo.neutral ? Utils.escape(m.cupInfo.venue || 'stadion neutralny') : m.home ? 'u siebie' : 'wyjazd') : 'Kolejka ' + m.kolejka + ' · ' + (m.home ? 'u siebie' : 'wyjazd')}${m.derby ? ' · <span class="text-stamp font-bold">🔥 KOSA</span>' : ''}</div>
        <div class="text-center text-[11px] text-paper-400 mt-0.5">${m.weatherIcon} ${Utils.escape(m.weatherLabel)}${m.cupInfo ? ' · rywal: ' + Utils.escape(m.cupInfo.oppLeague) : ''}</div>
        <div class="flex items-center gap-2 mt-5">
          ${m.home ? side(ourCrest, name, '') : side(theirCrest, m.rival, '')}
          <div class="flex-shrink-0 text-center">
            <div id="mx-score" class="text-[52px] font-extrabold leading-none tracking-tight">${live ? '0:0' : scoreAt(90)}</div>
            <div id="mx-min" class="mt-1.5 text-[12px] font-bold ${live ? 'text-amber-glow' : 'text-paper-400'}">${live ? "0'" : 'KONIEC'}</div>
          </div>
          ${m.home ? side(theirCrest, m.rival, '') : side(ourCrest, name, '')}
        </div>
        <div class="h-1 rounded-full bg-desk-700 mt-4 overflow-hidden"><div id="mx-bar" class="h-full bg-amber-glow" style="width:${live ? 0 : 100}%"></div></div>
        <ul class="space-y-1.5 mt-4">${goals || `<li class="mx-goal ${live ? 'hidden' : ''} text-center text-[13px] text-paper-400" data-min="90">Bez goli. Kibice liczyli wrony.</li>`}</ul>
        <div id="mx-final" class="${live ? 'hidden' : ''} mt-5 space-y-3">
          <div class="text-center text-[22px] font-extrabold tracking-wide ${tone}">${label}${m.sensation ? ' · SENSACJA!' : ''}</div>
          ${m.mvp ? `<div class="mx-auto max-w-[340px] rounded-xl ${m.mvp.rival ? 'bg-stamp/15 border border-stamp/40' : 'bg-amber-glow/15 border border-amber-glow/40'} px-3 py-1.5 flex items-center gap-2">
            <span class="text-[24px] leading-none">🏅</span>
            <span class="min-w-0 flex-1"><span class="block text-[10px] uppercase tracking-wider ${m.mvp.rival ? 'text-stamp' : 'text-amber-glow'} font-semibold">MVP meczu${m.mvp.rival ? ' · z drużyny rywali' : ''}</span><span class="block text-[13px] font-bold text-paper-100 truncate">${Utils.escape(m.mvp.name)}</span><span class="block text-[10.5px] text-paper-400 truncate">${Utils.escape(m.mvp.role || '')} · ${Utils.escape(m.mvp.team)}</span></span>
            <b class="text-[16px] ${m.mvp.rival ? 'text-stamp' : 'text-amber-glow'}">${m.mvp.r.toFixed(1)}</b>
          </div>` : m.best ? `<div class="text-center text-[12.5px] text-paper-300">⭐ Gracz meczu: <b class="text-paper-100">${Utils.escape(m.best.name)}</b> (${m.best.r.toFixed(1)})</div>` : ''}
          <div class="rounded-xl bg-desk-800 px-3 py-2.5 space-y-1">
            ${m.attendance != null ? `<div class="flex justify-between text-[12.5px]"><span class="text-paper-300">🏟️ Frekwencja</span><b>${m.attendance} widzów</b></div>` : ''}
            ${money}
            <div class="flex justify-between pt-1.5 mt-1 border-t border-desk-600 text-[14px]"><span class="font-semibold">Wynik finansowy meczu</span><b class="${total < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(total)}</b></div>
          </div>
          ${m.euro ? UI.euroBox(m.euro) : ''}
          ${m.cup ? UI.euroBox(m.cup) : ''}
          ${m.cupInfo && m.cupInfo.verdict ? `<div class="rounded-xl bg-amber-glow/10 border border-amber-glow/40 px-3 py-2 text-center">${m.cupInfo.pens ? `<div class="text-[12px] text-amber-glow">Rzuty karne ${Utils.escape(m.cupInfo.pens)}</div>` : ''}<div class="text-[14px] font-extrabold ${m.cupInfo.won ? 'text-grass' : 'text-stamp'}">${Utils.escape(m.cupInfo.verdict)}</div>${m.cupInfo.uefaLine ? `<div class="text-[11px] text-sky-300 mt-0.5">${Utils.escape(m.cupInfo.uefaLine)}</div>` : ''}</div>` : ''}
        </div>
      </div>
      <div class="flex-shrink-0 px-4 pb-4 pt-2">
        <button data-action="overlay-close" class="btn-press w-full h-14 rounded-xl bg-amber-glow text-ink-900 text-[17px] font-extrabold tracking-wider">KONTYNUUJ</button>
      </div>`, 'bg-desk-900');
  },

  // W środku tygodnia: europejski wieczór (wyniki, dwumecz, premie)
  euroBox(e) {
    const name = Selectors.clubDisplayName();
    const legs = e.legs.map((l) => {
      const [hn, an, hg, ag] = l.home ? [name, l.opp, l.gf, l.ga] : [l.opp, name, l.ga, l.gf];
      return `<div class="flex items-center gap-1.5 text-[12.5px]"><span class="w-16 flex-shrink-0 text-[10.5px] text-paper-400 truncate">${Utils.escape(l.label)}</span><span class="flex-1 min-w-0 truncate text-right">${Utils.escape(hn)}</span><b class="w-9 text-center ${l.gf > l.ga ? 'text-grass' : l.gf < l.ga ? 'text-stamp' : ''}">${hg}:${ag}</b><span class="flex-1 min-w-0 truncate">${Utils.escape(an)}</span></div>`
        + (l.pens ? `<div class="text-[10.5px] text-amber-glow pl-16">karne ${Utils.escape(l.pens)}</div>` : '')
        + (l.scorers && l.scorers.length ? `<div class="text-[10.5px] text-paper-400 pl-16 truncate">⚽ ${Utils.escape(l.scorers.join(', '))}</div>` : '');
    }).join('');
    return `
          <div class="rounded-xl bg-[#0d1b3d] border border-sky-500/40 px-3 py-2.5 space-y-1">
            <div class="text-[10.5px] uppercase tracking-wider text-sky-300 font-semibold">${e.header ? Utils.escape(e.header) : '🇪🇺 Europejski wieczór'} · ${Utils.escape(e.title)}</div>
            ${legs}
            ${e.agg ? `<div class="text-[12px] text-paper-300">Dwumecz: <b class="text-paper-100">${Utils.escape(e.agg)}</b></div>` : ''}
            <div class="text-[13px] font-bold text-amber-glow">${Utils.escape(e.verdict)}</div>
            ${e.money ? `<div class="flex justify-between text-[12.5px]"><span class="text-paper-300">${e.header ? 'Premia za awans' : 'Premie UEFA i bilety'}</span><b class="${e.money < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(e.money)}</b></div>` : ''}
          </div>`;
  },

  // Mecz „na żywo”: zegar 0'–90', gole pojawiają się w swoich minutach, na końcu wynik finansowy
  animateMatch() {
    const o = gameState.ui.overlay;
    const m = o && o.type === 'cupMatch' ? gameState.cupMatch : o && o.type === 'euroMatch' ? gameState.euroMatch : gameState.lastMatch;
    if (!o || (o.type !== 'match' && o.type !== 'cupMatch' && o.type !== 'euroMatch') || !m || UI.animatedMatch === (m.key || m.week) || !document.getElementById('mx-score')) return;
    UI.animatedMatch = m.key || m.week;
    clearInterval(UI.matchTimer);
    let min = 0;
    UI.matchTimer = setInterval(() => {
      min += 1;
      const el = (id) => document.getElementById(id);
      if (!el('mx-score')) { clearInterval(UI.matchTimer); return; }
      const us = m.goals.filter((g) => g.us && g.min <= min).length, them = m.goals.filter((g) => !g.us && g.min <= min).length;
      el('mx-score').textContent = m.home ? us + ':' + them : them + ':' + us;
      el('mx-min').textContent = min >= 90 ? 'KONIEC' : min + "'";
      el('mx-bar').style.width = Math.min(100, min / 90 * 100) + '%';
      document.querySelectorAll('.mx-goal').forEach((g) => { if (Number(g.dataset.min) <= min) g.classList.remove('hidden'); });
      if (min >= 90) {
        clearInterval(UI.matchTimer);
        el('mx-min').className = 'mt-1.5 text-[12px] font-bold text-paper-400';
        el('mx-final').classList.remove('hidden');
        el('mx-final').classList.add('ov-in');
      }
    }, 45);
  },

  // Dolna szuflada zawodnika (Kadra): opis, forma, ocena, potencjał, statystyki i akcje pod kciukiem
  playerSheet() {
    const id = gameState.ui.playerSheet;
    const p = id && gameState.activeTab === 'squad' ? gameState.squad.find((x) => x.id === id) : null;
    if (!p) return '';
    const lineup = Selectors.projectedLineup();
    const t = gameState.transfer;
    const star = p.id === gameState.star.playerId;
    const stat = (label, value) => `<div class="rounded-lg bg-paper-200 py-1.5 min-w-0"><div class="text-[9.5px] uppercase tracking-wide text-ink-700">${label}</div><div class="text-[14px] font-bold leading-tight truncate">${value}</div></div>`;
    const hist = p.formHistory || [];
    const last = p.lastRating;
    const form = last == null ? ['–', 'brak meczów'] : last >= 7.5 ? ['🔥', 'w gazie'] : last >= 6.5 ? ['👍', 'dobra'] : last >= 5.5 ? ['😐', 'przeciętna'] : ['🥶', 'słaba'];
    const bars = hist.length ? hist.map((r) => `<div class="flex-1 rounded-sm ${r >= 7.5 ? 'bg-grass' : r >= 6 ? 'bg-ink-700' : r >= 4.5 ? 'bg-amber-400' : 'bg-stamp'}" style="height:${Math.round(r * 10)}%" title="${r.toFixed(1)}"></div>`).join('') : '<div class="text-[11px] text-ink-700 self-center">brak not</div>';
    const status = [
      lineup.includes(p) ? '<span class="text-grass font-bold">W SKŁADZIE</span>' : 'ŁAWKA',
      p.injured > 0 ? '<span class="text-stamp font-bold">🩹 kontuzja ' + p.injured + ' tyg.</span>' : '',
      p.suspended > 0 ? '<span class="text-stamp font-bold">⛔ pauza: ' + p.suspended + ' mecz' + (p.suspended > 1 ? 'e' : '') + '</span>' : '',
      Selectors.temperLabel(p) + (p.seasonYellows || p.seasonReds ? ' · 🟨' + (p.seasonYellows || 0) + ' 🟥' + (p.seasonReds || 0) : ''),
      p.benched ? '<span class="text-stamp font-bold">🚫 odsunięty</span>' : '',
      p.loan ? '🔁 wypożyczony z ' + Utils.escape(p.loan.from) : '',
      p.wantsOut ? '<span class="text-stamp font-bold">🚪 po sezonie do ' + Utils.escape(p.wantsOut) + '</span>' : '',
      star ? (gameState.star.rebel ? '<span class="text-stamp font-bold">🔥 buntownik</span>' : '🌟 chce odejść wyżej') : '',
      p.listed ? '📋 na liście transferowej' : '',
    ].filter(Boolean).join(' · ');
    const badges = [p.favorite ? '⭐ Ulubieniec trybun' : '', p.legend ? '🏆 Legenda klubu' : '', p.talent ? '💎 Perełka powiatu' : ''].filter(Boolean).join(' · ');
    const growth = p.age <= 23 && Selectors.potential(p) > p.skill;
    return `
    <div class="fixed inset-0 z-[65] flex justify-center">
      <button data-action="player-close" aria-label="Zamknij" class="absolute inset-0 bg-black/50"></button>
      <div class="sheet-in absolute bottom-0 w-full max-w-[480px] max-h-[86vh] flex flex-col rounded-t-2xl bg-paper-100 text-ink-900" style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="flex-shrink-0 pt-2 pb-1"><div class="mx-auto w-10 h-1 rounded-full bg-paper-400"></div></div>
        <div class="flex-1 min-h-0 overflow-y-auto px-4 pb-3">
          <div class="flex items-start gap-2">
            <div class="min-w-0 flex-1">
              <div class="text-[18px] font-extrabold leading-tight">${Utils.escape(Selectors.playerName(p))}</div>
              <div class="text-[12px] text-ink-700">${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l. · ${Selectors.skillLabel(p.skill)} · ${UI.profileBadge(p.profile)}</div>
            </div>
            <div class="text-center flex-shrink-0"><div class="text-[22px] font-extrabold leading-none">${Selectors.ovr(p)}</div><div class="text-[9px] uppercase text-ink-700">OVR</div></div>
            <button data-action="player-close" class="btn-press w-9 h-9 rounded-full bg-paper-200 text-[16px] flex-shrink-0" aria-label="Zamknij">✕</button>
          </div>
          <p class="text-[13px] italic text-ink-700 leading-snug mt-1.5">„${Utils.escape(p.trait)}”</p>
          <div class="text-[11.5px] mt-1">${status}${badges ? '<br>' + badges : ''}</div>
          <div class="grid grid-cols-[1fr_1.2fr] gap-2 mt-2.5">
            <div class="rounded-lg bg-paper-200 px-2 py-1.5">
              <div class="text-[9.5px] uppercase tracking-wide text-ink-700">Forma · ${form[0]} ${form[1]}</div>
              <div class="flex items-end gap-1 h-10 mt-1">${bars}</div>
            </div>
            <div class="rounded-lg bg-paper-200 px-2 py-1.5">
              <div class="text-[9.5px] uppercase tracking-wide text-ink-700">Ocena</div>
              <div class="flex items-center gap-1.5 mt-0.5"><span class="text-[11px]">sezon</span>${UI.ratingBadge(Selectors.avgRating(p))}<span class="text-[11px]">ost.</span>${UI.ratingBadge(last)}</div>
              <div class="text-[11px] mt-0.5">kariera: <b>${Selectors.careerRating(p) != null ? Selectors.ratingText(Selectors.careerRating(p)) : '–'}</b></div>
            </div>
          </div>
          <div class="rounded-lg bg-paper-200 px-2 py-1.5 mt-2 text-[12px]">📈 Potencjał: <b>${UI.potentialText(p)}</b>${growth ? '<span class="text-ink-700"> · ' + (t.open ? 'wypożyczenie da regularną grę i szybszy rozwój' : 'bez gry rośnie wolno') + '</span>' : ''}</div>
          <div class="grid grid-cols-4 gap-1.5 mt-2 text-center">
            ${stat('Mecze', p.seasonApps)}${stat('Gole', p.seasonGoals)}${stat('Asysty', p.seasonAssists || 0)}${stat('Klub M/G/A', p.apps + '/' + p.goals + '/' + (p.assists || 0))}
          </div>
          <div class="text-[11.5px] text-ink-700 mt-1.5">Pensja: <b class="text-ink-900">${p.wage} zł/tydz.</b> (${Selectors.wageLabel(p.wage)}) · pasuje do: ${DATA.profiles[p.profile].label}${p.loan ? '' : ' · odstępne: <b class="text-ink-900">' + Utils.formatMoney(star ? Selectors.starFee(p) : Selectors.sellPrice(p)) + '</b> · 📈 wartość: <b class="text-ink-900">' + Utils.formatValue(Selectors.marketValue(p)) + '</b>'}</div>
        </div>

      </div>
    </div>`;
  },

  ovrBadge(p) {
    const v = Selectors.ovr(p);
    // kolory względem ligi: złoty = gwiazda ligi, zielony = mocny, granat = przeciętny, szary = słaby
    const [lo, hi] = Selectors.leagueOvrRange();
    const tone = v >= hi ? 'bg-amber-400 text-ink-900' : v >= (lo + hi) / 2 + 3 ? 'bg-grass text-white' : v >= lo + 3 ? 'bg-ink-900 text-paper-100' : 'bg-paper-300 text-ink-900';
    return `<span class="inline-block min-w-[24px] px-1 rounded text-[11px] leading-[17px] font-extrabold text-center ${tone}">${v}</span>`;
  },

  // Potencjał: gwiazdki zawsze, dokładny sufit dopiero z Gminną Akademią (trenerzy szkółki umieją go ocenić)
  potentialText(p) {
    const pot = Selectors.potential(p);
    if (p.age > 26 || pot <= p.skill) return 'szczyt możliwości';
    const s = Selectors.potentialStars(p);
    return '★'.repeat(s) + '☆'.repeat(5 - s) + (Selectors.academyLevel() >= 3 ? ' (do: ' + Selectors.skillLabel(pot) + ')' : '');
  },

  // Karta statystyk zawodnika w decyzjach transferowych: liczby z bieżącego sezonu + kariera w klubie
  // Decyzja o 19-latku: sezon w lidze U19 + szacowany sufit rozwoju
  u19GradCard(p) {
    if (!p) return '';
    const st = p.u19Prev || { apps: p.u19Apps || 0, goals: p.u19Goals || 0, assists: p.u19Assists || 0, avg: p.u19RatingN ? Math.round(p.u19RatingSum / p.u19RatingN * 10) / 10 : null, yellows: p.u19Yellows || 0, reds: p.u19Reds || 0 };
    const stat = (label, value) => `<div class="min-w-0"><div class="text-[9px] uppercase tracking-wide text-paper-400">${label}</div><div class="text-[15px] font-bold leading-tight">${value}</div></div>`;
    const team = Selectors.teamOvr();
    const potOvr = Selectors.ovr({ ...p, skill: Selectors.potential(p), formHistory: [] });
    const err = Math.max(1, 4 - Selectors.u19Lvl('recruiter'));   // dobry rekruter = dokładniejsza ocena
    const lo = Math.max(Selectors.ovr(p), potOvr - err), hi = potOvr + err;
    const verdict = potOvr >= team + 8 ? ['🌟 Przyszła gwiazda', 'text-amber-glow'] : potOvr >= team + 2 ? ['💪 Materiał na podstawowy skład', 'text-grass'] : potOvr >= team - 4 ? ['🙂 Solidny rezerwowy', 'text-paper-200'] : ['😐 Przeciętniak', 'text-paper-400'];
    const stars = Selectors.potentialStars(p);
    return `
      <div class="rounded-xl border bg-desk-800 border-desk-600 text-paper-100 px-3 py-2 mt-3">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="text-[14px] font-bold truncate">${Utils.escape(Selectors.playerName(p))}${p.talent ? ' 💎' : ''}</div>
            <div class="text-[11px] text-paper-400">${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l. · <b class="text-paper-100">OVR ${Selectors.ovr(p)}</b> (drużyna ${team})</div>
          </div>
          ${UI.profileBadge(p.profile)}
        </div>
        <div class="rounded-lg bg-desk-900/60 px-2 py-1.5 mt-2 flex items-center justify-between gap-2">
          <div class="min-w-0"><div class="text-[9.5px] uppercase tracking-wide text-paper-400">📈 Szacowany sufit</div><div class="text-[13px] font-bold ${verdict[1]}">${verdict[0]}</div></div>
          <div class="text-right"><div class="text-[13px] text-amber-glow leading-none">${'★'.repeat(stars)}<span class="text-paper-400">${'☆'.repeat(5 - stars)}</span></div><div class="text-[11.5px] font-bold mt-0.5">OVR ${lo === hi ? hi : lo + '–' + hi}</div></div>
        </div>
        <div class="text-[9.5px] uppercase tracking-wide text-paper-400 mt-2">${st.loanClub ? '📤 Wypożyczenie · ' + Utils.escape(st.loanClub) : 'Liga U19'} · sezon ${st.season || gameState.calendar.season - 1}</div>
        <div class="grid grid-cols-5 gap-1 mt-0.5 text-center">
          ${stat('Mecze', st.apps)}${stat('Gole', st.goals)}${stat('Asysty', st.assists)}${stat('Śr. nota', st.avg != null ? UI.ratingBadge(st.avg) : '–')}${stat('Kartki', '<span class="text-[12px]">🟨' + st.yellows + ' 🟥' + st.reds + '</span>')}
        </div>
        <div class="text-[10.5px] text-paper-400 mt-1.5">W akademii łącznie: ${p.u19Total || 0} m, ${p.u19GoalsTotal || 0} g, ${p.u19AssistsTotal || 0} as.${Selectors.u19Lvl('recruiter') ? '' : ' · bez rekrutera ocena sufitu mniej pewna'}</div>
      </div>`;
  },

  playerCard(p, dark = false) {
    if (!p) return '';
    const box = dark ? 'bg-desk-800 border-desk-600 text-paper-100' : 'bg-paper-200 border-paper-300 text-ink-900';
    const sub = dark ? 'text-paper-400' : 'text-ink-700';
    const stat = (label, value) => `<div class="min-w-0"><div class="text-[9.5px] uppercase tracking-wide ${sub}">${label}</div><div class="text-[15px] font-bold leading-tight">${value}</div></div>`;
    // Na przełomie sezonów (przed 1. meczem) liczy się sezon zakończony
    const ps = p.prevSeason;
    const last = !!(ps && p.seasonApps === 0 && gameState.calendar.round === 0);
    return `
      <div class="rounded-xl border ${box} px-3 py-2 mt-3">
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="text-[14px] font-bold truncate">${Utils.escape(Selectors.playerName(p))}${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}${p.talent ? ' 💎' : ''}</div>
            <div class="text-[11px] ${sub}">${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l. · <b>OVR ${Selectors.ovr(p)}</b> (drużyna ${Selectors.teamOvr()}) · ${Selectors.skillLabel(p.skill)}</div>
          </div>
          ${UI.profileBadge(p.profile)}
        </div>
        <div class="grid grid-cols-4 gap-2 mt-2 text-center">
          ${stat('Mecze', last ? ps.apps : p.seasonApps)}${stat('Gole / As.', (last ? ps.goals : p.seasonGoals) + ' / ' + ((last ? ps.assists : p.seasonAssists) || 0))}${stat('Śr. nota', UI.ratingBadge(last ? ps.avg : Selectors.avgRating(p)))}${stat('Ost. mecz', UI.ratingBadge(p.lastRating))}
        </div>
        <div class="text-[10.5px] ${sub} mt-1.5">Sezon ${last ? gameState.calendar.season - 1 + ' (zakończony)' : gameState.calendar.season} · w klubie: ${p.apps} m, ${p.goals} g${Selectors.careerRating(p) != null ? ', śr. ' + Selectors.ratingText(Selectors.careerRating(p)) : ''} · ${p.wage} zł/tydz.</div>
      </div>`;
  },

  cutsceneOverlay(d) {
    // Scenki z wieloma opcjami (np. 6 sposobów na podwyżkę) w wersji zwartej – wszystko na jednym ekranie
    const visible = d.options.filter((o) => !o.show || o.show());
    const compact = visible.length >= 5 || (d.u19Card && visible.length >= 3);   // karta juniora + 3 opcje = wersja zwarta
    const opts = d.options.map((o, i) => (o.show && !o.show() ? '' : `
      <button data-action="resolve-decision" data-decision="${d.id}" data-option="${i}"
        class="btn-press w-full text-left ${compact ? 'px-3 py-1.5' : 'px-3.5 py-2.5'} rounded-xl bg-desk-800 border border-desk-600 active:bg-desk-700">
        <span class="block ${compact ? 'text-[13px]' : 'text-[14px]'} font-semibold text-paper-100 leading-snug">${Utils.escape(Utils.val(o.label))}</span>
        <span class="block ${compact ? 'text-[11px]' : 'text-[11.5px]'} text-paper-400 leading-snug">${Utils.escape(Utils.val(o.hint))}</span>
      </button>`)).join('');
    const pl = d.player ? d.player() : null;
    return UI.overlayFrame(`
      <div class="${compact ? 'h-3' : 'h-6'} bg-black flex-shrink-0"></div>
      <div class="flex-1 min-h-0 overflow-y-auto ${compact ? 'px-4 py-2' : 'px-5 py-4'} text-paper-100 flex flex-col">
        <div class="cut-icon text-center ${compact ? 'text-[36px]' : 'text-[64px] mt-2'} leading-none">${d.cutscene.icon}</div>
        <div class="text-center text-[10.5px] uppercase tracking-[0.2em] text-amber-glow font-semibold ${compact ? 'mt-1' : 'mt-3'}">${Utils.escape(Utils.val(d.cutscene.place))}</div>
        <h2 class="text-center ${compact ? 'text-[20px]' : 'text-[24px]'} font-extrabold tracking-tight leading-tight mt-1">${Utils.escape(Utils.val(d.title))}</h2>
        <div class="text-center text-[11px] text-paper-400 mt-0.5">${Utils.escape(Utils.val(d.from))}</div>
        <p class="${compact ? 'text-[13px] leading-snug mt-2' : 'text-[14.5px] leading-relaxed mt-4'} text-paper-200 italic">${Utils.escape(Utils.val(d.body))}</p>
        ${pl ? (compact && !d.u19Card ? `<div class="text-[11.5px] text-paper-300 mt-1.5">${UI.ovrBadge(pl)} ${DATA.positions[pl.pos].label} · ${pl.age} l. · ${pl.wage} zł/tydz.</div>` : (d.u19Card ? UI.u19GradCard(pl) : UI.playerCard(pl, true))) : ''}
        <div class="text-[10.5px] uppercase tracking-wider text-paper-400 font-semibold ${compact ? 'mt-2 mb-1' : 'mt-5 mb-1.5'}">Decyzja prezesa</div>
        <div class="grid ${compact ? 'gap-1.5' : 'gap-2'}">${opts}</div>
      </div>
      <div class="${compact ? 'h-3' : 'h-6'} bg-black flex-shrink-0"></div>`, 'bg-[#0b0f16]');
  },

  // Podsumowanie roczne: miejsce, bilans, emerytury i nowi w kadrze – wszystko naraz, po ostatniej kolejce
  // Baraże: każdy mecz z wynikiem, dwumecz i karne, na końcu werdykt
  playoffOverlay(po) {
    const name = Selectors.clubDisplayName();
    const legs = po.legs.map((l) => {
      const [h, a, hg, ag] = l.home ? [name, l.opp, l.gf, l.ga] : [l.opp, name, l.ga, l.gf];
      const tone = l.gf > l.ga ? 'text-grass' : l.gf < l.ga ? 'text-stamp' : 'text-paper-200';
      return `
      <div class="rounded-xl bg-desk-800 px-3 py-2.5">
        <div class="text-[10.5px] uppercase tracking-wider text-paper-400 font-semibold">${l.label}${l.neutral ? '' : ' · ' + (l.home ? 'u siebie' : 'wyjazd')}</div>
        <div class="flex items-center gap-2 mt-1">
          <span class="flex-1 min-w-0 truncate text-right text-[13px] ${l.home ? 'font-bold' : ''}">${Utils.escape(h)}</span>
          <b class="text-[24px] font-extrabold ${tone}">${hg}:${ag}</b>
          <span class="flex-1 min-w-0 truncate text-[13px] ${l.home ? '' : 'font-bold'}">${Utils.escape(a)}</span>
        </div>
        ${l.pens ? `<div class="text-center text-[11.5px] text-amber-glow mt-0.5">rzuty karne ${l.pens}</div>` : ''}
        ${UI.matchDetails(l, true)}
      </div>`;
    }).join('');
    const verdict = po.kind === 'up' ? (po.won ? ['⬆️ AWANS PRZEZ BARAŻE!', 'text-grass'] : ['💔 Baraż przegrany', 'text-stamp'])
      : (po.won ? ['😮‍💨 UTRZYMANIE!', 'text-grass'] : ['⬇️ Spadek po barażach', 'text-stamp']);
    return UI.overlayFrame(`

        ${sm.newLeague !== sm.league ? `<div class="text-center text-[12px] text-paper-300 mt-0.5">Nowy sezon: <b>${Utils.escape(sm.newLeague)}</b></div>` : ''}
        ${sm.euro ? `<div class="text-center text-[12.5px] text-sky-300 mt-1">${Utils.escape(sm.euro)}</div>` : ''}

        ${sm.verdict ? `<div class="text-center text-[12.5px] text-stamp font-bold mt-1">⚖️ ${Utils.escape(sm.verdict)}</div>` : ''}

        <div class="grid grid-cols-3 gap-1.5 mt-4 text-center">
          <div class="rounded-xl bg-desk-800 py-2"><div class="text-[10px] uppercase text-paper-400">W-R-P</div><b class="text-[15px]">${sm.w}-${sm.d}-${sm.l}</b></div>
          <div class="rounded-xl bg-desk-800 py-2"><div class="text-[10px] uppercase text-paper-400">Bramki</div><b class="text-[15px]">${sm.gf}:${sm.ga}</b></div>
          <div class="rounded-xl bg-desk-800 py-2 min-w-0 px-1"><div class="text-[10px] uppercase text-paper-400">Król strzelców</div><b class="text-[12px] block truncate">${sm.scorer ? Utils.escape(sm.scorer.name.split(' ').slice(1).join(' ')) + ' · ' + sm.scorer.goals : '–'}</b></div>

          <div class="rounded-xl bg-desk-800 py-1.5 min-w-0 px-1"><div class="text-[10px] uppercase text-paper-400">⭐ MVP sezonu (nota)</div><b class="text-[12px] block truncate">${sm.seasonMvp ? Utils.escape(sm.seasonMvp.name) + ' · ' + sm.seasonMvp.avg.toFixed(2) : '–'}</b></div>

          ${sm.newcomers && sm.newcomers.length ? list('🌱 Nowi w kadrze', sm.newcomers, '') : ''}
          ${sm.u19 ? `<p class="text-[11.5px] text-paper-300 text-center leading-snug">${Utils.escape(sm.u19)}</p>` : ''}

  // Okno transferowe na cały ekran: kupno z giełdy i sprzedaż z kadry
  transferOverlay() {
    const t = gameState.transfer;
    const offers = Selectors.transferOffers();
    const view = gameState.ui.transferView || 'buy';
    const budget = gameState.finance.budget;
    const banned = Selectors.transferBanned();
    const full = gameState.squad.length >= CONFIG.maxSquad || banned;
    const banNote = banned ? `<div class="rounded-xl bg-stamp/20 border border-stamp/50 px-3 py-2 mt-2 text-[12px] text-paper-100 leading-snug">⛔ <b>BAN TRANSFEROWY</b> – Związek zakazał rejestracji nowych zawodników (do sezonu ${gameState.transferBan.until}). Możesz tylko sprzedawać i wypożyczać swoich.</div>` : '';
    const folds = gameState.ui.folds || {};
    const seg = (v, label) => `<button data-action="transfer-view" data-value="${v}" class="btn-press flex-1 h-9 rounded-md text-[12px] truncate px-1 ${view === v ? 'bg-desk-600 text-paper-100 font-semibold' : 'text-paper-400 font-medium'}">${label}</button>`;
    const btn = (action, id, label, disabled, tone) => `<button data-action="${action}" data-id="${id}" ${disabled ? 'disabled' : ''}
      class="btn-press h-9 px-3 rounded-lg text-[12.5px] font-bold whitespace-nowrap ${disabled ? 'bg-desk-700 text-paper-400 opacity-60' : tone}">${label}</button>`;
    const stat = (label, value) => `<div class="rounded-lg bg-desk-800 py-1"><div class="text-[9.5px] uppercase text-paper-400">${label}</div><div class="text-[13px] font-bold">${value}</div></div>`;
    // Karta zawodnika: wiersz + po stuknięciu charakterystyka i pełne statystyki
    const card = (p, right, extra, buttons) => {
      const ps = p.prevSeason;
      const key = 'tr-' + p.id;
      return `
      <details data-fold="${key}" class="border-b border-desk-700 last:border-0" ${folds[key] ? 'open' : ''}>
        <summary class="flex items-center gap-2 py-2 cursor-pointer select-none">
          <div class="min-w-0 flex-1">
            <div class="text-[13.5px] font-bold truncate">${UI.ovrBadge(p)} ${Utils.escape(Selectors.playerName(p))}${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}${p.talent ? ' 💎' : ''}</div>
            <div class="text-[11px] text-paper-400 truncate">${p.fireSale ? '<b class="text-stamp">🚨 wyprzedaż</b> · ' : ''}${p.bargain ? '<b class="text-grass">🔭 okazja skauta</b> · ' : ''}${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l. · ${Selectors.skillLabel(p.skill)}${extra ? ' · ' + extra : ''}</div>
          </div>
          <span class="text-[12.5px] font-bold whitespace-nowrap">${right}</span>
          <span class="fold-chevron text-paper-400">⌄</span>
        </summary>
        <div class="pb-2.5">
          <p class="text-[12px] italic text-paper-300 leading-snug">„${Utils.escape(p.trait)}”</p>
          <div class="grid grid-cols-4 gap-1 mt-1.5 text-center">
            ${stat('Mecze', ps ? ps.apps : p.seasonApps)}${stat('G / A', (ps ? ps.goals : p.seasonGoals) + ' / ' + ((ps ? ps.assists : p.seasonAssists) || 0))}${stat('Nota', ps ? Selectors.ratingText(ps.avg) : Selectors.ratingText(Selectors.avgRating(p)))}${stat('Pensja', p.wage + ' zł')}
          </div>
          <div class="flex justify-between gap-2 text-[11.5px] mt-1.5"><span class="text-paper-200">💰 ${p.loan && p.fee != null ? 'Opłata za wypożyczenie' : 'Odstępne'}: <b class="text-paper-100">${Utils.formatMoney(p.fee != null ? p.fee : (p.id === gameState.star.playerId ? Selectors.starFee(p) : Selectors.sellPrice(p)))}</b></span><span class="text-paper-400 whitespace-nowrap">📈 ${Utils.formatValue(Selectors.marketValue(p))} · OVR ${Selectors.ovr(p)}</span></div>
          ${(() => { const pc = Selectors.prosCons(p); return pc.pros.length || pc.cons.length ? `<div class="grid grid-cols-2 gap-1.5 mt-1.5">
            <ul class="rounded-lg bg-grass/15 px-2 py-1 space-y-0.5">${pc.pros.map((x) => `<li class="text-[11px] text-paper-100 leading-snug">➕ ${Utils.escape(x)}</li>`).join('') || '<li class="text-[11px] text-paper-400">brak wyraźnych plusów</li>'}</ul>
            <ul class="rounded-lg bg-stamp/15 px-2 py-1 space-y-0.5">${pc.cons.map((x) => `<li class="text-[11px] text-paper-100 leading-snug">➖ ${Utils.escape(x)}</li>`).join('') || '<li class="text-[11px] text-paper-400">brak wyraźnych minusów</li>'}</ul>
          </div>` : ''; })()}
          <div class="text-[11px] text-paper-200 mt-1">📈 Potencjał: <b class="text-amber-glow">${UI.potentialText(p)}</b>${p.age <= 23 && Selectors.potential(p) > p.skill ? ' · rośnie najszybciej, gdy regularnie gra' : ''}</div>
          <div class="text-[10.5px] text-paper-400 mt-0.5">${ps ? 'Zeszły sezon' + (p.fromClub ? ' w ' + Utils.escape(p.fromClub) : '') + (p.fromLevel ? ' (' + DATA.leagueLevels[p.fromLevel].name + ')' : '') : 'Bieżący sezon'} · profil: ${DATA.profiles[p.profile].label}${p.apps ? ' · w klubie: ' + p.apps + ' m, ' + p.goals + ' g' : ''}${p.loan ? ' · wypożyczenie z ' + Utils.escape(p.loan.from) + ' do końca sezonu' : ''}</div>
          ${buttons ? `<div class="flex flex-wrap gap-1.5 mt-2 justify-end">${buttons}</div>` : ''}
        </div>
      </details>`;
    };
    let rows = '';
    if (view === 'offers') {
      const news = (t.news || []).map((l) => `<li class="text-[12px] text-paper-200 leading-snug">• ${Utils.escape(l)}</li>`).join('');
      rows = (news ? `<ul class="rounded-xl bg-desk-800 px-3 py-2 my-2 space-y-1">${news}</ul>` : '') + (offers.map((id) => {
        const d = DATA.decisions[id];
        const opts = d.options.map((o, i) => `
          <button data-action="resolve-decision" data-decision="${d.id}" data-option="${i}" class="btn-press w-full text-left px-3 py-2 rounded-xl bg-desk-800 border border-desk-600">
            <span class="block text-[13px] font-semibold text-paper-100 leading-snug">${Utils.escape(Utils.val(o.label))}</span>
            <span class="block text-[11px] text-paper-400 leading-snug">${Utils.escape(Utils.val(o.hint))}</span>
          </button>`).join('');
        return `
        <article class="py-3 border-b border-desk-700 last:border-0">
          <div class="flex items-center gap-2"><span class="text-[26px]">${d.cutscene.icon}</span><div class="min-w-0"><div class="text-[15px] font-extrabold">${Utils.escape(Utils.val(d.title))}</div><div class="text-[11px] text-paper-400 truncate">${Utils.escape(Utils.val(d.from))}</div></div></div>
          <p class="text-[12.5px] italic text-paper-300 leading-snug mt-1.5">${Utils.escape(Utils.val(d.body))}</p>
          ${d.player ? (d.u19Card ? UI.u19GradCard(d.player()) : UI.playerCard(d.player(), true)) : ''}
          <div class="grid gap-1.5 mt-2">${opts}</div>
        </article>`;
      }).join('') || '<p class="text-[12.5px] text-paper-400 py-2">Wszystkie oferty i żądania rozpatrzone.</p>');
    } else if (view === 'buy') {
      const beer = (p) => (Selectors.beerAllowed() ? btn('buy-beer', p.id, p.beerTried ? '🍺 już próbowano' : '🍺 Skrzynka i kiełbasa · ' + Math.round(Selectors.beerOdds(p).ok * 100) + '%', p.beerTried || full || budget < Selectors.beerCost(), 'bg-desk-700 text-paper-100 border border-desk-600') : '');
      rows = banNote + (Selectors.beerAllowed() ? `<p class="text-[10.5px] text-paper-400 mt-1.5 leading-snug">🍺 Po prowincjonalnemu: skrzynka piwa i wiejska kiełbasa (${Utils.formatMoney(Selectors.beerCost())}) zamiast odstępnego. Może przejść… albo skończyć się aferą w mediach.</p>` : '')
        + t.market.map((p) => card(p, Utils.formatMoney(p.fee), p.wage + ' zł/tydz.', beer(p) + btn('buy-transfer', p.id, 'Kup za ' + Utils.formatMoney(p.fee), full || budget < p.fee, 'bg-amber-glow text-ink-900'))).join('')
        || '<p class="text-[12.5px] text-paper-400 py-2">Giełda pusta – wszyscy już kupieni.</p>';
    } else if (view === 'loan') {
      rows = banNote + '<p class="text-[11px] text-paper-400 mt-2">Młodzi i zdolni z wyższych lig na jeden sezon. Płacisz opłatę i połowę pensji, po sezonie wracają do siebie.</p>'
        + (t.loanMarket.map((p) => card(p, Utils.formatMoney(p.fee), '🔁 ' + Utils.escape(p.loan.from), btn('loan-in', p.id, 'Wypożycz za ' + Utils.formatMoney(p.fee), full || budget < p.fee, 'bg-amber-glow text-ink-900'))).join('')
        || '<p class="text-[12.5px] text-paper-400 py-2">Wszyscy chętni już wypożyczeni.</p>')
        + (gameState.loansOut.length ? `<div class="text-[10.5px] uppercase tracking-wide text-paper-400 font-semibold mt-3">Nasi na wypożyczeniu</div>` + gameState.loansOut.map((l) => `<div class="text-[12px] py-1 text-paper-300">📤 ${Utils.escape(Selectors.playerName(l.player))} → ${Utils.escape(l.club)} (wraca po sezonie ${l.until})</div>`).join('') : '');
    } else {
      const canGo = gameState.squad.length > CONFIG.minSquad;
      rows = gameState.squad.slice().sort((a, b) => (b.listed ? 1 : 0) - (a.listed ? 1 : 0) || DATA.positions[a.pos].order - DATA.positions[b.pos].order || b.skill - a.skill).map((p) => {
        const star = p.id === gameState.star.playerId;
        const price = star ? Selectors.starFee(p) : Selectors.sellPrice(p);
        if (p.loan) return card(p, '🔁', 'wypożyczony', '');
        return card(p, Utils.formatMoney(price), star ? (gameState.star.promised ? '🌟 obiecany transfer' : '🔥 buntownik') : (p.listed ? '📋 na liście · ' : '') + p.wage + ' zł/tydz.',
          (star ? '' : btn('loan-out', p.id, (p.age <= 23 && Selectors.potential(p) > p.skill ? '📈 Wypożycz na rozwój +' : 'Wypożycz +') + Utils.formatMoney(Selectors.loanOutFee(p)), !canGo, 'bg-desk-600 text-paper-100'))
          + btn('sell-transfer', p.id, 'Sprzedaj ' + Utils.formatMoney(price), !canGo, 'bg-stamp text-white')
          + (star ? '' : btn('toggle-list', p.id, p.listed ? '✖ Z listy' : '📋 Na listę (+15%)', false, 'bg-desk-600 text-paper-100'))
          + btn('release-player', p.id, 'Podziękuj za grę', !canGo, 'bg-desk-700 text-paper-300'));
      }).join('');
    }
    return UI.overlayFrame(`
      <div class="flex-shrink-0 px-4 pt-5 text-paper-100">
        <div class="text-center text-[10.5px] uppercase tracking-[0.2em] text-amber-glow font-semibold">Okno transferowe · przed sezonem ${t.season}</div>
        <h2 class="text-center text-[22px] font-extrabold tracking-tight mt-1">🔁 Giełda zawodników</h2>
        <p class="text-center text-[10.5px] text-paper-400">${Selectors.leagueName()}: typowy OVR ${Selectors.leagueOvrRange().join('–')}</p>
        <div class="grid grid-cols-3 gap-1.5 mt-2 text-center">
          <div class="rounded-xl bg-desk-800 py-1.5"><div class="text-[10px] uppercase text-paper-400">Kasa</div><b class="text-[14px] ${budget < 0 ? 'text-stamp' : ''}">${Utils.formatMoney(budget)}</b></div>
          <div class="rounded-xl bg-desk-800 py-1.5"><div class="text-[10px] uppercase text-paper-400">Kadra</div><b class="text-[14px]">${gameState.squad.length}/${CONFIG.maxSquad}</b></div>

        <div class="text-right"><div class="text-[10px] text-paper-400 whitespace-nowrap">OVR ${x.before} → ${x.after}</div><b class="text-[15px] ${d > 0 ? 'text-grass' : 'text-paper-300'}">${d > 0 ? '+' + d : '±0'}</b></div>
      </div>`;
    }).join('');
    return UI.overlayFrame(`
      <div class="flex-1 min-h-0 overflow-y-auto px-5 py-5 text-paper-100 flex flex-col justify-center">

        <div class="flex justify-between mt-3 px-1 text-[13.5px]"><span class="text-paper-300">Razem ${r.rows.length} ${r.rows.length === 1 ? 'zawodnik' : r.rows.length < 5 ? 'zawodnicy' : 'zawodników'}</span><b class="${total > 0 ? 'text-grass' : 'text-paper-300'}">${total > 0 ? '+' + total : '±0'} OVR</b></div>

  poachOverlay(r) {
