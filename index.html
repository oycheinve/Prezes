  /* ---------- ZAKŁADKA: KADRA I SZATNIA ---------- */
  squadTab() {
    const coach = Selectors.coach();
    const lineup = Selectors.projectedLineup();
    const chem = Engine.chemistry(lineup);
    const sort = gameState.ui.squadSort || 'pos';
    const byPos = (a, b) => DATA.positions[a.pos].order - DATA.positions[b.pos].order || b.skill - a.skill;
    const squad = gameState.squad.slice().sort(
      sort === 'goals' ? (a, b) => (b.seasonGoals + (b.seasonAssists || 0)) - (a.seasonGoals + (a.seasonAssists || 0)) || b.seasonGoals - a.seasonGoals || byPos(a, b)
      : sort === 'rating' ? (a, b) => (Selectors.avgRating(b) ?? -1) - (Selectors.avgRating(a) ?? -1) || byPos(a, b)
      : byPos);
    const cols = 'grid grid-cols-[16px_minmax(0,1fr)_22px_22px_18px_18px_34px_28px] items-center gap-1';
    const marks = (p) => (p.id === gameState.star.playerId ? (gameState.star.rebel ? ' 🔥' : ' 🌟') : '') + (p.injured > 0 ? ' 🩹' : '') + (p.suspended > 0 ? ' ⛔' : '') + (p.loan ? ' 🔁' : '') + (p.benched ? ' 🚫' : '') + (p.exiled ? ' ⬇️U19' : '');

    // Gęsta tabela; stuknięcie w wiersz otwiera dolną szufladę ze szczegółami zawodnika
    const rows = squad.map((p) => {
      const inXI = lineup.includes(p);
      return `
      <button data-action="player-open" data-id="${p.id}" class="${cols} w-full text-left h-[27px] px-1.5 text-[12px] border-b border-paper-300 last:border-0 border-l-[3px] ${inXI ? 'border-l-grass' : 'border-l-transparent'} ${gameState.ui.playerSheet === p.id ? 'bg-amber-glow/15' : 'active:bg-paper-200'}">
        <span class="text-[11px]">${DATA.positions[p.pos].icon}</span>
        <span class="truncate"><b>${Utils.escape(Selectors.shortName(p))}</b>${marks(p)}${p.listed ? ' 📋' : ''}${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}${p.talent ? ' 💎' : ''}</span>
        <span class="text-center text-ink-700">${p.age}</span>
        <span class="text-center">${p.seasonApps}</span>
        <span class="text-center font-semibold">${p.seasonGoals}</span>
        <span class="text-center">${p.seasonAssists || 0}</span>
        <span class="text-right">${UI.ratingBadge(Selectors.avgRating(p))}</span>
        <span class="text-right">${UI.ovrBadge(p)}</span>
      </button>`;
    }).join('');

    return UI.tiles([
      UI.tile('Chemia', chem + '%', Selectors.chemLabel(chem)),
      UI.tile('Kadra', gameState.squad.length + '/' + CONFIG.maxSquad, 'OVR ' + Selectors.teamOvr() + ' · 📈 ' + Utils.formatValue(Selectors.squadValue())),
      UI.tile('Koszt', Utils.formatMoney(Selectors.squadWages()), 'na tydzień'),
      UI.tile('Baza szatni', Selectors.lockerBaseline() + '%', 'legendy, sztab, bojler'),
    ], 4)
    + (gameState.transfer.open ? `<button data-action="open-transfer" class="btn-press w-full h-9 mb-2 rounded-lg bg-amber-glow text-ink-900 text-[13px] font-bold">🔁 Okno transferowe otwarte do 1. kolejki – wejdź</button>` : '')
    + UI.segs('squad-sort', sort, [['xi', '⚽ XI'], ['pos', 'Pozycja'], ['goals', 'G+A'], ['rating', 'Nota'], ['loans', '📤 Wyp.' + (Selectors.loansAll().length ? ' (' + Selectors.loansAll().length + ')' : '')]])
    + (sort === 'loans' ? UI.loansOutView() : sort === 'xi' ? UI.lineupView(lineup, coach) : `<section class="paper overflow-hidden mb-1.5">
        <div class="${cols} h-6 px-1.5 border-l-[3px] border-l-transparent text-[9.5px] uppercase font-semibold text-ink-700 bg-paper-200">
          <span></span><span>Zawodnik · ${DATA.styles[coach.style].label.toLowerCase()}</span><span class="text-center">Wiek</span><span class="text-center">M</span><span class="text-center">G</span><span class="text-center">A</span><span class="text-right">Nota</span><span class="text-right">OVR</span>
        </div>
        ${rows}
      </section>
      <p class="text-[10.5px] text-paper-400 leading-snug">Skład ustala trener ${Utils.escape(coach.name)}. Prezes może najwyżej komuś podziękować – i liczyć się z reakcją trybun. Zielony pasek = jedenastka trenera; stuknij zawodnika po szczegóły i akcje.${gameState.transfer.open ? '' : ' 🔒 Skład zamknięty do okna transferowego.'}</p>`);
  },

  // Wypożyczenia z klubu: kto gdzie gra, forma i zysk OVR od początku wypożyczenia
  loansOutView() {
    const list = Selectors.loansAll();
    const rows = list.map((l) => {
      const p = l.player;
      const now = Selectors.ovr({ ...p, formHistory: [] });
      const start = l.ovrStart != null ? l.ovrStart : now;
      const d = now - start;
      const avg = l.apps ? (l.ratingSum / l.apps) : null;
      const f = l.form || [];
      const trend = f.length >= 2 ? (f[f.length - 1] - f[0] > 0.4 ? ' 📈' : f[f.length - 1] - f[0] < -0.4 ? ' 📉' : '') : '';
      return `
      <div class="flex items-center gap-2 py-1.5 border-b border-paper-300 last:border-0 text-[12px]">
        ${UI.ovrBadge(p)}
        <div class="min-w-0 flex-1">
          <div class="truncate"><b>${l.junior ? '🌱 ' : ''}${Utils.escape(Selectors.shortName(p))}</b> <span class="text-[10.5px] text-ink-700">${p.age} l. · ${DATA.positions[p.pos].label.toLowerCase()}</span></div>
          <div class="text-[10.5px] text-ink-700 truncate">→ ${Utils.escape(l.club)} · ${l.apps || 0} m, ${l.goals || 0} g, ${l.assists || 0} as.${avg != null ? ' · nota ' + avg.toFixed(1) + trend : ''} · wraca po sezonie ${l.until}</div>
        </div>
        <div class="text-right whitespace-nowrap"><div class="text-[10px] text-ink-700">OVR ${start} → ${now}</div><b class="${d > 0 ? 'text-grass' : 'text-ink-700'}">${d > 0 ? '+' + d : '±0'}</b></div>
      </div>`;
    }).join('');
    const total = list.reduce((s, l) => s + (Selectors.ovr({ ...l.player, formHistory: [] }) - (l.ovrStart != null ? l.ovrStart : Selectors.ovr({ ...l.player, formHistory: [] }))), 0);
    return UI.panel('📤 Wypożyczenia z klubu', 'Nasi zawodnicy grający w innych klubach. Regularna gra = rozwój: po 8 i 16 meczach szansa na skok OVR, reszta po powrocie.', rows ? rows + `<div class="flex justify-between text-[12px] mt-1.5"><span>Na wypożyczeniu: <b>${list.length}</b> (seniorzy ${(gameState.loansOut || []).length}, juniorzy ${(gameState.u19Loans || []).length})</span><span>Zysk OVR: <b class="${total > 0 ? 'text-grass' : ''}">${total > 0 ? '+' + total : '±0'}</b></span></div>` : '<p class="text-[12px] italic text-ink-700">Nikogo nie wypożyczyliśmy. Wypożyczenia: okno transferowe (Giełda → Sprzedaj → Wypożycz) albo Dyrektor Sportowy w trybie auto.</p>');
  },

  // Jedenastka trenera na boisku (napastnicy u góry) i rezerwy pod spodem
  lineupView(lineup, coach) {
    const chip = (p) => `
      <button data-action="player-open" data-id="${p.id}" class="btn-press min-w-0 max-w-[84px] flex-1 rounded-md bg-white/95 px-1 py-0.5 text-center text-ink-900">
        <div class="text-[11px] font-bold truncate">${Utils.escape(p.nick)}${p.favorite ? '⭐' : ''}</div>
        <div class="text-[10px] leading-tight">${UI.ovrBadge(p)}</div>
      </button>`;
    const rows = ['FWD', 'MID', 'DEF', 'GK'].map((pos) => {
      const ps = lineup.filter((p) => p.pos === pos);
      return ps.length ? `<div class="flex justify-center gap-1.5">${ps.map(chip).join('')}</div>` : '';
    }).join('');
    const bench = gameState.squad.filter((p) => !lineup.includes(p))
      .sort((a, b) => DATA.positions[a.pos].order - DATA.positions[b.pos].order || b.skill - a.skill)
      .map((p) => `<button data-action="player-open" data-id="${p.id}" class="flex items-center gap-1 min-w-0 text-left text-[11.5px] h-7"><span class="text-[10px]">${DATA.positions[p.pos].icon}</span><b class="truncate">${Utils.escape(p.nick)}</b><span class="text-ink-700">${p.injured > 0 ? '🩹 ' + p.injured + ' tyg.' : p.benched ? '🚫' : p.loan ? '🔁' : Selectors.ratingText(Selectors.avgRating(p))}</span></button>`).join('');
    return `
      <section class="rounded-xl bg-grass px-2 py-2.5 mb-2 space-y-2.5 relative overflow-hidden" style="background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 22px, transparent 22px 44px);">
        <div class="text-[10px] uppercase tracking-wide text-white/80 font-semibold text-center">Jedenastka · ${DATA.styles[coach.style].label} ${DATA.styles[coach.style].formation.slice(1).join('-')} · OVR ${Selectors.teamOvr()}</div>
        ${rows}
      </section>
      <section class="paper px-2.5 py-1.5 mb-1.5">
        <div class="text-[10px] uppercase tracking-wide text-ink-700 font-semibold mb-0.5">Ławka i rezerwy (${gameState.squad.length - lineup.length})</div>
        <div class="grid grid-cols-2 gap-x-2">${bench || '<p class="text-[12px] text-ink-700">Nikogo na ławce.</p>'}</div>
      </section>`;
  },

  // Ostrzeżenia w nagłówku: długi, komornik, walne zebranie, prokuratura
  threats() {
    const t = Selectors.debtThresholds();
    const b = gameState.finance.budget;
    const items = [];
    const ratio = Selectors.debtRatio();
    if (gameState.debt.deepWeeks > 0) items.push('<span class="text-stamp font-bold">☠️ Upadłość za ' + (CONFIG.debtGameOverWeeks - gameState.debt.deepWeeks) + ' tyg.! (dług ' + Math.round(ratio) + '/' + CONFIG.debtBankruptRatio + ' tyg. przychodów)</span>');
    else if (ratio > CONFIG.debtBailiffRatio) items.push('<span class="text-stamp font-bold">⚖️ Komornik · dług ' + Math.round(ratio) + '/' + CONFIG.debtBankruptRatio + ' tyg. przychodów</span>');
    else if (b < t.warn) items.push('<span class="text-amber-glow font-bold">💸 Odsetki + strajk</span>');
    if (gameState.dark.caseOpen) items.push('<span class="text-stamp font-bold">⚖️ Postępowanie w Związku</span>');
    if (gameState.season.promotionBan) items.push('<span class="text-stamp font-bold">⛔ Zakaz awansu</span>');
    if ((gameState.star.slumpUntil || 0) > gameState.calendar.week) items.push('<span class="text-stamp font-bold">📉 Kryzys formy (' + (gameState.star.slumpUntil - gameState.calendar.week) + ' tyg.)</span>');
    if (Selectors.rebel()) items.push('<span class="text-stamp font-bold">🔥 Bunt: „' + Utils.escape(Selectors.starPlayer().nick) + '”</span>');
    return items.length ? `<div class="text-[11px] mt-1 truncate space-x-2">${items.join(' ')}</div>` : '';
  },

  /* ---------- ZAKŁADKA: SKAUTING I MŁODZIEŻ ---------- */

  /* ---------- ZAKŁADKA: WIRTUALNY X ---------- */
  virtualXTab() {
    const x = gameState.x;
    const dna = gameState.club.professionalism;
    const locked = Selectors.strategyLocked();
    const current = Selectors.mediaStrategy();
    const view = UI.sub('virtualx', locked ? 'feed' : 'post');
    const segs = UI.subSegs('virtualx', view, [['post', '🎯 Strategia'], ['feed', '📰 Feed']]);
    const intro = '<p class="text-[11px] text-paper-400 mb-1.5">Dawniej Twitter, w gminie zwany „Fejsem”. Tu się rodzą gównoburze i legendy.</p>';

    if (view === 'feed') {
      const feed = gameState.feed.slice(0, 40).map((p) => `
        <article class="flex gap-2 py-1.5 border-b border-paper-300 last:border-0 ${p.official ? 'border-l-2 border-l-amber-glow pl-1.5' : ''}">
          <div class="w-7 h-7 flex-shrink-0 rounded-full bg-ink-900 flex items-center justify-center text-[14px]">${p.avatar}</div>
          <div class="min-w-0 flex-1">
            <div class="text-[11.5px] truncate"><b>${Utils.escape(p.handle)}</b> <span class="text-ink-700">· T${p.week}</span>${p.official ? ' <span class="text-[9.5px] bg-amber-glow px-1 rounded font-bold">✔ OFICJALNY</span>' : ''}</div>
            <p class="text-[12.5px] leading-snug break-words">${Utils.escape(p.text)}</p>
            <div class="text-[10.5px] text-ink-700 flex gap-3"><span>💬 ${p.replies}</span><span>🔁 ${p.shares}</span><span>❤️ ${p.likes}</span></div>
          </div>
        </article>`).join('');
      return segs + `<section class="paper px-2.5 py-1">${feed || '<p class="text-[12px] py-1.5">Cisza w sieci. Nawet @KibicSukcesu88 jeszcze nic nie napisał.</p>'}</section>`;
    }

    const st = DATA.mediaStrategies[current];
    const cards = Object.entries(DATA.mediaStrategies).map(([id, s]) => {
      const active = locked && id === current;
      const can = !locked;
      return `
      <button data-action="set-strategy" data-value="${id}" ${can ? '' : 'disabled'}
        class="btn-press w-full text-left px-2.5 py-2 border rounded-lg ${active ? 'border-amber-glow bg-amber-glow/15' : can ? 'border-paper-300 bg-white' : 'border-paper-300 bg-paper-200 opacity-60 cursor-not-allowed'}">
        <div class="flex items-baseline justify-between gap-2">
          <span class="text-[13.5px] font-bold">${s.icon} ${s.label}</span>
          <span class="text-[10px] text-ink-700 whitespace-nowrap">presja mediów ${'●'.repeat(s.pressure)}${'○'.repeat(3 - s.pressure)}</span>
        </div>
        <div class="text-[11px] text-ink-700 italic">${s.sub}</div>
        <div class="text-[11px] leading-snug mt-0.5">${s.effects.join(' · ')}</div>
      </button>`;
    }).join('');
    return segs + intro + UI.tiles([
      UI.tile('Strategia', locked ? st.icon + ' ' + st.label : 'do wyboru', locked ? 'sezon ' + x.strategySeason : 'ustal raz na sezon'),
      UI.tile('Presja mediów', locked ? '●'.repeat(st.pressure) + '○'.repeat(3 - st.pressure) : '–', locked ? ['', 'niska', 'średnia', 'wysoka'][st.pressure] : ''),
      UI.tile('DNA klubu', (dna > 0 ? '+' : '') + dna, '„' + Utils.escape(Selectors.dnaLabel()) + '”'),
    ]) + UI.panel('Strategia medialna na sezon ' + gameState.calendar.season, locked
        ? 'Ustalona na cały sezon – Pani Halinka postuje sama, zgodnie z linią klubu. Zmiana w następnym sezonie.'
        : 'Wybierz raz – działa pasywnie przez cały sezon. Pani Halinka postuje sama co dwa tygodnie.', `
        <div class="grid gap-1.5">${cards}</div>`)
      + UI.panel('🧬 DNA klubu', 'Od Prowincjonalnej Patologii do Wiejskiego Profesjonalizmu', `

  /* ---------- ZAKŁADKA: FINANSE I STADION ---------- */
  financeTab() {
    const open = Selectors.budkaOpen();
    const view = !open && UI.sub('finance', 'report') === 'food' ? 'report' : UI.sub('finance', 'report');
    const rep = gameState.lastReport;
    const views = { report: UI.reportCard, tickets: UI.ticketsCard, food: UI.foodCard, merch: UI.merchCard, sponsor: UI.sponsorCard, loans: UI.loansCard, stadium: UI.stadiumCard };

    const roomy = view === 'stadium' && ['st-build', 'st-youth', 'st-lic', 'st-fans', 'st-team'].some((k) => (gameState.ui.folds || {})[k]);
    return (roomy ? '' : UI.tiles([

      UI.tile('Ostatni tydzień', rep ? Utils.signedMoney(rep.total) : '–', rep ? 'Tydzień ' + rep.week : 'brak rozliczenia', rep ? (rep.total < 0 ? 'text-stamp' : 'text-grass') : ''),
    ])) + UI.subSegs('finance', view, [['report', 'Bilans'], ['tickets', 'Bilety']].concat(open ? [['food', 'Budka']] : []).concat([['merch', 'Sklep'], ['sponsor', 'Sponsor'], ['loans', 'Pożyczki'], ['stadium', 'Obiekt']]))
      + (views[view] || UI.reportCard)();

  // Kryzys: cięcia kosztów stałych i wyprzedaż zawodników w jednym miejscu
  crisisCutsCard() {
    const e = Selectors.econ();
    const staff = Object.entries(DATA.staffSlots).map(([slot, def]) => ({ slot, def, m: gameState.staff[slot] })).filter((x) => x.m && x.m.kind !== 'volunteer' && x.m.wage > 0);
    const d = gameState.director && gameState.director.hired;
    const u = gameState.u19 || {};
    const cut = (icon, role, name, wage, action, attrs) => `
      <div class="flex items-center gap-1.5 py-[3px] border-b border-paper-300 last:border-0 text-[12px]">
        <span class="w-5 text-center">${icon}</span><span class="min-w-0 flex-1 truncate"><b>${Utils.escape(role)}</b> · ${Utils.escape(name)}</span>
        <span class="text-ink-700 whitespace-nowrap">${Utils.formatMoney(wage)}/tydz.</span>${UI.smallBtn(action, attrs, 'Zwolnij', false, 'stamp')}
      </div>`;
    const cuts = staff.map((x) => cut(x.def.icon, x.def.label.split(' ')[0], x.m.name, x.m.wage, 'fire-staff', `data-slot="${x.slot}"`)).join('')
      + (d ? cut('🧑‍💼', 'Dyrektor', d.name, Math.round(d.wage * e), 'fire-director', '') : '')
      + (u.coach ? cut('🌱', 'Trener U19', u.coach.name, Math.round(u.coach.wage * e), 'fire-u19', 'data-role="coach"') : '')
      + (u.recruiter ? cut('🔭', 'Rekruter U19', u.recruiter.name, Math.round(u.recruiter.wage * e), 'fire-u19', 'data-role="recruiter"') : '');
    const canSell = gameState.squad.length > CONFIG.minSquad;
    const sale = gameState.squad.filter((p) => !p.loan).sort((a, b) => Selectors.sellPrice(b) - Selectors.sellPrice(a)).slice(0, 5).map((p) => `
      <div class="flex items-center gap-1.5 py-[3px] border-b border-paper-300 last:border-0 text-[12px]">
        ${UI.ovrBadge(p)}<span class="min-w-0 flex-1 truncate"><b>${Utils.escape(Selectors.shortName(p))}</b>${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}</span>
        <span class="whitespace-nowrap text-[11px]"><s class="text-ink-700">${Utils.formatMoney(Selectors.sellPrice(p))}</s> <b class="text-stamp">${Utils.formatMoney(Selectors.fireSalePrice(p))}</b></span>${UI.smallBtn('fire-sale', `data-id="${p.id}"`, 'Sprzedaj', !canSell, 'stamp')}
      </div>`).join('');
    const ratio = Selectors.debtRatio();
    const pct = Utils.clamp(ratio / CONFIG.debtBankruptRatio * 100, 0, 100);
    const meter = `<div class="rounded-md bg-paper-200 px-2 py-1 mb-1"><div class="flex justify-between gap-2 text-[11px] whitespace-nowrap"><span>Dług ${Utils.formatMoney(Selectors.debtHole())} = <b class="${ratio > CONFIG.debtBailiffRatio ? 'text-stamp' : ''}">${Math.round(ratio)} tyg.</b> przychodów</span><span class="text-ink-700">upadłość: ${CONFIG.debtBankruptRatio} tyg.</span></div><div class="h-1.5 rounded-full bg-paper-300 mt-0.5 overflow-hidden"><div class="h-full ${ratio > CONFIG.debtBailiffRatio ? 'bg-stamp' : 'bg-amber-glow'}" style="width:${pct}%"></div></div><div class="text-[10px] text-ink-700 mt-0.5">Przychody klubu ~${Utils.formatMoney(Math.round(Selectors.incomeWeekly()))}/tydz. · komornik od ${CONFIG.debtBailiffRatio} tyg.</div></div>`;
    return UI.panel('🔥 Ratowanie budżetu', 'Liczy się dług względem przychodów, nie sam minus. Cięcia oszczędzają co tydzień, ale zabierają bonusy sztabu.', meter + `
      ${UI.h4('✂️ Zwolnienia w sztabie')}
      ${cuts || '<p class="text-[11.5px] text-ink-700">Nie ma już kogo zwalniać – zostali sami społecznicy.</p>'}
      ${UI.h4('💸 Wyprzedaż „po taniości” – kluby widzą naszą desperację (~45% wartości)')}
      ${sale}
      <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">Sprzedaż działa także poza oknem transferowym. Szatnia i kibice źle to znoszą – zwłaszcza odejście ulubieńców.</p>
    `);
  },

    if (Selectors.debtCrisis() && !gameState.ui.showBilans) return UI.crisisCutsCard() + `<button data-action="show-bilans" class="btn-press w-full h-8 rounded-md bg-desk-700 text-paper-200 text-[12px]">📊 Pokaż bilans tygodnia</button>`;

      ? '<p class="text-[12px]">Jeszcze nic nie rozliczono. Pani Halinka ostrzy ołówek.</p>'

          <tr><td class="pt-1.5 font-semibold">Razem</td><td class="pt-1.5 text-right font-bold text-[14px] whitespace-nowrap ${rep.total < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(rep.total)}</td></tr>

  ticketsCard() {
    const md = gameState.matchday;
    const next = Selectors.nextHomeFixture();
    const preview = next
      ? `<p class="text-[12px] leading-snug">Najbliższy mecz u siebie: <b>Kolejka ${next.kolejka} vs ${Utils.escape(next.fixture.rival)}</b>${Selectors.rival(next.fixture.rival).derby ? ' <span class="text-stamp font-bold">🔥 KOSA – podwójne zainteresowanie!</span>' : ''}. Bilety kupowane na bramce w dniu meczu.</p>`
      : '<p class="text-[12px]">W tym sezonie u siebie już nie gramy.</p>';
    const policies = Object.entries(DATA.tickets).map(([id, t]) => {
      const ok = Engine.canSetTicket(id);
      const active = (md.ticketNext || md.ticket) === id;
      const f = Engine.ticketForecast(id);
      return `
        <button data-action="set-ticket" data-value="${id}" ${ok ? '' : 'disabled'}
          class="btn-press w-full text-left px-2 py-1.5 border rounded-lg flex items-center gap-2 ${active ? 'border-amber-glow bg-amber-glow/15' : ok ? 'border-paper-300 bg-white' : 'border-paper-300 bg-paper-200 opacity-60 cursor-not-allowed'}">
          <span class="text-[18px] w-6 text-center">${ok || active ? t.icon : '🔒'}</span>

            <span class="block text-[10.5px] text-ink-700 leading-snug">${f ? '~' + f.att + ' widzów · ~' + Utils.formatMoney(f.gate) + ' z biletów na mecz' : 'brak meczów u siebie'}${t.fans ? ' · nastroje ' + (t.fans > 0 ? '↑' : '↓') + ' (co miesiąc)' : ''}</span>
          </span>

      <div class="bg-paper-200 rounded-md px-2 py-1.5 mb-1">${preview}</div>
      <p class="text-[11.5px] leading-snug mb-1 truncate">${Selectors.passPolicy().icon} Karnety: <b>${Selectors.passPolicy().label}</b>${Selectors.passHolders() ? ' · ' + Selectors.passHolders() + ' szt. (' + Utils.formatMoney(gameState.matchday.pass.revenue) + ' z góry)' : ''}</p>
      ${UI.h4('Polityka cenowa biletów na bramce')}
      <div class="grid gap-1.5">${policies}</div>
      <p class="text-[11px] font-semibold mt-0.5 text-ink-700">✅ Nowy cennik działa od razu · reakcja kibiców rozliczana co miesiąc (przy dobrych wynikach łagodniej).</p>
      <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">📈 Nastroje po wynikach: <b>${Selectors.formLabel()}</b> do frekwencji, gastro i sklepu · ☀️ w słońcu grill +30%.</p>
    `);
  },

  // Budka: menu rośnie z rozbudową, cena każdej pozycji ustawiana osobno
  foodCard() {
    const b = gameState.budka;
    const L = DATA.budka.levels[b.level || 1];
    const next = DATA.budka.levels[(b.level || 1) + 1];
    const nextCost = next ? Math.round(next.cost * Selectors.econ() / 10) * 10 : 0;
    const pi = Selectors.budkaPriceIndex();
    const rows = Selectors.budkaMenu().map((id) => {
      const it = DATA.budka.items[id];
      const pr = Selectors.budkaPrice(id), cost = Selectors.budkaCost(id);
      const last = b.last && b.last[id];
      const tone = pr > it.base * 1.25 ? 'text-stamp' : pr < it.base * 0.9 ? 'text-grass' : '';
      return `
      <div class="flex items-center gap-1.5 py-[3px] border-b border-paper-300 last:border-0">
        <span class="text-[17px] w-6 text-center">${it.icon}</span>
        <span class="min-w-0 flex-1"><span class="block text-[12px] font-semibold truncate">${Utils.escape(it.label)}</span><span class="block text-[10px] text-ink-700 truncate">koszt ${cost} zł${it.meat && b.cheapMeat ? ' 🥩' : ''} · uczciwie ~${it.base} zł${last ? ' · ost. ' + last.n + ' szt.' : ''}</span></span>
        <button data-action="budka-price" data-id="${id}" data-value="-1" class="btn-press w-7 h-7 rounded-md bg-paper-200 font-bold">−</button>
        <b class="w-10 text-center text-[13px] ${tone}">${pr} zł</b>
        <button data-action="budka-price" data-id="${id}" data-value="1" class="btn-press w-7 h-7 rounded-md bg-paper-200 font-bold">+</button>
      </div>`;
    }).join('');
    const lastTotal = b.last ? Object.values(b.last).reduce((s, x) => s + x.profit, 0) : 0;
    return UI.panel('🌭 ' + L.name + ' · poziom ' + (b.level || 1) + '/' + (DATA.budka.levels.length - 1), 'Menu zależy od rozbudowy. Ty ustalasz ceny – za drogo kolejka znika, a kibice marudzą; za tanio schodzi wszystko, ale marża mała.', `
      ${rows}
      <div class="flex justify-between text-[11.5px] mt-1.5"><span>Cennik vs „uczciwe” ceny: <b class="${pi > 1.15 ? 'text-stamp' : pi < 0.9 ? 'text-grass' : ''}">${Math.round(pi * 100)}%</b>${pi > 1.15 ? ' · kibice narzekają' : pi < 0.85 ? ' · kibice chwalą' : ''}</span><span>Ost. mecz: <b class="text-grass">${Utils.signedMoney(lastTotal)}</b></span></div>
      ${b.cheapMeat ? '<p class="text-[10.5px] text-stamp mt-1 leading-snug">🥩 Mięso od rzeźnika Waldka: mięsne pozycje o połowę tańsze w zakupie. Papierów brak…</p>' : ''}
      ${next && Selectors.buildOf('budka', 'budka') ? `<p class="text-[11.5px] text-amber-700 font-semibold mt-1.5">🏗️ Trwa rozbudowa: ${Utils.escape(next.name)} – jeszcze ${Selectors.buildLeft(Selectors.buildOf('budka', 'budka'))} tyg.</p>` : next ? `<button data-action="budka-upgrade" ${gameState.finance.budget < nextCost || !Selectors.buildFree() ? 'disabled' : ''} class="btn-press w-full mt-1.5 rounded-md bg-amber-glow text-ink-900 px-2 py-1.5 text-left disabled:opacity-50"><span class="block text-[12.5px] font-bold">🏗️ Rozbuduj: ${Utils.escape(next.name)} · ${Utils.formatMoney(nextCost)} · ${Selectors.budkaWeeks((gameState.budka.level || 1) + 1)} tyg.${Selectors.buildFree() ? '' : ' (ekipy zajęte)'}</span><span class="block text-[10.5px]">Nowe w menu: ${next.items.map((id) => DATA.budka.items[id].icon + ' ' + DATA.budka.items[id].label).join(', ')}</span></button>` : '<p class="text-[11px] text-grass font-semibold mt-1.5">🏆 Budka w pełni rozbudowana.</p>'}
    `);
  },

  merchCard() {
    const m = gameState.merch;
    const favorites = gameState.squad.filter((p) => p.favorite).length;
    const items = Selectors.shopItems();
    const rows = items.map((id) => {
      const item = DATA.merch[id];
      const cost = item.batch * item.unitCost;
      const pr = Engine.merchPrice(id);
      const tone = pr > item.basePrice * 1.3 ? 'text-stamp' : pr < item.unitCost ? 'text-stamp' : pr < item.basePrice * 0.85 ? 'text-grass' : '';
      return `
      <div class="flex items-center gap-1 py-[3px] border-b border-paper-300 last:border-0">
        <span class="text-[16px] w-5 text-center">${item.icon}</span>
        <span class="min-w-0 flex-1"><span class="block text-[12px] font-semibold truncate">${Utils.escape(item.label)}</span><span class="block text-[10px] truncate ${m.stock[id] ? 'text-ink-700' : 'text-stamp font-semibold'}">mag. ${m.stock[id]} · hurt ${item.unitCost} zł${m.last && m.last[id] ? ' · ost. ' + m.last[id] + ' szt.' : ''}</span></span>
        <button data-action="merch-price" data-id="${id}" data-value="-1" class="btn-press w-6 h-7 rounded-md bg-paper-200 font-bold">−</button>
        <b class="w-11 text-center text-[12.5px] ${tone}">${pr} zł</b>
        <button data-action="merch-price" data-id="${id}" data-value="1" class="btn-press w-6 h-7 rounded-md bg-paper-200 font-bold">+</button>
        <button data-action="order-merch" data-item="${id}" ${gameState.finance.budget < cost ? 'disabled' : ''} class="btn-press h-7 px-1.5 rounded-md bg-amber-glow text-ink-900 text-[10.5px] font-bold leading-tight disabled:opacity-40">📦+${item.batch}<br>${Utils.formatMoney(cost)}</button>
      </div>`;
    }).join('');
    const frozen = items.reduce((sum, id) => sum + (m.stock[id] || 0) * DATA.merch[id].unitCost, 0);
    const shopLine = gameState.lastReport && gameState.lastReport.lines.find((l) => l.label === 'Sklepik fanowski');
    const stock = items.reduce((sum, id) => sum + (m.stock[id] || 0), 0);
    const next = DATA.shopLevels[(m.level || 1) + 1];
    const nextCost = next ? Math.round(next.cost * Selectors.econ() / 10) * 10 : 0;
    const spi = Selectors.shopPriceIndex();
    return UI.tiles([
      UI.tile('Magazyn', stock + ' szt.', 'zamrożone ' + Utils.formatMoney(frozen)),
      UI.tile('Ostatni tydz.', shopLine ? Utils.signedMoney(shopLine.amount) : '0 zł', 'wpływ ze sklepu', shopLine ? 'text-grass' : ''),
      UI.tile('Sprzedano', m.soldTotal + ' szt.', 'od początku'),
    ]) + UI.panel('🛍️ ' + DATA.shopLevels[m.level || 1].name + ' · poziom ' + (m.level || 1) + '/' + (DATA.shopLevels.length - 1), 'Asortyment rośnie z rozbudową. Cenę każdego gadżetu ustalasz sam; za drogo = nikt nie kupuje i kibice marudzą.', `
      ${rows}
      <div class="flex justify-between text-[11px] mt-0.5"><span>Ceny vs bazowe: <b class="${spi > 1.3 ? 'text-stamp' : spi < 0.8 ? 'text-grass' : ''}">${Math.round(spi * 100)}%</b>${spi > 1.3 ? ' · kibice marudzą' : spi < 0.75 ? ' · kibice chwalą' : ''}</span><span class="text-ink-700">⭐ ulubieńcy: ${favorites} → koszulki</span></div>
      ${(m.level || 1) >= Selectors.shopManagerLevel
        ? (m.manager
          ? `<div class="flex items-center gap-1.5 mt-0.5 rounded-md bg-paper-200 pl-2 pr-0.5 h-6"><span class="flex-1 min-w-0 text-[11px] truncate"><b>👔 Kierownik</b> ${Utils.formatMoney(Selectors.shopManagerWage())}/tydz. · <span class="text-ink-700">${m.managerLast ? 'dostawa ' + Utils.escape(m.managerLast) : 'pilnuje zapasów'}</span></span><button data-action="shop-manager" class="btn-press h-5 px-2 rounded-md bg-paper-300 text-[11px] font-semibold">Zwolnij</button></div>`
          : `<button data-action="shop-manager" title="Sam dokupuje gadżety przed meczem – koniec z pustymi półkami" class="btn-press block w-full h-6 mt-0.5 rounded-md bg-ink-900 text-paper-100 px-2 text-left text-[11.5px] leading-6 font-bold truncate">👔 Zatrudnij kierownika sklepu · ${Utils.formatMoney(Selectors.shopManagerWage())}/tydz.</button>`)
        : `<p class="text-[10.5px] text-ink-700 mt-1">👔 Kierownika sklepu zatrudnisz od poziomu ${Selectors.shopManagerLevel} („${Utils.escape(DATA.shopLevels[Selectors.shopManagerLevel].name)}”). Na razie zapasy zamawiasz sam.</p>`}
      ${next && Selectors.buildOf('shop', 'shop') ? `<p class="text-[11px] text-amber-700 font-semibold mt-1 truncate">🏗️ Trwa rozbudowa: ${Utils.escape(next.name)} – jeszcze ${Selectors.buildLeft(Selectors.buildOf('shop', 'shop'))} tyg.</p>` : next ? `<button data-action="shop-upgrade" ${gameState.finance.budget < nextCost || !Selectors.buildFree() ? 'disabled' : ''} class="btn-press w-full mt-1.5 rounded-md bg-amber-glow text-ink-900 px-2 py-1 text-left disabled:opacity-50"><span class="block text-[12px] font-bold truncate">🏗️ Rozbuduj: ${Utils.escape(next.name)} · ${Utils.formatMoney(nextCost)} · ${Selectors.shopWeeks((gameState.merch.level || 1) + 1)} tyg.${Selectors.buildFree() ? '' : ' (ekipy zajęte)'}</span><span class="block text-[10.5px] truncate">Nowe: ${next.items.map((id) => DATA.merch[id].icon + ' ' + DATA.merch[id].label).join(', ')}</span></button>` : ''}
    `);
  },

        <div class="bg-paper-200 border border-grass rounded-md px-2 py-1.5 mb-1">

          </div>

          <div class="min-w-0 flex-1">
            <div class="text-[12.5px] font-semibold leading-tight truncate">${Utils.escape(sp.name)} <span class="font-normal">· <b>${Utils.formatMoney(Selectors.sponsorWeekly(sp))}/tydz.</b></span></div>
            <div class="text-[10.5px] text-stamp leading-snug truncate">${Utils.escape(sp.requirement)}</div>
          </div>
          ${UI.smallBtn('sign-sponsor', `data-id="${id}"`, 'Podpisz', Selectors.hasRealSponsor())}
        </summary>
        <div class="text-[11px] text-ink-700 leading-snug pb-1.5">${sp.clubPrefix ? 'Dopisek do nazwy: „' + Utils.escape(sp.clubPrefix) + '”' : 'Stadion: ' + Utils.escape(sp.stadiumName)}${Engine.describeEffects(sp.signEffects)} · ${Utils.escape(sp.pitch)}</div>
      </details>`;
    }).join('');
    return UI.panel('Sponsor Tytularny', 'Lokalny biznes chętny, by jego logo oglądało 80 osób i dwie krowy. Jeden naraz.', `
      ${body}
      ${offers}
      ${burnedNow.length ? `<p class="text-[11px] text-stamp mt-1">🔥 Spaleni (znikają z rynku): ${burnedNow.map((n) => Utils.escape(n)).join(', ')}</p>` : ''}
      <p class="text-[11px] text-ink-700 mt-1">Skandale w kartotece klubu: <b>${gameState.club.scandals}</b>. Kto raz zerwie umowę, ten nie wraca – ale na jego miejsce przychodzą nowi. Ile zaproponują, zależy od tego, jak klub się „sprzedaje”.</p>
    `);
  },

  loansCard() {
    const L = gameState.loans;
    const score = Selectors.creditScore();
    const [dot, label, level] = Selectors.creditLabel(score);
    const crisis = gameState.finance.budget < 0;
    const owedAll = L.taken.reduce((s, l) => s + l.remaining * l.rate, 0);
    const takenRows = Object.entries(DATA.lenders).filter(([id, l]) => !l.crisisOnly || crisis || L.taken.some((x) => x.id === id)).map(([id, l]) => {
      const o = Selectors.loanOffer(id);
      const active = l.stack ? (o.available ? null : L.taken.find((x) => x.id === id)) : L.taken.find((x) => x.id === id);
      return UI.row(Utils.escape(l.name) + (active ? '' : ` <span class="font-normal">· <b>${Utils.formatMoney(o.amount)}</b></span>`),
        active ? `<b class="text-stamp">Spłacasz: zostało ${active.remaining} rat po ${Utils.formatMoney(active.rate)} (${Utils.formatMoney(active.remaining * active.rate)})</b>`
          : `${o.installments} rat × ${Utils.formatMoney(o.rate)} (oddajesz ${Utils.formatMoney(o.total)}).${l.club ? ' Kasa jego klubu: ' + Utils.formatMoney(Engine.clubEco(l.club).cash) + '.' : ''} ${Utils.escape(l.note)}`,
        UI.smallBtn('take-loan', `data-id="${id}"`, o.available ? 'Pożycz' : o.reason === 'spłacasz' ? 'Spłacasz' : '🔒 ' + o.reason, !o.available), '', true);
    }).join('');
    return UI.panel('Pożyczki Międzyklubowe', 'Chwilówki u prezesów. Umowa ustna, świadek: barman.', `
      <div class="flex items-center justify-between rounded-md bg-paper-200 px-2 py-1.5 text-[12px]">
        <span>Zdolność kredytowa: <b>${dot} ${label}</b></span><span class="text-ink-700">${'●'.repeat(level)}${'○'.repeat(5 - level)}</span>
      </div>
      ${crisis ? `<p class="text-[10.5px] text-stamp leading-snug mt-0.5 font-semibold">🌀 Klub na minusie (${Utils.formatMoney(gameState.finance.budget)}): pożyczki ratunkowe są droższe. Nieopłacone raty = odsetki karne. Dług to już ${Math.round(Selectors.debtRatio())} tyg. przychodów – komornik od ${CONFIG.debtBailiffRatio}, bankructwo powyżej ${CONFIG.debtBankruptRatio}.${owedAll ? ' Raty do spłaty: ' + Utils.formatMoney(owedAll) + '.' : ''}</p>` : `<p class="text-[10.5px] text-ink-700 leading-snug mt-0.5">Limity rosną i maleją razem ze stanem konta klubu (obecnie: <b>${Utils.formatMoney(gameState.finance.budget)}</b>) i kasą pożyczkodawcy.</p>`}
      ${UI.h4('Pożycz od innego prezesa lub z banku')}
      ${takenRows}
      <p class="text-[11px] text-ink-700 mt-1">Raty schodzą automatycznie co tydzień. ${crisis ? 'Na minusie pożyczają nawet ci, którzy ci nie ufają – za cenę wyższych odsetek.' : 'Im więcej kasy na koncie, tym wyższy limit.'}</p>
    `);
  },

  stadiumCard() {
    const st = gameState.stadium;
    const pitchColor = st.pitch >= 60 ? 'bg-grass' : st.pitch >= 30 ? 'bg-amber-glow' : 'bg-stamp';
    const folds = gameState.ui.folds || {};
    const upgradeRow = ([id, u]) => {
      const owned = st.upgrades[id];
      const lic = !u.group ? ` <i>📋 Licencja: ${id === 'roller' || id === 'boiler' ? 'A-klasa – walec albo bojler; od Klasy Okręgowej – oba' : 'wymagane od ligi ' + DATA.leagueLevels[u.licenseLevel].name}</i>` : '';
      const tier = Selectors.upgradeTier(id);
      const next = owned ? (DATA.upgradeTiers[id] || [])[tier] : null;
      const tierName = tier ? (DATA.upgradeTiers[id][tier - 1].label) : '';
      const bU = Selectors.buildOf('up', id), bT = Selectors.buildOf('tier', id);
      const busy = (b) => `<span class="text-[11px] font-bold text-amber-600 text-right leading-tight whitespace-nowrap">🏗️ ${Selectors.buildLeft(b)} tyg.</span>`;
      const crew = '<span class="text-[10.5px] text-ink-700 text-right leading-tight">ekipy<br>zajęte</span>';
      const action = bU ? busy(bU) : bT ? busy(bT) : !owned ? (Selectors.buildFree() ? UI.smallBtn('buy-upgrade', `data-id="${id}"`, 'Kup · ' + Selectors.upgradeWeeks(id) + ' tyg.', gameState.finance.budget < Selectors.upgradeCost(id)) : crew)
        : next ? (gameState.club.leagueLevel >= next.minLevel ? (Selectors.buildFree() ? UI.smallBtn('upgrade-facility', `data-id="${id}"`, 'Ulepsz ' + Utils.formatMoney(Selectors.tierCost(next)) + ' · ' + Selectors.tierWeeks(next) + ' tyg.', gameState.finance.budget < Selectors.tierCost(next)) : crew) : `<span class="text-[10.5px] text-ink-700 text-right leading-tight">ulepszenie od<br>${DATA.leagueLevels[next.minLevel].name}</span>`)
        : '<span class="text-[11px] font-bold text-grass">MAX</span>';
      return UI.row(`${owned ? '✅ ' : ''}${Utils.escape(tier ? tierName : Selectors.upgradeLabel(id))} <span class="font-normal text-ink-700">${owned ? (tier ? '· poz. ' + (tier + 1) : '') : '– ' + Utils.formatMoney(Selectors.upgradeCost(id)) + (Selectors.upgradeCost(id) < Selectors.upgradeCost(id, true) ? ' (rabat Kółka Rolniczego)' : '')}</span>`,
        (next ? 'Dalej: <b>' + Utils.escape(next.label) + '</b>' : Utils.escape(Selectors.upgradeDesc(id))) + lic,
        action, '', true);
    };
    const group = (key, title, list, note) => {
      const done = list.filter(([id]) => st.upgrades[id]).length;
      const open = !!folds[key];
      return `
      <details data-fold="${key}" class="mt-1.5" ${open ? 'open' : ''}>
        <summary class="flex items-center justify-between h-9 px-2 rounded-md bg-paper-200 text-[12.5px] font-semibold cursor-pointer select-none">
          <span>${title}${note ? ' <span class="text-[10.5px] text-stamp font-bold">' + note + '</span>' : ''}</span><span class="flex items-center gap-2"><span class="text-[11px] text-ink-700">${done}/${list.length}</span><span class="fold-chevron text-ink-700">⌄</span></span>
        </summary>
        ${list.map(upgradeRow).join('')}
      </details>`;
    };
    const all = Object.entries(DATA.upgrades);
    const licList = all.filter(([, u]) => !u.group);
    const fansList = all.filter(([, u]) => u.group === 'fans');
    const teamList = all.filter(([, u]) => u.group === 'team');
    const anyOpen = ['st-build', 'st-youth', 'st-lic', 'st-fans', 'st-team'].some((k) => folds[k]);
    const al = Selectors.academyLevel();
    const youthRows = DATA.academyLevels.map((a, i) => i === 0 ? '' : UI.row(`${i <= al ? '✅ ' : ''}${Utils.escape(a.name)} <span class="font-normal text-ink-700">– ${Utils.formatMoney(Selectors.academyCost(i))}</span>`,
      a.cands + ' kandydatów na selekcji · sufit +' + a.room + ' · szansa na 💎 ' + Math.round(a.talent * 100) + '%',
      i <= al ? '<span class="text-[11px] font-bold text-grass">STOI</span>' : i === al + 1 ? (gameState.academy.building ? (gameState.academy.building.level === i ? '<span class="text-[11px] font-bold text-amber-600">🏗️ ' + Math.max(0, gameState.academy.building.ready - gameState.calendar.week) + ' tyg.</span>' : '<span class="text-[11px] text-ink-700">później</span>') : (gameState.club.leagueLevel >= (a.minLevel || 1) ? UI.smallBtn('build-academy', '', 'Buduj', gameState.finance.budget < Selectors.academyCost(i)) : '<span class="text-[10.5px] text-ink-700 text-right leading-tight">🔒 od ligi<br>' + DATA.leagueLevels[a.minLevel].name + '</span>')) : (gameState.club.leagueLevel < (a.minLevel || 1) ? '<span class="text-[10.5px] text-ink-700 text-right leading-tight">🔒 od ligi<br>' + DATA.leagueLevels[a.minLevel].name + '</span>' : '<span class="text-[11px] text-ink-700">później</span>'), '', true)).join('');
    const youthGroup = `
      <details data-fold="st-youth" class="mt-1.5" ${folds['st-youth'] ? 'open' : ''}>
        <summary class="flex items-center justify-between h-9 px-2 rounded-md bg-paper-200 text-[12.5px] font-semibold cursor-pointer select-none">
          <span>🎽 Szkółka juniorów</span><span class="flex items-center gap-2"><span class="text-[11px] text-ink-700">poziom ${al}/${DATA.academyLevels.length - 1}</span><span class="fold-chevron text-ink-700">⌄</span></span>
        </summary>
        ${youthRows}
      </details>`;
    const lv = st.level || 0, nextLv = DATA.stadiumLevels[lv + 1];
    const needNext = DATA.licenseCapacity[Selectors.nextLevel()] || 0;
    const buildRows = DATA.stadiumLevels.map((s, i) => i === 0 ? '' : UI.row(`${i <= lv ? '✅ ' : ''}${Utils.escape(s.name)} <span class="font-normal text-ink-700">– ${Utils.formatMoney(Selectors.stadiumCost(i))}</span>`,
      s.capacity + ' miejsc' + (DATA.licenseCapacity.indexOf(i) > 0 ? ' · 📋 wymóg od ligi ' + DATA.leagueLevels[DATA.licenseCapacity.indexOf(i)].name : ''),
      i <= lv ? '<span class="text-[11px] font-bold text-grass">STOI</span>' : i === lv + 1 ? (Selectors.buildOf('stadium', 'stadium') ? `<span class="text-[11px] font-bold text-amber-600 whitespace-nowrap">🏗️ ${Selectors.buildLeft(Selectors.buildOf('stadium', 'stadium'))} tyg.</span>` : Selectors.buildFree() ? UI.smallBtn('build-stadium', '', 'Buduj · ' + Selectors.stadiumWeeks(i) + ' tyg.', gameState.finance.budget < Selectors.stadiumCost(i)) : '<span class="text-[10.5px] text-ink-700 text-right leading-tight">ekipy<br>zajęte</span>') : '<span class="text-[11px] text-ink-700">później</span>', '', true)).join('');
    const buildGroup = `
      <details data-fold="st-build" class="mt-1.5" ${folds['st-build'] ? 'open' : ''}>
        <summary class="flex items-center justify-between h-9 px-2 rounded-md bg-paper-200 text-[12.5px] font-semibold cursor-pointer select-none">
          <span>🏗️ Rozbudowa stadionu${lv < needNext ? ' <span class="text-[10.5px] text-stamp font-bold">za mały na awans</span>' : ''}</span><span class="flex items-center gap-2"><span class="text-[11px] text-ink-700">${Selectors.stadiumCapacity()} miejsc</span><span class="fold-chevron text-ink-700">⌄</span></span>
        </summary>
        ${buildRows}
      </details>`;
    const missingSoon = Selectors.licenseMissing(Selectors.nextLevel()).length;
    return UI.panel('Infrastruktura: ' + Utils.escape(Selectors.stadiumName()), anyOpen ? '' : 'Obiekt z duszą. I z kretami.', `
      <div class="flex justify-between text-[12px]"><span>Stan murawy: <b>${Selectors.pitchLabel(st.pitch)}</b></span><span>${st.pitch}%</span></div>
      ${anyOpen ? '' : UI.bar(st.pitch, pitchColor)}
      ${anyOpen ? '' : `<p class="text-[10.5px] text-ink-700 mt-1 leading-snug">Każdy mecz u siebie niszczy murawę (w deszczu mocno). Zła murawa = loteria wyników i mniej widzów.</p>
      <p class="text-[11px] mt-1 leading-snug">${Selectors.facilityLabels().map((f) => Utils.escape(f)).join(' · ')}</p>`}
      ${Selectors.builds().length || gameState.academy.building ? `<p class="text-[11px] mt-1 text-amber-700 font-semibold truncate">🏗️ Budowy (${Selectors.builds().length}/${Selectors.buildSlots}): ${Selectors.builds().map((b) => Utils.escape(b.label) + ' – ' + Selectors.buildLeft(b) + ' tyg.').join(' · ')}${gameState.academy.building ? (Selectors.builds().length ? ' · ' : '') + 'szkółka – ' + Math.max(0, gameState.academy.building.ready - gameState.calendar.week) + ' tyg.' : ''}</p>` : ''}
      ${anyOpen ? '' : `<p class="text-[11px] mt-1">🏟️ Pojemność: <b>${Selectors.stadiumCapacity()}</b> miejsc${nextLv ? ' · następny etap: ' + nextLv.capacity + ' (' + Utils.formatMoney(Selectors.stadiumCost(lv + 1)) + ')' : ''}</p>`}
      ${buildGroup}
      ${group('st-lic', '📋 Wymogi licencyjne', licList, missingSoon ? 'brakuje ' + missingSoon + ' do awansu' : '')}
      ${group('st-fans', '🏟️ Rozbudowa: dla kibiców', fansList, '')}
      ${group('st-team', '🏋️ Rozbudowa: dla drużyny', teamList, '')}
    `);
  },

};

/* ---------------------------------------------------------------------
   6. OBSŁUGA ZDARZEŃ – delegacja po data-action
   --------------------------------------------------------------------- */
const App = {
  // Po każdej akcji: zapis + odświeżenie widoku.
  commit() {
    Storage.save();
    UI.renderAll();
  },
};

const Actions = {
  // Zmiana województwa w trakcie gry – tylko do Klasy Okręgowej (od IV ligi klub gra już w strukturach regionu)
  'set-region'(v) {
    if (gameState.club.leagueLevel > 3 || !DATA.cupRegions[+v] || +v === gameState.club.region) { UI.renderAll(); return; }
    gameState.club.region = +v;
    Engine.addLog('📍 Klub przepisany do OZPN: woj. ' + Selectors.voivodeship().toLowerCase() + '. Rywale z tego województwa od nowego sezonu. Po awansach: ' + (Selectors.hasVLiga() ? 'V liga, ' : '') + 'IV liga w tym województwie i III liga, grupa ' + Selectors.groupLabel() + '.', 'system');
    Storage.save();
    UI.renderAll();
  },

  'form-set'(el) {
    const f = gameState.ui.form;
    f[el.dataset.field] = el.dataset.value;
    gameState.ui.startError = '';
    UI.renderAll();
  },

  'random-club'() {
    const c = Utils.rand(DATA.cultClubs);
    const f = gameState.ui.form;
    const listed = DATA.clubPrefixes.includes(c.prefix);
    Object.assign(f, {
      prefix: listed ? c.prefix : 'custom', customPrefix: listed ? '' : c.prefix,
      town: c.town, character: c.character, colors: c.colors,
      stadium: '', stadiumEdited: false, president: Utils.rand(DATA.presidentNames),
    });
    gameState.ui.startError = '';
    UI.renderAll();
  },

  'start-game'() {
    const f = gameState.ui.form;
    const name = Selectors.formClubName(f);
    const fail = (msg) => {
      gameState.ui.startError = msg;
      UI.renderAll();
      const box = document.querySelector('input[data-field="town"]');
      if (box) { box.classList.add('shake'); box.focus(); }
    };
    if (!f.town.trim()) return fail('Klub bez miejscowości to jak bramka bez siatki. Wpisz, skąd jesteście, Prezesie!');
    if (DATA.rivals.concat(f.region !== '' && DATA.lowerLeagues[+f.region] ? DATA.lowerLeagues[+f.region][1].map((n) => ({ name: n })) : []).some((r) => r.name.toLowerCase() === name.toLowerCase())) return fail('Taki klub już gra w tej B-klasie! Wymyśl coś innego, bo Związek się pogubi.');
    const existing = Storage.load();
    if (existing && existing.club.name && !confirm('W szufladzie jest zapis klubu ' + existing.club.name + '. Nowa prezesura go nadpisze. Kontynuować?')) return;
    Engine.startGame({ name, town: f.town.trim(), character: f.character, colors: f.colors, stadium: f.stadium, president: f.president, region: f.region });
    App.commit();
    window.scrollTo(0, 0);
  },

  'load-game'() {
    const saved = Storage.load();
    if (!saved) return;
    gameState = saved;
    gameState.screen = 'game';
    App.commit();
    window.scrollTo(0, 0);
  },

  'clear-save'() {
    if (confirm('Spalić teczkę z zapisem? Tego nie da się cofnąć.')) {
      Storage.clear();
      UI.renderAll();
    }
  },

  'exit-menu'() {
    Storage.save();
    gameState = createInitialState();
    UI.renderAll();
  },

  'switch-tab'(el) {
    gameState.activeTab = el.dataset.tab;
    gameState.ui.playerSheet = null;
    if (el.dataset.view) gameState.ui.deskView = el.dataset.view;
    if (el.dataset.tab === 'virtualx') gameState.ui.seenFeedId = gameState.x.lastPostId;
    App.commit();
  },

  'resolve-decision'(el) {
    const d = DATA.decisions[el.dataset.decision];
    const before = gameState.ui.lastLogId;
    const was = Selectors.clubSnapshot();
    const chosen = d && d.options[Number(el.dataset.option)];
    Engine.resolveDecision(el.dataset.decision, Number(el.dataset.option));
    // Każda scenka (także oferta w giełdzie) kończy się planszą konsekwencji z wyraźnymi zmianami
    if (d && d.cutscene) {
      const lines = gameState.log.filter((e) => e.id > before).reverse().map((e) => e.text.replace(/\s*\[[^\]]*\]\s*$/, ''));
      const inWindow = d.transfer && gameState.transfer.open;
      if (inWindow) gameState.transfer.news = lines.concat(gameState.transfer.news || []).slice(0, 4);
      gameState.ui.overlay = { type: 'outcome', icon: d.cutscene.icon, title: Utils.val(d.title), choice: chosen ? Utils.val(chosen.label) : '', lines, deltas: Selectors.clubDeltas(was, Selectors.clubSnapshot()), back: inWindow ? 'transfer' : null };
    }
    App.commit();
  },
  'dismiss-alert'(el) {
    gameState.alerts = el.dataset.id === 'all' ? [] : gameState.alerts.filter((a) => String(a.id) !== el.dataset.id);
    App.commit();
  },
  'open-alert'(el) {
    gameState.alerts = gameState.alerts.filter((a) => String(a.id) !== el.dataset.id);
    gameState.activeTab = 'table';
    if (!gameState.ui.sub) gameState.ui.sub = {};
    gameState.ui.sub.table = 'money';
    App.commit();
  },
  'overlay-close'() {
    const o = gameState.ui.overlay;
    const cm = gameState.cupMatch;
    const em = gameState.euroMatch;
    const emDue = em && !em.seen && gameState.lastMatch && em.week === gameState.lastMatch.week;
    if (o && o.type === 'match' && cm && !cm.seen && gameState.lastMatch && cm.week === gameState.lastMatch.week) { gameState.ui.overlay = { type: 'cupMatch' }; App.commit(); return; }   // mecz pucharowy – ten sam ekran meczowy
    if ((o && o.type === 'match' || o && o.type === 'cupMatch') && emDue) { if (o.type === 'cupMatch' && cm) cm.seen = true; gameState.ui.overlay = { type: 'euroMatch' }; App.commit(); return; }   // 13.73: europejski wieczór – pełny ekran meczu
    if (o && o.type === 'cupMatch') { if (cm) cm.seen = true; gameState.ui.overlay = { type: 'match' }; Actions['overlay-close'](); return; }
    if (o && o.type === 'euroMatch') { if (em) em.seen = true; gameState.ui.overlay = { type: 'match' }; Actions['overlay-close'](); return; }
    const sm = gameState.seasonSummary;
    const t = gameState.transfer;
    if (o && o.type === 'season' && sm && gameState.loanReport && gameState.loanReport.rows.length) { sm.seen = true; gameState.ui.overlay = { type: 'loanReport' }; App.commit(); return; }   // najpierw powroty z wypożyczeń
    if (o && o.type === 'loanReport') { gameState.loanReport = null; gameState.ui.overlay = { type: 'season' }; Actions['overlay-close'](); return; }
    if (o && o.type === 'season' && sm) {
      sm.seen = true;
      const yp = gameState.youthPick;
      if (yp && !yp.done) { gameState.ui.overlay = { type: 'youth' }; App.commit(); return; }
    }
    if (o && o.type === 'outcome' && o.back === 'transfer' && t.open) { gameState.ui.overlay = { type: 'transfer' }; App.commit(); return; }
    // Przełom sezonów: mecz → podsumowanie roczne → pożegnania (kariera, sztab) → giełda ze wszystkimi ofertami naraz
    if (o && o.type === 'match' && gameState.directorReport && (!sm || sm.seen)) { gameState.ui.overlay = { type: 'dirReport' }; App.commit(); return; }   // raport dyrektora po okienku
    if (o && o.type === 'dirReport') { gameState.directorReport = null; gameState.ui.reportPlayer = null; }
    if (o && (o.type === 'match' || o.type === 'dirReport') && gameState.poachReport && (!sm || sm.seen)) { gameState.ui.overlay = { type: 'poach' }; App.commit(); return; }   // komunikat o podkradzionej perełce
    if (o && o.type === 'poach') gameState.poachReport = null;
    if (o && (o.type === 'dirReport' || o.type === 'poach')) { gameState.ui.overlay = null; App.commit(); return; }
    if (o && o.type === 'match' && sm && !sm.seen) gameState.ui.overlay = { type: sm.playoff && !sm.playoffSeen ? 'playoff' : 'season' };
    else if (o && o.type === 'playoff' && sm) { sm.playoffSeen = true; gameState.ui.overlay = { type: 'season' }; }
    else if (o && o.type === 'transfer') gameState.ui.overlay = null;
    else if (t.open && !t.shown && (!sm || sm.seen) && !gameState.pendingDecisions.some((id) => ['veteranStaff', 'coachLicense', 'u19Graduate'].includes(id))) {
      t.shown = true;
      gameState.ui.transferView = Selectors.transferOffers().length ? 'offers' : 'buy';
      gameState.ui.overlay = { type: 'transfer' };
    } else gameState.ui.overlay = null;
    App.commit();
  },
  'crisis-answer'(el) { Engine.crisisAnswer(el.dataset.value); App.commit(); },
  'pick-youth'(el) {
    Engine.pickYouth(el.dataset.id || null);
    gameState.ui.overlay = { type: 'youthDone' };
    Actions['overlay-close']();
  },
  'build-academy'()  { Engine.buildAcademy(); App.commit(); },
  'u19-secure'(el)   { Engine.u19Secure(el.dataset.id); App.commit(); },
  'hire-u19'(el)     { Engine.hireU19(el.dataset.role, Number(el.dataset.idx)); App.commit(); },
  'fire-u19'(el)     { Engine.fireU19(el.dataset.role); App.commit(); },
  'hire-director'(el) { Engine.hireDirector(Number(el.dataset.idx)); App.commit(); },
  'fire-director'()  { gameState.director.hired = null; gameState.director.mode = 'manual'; App.commit(); },
  'director-mode'(el) { if (['manual', 'auto'].includes(el.dataset.value)) gameState.director.mode = el.dataset.value; if (el.dataset.value === 'auto' && gameState.transfer.open) Engine.directorAct(); App.commit(); },
  'open-transfer'() {
    if (gameState.transfer.open) { gameState.transfer.shown = true; gameState.ui.overlay = { type: 'transfer' }; }
    App.commit();
  },
  'transfer-view'(el) {
    if (['offers', 'buy', 'loan', 'sell'].includes(el.dataset.value)) gameState.ui.transferView = el.dataset.value;
    App.commit();
  },
  'buy-transfer'(el) { Engine.buyTransfer(el.dataset.id); App.commit(); },
  'buy-beer'(el)     { Engine.buyTransferBeer(el.dataset.id); App.commit(); },
  'loan-in'(el)      { Engine.loanIn(el.dataset.id); App.commit(); },
  'player-open'(el)  { gameState.ui.playerSheet = el.dataset.id; App.commit(); },
  'player-close'()   { gameState.ui.playerSheet = null; App.commit(); },
  'toggle-list'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (p && !p.loan) { p.listed = !p.listed; Engine.addLog(p.listed ? '📋 ' + Selectors.playerName(p) + ' na liście transferowej.' : '📋 ' + Selectors.playerName(p) + ' zdjęty z listy transferowej.', 'decision'); }
    App.commit();
  },
  'loan-out'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (p && confirm('Wypożyczyć ' + Selectors.playerName(p) + ' na cały sezon (+' + Utils.formatMoney(Selectors.loanOutFee(p)) + ')? Wróci po sezonie.')) { Engine.loanOut(p.id); App.commit(); }
  },
  'sell-transfer'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (!p) return;
    const warn = p.legend ? ' To LEGENDA KLUBU – kibice i szatnia tego nie wybaczą!' : p.favorite ? ' To Ulubieniec Trybun – kibice się wściekną!' : '';
    if (confirm('Sprzedać ' + Selectors.playerName(p) + ' za ' + Utils.formatMoney(Selectors.sellPrice(p)) + '?' + warn)) { Engine.sellTransfer(p.id); App.commit(); }
  },

  'euro-ko-view'(el) { gameState.ui.euroKoView = el.dataset.value; App.commit(); },
  'euro-ko-round'(el) { gameState.ui.euroKoRound = el.dataset.value; App.commit(); },
  'start-coach'(el) {
    if (el.dataset.id !== 'mirek') Engine.hireCoach(el.dataset.id);
    gameState.ui.overlay = { type: 'startSponsor' };
    App.commit();
  },
  'start-sponsor'(el) {
    if (el.dataset.id !== 'local') Engine.signSponsor(el.dataset.id);
    gameState.ui.overlay = null;
    App.commit();
  },
  'fixture-info'(el) { gameState.ui.fixInfo = gameState.ui.fixInfo === el.dataset.key ? null : el.dataset.key; App.commit(); },
  'next-week'() {
    const week = gameState.calendar.week;
    gameState.ui.fixInfo = null;
    if (Engine.nextWeek()) {
      if (gameState.screen === 'game' && gameState.lastMatch && gameState.lastMatch.week === week) gameState.ui.overlay = { type: 'match' };
      gameState.activeTab = 'desk';
      gameState.ui.deskView = null;    // nowy tydzień: Biurko samo wybiera sprawy albo pulpit klubu
      App.commit();
      window.scrollTo(0, 0);
    }
  },

  'set-ticket'(el)   { Engine.setTicket(el.dataset.value); App.commit(); },
  'budka-price'(el) { Engine.budkaSetPrice(el.dataset.id, +el.dataset.value || 0); App.commit(); },
  'budka-upgrade'()  { Engine.budkaUpgrade(); App.commit(); },
  'set-sausage'(el)  { if (DATA.sausages[el.dataset.value]) gameState.matchday.sausage = el.dataset.value; App.commit(); },
  'set-markup'(el)   {
    const v = el.dataset.value, m = gameState.merch;
    if (DATA.merchMarkups[v]) { m.markup = v; m.markupNext = null; }   // nowy narzut obowiązuje od razu
    App.commit();
  },
  'order-merch'(el)  { Engine.orderMerch(el.dataset.item); App.commit(); },
  'shop-manager'()   { Engine.toggleShopManager(); App.commit(); },
  'report-player'(el) { gameState.ui.reportPlayer = el.dataset.id || null; App.commit(); },
  'show-bilans'()    { gameState.ui.showBilans = !gameState.ui.showBilans; App.commit(); },
  'merch-price'(el)  { Engine.merchSetPrice(el.dataset.id, +el.dataset.value || 0); App.commit(); },
  'shop-upgrade'()   { Engine.shopUpgrade(); App.commit(); },
  'fire-sale'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (p && confirm('Sprzedać ' + Selectors.playerName(p) + ' po taniości za ' + Utils.formatMoney(Selectors.fireSalePrice(p)) + ' (wartość: ' + Utils.formatMoney(Selectors.sellPrice(p)) + ')?')) { Engine.fireSale(p.id); App.commit(); }
  },
  'sign-sponsor'(el) { Engine.signSponsor(el.dataset.id); App.commit(); },
  'end-sponsor'() {
    const sp = Selectors.sponsor();
    if (sp && !sp.fallback && confirm('Wypowiedzieć umowę z: ' + sp.name + '? Ten sponsor już nie wróci.')) {
      Engine.endSponsor('📝 Prezes wypowiedział umowę sponsorską z: ' + sp.name + '. Trzasnęły drzwi.');
      App.commit();
    }
  },
  'take-loan'(el)    { Engine.takeLoan(el.dataset.id); App.commit(); },
  'buy-upgrade'(el)  { Engine.buyUpgrade(el.dataset.id); App.commit(); },
  'build-stadium'()  { Engine.buildStadium(); App.commit(); },
  'upgrade-facility'(el) { Engine.upgradeFacility(el.dataset.id); App.commit(); },

  'hire-coach'(el)   { Engine.hireCoach(el.dataset.id); App.commit(); },
  'coach-course'()   { Engine.coachCourse(); App.commit(); },
  'fire-coach'(el) {
    const coach = Selectors.coach();
    const cold = el.dataset.mode === 'cold';
    if (confirm('Zwolnić trenera ' + coach.name + (cold ? ' BEZ odprawy? Ok. ' + Math.round(Selectors.fireFochChance(false) * 100) + '% szans na foch szatni.' : ' z odprawą ' + Utils.formatMoney(Engine.severance()) + '?'))) {
      Engine.fireCoach(!cold);
      App.commit();
    }
  },
  'carpet-coach'()   { Engine.carpetCoach(); App.commit(); },
  'hire-staff'(el)   { Engine.hireStaff(el.dataset.slot, Number(el.dataset.idx || 0)); App.commit(); },
  'fire-staff'(el) {
    const m = gameState.staff[el.dataset.slot];
    if (m && confirm('Zwolnić ze sztabu: ' + m.name + '?')) { Engine.fireStaff(el.dataset.slot); App.commit(); }
  },
  'desk-view'(el) {
    if (['decisions', 'club', 'trophies', 'federation'].includes(el.dataset.value)) gameState.ui.deskView = el.dataset.value;
    App.commit();
  },
  'sub-view'(el) {
    if (!DATA.tabs.some((t) => t.id === el.dataset.tab)) return;
    if (!gameState.ui.sub) gameState.ui.sub = {};
    gameState.ui.sub[el.dataset.tab] = el.dataset.value;
    App.commit();
  },
  'squad-sort'(el) {
    if (['xi', 'pos', 'goals', 'rating', 'loans'].includes(el.dataset.value)) gameState.ui.squadSort = el.dataset.value;
    App.commit();
  },
  'release-player'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (!p) return;
    const warn = p.legend ? ' To LEGENDA KLUBU – kibice i szatnia tego nie wybaczą!' : p.favorite ? ' To Ulubieniec Trybun – kibice się wściekną!' : '';
    if (confirm('Podziękować za grę: ' + Selectors.playerName(p) + '?' + warn)) {
      Engine.releasePlayer(p.id);
      App.commit();
    }
  },

  'restart'() {
    Storage.clear();
    gameState = createInitialState();
    UI.renderAll();
    window.scrollTo(0, 0);
  },
  'set-strategy'(el)   { Engine.setMediaStrategy(el.dataset.value); App.commit(); },

  'reset-game'() {
    if (confirm('Na pewno rzucasz papierami? Zapis zostanie skasowany, a klub zostanie bez prezesa (znowu).')) {
      Storage.clear();
      gameState = createInitialState();
      UI.renderAll();
    }
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = Actions[el.dataset.action];
  // Powiadomienia znikają same przy kolejnej akcji (nowe, powstałe w tej akcji, zostają do następnej)
  // (znikają tylko te, które gracz już widział – świeże z tygodnia czekają, aż zamknie ekran meczu)
  if (handler && gameState.alerts && gameState.alerts.length && !['dismiss-alert', 'open-alert'].includes(el.dataset.action)) gameState.alerts = gameState.alerts.filter((a) => !a.seen);
  if (handler) handler(el, e);
});

// Zapamiętujemy, które sekcje gracz zwinął/rozwinął (przetrwa odświeżenie widoku i zapis).
// (zdarzenie „toggle” leci też przy wstawianiu otwartych sekcji – liczymy tylko kliknięcia gracza)
let lastSummaryClick = 0;
document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('summary')) lastSummaryClick = Date.now(); }, true);
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d || !d.dataset || !d.dataset.fold || gameState.screen !== 'game' || Date.now() - lastSummaryClick > 1000) return;
  if (!gameState.ui.folds) gameState.ui.folds = {};
  if (gameState.ui.folds[d.dataset.fold] === d.open) return;
  gameState.ui.folds[d.dataset.fold] = d.open;
  // Akordeon: otwarta jest zawsze tylko jedna sekcja – reszta w tym widoku się zwija
  const key = d.dataset.fold;
  if (d.open) Object.keys(gameState.ui.folds).forEach((k) => { if (k !== key) gameState.ui.folds[k] = false; });
  Storage.save();
  // Przerysowanie: pozostałe sekcje zwinięte (w Sztabie i Obiektach do jednej linijki), otwarta przewinięta do widoku
  lastSummaryClick = 0;
  UI.renderAll();
  const open = d.open && document.querySelector('details[data-fold="' + key + '"]');
  if (open) requestAnimationFrame(() => open.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
}, true);

document.addEventListener('input', (e) => {
  if (e.target.dataset && e.target.dataset.regionSelect != null) { Actions['set-region'](e.target.value); return; }
  if (e.target.dataset && e.target.dataset.tableView != null) { gameState.ui.tableView = e.target.value; Storage.save(); UI.renderAll(); return; }
  const field = e.target.dataset && e.target.dataset.field;
  if (!field || gameState.screen !== 'start') return;
  const f = gameState.ui.form;
  f[field] = e.target.value;
  const rp = document.getElementById('region-path');
  if (field === 'region' && rp) rp.innerHTML = '🛤️ Start w B-klasie: ' + Selectors.promoPath(f.region, 1);
  if (field === 'stadium') f.stadiumEdited = e.target.value.trim() !== '';
  const stadiumBox = document.querySelector('input[data-field="stadium"]');
  if (field === 'town' && stadiumBox && !f.stadiumEdited) stadiumBox.placeholder = Selectors.defaultStadium(f.town.trim() || '[Miejscowość]');
  const preview = document.getElementById('form-preview');
  if (preview) preview.innerHTML = UI.formPreview();
  // poprawiony formularz = stary komunikat o błędzie znika
  gameState.ui.startError = '';
  const err = document.getElementById('start-error');
  if (err) err.textContent = '';
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.field) Actions['start-game']();
});

/* START */
UI.renderAll();
</script>
</body>
</html>
