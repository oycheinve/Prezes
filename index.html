     1. DANE STAŁE        – teksty, pule zdarzeń, konfiguracja (CONFIG, DATA)
     2. STAN GRY          – jedyne źródło prawdy (gameState)
     3. SILNIK / LOGIKA   – funkcje zmieniające stan (Engine)
     4. ZAPIS             – localStorage z migracją starszych zapisów (Storage)
     5. RENDEROWANIE      – funkcje stan -> HTML (UI)
     6. ZDARZENIA         – delegacja kliknięć po data-action (Actions)

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */

    version: CONFIG.saveVersion,
    screen: 'start',            // 'start' | 'game'
    activeTab: 'desk',

      name: '',
      leagueLevel: 1,
      dna: DATA.dnaLevels[0],
      professionalism: 0,       // pod przyszłą mechanikę DNA klubu
      scandals: 0,              // zadymy, zatrucia, długi – patrzą na to sponsorzy
    },
    calendar: {
      week: 1,
      season: 1,
      round: 0,                 // liczba rozegranych kolejek w sezonie
    },
    season: {
      schedule: [],             // [{ rival, home }]
    },
    weather: null,              // pogoda bieżącego tygodnia (obiekt z DATA.weather)
    finance: {
      budget: CONFIG.startBudget,
    },
    morale: {
      lockerRoom: CONFIG.startLockerRoom,   // 0-100
      fans: CONFIG.startFans,               // 0-100
    },
    record: {
      played: 0, wins: 0, draws: 0, losses: 0,
      goalsFor: 0, goalsAgainst: 0,
      lossStreak: 0,
      form: [],                 // ostatnie wyniki: 'W' | 'D' | 'L'
    },
    matchday: {
      ticket: 'standard',
      sausage: 'zapiekanka',
      security: null,           // null | 'hired' | 'none' – tylko na derby u siebie
    },
    seasonTickets: {
      holders: 0,
      roundsLeft: 0,
      lastOfferKey: '',
    },
    merch: {
      stock: { mug: 0, scarf: 0, shirt: 0 },
      markup: 'medium',
      soldTotal: 0,
    },
    sponsor: {
      active: null,             // id z DATA.sponsors
      signedWeek: 0,
      scandalsAtSign: 0,
      burned: [],               // sponsorzy, którzy już nie wrócą
    },
    loans: {
      taken: [],                // { id, remaining, rate }
      given: [],                // { id, dueWeek, returns, risk, delays }
    },
    stadium: {
      baseName: 'Boisko Gminne przy Remizie',
      pitch: CONFIG.startPitch, // 0-100
      upgrades: { roller: false, boiler: false, roof: false },
    },
    report: null,               // bilans tygodnia w trakcie liczenia
    lastReport: null,           // ostatni zamknięty bilans
    pendingDecisions: [],       // tablica id z DATA.decisions
    log: [],                    // { week, text, type, id }
    ui: {
      startError: '',
      startQuote: null,
      lastLogId: 0,
    },
  };
}

let gameState = createInitialState();

/* ---------------------------------------------------------------------
   3. SILNIK / LOGIKA GRY
   --------------------------------------------------------------------- */
const Utils = {
  rand: (arr) => arr[Math.floor(Math.random() * arr.length)],
  randInt: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  randRange: (a, b) => a + Math.random() * (b - a),
  clamp: (v, min, max) => Math.max(min, Math.min(max, v)),
  shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  poisson: (lambda) => { const L = Math.exp(-lambda); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; },
  val: (x) => (typeof x === 'function' ? x() : x),
  formatMoney: (n) => Math.round(n).toLocaleString('pl-PL').replace(/,/g, ' ') + ' zł',
  signedMoney: (n) => (n > 0 ? '+' : '') + Utils.formatMoney(n),
  escape: (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
};

const Engine = {
  startGame(clubName) {
    const fresh = createInitialState();
    fresh.screen = 'game';
    fresh.club.name = clubName;
    gameState = fresh;

    Engine.generateSchedule();
    gameState.weather = Utils.rand(DATA.weather);
    Engine.addLog('Objąłeś funkcję Prezesa klubu ' + clubName + '. W kasie ' + Utils.formatMoney(CONFIG.startBudget) + ' i karton po bananach z dokumentami.', 'system');
    Engine.addLog('Poprzedni prezes zostawił na biurku klucze (nie wiadomo do czego) i niedopitą kawę z 2019.', 'flavor');
    Engine.addLog('Liga rusza w Tygodniu ' + (CONFIG.preseasonWeeks + 1) + '. Pierwszy rywal: ' + gameState.season.schedule[0].rival + '.', 'system');
    Engine.pushDecision('welcomeWojt');
    Engine.offerSeasonTickets();
  },

  addLog(text, type = 'flavor') {
    gameState.ui.lastLogId += 1;
    gameState.log.unshift({ id: gameState.ui.lastLogId, week: gameState.calendar.week, text, type });
    if (gameState.log.length > CONFIG.maxLogEntries) gameState.log.length = CONFIG.maxLogEntries;
  },

  // Każdy ruch pieniędzy przechodzi tędy – trafia do bilansu tygodnia, jeśli jest liczony.
  money(label, amount) {
    if (!amount) return;
    gameState.finance.budget += amount;
    if (gameState.report) gameState.report.lines.push({ label, amount });
  },

  // Jedyne miejsce, gdzie modyfikujemy statystyki – łatwo rozszerzyć o nowe.
  applyEffects(effects = {}, label = 'Inne') {
    if (effects.budget)     Engine.money(label, effects.budget);
    if (effects.lockerRoom) gameState.morale.lockerRoom = Utils.clamp(gameState.morale.lockerRoom + effects.lockerRoom, 0, 100);
    if (effects.fans)       gameState.morale.fans = Utils.clamp(gameState.morale.fans + effects.fans, 0, 100);
  },

  describeEffects(effects = {}) {
    const parts = [];
    if (effects.budget)     parts.push(Utils.signedMoney(effects.budget));
    if (effects.lockerRoom) parts.push('szatnia ' + (effects.lockerRoom > 0 ? '+' : '') + effects.lockerRoom + '%');
    if (effects.fans)       parts.push('kibice ' + (effects.fans > 0 ? '+' : '') + effects.fans + '%');
    return parts.length ? ' [' + parts.join(', ') + ']' : '';
  },

  addScandal(reason) {
    gameState.club.scandals += 1;
    Engine.addLog('📰 Skandal w kartotece klubu: ' + reason + ' (łącznie: ' + gameState.club.scandals + ').', 'event');
  },

  /* ----- Decyzje ----- */
  pushDecision(decisionId) {
    if (DATA.decisions[decisionId] && !gameState.pendingDecisions.includes(decisionId)) {
      gameState.pendingDecisions.push(decisionId);
    }
  },

  resolveDecision(decisionId, optionIndex) {
    const decision = DATA.decisions[decisionId];
    const option = decision && decision.options[optionIndex];
    if (!option || !gameState.pendingDecisions.includes(decisionId)) return;
    const effects = Utils.val(option.effects) || {};
    const log = Utils.val(option.log);
    Engine.applyEffects(effects, 'Decyzja: ' + Utils.val(decision.title));
    if (option.onChoose) option.onChoose();
    Engine.addLog(log + Engine.describeEffects(effects), 'decision');
    gameState.pendingDecisions = gameState.pendingDecisions.filter((id) => id !== decisionId);
  },

  canAdvanceWeek() {
    return gameState.pendingDecisions.length === 0;
  },

  /* ----- Terminarz ----- */
  generateSchedule() {
    const order = Utils.shuffle(DATA.rivals.map((r) => r.name));
    const first = order.map((rival, i) => ({ rival, home: i % 2 === 0 }));
    const second = first.map((f) => ({ rival: f.rival, home: !f.home }));
    gameState.season.schedule = first.concat(second);
  },

  /* ----- Karnety ----- */
  seasonTicketDemand(kind) {
    const fans = gameState.morale.fans;
    return kind === 'vip' ? Math.round(4 + fans * 0.15) : Math.round(8 + fans * 0.3);
  },

  setSeasonTickets(holders) {
    gameState.seasonTickets.holders = holders;
    gameState.seasonTickets.roundsLeft = holders > 0 ? CONFIG.roundsPerRunda : 0;
  },

  offerSeasonTickets() {
    const key = 's' + gameState.calendar.season + 'r' + gameState.calendar.round;
    if (gameState.seasonTickets.lastOfferKey === key) return;
    gameState.seasonTickets.lastOfferKey = key;
    Engine.pushDecision('seasonTickets');
  },

  /* ----- Dzień meczowy ----- */
  // Szacunek bez losowości – używany też w UI do podglądu.
  estimateAttendance(fixture, weather = gameState.weather) {
    const rival = Selectors.rival(fixture.rival);
    const ticket = DATA.tickets[gameState.matchday.ticket];
    let base = 20 + gameState.morale.fans * 1.0;
    if (rival.derby) base *= 2;
    base *= ticket.attendance;
    if (gameState.stadium.pitch < 25) base *= 0.85;
    let att = base * weather.attendance;
    if (weather.rain && gameState.stadium.upgrades.roof) att += Math.min(30, base - att);
    return Math.max(0, Math.round(att));
  },

  playMatchday() {
    const fixture = Selectors.currentFixture();
    const rival = Selectors.rival(fixture.rival);
    const weather = gameState.weather;
    const kolejka = gameState.calendar.round + 1;
    const report = gameState.report;
    report.homeMatch = fixture.home;

    // --- Wynik (na razie: siła szatni vs rywal, z chaosem pogody) ---
    let our = 1.2 + (gameState.morale.lockerRoom - 50) / 80;
    let opp = rival.strength;
    if (fixture.home) our += 0.25; else opp += 0.25;
    const pitchChaos = fixture.home ? (100 - gameState.stadium.pitch) / 300 : 0.1;
    const chaos = Utils.clamp(weather.chaos + pitchChaos, 0, 0.9);
    const avg = (our + opp) / 2;
    our = our * (1 - chaos) + avg * chaos;
    opp = opp * (1 - chaos) + avg * chaos;
    const gf = Utils.poisson(Math.max(0.2, our));
    const ga = Utils.poisson(Math.max(0.2, opp));
    const result = gf > ga ? 'W' : gf === ga ? 'D' : 'L';

    const clubName = Selectors.clubDisplayName();
    const scoreLine = fixture.home
      ? clubName + ' ' + gf + ':' + ga + ' ' + rival.name
      : rival.name + ' ' + ga + ':' + gf + ' ' + clubName;
    let resultText = Utils.rand(DATA.resultTexts[result]);
    if (result === 'W' && rival.strength > our && chaos >= 0.5) resultText = 'SENSACJA NA BŁOCIE! Faworyt utonął w kałużach. ' + resultText;
    const derbyTag = rival.derby ? ' 🔥 KOSA!' : '';
    Engine.addLog('⚽ Kolejka ' + kolejka + derbyTag + ': ' + scoreLine + ' (' + (fixture.home ? 'u siebie' : 'wyjazd') + ', ' + weather.icon + ' ' + weather.label.charAt(0).toLowerCase() + weather.label.slice(1) + '). ' + resultText, 'match');

    // --- Statystyki i nastroje ---
    const r = gameState.record;
    r.played++; r.goalsFor += gf; r.goalsAgainst += ga;
    if (result === 'W') { r.wins++; r.lossStreak = 0; }
    if (result === 'D') { r.draws++; r.lossStreak = 0; }
    if (result === 'L') { r.losses++; r.lossStreak++; }
    r.form.push(result); if (r.form.length > 5) r.form.shift();
    report.result = result;

    const mult = rival.derby ? 2 : 1;
    const moodEffects = {
      W: { fans: 5 * mult, lockerRoom: 5 },
      D: { fans: 0, lockerRoom: 1 },
      L: { fans: -4 * mult, lockerRoom: -4 },
    }[result];
    Engine.applyEffects(moodEffects);

    // --- Pieniądze z dnia meczowego ---
    if (fixture.home) Engine.homeMatchdayIncome(fixture, rival, weather);
    else Engine.money('Paliwo do busa (wyjazd)', -Utils.randInt(50, 90));

    // --- Karnety i kalendarz ligi ---
    if (gameState.seasonTickets.roundsLeft > 0) {
      gameState.seasonTickets.roundsLeft--;
      if (gameState.seasonTickets.roundsLeft === 0) gameState.seasonTickets.holders = 0;
    }
    gameState.matchday.security = null;
    gameState.calendar.round++;
    if (gameState.calendar.round >= gameState.season.schedule.length) Engine.endSeason();
  },

  homeMatchdayIncome(fixture, rival, weather) {
    const md = gameState.matchday;
    const ticket = DATA.tickets[md.ticket];
    const sausage = DATA.sausages[md.sausage];

    const att = Math.round(Engine.estimateAttendance(fixture, weather) * Utils.randRange(0.85, 1.15));
    const holdersIn = Math.min(gameState.seasonTickets.roundsLeft > 0 ? gameState.seasonTickets.holders : 0, att);
    const paying = att - holdersIn;
    const gate = paying * ticket.price;
    Engine.money('Bilety (' + paying + ' × ' + ticket.price + ' zł)', gate);

    const sold = Math.round(att * 0.45 * weather.grill * sausage.rate * Utils.randRange(0.8, 1.2));
    const grillProfit = sold * (sausage.price - sausage.cost);
    Engine.money('Budka u Pana Zenka (' + sold + ' szt.)', grillProfit);

    Engine.addLog('🏟️ Frekwencja: ' + att + ' widzów' + (holdersIn ? ' (w tym ' + holdersIn + ' karnetowiczów)' : '') +
      '. Bilety: ' + Utils.formatMoney(gate) + '. Budka Zenka: ' + sold + ' szt. „' + sausage.label + '” → ' + Utils.formatMoney(grillProfit) + ' zysku.', 'finance');

    Engine.applyEffects({ fans: ticket.fans + sausage.fans });

    if (Math.random() < sausage.poisonRisk) {
      Engine.applyEffects({ fans: -5 });
      Engine.addLog('🤢 Po przerwie trzech kibiców pobiegło w krzaki za trybuną. Pasztetowa zbiera żniwo. [kibice -5%]', 'event');
      Engine.addScandal('zatrucie w budce z kiełbaskami');
    }

    if (rival.derby) {
      if (md.security === 'hired') {
        Engine.addLog('🛡️ Byczki z Herkulesa stali przy bramie. Nikt nie odważył się rzucić nawet łupiną od słonecznika.', 'event');
      } else if (Math.random() < 0.45) {
        Engine.money('Kara Związku za zadymę', -600);
        Engine.applyEffects({ fans: +2 });
        Engine.addLog('💥 ZADYMA! Przyjezdni kibice (' + rival.name + ') wtargnęli na murawę, wujek Staszek zgubił latarkę. Związek nalicza karę 600 zł. Miejscowi zachwyceni widowiskiem.', 'event');
        Engine.addScandal('zadyma na derbach');
      } else {
        Engine.addLog('😅 Derby bez ochrony przeszły spokojnie. Wujek Staszek mówi, że to dzięki latarce.', 'event');
      }
    }

    const damage = 5 + weather.pitchDamage;
    gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch - damage, 0, 100);
    if (weather.pitchDamage >= 15) Engine.addLog('🟫 Mecz w deszczu zrył murawę (-' + damage + ' stanu boiska). Pan Heniek klnie pod nosem z grabiami w ręku.', 'event');
  },

  endSeason() {
    const r = gameState.record;
    Engine.addLog('🏁 KONIEC SEZONU ' + gameState.calendar.season + '! Bilans: ' + r.wins + 'W ' + r.draws + 'R ' + r.losses + 'P, bramki ' + r.goalsFor + ':' + r.goalsAgainst + '. Tabela ligowa pojawi się, jak Związek naprawi faks.', 'system');
    gameState.calendar.season++;
    gameState.calendar.round = 0;
    Object.assign(gameState.record, { played: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 });
    Engine.generateSchedule();
  },

  /* ----- Sklepik ----- */
  merchPrice(itemId) {
    return Math.round(DATA.merch[itemId].basePrice * DATA.merchMarkups[gameState.merch.markup].priceMod);
  },

  orderMerch(itemId) {
    const item = DATA.merch[itemId];
    if (!item || gameState.finance.budget < item.batch * item.unitCost) return;
    const cost = item.batch * item.unitCost;
    Engine.money('Zamówienie: ' + item.label, -cost);
    gameState.merch.stock[itemId] += item.batch;
    Engine.addLog('📦 Zamówiono ' + item.batch + ' szt. „' + item.label + '” za ' + Utils.formatMoney(cost) + '. Karton stoi w szatni, zawodnicy już przymierzają.', 'finance');
  },

  /* ----- Sponsor ----- */
  signSponsor(id) {
    const sp = DATA.sponsors[id];
    const s = gameState.sponsor;
    if (!sp || s.active || s.burned.includes(id)) return;
    s.active = id;
    s.signedWeek = gameState.calendar.week;
    s.scandalsAtSign = gameState.club.scandals;
    Engine.applyEffects(sp.signEffects);
    Engine.addLog('🤝 Podpisano umowę sponsorską z: ' + sp.name + ' (' + Utils.formatMoney(sp.weekly) + '/tydz.).' + Engine.describeEffects(sp.signEffects), 'finance');
  },

  endSponsor(logText) {
    const s = gameState.sponsor;
    if (!s.active) return;
    s.burned.push(s.active);
    s.active = null;
    Engine.addLog(logText, 'event');
  },

  /* ----- Pożyczki ----- */
  takeLoan(id) {
    const l = DATA.lenders[id];
    if (!l || gameState.loans.taken.some((x) => x.id === id)) return;
    gameState.loans.taken.push({ id, remaining: l.installments, rate: l.rate });
    Engine.money('Pożyczka: ' + l.name, l.amount);
    Engine.addLog('💸 ' + l.name + ' pożyczył ' + Utils.formatMoney(l.amount) + '. Spłata: ' + l.installments + ' rat po ' + Utils.formatMoney(l.rate) + '. ' + l.note, 'finance');
  },

  lendMoney(id) {
    const b = DATA.borrowers[id];
    if (!b || gameState.loans.given.some((x) => x.id === id) || gameState.finance.budget < b.amount) return;
    gameState.loans.given.push({ id, dueWeek: gameState.calendar.week + b.weeks, returns: b.returns, risk: b.risk, delays: 0 });
    Engine.money('Pożyczono: ' + b.name, -b.amount);
    Engine.addLog('🤝 Pożyczono ' + Utils.formatMoney(b.amount) + ' – ' + b.name + '. Ma oddać ' + Utils.formatMoney(b.returns) + ' za ' + b.weeks + ' tyg. Przybił piątkę, więc na pewno odda.', 'finance');
  },

  /* ----- Infrastruktura ----- */
  buyUpgrade(id) {
    const u = DATA.upgrades[id];
    if (!u || gameState.stadium.upgrades[id] || gameState.finance.budget < u.cost) return;
    Engine.money('Inwestycja: ' + u.label, -u.cost);
    gameState.stadium.upgrades[id] = true;
    if (id === 'roller') gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch + 30, 0, 100);
    if (id === 'boiler') Engine.applyEffects({ lockerRoom: +8 });
    Engine.addLog('🔧 Inwestycja: ' + u.label + ' (' + Utils.formatMoney(u.cost) + '). Pan Heniek mówi, że „takiego luksusu tu nie było od Gierka”.', 'finance');
  },

  // Hooki wykonywane po kliknięciu [NASTĘPNY TYDZIEŃ], po kolei.
  // Rozliczają bieżący tydzień, a na końcu przesuwają kalendarz.
  weeklyHooks: [
    function openReport() {
      gameState.report = { week: gameState.calendar.week, lines: [], homeMatch: false, result: null };
    },
    function rollFlavor() {
      const entry = Utils.rand(DATA.weeklyFlavor);
      Engine.applyEffects(entry.effects, 'Zdarzenia losowe');
      Engine.addLog(entry.text + Engine.describeEffects(entry.effects), entry.effects ? 'event' : 'flavor');
    },
    function matchday() {
      if (Selectors.isMatchWeek()) Engine.playMatchday();
    },
    function merchSales() {
      const m = gameState.merch;
      const markup = DATA.merchMarkups[m.markup];
      const parts = [];
      let income = 0;
      Object.keys(DATA.merch).forEach((id) => {
        if (m.stock[id] <= 0) return;
        const item = DATA.merch[id];
        let d = item.demand * (0.4 + gameState.morale.fans / 60) * markup.demandMod * Utils.randRange(0.5, 1.5);
        if (gameState.report.result === 'W') d *= 1.5;
        if (gameState.report.homeMatch) d *= 1.4;
        const sold = Math.min(m.stock[id], Math.floor(d) + (Math.random() < d % 1 ? 1 : 0));
        if (sold <= 0) return;
        m.stock[id] -= sold;
        m.soldTotal += sold;
        income += sold * Engine.merchPrice(id);
        parts.push(item.label + ' ×' + sold);
      });
      if (income > 0) {
        Engine.money('Sklepik fanowski', income);
        Engine.addLog('🛍️ Sklepik: ' + parts.join(', ') + ' → ' + Utils.formatMoney(income) + '.', 'finance');
      }
    },
    function sponsorIncome() {
      const s = gameState.sponsor;
      if (!s.active) return;
      const sp = DATA.sponsors[s.active];
      if (sp.breaks(gameState)) { Engine.endSponsor('❌ ' + sp.breakLog); return; }
      Engine.money('Sponsor: ' + sp.name, sp.weekly);
      Engine.addLog('💼 Sponsor „' + sp.name + '”: ' + Utils.formatMoney(sp.weekly) + ' wpłynęło na konto (a raczej przyszło w kopercie).', 'finance');
    },
    function loansTick() {
      const L = gameState.loans;
      L.taken.forEach((loan) => {
        const lender = DATA.lenders[loan.id];
        if (gameState.finance.budget < loan.rate) Engine.addScandal(lender.name + ' rozpowiada po wsi, że klub nie ma na raty');
        Engine.money('Rata: ' + lender.name, -loan.rate);
        loan.remaining--;
        if (loan.remaining === 0) Engine.addLog('✅ Spłacono ostatnią ratę – ' + lender.name + '. Na pożegnanie postawił flaszkę.', 'finance');
      });
      L.taken = L.taken.filter((l) => l.remaining > 0);

      L.given = L.given.filter((loan) => {
        if (gameState.calendar.week < loan.dueWeek) return true;
        const b = DATA.borrowers[loan.id];
        if (Math.random() >= loan.risk) {
          Engine.money('Zwrot pożyczki: ' + b.name, loan.returns);
          Engine.addLog('💰 ' + b.name + ' oddał ' + Utils.formatMoney(loan.returns) + '. Z procentem! Cuda się zdarzają.', 'finance');
          return false;
        }
        loan.delays++;
        if (loan.delays >= 3) {
          const half = Math.round(DATA.borrowers[loan.id].amount / 2);
          Engine.money('Odzysk długu: ' + b.name, half);
          Engine.addLog('🥔 ' + b.name + ' w końcu „rozliczył się”: ' + Utils.formatMoney(half) + ' i worek ziemniaków. Reszta przepadła.', 'finance');
          return false;
        }
        loan.dueWeek += 2;
        loan.risk = Math.min(0.9, loan.risk + 0.15);
        Engine.addLog('🙄 ' + b.name + ' ' + Utils.rand(DATA.debtorExcuses) + ' Nowy termin: Tydzień ' + loan.dueWeek + '.', 'event');
        return true;
      });
    },
    function fixedCosts() {
      const lime = Utils.randInt(20, 40), power = Utils.randInt(30, 50), laundry = Utils.randInt(40, 60);
      Engine.money('Koszty stałe (wapno, prąd, pranie)', -(lime + power + laundry));
      Engine.addLog('🧾 Koszty stałe: wapno do linii ' + lime + ' zł, prąd w blaszaku ' + power + ' zł, pranie strojów u pani Krysi ' + laundry + ' zł.', 'finance');
    },
    function stadiumUpkeep() {
      gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch + (gameState.stadium.upgrades.roller ? 6 : 3), 0, 100);
    },
    function moraleDrift() {
      const drift = (v, target) => (v < target ? v + 1 : v > target ? v - 1 : v);
      gameState.morale.lockerRoom = drift(gameState.morale.lockerRoom, gameState.stadium.upgrades.boiler ? 60 : 50);
      gameState.morale.fans = drift(gameState.morale.fans, 50);
    },
    function closeReport() {
      const rep = gameState.report;
      rep.total = rep.lines.reduce((sum, l) => sum + l.amount, 0);
      rep.budgetAfter = gameState.finance.budget;
      Engine.addLog('📊 Bilans tygodnia: ' + Utils.signedMoney(rep.total) + '. Stan konta: ' + Utils.formatMoney(rep.budgetAfter) + '.', 'summary');
      if (gameState.finance.budget < 0) Engine.addLog('⚠️ Konto na minusie! Pani z Banku Spółdzielczego dzwoni trzeci raz. Prezes udaje, że nie ma zasięgu.', 'event');
      gameState.lastReport = rep;
      gameState.report = null;
    },
    function advanceCalendar() {
      gameState.calendar.week += 1;
      gameState.weather = Utils.rand(DATA.weather);
    },
    function scheduleDecisions() {
      if (!Selectors.isMatchWeek()) return;
      if (gameState.calendar.round % CONFIG.roundsPerRunda === 0) Engine.offerSeasonTickets();
      const fx = Selectors.currentFixture();
      if (fx.home && Selectors.rival(fx.rival).derby) Engine.pushDecision('derbySecurity');
    },
  ],

  nextWeek() {
    if (!Engine.canAdvanceWeek()) return false;
    Engine.weeklyHooks.forEach((hook) => hook());
    return true;
  },
};

/* ---------------------------------------------------------------------
   4. ZAPIS GRY (localStorage)
   --------------------------------------------------------------------- */
const Storage = {
  KEY: 'bklasa-prezes-save',

  save() {
    if (gameState.screen !== 'game') return;
    try { localStorage.setItem(Storage.KEY, JSON.stringify(gameState)); } catch (e) { /* brak miejsca / tryb prywatny */ }
  },

  load() {
    try {
      const raw = localStorage.getItem(Storage.KEY);
      if (!raw) return null;
      return Storage.migrate(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  },

  clear() {
    try { localStorage.removeItem(Storage.KEY); } catch (e) { /* ignorujemy */ }
  },

  // Nowe pola z createInitialState trafiają do starych zapisów automatycznie.
  migrate(saved) {
    const merge = (def, src) => {
      if (src === undefined) return def;
      if (def && typeof def === 'object' && !Array.isArray(def) && src && typeof src === 'object' && !Array.isArray(src)) {
        const out = { ...def };
        Object.keys(src).forEach((k) => { out[k] = merge(def[k], src[k]); });
        return out;
      }
      return src;
    };
    const state = merge(createInitialState(), saved);
    state.version = CONFIG.saveVersion;
    state.ui.startError = '';
    if (!state.season.schedule.length) {
      const prev = gameState; gameState = state; Engine.generateSchedule(); gameState = prev;
    }
    if (!state.weather) state.weather = DATA.weather[1];
    return state;
  },
};

      ${UI.merchCard()}
      ${UI.sponsorCard()}
      ${UI.loansCard()}
      ${UI.stadiumCard()}
    </div>`;
  },

  reportCard() {
    const rep = gameState.lastReport;
    const body = !rep
      ? '<p class="text-sm">Jeszcze nic nie rozliczono. Pani Halinka ostrzy ołówek.</p>'
      : `<table class="w-full text-sm">
          ${rep.lines.map((l) => `<tr class="border-b border-dashed border-paper-400"><td class="py-1 pr-2">${Utils.escape(l.label)}</td><td class="py-1 text-right font-bold ${l.amount < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(l.amount)}</td></tr>`).join('')}
          <tr><td class="pt-2 font-type text-lg">RAZEM</td><td class="pt-2 text-right font-type text-lg ${rep.total < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(rep.total)}</td></tr>
        </table>`;
    return UI.card('§', 'Bilans ostatniego tygodnia' + (rep ? ' (Tydzień ' + rep.week + ')' : ''), 'Wszystko, co wpłynęło i wypłynęło z kasetki.', body);
  },

  ticketsCard() {
    const md = gameState.matchday;
    const ticketBtns = Object.entries(DATA.tickets).map(([id, t]) => UI.choice('set-ticket', id, md.ticket === id, t.label, t.desc)).join('');
    const sausageBtns = Object.entries(DATA.sausages).map(([id, s]) =>
      UI.choice('set-sausage', id, md.sausage === id, s.label + ' – ' + s.price + ' zł', s.desc + ' Zysk: ' + (s.price - s.cost) + ' zł/szt.')).join('');

    const next = Selectors.nextHomeFixture();
    const st = gameState.seasonTickets;
    let preview = '<p class="text-sm">W tym sezonie u siebie już nie gramy.</p>';
    if (next) {
      const est = Engine.estimateAttendance(next.fixture);
      const holders = st.roundsLeft > 0 ? Math.min(st.holders, est) : 0;
      preview = `<p class="text-sm">Najbliższy mecz u siebie: <b>Kolejka ${next.kolejka} vs ${Utils.escape(next.fixture.rival)}</b>${Selectors.rival(next.fixture.rival).derby ? ' <span class="text-stamp font-bold">🔥 KOSA – podwójne zainteresowanie!</span>' : ''}.<br>
        Szacowana frekwencja przy obecnej pogodzie: <b>~${est}</b> widzów${holders ? `, w tym ${holders} karnetowiczów (nie płacą na bramce)` : ''}.</p>`;
    }
    const ticketsInfo = st.roundsLeft > 0
      ? `Karnety: ${st.holders} posiadaczy, ważne jeszcze ${st.roundsLeft} kolejek.`
      : 'Karnety: brak aktywnych.';

    return UI.card('A', 'Bilety i Budka z Kiełbaskami', 'Catering u Pana Zenka. Kasa fiskalna: zeszyt w kratkę.', `
      <div class="bg-paper-200 border border-paper-400 p-3 mb-4">${preview}<p class="text-xs text-ink-700 mt-1">${ticketsInfo}</p></div>
      <h4 class="font-type mb-2">Cena biletu</h4>
      <div class="grid gap-2 mb-5">${ticketBtns}</div>
      <h4 class="font-type mb-2">Menu w budce Pana Zenka</h4>
      <div class="grid gap-2">${sausageBtns}</div>
      <p class="text-xs text-ink-700 mt-3">☀️ W słońcu grill sprzedaje o 30% więcej, w ulewie Zenek siedzi pod parasolem i liczy straty.</p>
    `);
  },

  merchCard() {
    const m = gameState.merch;
    const rows = Object.entries(DATA.merch).map(([id, item]) => {
      const cost = item.batch * item.unitCost;
      return `
      <tr class="border-b border-dashed border-paper-400">
        <td class="py-2 pr-2"><b>${item.label}</b><br><span class="text-xs text-ink-700">hurt ${item.unitCost} zł · sprzedaż ${Engine.merchPrice(id)} zł</span></td>
        <td class="py-2 px-2 text-center font-type text-lg">${m.stock[id]}</td>
        <td class="py-2 text-right">${UI.smallBtn('order-merch', `data-item="${id}"`, '+' + item.batch + ' szt. (' + Utils.formatMoney(cost) + ')', gameState.finance.budget < cost)}</td>
      </tr>`;
    }).join('');
    const frozen = Object.keys(DATA.merch).reduce((sum, id) => sum + m.stock[id] * DATA.merch[id].unitCost, 0);
    const markupBtns = Object.entries(DATA.merchMarkups).map(([id, mk]) => UI.choice('set-markup', id, m.markup === id, mk.label, '')).join('');
    return UI.card('B', 'Sklepik Fanowski', 'Okienko w blaszaku, czynne w dni meczowe i „jak ktoś zapuka”.', `
      <table class="w-full text-sm mb-3">
        <tr class="text-xs uppercase text-ink-700"><th class="text-left">Towar</th><th>Magazyn</th><th></th></tr>
        ${rows}
      </table>
      <p class="text-xs text-ink-700 mb-4">Zamrożony kapitał w kartonach: <b>${Utils.formatMoney(frozen)}</b>. Sprzedano łącznie: ${m.soldTotal} szt. Schodzi szybciej po wygranych i w tygodnie meczów u siebie.</p>
      <h4 class="font-type mb-2">Narzut</h4>
      <div class="grid gap-2">${markupBtns}</div>
    `);
  },

  sponsorCard() {
    const s = gameState.sponsor;
    const active = Selectors.sponsor();
    let body = '';
    if (active) {
      body = `
        <div class="bg-paper-200 border-2 border-grass p-3 mb-4">
          <div class="text-xs uppercase tracking-widest text-ink-700">Umowa aktywna od Tygodnia ${s.signedWeek}</div>
          <div class="font-type text-xl">${Utils.escape(active.name)}</div>
          <p class="text-sm">Wpływ: <b>${Utils.formatMoney(active.weekly)}/tydz.</b> · ${active.clubPrefix ? 'Nazwa klubu: <b>' + Utils.escape(Selectors.clubDisplayName()) + '</b>' : 'Stadion: <b>' + Utils.escape(active.stadiumName) + '</b>'}</p>
          <p class="text-xs text-stamp mt-1">⚠️ ${Utils.escape(active.requirement)}</p>
          <div class="mt-3">${UI.smallBtn('end-sponsor', '', 'Wypowiedz umowę', false, 'stamp')}</div>
        </div>`;
    }
    const offers = Object.entries(DATA.sponsors).filter(([id]) => id !== s.active).map(([id, sp]) => {
      const burned = s.burned.includes(id);
      return `
      <div class="border-b border-dashed border-paper-400 py-3 ${burned ? 'opacity-50' : ''}">
        <div class="flex justify-between gap-3 items-start">
          <div>
            <div class="font-type text-lg">${Utils.escape(sp.name)}</div>
            <div class="text-sm"><b>${Utils.formatMoney(sp.weekly)}/tydz.</b> · ${sp.clubPrefix ? 'Dopisek do nazwy: „' + Utils.escape(sp.clubPrefix) + '”' : 'Stadion: ' + Utils.escape(sp.stadiumName)}${Engine.describeEffects(sp.signEffects)}</div>
            <div class="text-xs text-ink-700">${Utils.escape(sp.pitch)}</div>
            <div class="text-xs text-stamp">${Utils.escape(sp.requirement)}</div>
          </div>
          <div class="flex-shrink-0">${burned ? '<span class="stamp inline-block px-2 text-xs font-type">SPALONY</span>' : UI.smallBtn('sign-sponsor', `data-id="${id}"`, 'Podpisz', !!s.active)}</div>
        </div>
      </div>`;
    }).join('');
    return UI.card('C', 'Sponsor Tytularny', 'Lokalny biznes chętny, by jego logo oglądało 80 osób i dwie krowy. Jeden naraz.', `
      ${body}
      ${offers}
      <p class="text-xs text-ink-700 mt-3">Skandale w kartotece klubu: <b>${gameState.club.scandals}</b>. Kto raz zerwie umowę, ten nie wraca.</p>
    `);
  },

  loansCard() {
    const L = gameState.loans;
    const takenRows = Object.entries(DATA.lenders).map(([id, l]) => {
      const active = L.taken.find((x) => x.id === id);
      return `
      <div class="border-b border-dashed border-paper-400 py-2 flex justify-between gap-3 items-center">
        <div>
          <div class="font-bold">${Utils.escape(l.name)}</div>
          <div class="text-xs text-ink-700">${Utils.formatMoney(l.amount)} → ${l.installments} rat × ${Utils.formatMoney(l.rate)} (oddajesz ${Utils.formatMoney(l.installments * l.rate)}). ${Utils.escape(l.note)}</div>
          ${active ? `<div class="text-xs text-stamp font-bold">Spłacasz: zostało ${active.remaining} rat (${Utils.formatMoney(active.remaining * active.rate)})</div>` : ''}
        </div>
        <div class="flex-shrink-0">${UI.smallBtn('take-loan', `data-id="${id}"`, 'Pożycz', !!active)}</div>
      </div>`;
    }).join('');
    const givenRows = Object.entries(DATA.borrowers).map(([id, b]) => {
      const active = L.given.find((x) => x.id === id);
      return `
      <div class="border-b border-dashed border-paper-400 py-2 flex justify-between gap-3 items-center">
        <div>
          <div class="font-bold">${Utils.escape(b.name)}</div>
          <div class="text-xs text-ink-700">Chce ${Utils.formatMoney(b.amount)}, odda ${Utils.formatMoney(b.returns)} za ${b.weeks} tyg. ${Utils.escape(b.plea)}</div>
          ${active ? `<div class="text-xs text-grass font-bold">Pożyczone! Termin zwrotu: Tydzień ${active.dueWeek}${active.delays ? ' (przesunięty ' + active.delays + '×)' : ''}</div>` : ''}
        </div>
        <div class="flex-shrink-0">${UI.smallBtn('lend-money', `data-id="${id}"`, 'Daj', !!active || gameState.finance.budget < b.amount)}</div>
      </div>`;
    }).join('');
    return UI.card('D', 'Pożyczki Międzyklubowe', 'Chwilówki u prezesów. Umowa ustna, świadek: barman.', `
      <h4 class="font-type mb-1">Pożycz od innego prezesa</h4>
      ${takenRows}
      <h4 class="font-type mt-4 mb-1">Pożycz komuś nasze nadwyżki</h4>
      ${givenRows}
      <p class="text-xs text-ink-700 mt-3">Raty schodzą automatycznie co tydzień. Dłużnicy czasem „zapominają”…</p>
    `);
  },

  stadiumCard() {
    const st = gameState.stadium;
    const pitchColor = st.pitch >= 60 ? 'bg-grass' : st.pitch >= 30 ? 'bg-amber-glow' : 'bg-stamp';
    const upgrades = Object.entries(DATA.upgrades).map(([id, u]) => {
      const owned = st.upgrades[id];
      return `
      <div class="border-b border-dashed border-paper-400 py-2 flex justify-between gap-3 items-center">
        <div>
          <div class="font-bold">${owned ? '✅ ' : ''}${Utils.escape(u.label)} <span class="font-normal text-ink-700">– ${Utils.formatMoney(u.cost)}</span></div>
          <div class="text-xs text-ink-700">${Utils.escape(u.desc)}</div>
        </div>
        <div class="flex-shrink-0">${owned ? '<span class="text-xs font-bold text-grass">ZROBIONE</span>' : UI.smallBtn('buy-upgrade', `data-id="${id}"`, 'Kup', gameState.finance.budget < u.cost)}</div>
      </div>`;
    }).join('');
    return UI.card('E', 'Infrastruktura: ' + Utils.escape(Selectors.stadiumName()), 'Obiekt z duszą. I z kretami.', `
      <div class="mb-3">
        <div class="flex justify-between text-sm"><span>Stan murawy: <b>${Selectors.pitchLabel(st.pitch)}</b></span><span>${st.pitch}%</span></div>
        <div class="h-4 bg-paper-300 border border-ink-900 mt-1"><div class="h-full ${pitchColor} bar-stripes" style="width:${st.pitch}%"></div></div>
        <p class="text-xs text-ink-700 mt-1">Każdy mecz u siebie niszczy murawę (w deszczu mocno). Zła murawa = loteria wyników i mniej widzów.</p>
      </div>
      <ul class="text-sm list-disc pl-5 mb-4">${Selectors.facilityLabels().map((f) => `<li>${Utils.escape(f)}</li>`).join('')}</ul>
      <h4 class="font-type mb-1">Inwestycje</h4>
      ${upgrades}
    `, 'xl:col-span-2');
  },
};

/* ---------------------------------------------------------------------
   6. OBSŁUGA ZDARZEŃ – delegacja po data-action
   --------------------------------------------------------------------- */
const App = {
  // Po każdej akcji: zapis + odświeżenie widoku.
  commit() {
    Storage.save();
    UI.renderAll();
  },
};

const Actions = {
  'pick-club'(el) {
    const input = document.getElementById('club-name');
    if (input) { input.value = el.dataset.name; input.focus(); }
  },

  'start-game'() {
    const input = document.getElementById('club-name');
    const name = (input ? input.value : '').trim();
    if (!name) {
      gameState.ui.startError = 'Klub bez nazwy to jak bramka bez siatki. Wpisz coś, Prezesie!';
      const err = document.getElementById('start-error');
      if (err) err.textContent = gameState.ui.startError;
      if (input) { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); }
      return;
    }
    const existing = Storage.load();
    if (existing && existing.club.name && !confirm('W szufladzie jest zapis klubu ' + existing.club.name + '. Nowa prezesura go nadpisze. Kontynuować?')) return;
    Engine.startGame(name);
    App.commit();
    window.scrollTo(0, 0);
  },

  'load-game'() {
    const saved = Storage.load();
    if (!saved) return;
    gameState = saved;
    gameState.screen = 'game';
    UI.renderAll();
    window.scrollTo(0, 0);
  },

  'clear-save'() {
    if (confirm('Spalić teczkę z zapisem? Tego nie da się cofnąć.')) {
      Storage.clear();
      UI.renderAll();
    }
  },

  'exit-menu'() {
    Storage.save();
    gameState = createInitialState();
    UI.renderAll();
  },

  'switch-tab'(el) {
    gameState.activeTab = el.dataset.tab;
    App.commit();
  },

  'resolve-decision'(el) {
    Engine.resolveDecision(el.dataset.decision, Number(el.dataset.option));
    App.commit();
  },

  'next-week'() {
    if (Engine.nextWeek()) {
      gameState.activeTab = 'desk';
      App.commit();
    }
  },

  'set-ticket'(el)   { if (DATA.tickets[el.dataset.value]) gameState.matchday.ticket = el.dataset.value; App.commit(); },
  'set-sausage'(el)  { if (DATA.sausages[el.dataset.value]) gameState.matchday.sausage = el.dataset.value; App.commit(); },
  'set-markup'(el)   { if (DATA.merchMarkups[el.dataset.value]) gameState.merch.markup = el.dataset.value; App.commit(); },
  'order-merch'(el)  { Engine.orderMerch(el.dataset.item); App.commit(); },
  'sign-sponsor'(el) { Engine.signSponsor(el.dataset.id); App.commit(); },
  'end-sponsor'() {
    const sp = Selectors.sponsor();
    if (sp && confirm('Wypowiedzieć umowę z: ' + sp.name + '? Ten sponsor już nie wróci.')) {
      Engine.endSponsor('📝 Prezes wypowiedział umowę sponsorską z: ' + sp.name + '. Trzasnęły drzwi.');
      App.commit();
    }
  },
  'take-loan'(el)    { Engine.takeLoan(el.dataset.id); App.commit(); },
  'lend-money'(el)   { Engine.lendMoney(el.dataset.id); App.commit(); },
  'buy-upgrade'(el)  { Engine.buyUpgrade(el.dataset.id); App.commit(); },

  'reset-game'() {
    if (confirm('Na pewno rzucasz papierami? Zapis zostanie skasowany, a klub zostanie bez prezesa (znowu).')) {
      Storage.clear();
      gameState = createInitialState();
      UI.renderAll();
    }
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = Actions[el.dataset.action];
  if (handler) handler(el, e);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'club-name') Actions['start-game']();
});

/* START */
UI.renderAll();
</script>
</body>
</html>
