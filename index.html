  hireDirector(idx) {
    const d = DATA.directors[idx];
    if (!d) return;
    gameState.director.hired = { ...d };
    Engine.addLog('🧑‍💼 Nowy Dyrektor Sportowy: ' + d.name + '.', 'decision');
  },
  // Tryb automatyczny: dyrektor sam kupuje w oknie transferowym – pod potrzeby składu, styl trenera i budżet
  directorAct() {
    const dir = gameState.director;
    const t = gameState.transfer;
    if (!dir || !dir.hired || dir.mode !== 'auto' || !t.open) return;
    const lvl = dir.hired.level;
    const e = Selectors.econ();
    if (dir.windowSeason !== t.season) { dir.windowSeason = t.season; dir.windowBuys = []; dir.windowSells = []; dir.windowLoans = []; }   // ruchy tego okienka – do raportu
    dir.windowSells = dir.windowSells || []; dir.windowLoans = dir.windowLoans || [];
    const team = Selectors.teamOvr();
    const keep = (p) => p.id === gameState.star.playerId || p.legend || p.favorite || p.loan;
    const posCount = (pos) => gameState.squad.filter((x) => x.pos === pos).length;
    const minPos = { GK: 2, DEF: 5, MID: 5, FWD: 3 };
    // 1) Sprzedaż niechcianych: żądający transferu, słabi i starzy ponad potrzeby pozycji
    const sellCands = gameState.squad.filter((p) => !keep(p) && (p.demandOut || Selectors.ovr(p) <= team - 7 || (p.age >= 32 && Selectors.ovr(p) < team)))
      .sort((a, b) => (b.demandOut ? 1 : 0) - (a.demandOut ? 1 : 0) || Selectors.ovr(a) - Selectors.ovr(b));
    const sellMax = (lvl >= 3 ? 3 : lvl >= 2 ? 2 : 1) - dir.windowSells.length;
    for (const p of sellCands.slice(0, Math.max(0, sellMax))) {
      if (gameState.squad.length <= CONFIG.minSquad + 1 || (!p.demandOut && posCount(p.pos) <= minPos[p.pos])) continue;
      const price = Selectors.sellPrice(p);
      const row = { name: Selectors.playerName(p), pos: DATA.positions[p.pos].label, ovr: Selectors.ovr(p), fee: price, why: p.demandOut ? 'żądał transferu' : p.age >= 32 ? 'wiek' : 'za słaby' };
      Engine.sellTransfer(p.id);
      dir.windowSells.push(row);
    }
    // 2) Wypożyczenia młodych bez szans na grę – ograją się gdzie indziej
    const loanCands = gameState.squad.filter((p) => !keep(p) && p.age <= 21 && Selectors.potential(p) > p.skill && Selectors.ovr(p) <= team - 4);
    for (const p of loanCands.slice(0, Math.max(0, (lvl >= 2 ? 2 : 1) - dir.windowLoans.length))) {
      if (gameState.squad.length <= CONFIG.minSquad + 1 || posCount(p.pos) <= minPos[p.pos]) continue;
      const fee = Selectors.loanOutFee(p);
      Engine.loanOut(p.id);
      const l = gameState.loansOut[gameState.loansOut.length - 1];
      dir.windowLoans.push({ name: Selectors.playerName(p), pos: DATA.positions[p.pos].label, ovr: Selectors.ovr(p), fee, club: l && l.player.id === p.id ? l.club : '' });
    }
    // 3) Utalentowani juniorzy bez miejsca w kadrze – na wypożyczenie, żeby grali i rośli
    const u = gameState.u19;
    if (u) {
      const done = dir.windowLoans.filter((x) => x.junior).length;
      const jMax = (lvl >= 3 ? 3 : lvl >= 2 ? 2 : 1) - done;
      u.squad.filter((p) => p.age >= 17 && p.age < 19 && (p.talent || Selectors.potentialStars(p) >= 3))
        .sort((a, b) => Selectors.potential(b) - Selectors.potential(a)).slice(0, Math.max(0, jMax)).forEach((p) => {
          if (u.squad.length <= 11) return;   // juniorzy muszą mieć z kim grać
          const club = Engine.otherClubName(Math.random() < 0.5 ? 0 : -1);
          u.squad = u.squad.filter((x) => x.id !== p.id);
          delete p.watch; delete p.watchClub;   // na wypożyczeniu nikt go nie podkradnie
          gameState.u19Loans = (gameState.u19Loans || []).concat([{ player: p, club, until: t.season }]);
          dir.windowLoans.push({ name: Selectors.playerName(p), pos: DATA.positions[p.pos].label + ' · U19', ovr: Selectors.ovr(p), fee: 0, club, junior: true });
          Engine.addLog('📤 Dyrektor wypożycza juniora ' + Selectors.playerName(p) + ' (' + p.age + ' l.) do ' + club + ' – sezon regularnej gry w seniorach.', 'decision');
        });
    }
    if (Selectors.transferBanned()) { dir.log = ['Ban transferowy – tylko sprzedaż i wypożyczenia.'].concat(dir.log || []).slice(0, 4); return; }
    let budget = Math.max(0, gameState.finance.budget - 500 * e) * (0.3 + lvl * 0.07);
    const need = { GK: 2, DEF: 6, MID: 6, FWD: 4 };
    gameState.squad.forEach((p) => { need[p.pos]--; });
    const style = Selectors.coach().style;
    const bought = [];
    for (let k = 0; k < (lvl >= 2 ? 3 : 2); k++) {
      if (gameState.squad.length >= CONFIG.maxSquad) break;
      const pool = t.market.filter((p) => p.fee <= budget && p.fee <= gameState.finance.budget);
      if (!pool.length) break;
      const score = (p) => Selectors.ovr(p) + (need[p.pos] > 0 ? 8 : -4) + Engine.profileFit(p, style) * 4 - p.fee / (60 * e) + (p.age <= 23 ? 2 : 0) + Utils.randRange(-1, 1) * (4 - lvl) * 4;
      const best = pool.sort((a, b) => score(b) - score(a))[0];
      if (Selectors.ovr(best) < Selectors.teamOvr() - 6 && need[best.pos] <= 0) break;   // nie kupuje zapchajdziur
      const fee = best.fee;
      Engine.buyTransfer(best.id);
      dir.windowBuys = (dir.windowBuys || []).concat([{ name: Selectors.playerName(best), pos: DATA.positions[best.pos].label, ovr: Selectors.ovr(best), fee, wage: best.wage }]);
      budget -= fee; need[best.pos]--;
      bought.push(Selectors.playerName(best) + ' (' + DATA.positions[best.pos].label.toLowerCase() + ', OVR ' + Selectors.ovr(best) + ', ' + Utils.formatMoney(fee) + ')');
    }
    const moves = dir.windowSells.length + dir.windowLoans.length;
    const msg = (bought.length ? 'Kupił: ' + bought.join('; ') : 'Nie znalazł nikogo wartego tych pieniędzy do kupienia.') + (moves ? ' Sprzedał: ' + dir.windowSells.length + ', wypożyczył: ' + dir.windowLoans.length + '.' : '');
    dir.log = [msg].concat(dir.log || []).slice(0, 4);
    t.news = ['🧑‍💼 Dyrektor: ' + msg].concat(t.news || []).slice(0, 4);
    Engine.alert('🧑‍💼', 'Dyrektor Sportowy w oknie transferowym', msg, bought.length ? 'good' : 'info');
  },

  /* ----- Puchar Polski ----- */
  cupSetup() {
    const lvl = gameState.club.leagueLevel;
    const start = lvl <= 3 ? 0 : lvl <= 5 ? 2 : 3;   // niżej – od rund okręgowych, Ekstraklasa od 1/16
    gameState.cup = { season: gameState.calendar.season, idx: start, start, alive: true, won: false, history: [], earned: 0 };
    Engine.cupDraw();
  },
  // Losowanie rywala na najbliższą rundę – od razu trafia do terminarza
  cupDraw() {
    const c = gameState.cup;
    const R = c && DATA.cupRounds[c.idx];
    if (!R || !c.alive) { if (c) c.next = null; return null; }
    const lvl = gameState.club.leagueLevel;
    const oppLvl = Utils.clamp(Utils.randInt(Math.max(R.opp[0], lvl - 2), Math.min(R.opp[1], Math.max(R.opp[0], lvl + 2))), 1, 8);
    const L = DATA.leagueLevels[oppLvl];
    const opp = L.pool ? Utils.rand(L.pool.filter((n) => !gameState.league.rivals.some((r) => r.name === n)).concat(L.pool).slice(0, 30)) : Utils.rand(DATA.rivals).name;
    const final = c.idx === DATA.cupRounds.length - 1;
    c.next = { idx: c.idx, opp, oppLvl, oppS: Math.round(L.rivalBase * Utils.randRange(0.9, 1.1) * 100) / 100, final, home: !final && (oppLvl > lvl ? false : Math.random() < 0.5) };
    return c.next;
  },
  cupWeek(kolejka) {
    const c = gameState.cup;
    if (!c || !c.alive || c.season !== gameState.calendar.season) return;
    const R = DATA.cupRounds[c.idx];
    if (!R || Selectors.euroKolejka(R.k) !== kolejka) return;
    const lvl = gameState.club.leagueLevel;
    const nx = c.next && c.next.idx === c.idx ? c.next : Engine.cupDraw();   // rywal wylosowany wcześniej – widoczny w terminarzu
    const { opp, oppLvl, oppS, final, home } = nx;
    gameState.midweekWeek = gameState.calendar.week;   // zmęczenie po meczu w środku tygodnia
    const m = Engine.playMatchday({ opp, oppS, home: final ? false : home, neutral: final, hype: 1.1 + c.idx * 0.12, round: R.label, oppLeague: DATA.leagueLevels[oppLvl].name });
    gameState.cupMatch = m;
    let won = m.gf > m.ga, pens = '';
    if (m.gf === m.ga) { const pen = Engine.penalties(oppS); won = pen.won; pens = pen.score; }
    const e = Selectors.econ();
    const box = { header: '🏆 Puchar Polski', title: R.label + ' · ' + DATA.leagueLevels[oppLvl].name, round: R.label, oppLeague: DATA.leagueLevels[oppLvl].name, final,
      legs: [{ label: final ? 'Finał' : 'Mecz', opp, home: final ? true : home, neutral: final, gf: m.gf, ga: m.ga, pens, goals: m.goals, cards: m.cards, att: m.att, income: m.income, tactic: m.tactic }], verdict: '', money: 0 };
    c.history.unshift(R.label + ': ' + opp + ' ' + m.gf + ':' + m.ga + (pens ? ' (k. ' + pens + ')' : '') + (won ? ' ✅' : ' ❌'));
    if (won) {
      const prize = Math.round(300 * e * (1 + c.idx * 0.6));
      Engine.money('Puchar Polski: premia za ' + R.label, prize);
      m.money.push({ label: 'Premia PP za awans', amount: prize });
      c.earned += prize; box.money += prize;
      Engine.applyEffects({ fans: final ? +15 : +2 });
      if (final) {
        c.alive = false; c.won = true; c.next = null;
        Engine.addTrophy('🏆', 'Puchar Polski', 'pp');
        box.verdict = '🏆 PUCHAR POLSKI W GABLOCIE!';
        Engine.alert('🏆', 'PUCHAR POLSKI!', Selectors.clubDisplayName() + ' zdobywa Puchar Polski! Trofeum trafia do gablotki.' + (lvl === 8 ? ' Do tego eliminacje Ligi Europy.' : ''), 'good', true);
        Engine.xPost('portal', 'SENSACJA NA NARODOWYM! ' + Selectors.clubDisplayName() + ' z Pucharem Polski! 🏆');
      } else {
        c.idx++;
        const d = Engine.cupDraw();
        box.verdict = '✅ Awans! Dalej: ' + DATA.cupRounds[c.idx].label + (d ? ' – ' + d.opp : '');
      }
    } else {
      c.alive = false;
      c.next = null;
      box.verdict = '❌ Odpadamy z Pucharu Polski (' + R.label + ').';
    }
    m.cupInfo.verdict = box.verdict;
    m.cupInfo.pens = pens;
    m.cupInfo.won = won;
    gameState.cupReport = null;
  },
  addTrophy(icon, name, kind, lvl) {
    if (!gameState.trophies) gameState.trophies = [];
    gameState.trophies.push({ icon, name, season: gameState.calendar.season, league: Selectors.leagueName(), kind: kind || null, lvl: lvl || gameState.club.leagueLevel });
  },

  /* ----- Europejskie puchary ----- */
  euroSetup(q) {
    const C = DATA.euro.comps[q.comp];
    gameState.euro = { season: gameState.calendar.season, comp: q.comp, origin: q.comp, path: q.path, stage: q.comp === 'UEL' ? 'Q3' : 'Q2',
      lp: null, done: false, result: '', earned: 0, history: [], venue: 'home', asked: [] };
    gameState.stats.euroSeasons = (gameState.stats.euroSeasons || 0) + 1;
    Engine.addLog('🇪🇺 Sezon w Europie: ' + C.name + ' – start od etapu „' + DATA.euro.stages[gameState.euro.stage].label + '”.', 'system');
  },
  euroOpponent(stage) {
    const eu = gameState.euro;
    const s = Math.round((DATA.euro.comps[eu.comp].base + DATA.euro.stages[stage].add + Utils.randRange(-0.15, 0.15)) * 100) / 100;
    const tier = s < 2.6 ? 0 : s < 2.95 ? 1 : s < 3.35 ? 2 : 3;
    const used = eu.history.map((x) => x.opp);
    const pool = DATA.euro.clubs[tier].filter((n) => !used.includes(n));
    return { name: Utils.rand(pool.length ? pool : DATA.euro.clubs[tier]), s };
  },
  euroMatch(opp, home, neutral) {
    const eu = gameState.euro;
    const lineup = Engine.pickLineup([]);
    const ourS = Engine.teamStrength(lineup, Engine.chemistry(lineup));
    const ratio = ourS / opp.s;
    const adv = neutral ? 1 : home ? (eu.venue === 'narodowy' ? 1.04 : 1.12) : 1 / 1.1;
    const gf = Utils.poisson(Math.max(0.12, 1.15 * Math.pow(ratio, 1.4) * adv));
    const ga = Utils.poisson(Math.max(0.12, 1.15 * Math.pow(1 / ratio, 1.4) / adv));
    lineup.forEach((p) => { p.euroApps = (p.euroApps || 0) + 1; p.euroSeasonApps = (p.euroSeasonApps || 0) + 1; });
    const scorers = [];
    for (let i = 0; i < gf; i++) {
      const sc = Utils.weightedPick(lineup, (p) => ({ GK: 0.05, DEF: 0.7, MID: 2.5, FWD: 5 }[p.pos]) * p.skill);
      if (sc) { sc.euroGoals = (sc.euroGoals || 0) + 1; scorers.push(sc.last); }
    }
    if (home && !neutral) {
      const seats = eu.venue === 'narodowy' ? 25000 : Selectors.stadiumCapacity();
      const gate = Math.round(seats * Utils.randRange(0.85, 1) * DATA.tickets[gameState.matchday.ticket].price * 2);   // europejskie ceny biletów
      Engine.euroMoney('Bilety: mecz europejski', gate);
      if (eu.venue === 'narodowy') Engine.euroMoney('Wynajem Stadionu Narodowego', -Math.round(2000 * Selectors.econ()));
    }
    return { gf, ga, scorers };
  },
  euroMoney(label, amount) {
    if (!amount) return;
    Engine.money(label, amount);
    if (amount > 0) gameState.euro.earned += amount;
    if (gameState.lastMatch && gameState.lastMatch.euro) gameState.lastMatch.euro.money += amount;
  },
  // Wywoływane w każdej kolejce ligowej: jeśli w tym tygodniu jest europejski wieczór – gramy
  euroWeek(kolejka) {
    const eu = gameState.euro;
    if (!Selectors.euroLive()) return;
    const st = DATA.euro.stages[eu.stage];
    const C = DATA.euro.comps[eu.comp];
    const e = Selectors.econ();
    let due = false;
    if (eu.stage === 'LP') due = eu.lp && Selectors.euroKolejka(st.kolejki[eu.lp.played]) === kolejka;
    else due = Selectors.euroKolejka(st.kolejka) === kolejka;
    if (!due) return;
    const box = { title: C.icon + ' ' + C.name + ' · ' + st.label, legs: [], verdict: '', money: 0 };
    gameState.midweekWeek = gameState.calendar.week;
    if (gameState.lastMatch) gameState.lastMatch.euro = box;
    Engine.applyEffects({ fans: +2 });
    const opp = Engine.euroOpponent(eu.stage);
    const stageBefore = eu.stage;
    if (eu.stage === 'LP') {
      const lp = eu.lp;
      const home = lp.played % 2 === 0;
      const m = Engine.euroMatch(opp, home, false);
      lp.played++; lp.gf += m.gf; lp.ga += m.ga;
      const res = m.gf > m.ga ? 'W' : m.gf === m.ga ? 'D' : 'L';
      lp.pts += { W: 3, D: 1, L: 0 }[res];
      box.legs.push({ label: lp.played + '. kolejka', opp: opp.name, home, gf: m.gf, ga: m.ga, scorers: m.scorers });
      Engine.euroMoney('Premia UEFA za wynik', Math.round({ W: 6000, D: 2000, L: 0 }[res] * C.mult * e));
      eu.history.unshift({ stage: 'LP', opp: opp.name, text: C.short + ' · ' + lp.played + '. kolejka fazy ligowej: ' + (home ? 'dom' : 'wyjazd') + ' ' + m.gf + ':' + m.ga + ' z ' + opp.name });
      box.verdict = 'Faza ligowa: ' + lp.pts + ' pkt po ' + lp.played + ' meczach';
      if (lp.played >= C.lpGames) {
        const rank = Utils.clamp(Math.round(36 - lp.pts * (C.lpGames === 6 ? 3 : 2.2) + Utils.randInt(-2, 2)), 1, 36);
        lp.rank = rank;
        if (rank <= 8) Engine.euroAdvance('R16', 'Faza ligowa: ' + rank + '. miejsce – prosto do 1/8 finału!');
        else if (rank <= 24) Engine.euroAdvance('KPO', 'Faza ligowa: ' + rank + '. miejsce – baraż o 1/8 finału.');
        else Engine.euroOut(rank + '. miejsce w fazie ligowej – koniec przygody z Europą.');
        box.verdict = eu.done ? eu.result : 'Faza ligowa zakończona: ' + rank + '. miejsce (' + lp.pts + ' pkt)';
      }
    } else if (st.tie) {
      const a = Engine.euroMatch(opp, false, false), b = Engine.euroMatch(opp, true, false);
      box.legs.push({ label: '1. mecz', opp: opp.name, home: false, gf: a.gf, ga: a.ga, scorers: a.scorers }, { label: 'Rewanż', opp: opp.name, home: true, gf: b.gf, ga: b.ga, scorers: b.scorers });
      const gf = a.gf + b.gf, ga = a.ga + b.ga;
      let won = gf > ga;
      let pens = '';
      if (gf === ga) { const pen = Engine.penalties(opp.s); won = pen.won; pens = pen.score; }
      box.agg = gf + ':' + ga + (pens ? ', karne ' + pens : '');
      if (['Q2', 'Q3', 'PO'].includes(eu.stage)) Engine.euroMoney('Premia UEFA: ' + st.label, Math.round(C.qualFee * e));
      eu.history.unshift({ stage: eu.stage, opp: opp.name, text: C.short + ' · ' + st.label + ': ' + opp.name + ' ' + box.agg + (won ? ' ✅' : ' ❌') });
      Engine.euroTieResult(won);
      box.verdict = eu.done ? eu.result : (won ? '✅ Awans! Dalej: ' : '↘️ Odpadamy, ale gramy dalej: ') + DATA.euro.comps[eu.comp].name + ' · ' + DATA.euro.stages[eu.stage].label;
    } else {
      // Finał: jeden mecz na neutralnym stadionie
      const m = Engine.euroMatch(opp, false, true);
      let won = m.gf > m.ga, pens = '';
      if (m.gf === m.ga) { const pen = Engine.penalties(opp.s); won = pen.won; pens = pen.score; }
      box.legs.push({ label: 'Finał · neutralny stadion', opp: opp.name, home: true, gf: m.gf, ga: m.ga, pens, scorers: m.scorers });
      eu.history.unshift({ stage: 'F', opp: opp.name, text: C.short + ' · FINAŁ: ' + opp.name + ' ' + m.gf + ':' + m.ga + (pens ? ' (k. ' + pens + ')' : '') + (won ? ' 🏆' : '') });
      if (won) {
        eu.done = true;
        eu.result = '🏆 ZDOBYWCA PUCHARU: ' + C.name + '!';
        gameState.stats.euroTrophies = (gameState.stats.euroTrophies || 0) + 1;
        Engine.euroMoney('Premia UEFA za zwycięstwo w finale', Math.round(60000 * C.mult * e));
        Engine.applyEffects({ fans: +25, lockerRoom: +15 });
        Engine.addLog('🏆🏆🏆 ' + Selectors.clubDisplayName() + ' WYGRYWA ' + C.name.toUpperCase() + '! Od remizy do europejskiego tronu! [kibice +25%, szatnia +15%]', 'system');
        Engine.xPost('portal', 'NIEPRAWDOPODOBNE! ' + Selectors.clubDisplayName() + ' z pucharem ' + C.name + '! Pan Heniek kosi boisko w kształcie pucharu. 🏆🇪🇺');
      } else {
        eu.done = true;
        eu.result = '🥈 Finał ' + C.name + ' – przegrany, ale co za sezon!';
        Engine.applyEffects({ fans: +10 });
      }
      box.verdict = eu.result;
    }
    if (eu.stage !== stageBefore || eu.done) Engine.euroBest();
    // Europejskie wieczory rodzą unikalne historie
    if (!gameState.pendingDecisions.some((id) => DATA.decisions[id].cutscene)) Engine.maybeEuroCutscene(stageBefore === 'Q2' || (stageBefore === 'Q3' && eu.origin === 'UEL'));
  },
  euroTieResult(won) {
    const eu = gameState.euro;
    const idx = DATA.euro.order.indexOf(eu.stage);
    const next = DATA.euro.order[idx + 1];
    if (won) {
      if (eu.stage === 'SF') return Engine.euroAdvance('F', '');
      if (eu.stage === 'PO') return Engine.euroAdvance('LP', '');
      return Engine.euroAdvance(next, '');
    }
    // Przegrana w eliminacjach: spadek do niższego pucharu (gwarancje jak w prawdziwym systemie UEFA)
    const lower = DATA.euro.comps[eu.comp].lower;
    if (['Q2', 'Q3', 'PO'].includes(eu.stage) && lower) {
      const C = DATA.euro.comps[lower];
      const from = DATA.euro.comps[eu.comp].name;
      eu.comp = lower;
      Engine.addLog('↘️ Odpadamy z eliminacji: ' + from + ', ale zostajemy w Europie: ' + C.name + '.', 'system');
      return Engine.euroAdvance(next, '');
    }
    Engine.euroOut('Odpadamy: ' + DATA.euro.stages[eu.stage].label + '.');
  },
  euroAdvance(stage, note) {
    const eu = gameState.euro;
    const C = DATA.euro.comps[eu.comp];
    const e = Selectors.econ();
    eu.stage = stage;
    if (stage === 'LP') {
      eu.lp = { played: 0, pts: 0, gf: 0, ga: 0, rank: null };
      Engine.euroMoney('Premia UEFA: awans do fazy ligowej ' + C.name, Math.round(C.lpFee * e));
      Engine.applyEffects({ fans: +8 });
      Engine.addLog('🇪🇺 FAZA LIGOWA ' + C.name.toUpperCase() + '! Hymn, gwiazdy i premia ' + Utils.formatMoney(Math.round(C.lpFee * e)) + '. [kibice +8%]', 'system');
      Engine.xPost('portal', Selectors.clubDisplayName() + ' w fazie ligowej ' + C.name + '! Gmina zamawia autokary do Europy. 🇪🇺');
    } else if (DATA.euro.stages[stage].reach) {
      Engine.euroMoney('Premia UEFA: ' + DATA.euro.stages[stage].label, Math.round(DATA.euro.stages[stage].reach * C.mult * e));
      Engine.applyEffects({ fans: +4 });
    }
    if (note) Engine.addLog('🇪🇺 ' + note, 'system');
  },
  euroOut(text) {
    const eu = gameState.euro;
    eu.done = true;
    eu.result = text;
    Engine.addLog('🇪🇺 ' + text + ' Zarobione w Europie: ' + Utils.formatMoney(eu.earned) + '.', 'system');
  },
  euroBest() {
    const eu = gameState.euro;
    const C = DATA.euro.comps[eu.comp];
    const label = eu.result && eu.result.startsWith('🏆') ? 'Puchar ' + C.short : C.short + ': ' + DATA.euro.stages[eu.stage].label;
    const score = (c, s) => ({ UCL: 30, UEL: 20, UECL: 10 }[c] + DATA.euro.order.indexOf(s));
    const prev = gameState.stats.euroBestScore || 0;
    const now = score(eu.comp, eu.stage) + (eu.result && eu.result.startsWith('🏆') ? 5 : 0);
    if (now > prev) { gameState.stats.euroBestScore = now; gameState.stats.euroBest = label; }
  },
  maybeEuroCutscene(first) {
    const eu = gameState.euro;
    const pool = Object.keys(DATA.decisions).filter((id) => { const d = DATA.decisions[id]; return d.euro && !eu.asked.includes(id) && (!d.available || d.available()); });
    if (!pool.length) return;
    const forced = first && pool.includes('cutEuroStadium') ? 'cutEuroStadium' : null;
    if (!forced && Math.random() > 0.45) return;
    const id = forced || Utils.rand(pool);
    if (DATA.decisions[id].prepare) DATA.decisions[id].prepare();
    eu.asked.push(id);
    Engine.pushDecision(id);
  },

  /* ----- Baraże po sezonie ----- */
  // Jeden mecz barażowy: nasza siła vs rywal, gospodarz z przewagą własnego boiska
  playoffMatch(oppS, home) {
    const lineup = Engine.pickLineup([]);
    const ourS = Engine.teamStrength(lineup, Engine.chemistry(lineup));
    const ratio = ourS / oppS;
    const adv = home ? 1.12 : 1 / 1.08;
    return { gf: Utils.poisson(Math.max(0.15, 1.2 * Math.pow(ratio, 1.3) * adv)), ga: Utils.poisson(Math.max(0.15, 1.2 * Math.pow(1 / ratio, 1.3) / adv)) };
  },
  // Mecz pucharowy/barażowy z pełnym raportem: strzelcy, asysty, kartki, frekwencja i zysk z bramki
  detailMatch(oppS, home, opts = {}) {
    const neutral = !!opts.neutral;
    const coach = Selectors.coach();
    const style = DATA.styles[coach.style];
    const lineup = Engine.pickLineup([]);
    const chem = Engine.chemistry(lineup);
    const ratio = Engine.teamStrength(lineup, chem) / oppS;   // forma i siła składu jak w lidze
    const adv = neutral ? 1 : home ? 1.12 : 1 / 1.08;
    let ourL = 1.2 * Math.pow(ratio, 1.3) * style.tempo * adv, oppL = 1.2 * Math.pow(1 / ratio, 1.3) * style.tempo / adv;
    if (coach.style === 'off') { ourL *= ratio > 1.05 ? 1.18 : 1.05; oppL *= 1.1; }   // taktyka trenera
    else if (coach.style === 'def') { oppL *= ratio < 0.95 ? 0.72 : 0.85; ourL *= 0.85; }
    else if (chem >= 60) { ourL *= 1.04; oppL *= 0.96; }
    if (chem < 50) oppL *= 1 + (50 - chem) / 120;
    const rawCards = Engine.rollCards(lineup, !!opts.derby);
    const ourReds = rawCards.filter((c) => c.us && c.card === 'R').length, theirReds = rawCards.filter((c) => !c.us && c.card === 'R').length;
    if (ourReds) { ourL *= Math.pow(0.82, ourReds); oppL *= Math.pow(1.15, ourReds); }
    if (theirReds) { ourL *= Math.pow(1.15, theirReds); oppL *= Math.pow(0.85, theirReds); }
    if (lineup.some((p) => p.ace)) ourL += 0.7;
    const m = { gf: Utils.poisson(Math.max(0.15, ourL)), ga: Utils.poisson(Math.max(0.15, oppL)) };
    lineup.forEach((p) => { p.cupApps = (p.cupApps || 0) + 1; });
    const nm = (p) => Selectors.shortName(p);
    const goals = [];
    for (let i = 0; i < m.gf; i++) {
      const sc = Utils.weightedPick(lineup, (p) => ({ GK: 0.05, DEF: 0.7, MID: 2.5, FWD: 5 }[p.pos]) * p.skill * (p.ace ? 2 : 1));
      if (!sc) continue;
      sc.goals++; sc.cupGoals = (sc.cupGoals || 0) + 1;
      let as = null;
      if (Math.random() < 0.75) {
        const mates = lineup.filter((x) => x !== sc), ace = mates.find((p) => p.ace);
        as = ace && Math.random() < 0.55 ? ace : Utils.weightedPick(mates, (p) => ({ GK: 0.1, DEF: 1.2, MID: 4, FWD: 2.5 }[p.pos]) * p.skill);
        if (as) as.assists = (as.assists || 0) + 1;
      }
      goals.push({ min: Utils.randInt(2, 90), us: true, s: nm(sc), a: as ? as.last : null });
    }
    for (let i = 0; i < m.ga; i++) goals.push({ min: Utils.randInt(2, 90), us: false });
    goals.sort((a, b) => a.min - b.min);
    const cards = rawCards.filter((c) => c.us).map((c) => ({ card: c.card, min: c.min, name: c.p ? Selectors.shortName(c.p) + (c.name.includes('2. żółta') ? ' (2. żółta)' : '') : c.name }));
    const e = Selectors.econ();
    const ticket = DATA.tickets[gameState.matchday.ticket];
    const hype = opts.hype || 1.2;
    let att, income = 0;
    if (neutral) {
      att = Math.round(Selectors.stadiumCapacity() * Utils.randRange(0.9, 1.6) * hype);
      income = Math.round(att * ticket.price * 0.3);   // udział w zysku z neutralnego stadionu
    } else if (home) {
      att = Math.max(20, Math.min(Selectors.stadiumCapacity(), Math.round((25 + gameState.morale.fans * 1.1) * e * Selectors.upgradeProd('attendance') * ticket.attendance * hype * Utils.randRange(0.9, 1.1))));
      income = att * ticket.price;
    } else att = Math.round(Selectors.stadiumCapacity() * Utils.randRange(0.6, 1.3) * hype);
    if (income) Engine.money(opts.moneyLabel || 'Bilety: mecz pucharowy', income);
    return { gf: m.gf, ga: m.ga, goals, cards, att, income, tactic: style.label + ' · zgranie ' + chem + '%', scorers: goals.filter((g) => g.us).map((g) => g.s.split('” ')[1] || g.s) };
  },
  // Rzuty karne: lekko faworyzują lepszą drużynę i dobrego bramkarza
  penalties(oppS) {
    const lineup = Engine.pickLineup([]);
    const ourS = Engine.teamStrength(lineup, Engine.chemistry(lineup));
    const gk = lineup.find((p) => p.pos === 'GK');
    const won = Math.random() < Utils.clamp(0.5 + (ourS - oppS) * 0.15 + (gk ? (gk.skill - 6) * 0.01 : 0), 0.3, 0.7);
    const a = Utils.randInt(3, 5);
    return { won, score: won ? a + ':' + (a - 1) : (a - 1) + ':' + a };
  },
  playPlayoff(kind, pos) {
    const level = gameState.club.leagueLevel;
    const r = Selectors.leagueRules();
    const st = gameState.season.strength;
    const table = Selectors.standings();
    const res = { kind, legs: [], won: false };
    const leg = (label, opp, home, m, neutral) => ({ label, opp, home, neutral: !!neutral, gf: m.gf, ga: m.ga, goals: m.goals, cards: m.cards, att: m.att, income: m.income });
    const twoLegs = (opp, oppS) => {
      const a = Engine.detailMatch(oppS, false, { hype: 1.4 }), b = Engine.detailMatch(oppS, true, { hype: 1.5, moneyLabel: 'Bilety: baraż' });
      res.legs.push(leg('1. mecz', opp, false, a), leg('Rewanż', opp, true, b));
      const gf = a.gf + b.gf, ga = a.ga + b.ga;
      res.agg = gf + ':' + ga;
      if (gf !== ga) return gf > ga;
      const pen = Engine.penalties(oppS);
      res.pens = pen.score;
      return pen.won;
    };
    const single = (label, opp, oppS, home, neutral) => {
      const m = Engine.detailMatch(oppS, home, { neutral, hype: 1.6, moneyLabel: 'Bilety: baraż' });
      const l = leg(label, opp, home, m, neutral);
      res.legs.push(l);
      if (m.gf !== m.ga) return m.gf > m.ga;
      const pen = Engine.penalties(oppS);
      l.pens = pen.score;
      return pen.won;
    };
    if (kind === 'up' && r.upPO.length > 1) {
      // Play-off: półfinał (3–6, 4–5) i finał – gospodarzem wyżej sklasyfikowany
      res.title = 'Baraże o awans · play-off';
      const [a, b, c, d] = r.upPO;
      const rival = pos === a ? d : pos === d ? a : pos === b ? c : b;
      const opp = table[rival - 1].team;
      if (!single('Półfinał', opp, st[opp] || 2, pos < rival)) { res.won = false; return res; }
      const other = (pos === a || pos === d) ? [b, c] : [a, d];
      const o1 = table[other[0] - 1].team, o2 = table[other[1] - 1].team;
      const s1 = st[o1] || 2, s2 = st[o2] || 2;
      const fin = Math.random() < (s1 * 1.1) / (s1 * 1.1 + s2) ? other[0] : other[1];
      const finOpp = fin === other[0] ? o1 : o2;
      res.won = single('Finał', finOpp, st[finOpp] || 2, pos < fin);
      return res;
    }
    if (kind === 'up') {
      // Baraż wicemistrzów: rywal to wicelider równoległej grupy TEJ SAMEJ klasy rozgrywkowej
      const L = DATA.leagueLevels[level];
      const U = DATA.leagueLevels[level + 1];
      const ours = new Set(table.map((r) => r.team));
      const pool = (L.pool || DATA.rivals.map((x) => x.name)).filter((n) => !ours.has(n));
      const opp = Utils.rand(pool.length ? pool : DATA.rivals.map((x) => x.name)) + ' (gr. ' + (Math.random() < 0.5 ? 'II' : 'III') + ')';
      const top = table.slice(0, 3).filter((r) => r.team !== table[pos - 1].team).map((r) => st[r.team] || L.rivalBase);
      const oppS = (top.reduce((a, b) => a + b, 0) / Math.max(1, top.length)) * Utils.randRange(0.93, 1.05);
      res.title = 'Baraż wicemistrzów ' + L.name + ' o ' + U.name;
      res.won = level <= 2 ? single('Mecz o awans · boisko neutralne', opp, oppS, true, true) : twoLegs(opp, oppS);   // niżej jeden mecz, wyżej dwumecz
      return res;
    }
    // Baraż o utrzymanie: dwumecz z wiceliderem ligi niżej
    const D = DATA.leagueLevels[level - 1];
    const opp = D.pool ? Utils.rand(D.pool) : Utils.rand(DATA.rivals).name;
    res.title = 'Baraż o utrzymanie';
    res.won = twoLegs(opp, D.rivalBase * Utils.randRange(1.08, 1.18));
    return res;
  },

  /* ----- Liga: nowi rywale po awansie/spadku ----- */
  buildLeague(level) {
    const L = DATA.leagueLevels[level];
    gameState.league.rivals = level === 1
      ? DATA.rivals.map((r) => ({ ...r }))
      : Utils.shuffle(L.pool).slice(0, (L.teams || 10) - 1).map((name, i) => ({
        name, derby: i < 2,
        strength: Math.round((L.rivalBase + Utils.randRange(-0.25, 0.25)) * 100) / 100,
      }));
    gameState.season.strength = {};
  },

  checkLicense(level) {
    const missing = Selectors.licenseMissing(level, true);   // licencję trenera rozstrzyga osobna decyzja po awansie
    const name = DATA.leagueLevels[level].name;
    if (!missing.length) {
      Engine.addLog('📋 Licencja na ' + name + ' przyznana bez uwag. Inspektor ze Związku nawet zjadł kiełbaskę.', 'system');
      return;
    }
    const fine = Math.round(300 * DATA.leagueLevels[level].econ);
    Engine.money('Kara licencyjna (warunkowa licencja)', -fine);
    Engine.addLog('📋 WARUNKOWA LICENCJA na ' + name + '! Związek: brak – ' + missing.join(', ') + '. Kara ' + Utils.formatMoney(fine) + ' i nakaz budowy do końca sezonu (inaczej kolejna kara).', 'system');
  },

  /* ----- Długi: odsetki, strajk, komornik, walne zebranie ----- */
  debtCheck() {
    const b = gameState.finance.budget;
    const t = Selectors.debtThresholds();
    const d = gameState.debt;
    d.strike = b < t.warn;
    if (d.strike) {
      const interest = Math.round(-b * 0.03);
      Engine.money('Odsetki karne – Bank Spółdzielczy', -interest);
      Engine.applyEffects({ lockerRoom: -3 });
      Engine.addLog('💸 Odsetki karne z Banku Spółdzielczego: ' + Utils.formatMoney(interest) + '. W szatni strajk: „Nie ma na paliwo, nie ma gry”. [szatnia -3%, słabsza gra]', 'event');
    }
    const ratio = Selectors.debtRatio();
    if (ratio > CONFIG.debtBailiffRatio) {   // egzekucja: dług ponad siły klubu względem jego przychodów
      const fee = Math.round(-gameState.finance.budget * 0.04);
      Engine.money('Koszty egzekucji komorniczej', -fee);
      const owned = Object.keys(gameState.stadium.upgrades).filter((k) => gameState.stadium.upgrades[k]);
      if (owned.length && Math.random() < 0.35) {
        const id = Utils.rand(owned);
        const u = DATA.upgrades[id];
        gameState.stadium.upgrades[id] = false;
        Engine.money('Licytacja komornicza: ' + u.label, Math.round(u.cost * 0.3));
        if (id === 'boiler') Engine.applyEffects({ lockerRoom: -8 });
        Engine.addLog('⚖️ KOMORNIK NA OBIEKCIE! Zlicytował „' + u.label + '” za 30% wartości. Pan Heniek patrzył przez płot i płakał.', 'event');
        Engine.xPost('portal', 'Komornik na stadionie ' + Selectors.clubDisplayName() + '! Na licytacji poszło: ' + u.label + '. Kupił… prezes rywala. 🔨');
      } else {
        Engine.addLog('⚖️ KOMORNIK NA OBIEKCIE! Zajął utarg z bramki i sklepiku na poczet długu, opisał kosiarkę i nalicza koszty egzekucji (' + Utils.formatMoney(fee) + ').', 'event');
      }
    }
    if (Selectors.debtRatio() > CONFIG.debtBankruptRatio) {
      d.deepWeeks++;
      const left = CONFIG.debtGameOverWeeks - d.deepWeeks;
      if (left > 0) {
        Engine.addLog('☠️ GROŹBA UPADŁOŚCI! Dług (' + Utils.formatMoney(Selectors.debtHole()) + ') to ponad ' + CONFIG.debtBankruptRatio + ' tygodni wszystkich przychodów klubu. Jeśli nie zejdziemy poniżej w ' + left + ' tyg., sąd ogłosi bankructwo!', 'event');
        Engine.alert('☠️', 'Groźba upadłości', 'Dług = ' + Math.round(Selectors.debtRatio()) + ' tyg. przychodów (limit ' + CONFIG.debtBankruptRatio + '). Zostało ' + left + ' tyg. na ratunek: cięcia, wyprzedaż, sponsor.', 'bad', true);
      }
    } else {
      d.deepWeeks = 0;
    }
  },

  /* ----- Płynny balanser trudności (w tle) ----- */
  maybeBalance() {
    const dda = gameState.dda;
    const w = gameState.calendar.week;
    const e = Selectors.econ();
    const b = gameState.finance.budget;
    const r = gameState.record;
    if (gameState.pendingDecisions.some((id) => id.startsWith('lifeline') || id.startsWith('brake'))) return;
    const drowning = (r.lossStreak >= 4 && b < -1000 * e) || b < -3000 * e;
    const cruising = r.winStreak >= 6 && b > 6000 * e;
    if (drowning && w - dda.lastLifeline >= 8) {
      dda.lastLifeline = w;
      Engine.pushDecision(Utils.rand(['lifelineRadny', 'lifelineEmigracja', 'lifelineTaca']));
    } else if (cruising && w - dda.lastBrake >= 8) {
      dda.lastBrake = w;
      Engine.pushDecision(Utils.rand(['brakeSanepid', 'brakeRoof', 'brakeBonus']));
    }
  },

  /* ----- Koniec gry ----- */
  checkGameOver() {
    if (gameState.screen !== 'game') return;
    const owed = gameState.loans.taken.reduce((s, l) => s + l.remaining * l.rate, 0);
    const hole = Math.max(0, -gameState.finance.budget) + owed;
    const missed = gameState.loans.taken.reduce((s, l) => s + (l.penalties || 0), 0);
    const ratio = Selectors.debtRatio();
    const weeks = Math.round(ratio);
    const story = ' Przy przychodach ok. ' + Utils.formatMoney(Math.round(Selectors.incomeWeekly())) + ' na tydzień to ' + weeks + ' tygodni pracy całego klubu tylko na spłatę.';
    if (missed >= 2 && ratio > CONFIG.debtBankruptRatio * 0.8) {   // spirala długu: utrata płynności (nieopłacone raty) + dziura ponad siły klubu
      Engine.gameOver('BANKRUCTWO. Dziura w kasie i niespłacone pożyczki sięgnęły ' + Utils.formatMoney(hole) + '.' + story + ' Sąd ogłosił upadłość, syndyk zaplombował blaszak, a lichwiarze podzielili się sprzętem: Zdzisiek wziął kosiarkę, Mietek – siatki z bramek.', 'bankrupt');
    } else if (gameState.debt.deepWeeks >= CONFIG.debtGameOverWeeks) {
      Engine.gameOver('BANKRUCTWO. Zadłużenie ' + Utils.formatMoney(hole) + ' przez ' + CONFIG.debtGameOverWeeks + ' tygodnie z rzędu przekraczało ' + CONFIG.debtBankruptRatio + ' tygodni przychodów klubu.' + story + ' Komornik zajął wszystko, sąd ogłosił upadłość, a Walne Zgromadzenie w remizie odwołało Prezesa (wstrzymał się tylko Pan Heniek).', 'bankrupt');
    } else if (gameState.morale.lockerRoom <= 0 && gameState.morale.fans <= 0) {
      Engine.gameOver('Szatnia i kibice w totalnym buncie (0% i 0%). Walne Zgromadzenie zebrało się w remizie bez zaproszenia Prezesa.');
    }
  },

  gameOver(reason, kind) {
    gameState.gameOver = { reason, kind: kind || null, season: gameState.calendar.season, week: gameState.calendar.week, budget: gameState.finance.budget, league: Selectors.leagueName(), dna: Selectors.dnaLabel() };
    gameState.screen = 'gameover';
    Storage.clear();
  },

  queueRetirementDecision() {
    if (gameState.retirees.length) Engine.pushDecision('veteranStaff');
  },

  /* ----- Zawodnicy ----- */
  // Tworzy zawodnika bez dodawania do kadry (skauting też z tego korzysta).
  // Imię, ksywa i nazwisko bez powtórek w kadrze, na wypożyczeniach i na giełdzie
  uniqueName() {
    const t = gameState.transfer || {};
    const taken = gameState.squad.concat((gameState.loansOut || []).map((l) => l.player), t.market || [], t.loanMarket || [], (gameState.youthPick && gameState.youthPick.cands) || [], (gameState.u19 && gameState.u19.squad) || []);
    const nicks = new Set(taken.map((p) => p.nick));
    const full = new Set(taken.map((p) => p.first + ' ' + p.last));
    let n = null;
    for (let i = 0; i < 30; i++) {
      n = { first: Utils.rand(DATA.names.first), nick: Utils.rand(DATA.names.nick), last: Utils.rand(DATA.names.last) };
      if (!nicks.has(n.nick) && !full.has(n.first + ' ' + n.last)) break;
    }
    return n;
  },

  makePlayer({ ageMin = 18, ageMax = 32, skillMin = 3, skillMax = 6, wageMin = 10, wageMax = 30, pos = null, trait = null } = {}) {
    trait = trait || Utils.rand(DATA.traits);
    const positions = ['GK', 'DEF', 'DEF', 'DEF', 'MID', 'MID', 'MID', 'FWD', 'FWD'];
    // Bramkarz, gdy brakuje – reszta losowo
    const needGK = gameState.squad.filter((p) => p.pos === 'GK').length < 2;
    gameState.nextPlayerId++;
    const p = {
      id: 'p' + gameState.nextPlayerId,
      ...Engine.uniqueName(),
      age: Utils.randInt(ageMin, ageMax),
      pos: pos || (needGK ? 'GK' : Utils.rand(positions)),
      skill: Utils.clamp(Utils.randInt(skillMin, skillMax), 1, CONFIG.maxSkill),
      profile: trait.profile || Utils.rand(['off', 'def', 'uni']),
      wage: Math.round(Utils.randInt(wageMin, wageMax) / 5) * 5,
      trait: trait.text, tag: trait.tag || null,
      apps: 0, goals: 0, seasons: 1, seasonApps: 0, seasonGoals: 0,
      lastRating: null, seasonRatingSum: 0, seasonRatingCount: 0, careerRatingSum: 0, careerRatingCount: 0,
      favorite: false, legend: false, talent: false,
    };
    p.temper = Engine.rollTemper(p);
    Engine.rollPotential(p);
    return p;
  },

  rollCards(lineup, derby) {
    const styleMod = (DATA.cardStyle[Selectors.coach().style] || 1) * (Selectors.coachTrait('discipline') ? 0.8 : 1) * (Selectors.coachTrait('hardTraining') ? 1.1 : 1) * (derby ? 1.4 : 1);
    const cards = [];
    lineup.forEach((p) => {
      const posMod = { GK: 0.3, DEF: 1.3, MID: 1.1, FWD: 0.8 }[p.pos] || 1;
      const temper = p.temper != null ? p.temper : 0.4;
      if (Math.random() < 0.0035 * (0.5 + temper * 2) * styleMod) {
        cards.push({ us: true, card: 'R', min: Utils.randInt(10, 89), p, direct: true, name: Selectors.shortName(p) });
        return;
      }
      if (Math.random() < 0.07 * (0.4 + temper * 1.6) * styleMod * posMod) {
        const min = Utils.randInt(5, 85);
        cards.push({ us: true, card: 'Y', min, p, name: Selectors.shortName(p) });
        if (Math.random() < 0.025 + temper * 0.05) cards.push({ us: true, card: 'R', min: Utils.randInt(min + 1, 90), p, name: Selectors.shortName(p) + ' (2. żółta)' });
      }
    });
    // rywale też faulują
    const theirY = Utils.randInt(0, 2) + (derby ? 1 : 0);
    for (let i = 0; i < theirY; i++) cards.push({ us: false, card: 'Y', min: Utils.randInt(5, 89), name: 'rywal' });
    if (Math.random() < 0.04 * (derby ? 1.6 : 1)) cards.push({ us: false, card: 'R', min: Utils.randInt(20, 89), name: 'rywal' });
    return cards.sort((a, b) => a.min - b.min);
  },
  // Pauzy: czerwona = 1 mecz (bezpośrednia = 2), co 4. żółta = 1 mecz
  applyCardBans(cards) {
    cards.filter((c) => c.us).forEach((c) => {
      const p = c.p;
      if (c.card === 'Y') {
        p.yellows = (p.yellows || 0) + 1; p.seasonYellows = (p.seasonYellows || 0) + 1;
        if (p.yellows % 4 === 0) { p.suspended = (p.suspended || 0) + 1; Engine.addLog('🟨 ' + Selectors.playerName(p) + ' – 4. żółta kartka, pauza w następnym meczu.', 'event'); }
      } else {
        p.reds = (p.reds || 0) + 1; p.seasonReds = (p.seasonReds || 0) + 1;
        p.suspended = (p.suspended || 0) + (c.direct ? 2 : 1);
        Engine.addLog('🟥 ' + Selectors.playerName(p) + ' wyleciał z boiska' + (c.direct ? ' (bezpośrednia czerwona) – 2 mecze pauzy.' : ' po drugiej żółtej – pauza w następnym meczu.'), 'event');
      }
    });
  },

  // Skłonność do fauli (0–1): przecinaki w obronie łapią kartki, technicy rzadko
  rollTemper(p) {
    let t = Utils.randRange(0, 0.8) + ({ GK: -0.2, DEF: 0.15, MID: 0.05, FWD: -0.05 }[p.pos] || 0);
    if (p.tag === 'party') t += 0.15;
    if (p.profile === 'def') t += 0.1;
    if (p.profile === 'off') t -= 0.1;
    return Math.round(Utils.clamp(t, 0, 1) * 100) / 100;
  },

  // Potencjał = sufit umiejętności. Młodzi mają zapas, starsi są już blisko szczytu.
  rollPotential(p) {
    const room = p.age <= 20 ? Utils.randInt(1, 5) : p.age <= 23 ? Utils.randInt(0, 3) : p.age <= 26 ? Utils.randInt(0, 1) : 0;
    // sufit skalowany do ligi klubu (+1 dla zwykłych, +2 dla Perełek ponad poziom rozgrywek)
    p.potential = Math.max(p.skill, Math.min(Selectors.leagueSkillCap() + (p.talent ? 2 : 1), p.skill + room + (p.talent ? 2 : 0)));
  },

  markTalent(p) {
    p.talent = true;
    p.potential = Math.min(Selectors.leagueSkillCap() + 2, Math.max(p.potential || p.skill, p.skill) + 2);   // Perełka = wyższy sufit (ale w granicach ligi)
  },

  // Rozwój na koniec sezonu: im więcej gry, tym szybciej; regularna gra na wypożyczeniu = pewny postęp
  develop(p, apps, onLoan) {
    const cap = p.ace ? Selectors.potential(p) : Math.min(Selectors.potential(p), Selectors.leagueSkillCap() + (p.talent ? 2 : 1));
    if (p.age > (p.ace ? 28 : 24) || p.skill >= cap) return 0;
    const share = Utils.clamp(apps / Math.max(1, gameState.season.rounds.length || 18), 0, 1);
    let gain = 0;
    if (onLoan) {
      gain = 1 + (Math.random() < 0.45 + (p.talent ? 0.2 : 0) ? 1 : 0);
    } else {
      const chance = 0.2 + 0.55 * share + (p.talent ? 0.15 : 0) + Selectors.staffLevel('asystent') * 0.04 + (Selectors.coachTrait('youthDev') && p.age <= 21 ? 0.2 : 0);
      gain = Math.random() < chance ? 1 : 0;
      if (gain && p.talent && share >= 0.7 && Math.random() < 0.25) gain++;
    }
    gain = Math.min(gain, cap - p.skill);
    p.skill += gain;
    return gain;
  },

  generatePlayer(opts = {}) {
    const p = Engine.makePlayer(opts);
    gameState.squad.push(p);
    return p;
  },

  /* ----- Gwiazdy za dobre na ten klub: żądanie transferu i bunt ----- */
  // „Za dobry na ten klub”: OVR wyraźnie ponad średnią jedenastki albo świetna forma w zakończonym sezonie
  isTooGood(p, avgOvr) {
    const ovr = Selectors.ovr(p);
    const ps = p.prevSeason;   // w oknie transferowym sezon jest już wyzerowany
    const formStar = ps && ps.apps >= 4 && ps.avg != null && ps.avg >= 7 && ovr >= avgOvr + 4;
    return ovr >= Math.max(avgOvr + 7, 57 + Selectors.levelSkillBonus() * 3.6) || formStar;
  },

  // Wywoływane przy otwarciu okna transferowego: znana gwiazda wraca z żądaniem, nowa zgłasza się pierwszy raz
  maybeStarDemand() {
    const st = gameState.star;
    if (Selectors.starPlayer()) { Engine.pushDecision('starDemand'); return; }
    const lineup = Engine.pickLineup([]);
    if (!lineup.length) return;
    const avg = lineup.reduce((s, p) => s + Selectors.ovr(p), 0) / lineup.length;
    const pool = gameState.squad.filter((p) => !p.loan && p.starAsked !== gameState.calendar.season && !(p.loyalUntil >= gameState.calendar.season) && Engine.isTooGood(p, avg));
    if (!pool.length || Math.random() > 0.7) return;
    const p = pool.sort((a, b) => Selectors.ovr(b) - Selectors.ovr(a))[0];
    p.starAsked = gameState.calendar.season;
    Object.assign(st, { playerId: p.id, rebel: false, promised: 0, lastWeek: gameState.calendar.week });
    Engine.pushDecision('starDemand');
  },

  // Namowy: wynik zależy od szatni, kibiców, pozycji, ligi, trenera, wieku i przywiązania do klubu
  persuadeStar() {
    const p = Selectors.starPlayer();
    if (!p) return;
    const chance = Selectors.persuadeChance(p);
    if (Math.random() < chance) {
      p.wage = Selectors.persuadeWage(p);
      p.loyalUntil = gameState.calendar.season + 1;
      Engine.endStar(false);
      Engine.applyEffects({ lockerRoom: +4, fans: +2 });
      Engine.addLog('🤝 UDAŁO SIĘ! ' + Selectors.playerName(p) + ' zostaje w klubie (pensja ' + p.wage + ' zł/tydz.). „Dla tych kibiców warto.” [szatnia +4%, kibice +2%]', 'event');
    } else {
      Engine.startRebellion('nieudane namowy');
      Engine.applyEffects({ lockerRoom: -10 });
      Engine.teamSlump(4);
      Engine.addLog('💥 Namowy nie wyszły. ' + Selectors.playerName(p) + ' wyszedł z cukierni bez słowa – w szatni wybucha gwałtowny bunt, forma zespołu leci w dół. [szatnia -10%]', 'event');
    }
  },
  // Dywanik w szatni w czasie kryzysu: mobilizacja na mecz, czasem obrażony trener
  crisisCarpet() {
    const c = gameState.coach;
    c.lastCarpetWeek = gameState.calendar.week;
    if (Math.random() < 0.3) {
      Engine.applyEffects({ lockerRoom: -4 });
      Engine.addLog('🟥 ' + Selectors.coach().carpetBad + ' [szatnia -4%]', 'event');
    } else {
      c.carpetBoost = Math.max(c.carpetBoost || 0, 0.08);
      Engine.addLog('🟥 ' + Selectors.coach().carpetOk, 'event');
    }
  },
  // Kryzys formy całego zespołu (bunt, afera) – słabsza gra przez kilka tygodni
  teamSlump(weeks) {
    gameState.star.slumpUntil = Math.max(gameState.star.slumpUntil || 0, gameState.calendar.week + weeks);
  },

  relegationRevolt(summary, league) {
    const team = Selectors.teamOvr();
    const keys = gameState.squad.filter((p) => !p.loan && !p.legend && Selectors.ovr(p) >= team + 2).sort((a, b) => Selectors.ovr(b) - Selectors.ovr(a)).slice(0, 3);
    keys.forEach((p) => {
      const r = Math.random();
      const name = Selectors.playerName(p);
      if (r < 0.4 && gameState.squad.length > CONFIG.minSquad) {
        const fee = Math.max(10, Math.round(Selectors.sellPrice(p) * 0.6 / 10) * 10);
        const club = Engine.otherClubName(1);
        gameState.squad = gameState.squad.filter((x) => x.id !== p.id);
        if (p.id === gameState.star.playerId) Engine.endStar(false);
        Engine.money('Klauzula spadkowa: ' + name, fee);
        Engine.applyEffects({ lockerRoom: -3, fans: p.favorite ? -6 : -2 });
        summary.left.push(name + ' → ' + club + ' (klauzula spadkowa)');
        Engine.crisis('stars', '📉', 'GWIAZDY NIE CHCĄ GRAĆ NIŻEJ', '🚪 ' + name + ' (OVR ' + Selectors.ovr(p) + ') korzysta z klauzuli spadkowej i odchodzi do ' + club + ' za ' + Utils.formatMoney(fee) + '.');
        Engine.addLog('🚪 ' + name + ' odchodzi po spadku do ' + club + ' (klauzula spadkowa: ' + Utils.formatMoney(fee) + ').', 'event');
      } else if (r < 0.8) {
        p.listed = true;
        p.demandOut = true;
        Engine.applyEffects({ lockerRoom: -4 });
        Engine.crisis('stars', '📉', 'GWIAZDY NIE CHCĄ GRAĆ NIŻEJ', '📢 ' + name + ' żąda transferu: „W lidze ' + league + ' nie zagram!”. Jeśli zostanie po okienku – będzie się buntował.');
        Engine.addLog('📢 ' + name + ' żąda transferu po spadku. Trafia na listę transferową.', 'event');
      } else {
        Engine.crisis('stars', '📉', 'GWIAZDY NIE CHCĄ GRAĆ NIŻEJ', '🤝 ' + name + ' zostaje mimo spadku: „Wrócimy razem, prezesie”.');
      }
    });
  },

  // Kara dyscyplinarna: awanturnik do końca sezonu gra w U19 za pół pensji
  exileToU19(p, reason) {
    if (!p || p.exiled || p.loan) return;
    p.exiled = { season: gameState.calendar.season, wage: p.wage, reason };
    p.wage = Math.max(5, Math.round(p.wage / 2 / 5) * 5);   // presja płacowa z pierwszego zespołu zdjęta
    p.temper = Math.max(0.05, (p.temper != null ? p.temper : 0.4) * 0.6);   // nauczka temperuje charakter
    p.formHistory = (p.formHistory || []).concat([5, 5]).slice(-5);         // upokorzenie odbija się na formie
    delete p.benched;
    if (Math.random() < 0.6) delete p.wantsOut;                               // część buntowników po takiej lekcji zostaje
    if (p.id === gameState.star.playerId) Engine.endStar(false);             // koniec buntu gwiazdy w pierwszej drużynie
    Engine.applyEffects({ lockerRoom: +3, fans: p.favorite ? -4 : 0 });
    Engine.addLog('⬇️ ' + Selectors.playerName(p) + ' zesłany do U19 do końca sezonu (' + reason + '). Pensja ' + p.wage + ' zł/tydz. Reszta szatni nagle bardzo grzeczna. [szatnia +3%' + (p.favorite ? ', kibice -4%' : '') + ']', 'decision');
  },
  // Koniec sezonu: zesłani wracają do pierwszej drużyny ze starą pensją
  endExiles(summary) {
    gameState.squad.filter((p) => p.exiled).forEach((p) => {
      p.wage = p.exiled.wage;
      delete p.exiled;
      if (summary) summary.loanBack.push(Selectors.playerName(p) + ' ← U19 (koniec kary)');
      Engine.addLog('⬆️ ' + Selectors.playerName(p) + ' wraca z karnego zesłania w U19. Pokorniejszy.', 'event');
    });
  },

  startRebellion(reason) {
    const st = gameState.star;
    const p = Selectors.starPlayer();
    if (!p) return;
    st.rebel = true;
    st.promised = 0;
    st.talkWeek = gameState.calendar.week;
    Engine.addLog('🔥 BUNT W SZATNI (' + reason + '): ' + Selectors.playerName(p) + ' podburza drużynę.', 'event');
  },

  endStar(sold) {
    const st = gameState.star;
    const p = Selectors.starPlayer();
    if (p && sold) gameState.squad = gameState.squad.filter((x) => x.id !== p.id);
    if (p) delete p.benched;
    Object.assign(st, { playerId: null, rebel: false, promised: 0 });
  },

  // Co tydzień: skutki buntu, powrót gwiazdy na dywanik co 4 tygodnie, koniec buntu, gdy zawodnika już nie ma
  starTick() {
    const st = gameState.star;
    if (!st.playerId) return;
    const p = Selectors.starPlayer();
    if (!p) {
      if (st.rebel) Engine.addLog('🕊️ Buntownika nie ma już w klubie. W szatni znowu słychać śmiechy.', 'event');
      Engine.endStar(false);
      return;
    }
    if (!Selectors.rebel()) return;   // odsunięty od składu nie szkodzi
    Engine.applyEffects({ lockerRoom: -3 });
    if (gameState.calendar.week - st.talkWeek >= 4 && !gameState.pendingDecisions.includes('starRebel')) {
      st.talkWeek = gameState.calendar.week;
      Engine.pushDecision('starRebel');
    }
  },

  /* ----- Okno transferowe: tylko po sezonie, do pierwszego meczu nowych rozgrywek ----- */
  // Statystyki z poprzedniego klubu dla zawodnika z giełdy (żeby kupować świadomie)
  fakeHistory(p, club) {
    const apps = Utils.randInt(6, 18);
    const perGame = { GK: 0, DEF: 0.04, MID: 0.12, FWD: 0.3 }[p.pos] * (0.6 + p.skill / 10);
    p.prevSeason = { apps, goals: Math.round(apps * perGame * Utils.randRange(0.6, 1.4)), avg: Math.round(Utils.clamp(4.8 + p.skill * 0.22 + Utils.randRange(-0.6, 0.6), 3, 9.5) * 10) / 10 };
    p.fromClub = club;
    return p;
  },

  otherClubName(levelUp = 0) {
    const L = DATA.leagueLevels[Utils.clamp(gameState.club.leagueLevel + levelUp, 1, DATA.leagueLevels.length - 1)];
    return L.pool ? Utils.rand(L.pool) : Utils.rand(DATA.rivals).name;
  },

  openTransferWindow() {
    const bonus = Selectors.levelSkillBonus();
    const e = Selectors.econ();
    const market = ['GK', 'DEF', 'DEF', 'MID', 'MID', 'FWD', 'FWD'].map((pos) => {
      const p = Engine.makePlayer({ ageMin: 18, ageMax: 33, skillMin: 3 + bonus, skillMax: 8 + bonus, pos });
      p.wage = Math.max(5, Math.round((p.skill * 6 - 8) * e / 5) * 5);
      p.fee = Math.max(30, Math.round((50 + p.skill * 28 + Utils.randInt(-25, 25)) * e / 10) * 10);
      if (p.age <= 20 && Math.random() < 0.25) Engine.markTalent(p);
      return Engine.fakeHistory(p, Engine.otherClubName(0));
    });
    // Wypożyczenia do nas: młodzi i zdolni z wyższych lig, na jeden sezon, za część pensji
    const loanMarket = Utils.shuffle(['DEF', 'MID', 'FWD', 'GK']).slice(0, 3).map((pos) => {
      const p = Engine.makePlayer({ ageMin: 18, ageMax: 21, skillMin: 5 + bonus, skillMax: 8 + bonus, pos });
      if (Math.random() < 0.4) Engine.markTalent(p);
      p.wage = Math.max(5, Math.round((p.skill * 3) * e / 5) * 5);                       // płacimy połowę pensji
      p.fee = Math.max(20, Math.round((p.skill * 15) * e / 10) * 10);                    // opłata za wypożyczenie
      const club = Engine.otherClubName(Utils.randInt(1, 2));
      p.loan = { from: club, until: gameState.calendar.season };
      return Engine.fakeHistory(p, club);
    });
    gameState.transfer = { open: true, season: gameState.calendar.season, market, loanMarket, bought: 0, sold: 0, shown: false, news: [] };   // sezon już przestawiony na nowy
    (gameState.league.fireSale || []).forEach((name) => Engine.addFireSale(name));
    gameState.league.fireSale = [];
    Engine.scoutBargains();  // skaut wynajduje okazje cenowe i perełki
    Engine.directorAct();   // tryb automatyczny: dyrektor sportowy kupuje od razu
    // Ruchy kadrowe tylko teraz: gwiazdy żądające odejścia i oferty z wyższej ligi
    Engine.maybeStarDemand();
    if (!gameState.pendingDecisions.includes('starDemand') && gameState.squad.length > CONFIG.minSquad && Math.random() < 0.4) {
      DATA.decisions.cutTransfer.prepare();
      Engine.pushDecision('cutTransfer');
    }
  },

  closeTransferWindow() {
    const t = gameState.transfer;
    if (!t.open) return;
    t.open = false;
    t.market = [];
    const st = gameState.star;
    if (st.promised && st.promised < t.season && Selectors.starPlayer()) {
      Engine.startRebellion('złamana obietnica transferu');
      Engine.applyEffects({ lockerRoom: -8, fans: -3 });
    }
    Engine.addLog('🔒 Okno transferowe zamknięte. Przyszło: ' + t.bought + ', odeszło: ' + t.sold + '.', 'system');
    gameState.squad.filter((p) => p.demandOut).forEach((p) => {   // żądał transferu po spadku, a został
      delete p.demandOut;
      Engine.applyEffects({ lockerRoom: -5 });
      Engine.addLog('😤 ' + Selectors.playerName(p) + ' nie dostał transferu i gra „z musu”. Atmosfera w szatni siada. [szatnia -5%]', 'event');
    });
    // Dyrektor w trybie autonomicznym: raport na ekranie po zamknięciu okienka
    const dir = gameState.director;
    if (dir && dir.hired && dir.mode === 'auto') {
      const cur = dir.windowSeason === t.season;
      const buys = cur ? (dir.windowBuys || []) : [];
      const sells = cur ? (dir.windowSells || []) : [];
      const loans = cur ? (dir.windowLoans || []) : [];
      gameState.directorReport = { season: t.season, name: dir.hired.name, buys, sells, loans, total: buys.reduce((s, b) => s + b.fee, 0), income: sells.concat(loans).reduce((s, b) => s + b.fee, 0) };
    }
    Engine.u19WindowVerdict(t.season);
  },

  buyTransfer(id) {
    if (Selectors.transferBanned()) return;   // ban transferowy Związku
    const t = gameState.transfer;
    const p = t.open && t.market.find((x) => x.id === id);
    if (!p || gameState.squad.length >= CONFIG.maxSquad || gameState.finance.budget < p.fee) return;
    Engine.money('Transfer: ' + Selectors.playerName(p), -p.fee);
    t.market = t.market.filter((x) => x.id !== id);
    delete p.fee;
    gameState.squad.push(p);
    t.bought++;
    Engine.addLog('✍️ Transfer: ' + Selectors.playerName(p) + ' (' + DATA.positions[p.pos].label.toLowerCase() + ', ' + p.wage + ' zł/tydz.) dołącza do klubu.', 'decision');
  },

  loanIn(id) {
    if (Selectors.transferBanned()) return;   // ban transferowy Związku
    const t = gameState.transfer;
    const p = t.open && t.loanMarket.find((x) => x.id === id);
    if (!p || gameState.squad.length >= CONFIG.maxSquad || gameState.finance.budget < p.fee) return;
    Engine.money('Wypożyczenie: ' + Selectors.playerName(p), -p.fee);
    t.loanMarket = t.loanMarket.filter((x) => x.id !== id);
    delete p.fee;
    gameState.squad.push(p);
    t.bought++;
    Engine.addLog('🤝 Wypożyczenie: ' + Selectors.playerName(p) + ' z ' + p.loan.from + ' do końca sezonu (' + p.wage + ' zł/tydz.).', 'decision');
  },

  loanOut(id) {
    const t = gameState.transfer;
    const p = gameState.squad.find((x) => x.id === id);
    if (!t.open || !p || p.loan || p.id === gameState.star.playerId || gameState.squad.length <= CONFIG.minSquad) return;
    const fee = Selectors.loanOutFee(p);
    gameState.squad = gameState.squad.filter((x) => x.id !== id);
    const club = Engine.otherClubName(Math.random() < 0.5 ? 0 : -1);
    gameState.loansOut.push({ player: p, club, until: t.season });
    Engine.money('Wypożyczenie do ' + club + ': ' + Selectors.playerName(p), fee);
    t.sold++;
    Engine.addLog('📤 ' + Selectors.playerName(p) + ' wypożyczony na sezon do ' + club + ' (+' + Utils.formatMoney(fee) + '). Pensję płacą tam.', 'decision');
  },

  // Koniec sezonu: wypożyczeni wracają do macierzystych klubów, nasi wracają z wypożyczeń
  settleLoans(summary) {
    const season = gameState.calendar.season;
    gameState.squad.filter((p) => p.loan && p.loan.until <= season).forEach((p) => {
      gameState.squad = gameState.squad.filter((x) => x.id !== p.id);
      summary.loanEnd.push(Selectors.playerName(p) + ' → ' + p.loan.from);
    });
    gameState.loansOut = gameState.loansOut.filter((l) => {
      if (l.until > season) return true;
      const p = l.player;
      p.age++; p.seasons++;                                       // sezon minął także na wypożyczeniu
      Engine.fakeHistory(p, l.club);
      p.prevSeason.apps = Utils.randInt(13, 18);                  // na wypożyczeniu grał regularnie
      delete p.fromClub;
      const gain = Engine.develop(p, p.prevSeason.apps, true);
      if (gain) summary.growth.push(Selectors.playerName(p) + ' +' + gain + ' (wypożyczenie: ' + l.club + ')');
      gameState.squad.push(p);
      summary.loanBack.push(Selectors.playerName(p) + ' ← ' + l.club);
      return false;
    });
  },

  sellTransfer(id) {
    const t = gameState.transfer;
    const p = gameState.squad.find((x) => x.id === id);
    if (!t.open || !p || p.loan || gameState.squad.length <= CONFIG.minSquad) return;
    const price = p.id === gameState.star.playerId ? Selectors.starFee(p) : Selectors.sellPrice(p);
    gameState.squad = gameState.squad.filter((x) => x.id !== id);
    Engine.money('Sprzedaż: ' + Selectors.playerName(p), price);
    const effects = p.legend ? { fans: -10, lockerRoom: -6 } : p.favorite ? { fans: -6 } : {};
    Engine.applyEffects(effects);
    t.sold++;
    Engine.addLog('💸 Sprzedany: ' + Selectors.playerName(p) + ' za ' + Utils.formatMoney(price) + '.' + Engine.describeEffects(effects), 'decision');
  },

  // Głęboki dług: kluby wiedzą, że musimy sprzedać – płacą ok. 45% wartości, także poza oknem
  fireSale(id) {
    if (!Selectors.debtCrisis()) return;
    const p = gameState.squad.find((x) => x.id === id);
    if (!p || p.loan || gameState.squad.length <= CONFIG.minSquad) return;
    const price = Selectors.fireSalePrice(p);
    const club = Engine.otherClubName(Math.random() < 0.5 ? 0 : 1);
    gameState.squad = gameState.squad.filter((x) => x.id !== id);
    if (p.id === gameState.star.playerId) Engine.endStar(false);
    Engine.money('Wyprzedaż po taniości: ' + Selectors.playerName(p), price);
    const effects = p.legend ? { fans: -10, lockerRoom: -8 } : p.favorite ? { fans: -6, lockerRoom: -4 } : { fans: -1, lockerRoom: -3 };
    Engine.applyEffects(effects);
    if (gameState.transfer.open) gameState.transfer.sold++;
    gameState.stats.fireSales = (gameState.stats.fireSales || 0) + 1;
    Engine.addLog('🔥 WYPRZEDAŻ: ' + Selectors.playerName(p) + ' odchodzi do ' + club + ' za ' + Utils.formatMoney(price) + ' (wart ' + Utils.formatMoney(Selectors.sellPrice(p)) + '). Wszyscy wiedzą, że toniemy.' + Engine.describeEffects(effects), 'decision');
    if (Math.random() < 0.4) Engine.xPost('portal', Selectors.clubDisplayName() + ' wyprzedaje skład za bezcen! ' + Selectors.shortName(p) + ' poszedł za ' + Utils.formatMoney(price) + '. Komornik już grzeje silnik? 💸');
  },

  coachBringsPlayer() {
    if (gameState.squad.length >= CONFIG.maxSquad) return;
    const p = Engine.generatePlayer({ ageMin: 26, ageMax: 32, skillMin: 6 + Selectors.levelSkillBonus(), skillMax: 8 + Selectors.levelSkillBonus(), wageMin: Math.round(30 * Selectors.econ()), wageMax: Math.round(45 * Selectors.econ()) });
    Engine.addLog('🤝 Trener ' + Selectors.coach().name + ' ściągnął „kolegę z dawnych lat”: ' + Selectors.playerName(p) + ' (' + DATA.positions[p.pos].label.toLowerCase() + '). Chce ' + p.wage + ' zł/tydz. „na paliwo”.', 'event');
  },

  releasePlayer(id) {
    const p = gameState.squad.find((x) => x.id === id);
    if (!p || p.loan || !gameState.transfer.open || gameState.squad.length <= CONFIG.minSquad) return;   // tylko w oknie transferowym
    gameState.squad = gameState.squad.filter((x) => x.id !== id);
    let effects = {};
    let text = '✂️ Prezes podziękował za grę: ' + Selectors.playerName(p) + '.';
    if (p.legend) {
      effects = { fans: -12, lockerRoom: -10 };
      text += ' WYRZUCIĆ LEGENDĘ?! Kibice palą szaliki, szatnia nie odzywa się do Prezesa.';
    } else if (p.favorite) {
      effects = { fans: -8 };
      text += ' Wyrzucony Ulubieniec Trybun! Na płocie pojawia się napis „PREZES DO DYMISJI”.';
    } else {
      text += ' Zabrał korki, ręcznik i dwie piłki klubowe.';
    }
    Engine.applyEffects(effects);
    Engine.addLog(text + Engine.describeEffects(effects), 'event');
  },

  /* ----- Trener ----- */
  severance() {
    return Selectors.coachWeekly() * 3;
  },

  setCoach(id) {
    const c = gameState.coach;
    c.id = id; c.hiredWeek = gameState.calendar.week; c.carpetBoost = 0; c.boringStreak = 0; c.lastReport = '';
    const def = Selectors.coachDef(id) || DATA.coaches.mirek;
    c.custom = DATA.coaches[id] ? null : def;   // wygenerowany trener zostaje zapisany w klubie
    c.license = def.license || 0;               // licencja nowego trenera (kurs podnosi ją później)
    c.weekly = Selectors.coachOffer(def).weekly;
  },

  refreshCoachMarket() {
    const lvl = gameState.club.leagueLevel;
    const keys = Object.keys(DATA.coachTraits);
    const list = [0, 1, 2].map((i) => {
      const style = Utils.rand(['off', 'bal', 'def']);
      const traits = Utils.shuffle(keys).slice(0, Math.random() < 0.5 ? 1 : 2);
      const quality = Math.round((0.06 + lvl * 0.022 + Utils.randRange(-0.03, 0.04)) * 100) / 100;
      const req = Selectors.coachLicenseReq(lvl);
      const license = Utils.clamp(req - (Math.random() < 0.3 ? 1 : 0) + (Math.random() < 0.2 ? 1 : 0), 0, 4);   // część bez papierów na tę ligę – tańsza
      let pay = 40 + quality * 700;
      if (traits.includes('tactician')) pay *= 1.25;
      if (traits.includes('mediaStar')) pay *= 1.3;
      if (traits.includes('drinker')) pay *= 0.7;
      if (license < req) pay *= 0.8;
      const weekly = Math.round(pay / 5) * 5;
      const name = Utils.rand(DATA.names.first) + ' ' + Utils.rand(DATA.names.last);
      return {
        id: 'gen-' + gameState.calendar.season + '-' + lvl + '-' + i, name, title: DATA.coachTitles[lvl] || 'trener', age: Utils.randInt(32, 66),
        style, sign: Math.round(weekly * 2.5 / 5) * 5, weekly, quality, prefers: Utils.rand([null, null, 'youth', 'veterans']), fanMod: style === 'off' ? 1 : 0,
        license, traits, generated: true,
        desc: 'Styl: ' + DATA.styles[style].label.toLowerCase() + '. ' + traits.map((t) => DATA.coachTraits[t].label).join(', ') + '.',
        reports: DATA.styleReports[style],
        complaint: 'Prezesie, ta kadra nie pasuje do mojego stylu. Potrzebuję innych zawodników.',
        carpetOk: 'Trener wysłuchał uwag i obiecał poprawę. Chłopaki dostali w kość na treningu.',
        carpetBad: 'Trener się obraził: „Jak Prezes wie lepiej, to niech sam prowadzi drużynę”.',
      };
    });
    gameState.coachMarket = { level: lvl, season: gameState.calendar.season, list };
  },

  // Kurs trenerski poza awansem (z zakładki Trener)
  coachCourse() {
    const req = Selectors.coachLicenseReq();
    const cost = Selectors.courseCost(req);
    if (Selectors.coachLicenseOk() || gameState.coach.id === 'mirek' || gameState.finance.budget < cost) return;
    Engine.money('Kurs trenerski ' + DATA.coachLicenses[req], -cost);
    if (Math.random() < 0.85) { gameState.coach.license = req; gameState.coach.figurehead = null; Engine.alert('🎓', 'Licencja zdobyta!', Selectors.coach().name + ': ' + DATA.coachLicenses[req] + '.', 'good'); }
    else Engine.alert('📕', 'Oblany egzamin', Selectors.coach().name + ' nie zdał kursu. Pieniądze przepadły.', 'bad');
  },

  hireCoach(id) {
    const coach = Selectors.coachDef(id);
    if (!coach || gameState.coach.id !== 'mirek' || id === 'mirek' || gameState.finance.budget < Selectors.coachOffer(coach).sign) return;
    Engine.money('Podpis trenera: ' + coach.name, -Selectors.coachOffer(coach).sign);
    Engine.setCoach(id);
    Engine.addLog('✍️ Nowy trener: ' + coach.name + ' (' + coach.title + '). Styl: ' + DATA.styles[coach.style].label + ' – „' + DATA.styles[coach.style].motto + '”. Pan Mirek z ulgą wraca do kosiarki.', 'decision');
    if (coach.attracts) Engine.addLog('🤝 ' + coach.name + ': „Mam kolegę z dawnych lat – przyprowadzę go w oknie transferowym.”', 'event');
  },

  fireCoach(withSeverance) {
    const coach = Selectors.coach();
    if (gameState.coach.id === 'mirek') return;
    if (withSeverance) {
      Engine.money('Odprawa: ' + coach.name, -Engine.severance());
      if (Math.random() < Selectors.fireFochChance(true)) { Engine.applyEffects({ lockerRoom: -4 }); Engine.addLog('📤 Trener ' + coach.name + ' zwolniony z odprawą. Część szatni stała za nim murem – foch. [szatnia -4%]', 'decision'); }
      else Engine.addLog('📤 Trener ' + coach.name + ' zwolniony z odprawą ' + Utils.formatMoney(Engine.severance()) + '. Rozstanie w zgodzie, nawet uścisk dłoni.', 'decision');
    } else if (Math.random() < Selectors.fireFochChance(false)) {
      Engine.applyEffects({ lockerRoom: -8 });
      Engine.addLog('📤 Trener ' + coach.name + ' zwolniony bez grosza odprawy. Szatnia strzela focha: „Tak się ludzi nie traktuje!”. [szatnia -8%]', 'decision');
    } else {
      Engine.applyEffects({ lockerRoom: -2 });
      Engine.addLog('📤 Trener ' + coach.name + ' zwolniony bez odprawy. Szatnia ponarzekała, ale przełknęła. [szatnia -2%]', 'decision');
    }
    Engine.setCoach('mirek');
  },

  carpetCoach() {
    const c = gameState.coach;
    if (gameState.calendar.week - c.lastCarpetWeek < CONFIG.carpetCooldown) return;
    c.lastCarpetWeek = gameState.calendar.week;
    const coach = Selectors.coach();
    if (Math.random() < 0.7) {
      c.carpetBoost = 0.08;
      Engine.addLog('🟥 Dywanik: ' + coach.carpetOk + ' [mobilizacja na najbliższy mecz]', 'decision');
    } else {
      c.carpetBoost = -0.03;
      Engine.applyEffects({ lockerRoom: -3 });
      Engine.addLog('🟥 Dywanik: ' + coach.carpetBad + ' [szatnia -3%]', 'decision');
    }
  },

  /* ----- Sztab pomocniczy ----- */
  hireStaff(slot, idx = 0) {
    const cand = (DATA.staffPool[slot] || [])[idx];
    if (!cand || (gameState.staff[slot] && gameState.staff[slot].kind !== 'volunteer')) return;
    const prev = gameState.staff[slot];
    gameState.staff[slot] = { name: cand.name, kind: 'external', wage: Math.round(cand.wage * Selectors.econ()), chem: cand.chem, lockerBase: cand.lockerBase, desc: cand.desc, level: cand.level };
    Engine.addLog('🧑‍💼 Do sztabu dołącza ' + cand.name + ' (' + DATA.staffSlots[slot].label + ', ' + Math.round(cand.wage * Selectors.econ()) + ' zł/tydz.).' + (prev ? ' ' + prev.name + ' wraca do koszenia trawy.' : ''), 'decision');
  },

  fireStaff(slot) {
    const m = gameState.staff[slot];
    if (!m) return;
    gameState.staff[slot] = null;
    if (m.kind === 'veteran') {
      Engine.applyEffects({ fans: -3, lockerRoom: -5 });
      Engine.addLog('📤 Prezes zwolnił ze sztabu weterana: ' + m.name + '. Za dychę tygodniowo?! Wstyd na całą gminę. [kibice -3%, szatnia -5%]', 'decision');
    } else {
      Engine.addLog('📤 ' + m.name + ' nie jest już w sztabie.', 'decision');
    }
  },

  // Legenda obejmuje realną funkcję w sztabie (asystent albo kierownik) – poziom wynika z kariery
  hireVeteranStaff(slot = 'asystent') {
    const p = gameState.retirees.shift();
    if (!p) return;
    const cur = gameState.staff[slot];
    if (cur && cur.kind !== 'volunteer') Engine.addLog(cur.name + ' ustępuje miejsca w sztabie legendzie klubu.', 'event');
    const v = DATA.veteranStaff;
    gameState.staff[slot] = {
      name: Selectors.playerName(p), kind: 'veteran', wage: Math.round(v.wage * Selectors.econ()), chem: v.chem, lockerBase: v.lockerBase, level: Selectors.veteranLevel(p),
      desc: 'Legenda klubu: ' + p.apps + ' meczów, ' + p.goals + ' goli. Teraz: ' + DATA.staffSlots[slot].label.toLowerCase() + '.',
    };
    Engine.queueRetirementDecision();
  },

  /* ----- DNA klubu ----- */
  shiftDNA(delta) {
    const before = Selectors.dnaLabel();
    gameState.club.professionalism = Utils.clamp(gameState.club.professionalism + delta, -100, 100);
    const after = Selectors.dnaLabel();
    if (after !== before) Engine.addLog('🧬 DNA klubu się zmienia: teraz „' + after + '”.', 'system');
  },

  /* ----- Skauting: Szwagier ----- */




  /* ----- Szkółka ----- */

  buildAcademy() {
    const next = DATA.academyLevels[Selectors.academyLevel() + 1];
    if (!next || gameState.finance.budget < next.cost) return;
    Engine.money('Szkółka: ' + next.name, -next.cost);
    gameState.academy.level = Selectors.academyLevel() + 1;
    Engine.shiftDNA(+3);
    Engine.applyEffects({ fans: +2 });
    Engine.addLog('🎽 Rozbudowa szkółki: ' + next.name + '. Na selekcji po sezonie pojawią się lepsi chłopcy. [kibice +2%]', 'finance');
  },
  // Selekcja po sezonie: kilku kandydatów na różnych pozycjach, z różnym sufitem i własnymi plusami/minusami
  prepareYouthPick() {
    const A = Selectors.academy();
    const bonus = Selectors.levelSkillBonus();
    const positions = Utils.shuffle(['GK', 'DEF', 'DEF', 'MID', 'MID', 'FWD', 'FWD']).slice(0, A.cands);
    const cands = positions.map((pos) => {
      const talent = Math.random() < A.talent;
      const p = Engine.makePlayer({ ageMin: 16, ageMax: 18, skillMin: A.skill[0] + bonus, skillMax: A.skill[1] + bonus + (talent ? 1 : 0), pos });
      p.wage = Math.max(5, Math.round(5 * Selectors.econ() / 5) * 5);
      Engine.rollPotential(p);
      p.potential = Math.max(p.skill, Math.min(Selectors.leagueSkillCap() + 2, p.potential + A.room + Utils.randInt(0, 1)));
      if (talent) Engine.markTalent(p);
      p.youthPro = Utils.rand(DATA.youthTraits.pros);
      p.youthCon = Utils.rand(DATA.youthTraits.cons);
      if (p.youthCon.startsWith('Kontuzjogenny')) p.fragile = true;
      return p;
    });
    gameState.youthPick = { season: gameState.calendar.season, cands, done: false };
  },
  pickYouth(id) {
    const yp = gameState.youthPick;
    if (!yp || yp.done) return;
    const p = id && yp.cands.find((x) => x.id === id);
    yp.done = true;
    if (!p) { Engine.addLog('🌱 Selekcja zakończona bez podpisu. Chłopaki wrócili na Orlik.', 'event'); return; }
    if (gameState.squad.length >= CONFIG.maxSquad) { Engine.addLog('🌱 Brak wolnego haczyka w szatni – junior wrócił na Orlik.', 'event'); return; }
    gameState.squad.push(p);
    Engine.addLog((p.talent ? '💎 PEREŁKA ze szkółki: ' : '🌱 Ze szkółki dołącza ') + Selectors.playerName(p) + ' (' + p.age + ' l., ' + DATA.positions[p.pos].label.toLowerCase() + '). „' + p.youthPro + '” – ale też: „' + p.youthCon + '”.', 'event');
  },

  youthIntake() {
    if (gameState.squad.length >= CONFIG.maxSquad) {
      Engine.addLog('🌱 Junior ze szkółki musi poczekać – w szatni nie ma wolnego haczyka (kadra ' + CONFIG.maxSquad + '/' + CONFIG.maxSquad + ').', 'event');
      return null;
    }
    const lvl = DATA.youthLevels[Selectors.youthLevel()];
    const talent = Math.random() < lvl.talentChance;
    const p = Engine.generatePlayer({ ageMin: 17, ageMax: 18, skillMin: (talent ? 5 : lvl.skillMin) + Selectors.levelSkillBonus(), skillMax: (talent ? 6 : lvl.skillMax) + Selectors.levelSkillBonus(), wageMin: Math.round(5 * Selectors.econ()), wageMax: Math.round(5 * Selectors.econ()) });
    if (talent) Engine.markTalent(p);
    Engine.addLog(talent
      ? '💎 PEREŁKA POWIATU! Ze szkółki wskakuje ' + Selectors.playerName(p) + ' (' + p.age + ' l., ' + DATA.positions[p.pos].label.toLowerCase() + '). Skauci z A-klasy już dzwonią do jego mamy.'
      : '🌱 Ze szkółki dołącza ' + Selectors.playerName(p) + ' (' + p.age + ' l., ' + DATA.positions[p.pos].label.toLowerCase() + ') – „' + Selectors.skillLabel(p.skill) + '”.', 'event');
    return p;
  },

  // 2–4 posty po meczu: wynik + kontekst (styl, derby, ulubieńcy, afery)

      if (Math.random() < 0.5) extra.push(['sukces', 'Zawsze w was wierzyłem!!! (pierwszy raz na meczu od 2015) 💪']);
    } else if (c.result === 'D') {
      Engine.xPost('ultras', Utils.rand([

      ].concat(Selectors.colorsNick() ? ['Remis. ' + Selectors.colorsNick() + ' walczyli, ale w ' + gameState.club.town + ' oczekujemy więcej.'] : [])));
    } else {
      Engine.xPost('sukces', Utils.rand([
        score + '. Sprzedawczyki. ' + Selectors.presName() + ' do dymisji, trener do dymisji, ja też wychodzę. #KoniecZTymKlubem',
        score + ' z ' + c.rival + '?! Mój pies by lepiej zagrał. A pies ma trzy nogi.',
        'Przestaję kibicować. Od jutra. Albo od soboty, jak znowu przegramy. 😤',
      ]));
      if (Math.random() < 0.5) extra.push(['wyjadacz', 'Za moich czasów po takim meczu drużyna wracała do domu piechotą. I dobrze.']);
    }
    if (c.derby) {
      const rivalText = c.result === 'W'
        ? 'Sędzia kupiony, boisko krzywe, kiełbasa zimna. Wrócimy po swoje! 😤'
        : c.result === 'L' ? 'Hahaha ' + Selectors.clubHandle() + ' znowu na kolanach 😂 KOSA JEST NASZA!'
        : 'Remis u was to dla nas jak wygrana. Do zobaczenia w rewanżu 😤';
      must.push(['@Fanatycy' + Selectors.handleFrom(c.rival), rivalText]);
    }
    if (c.hype && c.result === 'L') must.push(['sukces', '„WSZYSCY NA STADION, BĘDZIE POGROM” – no i był pogrom. Nasz. 🤡🤡🤡']);
    if (c.poisoned) must.push(['portal', 'Zatrucie na stadionie w ' + club + '? Sanepid „przygląda się sprawie”. Pan Zenek: „To na pewno grzyby z wesela”.']);
    if (c.riot) must.push(['portal', 'Zadyma na derbach ' + club + ' – ' + c.rival + '! Wydział Dyscypliny analizuje nagrania z telefonu pani Krysi. 📹']);
    if (total >= 5) extra.push(['portal', 'Grad bramek: ' + total + ' goli w meczu ' + club + ' – ' + c.rival + '! „Tak się powinno grać w każdej wsi” – mówi pan Heniek, gospodarz obiektu.']);
    if (total <= 1 && c.result !== 'W' && c.style === 'def') extra.push(['ultras', 'Przyszliśmy na mecz, obejrzeliśmy budowę muru 🧱🧱🧱 ' + c.coachName.toUpperCase() + ' WON! Chcemy goli!']);
    if (c.style === 'def' && c.result === 'W' && c.gf <= 1) extra.push(['wyjadacz', 'Wygrali 1:0 i co z tego. Na mecz idzie się po gole, nie po krzyżówkę.']);
    if (c.style === 'off' && c.gf >= 2) extra.push(['soltys', c.coachId === 'kamil' ? 'Ten młody z laptopem to jakiś czarodziej. Gra się jak w telewizji, tylko kałuże te same. 👏' : 'Nareszcie ofensywa! Warto wyjść z domu w sobotę. 👏']);
    if ((c.weather === 'mud' || c.weather === 'rain') && c.result === 'W') extra.push(['soltys', 'Błoto po kolana, a chłopaki walczyli jak lwy. Pralka pani Krysi tego nie przeżyje. 💪']);
    if (c.favScorers.length) extra.push(['grazynka', c.favScorers[0] + ' znowu strzelił! Dziś mortadela dla niego gratis 🥩']);
    // Zawsze jest o czym pogadać pod sklepem
    extra.push(Utils.rand([
      ['wyjadacz', 'Sędzia dziś jak zwykle: widział tylko to, co chciał. Czyli nic.'],
      ['soltys', 'Dziękuję wszystkim za doping. Proszę nie parkować na trawniku przy kościele.'],
      ['grazynka', 'Po meczu kiełbasa -20%! Kto pierwszy, ten lepszy 🌭'],
      ['portal', 'Relacja z meczu ' + club + ' – ' + c.rival + ' już na naszym portalu. Zdjęcia robił wnuczek pani Krysi.'],
    ]));
    // Post o wyniku już poszedł; dokładamy 1–2 komentarze (afery i derby mają pierwszeństwo).
    const limit = Math.min(3, Math.max(Utils.randInt(1, 2), must.length));
    must.concat(Utils.shuffle(extra)).slice(0, limit).forEach(([who, text]) => {
      if (who.startsWith('@')) Engine.xPostRaw('😤', who, text);
      else Engine.xPost(who, text);
    });

    if (!st || x.strategySeason === gameState.calendar.season) return false;

  mediaPost() {

  /* ----- Telefony z szatni ----- */
  // Po podwyżkę dzwonią tylko ci, którzy wyraźnie przerastają drużynę albo błyszczą formą – albo gdy klubowi wyraźnie się powodzi.
  maybeLockerCall() {
    const c = gameState.calls;
    const suburban = gameState.club.character === 'suburban';   // letnicy płacą więcej, to i chłopaki wołają częściej
    if (gameState.pendingDecisions.includes('wageDemand') || gameState.calendar.week - c.lastWeek < (suburban ? 11 : 14)) return;   // rzadziej niż kiedyś
    const lineup = Engine.pickLineup([]);
    if (!lineup.length) return;
    const avgSkill = lineup.reduce((s, p) => s + p.skill, 0) / lineup.length;
    const e = Selectors.econ();
    const rep = gameState.lastReport;
    const clubBoom = gameState.record.winStreak >= 3 || (rep && rep.total >= 500 * e) || gameState.finance.budget >= 5000 * e
      || (gameState.calendar.round <= 2 && ['promo', 'title'].includes(gameState.lastSeason.outcome));
    const shining = (p) => p.skill >= avgSkill + 1.5 || (p.lastRating != null && p.lastRating >= 7.8) || (Selectors.avgRating(p) != null && p.seasonRatingCount >= 3 && Selectors.avgRating(p) >= 7);
    let pool = gameState.squad.filter((p) => lineup.includes(p) && shining(p));
    if (!pool.length && clubBoom) pool = gameState.squad.filter((p) => p.favorite || (lineup.includes(p) && p.skill >= avgSkill + 0.5));
    if (!pool.length || Math.random() > (suburban ? 0.3 : 0.22)) return;
    if (gameState.morale.lockerRoom >= 70 && Math.random() < 0.4) return;   // przy dobrej atmosferze mniej się marudzi
    const p = Utils.rand(pool);
    const partner = Math.random() < 0.4;
    Object.assign(c, {
      lastWeek: gameState.calendar.week, playerId: p.id,
      caller: partner ? 'partner' : 'self', callerName: partner ? Utils.rand(DATA.partners) : '',
      rival: Utils.rand(gameState.league.rivals).name,
    });
    Engine.pushDecision('wageDemand');
  },

  /* ----- Cut-scenki: losowe filmowe sceny z trudną decyzją ----- */
  maybeCutscene() {
    const cs = gameState.cutscenes;
    if (gameState.calendar.week - cs.lastWeek < 8 || gameState.pendingDecisions.some((id) => DATA.decisions[id].cutscene)) return;
    if (Math.random() > 0.15) return;
    const pool = Object.keys(DATA.decisions).filter((id) => {
      const d = DATA.decisions[id];
      const lvl = gameState.club.leagueLevel;
      const okLevel = !d.levels || (lvl >= d.levels[0] && lvl <= d.levels[1]);   // scenki dopasowane do klasy rozgrywkowej
      return d.cutscene && !d.cutscene.scripted && !d.euro && okLevel && !cs.recent.includes(id) && (!d.available || d.available());
    });
    if (!pool.length) return;
    const id = Utils.rand(pool);
    if (DATA.decisions[id].prepare) DATA.decisions[id].prepare();
    cs.lastWeek = gameState.calendar.week;
    cs.recent = [id].concat(cs.recent).slice(0, 8);
    Engine.pushDecision(id);
  },

  /* ----- Ciemna strona: „Spółdzielnia” ----- */
  maybePassat() {
    const d = gameState.dark;
    // Rzadki smaczek na kryzys: najwyżej raz w sezonie, długa przerwa, tylko gdy coś się pali
    const lvl = gameState.club.leagueLevel;
    if (d.fixed || d.offersThisSeason >= (lvl <= 3 ? 2 : 1) || gameState.calendar.week - d.lastOfferWeek < 10 + lvl * 3) return;
    const kolejka = gameState.calendar.round + 1;
    const t = gameState.season.table[US];
    const contender = t && t.p > 0 && Selectors.ourPosition() <= 3;
    // Tylko skrajne chwile: głęboko pod kreską albo dramatyczna końcówka walki o awans / utrzymanie
    const n = Selectors.leagueSize(), pos = Selectors.ourPosition();
    const zoneAt = (q) => Selectors.zoneOf(Utils.clamp(q, 1, n), n);
    const late = kolejka >= gameState.season.rounds.length * 0.6 && t && t.p > 0;
    const promoFight = late && ['up', 'upPO', 'title'].some((z) => zoneAt(pos) === z || zoneAt(pos - 1) === z);
    const relegFight = late && ['down', 'downPO', 'last'].some((z) => zoneAt(pos) === z || zoneAt(pos + 1) === z);
    const deepDebt = gameState.finance.budget < Selectors.debtThresholds().warn;
    const crisis = deepDebt || promoFight || relegFight;
