      red: 'bg-red-500/15 text-red-300', sky: 'bg-sky-500/15 text-sky-300', violet: 'bg-violet-500/15 text-violet-300', accent: 'accent-soft accent-text',
    };
    return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold ${tones[tone] || tones.slate}">${text}</span>`;
  },

  profileBadge(profile) {
    const pr = DATA.profiles[profile];
    const tone = { off: 'red', def: 'sky', uni: 'slate' }[profile];
    return `<span title="Pasuje do: ${pr.label}">${UI.chip(pr.short, tone)}</span>`;
  },

  formCircles(size = 'w-7 h-7 text-xs') {
    return gameState.record.form.map((r) => {
      const c = { W: 'bg-emerald-500 text-emerald-950', D: 'bg-amber-400 text-amber-950', L: 'bg-red-500 text-white' }[r];
      return `<span class="${size} rounded-full inline-flex items-center justify-center font-display font-bold ${c}">${{ W: 'W', D: 'R', L: 'P' }[r]}</span>`;
    }).join('');
  },

  /* ---------- KREATOR KLUBU (ekran startowy) ---------- */
  // Podgląd herbu i stroju – odświeżany na żywo podczas pisania
  formPreview() {
    const f = gameState.ui.form;
    const name = Selectors.formClubName(f) || 'Twój Klub';
    const t = DATA.townTypes[f.character];
    const c = DATA.clubColors[f.colors];
    return `
      <div class="relative rounded-xl overflow-hidden border border-slate-700">
        <div class="absolute inset-0 opacity-30 club-stripe"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/70 to-transparent"></div>
        <div class="relative flex items-end justify-center gap-4 pt-6 pb-4">
          ${UI.crest(f.colors, name, 92)}
          ${UI.kit(f.colors, 104)}
        </div>
      </div>
      <div class="mt-4 text-center">
        <div class="font-display text-2xl font-extrabold leading-tight break-words">${Utils.escape(name)}</div>
        <div class="mt-2 flex flex-wrap justify-center gap-1.5">
          ${c ? UI.chip('Nasi ' + c.nick, 'accent') : ''}
          ${f.town.trim() ? UI.chip('📍 ' + Utils.escape(f.town.trim())) : ''}
        </div>
      </div>
      <dl class="mt-4 space-y-2 text-sm">
        <div class="flex gap-2"><dt class="text-slate-400 w-6">🏟️</dt><dd class="text-slate-200">${Utils.escape(f.stadium.trim() || Selectors.defaultStadium(f.town.trim()))}</dd></div>
        <div class="flex gap-2"><dt class="text-slate-400 w-6">${t.icon}</dt><dd class="text-slate-200">${t.label}</dd></div>
        <div class="flex gap-2"><dt class="text-slate-400 w-6">🧑‍💼</dt><dd class="text-slate-200">${Utils.escape(f.president.trim() || 'Prezes')}</dd></div>
      </dl>`;
  },

  startScreen() {
    if (!gameState.ui.startQuote) gameState.ui.startQuote = Utils.rand(DATA.quotes);
    const q = gameState.ui.startQuote;
    const f = gameState.ui.form;
    const save = Storage.load();

    const pillBtn = (field, value, active, label) => `
      <button data-action="form-set" data-field="${field}" data-value="${Utils.escape(value)}"
        class="btn-press opt px-3.5 py-1.5 rounded-full border border-slate-600 bg-slate-900/60 text-sm font-semibold ${active ? 'is-active' : ''}">${label}</button>`;
    const input = (field, value, placeholder, max) => `
      <input data-field="${field}" type="text" maxlength="${max}" autocomplete="off" value="${Utils.escape(value)}" placeholder="${Utils.escape(placeholder)}"
        class="w-full px-4 py-3 rounded-lg bg-slate-900/80 border border-slate-600 text-slate-100 placeholder:text-slate-500 focus:outline-none focus:accent-border focus:ring-2 focus:ring-[color:var(--accent)]/40 font-medium" />`;
    const step = (no, title, hint, body) => `
      <section class="${UI.CARD} p-5">
        <header class="flex items-center gap-3 mb-4">
          <span class="w-8 h-8 rounded-full accent-bg font-display font-extrabold flex items-center justify-center">${no}</span>
          <div><h3 class="font-display font-bold text-lg leading-tight">${title}</h3>${hint ? `<p class="text-xs text-slate-400">${hint}</p>` : ''}</div>
        </header>
        ${body}
      </section>`;

    const prefixes = DATA.clubPrefixes.map((x) => pillBtn('prefix', x, f.prefix === x, Utils.escape(x))).join('') + pillBtn('prefix', 'custom', f.prefix === 'custom', '✏️ Własny');
    const towns = Object.entries(DATA.townTypes).map(([id, t]) => `
      <button data-action="form-set" data-field="character" data-value="${id}"
        class="btn-press opt text-left p-4 rounded-xl border border-slate-700 bg-slate-900/50 ${f.character === id ? 'is-active' : ''}">
        <div class="text-3xl">${t.icon}</div>
        <div class="font-display font-bold mt-2 leading-tight">${t.label}</div>
        <div class="text-xs text-slate-400">${t.sub}</div>
        <ul class="text-xs text-slate-300 mt-2 space-y-1">${t.perks.map((x) => `<li class="flex gap-1.5"><span class="accent-text">›</span>${x}</li>`).join('')}</ul>
      </button>`).join('');
    const colors = Object.entries(DATA.clubColors).map(([id, c]) => `
      <button data-action="form-set" data-field="colors" data-value="${id}"
        class="btn-press opt flex items-center gap-3 p-3 rounded-xl border border-slate-700 bg-slate-900/50 ${f.colors === id ? 'is-active' : ''}">
        <span class="w-9 h-9 rounded-full ring-2 ring-slate-900 flex-shrink-0" style="background:linear-gradient(135deg, ${c.c1} 50%, ${c.c2} 50%)"></span>
        <span class="text-sm font-semibold text-left">${c.label}</span>
      </button>`).join('');

    const saveBox = save && save.club.name ? `
      <section class="${UI.CARD} p-5 mb-6 club-glow">
        <div class="flex flex-col sm:flex-row sm:items-center gap-4">
          ${UI.crest(save.club.colors, save.club.name, 56)}
          <div class="flex-1 min-w-0">
            <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Kontynuuj karierę</div>
            <div class="font-display text-2xl font-extrabold truncate">${Utils.escape(save.club.name)}</div>
            <div class="text-sm text-slate-400">${Utils.escape(DATA.leagueLevels[save.club.leagueLevel] ? DATA.leagueLevels[save.club.leagueLevel].name : 'B-klasa')} · Sezon ${save.calendar.season}, Tydzień ${save.calendar.week} · Kasa: <span class="${save.finance.budget < 0 ? 'text-red-400' : 'text-emerald-400'} font-semibold">${Utils.formatMoney(save.finance.budget)}</span></div>
          </div>
          <div class="flex gap-2">
            <button data-action="load-game" class="btn-press px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-display font-bold">▶ Wczytaj grę</button>
            <button data-action="clear-save" class="btn-press px-4 py-3 rounded-xl border border-red-500/40 text-red-300 hover:bg-red-500/10 text-sm font-semibold">Resetuj zapis</button>
          </div>
        </div>
      </section>` : '';

    return `
    <main class="min-h-screen px-4 py-8 sm:py-12">
      <div class="w-full max-w-6xl mx-auto">
        <header class="mb-8">
          <div class="h-1 w-24 rounded-full club-stripe mb-5"></div>
          <p class="text-xs uppercase tracking-[0.35em] text-slate-400 font-semibold">Nowa kariera · Kreator klubu</p>
          <h1 class="font-display text-4xl sm:text-6xl font-black tracking-tight mt-2 leading-none">B-KLASA: <span class="accent-text">PREZES Z ŁAPANKI</span></h1>
          <p class="mt-3 text-slate-300 max-w-2xl">Symulator zarządzania klubem, w którym boisko dzielisz z krowami, a budżet z tajemniczym „funduszem socjalnym” kierownika drużyny.</p>
          <p class="mt-2 text-sm text-slate-500 italic">„${Utils.escape(q.text)}” — ${Utils.escape(q.author)}</p>
        </header>

        ${saveBox}

        <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
          <div class="space-y-5">
            ${step(1, 'Nazwa klubu i miejscowość', 'Przedrostek + nazwa własna. Albo zdaj się na los.', `
              <div class="flex flex-wrap gap-2 mb-4">${prefixes}</div>
              ${f.prefix === 'custom' ? `<div class="mb-3">${input('customPrefix', f.customPrefix, 'Własny przedrostek, np. Coco Jambo, Sokół, Tęcza', 25)}</div>` : ''}
              ${input('town', f.town, 'Miejscowość, np. Świbie, Chrząstawa', 30)}
              <button data-action="random-club" class="btn-press mt-3 px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 border border-slate-600 text-sm font-semibold">🎲 Wylosuj kultowy klub</button>
            `)}
            ${step(2, 'Charakter miejscowości', 'Lekki wpływ na ekonomię i nastroje.', `<div class="grid gap-3 md:grid-cols-3">${towns}</div>`)}
            ${step(3, 'Barwy klubowe', 'Pokolorują cały interfejs, herb i koszulki.', `<div class="grid gap-2 grid-cols-2 sm:grid-cols-3">${colors}</div>`)}
            <div class="grid gap-5 md:grid-cols-2">
              ${step(4, 'Obiekt sportowy', 'Puste pole = nazwa domyślna. Sponsor może ją zmienić.', input('stadium', f.stadium, Selectors.defaultStadium(f.town.trim() || '[Miejscowość]'), 60))}
              ${step(5, 'Imię / ksywa Prezesa', 'Pojawi się w pismach, telefonach i w protokole.', input('president', f.president, 'Prezes', 30))}
            </div>
          </div>

          <aside class="lg:sticky lg:top-6 self-start">
            <div class="${UI.CARD} p-5">
              <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-3">Podgląd klubu</div>
              <div id="form-preview">${UI.formPreview()}</div>
              <p id="start-error" class="text-red-400 font-semibold text-sm mt-4 min-h-[1.25rem]">${Utils.escape(gameState.ui.startError)}</p>
              <button data-action="start-game" class="btn-press btn-accent w-full mt-1 py-4 rounded-xl font-display text-xl font-extrabold tracking-wide shadow-lg">ROZPOCZNIJ PREZESURĘ</button>
              <p class="text-xs text-slate-500 text-center mt-3">Podpisując, prezes zobowiązuje się do pokrycia długów za piłki, wapno i ostatni wyjazd do Bździszewa.${save && save.club.name ? ' <b class="text-slate-300">Nowa prezesura nadpisze zapis.</b>' : ''}</p>
            </div>
          </aside>
        </div>
      </div>
    </main>`;
  },

  /* ---------- GŁÓWNY EKRAN GRY ---------- */
  gameScreen() {
    return `
    <div id="game-root" class="min-h-screen flex flex-col pb-28 lg:pb-10">
      <div class="lg:sticky lg:top-0 z-40">${UI.header()}${UI.tabsBar()}</div>
      ${UI.blockedBanner()}
      <main class="flex-1 w-full max-w-[1400px] mx-auto px-4 sm:px-6 py-6">${UI.activeTabContent()}</main>
      ${UI.fab()}
    </div>`;
  },

  nextWeekLabel() {
    const pending = gameState.pendingDecisions.length;
    if (pending) return { ok: false, main: '🔒 Najpierw sprawy', sub: pending + ' w Komunikatorze' };
    return { ok: true, main: 'Następny tydzień »', sub: Selectors.isMatchWeek() ? '⚽ w ten weekend gramy' : 'przedsezon' };
  },

  header() {
    const s = gameState;
    const played = s.season.table[US] && s.season.table[US].p;
    const fx = Selectors.currentFixture();
    const nw = UI.nextWeekLabel();
    const pill = (inner, extra = '') => `<div class="flex-shrink-0 rounded-xl bg-slate-800/80 border border-slate-700 px-3 py-2 ${extra}">${inner}</div>`;
    const gauge = (icon, label, v) => pill(`
      <div class="flex items-center justify-between gap-3 text-xs"><span class="text-slate-400 font-semibold">${icon} ${label}</span><span class="font-display font-bold text-base">${v}%</span></div>
      <div class="w-32">${UI.bar(v, UI.levelColor(v))}</div>
      <div class="text-[11px] text-slate-400 mt-0.5">${Selectors.moodLabel(v)}</div>`);
    return `
    <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800">
      <div class="h-1 club-stripe"></div>
      <div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-3 flex flex-col lg:flex-row lg:items-center gap-3 lg:gap-5">
        <div class="flex items-center gap-3 min-w-0 lg:w-[300px] flex-shrink-0">
          ${UI.crest(s.club.colors, s.club.name, 50)}
          <div class="min-w-0 flex-1">
            <div class="font-display text-xl font-extrabold leading-tight truncate">${Utils.escape(Selectors.clubDisplayName())}</div>
            <div class="flex flex-wrap items-center gap-1.5 mt-1">
              ${UI.chip(Selectors.leagueName(), 'accent')}
              ${UI.chip(played ? '#' + Selectors.ourPosition() + ' w tabeli' : 'przed 1. kolejką')}
              ${UI.chip('S' + s.calendar.season + ' · T' + s.calendar.week)}
            </div>
          </div>
          <div class="flex gap-1 lg:hidden">${UI.headerIcons()}</div>
        </div>

        <div class="flex-1 min-w-0 flex gap-2 overflow-x-auto no-scrollbar lg:justify-center">
          ${pill(`<div class="text-xs text-slate-400 font-semibold">💰 Budżet</div>
            <div class="font-display text-xl font-extrabold ${s.finance.budget < 0 ? 'text-red-400' : 'text-emerald-400'}">${Utils.formatMoney(s.finance.budget)}</div>
            <div class="text-[11px] text-slate-400">wypłaty ${Utils.formatMoney(Selectors.weeklyPayroll())}/tydz.</div>`)}
          ${gauge('🧦', 'Szatnia', s.morale.lockerRoom)}
          ${gauge('📣', 'Kibice', s.morale.fans)}
          ${pill(`<div class="text-xs text-slate-400 font-semibold">🧬 DNA klubu</div>
            <div class="font-semibold text-sm mt-1 max-w-[150px] leading-tight">${Utils.escape(Selectors.dnaLabel())}</div>
            ${UI.threats()}`)}
          ${pill(`<div class="text-xs text-slate-400 font-semibold">${Selectors.isMatchWeek() ? '⚽ Kolejka ' + (s.calendar.round + 1) : '⏳ Start ligi za ' + (CONFIG.preseasonWeeks + 1 - s.calendar.week) + ' tyg.'}</div>
            <div class="font-semibold text-sm mt-1 whitespace-nowrap">${fx.home ? 'vs' : '@'} ${Utils.escape(fx.rival)}${Selectors.rival(fx.rival).derby ? ' 🔥' : ''}</div>
            <div class="text-[11px] text-slate-400">${s.weather.icon} ${fx.home ? 'u siebie' : 'na wyjeździe'}</div>`, 'hidden 2xl:block')}
        </div>

        <div class="hidden lg:flex items-center gap-2 flex-shrink-0">
          <button data-action="next-week" ${nw.ok ? '' : 'disabled'}
            class="btn-press rounded-xl px-5 py-2.5 text-left ${nw.ok ? 'btn-accent shadow-lg' : 'bg-slate-800 border border-slate-700 text-slate-400 cursor-not-allowed'}">
            <div class="font-display font-extrabold text-lg leading-tight">${nw.main}</div>
            <div class="text-[11px] opacity-80">${nw.sub}</div>
          </button>
          ${UI.headerIcons()}
        </div>
      </div>
    </header>`;
  },

  headerIcons() {
    const icon = (action, glyph, title, extra = '') => `<button data-action="${action}" title="${title}" class="btn-press w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 flex items-center justify-center ${extra}">${glyph}</button>`;
    return `
      <span title="Autozapis: Tydzień ${gameState.calendar.week}" class="w-9 h-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 flex items-center justify-center">💾</span>
      ${icon('exit-menu', '⏏', 'Wyjdź do menu (zapis zostaje)')}
      ${icon('reset-game', '🗑', 'Rzuć papierami – nowa gra (kasuje zapis)', 'hover:border-red-500/50')}`;
  },

  // Ostrzeżenia: długi, komornik, walne zebranie, prokuratura
  threats() {
    const t = Selectors.debtThresholds();
    const b = gameState.finance.budget;
    const items = [];
    if (gameState.debt.deepWeeks > 0) items.push(UI.chip('☠️ Walne za ' + (CONFIG.debtGameOverWeeks - gameState.debt.deepWeeks) + ' tyg.!', 'red'));
    else if (b < t.bailiff) items.push(UI.chip('⚖️ Komornik', 'red'));
    else if (b < t.warn) items.push(UI.chip('💸 Odsetki + strajk', 'amber'));
    if (Selectors.underInvestigation()) items.push(UI.chip('🔍 Pod lupą', 'red'));
    if (gameState.season.promotionBan) items.push(UI.chip('⛔ Zakaz awansu', 'red'));
    return items.length ? `<div class="flex flex-wrap gap-1 mt-1">${items.join('')}</div>` : '';
  },

  tabBadge(id) {
    if (id === 'desk') return gameState.pendingDecisions.length;
    if (id === 'scouting') {
      const key = gameState.scouting.candidates.map((p) => p.id).join(',');
      return key && key !== gameState.ui.seenScoutKey ? gameState.scouting.candidates.length : 0;
    }
    if (id === 'virtualx') {
      const n = gameState.feed.filter((p) => p.id > (gameState.ui.seenFeedId || 0)).length;
      return n > 9 ? '9+' : n;
    }
    if (id === 'finance') return gameState.finance.budget < 0 ? '!' : 0;
    return 0;
  },

  tabsBar() {
    const items = DATA.tabs.map((t) => {
      const active = t.id === gameState.activeTab;
      const badge = UI.tabBadge(t.id);
      return `
      <button data-action="switch-tab" data-tab="${t.id}"
        class="relative flex-shrink-0 flex items-center gap-2 px-4 py-3 border-b-2 text-sm font-semibold transition-colors ${active ? 'tab-active' : 'border-transparent text-slate-400 hover:text-slate-200'}">
        <span>${t.icon}</span><span>${t.label}</span>
        ${badge ? `<span class="min-w-[20px] h-5 px-1.5 rounded-full text-[11px] font-bold flex items-center justify-center ${t.id === 'finance' ? 'bg-red-500 text-white' : 'btn-accent'}">${badge}</span>` : ''}
      </button>`;
    }).join('');
    return `
    <nav class="bg-slate-900/90 border-b border-slate-800 backdrop-blur">
      <div class="max-w-[1400px] mx-auto px-2 sm:px-4 flex overflow-x-auto no-scrollbar">${items}</div>
    </nav>`;
  },

  blockedBanner() {
    const pending = gameState.pendingDecisions.length;
    if (!pending || gameState.activeTab === 'desk') return '';
    return `
    <div class="max-w-[1400px] mx-auto w-full px-4 sm:px-6 pt-4">
      <div class="rounded-xl border border-amber-400/40 bg-amber-400/10 px-4 py-3 flex flex-wrap items-center gap-3 text-sm">
        <span class="text-amber-300 font-semibold">📲 ${pending} ${pending === 1 ? 'nieobsłużona sprawa' : 'nieobsłużone sprawy'} w Komunikatorze – tydzień nie ruszy, dopóki ich nie załatwisz.</span>
        <button data-action="switch-tab" data-tab="desk" class="btn-press ml-auto px-3 py-1.5 rounded-lg btn-accent font-semibold">Otwórz Centrum →</button>
      </div>
    </div>`;
  },

  // Pływający przycisk na telefonie
  fab() {
    const nw = UI.nextWeekLabel();
    return `
    <button id="action-bar" data-action="next-week" ${nw.ok ? '' : 'disabled'}
      class="lg:hidden fixed bottom-4 right-4 left-4 sm:left-auto z-50 btn-press rounded-2xl px-6 py-3.5 text-left shadow-2xl shadow-black/50 ${nw.ok ? 'btn-accent' : 'bg-slate-800 border border-slate-700 text-slate-400'}">
      <div class="font-display font-extrabold text-lg leading-tight">${nw.main}</div>
      <div class="text-xs opacity-80">${nw.sub}</div>
    </button>`;
  },

  activeTabContent() {
    const renderer = UI.tabRenderers[gameState.activeTab] || UI.underConstruction;
    return renderer();
  },

  // Rejestr zakładek – kolejne moduły dodają tu swój renderer.
  tabRenderers: {
    desk: () => UI.deskTab(),
    table: () => UI.tableTab(),
    finance: () => UI.financeTab(),
    staff: () => UI.staffTab(),
    squad: () => UI.squadTab(),
    scouting: () => UI.scoutingTab(),
    virtualx: () => UI.virtualXTab(),
  },

  underConstruction() {
    const tab = DATA.tabs.find((t) => t.id === gameState.activeTab);
    const idx = DATA.tabs.indexOf(tab) % DATA.underConstruction.length;
    return UI.card(tab.icon, tab.label, 'Zamknięte', `<p>${DATA.underConstruction[idx]}</p>`, 'max-w-2xl mx-auto');
  },

  /* ---------- CENTRUM DOWODZENIA (Biurko) ---------- */
  deskTab() {
    return `
    <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-[290px_minmax(0,1fr)_350px] items-start">
      <div class="order-2 xl:order-1 space-y-5">${UI.matchCenter()}${UI.miniTable()}</div>
      <div class="order-1 xl:order-2 md:col-span-2 xl:col-span-1">${UI.phone()}</div>
      <div class="order-3">${UI.timeline()}</div>
    </div>`;
  },

  matchCenter() {
    const fx = Selectors.currentFixture();
    const w = gameState.weather;
    const rival = Selectors.rival(fx.rival);
    const inPre = !Selectors.isMatchWeek();
    const us = { html: UI.crest(gameState.club.colors, gameState.club.name, 52), name: gameState.club.name };
    const them = { html: UI.crest(null, fx.rival, 52, true), name: fx.rival };
    const [home, away] = fx.home ? [us, them] : [them, us];
    const side = (t) => `<div class="flex flex-col items-center gap-2 w-24 text-center">${t.html}<div class="text-xs font-semibold leading-tight">${Utils.escape(t.name)}</div></div>`;
    const form = UI.formCircles();
    return `
    <section class="${UI.CARD} overflow-hidden">
      <div class="px-5 pt-4 flex items-center justify-between">
        <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Centrum meczowe</div>
        ${inPre ? UI.chip('Start za ' + (CONFIG.preseasonWeeks + 1 - gameState.calendar.week) + ' tyg.') : UI.chip('Kolejka ' + (gameState.calendar.round + 1), 'accent')}
      </div>
      <div class="px-5 py-4 flex items-center justify-between">
        ${side(home)}
        <div class="text-center">
          <div class="font-display text-2xl font-black text-slate-500">VS</div>

      const r = rows[i];
      const gap = last >= 0 && i - last > 1 ? '<tr><td colspan="4" class="text-center text-slate-600 text-xs py-0.5">⋯</td></tr>' : '';
      last = i;

  ticketsCard() {
    const md = gameState.matchday;
    const ticketBtns = Object.entries(DATA.tickets).map(([id, t]) => UI.choice('set-ticket', id, md.ticket === id, t.label, t.desc)).join('');
    const sausageBtns = Object.entries(DATA.sausages).map(([id, s]) =>

    const st = gameState.seasonTickets;

      const est = Engine.estimateAttendance(next.fixture);
      const holders = st.roundsLeft > 0 ? Math.min(st.holders, est) : 0;
      preview = `<p class="text-sm">Najbliższy mecz u siebie: <b>Kolejka ${next.kolejka} vs ${Utils.escape(next.fixture.rival)}</b>${Selectors.rival(next.fixture.rival).derby ? ' ' + UI.chip('🔥 KOSA – podwójne zainteresowanie!', 'red') : ''}<br>

    const ticketsInfo = st.roundsLeft > 0 ? `Karnety: ${st.holders} posiadaczy, ważne jeszcze ${st.roundsLeft} kolejek.` : 'Karnety: brak aktywnych.';

  merchCard() {
    const m = gameState.merch;
    const favorites = gameState.squad.filter((p) => p.favorite).length;
    const rows = Object.entries(DATA.merch).map(([id, item]) => {
      const cost = item.batch * item.unitCost;
      return `

      </div>`;
    }).join('');
    const frozen = Object.keys(DATA.merch).reduce((sum, id) => sum + m.stock[id] * DATA.merch[id].unitCost, 0);
    const markupBtns = Object.entries(DATA.merchMarkups).map(([id, mk]) => UI.choice('set-markup', id, m.markup === id, mk.label, '')).join('');
    return UI.card('🧣', 'Sklepik Fanowski', 'Okienko w blaszaku, czynne w dni meczowe i „jak ktoś zapuka”.', `
      ${rows}
      <p class="text-xs text-slate-400 my-4">Zamrożony kapitał w kartonach: <b class="text-slate-200">${Utils.formatMoney(frozen)}</b>. Sprzedano łącznie: ${m.soldTotal} szt. Schodzi szybciej po wygranych i w tygodnie meczów u siebie. Ulubieńcy Trybun w kadrze (${favorites}) napędzają sprzedaż koszulek.</p>
      <h4 class="font-display font-bold mb-2">Narzut</h4>
      <div class="grid gap-2">${markupBtns}</div>
    `);
  },

  sponsorCard() {
    const s = gameState.sponsor;
    const active = Selectors.sponsor();
    const body = active ? `
      <div class="rounded-xl border border-emerald-500/40 bg-emerald-500/10 p-4 mb-4">
        <div class="text-[11px] uppercase tracking-wider text-emerald-300 font-semibold">Umowa aktywna od Tygodnia ${s.signedWeek}</div>
        <div class="font-display text-xl font-bold">${Utils.escape(active.name)}</div>
        <p class="text-sm text-slate-300">Wpływ: <b>${Utils.formatMoney(Selectors.sponsorWeekly(active))}/tydz.</b> · ${active.clubPrefix ? 'Nazwa klubu: <b>' + Utils.escape(Selectors.clubDisplayName()) + '</b>' : 'Stadion: <b>' + Utils.escape(active.stadiumName) + '</b>'}</p>
        <p class="text-xs text-amber-300 mt-1">⚠️ ${Utils.escape(active.requirement)}</p>
        <div class="mt-3">${UI.smallBtn('end-sponsor', '', 'Wypowiedz umowę', false, 'stamp')}</div>
      </div>` : '';
    const offers = Object.entries(DATA.sponsors).filter(([id]) => id !== s.active).map(([id, sp]) => {
      const burned = s.burned.includes(id);
      return `
      <div class="rounded-xl bg-slate-900/50 border border-slate-700 p-4 mb-3 ${burned ? 'opacity-50' : ''}">
        <div class="flex justify-between gap-3 items-start">
          <div class="min-w-0">
            <div class="font-display font-bold text-lg leading-tight">${Utils.escape(sp.name)}</div>
            <div class="flex flex-wrap gap-1 mt-1">${UI.chip(Utils.formatMoney(Selectors.sponsorWeekly(sp)) + '/tydz.', 'green')}${UI.chip(sp.clubPrefix ? 'Dopisek: „' + Utils.escape(sp.clubPrefix) + '”' : 'Stadion: ' + Utils.escape(sp.stadiumName))}${Engine.describeEffects(sp.signEffects) ? UI.chip(Engine.describeEffects(sp.signEffects).trim(), 'amber') : ''}</div>
          </div>
          ${burned ? UI.chip('SPALONY', 'red') : UI.smallBtn('sign-sponsor', `data-id="${id}"`, 'Podpisz', !!s.active, 'accent')}
        </div>
        <p class="text-xs text-slate-400 mt-2">${Utils.escape(sp.pitch)}</p>
        <p class="text-xs text-red-300 mt-1">${Utils.escape(sp.requirement)}</p>
      </div>`;
    }).join('');
    return UI.card('🤝', 'Sponsor Tytularny', 'Lokalny biznes chętny, by jego logo oglądało 80 osób i dwie krowy. Jeden naraz.', `
      ${body}${offers}
      <p class="text-xs text-slate-400 mt-1">Skandale w kartotece klubu: <b class="text-slate-200">${gameState.club.scandals}</b>. Kto raz zerwie umowę, ten nie wraca.</p>
    `);
  },

  loansCard() {
    const L = gameState.loans;
    const row = (title, desc, status, btn) => `
      <div class="flex justify-between gap-3 items-center py-3 border-b border-slate-700/60">
        <div class="min-w-0"><div class="font-semibold">${title}</div><div class="text-xs text-slate-400">${desc}</div>${status}</div>
        <div class="flex-shrink-0">${btn}</div>
      </div>`;
    const takenRows = Object.entries(DATA.lenders).map(([id, l]) => {
      const active = L.taken.find((x) => x.id === id);
      return row(Utils.escape(l.name),
        Utils.formatMoney(l.amount) + ' → ' + l.installments + ' rat × ' + Utils.formatMoney(l.rate) + ' (oddajesz ' + Utils.formatMoney(l.installments * l.rate) + '). ' + Utils.escape(l.note),
        active ? `<div class="mt-1">${UI.chip('Spłacasz: zostało ' + active.remaining + ' rat (' + Utils.formatMoney(active.remaining * active.rate) + ')', 'red')}</div>` : '',
        UI.smallBtn('take-loan', `data-id="${id}"`, 'Pożycz', !!active));
    }).join('');
    const givenRows = Object.entries(DATA.borrowers).map(([id, b]) => {
      const active = L.given.find((x) => x.id === id);
      return row(Utils.escape(b.name),
        'Chce ' + Utils.formatMoney(b.amount) + ', odda ' + Utils.formatMoney(b.returns) + ' za ' + b.weeks + ' tyg. ' + Utils.escape(b.plea),
        active ? `<div class="mt-1">${UI.chip('Pożyczone! Zwrot: Tydzień ' + active.dueWeek + (active.delays ? ' (przesunięty ' + active.delays + '×)' : ''), 'green')}</div>` : '',
        UI.smallBtn('lend-money', `data-id="${id}"`, 'Daj', !!active || gameState.finance.budget < b.amount));
    }).join('');
    return UI.card('💸', 'Pożyczki Międzyklubowe', 'Chwilówki u prezesów. Umowa ustna, świadek: barman.', `
      <h4 class="font-display font-bold">Pożycz od innego prezesa</h4>
      ${takenRows}
      <h4 class="font-display font-bold mt-5">Pożycz komuś nasze nadwyżki</h4>
      ${givenRows}
      <p class="text-xs text-slate-400 mt-3">Raty schodzą automatycznie co tydzień. Dłużnicy czasem „zapominają”…</p>
    `);
  },

  stadiumCard() {
    const st = gameState.stadium;
    const upgrades = Object.entries(DATA.upgrades).map(([id, u]) => {
      const owned = st.upgrades[id];
      return `
      <div class="rounded-xl bg-slate-900/50 border ${owned ? 'border-emerald-500/40' : 'border-slate-700'} p-4 flex flex-col">
        <div class="flex justify-between gap-2 items-start">
          <div class="font-semibold leading-tight">${owned ? '✅ ' : ''}${Utils.escape(u.label)}</div>
          ${owned ? UI.chip('ZROBIONE', 'green') : ''}
        </div>
        <div class="font-display font-bold mt-1">${Utils.formatMoney(Selectors.upgradeCost(id))}${Selectors.upgradeCost(id) < u.cost ? ' <span class="text-xs font-sans text-emerald-300">(rabat Kółka Rolniczego)</span>' : ''}</div>
        <div class="text-xs text-slate-400 mt-1">${Utils.escape(u.desc)}</div>
        <div class="text-xs text-slate-500 mt-1">📋 Licencja: ${id === 'roller' || id === 'boiler' ? 'A-klasa – walec albo bojler; od Klasy Okręgowej – oba' : 'wymagane od ligi ' + DATA.leagueLevels[u.licenseLevel].name}</div>
        ${owned ? '' : `<div class="mt-auto pt-3">${UI.smallBtn('buy-upgrade', `data-id="${id}"`, 'Kup', gameState.finance.budget < Selectors.upgradeCost(id), 'accent')}</div>`}
      </div>`;
    }).join('');
    return UI.card('🏟️', 'Infrastruktura: ' + Utils.escape(Selectors.stadiumName()), 'Obiekt z duszą. I z kretami.', `
      <div class="grid gap-4 md:grid-cols-2 mb-4">
        <div>
          <div class="flex justify-between text-sm"><span>Stan murawy: <b>${Selectors.pitchLabel(st.pitch)}</b></span><span class="font-display font-bold">${st.pitch}%</span></div>
          ${UI.bar(st.pitch, UI.levelColor(st.pitch, 60, 30))}
          <p class="text-xs text-slate-400 mt-2">Każdy mecz u siebie niszczy murawę (w deszczu mocno). Zła murawa = loteria wyników i mniej widzów.</p>
        </div>
        <ul class="text-sm text-slate-300 space-y-1">${Selectors.facilityLabels().map((f) => `<li class="flex gap-2"><span class="accent-text">›</span>${Utils.escape(f)}</li>`).join('')}</ul>
      </div>
      <h4 class="font-display font-bold mb-2">Inwestycje</h4>
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">${upgrades}</div>
    `, 'xl:col-span-2');
  },

  /* ---------- PODSUMOWANIE KARIERY (koniec gry) ---------- */
  gameOverScreen() {
    const g = gameState.gameOver || {};
    const st = gameState.stats;
    const kpi = (icon, label, value, tone = '') => `
      <div class="${UI.CARD} p-4">
        <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">${icon} ${label}</div>
        <div class="font-display text-2xl font-extrabold mt-1 ${tone}">${value}</div>
      </div>`;
    return `
    <main class="min-h-screen px-4 py-10">
      <div class="w-full max-w-5xl mx-auto">
        <header class="text-center mb-8">
          <div class="inline-flex mb-4">${UI.crest(gameState.club.colors, gameState.club.name, 72)}</div>
          <p class="text-xs uppercase tracking-[0.35em] text-slate-400 font-semibold">Koniec kariery · Walne Zgromadzenie · Sezon ${g.season}, Tydzień ${g.week}</p>
          <h1 class="font-display text-4xl sm:text-6xl font-black tracking-tight mt-3 bg-gradient-to-r from-red-400 via-orange-300 to-red-500 bg-clip-text text-transparent leading-tight">WYWIEZIONY NA TACZCE SPOD BLASZAKA</h1>
          <p class="mt-3 text-slate-300">Taczka od Pana Heńka, eskorta: Koło Gospodyń Wiejskich. Na pożegnanie ktoś puścił disco-polo z telefonu.</p>
        </header>
        <section class="${UI.CARD} p-6 mb-6 border-red-500/40">
          <div class="flex flex-wrap items-center gap-2 mb-2">${UI.chip('ODWOŁANY', 'red')}<span class="text-sm text-slate-300"><b>${Utils.escape(Selectors.presName())}</b> · ${Utils.escape(gameState.club.name)} (${Utils.escape(gameState.club.town)})</span></div>
          <h2 class="font-display text-xl font-bold">Powód upadku</h2>
          <p class="text-slate-300 mt-1 leading-relaxed">${Utils.escape(g.reason || 'Nieznany. Protokolantka zgubiła długopis.')}</p>
        </section>
        <h2 class="font-display text-xl font-extrabold mb-3">Bilans prezesury</h2>
        <div class="grid gap-3 grid-cols-2 md:grid-cols-4 mb-8">
          ${kpi('📅', 'Pełne sezony', st.seasons)}
          ${kpi('⚽', 'Mecze', st.matches)}
          ${kpi('📈', 'W-R-P', st.wins + '-' + st.draws + '-' + st.losses)}
          ${kpi('🥅', 'Bramki', st.goalsFor + ':' + st.goalsAgainst)}
          ${kpi('🏔️', 'Najwyższa liga', DATA.leagueLevels[st.topLevel].name, 'accent-text')}
          ${kpi('📍', 'Liga przy odwołaniu', Utils.escape(g.league || ''))}
          ${kpi('↕️', 'Awanse / spadki', st.promotions + ' / ' + st.relegations)}
          ${kpi('🏆', 'Tytuły Mistrza Polski', st.titles)}
          ${kpi('🌭', 'Zjedzone kiełbaski', st.sausages)}
          ${kpi('💰', 'Stan konta', Utils.formatMoney(g.budget || 0), (g.budget || 0) < 0 ? 'text-red-400' : 'text-emerald-400')}
          ${kpi('🧬', 'DNA klubu', '„' + Utils.escape(g.dna || '') + '”')}
          ${kpi('📰', 'Skandale', gameState.club.scandals)}
        </div>
        <div class="max-w-md mx-auto text-center">
          <button data-action="restart" class="btn-press btn-accent w-full py-4 rounded-xl font-display text-xl font-extrabold shadow-lg">SPRÓBUJ JESZCZE RAZ</button>
          <p class="text-xs text-slate-500 mt-3">Zapis gry został spalony w beczce za blaszakiem.</p>
        </div>
      </div>
    </main>`;
  },
};

/* ---------------------------------------------------------------------
   6. OBSŁUGA ZDARZEŃ – delegacja po data-action
   --------------------------------------------------------------------- */
const App = {
  // Po każdej akcji: zapis + odświeżenie widoku.
  commit() {
    Storage.save();
    UI.renderAll();
  },
};

const Actions = {
  'form-set'(el) {
    const f = gameState.ui.form;
    f[el.dataset.field] = el.dataset.value;
    gameState.ui.startError = '';
    UI.renderAll();
  },

  'random-club'() {
    const c = Utils.rand(DATA.cultClubs);
    const f = gameState.ui.form;
    const listed = DATA.clubPrefixes.includes(c.prefix);
    Object.assign(f, {
      prefix: listed ? c.prefix : 'custom', customPrefix: listed ? '' : c.prefix,
      town: c.town, character: c.character, colors: c.colors,
      stadium: '', stadiumEdited: false, president: Utils.rand(DATA.presidentNames),
    });
    gameState.ui.startError = '';
    UI.renderAll();
  },

  'start-game'() {
    const f = gameState.ui.form;
    const name = Selectors.formClubName(f);
    const fail = (msg) => {
      gameState.ui.startError = msg;
      UI.renderAll();
      const box = document.querySelector('input[data-field="town"]');
      if (box) { box.classList.add('shake'); box.focus(); }
    };
    if (!f.town.trim()) return fail('Klub bez miejscowości to jak bramka bez siatki. Wpisz, skąd jesteście, Prezesie!');
    if (DATA.rivals.some((r) => r.name.toLowerCase() === name.toLowerCase())) return fail('Taki klub już gra w tej B-klasie! Wymyśl coś innego, bo Związek się pogubi.');
    const existing = Storage.load();
    if (existing && existing.club.name && !confirm('W szufladzie jest zapis klubu ' + existing.club.name + '. Nowa prezesura go nadpisze. Kontynuować?')) return;
    Engine.startGame({ name, town: f.town.trim(), character: f.character, colors: f.colors, stadium: f.stadium, president: f.president });
    App.commit();
    window.scrollTo(0, 0);
  },

  'load-game'() {
    const saved = Storage.load();
    if (!saved) return;
    gameState = saved;
    gameState.screen = 'game';
    App.commit();
    window.scrollTo(0, 0);
  },

  'clear-save'() {
    if (confirm('Spalić teczkę z zapisem? Tego nie da się cofnąć.')) {
      Storage.clear();
      UI.renderAll();
    }
  },

  'exit-menu'() {
    Storage.save();
    gameState = createInitialState();
    UI.renderAll();
  },

  'switch-tab'(el) {
    gameState.activeTab = el.dataset.tab;
    if (el.dataset.tab === 'virtualx') gameState.ui.seenFeedId = gameState.x.lastPostId;
    if (el.dataset.tab === 'scouting') gameState.ui.seenScoutKey = gameState.scouting.candidates.map((p) => p.id).join(',');
    App.commit();
  },

  'resolve-decision'(el) {
    Engine.resolveDecision(el.dataset.decision, Number(el.dataset.option));
    App.commit();
  },

  'next-week'() {
    if (Engine.nextWeek()) {
      gameState.activeTab = 'desk';
      App.commit();
      window.scrollTo(0, 0);
    }
  },

  'set-ticket'(el)   { if (DATA.tickets[el.dataset.value]) gameState.matchday.ticket = el.dataset.value; App.commit(); },
  'set-sausage'(el)  { if (DATA.sausages[el.dataset.value]) gameState.matchday.sausage = el.dataset.value; App.commit(); },
  'set-markup'(el)   { if (DATA.merchMarkups[el.dataset.value]) gameState.merch.markup = el.dataset.value; App.commit(); },
  'order-merch'(el)  { Engine.orderMerch(el.dataset.item); App.commit(); },
  'sign-sponsor'(el) { Engine.signSponsor(el.dataset.id); App.commit(); },
  'end-sponsor'() {
    const sp = Selectors.sponsor();
    if (sp && confirm('Wypowiedzieć umowę z: ' + sp.name + '? Ten sponsor już nie wróci.')) {
      Engine.endSponsor('📝 Prezes wypowiedział umowę sponsorską z: ' + sp.name + '. Trzasnęły drzwi.');
      App.commit();
    }
  },
  'take-loan'(el)    { Engine.takeLoan(el.dataset.id); App.commit(); },
  'lend-money'(el)   { Engine.lendMoney(el.dataset.id); App.commit(); },
  'buy-upgrade'(el)  { Engine.buyUpgrade(el.dataset.id); App.commit(); },

  'hire-coach'(el)   { Engine.hireCoach(el.dataset.id); App.commit(); },
  'fire-coach'(el) {
    const coach = Selectors.coach();
    const cold = el.dataset.mode === 'cold';
    if (confirm('Zwolnić trenera ' + coach.name + (cold ? ' BEZ odprawy? Szatnia się obrazi.' : ' z odprawą ' + Utils.formatMoney(Engine.severance()) + '?'))) {
      Engine.fireCoach(!cold);
      App.commit();
    }
  },
  'carpet-coach'()   { Engine.carpetCoach(); App.commit(); },
  'hire-staff'(el)   { Engine.hireStaff(el.dataset.slot); App.commit(); },
  'fire-staff'(el) {
    const m = gameState.staff[el.dataset.slot];
    if (m && confirm('Zwolnić ze sztabu: ' + m.name + '?')) { Engine.fireStaff(el.dataset.slot); App.commit(); }
  },
  'release-player'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (!p) return;
    const warn = p.legend ? ' To LEGENDA KLUBU – kibice i szatnia tego nie wybaczą!' : p.favorite ? ' To Ulubieniec Trybun – kibice się wściekną!' : '';
    if (confirm('Podziękować za grę: ' + Selectors.playerName(p) + '?' + warn)) {
      Engine.releasePlayer(p.id);
      App.commit();
    }
  },

  'send-scout'()       { Engine.sendScout(); App.commit(); },
  'upgrade-scout'()    { Engine.upgradeScout(); App.commit(); },
  'restart'() {
    Storage.clear();
    gameState = createInitialState();
    UI.renderAll();
    window.scrollTo(0, 0);
  },
  'sign-candidate'(el) { Engine.signCandidate(el.dataset.id); App.commit(); },
  'buy-youth'(el)      { Engine.buyYouthUpgrade(el.dataset.id); App.commit(); },
  'pull-junior'()      { Engine.pullJunior(); App.commit(); },
  'x-post'(el)         { Engine.officialPost(el.dataset.tone); App.commit(); },

  'reset-game'() {
    if (confirm('Na pewno rzucasz papierami? Zapis zostanie skasowany, a klub zostanie bez prezesa (znowu).')) {
      Storage.clear();
      gameState = createInitialState();
      UI.renderAll();
    }
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = Actions[el.dataset.action];
  if (handler) handler(el, e);
});

window.addEventListener('resize', () => UI.fitActionBar());

document.addEventListener('input', (e) => {
  const field = e.target.dataset && e.target.dataset.field;
  if (!field || gameState.screen !== 'start') return;
  const f = gameState.ui.form;
  f[field] = e.target.value;
  if (field === 'stadium') f.stadiumEdited = e.target.value.trim() !== '';
  const stadiumBox = document.querySelector('input[data-field="stadium"]');
  if (field === 'town' && stadiumBox && !f.stadiumEdited) stadiumBox.placeholder = Selectors.defaultStadium(f.town.trim() || '[Miejscowość]');
  const preview = document.getElementById('form-preview');
  if (preview) preview.innerHTML = UI.formPreview();
  // poprawiony formularz = stary komunikat o błędzie znika
  gameState.ui.startError = '';
  const err = document.getElementById('start-error');
  if (err) err.textContent = '';
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.field) Actions['start-game']();
});

/* START */
UI.renderAll();
</script>
</body>
</html>
