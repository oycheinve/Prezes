  // Okno transferowe na cały ekran: kupno z giełdy i sprzedaż z kadry
  transferOverlay() {
    const t = gameState.transfer;
    const offers = Selectors.transferOffers();
    const view = gameState.ui.transferView || 'buy';
    const budget = gameState.finance.budget;
    const full = gameState.squad.length >= CONFIG.maxSquad;
    const folds = gameState.ui.folds || {};
    const seg = (v, label) => `<button data-action="transfer-view" data-value="${v}" class="btn-press flex-1 h-9 rounded-md text-[12px] truncate px-1 ${view === v ? 'bg-desk-600 text-paper-100 font-semibold' : 'text-paper-400 font-medium'}">${label}</button>`;
    const btn = (action, id, label, disabled, tone) => `<button data-action="${action}" data-id="${id}" ${disabled ? 'disabled' : ''}
      class="btn-press h-9 px-3 rounded-lg text-[12.5px] font-bold whitespace-nowrap ${disabled ? 'bg-desk-700 text-paper-400 opacity-60' : tone}">${label}</button>`;
    const stat = (label, value) => `<div class="rounded-lg bg-desk-800 py-1"><div class="text-[9.5px] uppercase text-paper-400">${label}</div><div class="text-[13px] font-bold">${value}</div></div>`;
    // Karta zawodnika: wiersz + po stuknięciu charakterystyka i pełne statystyki
    const card = (p, right, extra, buttons) => {
      const ps = p.prevSeason;
      const key = 'tr-' + p.id;
      return `
      <details data-fold="${key}" class="border-b border-desk-700 last:border-0" ${folds[key] ? 'open' : ''}>
        <summary class="flex items-center gap-2 py-2 cursor-pointer select-none">
          <div class="min-w-0 flex-1">
            <div class="text-[13.5px] font-bold truncate">${Utils.escape(Selectors.playerName(p))}${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}${p.talent ? ' 💎' : ''}</div>
            <div class="text-[11px] text-paper-400 truncate">${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l. · ${Selectors.skillLabel(p.skill)}${extra ? ' · ' + extra : ''}</div>
          </div>
          <span class="text-[12.5px] font-bold whitespace-nowrap">${right}</span>
          <span class="fold-chevron text-paper-400">⌄</span>
        </summary>
        <div class="pb-2.5">
          <p class="text-[12px] italic text-paper-300 leading-snug">„${Utils.escape(p.trait)}”</p>
          <div class="grid grid-cols-4 gap-1 mt-1.5 text-center">
            ${stat('Mecze', ps ? ps.apps : p.seasonApps)}${stat('Gole', ps ? ps.goals : p.seasonGoals)}${stat('Nota', ps ? Selectors.ratingText(ps.avg) : Selectors.ratingText(Selectors.avgRating(p)))}${stat('Pensja', p.wage + ' zł')}
          </div>
          <div class="text-[10.5px] text-paper-400 mt-1">${ps ? 'Zeszły sezon' + (p.fromClub ? ' w ' + Utils.escape(p.fromClub) : '') : 'Bieżący sezon'} · profil: ${DATA.profiles[p.profile].label}${p.apps ? ' · w klubie: ' + p.apps + ' m, ' + p.goals + ' g' : ''}${p.loan ? ' · wypożyczenie z ' + Utils.escape(p.loan.from) + ' do końca sezonu' : ''}</div>
          ${buttons ? `<div class="flex gap-1.5 mt-2 justify-end">${buttons}</div>` : ''}
        </div>
      </details>`;
    };
    let rows = '';
    if (view === 'offers') {
      const news = (t.news || []).map((l) => `<li class="text-[12px] text-paper-200 leading-snug">• ${Utils.escape(l)}</li>`).join('');
      rows = (news ? `<ul class="rounded-xl bg-desk-800 px-3 py-2 my-2 space-y-1">${news}</ul>` : '') + (offers.map((id) => {
        const d = DATA.decisions[id];
        const opts = d.options.map((o, i) => `
          <button data-action="resolve-decision" data-decision="${d.id}" data-option="${i}" class="btn-press w-full text-left px-3 py-2 rounded-xl bg-desk-800 border border-desk-600">
            <span class="block text-[13px] font-semibold text-paper-100 leading-snug">${Utils.escape(Utils.val(o.label))}</span>
            <span class="block text-[11px] text-paper-400 leading-snug">${Utils.escape(Utils.val(o.hint))}</span>
          </button>`).join('');
        return `
        <article class="py-3 border-b border-desk-700 last:border-0">
          <div class="flex items-center gap-2"><span class="text-[26px]">${d.cutscene.icon}</span><div class="min-w-0"><div class="text-[15px] font-extrabold">${Utils.escape(Utils.val(d.title))}</div><div class="text-[11px] text-paper-400 truncate">${Utils.escape(Utils.val(d.from))}</div></div></div>
          <p class="text-[12.5px] italic text-paper-300 leading-snug mt-1.5">${Utils.escape(Utils.val(d.body))}</p>
          ${d.player ? UI.playerCard(d.player(), true) : ''}
          <div class="grid gap-1.5 mt-2">${opts}</div>
        </article>`;
      }).join('') || '<p class="text-[12.5px] text-paper-400 py-2">Wszystkie oferty i żądania rozpatrzone.</p>');
    } else if (view === 'buy') {
      rows = t.market.map((p) => card(p, Utils.formatMoney(p.fee), p.wage + ' zł/tydz.', btn('buy-transfer', p.id, 'Kup za ' + Utils.formatMoney(p.fee), full || budget < p.fee, 'bg-amber-glow text-ink-900'))).join('')
        || '<p class="text-[12.5px] text-paper-400 py-2">Giełda pusta – wszyscy już kupieni.</p>';
    } else if (view === 'loan') {
      rows = '<p class="text-[11px] text-paper-400 mt-2">Młodzi i zdolni z wyższych lig na jeden sezon. Płacisz opłatę i połowę pensji, po sezonie wracają do siebie.</p>'
        + (t.loanMarket.map((p) => card(p, Utils.formatMoney(p.fee), '🔁 ' + Utils.escape(p.loan.from), btn('loan-in', p.id, 'Wypożycz za ' + Utils.formatMoney(p.fee), full || budget < p.fee, 'bg-amber-glow text-ink-900'))).join('')
        || '<p class="text-[12.5px] text-paper-400 py-2">Wszyscy chętni już wypożyczeni.</p>')
        + (gameState.loansOut.length ? `<div class="text-[10.5px] uppercase tracking-wide text-paper-400 font-semibold mt-3">Nasi na wypożyczeniu</div>` + gameState.loansOut.map((l) => `<div class="text-[12px] py-1 text-paper-300">📤 ${Utils.escape(Selectors.playerName(l.player))} → ${Utils.escape(l.club)} (wraca po sezonie ${l.until})</div>`).join('') : '');
    } else {
      const canGo = gameState.squad.length > CONFIG.minSquad;
      rows = gameState.squad.slice().sort((a, b) => DATA.positions[a.pos].order - DATA.positions[b.pos].order || b.skill - a.skill).map((p) => {
        const star = p.id === gameState.star.playerId;
        const price = star ? Selectors.starFee(p) : Selectors.sellPrice(p);
        if (p.loan) return card(p, '🔁', 'wypożyczony', '');
        return card(p, Utils.formatMoney(price), star ? (gameState.star.promised ? '🌟 obiecany transfer' : '🔥 buntownik') : p.wage + ' zł/tydz.',
          (star ? '' : btn('loan-out', p.id, 'Wypożycz +' + Utils.formatMoney(Selectors.loanOutFee(p)), !canGo, 'bg-desk-600 text-paper-100'))
          + btn('sell-transfer', p.id, 'Sprzedaj ' + Utils.formatMoney(price), !canGo, 'bg-stamp text-white'));
      }).join('');
    }
    return UI.overlayFrame(`
      <div class="flex-shrink-0 px-4 pt-5 text-paper-100">
        <div class="text-center text-[10.5px] uppercase tracking-[0.2em] text-amber-glow font-semibold">Okno transferowe · przed sezonem ${t.season}</div>
        <h2 class="text-center text-[22px] font-extrabold tracking-tight mt-1">🔁 Giełda zawodników</h2>
        <div class="grid grid-cols-3 gap-1.5 mt-2 text-center">
          <div class="rounded-xl bg-desk-800 py-1.5"><div class="text-[10px] uppercase text-paper-400">Kasa</div><b class="text-[14px] ${budget < 0 ? 'text-stamp' : ''}">${Utils.formatMoney(budget)}</b></div>
          <div class="rounded-xl bg-desk-800 py-1.5"><div class="text-[10px] uppercase text-paper-400">Kadra</div><b class="text-[14px]">${gameState.squad.length}/${CONFIG.maxSquad}</b></div>
          <div class="rounded-xl bg-desk-800 py-1.5"><div class="text-[10px] uppercase text-paper-400">Przyszło / odeszło</div><b class="text-[14px]">${t.bought} / ${t.sold}</b></div>
        </div>
        <div class="flex gap-1 p-0.5 mt-2 rounded-lg bg-desk-800">${seg('offers', '📨 Oferty' + (offers.length ? ' (' + offers.length + ')' : ''))}${seg('buy', '🛒 Kupuj')}${seg('loan', '🤝 Wypożycz')}${seg('sell', '💸 Sprzedaj')}</div>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto px-4 mt-1 text-paper-100">${rows}</div>
      <div class="flex-shrink-0 px-4 pb-4 pt-2">
        <button data-action="overlay-close" class="btn-press w-full h-12 rounded-xl bg-amber-glow text-ink-900 text-[16px] font-extrabold tracking-wider">ZAMKNIJ GIEŁDĘ</button>
        <p class="text-center text-[10.5px] text-paper-400 mt-1">Otwarte do pierwszego gwizdka · wejście z zakładki Kadra${offers.length ? ' · oferty czekają na decyzję' : ''}</p>
      </div>`, 'bg-desk-900');
  },

  outcomeOverlay(o) {
    return UI.overlayFrame(`
      <div class="flex-1 min-h-0 overflow-y-auto px-5 py-6 text-paper-100 flex flex-col justify-center">
        <div class="text-center text-[52px] leading-none">${o.icon}</div>
        <div class="text-center text-[10.5px] uppercase tracking-[0.2em] text-amber-glow font-semibold mt-3">Skutki decyzji</div>
        <h2 class="text-center text-[20px] font-extrabold tracking-tight mt-1">${Utils.escape(o.title)}</h2>
        <ul class="mt-4 space-y-2">${o.lines.map((l) => `<li class="text-[14px] leading-snug text-paper-200">${Utils.escape(l)}</li>`).join('')}</ul>
      </div>
      <div class="flex-shrink-0 px-4 pb-4 pt-2">
        <button data-action="overlay-close" class="btn-press w-full h-14 rounded-xl bg-amber-glow text-ink-900 text-[17px] font-extrabold tracking-wider">KONTYNUUJ</button>
      </div>`, 'bg-[#0b0f16]');
  },

  // Nagłówek w dwóch linijkach: klub + liczby i najbliższy mecz
  appHeader() {
    const s = gameState;
    const played = s.season.table[US] && s.season.table[US].p;
    const fx = Selectors.currentFixture();
    const rival = Selectors.rival(fx.rival);
    const inPre = !Selectors.isMatchWeek();
    const mood = (label, v) => `
      <div class="min-w-0">
        <div class="flex items-baseline gap-1 leading-none"><span class="text-[10px] text-paper-400">${label}</span><b class="text-[13px] ${v < 25 ? 'text-stamp' : 'text-paper-100'}">${v}%</b></div>
        <div class="h-[3px] rounded-full bg-desk-700 mt-1 overflow-hidden"><div class="h-full rounded-full ${Selectors.moodColor(v)}" style="width:${v}%"></div></div>
      </div>`;
    return `
    <header class="flex-shrink-0 bg-desk-900 border-b border-desk-700 px-2.5 py-1.5">
      <div class="flex items-center gap-2 h-7">
        ${UI.crest(s.club.colors, s.club.name, 20)}
        <div class="min-w-0 flex-1 flex items-baseline gap-1.5">
          <span class="text-[14px] font-bold truncate">${Utils.escape(Selectors.clubDisplayName())}</span>
          <span class="text-[11px] text-paper-400 whitespace-nowrap">${played ? Selectors.ourPosition() + '. msc' : Selectors.leagueName()}</span>
        </div>
        <span class="text-[11px] text-paper-400 whitespace-nowrap">S${s.calendar.season} · T${s.calendar.week}</span>
        <button data-action="exit-menu" title="Wyjdź do menu (zapis zostaje)" class="btn-press w-7 h-7 rounded-md text-[13px] text-paper-400 hover:bg-desk-800">⏏</button>
        <button data-action="reset-game" title="Rzuć papierami (nowa gra)" class="btn-press w-7 h-7 rounded-md text-[13px] text-paper-400 hover:bg-desk-800">🗑</button>
      </div>
      <div class="grid grid-cols-[auto_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1.7fr)] items-center gap-2.5 mt-0.5">
        <div class="leading-none whitespace-nowrap"><span class="text-[10px] text-paper-400">Kasa</span> <b class="text-[13px] ${s.finance.budget < 0 ? 'text-stamp' : 'text-paper-100'}">${Utils.formatMoney(s.finance.budget)}</b></div>
        ${mood('Szatnia', s.morale.lockerRoom)}
        ${mood('Kibice', s.morale.fans)}
        <div class="text-[11px] text-paper-300 truncate text-right">${s.weather.icon} <b class="text-paper-100">${inPre ? 'Liga za ' + (CONFIG.preseasonWeeks + 1 - s.calendar.week) + ' tyg.' : 'K' + (s.calendar.round + 1)}</b> ${fx.home ? 'vs' : '@'} ${Utils.escape(fx.rival)}${rival.derby ? ' 🔥' : ''}</div>
      </div>
      ${UI.threats()}
    </header>`;
  },

  tabBadge(id) {
    if (id === 'desk') return gameState.pendingDecisions.length;
    if (id === 'finance') return gameState.finance.budget < 0 ? '!' : 0;
    if (id === 'scouting') {
      const key = gameState.scouting.candidates.map((p) => p.id).join(',');
      return key && key !== gameState.ui.seenScoutKey ? gameState.scouting.candidates.length : 0;
    }
    if (id === 'virtualx') {
      const n = gameState.feed.filter((p) => p.id > (gameState.ui.seenFeedId || 0)).length;
      return n > 9 ? '9+' : n;
    }
    return 0;
  },

  // Stały dok: przycisk tygodnia + nawigacja (nie nachodzi na obszar roboczy)
  appDock() {
    const canAdvance = Engine.canAdvanceWeek();
    const pending = gameState.pendingDecisions.length;
    const short = { desk: 'Biurko', table: 'Tabela', finance: 'Finanse', staff: 'Sztab', squad: 'Kadra', scouting: 'Skauting', virtualx: 'X' };
    const tabs = DATA.tabs.map((t) => {
      const active = t.id === gameState.activeTab;
      const badge = UI.tabBadge(t.id);
      return `
      <button data-action="switch-tab" data-tab="${t.id}" aria-label="${t.label}"
        class="relative h-11 flex flex-col items-center justify-center min-w-0 ${active ? 'text-amber-glow' : 'text-paper-400'}">
        <span class="text-[15px] leading-none ${active ? '' : 'opacity-70'}">${t.icon}</span>
        <span class="text-[10px] mt-0.5 ${active ? 'font-semibold' : 'font-medium'} truncate max-w-full">${short[t.id] || t.label}</span>
        ${badge ? `<span class="absolute top-0.5 right-1 min-w-[15px] h-[15px] px-1 rounded-full text-[9px] font-bold flex items-center justify-center ${t.id === 'finance' ? 'bg-stamp text-white' : 'bg-amber-glow text-ink-900'}">${badge}</span>` : ''}
      </button>`;
    }).join('');
    return `
    <footer id="mobile-dock" class="flex-shrink-0 bg-desk-900 border-t border-desk-700" style="padding-bottom: env(safe-area-inset-bottom);">
      <div class="px-2.5 pt-1.5">
        <button data-action="${canAdvance ? 'next-week' : 'switch-tab'}" ${canAdvance ? '' : 'data-tab="desk" data-view="decisions"'}
          class="btn-press w-full h-10 rounded-lg text-[14px] font-bold tracking-wide ${canAdvance ? 'bg-amber-glow text-ink-900' : 'bg-desk-800 text-amber-glow'}">
          ${canAdvance ? (Selectors.isMatchWeek() ? 'Następny tydzień » mecz' : 'Następny tydzień »') : '🔒 Najpierw ' + pending + ' ' + (pending === 1 ? 'sprawa' : 'sprawy') + ' na Biurku'}
        </button>
      </div>
      <nav class="grid grid-cols-7">${tabs}</nav>
    </footer>`;
  },

  activeTabContent() {
    const renderer = UI.tabRenderers[gameState.activeTab] || UI.underConstruction;
    return renderer();
  },

  // Rejestr zakładek – kolejne moduły dodają tu swój renderer.
  tabRenderers: {
    desk: () => UI.deskTab(),
    table: () => UI.tableTab(),
    finance: () => UI.financeTab(),
    staff: () => UI.staffTab(),
    squad: () => UI.squadTab(),
    scouting: () => UI.scoutingTab(),
    virtualx: () => UI.virtualXTab(),
  },

  underConstruction() {
    const tab = DATA.tabs.find((t) => t.id === gameState.activeTab);
    const idx = DATA.tabs.indexOf(tab) % DATA.underConstruction.length;
    return UI.panel(tab.icon + ' ' + tab.label, '', `
      <p class="text-[13px]">${DATA.underConstruction[idx]}</p>
      <p class="text-[11px] text-ink-700 mt-2">Na drzwiach kartka: „Wracam za 5 min” — data: lipiec 2017.</p>`);
  },

  /* ---------- Wspólne klocki UI (gęste, mobilne) ---------- */
  // Podwidok zakładki zapamiętany w gameState.ui.sub
  sub(tab, def) {
    const v = (gameState.ui.sub || {})[tab];
    return v || def;
  },

  segs(action, current, items, attrs = '') {
    return `
    <div class="grid gap-0.5 p-0.5 mb-2 rounded-lg bg-desk-800" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))">
      ${items.map(([v, label]) => `<button data-action="${action}" data-value="${v}" ${attrs}
        class="btn-press h-8 px-1 rounded-md text-[12px] truncate ${current === v ? 'bg-desk-600 text-paper-100 font-semibold' : 'text-paper-400 font-medium'}">${label}</button>`).join('')}
    </div>`;
  },

  subSegs(tab, current, items) {
    return UI.segs('sub-view', current, items, `data-tab="${tab}"`);
  },

  panel(title, note, body, right = '', extraClass = '') {
    return `
    <section class="paper px-2.5 py-2 mb-2 ${extraClass}">
      ${title ? `<div class="flex items-baseline justify-between gap-2 mb-1"><h3 class="text-[13px] font-bold leading-tight min-w-0">${title}</h3>${right}</div>` : ''}
      ${note ? `<p class="text-[11px] text-ink-700 leading-snug mb-1.5">${note}</p>` : ''}
      ${body}
    </section>`;
  },

  tile(label, value, sub = '', valueClass = '') {
    return `
    <div class="paper px-2 py-1.5 min-w-0">
      <div class="text-[10px] uppercase tracking-wide text-ink-700 font-medium truncate">${label}</div>
      <div class="text-[15px] font-bold leading-tight truncate ${valueClass}">${value}</div>
      ${sub ? `<div class="text-[10.5px] text-ink-700 truncate">${sub}</div>` : ''}
    </div>`;
  },

  tiles(list, cols = 3) {
    return `<div class="grid gap-1.5 mb-2" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${list.join('')}</div>`;
  },

  // Wiersz listy: tytuł, opis, przycisk po prawej
  row(title, sub, right = '', extraClass = '') {
    return `
    <div class="flex items-center gap-2 py-1.5 border-b border-paper-300 last:border-0 ${extraClass}">
      <div class="min-w-0 flex-1">
        <div class="text-[12.5px] font-semibold leading-tight">${title}</div>
        ${sub ? `<div class="text-[11px] text-ink-700 leading-snug">${sub}</div>` : ''}
      </div>
      ${right ? `<div class="flex-shrink-0">${right}</div>` : ''}
    </div>`;
  },

  h4(text) {
    return `<h4 class="text-[11px] uppercase tracking-wide font-semibold text-ink-700 mt-2 mb-1">${text}</h4>`;
  },

  choice(action, value, active, title, desc) {
    return `
    <button data-action="${action}" data-value="${value}"
      class="btn-press w-full min-w-0 text-left px-2 py-1.5 border rounded-lg ${active ? 'border-amber-glow bg-amber-glow/15' : 'border-paper-300 bg-white'}">
      <span class="block text-[12px] leading-tight ${active ? 'font-bold' : 'font-semibold'}">${title}</span>
      ${desc ? `<span class="block text-[10.5px] leading-snug text-ink-700 mt-0.5">${desc}</span>` : ''}
    </button>`;
  },

  // Kafelki wyboru w jednym rzędzie; pełny opis tylko dla aktywnej opcji
  choiceRow(action, entries, current, title, desc) {
    const active = entries.find(([id]) => id === current);
    return `
      <div class="grid gap-1.5" style="grid-template-columns:repeat(${entries.length},minmax(0,1fr))">
        ${entries.map(([id, x]) => UI.choice(action, id, id === current, title(x, id), '')).join('')}
      </div>
      ${active ? `<p class="text-[11px] text-ink-700 leading-snug mt-1">${desc(active[1], active[0])}</p>` : ''}`;
  },

  smallBtn(action, attrs, label, disabled, variant = 'ink') {
    const colors = variant === 'stamp'
      ? 'bg-stamp text-paper-100 hover:bg-red-700'
      : 'bg-ink-900 text-paper-100 hover:bg-ink-700';
    return `<button data-action="${action}" ${attrs} ${disabled ? 'disabled' : ''}
      class="btn-press h-8 px-2.5 text-[12px] font-semibold rounded-md whitespace-nowrap ${disabled ? 'bg-paper-300 text-ink-700 opacity-60 cursor-not-allowed' : colors}">${label}</button>`;
  },

  bar(value, colorClass) {
    return `<div class="h-1 rounded-full bg-paper-300 mt-1 overflow-hidden"><div class="h-full rounded-full ${colorClass}" style="width:${Utils.clamp(value, 0, 100)}%"></div></div>`;
  },

  profileBadge(profile) {
    const pr = DATA.profiles[profile];
    const tone = { off: 'bg-rose-600 text-white', def: 'bg-sky-700 text-white', uni: 'bg-paper-300 text-ink-900' }[profile];
    return `<span class="inline-block px-1 rounded text-[9.5px] leading-[15px] font-bold ${tone}" title="Pasuje do: ${pr.label}">${pr.short}</span>`;
  },

  ratingBadge(r, prefix = '') {
    const tone = r == null ? 'bg-paper-300 text-ink-700' : r >= 7.5 ? 'bg-grass text-white' : r >= 6 ? 'bg-ink-900 text-paper-100' : r >= 4.5 ? 'bg-amber-400 text-ink-900' : 'bg-stamp text-white';
    return `<span class="inline-block px-1.5 rounded text-[11px] leading-[17px] font-bold whitespace-nowrap ${tone}">${prefix}${Selectors.ratingText(r)}</span>`;
  },

  formDots() {
    return gameState.record.form.map((r) => `<span class="inline-block w-2 h-2 rounded-full mr-0.5 ${{ W: 'bg-grass', D: 'bg-amber-400', L: 'bg-stamp' }[r]}" title="${{ W: 'Wygrana', D: 'Remis', L: 'Porażka' }[r]}"></span>`).join('');
  },

  /* ---------- ZAKŁADKA: BIURKO ---------- */
  deskTab() {
    const pending = gameState.pendingDecisions.length;
    // Jeden widok naraz: sprawy, gdy coś czeka, inaczej pulpit klubu (chyba że gracz wybrał sam).
    const view = gameState.ui.deskView === 'club' || (gameState.ui.deskView !== 'decisions' && !pending) ? 'club' : 'decisions';
    return UI.segs('desk-view', view, [['decisions', '❗ Sprawy' + (pending ? ' (' + pending + ')' : '')], ['club', '🏠 Klub']])
      + (view === 'decisions' ? UI.decisions() : UI.clubDashboard());
  },

  // Jedna sprawa naraz – mieści się na ekranie razem z odpowiedziami
  decisions() {
    const pending = gameState.pendingDecisions;
    if (pending.length === 0) {
      return UI.panel('Biurko puste.', 'Tylko kubek z napisem „Najlepszy Dziadek” i pieczątka klubowa bez tuszu.',
        `<button data-action="desk-view" data-value="club" class="btn-press w-full h-9 mt-1 rounded-md bg-ink-900 text-paper-100 text-[13px] font-semibold">🏠 Pulpit klubu</button>`);
    }
    const d = DATA.decisions[pending[0]];
    const opts = d.options.map((o, i) => `
      <button data-action="resolve-decision" data-decision="${d.id}" data-option="${i}"
        class="btn-press w-full min-w-0 text-left px-3 py-2 bg-white active:bg-paper-300 border border-paper-300 rounded-lg [overflow-wrap:anywhere]">
        <span class="text-[13.5px] font-semibold block leading-snug">${Utils.escape(Utils.val(o.label))}</span>
        <span class="text-[11px] text-ink-700 leading-snug block">${Utils.escape(Utils.val(o.hint))}</span>
      </button>`).join('');
    const rest = pending.slice(1).map((id) => Utils.escape(Utils.val(DATA.decisions[id].title))).join(' · ');
    return `
      <article class="paper px-3 py-2.5">
        <div class="flex justify-between gap-2 text-[10.5px] text-ink-700">
          <span class="truncate">Od: ${Utils.escape(Utils.val(d.from))}</span>
          ${pending.length > 1 ? `<span class="whitespace-nowrap font-semibold">1 / ${pending.length}</span>` : ''}
        </div>
        <div class="text-[10.5px] text-ink-700 truncate">Do: ${Utils.escape(Selectors.presName())}, ${Utils.escape(Selectors.clubDisplayName())}</div>
        <h3 class="text-[16px] font-bold leading-tight mt-1 mb-1">${Utils.escape(Utils.val(d.title))}</h3>
        <p class="text-[13px] leading-snug text-ink-700 mb-2">${Utils.escape(Utils.val(d.body))}</p>
        ${d.player ? `<div class="-mt-1 mb-2">${UI.playerCard(d.player())}</div>` : ''}
        <div class="grid gap-1.5">${opts}</div>
      </article>
      ${rest ? `<p class="text-[11px] text-paper-400 mt-1.5 truncate">Dalej czeka: ${rest}</p>` : ''}
      ${d.player ? '' : `<div class="mt-2">${UI.tiles(UI.clubTiles().slice(0, 3))}</div>`}
      ${UI.recentEvents()}`;
  },

  // Kafelki pulpitu: cały klub na jeden rzut oka (pierwsze trzy także pod sprawą na Biurku)
  clubTiles() {
    const s = gameState;
    const rep = s.lastReport;
    const row = s.season.table[US] || { p: 0, w: 0, d: 0, l: 0 };
    const chem = Engine.chemistry(Selectors.projectedLineup());
    const sp = Selectors.sponsor();
    const dna = s.club.professionalism;
    return [
      UI.tile('Pozycja', row.p ? Selectors.ourPosition() + '.' : '–', Selectors.leagueName()),
      UI.tile('Bilans tyg.', rep ? Utils.signedMoney(rep.total) : '–', 'wypłaty ' + Utils.formatMoney(Selectors.weeklyPayroll()), rep ? (rep.total < 0 ? 'text-stamp' : 'text-grass') : ''),
      UI.tile('Mecze W-R-P', row.w + '-' + row.d + '-' + row.l, UI.formDots() || 'jeszcze bez formy'),
      UI.tile('Chemia', chem + '%', Selectors.chemLabel(chem)),
      UI.tile('Kadra', s.squad.length + '/' + CONFIG.maxSquad, 'baza szatni ' + Selectors.lockerBaseline() + '%'),
      UI.tile('Murawa', s.stadium.pitch + '%', Selectors.pitchLabel(s.stadium.pitch)),
      UI.tile('Prognoza', Selectors.seasonPreview().pos + '. msc', '★'.repeat(Selectors.seasonPreview().stars) + '☆'.repeat(5 - Selectors.seasonPreview().stars) + ' media'),
      UI.tile('Sponsor', sp ? Utils.formatMoney(Selectors.sponsorWeekly(sp)) : 'brak', sp ? Utils.escape(sp.name) : 'nikt nie płaci'),
      UI.tile('DNA klubu', (dna > 0 ? '+' : '') + dna, '„' + Utils.escape(Selectors.dnaLabel()) + '”'),
    ];
  },

  clubDashboard() {
    const s = gameState;
    const fx = Selectors.currentFixture();
    const rival = Selectors.rival(fx.rival);
    const inPre = !Selectors.isMatchWeek();
    const tiles = UI.tiles(UI.clubTiles());
    const match = UI.panel(`${s.weather.icon} ${inPre ? 'Start ligi za ' + (CONFIG.preseasonWeeks + 1 - s.calendar.week) + ' tyg.' : 'Kolejka ' + (s.calendar.round + 1)} · ${fx.home ? 'vs' : '@'} ${Utils.escape(fx.rival)}${rival.derby ? ' <span class="text-stamp">🔥 KOSA</span>' : ''}`, '',
      `<p class="text-[11.5px] text-ink-700">${fx.home ? 'u siebie' : 'wyjazd'}${!inPre && fx.home ? ' · ~' + Engine.estimateAttendance(fx) + ' widzów' : ''} · ${Utils.escape(s.weather.label)}</p>`);

    return tiles + match + UI.recentEvents() + `<p class="text-[10.5px] text-grass text-center">💾 Autozapis: Tydzień ${s.calendar.week}</p>`;
  },

  // Ostatnie wydarzenia: jedna linijka na tydzień – wynik meczu i bilans kasy (z wpisów, które zapisuje silnik)
  weekDigest(week) {
    const entries = gameState.log.filter((e) => e.week === week);
    const match = entries.find((e) => e.type === 'match' && e.text.startsWith('⚽'));
    const summary = entries.find((e) => e.type === 'summary' && e.text.includes('Bilans tygodnia'));
    let result = '<span class="text-ink-700">Bez meczu</span>';
    const m = match && match.text.match(/^⚽ Kolejka \d+(?: \(🔥 KOSA\))?: (.+) (\d+):(\d+) (.+?) \((u siebie|wyjazd)/);
    if (m) {
      const home = m[5] === 'u siebie';
      const gf = +(home ? m[2] : m[3]), ga = +(home ? m[3] : m[2]);
      const rival = home ? m[4] : m[1];
      const [label, tone] = gf > ga ? ['Wygrana', 'text-grass'] : gf < ga ? ['Porażka', 'text-stamp'] : ['Remis', 'text-ink-700'];
      result = `<b class="${tone}">${label} ${gf}:${ga}</b> ${home ? 'z' : '@'} ${Utils.escape(rival)}`;
    }
    const cash = summary && summary.text.match(/Bilans tygodnia: (.+?) zł/);
    const money = cash ? `<span class="whitespace-nowrap font-semibold ${cash[1].startsWith('-') ? 'text-stamp' : 'text-grass'}">${Utils.escape(cash[1])} zł</span>` : '<span class="text-ink-700">–</span>';
    return `
      <li class="flex items-center gap-2 h-7 border-b border-paper-300 last:border-0 text-[12px]">
        <span class="w-8 flex-shrink-0 text-[11px] font-bold text-ink-700">T${week}</span>
        <span class="flex-1 min-w-0 truncate">${result}</span>
        <span class="text-[10.5px] text-ink-700">Kasa</span>${money}
      </li>`;
  },

  recentEvents() {
    const weeks = [...new Set(gameState.log.map((e) => e.week))]
      .filter((w) => w < gameState.calendar.week).slice(0, 3);
    if (!weeks.length) return '';
    return UI.panel('Ostatnie wydarzenia', '', `<ul>${weeks.map((w) => UI.weekDigest(w)).join('')}</ul>`);
  },

  /* ---------- ZAKŁADKA: TABELA ---------- */
  tableTab() {
    const view = UI.sub('table', 'table');
    const segs = UI.subSegs('table', view, [['table', '📊 Tabela'], ['fixtures', '📅 Terminarz'], ['stats', '★ Statystyki']]);
    const pv = Selectors.seasonPreview();
    const title = `<p class="text-[11px] text-paper-400 mb-1">${Selectors.leagueName()} · Sezon ${gameState.calendar.season} · Wywieszona na drzwiach remizy. Ktoś długopisem dopisał nam 3 punkty – nieważne.</p>
      <div class="rounded-lg bg-desk-800 px-2.5 py-1.5 mb-1.5 text-[11.5px] text-paper-200 leading-snug">📰 <b>Prognoza przed sezonem:</b> ${pv.pos}. miejsce · <span class="text-amber-glow">${'★'.repeat(pv.stars)}${'☆'.repeat(5 - pv.stars)}</span> · kurs na awans <b>${pv.odds}</b><br><span class="italic text-paper-400">${pv.quote}</span></div>`;
    if (view === 'fixtures') return segs + title + UI.fixturesView();
    if (view === 'stats') return segs + UI.teamStatsCard();

    const top = gameState.club.leagueLevel < DATA.leagueLevels.length - 1;
    const rows = Selectors.standings().map((r, i) => {
      const us = r.team === US;
      const rival = Selectors.rival(r.team);
      const edge = i < CONFIG.promotionSpots && top ? 'border-l-grass' : i === 9 ? 'border-l-stamp' : 'border-l-transparent';
      return `
      <tr class="border-b border-paper-300 last:border-0 ${us ? 'bg-amber-glow/25 font-bold' : ''}">
        <td class="py-[5px] pl-1 pr-1 text-right border-l-[3px] ${edge}">${i + 1}.</td>
        <td class="py-[5px] pr-1 max-w-0 w-full truncate">${Utils.escape(Selectors.teamName(r.team))}${rival && rival.derby ? ' <span class="text-stamp">🔥</span>' : ''}</td>
        <td class="text-center px-1">${r.p}</td><td class="text-center px-1 text-ink-700">${r.w}</td><td class="text-center px-1 text-ink-700">${r.d}</td><td class="text-center px-1 text-ink-700">${r.l}</td>
        <td class="text-center px-1 whitespace-nowrap">${r.gf}:${r.ga}</td>
        <td class="text-right pr-1.5 font-bold">${r.pts}</td>
      </tr>`;
    }).join('');
    return segs + title + `
      <section class="paper py-1 mb-2 overflow-hidden">
        <table class="w-full text-[12px]">
          <tr class="text-[10px] uppercase text-ink-700"><th></th><th class="text-left">Drużyna</th><th>M</th><th>W</th><th>R</th><th>P</th><th>Br</th><th class="text-right pr-1.5">Pkt</th></tr>
          ${rows}
        </table>
      </section>
      <p class="text-[10.5px] text-paper-400 leading-snug"><span class="inline-block w-2 h-2 bg-grass align-middle"></span> ${top ? 'Miejsca 1–' + CONFIG.promotionSpots + ': awans do ligi ' + DATA.leagueLevels[gameState.club.leagueLevel + 1].name : 'Miejsce 1: Mistrz Polski'}
        · <span class="inline-block w-2 h-2 bg-stamp align-middle"></span> ${gameState.club.leagueLevel > 1 ? 'Miejsce 10: spadek do ligi ' + DATA.leagueLevels[gameState.club.leagueLevel - 1].name : 'Miejsce 10: wstyd na cały powiat'}
        ${gameState.season.promotionBan ? ' · <b class="text-stamp">⛔ ZAKAZ AWANSU (afera)</b>' : ''}</p>
      <p class="text-[10.5px] text-paper-400 mt-0.5 leading-snug">Drabina: ${DATA.leagueLevels.slice(1).map((l, i) => i + 1 === gameState.club.leagueLevel ? '<b class="text-paper-100">' + l.name + '</b>' : l.name).join(' → ')}</p>`;
  },

  fixturesView() {
    const results = gameState.season.lastResults.map((m) => {
      const us = m.home === US || m.away === US;
      return `<li class="flex gap-1 ${us ? 'font-bold' : ''}"><span class="flex-1 min-w-0 truncate text-right">${Utils.escape(Selectors.teamName(m.home))}</span><b class="w-10 text-center">${m.hg}:${m.ag}</b><span class="flex-1 min-w-0 truncate">${Utils.escape(Selectors.teamName(m.away))}</span></li>`;
    }).join('');
    const upcoming = [];
    for (let i = gameState.calendar.round; i < Math.min(gameState.calendar.round + 6, gameState.season.rounds.length); i++) {
      const f = Selectors.fixtureAt(i);
      upcoming.push(`<li class="flex gap-2"><span class="w-8 text-ink-700">K${i + 1}</span><span class="w-16 text-ink-700">${f.home ? 'u siebie' : 'wyjazd'}</span><b class="flex-1 min-w-0 truncate">${Utils.escape(f.rival)}</b>${Selectors.rival(f.rival).derby ? '<span class="text-stamp">🔥 KOSA</span>' : ''}</li>`);
    }
    return UI.panel('⚽ Ostatnia kolejka', 'Wyniki zebrane telefonicznie przez pana Ryśka', results ? `<ul class="text-[12px] space-y-0.5">${results}</ul>` : '<p class="text-[12px]">Liga jeszcze nie ruszyła.</p>', UI.formDots() ? `<span class="whitespace-nowrap">${UI.formDots()}</span>` : '')
      + UI.panel('📅 Najbliższe mecze', 'Terminarz z faksu Związku', upcoming.length ? `<ul class="text-[12px] space-y-0.5">${upcoming.join('')}</ul>` : '<p class="text-[12px]">Koniec sezonu.</p>');
  },

  // Strzelcy i średnie noty naszej drużyny
  teamStatsCard() {
    const squad = gameState.squad;
    const scorers = squad.filter((p) => p.seasonGoals > 0 || p.goals > 0)
      .sort((a, b) => b.seasonGoals - a.seasonGoals || b.goals - a.goals).slice(0, 5);
    const rated = squad.filter((p) => Selectors.avgRating(p) != null)
      .sort((a, b) => Selectors.avgRating(b) - Selectors.avgRating(a) || b.seasonRatingCount - a.seasonRatingCount).slice(0, 5);
    const row = (i, p, right) => `
      <tr class="border-b border-paper-300 last:border-0">
        <td class="py-1 pr-1 text-ink-700 w-5">${i + 1}.</td>
        <td class="py-1 pr-1 max-w-0 w-full truncate"><b>„${Utils.escape(p.nick)}” ${Utils.escape(p.last)}</b> <span class="text-[10.5px] text-ink-700">${DATA.positions[p.pos].label.toLowerCase()}</span></td>
        ${right}
      </tr>`;
    const scorersHtml = scorers.length ? `<table class="w-full text-[12px]">
        <tr class="text-[10px] uppercase text-ink-700"><th></th><th class="text-left">Zawodnik</th><th class="text-right">Sezon</th><th class="text-right pl-2">Kariera</th></tr>
        ${scorers.map((p, i) => row(i, p, `<td class="py-1 text-right font-bold text-[13px]">${p.seasonGoals}</td><td class="py-1 text-right pl-2 text-ink-700">${p.goals}</td>`)).join('')}
      </table>` : '<p class="text-[12px] text-ink-700">Nikt jeszcze nie strzelił. Napastnicy twierdzą, że to wina wiatru.</p>';
    const ratedHtml = rated.length ? `<table class="w-full text-[12px]">
        <tr class="text-[10px] uppercase text-ink-700"><th></th><th class="text-left">Zawodnik</th><th class="text-right">Mecze</th><th class="text-right pl-2">Śr. nota</th></tr>
        ${rated.map((p, i) => row(i, p, `<td class="py-1 text-right text-ink-700">${p.seasonRatingCount}</td><td class="py-1 text-right pl-2">${UI.ratingBadge(Selectors.avgRating(p))}</td>`)).join('')}
      </table>` : '<p class="text-[12px] text-ink-700">Brak not – sezon jeszcze się nie zaczął.</p>';
    return `<p class="text-[11px] text-paper-400 mb-1.5">Sezon ${gameState.calendar.season} · noty od 1.0 do 10.0 wystawia trener po każdym meczu</p>`
      + UI.panel('⚽ Najlepsi strzelcy klubu', '', scorersHtml)
      + UI.panel('⭐ Najwyższa średnia ocen w sezonie', '', ratedHtml);
  },

  /* ---------- ZAKŁADKA: SZTAB I TRENER ---------- */
  staffTab() {
    const c = gameState.coach;
    const coach = Selectors.coach();
    const style = DATA.styles[coach.style];
    const lineup = Selectors.projectedLineup();
    const chem = Engine.chemistry(lineup);
    const chemColor = chem >= 65 ? 'bg-grass' : chem >= 45 ? 'bg-amber-glow' : 'bg-stamp';
    const carpetReady = gameState.calendar.week - c.lastCarpetWeek >= CONFIG.carpetCooldown;
    const isTemp = c.id === 'mirek';
    const view = UI.sub('staff', 'coach');
    const segs = UI.subSegs('staff', view, [['coach', '🧢 Trener'], ['market', '🤝 Giełda'], ['crew', '🧰 Sztab']]);
    const intro = '<p class="text-[11px] text-paper-400 mb-1.5">Prezes nie ustawia składu ani taktyki. Prezes zatrudnia, zwalnia i wzywa na dywanik.</p>';

    if (view === 'market') {
      const market = Object.entries(DATA.coaches).filter(([id]) => id !== 'mirek' && id !== c.id).map(([id, co]) => {
        const st = DATA.styles[co.style];
        const testLineup = (() => { const prev = c.id; c.id = id; const l = Engine.pickLineup([]); const ch = Engine.chemistry(l); c.id = prev; return ch; })();
        const offer = Selectors.coachOffer(co);
        return UI.row(`${Utils.escape(co.name)} <span class="font-normal text-ink-700">– ${Utils.escape(co.title)}</span>`,
          `<b>${st.label}</b> („${st.motto}”) · podpis ${Utils.formatMoney(offer.sign)} · <b>${Utils.formatMoney(offer.weekly)}/tydz.</b><br>${Utils.escape(co.desc)}<br>Przewidywana chemia z naszą kadrą: <b>${testLineup}%</b> (${Selectors.chemLabel(testLineup)})`,
          UI.smallBtn('hire-coach', `data-id="${id}"`, 'Zatrudnij', !isTemp || gameState.finance.budget < offer.sign));
      }).join('');
      return segs + intro + UI.panel('Giełda Trenerów', isTemp ? 'Pan Mirek chętnie odda gwizdek. Wybierz następcę.' : 'Żeby zatrudnić nowego, najpierw zwolnij obecnego.', market);
    }

    if (view === 'crew') {
      const staffRows = Object.entries(DATA.staffSlots).map(([slot, def]) => {
        const m = gameState.staff[slot];
        const pool = DATA.staffPool[slot] || [];
        const canHireExt = !m || m.kind === 'volunteer';
        const key = 'staff-' + slot;
        return `
        <div class="py-1.5 border-b border-paper-300 last:border-0">
          <div class="text-[10px] uppercase tracking-wide text-ink-700 font-medium">${def.icon} ${def.label}</div>
          ${m ? UI.row(`${m.kind === 'veteran' ? '🏅 ' : ''}${Utils.escape(m.name)}`,
            `${Utils.escape(m.desc)} · ${m.wage ? Utils.formatMoney(m.wage) + '/tydz.' : 'społecznie'}${m.chem ? ' · chemia +' + m.chem : ''}${m.lockerBase ? ' · atmosfera +' + m.lockerBase : ''}`,
            m.kind === 'volunteer' ? '' : UI.smallBtn('fire-staff', `data-slot="${slot}"`, 'Zwolnij', false, 'stamp'), '!py-0.5 !border-0')
            : '<div class="text-[12px] italic text-ink-700">Wakat. Krzesło stoi puste, na nim worek z piłkami.</div>'}
          <details data-fold="${key}" class="mt-1" ${(gameState.ui.folds || {})[key] ? 'open' : ''}>
            <summary class="flex items-center justify-between h-7 px-2 rounded-md bg-paper-200 text-[11.5px] font-semibold cursor-pointer select-none">
              <span>${canHireExt ? 'Kandydaci (' + pool.length + ')' : 'Kandydaci – najpierw zwolnij obecnego'}</span><span class="fold-chevron text-ink-700">⌄</span>
            </summary>
            ${pool.map((cand, i) => UI.row(Utils.escape(cand.name),
              `${Utils.escape(cand.desc)} · ${Utils.formatMoney(Math.round(cand.wage * Selectors.econ()))}/tydz.${cand.chem ? ' · chemia +' + cand.chem : ''}${cand.lockerBase ? ' · atmosfera +' + cand.lockerBase : ''}`,
              UI.smallBtn('hire-staff', `data-slot="${slot}" data-idx="${i}"`, 'Zatrudnij', !canHireExt), 'px-1')).join('')}
          </details>
        </div>`;
      }).join('');
      return segs + intro + UI.panel('Sztab Pomocniczy', 'Kogo zatrudnisz, ten pracuje – jedni lepiej, drudzy gorzej. Ile są warci, wyjdzie w praniu (mniej kontuzji, szybszy rozwój młodych, lepsze raporty skautów, mniej nieobecnych).', staffRows + `
        <p class="text-[11px] text-ink-700 mt-1.5">Koszt sztabu: <b>${Utils.formatMoney(Selectors.staffWages())}/tydz.</b> Gdy Ulubieniec lub Legenda (35+) kończy karierę, zgłosi się w podsumowaniu sezonu.</p>`);
    }

    return segs + intro + UI.tiles([
      UI.tile('Styl', style.label, 'ustawienie ' + style.formation.slice(1).join('-')),
      UI.tile('Pensja', Utils.formatMoney(Selectors.coachWeekly()), 'na tydzień'),
      UI.tile('Chemia', chem + '%', Selectors.chemLabel(chem)),
    ]) + UI.panel('Trener: ' + Utils.escape(coach.name), Utils.escape(coach.title) + ', ' + coach.age + ' l. · w klubie od Tygodnia ' + c.hiredWeek, `
      <p class="text-[12px] leading-snug mb-1.5">${Utils.escape(coach.desc)}</p>
      <p class="text-[11px] text-ink-700 mb-1.5">„${style.motto}” · ${coach.prefers === 'veterans' ? 'Faworyzuje starych wyjadaczy' : coach.prefers === 'youth' ? 'Stawia na młodzież' : 'Wybiera po umiejętnościach'}</p>
      <div class="flex justify-between text-[12px]"><span>Chemia taktyczna: <b>${Selectors.chemLabel(chem)}</b></span><span>${chem}%</span></div>
      ${UI.bar(chem, chemColor)}
      <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">Zgranie stylu trenera z profilami zawodników w jego wyjściowej jedenastce (+ wpływ sztabu). Niska chemia = głupie straty i narzekania w raportach.</p>
      ${c.lastReport ? `<blockquote class="border-l-2 border-grass pl-2 italic text-[12px] my-1.5">„${Utils.escape(c.lastReport)}”</blockquote>` : ''}
      <div class="flex flex-wrap gap-1.5 mt-1.5">
        ${UI.smallBtn('carpet-coach', '', '🟥 Wezwij na dywanik', !carpetReady)}
        ${isTemp ? '' : UI.smallBtn('fire-coach', 'data-mode="severance"', 'Zwolnij z odprawą (' + Utils.formatMoney(Engine.severance()) + ')', gameState.finance.budget < Engine.severance(), 'stamp')}
        ${isTemp ? '' : UI.smallBtn('fire-coach', 'data-mode="cold"', 'Zwolnij bez odprawy (foch szatni)', false, 'stamp')}
      </div>
      <p class="text-[10.5px] text-ink-700 mt-1">${carpetReady ? 'Dywanik: krótka rozmowa ostrzegawcza. Zwykle mobilizuje, czasem obraża.' : 'Na dywanik można wezwać ponownie w Tygodniu ' + (c.lastCarpetWeek + CONFIG.carpetCooldown) + '.'}</p>
    `);
  },

  /* ---------- ZAKŁADKA: KADRA I SZATNIA ---------- */
  squadTab() {
    const coach = Selectors.coach();
    const lineup = Selectors.projectedLineup();
    const chem = Engine.chemistry(lineup);
    const sort = gameState.ui.squadSort || 'pos';
    const byPos = (a, b) => DATA.positions[a.pos].order - DATA.positions[b.pos].order || b.skill - a.skill;
    const squad = gameState.squad.slice().sort(
      sort === 'goals' ? (a, b) => b.seasonGoals - a.seasonGoals || b.goals - a.goals || byPos(a, b)
      : sort === 'rating' ? (a, b) => (Selectors.avgRating(b) ?? -1) - (Selectors.avgRating(a) ?? -1) || byPos(a, b)
      : byPos);
    const count = (pr) => gameState.squad.filter((p) => p.profile === pr).length;
    const canRelease = gameState.squad.length > CONFIG.minSquad;
    const cols = 'grid grid-cols-[16px_minmax(0,1fr)_22px_22px_20px_34px_24px] items-center gap-1';
    const marks = (p) => (p.id === gameState.star.playerId ? (gameState.star.rebel ? ' 🔥' : ' 🌟') : '') + (p.injured > 0 ? ' 🩹' : '') + (p.loan ? ' 🔁' : '') + (p.benched ? ' 🚫' : '');

    // Gęsta tabela; stuknięcie w wiersz rozwija szczegóły zawodnika
    const rows = squad.map((p) => {
      const inXI = lineup.includes(p);
      const key = 'pl-' + p.id;
      const open = !!(gameState.ui.folds || {})[key];
      return `
      <details data-fold="${key}" class="border-b border-paper-300 last:border-0" ${open ? 'open' : ''}>
        <summary class="${cols} h-[27px] px-1.5 text-[12px] cursor-pointer select-none border-l-[3px] ${inXI ? 'border-l-grass' : 'border-l-transparent'}">
          <span class="text-[11px]">${DATA.positions[p.pos].icon}</span>
          <span class="truncate"><b>„${Utils.escape(p.nick)}” ${Utils.escape(p.last)}</b>${marks(p)}${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}${p.talent ? ' 💎' : ''}</span>
          <span class="text-center text-ink-700">${p.age}</span>
          <span class="text-center">${p.seasonApps}</span>
          <span class="text-center font-semibold">${p.seasonGoals}</span>
          <span class="text-right">${UI.ratingBadge(Selectors.avgRating(p))}</span>
          <span class="text-right">${UI.profileBadge(p.profile)}</span>
        </summary>
        <div class="px-2 py-1.5 bg-paper-200 text-[11.5px] leading-snug">
          <div class="flex justify-between gap-2 items-start">
            <div class="min-w-0">
              <div class="font-semibold">${Utils.escape(p.first)} „${Utils.escape(p.nick)}” ${Utils.escape(p.last)} · ${DATA.positions[p.pos].label} · ${inXI ? '<span class="text-grass font-bold">W SKŁADZIE</span>' : 'ŁAWKA'}</div>
              <div class="italic text-ink-700">„${Utils.escape(p.trait)}”</div>
            </div>
            ${p.loan ? '' : gameState.transfer.open ? UI.smallBtn('release-player', `data-id="${p.id}"`, 'Podziękuj', !canRelease, 'stamp') : '<span class="text-[10.5px] text-ink-700 whitespace-nowrap">🔒 do okna</span>'}
          </div>
          <div class="mt-1">Klasa: <b>${Selectors.skillLabel(p.skill)}</b> · Pasuje do: <b>${DATA.profiles[p.profile].label}</b> · Utrzymanie: <b>${p.wage} zł/tydz.</b> (${Selectors.wageLabel(p.wage)})</div>
          <div>Sezon: <b>${p.seasonApps} m · ${p.seasonGoals} g</b> · Kariera w klubie: <b>${p.apps} m · ${p.goals} g</b>${p.lastRating != null ? ' · ostatni mecz: ' + UI.ratingBadge(p.lastRating) : ''}${Selectors.careerRating(p) != null ? ' · w karierze: <b>' + Selectors.ratingText(Selectors.careerRating(p)) + '</b>' : ''}</div>
          ${p.benched ? '<div class="mt-0.5 text-stamp font-semibold">🚫 Odsunięty od składu do okna transferowego</div>' : ''}
          ${p.injured > 0 ? '<div class="mt-0.5 text-stamp font-semibold">🩹 Kontuzja – jeszcze ' + p.injured + ' tyg.</div>' : ''}
          ${p.loan ? '<div class="mt-0.5 font-semibold">🔁 Wypożyczony z ' + Utils.escape(p.loan.from) + ' do końca sezonu</div>' : ''}
          ${p.wantsOut ? '<div class="mt-0.5 text-stamp font-semibold">🚪 Po sezonie odchodzi do ' + Utils.escape(p.wantsOut) + '</div>' : ''}
          ${p.favorite || p.legend || p.talent ? `<div class="mt-0.5">${[p.favorite ? '⭐ Ulubieniec trybun' : '', p.legend ? '🏆 Legenda klubu' : '', p.talent ? '💎 Perełka powiatu' : ''].filter(Boolean).join(' · ')}</div>` : ''}
        </div>
      </details>`;
    }).join('');

    return UI.tiles([
      UI.tile('Chemia', chem + '%', Selectors.chemLabel(chem)),
      UI.tile('Kadra', gameState.squad.length + '/' + CONFIG.maxSquad, `OF ${count('off')} · DF ${count('def')} · UNI ${count('uni')}`),
      UI.tile('Koszt', Utils.formatMoney(Selectors.squadWages()), 'na tydzień'),
      UI.tile('Baza szatni', Selectors.lockerBaseline() + '%', 'legendy, sztab, bojler'),
    ], 4)
    + (gameState.transfer.open ? `<button data-action="open-transfer" class="btn-press w-full h-9 mb-2 rounded-lg bg-amber-glow text-ink-900 text-[13px] font-bold">🔁 Okno transferowe otwarte do 1. kolejki – wejdź</button>` : '')
    + UI.segs('squad-sort', sort, [['xi', '⚽ Jedenastka'], ['pos', 'Pozycja'], ['goals', 'Gole'], ['rating', 'Nota']])
    + (sort === 'xi' ? UI.lineupView(lineup, coach) : `<section class="paper overflow-hidden mb-1.5">
        <div class="${cols} h-6 px-1.5 border-l-[3px] border-l-transparent text-[9.5px] uppercase font-semibold text-ink-700 bg-paper-200">
          <span></span><span>Zawodnik · ${DATA.styles[coach.style].label.toLowerCase()}</span><span class="text-center">Wiek</span><span class="text-center">M</span><span class="text-center">G</span><span class="text-right">Nota</span><span class="text-right">Pr.</span>
        </div>
        ${rows}
      </section>
      <p class="text-[10.5px] text-paper-400 leading-snug">Skład ustala trener ${Utils.escape(coach.name)}. Prezes może najwyżej komuś podziękować – i liczyć się z reakcją trybun. Zielony pasek = jedenastka trenera; stuknij wiersz po szczegóły.${gameState.transfer.open ? '' : ' 🔒 Skład zamknięty do okna transferowego.'}</p>`);
  },

  // Jedenastka trenera na boisku (napastnicy u góry) i rezerwy pod spodem
  lineupView(lineup, coach) {
    const chip = (p) => `
      <div class="min-w-0 max-w-[84px] flex-1 rounded-md bg-white/95 px-1 py-0.5 text-center text-ink-900">
        <div class="text-[11px] font-bold truncate">${Utils.escape(p.nick)}${p.favorite ? '⭐' : ''}</div>
        <div class="text-[10px] leading-tight">${UI.ratingBadge(Selectors.avgRating(p) ?? (p.prevSeason ? p.prevSeason.avg : null))}</div>
      </div>`;
    const rows = ['FWD', 'MID', 'DEF', 'GK'].map((pos) => {
      const ps = lineup.filter((p) => p.pos === pos);
      return ps.length ? `<div class="flex justify-center gap-1.5">${ps.map(chip).join('')}</div>` : '';
    }).join('');
    const bench = gameState.squad.filter((p) => !lineup.includes(p))
      .sort((a, b) => DATA.positions[a.pos].order - DATA.positions[b.pos].order || b.skill - a.skill)
      .map((p) => `<div class="flex items-center gap-1 min-w-0 text-[11.5px] py-0.5"><span class="text-[10px]">${DATA.positions[p.pos].icon}</span><b class="truncate">${Utils.escape(p.nick)}</b><span class="text-ink-700">${p.injured > 0 ? '🩹 ' + p.injured + ' tyg.' : p.benched ? '🚫' : p.loan ? '🔁' : Selectors.ratingText(Selectors.avgRating(p))}</span></div>`).join('');
    return `
      <section class="rounded-xl bg-grass px-2 py-2.5 mb-2 space-y-2.5 relative overflow-hidden" style="background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 22px, transparent 22px 44px);">
        <div class="text-[10px] uppercase tracking-wide text-white/80 font-semibold text-center">Jedenastka · ${DATA.styles[coach.style].label} ${DATA.styles[coach.style].formation.slice(1).join('-')}</div>
        ${rows}
      </section>
      <section class="paper px-2.5 py-1.5 mb-1.5">
        <div class="text-[10px] uppercase tracking-wide text-ink-700 font-semibold mb-0.5">Ławka i rezerwy (${gameState.squad.length - lineup.length})</div>
        <div class="grid grid-cols-2 gap-x-2">${bench || '<p class="text-[12px] text-ink-700">Nikogo na ławce.</p>'}</div>
      </section>`;
  },

  // Ostrzeżenia w nagłówku: długi, komornik, walne zebranie, prokuratura
  threats() {
    const t = Selectors.debtThresholds();
    const b = gameState.finance.budget;
    const items = [];
    if (gameState.debt.deepWeeks > 0) items.push('<span class="text-stamp font-bold">☠️ Walne zebranie za ' + (CONFIG.debtGameOverWeeks - gameState.debt.deepWeeks) + ' tyg.!</span>');
    else if (b < t.bailiff) items.push('<span class="text-stamp font-bold">⚖️ Komornik na obiekcie</span>');
    else if (b < t.warn) items.push('<span class="text-amber-glow font-bold">💸 Odsetki + strajk</span>');
    if (Selectors.underInvestigation()) items.push('<span class="text-stamp font-bold">🔍 Pod lupą prokuratury</span>');
    if (gameState.season.promotionBan) items.push('<span class="text-stamp font-bold">⛔ Zakaz awansu</span>');
    if (Selectors.rebel()) items.push('<span class="text-stamp font-bold">🔥 Bunt: „' + Utils.escape(Selectors.starPlayer().nick) + '”</span>');
    return items.length ? `<div class="text-[11px] mt-1 truncate space-x-2">${items.join(' ')}</div>` : '';
  },

        `<li>${p.talent ? '💎 ' : ''}<b>${Utils.escape(Selectors.playerName(p))}</b> – ${p.age} l., ${DATA.positions[p.pos].label.toLowerCase()} · ${Selectors.skillLabel(p.skill)}</li>`).join('');
      return segs + UI.panel('Szkółka i Zaplecze (U-19 / Orlik)', 'Tu rodzą się Legendy. Albo przynajmniej ludzie do noszenia bramek.', `
        <div class="bg-paper-200 rounded-md px-2 py-1.5 mb-1.5">
          <div class="text-[10px] uppercase tracking-wide text-ink-700">Poziom szkółki</div>
          <div class="text-[13px] font-bold">${Utils.escape(lvl.label)}</div>
          <div class="text-[11px] text-ink-700 leading-snug">${Utils.escape(lvl.desc)}</div>
        </div>
        <p class="text-[11.5px] leading-snug">Juniorzy zwykle: <b>${Selectors.skillLabel(lvl.skillMin)}</b> – <b>${Selectors.skillLabel(lvl.skillMax)}</b>. Szansa na 💎 Perełkę powiatu: <b>${Math.round(lvl.talentChance * 100)}%</b>. Perełki rozwijają się dużo szybciej.</p>
        ${UI.h4('Inwestycje w szkółkę')}
        ${ups}
        ${UI.h4('Wyciągnij juniora z Orlika')}
        <div class="flex items-center gap-2">
          <p class="flex-1 text-[11px] text-ink-700 leading-snug">W oknie transferowym możesz ściągnąć jednego chłopaka do pierwszej drużyny (oprócz 2 juniorów na koniec sezonu).</p>
          ${UI.smallBtn('pull-junior', '', pulled ? 'Już w tym oknie' : gameState.transfer.open ? '🌱 Wyciągnij' : '🔒 w oknie', pulled || full || !gameState.transfer.open)}

      return segs + intro + UI.panel('Notatki Szwagra', 'Złote myśli z objazdów', `
        <ul class="text-[12.5px] space-y-1.5 list-disc pl-4">
          <li>„Profil zawodnika ważniejszy niż ksywa. Jak trener chce tiki-taki, to drwala mu nie wciskaj.”</li>
          <li>„Ja zawsze trochę przesadzam. Ale tylko trochę. Plus minus jedna klasa.”</li>
          <li>„Najlepsi grajkowie są na festynach strażackich. Najgorsi – też.”</li>
          <li>„W szatni jest 22 haczyki. Więcej ludzi nie wejdzie, bo ławka się złamie.”</li>
        </ul>`);
    }

    const cands = sc.candidates.map((p) => `
      <article class="py-1.5 border-b border-paper-300 last:border-0">
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0">
            <div class="text-[10px] uppercase tracking-wide text-ink-700">${DATA.positions[p.pos].icon} ${DATA.positions[p.pos].label} · ${p.age} l. ${UI.profileBadge(p.profile)}</div>
            <div class="text-[13px] font-bold leading-tight">${Utils.escape(Selectors.playerName(p))}</div>
          </div>
          ${UI.smallBtn('sign-candidate', `data-id="${p.id}"`, gameState.transfer.open ? 'Podpisz (' + Utils.formatMoney(p.fee) + ')' : '🔒 w oknie · ' + Utils.formatMoney(p.fee), !gameState.transfer.open || full || budget < p.fee)}
        </div>
        <p class="text-[11.5px] italic leading-snug">Szwagier: „${Utils.escape(p.trait)}”</p>
        <div class="text-[11px] leading-snug">
          ${Utils.escape(tier.who)} szacuje: <b>${Selectors.skillLabel(p.rumorSkill)}</b> <span class="text-ink-700">${tier.accuracy >= 1 ? '(szwagier lubi przesadzać)' : tier.accuracy > 0 ? '(czasem się myli)' : '(ocena pewna)'}</span>
          · Profil: <b>${DATA.profiles[p.profile].label}</b>
          · Chce: <b>${p.wage} zł/tydz.</b> (${Selectors.wageLabel(p.wage)}) · odstępne: <b>${Utils.formatMoney(p.fee)}</b>
        </div>
      </article>`).join('');

    return segs + UI.panel('Siatka Skautingowa: ' + Utils.escape(tier.name), Utils.escape(tier.desc), `
      <p class="text-[11.5px] leading-snug mb-1.5">Wyjazd kosztuje <b>${Utils.formatMoney(Selectors.scoutTier().cost)}</b> i trwa <b>${CONFIG.scoutWeeks} tygodnie</b>. Wraca z ${tier.count[0]}–${tier.count[1]} nazwiskami. Na wyższym poziomie ligowym przywozi lepszych (i droższych) grajków.</p>
      ${sc.missionReturnWeek
        ? `<div class="bg-paper-200 rounded-md px-2 py-1.5 mb-1.5 text-[12px]">🚗 ${Utils.escape(tier.who)} jest w trasie (${Utils.escape(sc.festival)}). Wraca w <b>Tygodniu ${sc.missionReturnWeek}</b>. Telefon wyłączony, „bo roaming”.</div>`
        : `<div class="mb-1.5">${UI.smallBtn('send-scout', '', '🚗 Wyślij na zwiady: ' + tier.who + ' (' + Utils.formatMoney(Selectors.scoutTier().cost) + ')', budget < Selectors.scoutTier().cost)}</div>`}
      ${nextTier ? UI.row(`Ulepszenie: ${Utils.escape(nextTier.name)} – ${Utils.formatMoney(nextTier.upgradeCost)}`, `${Utils.escape(nextTier.desc)} Dostępne od ligi: ${DATA.leagueLevels[nextTier.minLevel].name}.`,
        UI.smallBtn('upgrade-scout', '', 'Ulepsz', gameState.club.leagueLevel < nextTier.minLevel || budget < nextTier.upgradeCost || !!sc.missionReturnWeek), 'bg-paper-200 rounded-md px-2 !border-0') : ''}
      <div class="text-[11px] text-ink-700 mt-1.5">${gameState.transfer.open ? '<b class="text-grass">🔓 Okno transferowe otwarte – można podpisywać.</b> ' : '🔒 Podpisy tylko w oknie transferowym po sezonie (kandydaci poczekają). '}Kadra: <b>${gameState.squad.length}/${CONFIG.maxSquad}</b>${full ? ' – <span class="text-stamp font-bold">pełna! Najpierw komuś podziękuj w Kadrze.</span>' : ''} · Trener gra stylem: <b>${DATA.styles[coach.style].label}</b></div>
    `) + UI.panel('Notes Szwagra', '', cands || '<p class="text-[12px] italic">Notes Szwagra pusty. Ostatnio zapisał tylko numer do pani z loterii fantowej.</p>');

      UI.tile('DNA klubu', (dna > 0 ? '+' : '') + dna, '„' + Utils.escape(Selectors.dnaLabel()) + '”'),

        ? 'Ustalona na cały sezon – Pani Halinka postuje sama, zgodnie z linią klubu. Zmiana w następnym sezonie.'
        : 'Wybierz raz – działa pasywnie przez cały sezon. Pani Halinka postuje sama co dwa tygodnie.', `
        <div class="grid gap-1.5">${cards}</div>`)

        <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">Podnoszą: neutralna strategia, inwestycje w szkółkę, odmowa „Spółdzielni”. Obniżają: zadymy, zatrucia, kary, reklamówki z Passata. Sponsor „Ostatnia Prosta” patrzy na to bardzo uważnie.</p>`);

  reportCard() {
    const rep = gameState.lastReport;
    const body = !rep
      ? '<p class="text-[12px]">Jeszcze nic nie rozliczono. Pani Halinka ostrzy ołówek.</p>'
      : `<table class="w-full text-[12.5px]">
          ${rep.lines.map((l) => `<tr class="border-b border-paper-300"><td class="py-1 pr-2">${Utils.escape(l.label)}</td><td class="py-1 text-right font-bold whitespace-nowrap ${l.amount < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(l.amount)}</td></tr>`).join('')}
          <tr><td class="pt-1.5 font-semibold">Razem</td><td class="pt-1.5 text-right font-bold text-[14px] whitespace-nowrap ${rep.total < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(rep.total)}</td></tr>
        </table>`;
    return UI.panel('Bilans ostatniego tygodnia' + (rep ? ' (Tydzień ' + rep.week + ')' : ''), 'Wszystko, co wpłynęło i wypłynęło z kasetki.', body)
      + `<p class="text-[10.5px] text-paper-400 leading-snug">Księgowa pani Halinka przychodzi we wtorki. Do tego czasu wszystko jest „na zeszyt”.</p>`;

  ticketsCard() {
    const md = gameState.matchday;
    const next = Selectors.nextHomeFixture();
    const preview = next
      ? `<p class="text-[12px] leading-snug">Najbliższy mecz u siebie: <b>Kolejka ${next.kolejka} vs ${Utils.escape(next.fixture.rival)}</b>${Selectors.rival(next.fixture.rival).derby ? ' <span class="text-stamp font-bold">🔥 KOSA – podwójne zainteresowanie!</span>' : ''}. Bilety kupowane na bramce w dniu meczu.</p>`
      : '<p class="text-[12px]">W tym sezonie u siebie już nie gramy.</p>';
    const policies = Object.entries(DATA.tickets).map(([id, t]) => {
      const ok = Engine.canSetTicket(id);
      const active = md.ticket === id;
      const f = Engine.ticketForecast(id);
      return `
        <button data-action="set-ticket" data-value="${id}" ${ok ? '' : 'disabled'}
          class="btn-press w-full text-left px-2 py-1.5 border rounded-lg flex items-center gap-2 ${active ? 'border-amber-glow bg-amber-glow/15' : ok ? 'border-paper-300 bg-white' : 'border-paper-300 bg-paper-200 opacity-60 cursor-not-allowed'}">
          <span class="text-[18px] w-6 text-center">${ok || active ? t.icon : '🔒'}</span>
          <span class="min-w-0 flex-1">
            <span class="block text-[12.5px] ${active ? 'font-bold' : 'font-semibold'} leading-tight">${t.policy} · ${t.price} zł</span>
            <span class="block text-[10.5px] text-ink-700 leading-snug">${f ? '~' + f.att + ' widzów · ~' + Utils.formatMoney(f.gate) + ' z biletów na mecz' : 'brak meczów u siebie'}${t.fans ? ' · kibice ' + (t.fans > 0 ? '+' : '') + t.fans + '%/mecz' : ''}</span>
          </span>
        </button>`;
    }).join('');

    return UI.panel('Bilety i Budka z Kiełbaskami', 'Catering u Pana Zenka. Kasa fiskalna: zeszyt w kratkę.', `
      <div class="bg-paper-200 rounded-md px-2 py-1.5 mb-1">${preview}</div>
      ${UI.h4('Polityka cenowa biletów')}
      <div class="grid gap-1.5">${policies}</div>
      <p class="text-[11px] text-ink-700 leading-snug mt-1">${DATA.tickets[md.ticket].desc}</p>
      <p class="text-[11px] font-semibold mt-0.5 ${Engine.ticketWindowOpen() ? 'text-grass' : 'text-ink-700'}">${Engine.ticketWindowOpen()
        ? '🔓 Okno cenowe otwarte: cennik ustalasz teraz na całą rundę.'
        : md.ticketFixKey === Engine.ticketRundaKey() ? '🔒 Cennik zablokowany do przerwy – korekta w tej rundzie już wykorzystana.' : '🔒 Cennik ustalony na rundę. Zostaje 1 korekta o jeden próg.'}</p>
      ${UI.h4('Menu w budce Pana Zenka')}
      ${UI.choiceRow('set-sausage', Object.entries(DATA.sausages), md.sausage, (s) => s.label + ' – ' + s.price + ' zł', (s) => s.desc + ' Zysk: ' + (s.price - s.cost) + ' zł/szt.')}
      <p class="text-[10.5px] text-ink-700 mt-1.5 leading-snug">☀️ W słońcu grill sprzedaje o 30% więcej, w ulewie Zenek siedzi pod parasolem i liczy straty. Ofensywny trener przyciąga ~10% więcej widzów, defensywny ~10% mniej.</p>
    `);
  },

  merchCard() {
    const m = gameState.merch;
    const favorites = gameState.squad.filter((p) => p.favorite).length;
    const rows = Object.entries(DATA.merch).map(([id, item]) => {
      const cost = item.batch * item.unitCost;
      return UI.row(`${item.label} <span class="font-normal text-ink-700">· magazyn</span> ${m.stock[id]}`, `hurt ${item.unitCost} zł · sprzedaż ${Engine.merchPrice(id)} zł`,
        UI.smallBtn('order-merch', `data-item="${id}"`, '+' + item.batch + ' szt. (' + Utils.formatMoney(cost) + ')', gameState.finance.budget < cost));
    }).join('');
    const frozen = Object.keys(DATA.merch).reduce((sum, id) => sum + m.stock[id] * DATA.merch[id].unitCost, 0);
    const shopLine = gameState.lastReport && gameState.lastReport.lines.find((l) => l.label === 'Sklepik fanowski');
    const stock = Object.keys(DATA.merch).reduce((sum, id) => sum + m.stock[id], 0);
    return UI.tiles([
      UI.tile('Magazyn', stock + ' szt.', 'zamrożone ' + Utils.formatMoney(frozen)),
      UI.tile('Ostatni tydz.', shopLine ? Utils.signedMoney(shopLine.amount) : '0 zł', 'wpływ ze sklepu', shopLine ? 'text-grass' : ''),
      UI.tile('Sprzedano', m.soldTotal + ' szt.', 'od początku'),
    ]) + UI.panel('Sklepik Fanowski', 'Okienko w blaszaku, czynne w dni meczowe i „jak ktoś zapuka”.', `
      ${rows}
      <p class="text-[11px] text-ink-700 my-1.5 leading-snug">Schodzi szybciej po wygranych i w tygodnie meczów u siebie. Ulubieńcy Trybun w kadrze (${favorites}) napędzają sprzedaż koszulek.</p>
      ${UI.h4('Narzut')}
      ${UI.choiceRow('set-markup', Object.entries(DATA.merchMarkups), m.markup, (mk) => mk.label.split(' – ')[0], (mk) => mk.label)}
    `);
  },

    const s = gameState.sponsor;

    let body = '';
    if (active) {
      body = `
        <div class="bg-paper-200 border border-grass rounded-md px-2 py-1.5 mb-1">
          <div class="flex justify-between items-start gap-2">
            <div class="min-w-0">
              <div class="text-[10px] uppercase tracking-wide text-ink-700">Umowa aktywna od Tygodnia ${s.signedWeek}</div>
              <div class="text-[14px] font-bold">${Utils.escape(active.name)}</div>
            </div>
            ${UI.smallBtn('end-sponsor', '', 'Wypowiedz', false, 'stamp')}
          </div>
          <p class="text-[12px]">Wpływ: <b>${Utils.formatMoney(Selectors.sponsorWeekly(active))}/tydz.</b> · ${active.clubPrefix ? 'Nazwa klubu: <b>' + Utils.escape(Selectors.clubDisplayName()) + '</b>' : 'Stadion: <b>' + Utils.escape(active.stadiumName) + '</b>'}</p>
          <p class="text-[11px] text-stamp">⚠️ ${Utils.escape(active.requirement)}</p>

        `${sp.clubPrefix ? 'Dopisek do nazwy: „' + Utils.escape(sp.clubPrefix) + '”' : 'Stadion: ' + Utils.escape(sp.stadiumName)}${Engine.describeEffects(sp.signEffects)}<br>${Utils.escape(sp.pitch)}<br><span class="text-stamp">${Utils.escape(sp.requirement)}</span>`,
        burned ? '<span class="text-[11px] font-bold text-stamp text-right">SPALONY<br><span class="font-normal">znika z rynku</span></span>' : UI.smallBtn('sign-sponsor', `data-id="${id}"`, 'Podpisz', !!s.active), burned ? 'opacity-50' : '');
    }).join('');
    return UI.panel('Sponsor Tytularny', 'Lokalny biznes chętny, by jego logo oglądało 80 osób i dwie krowy. Jeden naraz.', `
      ${body}
      ${offers}
      <p class="text-[11px] text-ink-700 mt-1">Skandale w kartotece klubu: <b>${gameState.club.scandals}</b>. Kto raz zerwie umowę, ten nie wraca – ale na jego miejsce przychodzą nowi. Ile zaproponują, zależy od tego, jak klub się „sprzedaje”.</p>
    `);
  },

  loansCard() {
    const L = gameState.loans;
    const takenRows = Object.entries(DATA.lenders).map(([id, l]) => {
      const active = L.taken.find((x) => x.id === id);
      return UI.row(Utils.escape(l.name),
        `${Utils.formatMoney(l.amount)} → ${l.installments} rat × ${Utils.formatMoney(l.rate)} (oddajesz ${Utils.formatMoney(l.installments * l.rate)}). ${Utils.escape(l.note)}${active ? `<br><b class="text-stamp">Spłacasz: zostało ${active.remaining} rat (${Utils.formatMoney(active.remaining * active.rate)})</b>` : ''}`,
        UI.smallBtn('take-loan', `data-id="${id}"`, 'Pożycz', !!active));
    }).join('');
    const givenRows = Object.entries(DATA.borrowers).map(([id, b]) => {
      const active = L.given.find((x) => x.id === id);
      return UI.row(Utils.escape(b.name),
        `Chce ${Utils.formatMoney(b.amount)}, odda ${Utils.formatMoney(b.returns)} za ${b.weeks} tyg. ${Utils.escape(b.plea)}${active ? `<br><b class="text-grass">Pożyczone! Termin zwrotu: Tydzień ${active.dueWeek}${active.delays ? ' (przesunięty ' + active.delays + '×)' : ''}</b>` : ''}`,
        UI.smallBtn('lend-money', `data-id="${id}"`, 'Daj', !!active || gameState.finance.budget < b.amount));
    }).join('');
    return UI.panel('Pożyczki Międzyklubowe', 'Chwilówki u prezesów. Umowa ustna, świadek: barman.', `
      ${UI.h4('Pożycz od innego prezesa')}
      ${takenRows}
      ${UI.h4('Pożycz komuś nasze nadwyżki')}
      ${givenRows}
      <p class="text-[11px] text-ink-700 mt-1">Raty schodzą automatycznie co tydzień. Dłużnicy czasem „zapominają”…</p>
    `);
  },

  stadiumCard() {
    const st = gameState.stadium;
    const pitchColor = st.pitch >= 60 ? 'bg-grass' : st.pitch >= 30 ? 'bg-amber-glow' : 'bg-stamp';
    const folds = gameState.ui.folds || {};
    const upgradeRow = ([id, u]) => {
      const owned = st.upgrades[id];
      const lic = u.group !== 'dev' ? ` <i>📋 Licencja: ${id === 'roller' || id === 'boiler' ? 'A-klasa – walec albo bojler; od Klasy Okręgowej – oba' : 'wymagane od ligi ' + DATA.leagueLevels[u.licenseLevel].name}</i>` : '';
      return UI.row(`${owned ? '✅ ' : ''}${Utils.escape(u.label)} <span class="font-normal text-ink-700">– ${Utils.formatMoney(Selectors.upgradeCost(id))}${Selectors.upgradeCost(id) < u.cost ? ' (rabat Kółka Rolniczego)' : ''}</span>`,
        Utils.escape(u.desc) + lic,
        owned ? '<span class="text-[11px] font-bold text-grass">ZROBIONE</span>' : UI.smallBtn('buy-upgrade', `data-id="${id}"`, 'Kup', gameState.finance.budget < Selectors.upgradeCost(id)));
    };
    const group = (key, title, list, note) => {
      const done = list.filter(([id]) => st.upgrades[id]).length;
      const open = !!folds[key];
      return `
      <details data-fold="${key}" class="mt-1.5" ${open ? 'open' : ''}>
        <summary class="flex items-center justify-between h-9 px-2 rounded-md bg-paper-200 text-[12.5px] font-semibold cursor-pointer select-none">
          <span>${title}${note ? ' <span class="text-[10.5px] text-stamp font-bold">' + note + '</span>' : ''}</span><span class="flex items-center gap-2"><span class="text-[11px] text-ink-700">${done}/${list.length}</span><span class="fold-chevron text-ink-700">⌄</span></span>
        </summary>
        ${list.map(upgradeRow).join('')}
      </details>`;
    };
    const all = Object.entries(DATA.upgrades);
    const licList = all.filter(([, u]) => u.group !== 'dev');
    const devList = all.filter(([, u]) => u.group === 'dev');
    const missingSoon = Selectors.licenseMissing(Math.min(gameState.club.leagueLevel + 1, DATA.leagueLevels.length - 1)).length;
    return UI.panel('Infrastruktura: ' + Utils.escape(Selectors.stadiumName()), 'Obiekt z duszą. I z kretami.', `
      <div class="flex justify-between text-[12px]"><span>Stan murawy: <b>${Selectors.pitchLabel(st.pitch)}</b></span><span>${st.pitch}%</span></div>
      ${UI.bar(st.pitch, pitchColor)}
      <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">Każdy mecz u siebie niszczy murawę (w deszczu mocno). Zła murawa = loteria wyników i mniej widzów.</p>
      <p class="text-[11px] mt-1 leading-snug">${Selectors.facilityLabels().map((f) => Utils.escape(f)).join(' · ')}</p>
      ${group('st-lic', '📋 Wymogi licencyjne', licList, missingSoon ? 'brakuje ' + missingSoon + ' do awansu' : '')}
      ${group('st-dev', '🏗️ Rozbudowa klubu na lata', devList, '')}
    `);
  },

};

/* ---------------------------------------------------------------------
   6. OBSŁUGA ZDARZEŃ – delegacja po data-action
   --------------------------------------------------------------------- */
const App = {
  // Po każdej akcji: zapis + odświeżenie widoku.
  commit() {
    Storage.save();
    UI.renderAll();
  },
};

const Actions = {
  'form-set'(el) {
    const f = gameState.ui.form;
    f[el.dataset.field] = el.dataset.value;
    gameState.ui.startError = '';
    UI.renderAll();
  },

  'random-club'() {
    const c = Utils.rand(DATA.cultClubs);
    const f = gameState.ui.form;
    const listed = DATA.clubPrefixes.includes(c.prefix);
    Object.assign(f, {
      prefix: listed ? c.prefix : 'custom', customPrefix: listed ? '' : c.prefix,
      town: c.town, character: c.character, colors: c.colors,
      stadium: '', stadiumEdited: false, president: Utils.rand(DATA.presidentNames),
    });
    gameState.ui.startError = '';
    UI.renderAll();
  },

  'start-game'() {
    const f = gameState.ui.form;
    const name = Selectors.formClubName(f);
    const fail = (msg) => {
      gameState.ui.startError = msg;
      UI.renderAll();
      const box = document.querySelector('input[data-field="town"]');
      if (box) { box.classList.add('shake'); box.focus(); }
    };
    if (!f.town.trim()) return fail('Klub bez miejscowości to jak bramka bez siatki. Wpisz, skąd jesteście, Prezesie!');
    if (DATA.rivals.some((r) => r.name.toLowerCase() === name.toLowerCase())) return fail('Taki klub już gra w tej B-klasie! Wymyśl coś innego, bo Związek się pogubi.');
    const existing = Storage.load();
    if (existing && existing.club.name && !confirm('W szufladzie jest zapis klubu ' + existing.club.name + '. Nowa prezesura go nadpisze. Kontynuować?')) return;
    Engine.startGame({ name, town: f.town.trim(), character: f.character, colors: f.colors, stadium: f.stadium, president: f.president });
    App.commit();
    window.scrollTo(0, 0);
  },

  'load-game'() {
    const saved = Storage.load();
    if (!saved) return;
    gameState = saved;
    gameState.screen = 'game';
    App.commit();
    window.scrollTo(0, 0);
  },

  'clear-save'() {
    if (confirm('Spalić teczkę z zapisem? Tego nie da się cofnąć.')) {
      Storage.clear();
      UI.renderAll();
    }
  },

  'exit-menu'() {
    Storage.save();
    gameState = createInitialState();
    UI.renderAll();
  },

  'switch-tab'(el) {
    gameState.activeTab = el.dataset.tab;
    if (el.dataset.view) gameState.ui.deskView = el.dataset.view;
    if (el.dataset.tab === 'virtualx') gameState.ui.seenFeedId = gameState.x.lastPostId;
    if (el.dataset.tab === 'scouting') gameState.ui.seenScoutKey = gameState.scouting.candidates.map((p) => p.id).join(',');
    App.commit();
  },

  'resolve-decision'(el) {
    const d = DATA.decisions[el.dataset.decision];
    const before = gameState.ui.lastLogId;
    Engine.resolveDecision(el.dataset.decision, Number(el.dataset.option));
    // Oferta w giełdzie: wynik ląduje na górze zakładki „Oferty”, giełda zostaje otwarta
    if (d && d.transfer && gameState.transfer.open) {
      const lines = gameState.log.filter((e) => e.id > before).reverse().map((e) => e.text);
      gameState.transfer.news = lines.concat(gameState.transfer.news || []).slice(0, 4);
      gameState.ui.overlay = { type: 'transfer' };
    } else if (d && d.cutscene) {   // cut-scenka kończy się planszą ze skutkami decyzji
      const lines = gameState.log.filter((e) => e.id > before).reverse().map((e) => e.text);
      gameState.ui.overlay = { type: 'outcome', icon: d.cutscene.icon, title: Utils.val(d.title), lines };
    }
    App.commit();
  },
  'overlay-close'() {
    const o = gameState.ui.overlay;
    const sm = gameState.seasonSummary;
    const t = gameState.transfer;
    if (o && o.type === 'season' && sm) sm.seen = true;
    // Przełom sezonów: mecz → podsumowanie roczne → pożegnania (kariera, sztab) → giełda ze wszystkimi ofertami naraz
    if (o && o.type === 'match' && sm && !sm.seen) gameState.ui.overlay = { type: 'season' };
    else if (o && o.type === 'transfer') gameState.ui.overlay = null;
    else if (t.open && !t.shown && (!sm || sm.seen) && !gameState.pendingDecisions.includes('veteranStaff')) {
      t.shown = true;
      gameState.ui.transferView = Selectors.transferOffers().length ? 'offers' : 'buy';
      gameState.ui.overlay = { type: 'transfer' };
    } else gameState.ui.overlay = null;
    App.commit();
  },
  'open-transfer'() {
    if (gameState.transfer.open) { gameState.transfer.shown = true; gameState.ui.overlay = { type: 'transfer' }; }
    App.commit();
  },
  'transfer-view'(el) {
    if (['offers', 'buy', 'loan', 'sell'].includes(el.dataset.value)) gameState.ui.transferView = el.dataset.value;
    App.commit();
  },
  'buy-transfer'(el) { Engine.buyTransfer(el.dataset.id); App.commit(); },
  'loan-in'(el)      { Engine.loanIn(el.dataset.id); App.commit(); },
  'loan-out'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (p && confirm('Wypożyczyć ' + Selectors.playerName(p) + ' na cały sezon (+' + Utils.formatMoney(Selectors.loanOutFee(p)) + ')? Wróci po sezonie.')) { Engine.loanOut(p.id); App.commit(); }
  },
  'sell-transfer'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (!p) return;
    const warn = p.legend ? ' To LEGENDA KLUBU – kibice i szatnia tego nie wybaczą!' : p.favorite ? ' To Ulubieniec Trybun – kibice się wściekną!' : '';
    if (confirm('Sprzedać ' + Selectors.playerName(p) + ' za ' + Utils.formatMoney(Selectors.sellPrice(p)) + '?' + warn)) { Engine.sellTransfer(p.id); App.commit(); }
  },

  'next-week'() {
    const week = gameState.calendar.week;
    if (Engine.nextWeek()) {
      if (gameState.screen === 'game' && gameState.lastMatch && gameState.lastMatch.week === week) gameState.ui.overlay = { type: 'match' };
      gameState.activeTab = 'desk';
      gameState.ui.deskView = null;    // nowy tydzień: Biurko samo wybiera sprawy albo pulpit klubu
      App.commit();
      window.scrollTo(0, 0);
    }
  },

  'set-ticket'(el)   { Engine.setTicket(el.dataset.value); App.commit(); },
  'set-sausage'(el)  { if (DATA.sausages[el.dataset.value]) gameState.matchday.sausage = el.dataset.value; App.commit(); },
  'set-markup'(el)   { if (DATA.merchMarkups[el.dataset.value]) gameState.merch.markup = el.dataset.value; App.commit(); },
  'order-merch'(el)  { Engine.orderMerch(el.dataset.item); App.commit(); },
  'sign-sponsor'(el) { Engine.signSponsor(el.dataset.id); App.commit(); },
  'end-sponsor'() {
    const sp = Selectors.sponsor();
    if (sp && confirm('Wypowiedzieć umowę z: ' + sp.name + '? Ten sponsor już nie wróci.')) {
      Engine.endSponsor('📝 Prezes wypowiedział umowę sponsorską z: ' + sp.name + '. Trzasnęły drzwi.');
      App.commit();
    }
  },
  'take-loan'(el)    { Engine.takeLoan(el.dataset.id); App.commit(); },
  'lend-money'(el)   { Engine.lendMoney(el.dataset.id); App.commit(); },
  'buy-upgrade'(el)  { Engine.buyUpgrade(el.dataset.id); App.commit(); },

  'hire-coach'(el)   { Engine.hireCoach(el.dataset.id); App.commit(); },
  'fire-coach'(el) {
    const coach = Selectors.coach();
    const cold = el.dataset.mode === 'cold';
    if (confirm('Zwolnić trenera ' + coach.name + (cold ? ' BEZ odprawy? Szatnia się obrazi.' : ' z odprawą ' + Utils.formatMoney(Engine.severance()) + '?'))) {
      Engine.fireCoach(!cold);
      App.commit();
    }
  },
  'carpet-coach'()   { Engine.carpetCoach(); App.commit(); },
  'hire-staff'(el)   { Engine.hireStaff(el.dataset.slot, Number(el.dataset.idx || 0)); App.commit(); },
  'fire-staff'(el) {
    const m = gameState.staff[el.dataset.slot];
    if (m && confirm('Zwolnić ze sztabu: ' + m.name + '?')) { Engine.fireStaff(el.dataset.slot); App.commit(); }
  },
  'desk-view'(el) {
    if (['decisions', 'club'].includes(el.dataset.value)) gameState.ui.deskView = el.dataset.value;
    App.commit();
  },
  'sub-view'(el) {
    if (!DATA.tabs.some((t) => t.id === el.dataset.tab)) return;
    if (!gameState.ui.sub) gameState.ui.sub = {};
    gameState.ui.sub[el.dataset.tab] = el.dataset.value;
    App.commit();
  },
  'squad-sort'(el) {
    if (['xi', 'pos', 'goals', 'rating'].includes(el.dataset.value)) gameState.ui.squadSort = el.dataset.value;
    App.commit();
  },
  'release-player'(el) {
    const p = gameState.squad.find((x) => x.id === el.dataset.id);
    if (!p) return;
    const warn = p.legend ? ' To LEGENDA KLUBU – kibice i szatnia tego nie wybaczą!' : p.favorite ? ' To Ulubieniec Trybun – kibice się wściekną!' : '';
    if (confirm('Podziękować za grę: ' + Selectors.playerName(p) + '?' + warn)) {
      Engine.releasePlayer(p.id);
      App.commit();
    }
  },

  'send-scout'()       { Engine.sendScout(); App.commit(); },
  'upgrade-scout'()    { Engine.upgradeScout(); App.commit(); },
  'restart'() {
    Storage.clear();
    gameState = createInitialState();
    UI.renderAll();
    window.scrollTo(0, 0);
  },
  'sign-candidate'(el) { Engine.signCandidate(el.dataset.id); App.commit(); },
  'buy-youth'(el)      { Engine.buyYouthUpgrade(el.dataset.id); App.commit(); },
  'pull-junior'()      { Engine.pullJunior(); App.commit(); },
  'set-strategy'(el)   { Engine.setMediaStrategy(el.dataset.value); App.commit(); },

  'reset-game'() {
    if (confirm('Na pewno rzucasz papierami? Zapis zostanie skasowany, a klub zostanie bez prezesa (znowu).')) {
      Storage.clear();
      gameState = createInitialState();
      UI.renderAll();
    }
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const handler = Actions[el.dataset.action];
  if (handler) handler(el, e);
});

// Zapamiętujemy, które sekcje gracz zwinął/rozwinął (przetrwa odświeżenie widoku i zapis).
// (zdarzenie „toggle” leci też przy wstawianiu otwartych sekcji – liczymy tylko kliknięcia gracza)
let lastSummaryClick = 0;
document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('summary')) lastSummaryClick = Date.now(); }, true);
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d || !d.dataset || !d.dataset.fold || gameState.screen !== 'game' || Date.now() - lastSummaryClick > 1000) return;
  if (!gameState.ui.folds) gameState.ui.folds = {};
  if (gameState.ui.folds[d.dataset.fold] === d.open) return;
  gameState.ui.folds[d.dataset.fold] = d.open;
  Storage.save();
}, true);

document.addEventListener('input', (e) => {
  const field = e.target.dataset && e.target.dataset.field;
  if (!field || gameState.screen !== 'start') return;
  const f = gameState.ui.form;
  f[field] = e.target.value;
  if (field === 'stadium') f.stadiumEdited = e.target.value.trim() !== '';
  const stadiumBox = document.querySelector('input[data-field="stadium"]');
  if (field === 'town' && stadiumBox && !f.stadiumEdited) stadiumBox.placeholder = Selectors.defaultStadium(f.town.trim() || '[Miejscowość]');
  const preview = document.getElementById('form-preview');
  if (preview) preview.innerHTML = UI.formPreview();
  // poprawiony formularz = stary komunikat o błędzie znika
  gameState.ui.startError = '';
  const err = document.getElementById('start-error');
  if (err) err.textContent = '';
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.field) Actions['start-game']();
});

/* START */
UI.renderAll();
</script>
</body>
