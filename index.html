  <script>
    // Nazwy kolorów zostały z wcześniejszych kroków, ale paleta jest nowa: chłodny grafit + jasne karty.
    // „glow” = akcent w barwach klubu (ustawiany dynamicznie przez UI.applyTheme).
    if (window.tailwind) tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            type: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],

          colors: {
            desk:   { 900: '#141a24', 800: '#1b2330', 700: '#273142', 600: '#364256' },

            ink:    { 900: '#0f172a', 700: '#475569' },
            amber:  { glow: 'rgb(var(--glow-rgb) / <alpha-value>)' },
            stamp:  '#dc2626',

  <style>
    :root { --glow-rgb: 52 211 153; --accent: #10b981; }
    /* Clean flat: jednolite tło, płaskie karty bez cieni, subtelne obramowania */
    body { background-color: #10151e; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'tnum'; }
    .paper {
      background-color: #f6f8fb;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }
    .accent-line { border-top: 4px solid var(--accent); }
    .btn-press:active:not(:disabled) { transform: translateY(1px); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .shake { animation: shake 0.25s 2; }
    /* Mobile: zero poziomego przewijania, zwijane sekcje bez systemowego trójkącika */
    html, body { overflow-x: hidden; max-width: 100%; }
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    details[open] > summary .fold-chevron { transform: rotate(180deg); }
    .fold-chevron { transition: transform .15s; }
    /* Rama aplikacji na pełną wysokość ekranu: przewija się tylko obszar roboczy */
    .app-shell { height: 100vh; height: 100dvh; }
    /* Ekrany na cały ekran: miękkie wejście, ikona cut-scenki lekko „oddycha” */
    @keyframes ovIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .ov-in { animation: ovIn .35s ease-out; }
    @keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
    .sheet-in { animation: sheetIn .22s ease-out; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .cut-icon { animation: breathe 3s ease-in-out infinite; }
    .scroll-thin::-webkit-scrollbar { width: 4px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

const Utils = {
  rand: (arr) => arr[Math.floor(Math.random() * arr.length)],
  randInt: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  randRange: (a, b) => a + Math.random() * (b - a),
  clamp: (v, min, max) => Math.max(min, Math.min(max, v)),
  shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  poisson: (lambda) => { const L = Math.exp(-lambda); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; },
  weightedPick: (items, weightFn) => {
    const total = items.reduce((s, x) => s + weightFn(x), 0);
    let r = Math.random() * total;
    for (const x of items) { r -= weightFn(x); if (r <= 0) return x; }
    return items[items.length - 1];
  },
  val: (x) => (typeof x === 'function' ? x() : x),
  // Wartość rynkowa w złotych: 850 zł · 14 tys. zł · 2,4 mln zł
  formatValue: (v) => (v >= 1e6 ? (Math.round(v / 1e5) / 10).toString().replace('.', ',') + ' mln zł' : v >= 1000 ? Math.round(v / 1000) + ' tys. zł' : Math.round(v) + ' zł'),
  formatMoney: (n) => Math.round(n).toLocaleString('pl-PL').replace(/,/g, ' ') + ' zł',
  signedMoney: (n) => (n > 0 ? '+' : '') + Utils.formatMoney(n),
  escape: (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
};

const Engine = {
  // Przyjmuje dane z Karty Rejestracyjnej albo samą nazwę (testy, stare wywołania).
  startGame(card) {
    if (typeof card === 'string') {
      const words = card.trim().split(/\s+/);
      card = { name: card, town: words.length > 1 ? words.slice(1).join(' ') : card, character: null, colors: null, stadium: '', president: '' };
    }
    const fresh = createInitialState();
    fresh.screen = 'game';
    Object.assign(fresh.club, { name: card.name, town: card.town, character: card.character, colors: card.colors, president: (card.president || '').trim() });
    fresh.stadium.baseName = (card.stadium || '').trim() || Selectors.defaultStadium(card.town);
    gameState = fresh;
    if (card.character === 'suburban') gameState.finance.budget += 500;
    if (card.character === 'rural') gameState.morale.lockerRoom += 5;

    // Województwo klubu (wybrane w karcie albo losowe): grupa III ligi i wojewódzki Puchar Polski
    gameState.club.region = card.region !== '' && card.region != null && DATA.cupRegions[+card.region] ? +card.region : Utils.randInt(0, DATA.cupRegions.length - 1);
    Engine.buildLeague(1);   // 13.69: B-klasa z prawdziwych klubów województwa
    Engine.newSeason();
    gameState.weather = Utils.rand(DATA.weather);
    // Kadra startowa: te same role i charaktery, ale nazwiska i ksywy losowane z dużej puli – każdy klub inny
    gameState.squad.forEach((p) => { Object.assign(p, Engine.uniqueName()); Engine.rollPotential(p); p.temper = Engine.rollTemper(p); });
    const t = Selectors.townType();
    Engine.addLog(Selectors.presName() + ' obejmuje funkcję prezesa klubu ' + card.name + ' (' + card.town + (t ? ', ' + t.label.toLowerCase() : '') + '). W kasie ' + Utils.formatMoney(gameState.finance.budget) + ' i karton po bananach z dokumentami.', 'system');
    Engine.addLog('Karta rejestracyjna przyjęta przez OZPN. Obiekt: ' + gameState.stadium.baseName + '.' + (Selectors.colorsNick() ? ' Barwy: ' + DATA.clubColors[card.colors].label.toLowerCase() + '.' : ''), 'system');
    Engine.addLog('Poprzedni prezes zostawił na biurku klucze (nie wiadomo do czego) i niedopitą kawę z 2019. Drużynę tymczasowo prowadzi Pan Mirek, konserwator.', 'flavor');
    Engine.addLog('Liga (' + Selectors.leagueSize() + ' drużyn, ' + gameState.season.rounds.length + ' kolejek) rusza w Tygodniu ' + (CONFIG.preseasonWeeks + 1) + '. Pierwszy rywal: ' + Selectors.currentFixture().rival + '.', 'system');
    if (/^amator\s+maszewo$/i.test((card.name || '').trim().replace(/\s+/g, ' '))) Engine.kacperChudy();   // 🥚 easter egg
    Engine.u19Init();
    Engine.refreshSponsors(true);
    gameState.ui.overlay = { type: 'startCoach' };   // 13.86: kreator kariery – najpierw trener, potem sponsor
    Engine.pushDecision('welcomeWojt');
    Engine.offerTicketPolicy();
    Engine.ensureSponsor();
  },

  // Easter egg: w Amatorze Maszewo od 1. kolejki gra Kacper Chudy – snajper i asystent z sufitem OVR 99
  kacperChudy() {
    const weakest = gameState.squad.filter((p) => p.pos === 'FWD').sort((a, b) => a.skill - b.skill)[0];
    if (weakest) gameState.squad = gameState.squad.filter((x) => x.id !== weakest.id);   // zastępuje najsłabszego napastnika – kadra bez zmian
    const p = Engine.generatePlayer({ ageMin: 20, ageMax: 20, pos: 'FWD', skillMin: 10, skillMax: 10, wageMin: 10, wageMax: 10 });
    Object.assign(p, { first: 'Kacper', last: 'Chudy', nick: 'Chudy', noNick: true, age: 20, skill: 10 + Selectors.levelSkillBonus(), potential: CONFIG.maxSkill, talent: true, favorite: true, ace: true,
      loyalUntil: 9999, profile: 'off', tag: 'freekick', temper: 0.15, trait: 'Wychowanek Maszewa. Strzela z każdej pozycji, a jak nie strzela – to podaje.' });
    Engine.addLog('🥚 W szatni Amatora Maszewo trenuje 20-letni Kacper Chudy. Pan Mirek mówi tylko: „Takiego talentu tu jeszcze nie było”.', 'event');
  },

  addLog(text, type = 'flavor') {
    gameState.ui.lastLogId += 1;
    gameState.log.unshift({ id: gameState.ui.lastLogId, week: gameState.calendar.week, text, type });
    if (gameState.log.length > CONFIG.maxLogEntries) gameState.log.length = CONFIG.maxLogEntries;
  },

  // Każdy ruch pieniędzy przechodzi tędy – trafia do bilansu tygodnia, jeśli jest liczony.
  money(label, amount) {
    if (!amount) return;
    gameState.finance.budget += amount;
    if (gameState.report) gameState.report.lines.push({ label, amount });
  },

  // Jedyne miejsce, gdzie modyfikujemy statystyki – łatwo rozszerzyć o nowe.
  applyEffects(effects = {}, label = 'Inne') {
    if (effects.budget)     Engine.money(label, effects.budget);
    if (effects.lockerRoom) gameState.morale.lockerRoom = Utils.clamp(gameState.morale.lockerRoom + effects.lockerRoom, 0, 100);
    if (effects.fans)       gameState.morale.fans = Utils.clamp(gameState.morale.fans + effects.fans, 0, 100);
  },

  describeEffects(effects = {}) {
    const parts = [];
    if (effects.budget)     parts.push(Utils.signedMoney(effects.budget));
    if (effects.lockerRoom) parts.push('szatnia ' + (effects.lockerRoom > 0 ? '+' : '') + effects.lockerRoom + '%');
    if (effects.fans)       parts.push('kibice ' + (effects.fans > 0 ? '+' : '') + effects.fans + '%');
    return parts.length ? ' [' + parts.join(', ') + ']' : '';
  },

  addScandal(reason, quiet) {
    gameState.club.scandals += 1;
    gameState.season.scandals = (gameState.season.scandals || 0) + 1;
    Engine.addLog('📰 Skandal w kartotece klubu: ' + reason + ' (łącznie: ' + gameState.club.scandals + ').', 'event');
    if (!quiet) {
      // Nieuchronne skutki – niezależnie od późniejszej reakcji PR
      const r = reason.toLowerCase();
      const sev = /korupc|prowokac|passat|sprzedan|dopin|antydop|koperta|unikanie kontroli/.test(r) ? 4 : /zamieszk|pirotech|chuligan|zatruc|skarb|domiar|sanepid|nadzór|kontrol/.test(r) ? 2 : 1;
      const cost = Math.round(sev * 60 * Selectors.econ() / 10) * 10;
      Engine.applyEffects({ fans: -sev });
      Engine.money('Koszty prawne i wizerunkowe afery', -cost);
      Engine.shiftDNA(-1);
      const fed = gameState.federation || (gameState.federation = { points: 0, log: [] });
      fed.points += sev;
      fed.log = [{ season: gameState.calendar.season, week: gameState.calendar.week, reason, pts: sev }].concat(fed.log || []).slice(0, 12);
      Engine.crisis('scandal', '📰', 'AFERA W KLUBIE!', reason.charAt(0).toUpperCase() + reason.slice(1) + '.');
      const cq = (gameState.crisisQueue || []).find((x) => x.kind === 'scandal' && x.week === gameState.calendar.week);
      if (cq) cq.fixed = { fans: ((cq.fixed && cq.fixed.fans) || 0) + sev, money: ((cq.fixed && cq.fixed.money) || 0) + cost, pts: ((cq.fixed && cq.fixed.pts) || 0) + sev };
      const c = (gameState.crisisQueue || []).find((x) => x.kind === 'scandal' && x.week === gameState.calendar.week);
      const src = Engine.leakSource(reason);
      if (c && !(c.sources || []).includes(src)) c.sources = (c.sources || []).concat([src]).slice(-3);
      const e = Engine._echo;   // afera to echo wcześniejszej decyzji prezesa
      if (c && e && !c.echo) c.echo = { week: e.week, choice: e.choice, from: e.from };
    }
  },
  // Skąd wyciekła afera – zależy od jej rodzaju i od tego, kto ma powód, żeby gadać
  leakSource(reason) {
    const r = reason.toLowerCase();
    const bench = gameState.squad.filter((p) => !p.seasonApps && !p.loan).concat(gameState.squad.filter((p) => p.benched));
    const rival = (gameState.league.rivals[0] || {}).name || 'rywala';
    const opts = [];
    if (/korupc|passat|prowokac|nagrani|sprzedan/.test(r)) opts.push('🔎 Śledztwo lokalnego dziennikarza – „Kurier Powiatowy” miał ukrytą kamerę', '🕵️ Anonimowy donos do Wydziału Dyscypliny od działacza konkurencji');
    if (/zadym|chulig|pirotech|derb/.test(r)) opts.push('👮 Notatka policyjna z meczu trafiła do lokalnej prasy', '📱 Nagranie kibica rywala obiegło Wirtualnego X');
    if (/skarb|podatk|kas |domiar|nadzór|licencj|raty|finans/.test(r)) opts.push('🧾 Przeciek z urzędu gminy – ktoś przeczytał nasze faktury', '💼 Afera wyszła na jaw przez skłóconego byłego księgowego');
    if (/sanepid|zatruc|budk|rzeźnik/.test(r)) opts.push('🔪 Były pracownik rzeźni Waldka sypnął Sanepidowi', '🤢 Wpis zatrutego kibica na grupie „Nasza Gmina”', '🚑 Ratownik medyczny z meczu powiedział o wszystkim w lokalnym radiu');
    if (/obyczaj|whisk|wódk|tabloid|negocjac/.test(r)) opts.push('🗣️ Przeciek od niezadowolonego rezerwowego' + (bench[0] ? ' (' + Selectors.shortName(bench[0]) + ')' : ''), '📸 Zdjęcie z imprezy wrzucone przez kelnerkę z remizy');
    if (/dop|kontrol/.test(r)) opts.push('🧪 Raport komisji antydopingowej wyciekł do mediów');
    if (Selectors.hasRealSponsor() && Math.random() < 0.35) opts.push('💼 Afera wyszła na jaw przez skłóconego sponsora (' + Selectors.sponsor().name + ')');
    opts.push('📱 Wpis zazdrosnego rywala na Wirtualnym X (@Fanatycy' + Selectors.handleFrom(rival) + ')', '🗣️ Przeciek od niezadowolonego rezerwowego' + (bench[0] ? ' (' + Selectors.shortName(bench[0]) + ')' : ''), '🔎 Śledztwo lokalnego dziennikarza');
    const pick = Utils.rand(opts.slice(0, Math.max(2, opts.length - 2)));
    if (pick.startsWith('📱 Wpis zazdrosnego')) Engine.xPostRaw('😈', '@Fanatycy' + Selectors.handleFrom(rival), 'Hahaha, co tam się dzieje w ' + Selectors.clubDisplayName() + '? ' + reason + ' 🤡 Cała gmina już wie.');
    return pick;
  },
  // Pełnoekranowy komunikat kryzysowy (afera, zerwany sponsor, wyrok, bunt gwiazd) – zatrzymuje grę do reakcji prezesa
  crisis(kind, icon, title, line) {
    const q = gameState.crisisQueue || (gameState.crisisQueue = []);
    const w = gameState.calendar.week;
    const same = q.find((c) => c.kind === kind && c.week === w);
    if (same) { if (!same.lines.includes(line)) same.lines = same.lines.concat([line]).slice(-5); return; }
    q.push({ kind, icon, title, week: w, lines: [line] });
    gameState.crisisQueue = q.slice(-4);
  },
  crisisAnswer(choice) {
    const c = (gameState.crisisQueue || []).shift();
    if (!c) return;
    const e = Selectors.econ();
    if (c.kind === 'scandal' && choice === 'apology') {
      const cost = Math.round(150 * e * Math.min(3, c.lines.length) / 10) * 10;
      Engine.money('Oświadczenie i przeprosiny (PR)', -cost);
      Engine.applyEffects({ fans: +1 });
      Engine.shiftDNA(+1);
      Engine.addLog('📢 Prezes wydaje oświadczenie i przeprasza. Agencja PR z powiatu liczy ' + Utils.formatMoney(cost) + '. Część kibiców wybacza. [kibice +1%]', 'decision');
    } else if (c.kind === 'scandal' && choice === 'attack') {
      Engine.applyEffects({ lockerRoom: +2 });
      Engine.shiftDNA(-2);
      if (Selectors.hasRealSponsor()) gameState.sponsor.strikes = (gameState.sponsor.strikes || 0) + 1;
      Engine.addLog('⚔️ Prezes atakuje media: „Nagonka na nasz klub!”. Szatnia i ultrasi kiwają głowami, sponsor marszczy brwi.', 'decision');
    } else if (c.kind === 'bankrupt' && (choice === 'cut-all' || choice === 'cut-top')) {
      const paid = Selectors.paidStaff().sort((a, b) => b.wage - a.wage);
      const fire = choice === 'cut-all' ? paid : paid.slice(0, 2);
      fire.forEach((x) => Engine.cutStaff(x));
      const saved = fire.reduce((a, x) => a + x.wage, 0);
      Engine.applyEffects({ lockerRoom: choice === 'cut-all' ? -8 : -4 });
      Engine.addLog('✂️ BOLESNE CIĘCIA: odchodzą ' + fire.map((x) => x.role + ' (' + x.name + ')').join(', ') + '. Oszczędność ' + Utils.formatMoney(saved) + '/tydz., ale drużyna traci fachowców: słabszy trening, więcej kontuzji, gorszy rozwój młodych. [szatnia ' + (choice === 'cut-all' ? -8 : -4) + '%]', 'decision');
    } else if (c.kind === 'bankrupt' && choice === 'cuts') {
      gameState.activeTab = 'finance';
      gameState.ui.sub = Object.assign({}, gameState.ui.sub, { finance: 'report' });
    } else if (c.kind === 'sponsor' && choice === 'sponsor') {
      gameState.activeTab = 'finance';
      gameState.ui.sub = Object.assign({}, gameState.ui.sub, { finance: 'sponsor' });
    }
  },

  /* ----- Decyzje ----- */
  pushDecision(decisionId) {
    if (DATA.decisions[decisionId] && !gameState.pendingDecisions.includes(decisionId)) {
      gameState.pendingDecisions.push(decisionId);
    }
  },

  resolveDecision(decisionId, optionIndex) {
    const decision = DATA.decisions[decisionId];
    const option = decision && decision.options[optionIndex];
    if (!option || !gameState.pendingDecisions.includes(decisionId)) return;
    // Wszystko liczymy PRZED onChoose (onChoose może zmienić stan, z którego biorą się teksty).
    const effects = Utils.val(option.effects) || {};
    const log = Utils.val(option.log);
    const title = Utils.val(decision.title);
    gameState.pendingDecisions = gameState.pendingDecisions.filter((id) => id !== decisionId);
    Engine.applyEffects(effects, 'Decyzja: ' + title);
    Engine.addLog(log + Engine.describeEffects(effects), 'decision');
    Engine._decisionCtx = { title, label: Utils.val(option.label) };   // echa decyzji pamiętają, skąd się wzięły
    try { if (option.onChoose) option.onChoose(); } finally { Engine._decisionCtx = null; }   // może dodać kolejną decyzję (np. następny emeryt)
  },
  // Skutek decyzji odłożony w czasie: po kilku tygodniach wraca jako afera albo „uszło płazem”
  echo(key, chance, args, delay) {
    const ctx = Engine._decisionCtx || {};
    const w = gameState.calendar.week;
    const d = delay || [3, 8];
    gameState.echoes = (gameState.echoes || []).concat([{ key, chance: Math.round(chance * 100) / 100, args: args || null, due: w + Utils.randInt(d[0], d[1]), week: w, from: ctx.title || (args && args.from) || '', choice: ctx.label || (args && args.choice) || '' }]);
  },
  echoTick() {
    const w = gameState.calendar.week;
    const q = gameState.echoes || [];
    const due = q.filter((e) => e.due <= w);
    if (!due.length) return;
    gameState.echoes = q.filter((e) => e.due > w);
    let fired = false;
    due.forEach((e) => {
      const def = DATA.echoes[e.key];
      if (!def) return;
      const hit = Math.random() < e.chance;
      if (hit && (fired || w - (gameState.echoLastHit || -99) < 4)) { e.due = w + Utils.randInt(2, 3); gameState.echoes.push(e); return; }   // afery nie wybuchają seriami
      Engine._echo = e;
      try {
        if (hit) { fired = true; gameState.echoLastHit = w; def.hit(e.args); }
        else if (def.miss) def.miss(e.args);
        else Engine.addLog('🤫 Sprawa „' + e.choice + '” (tydz. ' + e.week + ') ucichła – uszło płazem.', 'event');
      } finally { Engine._echo = null; }
    });
  },

  canAdvanceWeek() {
    return gameState.pendingDecisions.length === 0;
  },

  /* ----- Sezon, terminarz, tabela ----- */
  newSeason() {
    const s = gameState.season;
    const teams = Utils.shuffle([US].concat(gameState.league.rivals.map((r) => r.name)));
    // Metoda „kołowa”: każdy z każdym, 9 kolejek po 5 meczów; rewanże z zamienionym gospodarzem.
    const n = teams.length;
    const firstHalf = [];
    let rot = teams.slice(1);
    for (let r = 0; r < n - 1; r++) {
      const order = [teams[0]].concat(rot);
      const round = [];
      for (let i = 0; i < n / 2; i++) {
        const a = order[i], b = order[n - 1 - i];
        // Tablice Bergera: drużyna stała zmienia gospodarza co kolejkę, reszta wg parzystości pary
        // (najwyżej 3 mecze z rzędu u siebie / na wyjeździe zamiast całej rundy)
        const aHome = i === 0 ? r % 2 === 0 : i % 2 === 1;
        round.push(aHome ? { home: a, away: b } : { home: b, away: a });
      }
      firstHalf.push(round);
      rot = [rot[rot.length - 1]].concat(rot.slice(0, -1));
    }
    const secondHalf = firstHalf.map((round) => round.map((f) => ({ home: f.away, away: f.home })));
    s.rounds = firstHalf.concat(secondHalf);

    s.table = {};
    [US].concat(gameState.league.rivals.map((r) => r.name)).forEach((t) => { s.table[t] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
    s.lastResults = [];
    s.preview = null;
    gameState.debtNews = [];
    Engine.cupSetup();   // nowa edycja Pucharu Polski
    s.promotionBan = false;
    s.forcedRelegation = false;
    s.scandals = 0;
    gameState.league.rivals.forEach((r) => {
      const prev = s.strength[r.name] || r.strength;
      // lekki dryf siły między sezonami, ale z powrotem w stronę „charakteru” klubu
      s.strength[r.name] = Utils.clamp(prev * 0.5 + r.strength * 0.5 + Utils.randRange(-0.1, 0.1), 0.8, 3);
    });
    // Ambitni rywale: dwóch faworytów do awansu inwestuje przed sezonem – awans nie przychodzi sam
    const favs = gameState.league.rivals.slice().sort((a, b) => s.strength[b.name] - s.strength[a.name]).slice(0, 2);
    s.favorites = favs.map((r) => r.name);
    favs.forEach((r) => { s.strength[r.name] = Utils.clamp(s.strength[r.name] * Utils.randRange(1.1, 1.2), 0.8, 3.4); });
  },

  recordResult(home, away, hg, ag) {
    const t = gameState.season.table;
    const H = t[home], A = t[away];
    H.p++; A.p++; H.gf += hg; H.ga += ag; A.gf += ag; A.ga += hg;
    if (hg > ag) { H.w++; A.l++; H.pts += 3; }
    else if (hg < ag) { A.w++; H.l++; A.pts += 3; }
    else { H.d++; A.d++; H.pts++; A.pts++; }
  },

  simulateOtherMatches() {
    const round = gameState.season.rounds[gameState.calendar.round];
    const results = [];
    round.forEach((f) => {
      if (f.home === US || f.away === US) return;
      const hs = gameState.season.strength[f.home], as = gameState.season.strength[f.away];
      const hg = Utils.poisson(1.25 * Math.pow(hs / as, 1.3) * 1.1);
      const ag = Utils.poisson(1.25 * Math.pow(as / hs, 1.3) / 1.05);
      Engine.recordResult(f.home, f.away, hg, ag);
      results.push({ home: f.home, away: f.away, hg, ag });
    });
    return results;
  },

  /* ----- Bilety: kupowane na bramce przed każdym meczem u siebie ----- */
  // Cennik na sezon: pytanie raz na sezon (przy starcie gry albo przed 1. kolejką)
  offerTicketPolicy() {
    if (gameState.matchday.policySeason === gameState.calendar.season) return;
    gameState.matchday.policySeason = gameState.calendar.season;
    Engine.pushDecision('ticketPolicy');
  },

  setPassPolicy(id) {
    const pp = DATA.passPolicies[id];
    if (!pp) return;
    const f = Selectors.passForecast(id);
    gameState.matchday.pass = { policy: id, holders: f.holders, season: gameState.calendar.season, revenue: f.revenue };
    gameState.matchday.ticket = pp.ticket;
    gameState.matchday.ticketFixKey = '';
    if (f.revenue) Engine.money('Karnety na sezon (' + f.holders + ' szt.)', f.revenue);
    if (id === 'vip') { gameState.monthly.fans -= 4; Engine.addLog('💼 Kibice z „Młyna”: „Karnet za ' + f.price + ' zł? Za to jest wczasy w Mielnie!”.', 'event'); }
    if (id === 'twierdza') { gameState.monthly.fans += 4; Engine.addLog('🔥 Ultrasi już szyją sektorówkę. Karnety rozeszły się w godzinę.', 'event'); }
  },

  // Prognoza na najbliższy mecz u siebie dla danego cennika (bez losowości)
  ticketForecast(id) {
    const next = Selectors.nextHomeFixture();
    if (!next || !DATA.tickets[id]) return null;
    const prev = gameState.matchday.ticket;
    gameState.matchday.ticket = id;
    const att = Engine.estimateAttendance(next.fixture);
    gameState.matchday.ticket = prev;
    return { att, gate: att * DATA.tickets[id].price };
  },

  // Cennik biletów: ustalany przed rundą; w trakcie rundy jedna delikatna korekta (o jeden próg)
  ticketWindowOpen: () => !Selectors.isMatchWeek() || gameState.calendar.round % Selectors.rundaLen() === 0,
  ticketRundaKey: () => 's' + gameState.calendar.season + (gameState.calendar.round < Selectors.rundaLen() ? 'j' : 'w'),
  // Cennik biletów: zmiana działa od następnego miesiąca – bez cotygodniowego chaosu w kasie
  canSetTicket(id) {
    return !!DATA.tickets[id];
  },
  setTicket(id) {
    const md = gameState.matchday;
    if (!DATA.tickets[id]) return;
    md.ticket = id;          // nowy cennik obowiązuje od razu
    md.ticketNext = null;
  },
  // Rozliczenie miesiąca: nowe cenniki wchodzą w życie, skutki cen dla kibiców liczone hurtem i łagodniej
  monthlySettlement() {
    const m = gameState.monthly;
    const md = gameState.matchday, shop = gameState.merch;
    const changes = [];
    if (md.ticketNext && DATA.tickets[md.ticketNext]) { md.ticket = md.ticketNext; changes.push('bilety: ' + DATA.tickets[md.ticket].policy); }
    md.ticketNext = null;
    if (shop.markupNext && DATA.merchMarkups[shop.markupNext]) { shop.markup = shop.markupNext; changes.push('sklep: ' + DATA.merchMarkups[shop.markup].label.split(' – ')[0]); }
    shop.markupNext = null;
    // wyniki zmieniają wyrozumiałość: przy passie kibice łatwiej łykają drożyznę, w kryzysie – wszystko boli bardziej
    const tolerance = m.fans < 0 ? Utils.clamp(2 - Selectors.formFactor() * 1.2, 0.4, 1.6) : 1;
    const fans = Utils.clamp(Math.round(m.fans * 0.6 * tolerance), -8, 8);   // miesięczna stabilizacja: łagodniej i z limitem w obie strony
    if (fans) Engine.applyEffects({ fans });
    const sum = m.tickets + m.merch + m.gastro;
    if (sum || fans || changes.length) {
      Engine.alert('📅', 'Rozliczenie miesiąca', 'Bilety ' + Utils.formatMoney(m.tickets) + ', sklep ' + Utils.formatMoney(m.merch) + ', gastro ' + Utils.formatMoney(m.gastro) + (fans ? ' · nastroje po cenach: kibice ' + (fans > 0 ? '+' : '') + fans + '%' : '') + (changes.length ? ' · nowy cennik: ' + changes.join(', ') : ''), fans < 0 ? 'warn' : 'info');
    }
    gameState.monthly = { fans: 0, tickets: 0, merch: 0, gastro: 0 };
  },

  /* ----- Kadra: skład, chemia, siła ----- */
  // Jak bardzo profil zawodnika pasuje do stylu trenera (0..1)
  profileFit(player, style) {
    // Każdy zawodnik pasuje na swoją pozycję; profil zgodny ze stylem daje tylko lekki bonus do zgrania
    if (style === 'bal' || player.profile === style || player.profile === 'uni') return 1;
    return 0.8;
  },

  // Trener NPC wybiera skład. Prezes nie ma tu nic do gadania.
  pickLineup(absentIds = []) {
    const coach = Selectors.coach();
    const style = DATA.styles[coach.style];
    const avail = gameState.squad.filter((p) => !absentIds.includes(p.id) && !p.benched && !p.exiled && !(p.injured > 0) && !(p.suspended > 0));
    // Obietnica dla „Naszych w Bawarii”: najmłodszy zawodnik musi grać
    const youngest = gameState.dda.youthPromise > 0 ? avail.slice().sort((a, b) => a.age - b.age)[0] : null;
    const score = (p) => {
      if (youngest && p.id === youngest.id) return 99;
      let s = p.skill + Engine.profileFit(p, coach.style) * 1.2;
      if (coach.prefers === 'veterans' && p.age >= 30) s += 1.5;
      if (coach.prefers === 'youth' && p.age <= 24) s += 1;
      return s;
    };
    const chosen = [];
    ['GK', 'DEF', 'MID', 'FWD'].forEach((pos, i) => {
      avail.filter((p) => p.pos === pos).sort((a, b) => score(b) - score(a)).slice(0, style.formation[i]).forEach((p) => chosen.push(p));
    });
    // Braki na pozycjach uzupełnia ktokolwiek (bramkarza też – ktoś musi stanąć).
    const rest = avail.filter((p) => !chosen.includes(p)).sort((a, b) => score(b) - score(a));
    while (chosen.length < 11 && rest.length) chosen.push(rest.shift());
    return chosen;
  },

  chemistry(lineup) {
    const coach = Selectors.coach();
    if (!lineup.length) return 0;
    const fit = lineup.reduce((s, p) => s + Engine.profileFit(p, coach.style), 0) / lineup.length;
    const staffChem = Object.values(gameState.staff).reduce((s, m) => s + (m ? m.chem : 0), 0);
    const rebel = Selectors.rebel() ? 15 : 0;   // buntownik rozbija zgranie
    const traitChem = (Selectors.coachTrait('tactician') ? 8 : 0) - (Selectors.coachTrait('motivator') ? 6 : 0);
    return Math.round(Utils.clamp(15 + fit * 70 + staffChem + traitChem - rebel, 0, 100));
  },

  teamStrength(lineup, chem) {
    const avgSkill = lineup.reduce((s, p) => s + p.skill, 0) / Math.max(1, lineup.length);
    const missing = 11 - lineup.length;
    let s = 0.45 + avgSkill * 0.13;
    s *= 0.88 + chem * 0.0025;
    s *= 0.94 + gameState.morale.lockerRoom * 0.0012;
    // asystent mnoży jakość trenera i sam dokłada swoje; kurs podnosi warsztat
    s *= 1 + Selectors.coach().quality * Selectors.assistantMult() + Selectors.staffLevel('asystent') * 0.012 + Math.max(0, Selectors.coachLicense() - (Selectors.coach().license || 0)) * 0.02;
    s *= 1 - Selectors.fatiguePenalty();
    if (Selectors.coachTrait('hardTraining')) s *= 1.04;
    if (Selectors.coachTrait('discipline')) s *= 1.03;
    s *= 1 - missing * 0.06;
    if (gameState.debt.strike) s *= 0.9;           // strajk: nie ma na paliwo, nie ma gry
    if (Selectors.rebel()) s *= 0.92;              // bunt gwiazdy: nikt nie podaje do nikogo
    if ((gameState.star.slumpUntil || 0) > gameState.calendar.week) s *= 0.9;   // kryzys formy po wybuchu buntu
    return s;
  },

  /* ----- Dzień meczowy ----- */
  // Szacunek bez losowości – używany też w UI do podglądu.
  estimateAttendance(fixture, weather = gameState.weather) {
    const rival = fixture.rivalObj || Selectors.rival(fixture.rival) || { derby: false };
    const ticket = DATA.tickets[gameState.matchday.ticket];
    let base = (25 + gameState.morale.fans * 1.1) * Selectors.revEcon();   // świeżo awansowany klub: mniej widzów, marka się buduje
    base *= Selectors.upgradeProd('attendance');   // obiekty i ich kolejne poziomy
    base *= Selectors.formFactor();                  // passa przyciąga, kryzys odstrasza
    if (Selectors.coachTrait('mediaStar')) base *= 1.1;   // trener-celebryta ściąga ludzi
    if (rival.derby) base *= 2;
    base *= fixture.hype || 1;   // mecz pucharowy przyciąga więcej ludzi
    if (Selectors.coach().style === 'off') base *= 1.1;   // na widowisko przychodzi więcej ludzi
    if (Selectors.coach().style === 'def') base *= 0.9;   // na mur przychodzą tylko krzyżówkowicze
    if (gameState.x.hype) base *= 1.15;                   // pompka na Wirtualnym X
    if (Selectors.mediaStrategy() === 'populist') base *= 1.1;   // strategia populistyczna: „wszyscy na stadion”
    if (gameState.bonuses.fetaMatches > 0) base *= 1.1;   // po fecie ludzie jeszcze przychodzą
    // Letnicy z miasta nie liczą każdej złotówki na bilecie
    base *= gameState.club.character === 'suburban' && ticket.attendance < 1 ? 1 - (1 - ticket.attendance) / 2 : ticket.attendance;
    if (gameState.club.character === 'industrial') base *= 1.15;   // osada przemysłowa: ludzie i tak nie mają co robić w sobotę
    if (gameState.stadium.pitch < 25) base *= 0.85;
    let att = base * weather.attendance;
    if (weather.rain && gameState.stadium.upgrades.roof) att += Math.min(30, base - att);
    return Math.max(0, Math.min(Selectors.stadiumCapacity(), Math.round(att)));   // więcej się nie zmieści
  },

  // Jeden silnik dla ligi i pucharu: cup = { opp, oppS, home, neutral, hype, round, oppLeague } – wtedy bez tabeli i kalendarza
  playMatchday(cup) {
    if (!cup) Engine.closeTransferWindow();   // pierwszy gwizdek sezonu zamyka okno transferowe
    if (!cup && gameState.calendar.round === 0) gameState.season.preview = Selectors.seasonPreview();
    const fixture = cup ? { rival: cup.opp, home: !!cup.home && !cup.neutral, rivalObj: { name: cup.opp, derby: false }, hype: cup.hype || 1 } : Selectors.currentFixture();
    const rival = cup ? fixture.rivalObj : Selectors.rival(fixture.rival);
    const weather = gameState.weather;
    const kolejka = gameState.calendar.round + 1;
    const report = gameState.report || {};
    const leagueSnap = cup ? { lastMatch: gameState.lastMatch, homeMatch: report.homeMatch, result: report.result, matchCtx: report.matchCtx } : null;   // puchar nie nadpisuje meczu ligowego
    const coachState = gameState.coach;
    const coach = Selectors.coach();
    report.homeMatch = fixture.home;

    // --- Kto nie dojechał ---
    const disc = 1 - Selectors.staffLevel('kierownik') * 0.12;   // dobry kierownik pilnuje, kto dojedzie
    const absent = gameState.squad.filter((p) => !(p.injured > 0) &&
      ((p.tag === 'worker' && Math.random() < 0.25 * disc) || (p.tag === 'party' && Math.random() < 0.15 * disc)));
    absent.forEach((p) => Engine.addLog('🚧 ' + Selectors.playerName(p) + ' nie dojechał na mecz (' + (p.tag === 'worker' ? 'budowa się przeciągnęła' : 'wesele do 6 rano') + ').', 'event'));

    // --- Skład i chemia (wybiera trener) ---
    const lineup = Engine.pickLineup(absent.map((p) => p.id));
    if (!cup && gameState.dda.youthPromise > 0) {
      gameState.dda.youthPromise--;
      const kid = lineup.slice().sort((a, b) => a.age - b.age)[0];
      if (kid) Engine.addLog('🇩🇪 Zgodnie z obietnicą dla „Naszych w Bawarii” gra ' + Selectors.playerName(kid) + ' (' + kid.age + ' l.). Zostało meczów: ' + gameState.dda.youthPromise + '.', 'event');
    }
    let chem = Engine.chemistry(lineup);
    if (coach.disappears && Math.random() < coach.disappears) {
      chem = Math.max(0, chem - 25);
      Engine.addLog('🍺 Trener ' + coach.name + ' zniknął w piątek „w sprawach rodzinnych”. Skład w sobotę ustalał pan Rysiek z kartki.', 'event');
    }

    // --- Siła i oczekiwane gole ---
    const ourS = Engine.teamStrength(lineup, chem) * (1 + (cup ? 0 : coachState.carpetBoost));
    if (!cup) coachState.carpetBoost = 0;
    const oppS = cup ? cup.oppS : gameState.season.strength[rival.name];
    const style = DATA.styles[coach.style];
    const ratio = ourS / oppS;
    const homeAdv = cup && cup.neutral ? 1 : fixture.home ? 1.12 * (1 + (Selectors.passPolicy().homeAdv || 0)) : 1 / 1.08;   // karnetowicze robią (albo nie) atmosferę
    let ourL = 1.25 * Math.pow(ratio, 1.3) * style.tempo * homeAdv;
    let oppL = 1.25 * Math.pow(1 / ratio, 1.3) * style.tempo / homeAdv;
    // Styl gry trenera: realny wpływ zależny od rywala i pogody
    if (coach.style === 'off') { ourL *= ratio > 1.05 ? 1.18 : 1.05; oppL *= 1.1; if (weather.rain) ourL *= 0.9; }
    else if (coach.style === 'def') { oppL *= ratio < 0.95 ? 0.72 : 0.85; ourL *= 0.85; }
    else if (chem >= 60) { ourL *= 1.04; oppL *= 0.96; }
    if (chem < 50) oppL *= 1 + (50 - chem) / 120;                   // głupie straty przy złym zgraniu
    if (coach.mudWeakness && weather.rain) oppL *= 1.35;            // tiki-taka w kałużach
    if (coach.mudWeakness && lineup.reduce((s, p) => s + p.skill, 0) / lineup.length < 5) oppL *= 1.2;
    const pitchChaos = fixture.home ? (100 - gameState.stadium.pitch) / 300 : 0.1;
    const chaos = Utils.clamp(weather.chaos + pitchChaos, 0, 0.9);
    const avg = (ourL + oppL) / 2;
    ourL = ourL * (1 - chaos) + avg * chaos;
    oppL = oppL * (1 - chaos) + avg * chaos;
    // --- Kartki: temperament zawodników × styl trenera × derby; czerwona osłabia drużynę ---
    const servedBan = gameState.squad.filter((p) => p.suspended > 0);   // ci pauzowali w tym meczu
    const cards = Engine.rollCards(lineup, rival.derby);
    const ourReds = cards.filter((c) => c.us && c.card === 'R').length, theirReds = cards.filter((c) => !c.us && c.card === 'R').length;
    if (ourReds) { ourL *= Math.pow(0.82, ourReds); oppL *= Math.pow(1.15, ourReds); }
    if (theirReds) { ourL *= Math.pow(1.15, theirReds); oppL *= Math.pow(0.85, theirReds); }
    const fixedMatch = cup ? null : gameState.dark.fixed;
    if (fixedMatch === 'buy') { ourL *= 1.6; oppL *= 0.5; }        // „zmotywowany” sędzia i rywal
    if (lineup.some((p) => p.ace)) ourL += 0.7;                       // Kacper Chudy: z nim bramki padają same
    let gf = Utils.poisson(Math.max(0.15, ourL));
    let ga = Utils.poisson(Math.max(0.15, oppL));
    if (fixedMatch === 'sell' && gf >= ga) ga = gf + 1;               // odpuszczony mecz
    const result = gf > ga ? 'W' : gf === ga ? 'D' : 'L';

    // --- Tabela: nasz mecz + reszta kolejki (tylko liga) ---
    if (!cup) {
      if (fixture.home) Engine.recordResult(US, rival.name, gf, ga);
      else Engine.recordResult(rival.name, US, ga, gf);
      const others = Engine.simulateOtherMatches();
      gameState.season.lastResults = [fixture.home ? { home: US, away: rival.name, hg: gf, ag: ga } : { home: rival.name, away: US, hg: ga, ag: gf }].concat(others);
    }

    // --- Kontuzje: dobry fizjoterapeuta = rzadziej i krócej ---
    const fizjo = Selectors.staffLevel('fizjo');
    lineup.forEach((p) => {
      const pitchRisk = fixture.home && gameState.stadium.pitch < 30 ? 1.3 : 1;   // kretowisko łamie kostki
      const ageRisk = (p.age >= 32 ? 1.3 : 1) * (p.fragile ? 1.6 : 1) * (Selectors.coachTrait('hardTraining') ? 1.5 : 1);
      if (Math.random() < 0.025 * (1 - fizjo * 0.17) * (weather.rain ? 1.4 : 1) * pitchRisk * ageRisk * (1 + Selectors.fatiguePenalty() * 4)) {
        const severe = Math.random() < 0.15 * (1 - fizjo * 0.15);   // poważny uraz: więzadła, złamanie
        const base = severe ? Utils.randInt(5, 9) : Utils.randInt(1, 4);
        p.injured = Math.max(1, base - Math.floor(fizjo / 2) - (severe && fizjo >= 4 ? 2 : 0));
        p.injuryLabel = severe ? Utils.rand(['zerwane więzadło', 'złamana kość śródstopia', 'uszkodzona łąkotka']) : Utils.rand(['naciągnięty mięsień', 'skręcona kostka', 'stłuczenie', 'naderwany przywodziciel']);
        Engine.addLog('🩹 ' + Selectors.playerName(p) + ': ' + p.injuryLabel + '. Przerwa: ' + p.injured + ' tyg.' + (fizjo ? ' (fizjoterapeuta skrócił leczenie)' : ' Bez fizjoterapeuty – lód i „rozchodzi się”.'), 'event');
      }
    });

    // --- Strzelcy i doświadczenie ---
    lineup.forEach((p) => { p.apps++; p.seasonApps++; });
    const scorerCount = {};
    const goalEvents = [];   // strzelec + asystent – do ekranu meczowego
    for (let i = 0; i < gf; i++) {
      const w = (p) => ({ GK: 0.05, DEF: 0.7, MID: 2.5, FWD: 5 }[p.pos]) * p.skill * (p.tag === 'freekick' ? 1.5 : 1) * (p.ace ? 2 : 1);
      const scorer = Utils.weightedPick(lineup, w);
      scorer.goals++; scorer.seasonGoals++;
      scorerCount[scorer.id] = (scorerCount[scorer.id] || 0) + 1;
      if (Math.random() < 0.75) {   // asysta: najczęściej pomocnik albo skrzydłowy, nigdy sam strzelec
        const mates = lineup.filter((x) => x !== scorer);
        const ace = mates.find((p) => p.ace);   // Kacper Chudy kreuje większość akcji kolegów
        const assist = ace && Math.random() < 0.55 ? ace : mates.length && Utils.weightedPick(mates, (p) => ({ GK: 0.1, DEF: 1.2, MID: 4, FWD: 2.5 }[p.pos]) * p.skill);
        if (assist) { assist.assists = (assist.assists || 0) + 1; assist.seasonAssists = (assist.seasonAssists || 0) + 1; }
        goalEvents.push({ p: scorer, a: assist || null });
      } else goalEvents.push({ p: scorer, a: null });
    }
    const scorers = Object.entries(scorerCount).map(([id, n]) => {
      const p = gameState.squad.find((x) => x.id === id);
      return Selectors.shortName(p) + (n > 1 ? ' ×' + n : '');
    });

    const clubName = Selectors.clubDisplayName();
    const scoreLine = fixture.home
      ? clubName + ' ' + gf + ':' + ga + ' ' + rival.name
      : rival.name + ' ' + ga + ':' + gf + ' ' + clubName;
    const derbyTag = rival.derby ? ' (🔥 KOSA)' : '';
    let extra = '';
    if (result === 'W' && oppS > ourS && chaos >= 0.5) extra = ' SENSACJA NA BŁOCIE! Faworyt utonął w kałużach.';
    Engine.addLog((cup ? '🏆 ' + (cup.comp || 'Puchar Polski') + ' (' + cup.round + ')' : '⚽ Kolejka ' + kolejka) + derbyTag + ': ' + scoreLine + ' (' + (fixture.home ? 'u siebie, ' + gameState.club.town : 'wyjazd') + ', ' + weather.icon + ' ' +
      weather.label.charAt(0).toLowerCase() + weather.label.slice(1) + ').' + extra + (scorers.length ? ' Gole: ' + scorers.join(', ') + '.' : ''), 'match');

    // Ekran meczowy: minuty goli (tylko do prezentacji), finanse dopisuje dzień meczowy
    const goals = goalEvents.map((g) => ({ min: Utils.randInt(1, 90), us: true, name: Selectors.shortName(g.p), assist: g.a ? g.a.last : null }));
    for (let i = 0; i < ga; i++) goals.push({ min: Utils.randInt(1, 90), us: false, name: rival.name });
    goals.sort((a, b) => a.min - b.min);
    gameState.lastMatch = {
      week: gameState.calendar.week, key: gameState.calendar.week + (cup ? 'c' : ''), kolejka, home: fixture.home, rival: rival.name, derby: rival.derby,
      cupInfo: cup ? { round: cup.round, oppLeague: cup.oppLeague, neutral: !!cup.neutral, comp: cup.comp || 'Puchar Polski', venue: cup.venue ? cup.venue.name : null } : null,
      weatherIcon: weather.icon, weatherLabel: weather.label, gf, ga, result, goals, money: [], attendance: null,
      sensation: !!extra, cards: cards.map((c) => ({ min: c.min, us: c.us, card: c.card, name: c.name })),
      lineupIds: lineup.map((p) => p.id), scorerCount: { ...scorerCount },
    };
    servedBan.forEach((p) => { p.suspended = Math.max(0, p.suspended - 1); });
    Engine.applyCardBans(cards);

    // --- Noty meczowe (1.0–10.0) dla wyjściowej jedenastki ---
    Engine.rateLineup(lineup, scorerCount, result, gf, ga);

    // --- Statystyki ---
    const r = gameState.record;
    if (!cup) {   // bilans ligowy – puchar liczy się tylko do formy i serii
      r.played++; r.goalsFor += gf; r.goalsAgainst += ga;
      r[{ W: 'wins', D: 'draws', L: 'losses' }[result]]++;
    }
    if (result === 'W') { r.lossStreak = 0; r.winStreak++; }
    if (result === 'D') { r.lossStreak = 0; r.winStreak = 0; }
    if (result === 'L') { r.lossStreak++; r.winStreak = 0; }
    r.form.push(result); if (r.form.length > 5) r.form.shift();
    const st = gameState.stats;
    st.matches++; st.goalsFor += gf; st.goalsAgainst += ga;
    st[{ W: 'wins', D: 'draws', L: 'losses' }[result]]++;
    report.result = result;
    // Kontekst meczu dla Wirtualnego X (uzupełniany niżej o zatrucia, zadymy itd.)
    report.matchCtx = {
      result, gf, ga, home: fixture.home, rival: rival.name, derby: rival.derby, weather: weather.id,
      style: coach.style, coachId: coachState.id, coachName: coach.name,
      favScorers: Object.keys(scorerCount).map((id) => gameState.squad.find((x) => x.id === id)).filter((p) => p && p.favorite).map((p) => p.nick),
      poisoned: false, riot: false, hype: gameState.x.hype, fixed: fixedMatch,
    };

    // --- Nastroje: kibice kochają gole, nienawidzą muru ---
    const mult = rival.derby ? 2 : 1;
    let fans = { W: 4, D: 0, L: -4 }[result] * mult;
    if (result === 'L' && gameState.club.character === 'industrial') fans -= 2;   // surowsi kibice z osady
    if (gf + ga >= 5) fans += 2;
    if (gf >= 3) fans += 1;
    if (gf + ga <= 1 && result !== 'W') fans -= coach.style === 'def' ? 4 : 2;
    fans += coach.fanMod;
    if (gameState.x.hype) {                       // pompka na X: wygrana smakuje lepiej, porażka boli podwójnie
      fans += result === 'L' ? -6 : result === 'W' ? 2 : 0;
      gameState.x.hype = false;
    }
    // Strategia medialna sezonu
    if (Selectors.mediaStrategy() === 'populist') fans += result === 'W' ? 2 : result === 'L' ? -3 : 0;
    if (Selectors.mediaStrategy() === 'spicy') fans += 1;
    const locker = { W: 5, D: 1, L: -4 }[result];
    Engine.applyEffects({ fans, lockerRoom: locker });

    // Ulubieniec Trybun na ławce = kibice niezadowoleni
    gameState.squad.filter((p) => p.favorite && !lineup.includes(p) && !absent.includes(p)).forEach((p) => {
      Engine.applyEffects({ fans: -2 });
      Engine.addLog('📣 Kibice skandują „' + p.nick.toUpperCase() + '! ' + p.nick.toUpperCase() + '!”, a ' + Selectors.playerName(p) + ' grzeje ławę. [kibice -2%]', 'event');
    });

    // Mur bez wygranych → kibice chcą głowy trenera
    if (coach.style === 'def' && result !== 'W' && gf <= 1) coachState.boringStreak++;
    else coachState.boringStreak = 0;
    if (coachState.boringStreak >= 3 && coachState.id !== 'mirek' && Selectors.teamStruggling()) {
      coachState.boringStreak = 0;
      Engine.pushDecision('fansVsCoach');
    }

    // --- Raport trenera ---
    let coachReport = Utils.rand(coach.reports[result]);
    if (chem < 50) coachReport += ' ' + coach.complaint;
    coachState.lastReport = coachReport;
    Engine.addLog('🗣️ Trener ' + coach.name + ': „' + coachReport + '”', 'coach');

    Engine.updateBadges();

    // --- Pieniądze z dnia meczowego ---
    if (cup && cup.neutral) {   // finał na neutralnym stadionie: udział w zysku z biletów
      const v = cup.venue || { name: 'PGE Narodowy, Warszawa', att: [40000, 58000] };
      const att = Math.round(Utils.randRange(v.att[0], v.att[1]));
      const share = Math.round(att * DATA.tickets[gameState.matchday.ticket].price * 0.15);
      Engine.money('Finał: udział w biletach', share);
      gameState.lastMatch.attendance = att;
      gameState.lastMatch.money.push({ label: 'Udział w biletach (' + v.name + ')', amount: share });
    } else if (fixture.home) Engine.homeMatchdayIncome(fixture, rival, weather);
    else {
      const fuel = -Utils.randInt(50, 90);
      Engine.money('Paliwo do busa (wyjazd)', fuel);
      if (gameState.lastMatch) gameState.lastMatch.money.push({ label: 'Paliwo do busa', amount: fuel });
    }

    const tv = Selectors.tvIncome();
    if (tv) {   // kamery telewizyjne: prawa do transmisji z każdego meczu
      Engine.money('Prawa TV' + (cup ? ' (puchar)' : ''), tv);
      gameState.lastMatch.money.push({ label: '📺 Prawa do transmisji', amount: tv });
    }
    if (cup) {   // mecz pucharowy gotowy – liga i jej kalendarz zostają nietknięte
      const cm = gameState.lastMatch;
      gameState.lastMatch = leagueSnap.lastMatch;
      Object.assign(report, { homeMatch: leagueSnap.homeMatch, result: leagueSnap.result, matchCtx: leagueSnap.matchCtx });
      return cm;
    }

    // --- Europejski wieczór w środku tygodnia ---
    Engine.euroKoTick(kolejka);
    Engine.euroWeek(kolejka);
    Engine.euroKoTick(kolejka);   // 13.79: pozostałe pary drabinki
    Engine.cupWeek(kolejka);
    Engine.u19Match();   // juniorzy grają równolegle

    // --- Kalendarz ligi ---
    Engine.resolveDarkDeal();
    gameState.matchday.security = null;
    gameState.calendar.round++;
    if (gameState.calendar.round >= gameState.season.rounds.length) Engine.endSeason();
  },

  homeMatchdayIncome(fixture, rival, weather) {
    const md = gameState.matchday;
    const ticket = DATA.tickets[md.ticket];

    const att = Math.min(Selectors.stadiumCapacity(), Math.round(Engine.estimateAttendance(fixture, weather) * Utils.randRange(0.85, 1.15)));
    const holders = Math.min(att, Selectors.passHolders());   // karnetowicze już zapłacili z góry
    const paying = att - holders;
    if (gameState.bonuses.fetaMatches > 0) gameState.bonuses.fetaMatches--;
    const gate = paying * ticket.price;
    Engine.money('Bilety (' + paying + ' × ' + ticket.price + ' zł)', gate);

    const pp = Selectors.passPolicy();
    // Budka: każda pozycja menu sprzedaje się osobno – zależnie od swojej ceny
    const bud = gameState.budka;
    const mult = att * weather.grill * Selectors.upgradeProd('grill') * (pp.grill || 1) * Selectors.formFactor();
    let sold = 0, grillProfit = 0;
    bud.last = {};
    (Selectors.budkaOpen() ? Selectors.budkaMenu() : []).forEach((id) => {
      const it = DATA.budka.items[id];
      const n = Math.round(mult * it.share * 0.7 * Selectors.budkaDemand(id) * Utils.randRange(0.85, 1.15));
      const profit = n * (Selectors.budkaPrice(id) - Selectors.budkaCost(id));
      bud.last[id] = { n, profit };
      sold += n; grillProfit += profit;
    });
    gameState.stats.sausages += sold;
    if (Selectors.budkaOpen()) Engine.money('Budka u Pana Zenka (' + sold + ' szt.)', grillProfit);
    const pi = Selectors.budkaPriceIndex();
    const budkaFans = pi > 1.4 ? -2 : pi > 1.15 ? -1 : pi < 0.85 ? 1 : 0;   // drożyzna w budce psuje humory (rozliczane co miesiąc)
    const sausage = { label: 'menu: ' + Selectors.budkaMenu().length + ' poz.', fans: budkaFans };
    if (gameState.lastMatch) {
      gameState.lastMatch.attendance = att;
      gameState.lastMatch.holders = holders;
      gameState.lastMatch.money.push({ label: 'Bilety (' + paying + ' × ' + ticket.price + ' zł)', amount: gate });
      if (Selectors.budkaOpen()) gameState.lastMatch.money.push({ label: 'Gastro: ' + sold + ' szt. (' + sausage.label + ')', amount: grillProfit });
    }

    Engine.addLog('🏟️ Frekwencja: ' + att + ' widzów' +
      '. Bilety: ' + Utils.formatMoney(gate) + (Selectors.budkaOpen() ? '. Budka Zenka: ' + sold + ' szt. (' + sausage.label + ') → ' + Utils.formatMoney(grillProfit) + ' zysku.' : '. Budki jeszcze nie ma – kibice przynoszą kanapki z domu.'), 'finance');

    const ticketFans = gameState.club.character === 'suburban' && ticket.fans < 0 ? Math.round(ticket.fans / 3) : ticket.fans;
    gameState.monthly.fans += ticketFans + sausage.fans + (pp.fansMatch || 0);   // skutki cen dla kibiców – raz w miesiącu
    gameState.monthly.tickets += gate;
    gameState.monthly.gastro += grillProfit;
    // Konsekwencje polityki karnetowej
    if (pp.pyro && Math.random() < pp.pyro) {
      const fine = Math.round(250 * Selectors.econ());
      Engine.money('Kara: race na sektorze karnetowiczów', -fine);
      if (gameState.lastMatch) gameState.lastMatch.money.push({ label: 'Kara za race (twierdza)', amount: -fine });
      Engine.addLog('🎆 Fanatycy z tanich karnetów odpalili race. Delegat zapisał wszystko: kara ' + Utils.formatMoney(fine) + '.', 'event');
    }
    if (pp.boycott && Math.random() < pp.boycott) {
      gameState.monthly.fans -= 3;   // rozliczane w miesięcznym bilansie
      Engine.addLog('🪧 Ultrasi bojkotują „piknik dla rodzin”: transparent „TU SIĘ KIBICUJE, NIE JE WATĘ”. (nastroje rozliczane co miesiąc)', 'event');
    }
    if (pp.loseHome && gameState.lastMatch && gameState.lastMatch.result === 'L') {
      gameState.monthly.fans += pp.loseHome;
      Engine.addLog('💼 Posiadacze karnetów VIP piszą skargi: „Płacimy jak za teatr, a gra jak w cyrku”. (nastroje rozliczane co miesiąc)', 'event');
    }


    if (rival.derby) {
      if (md.security === 'hired' || gameState.stadium.upgrades.monitoring) {
        Engine.addLog('🛡️ Byczki z Herkulesa stali przy bramie. Nikt nie odważył się rzucić nawet łupiną od słonecznika.', 'event');
      } else if (Math.random() < (gameState.club.character === 'industrial' ? 0.6 : 0.45)) {
        Engine.money('Kara Związku za zadymę', -Math.round(600 * Selectors.econ()));
        if (gameState.lastMatch) gameState.lastMatch.money.push({ label: 'Kara Związku za zadymę', amount: -Math.round(600 * Selectors.econ()) });
        Engine.applyEffects({ fans: +2 });
        Engine.addLog('💥 ZADYMA! Przyjezdni kibice (' + rival.name + ') wtargnęli na murawę, wujek Staszek zgubił latarkę. Związek nalicza karę 600 zł. Miejscowi zachwyceni widowiskiem.', 'event');
        Engine.shiftDNA(-5);   // zadyma to incydent meczowy, nie afera – afery biorą się tylko z decyzji prezesa
        gameState.report.matchCtx.riot = true;
      } else {
        Engine.addLog('😅 Derby bez ochrony przeszły spokojnie. Wujek Staszek mówi, że to dzięki latarce.', 'event');
      }
    }

    const damage = 5 + weather.pitchDamage;
    gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch - damage, 0, 100);
    if (weather.pitchDamage >= 15) Engine.addLog('🟫 Mecz w deszczu zrył murawę (-' + damage + ' stanu boiska). Pan Heniek klnie pod nosem z grabiami w ręku.', 'event');
  },

  // Noty: wynik, gole, czyste konto, klasa na tle reszty składu, cechy (kac po weselu!) i trochę losu.
  rateLineup(lineup, scorerCount, result, gf, ga) {
    if (!lineup.length) return;
    const avgSkill = lineup.reduce((s, p) => s + p.skill, 0) / lineup.length;
    const noise = () => (Math.random() + Math.random() + Math.random() - 1.5) * 0.8;
    const hungover = [];
    const rated = lineup.map((p) => {
      const goals = scorerCount[p.id] || 0;
      let r = 6 + { W: 0.5, D: 0, L: -0.5 }[result] + (p.skill - avgSkill) * 0.2 + noise();
      r += goals ? 1.2 + (goals - 1) * 0.9 : 0;
      if (p.pos === 'GK' || p.pos === 'DEF') r += ga === 0 ? 0.8 : -0.25 * Math.max(0, ga - 1);
      if (p.pos === 'FWD' && goals === 0) r -= 0.3;
      if (p.tag === 'freekick' && goals) r += 0.3;
      if (p.tag === 'party' && Math.random() < 0.3) { r -= 2.5; hungover.push(p); }
      if (r > 7.5) r = 7.5 + (r - 7.5) * 0.7;   // wysokie noty trudno zdobyć: 9+ to wybitny mecz, 10.0 – występ życia
      if (r > 9) r = 9 + (r - 9) * 0.4;
      r = Math.round(Utils.clamp(r, 1, 10) * 10) / 10;
      p.lastRating = r;
      p.formHistory = (p.formHistory || []).concat(r).slice(-5);   // forma: noty z 5 ostatnich meczów
      p.seasonRatingSum = (p.seasonRatingSum || 0) + r;
      p.seasonRatingCount = (p.seasonRatingCount || 0) + 1;
      p.careerRatingSum = (p.careerRatingSum || 0) + r;
      p.careerRatingCount = (p.careerRatingCount || 0) + 1;
      return { p, r };
    }).sort((a, b) => b.r - a.r);
    hungover.forEach((p) => Engine.addLog('🥴 ' + Selectors.nickQ(p) + ' grał z wyraźnym kacem po weselu – nota ' + p.lastRating.toFixed(1) + '. Na rozgrzewce pomylił bramki.', 'event'));
    const best = rated[0], worst = rated[rated.length - 1];
    if (gameState.lastMatch) gameState.lastMatch.best = { name: Selectors.playerName(best.p), r: best.r };
    // MVP meczu: przy porażce wyróżnienie dostaje najlepszy zawodnik rywali
    const lm = gameState.lastMatch;
    if (lm) {
      if (result === 'L') {
        const n = { first: Utils.rand(DATA.names.first), nick: Utils.rand(DATA.names.nick), last: Utils.rand(DATA.names.last) };
        const r = Math.round(Utils.clamp(Utils.randRange(7.1, 8.1) + (ga - gf) * 0.2, 6.8, 9.4) * 10) / 10;
        const pos = Utils.rand(ga >= 2 ? ['napastnik', 'napastnik', 'pomocnik'] : ['pomocnik', 'obrońca', 'bramkarz', 'napastnik']);
        lm.mvp = { name: n.first + ' „' + n.nick + '” ' + n.last, r, rival: true, team: lm.rival, role: pos };
      } else lm.mvp = { name: Selectors.playerName(best.p), r: best.r, rival: false, team: Selectors.clubDisplayName(), role: DATA.positions[best.p.pos].label.toLowerCase() };
      Engine.addLog('🏅 MVP meczu: ' + lm.mvp.name + ' (' + lm.mvp.team + ', ' + lm.mvp.r.toFixed(1) + ')' + (lm.mvp.rival ? ' – rywale mieli dziś najlepszego na boisku.' : '.'), 'match');
    }
    Engine.addLog('⭐ Gracz meczu: ' + Selectors.playerName(best.p) + ' (' + best.r.toFixed(1) + ') · 🪵 Najsłabszy na boisku: ' + Selectors.playerName(worst.p) + ' (' + worst.r.toFixed(1) + ')', 'match');
  },

  // Ulubieniec Trybun: gole albo dużo meczów przy dobrej klasie. Trybuny kochają naraz najwyżej kilku.
  updateBadges() {
    gameState.squad.forEach((p) => {
      if (gameState.squad.filter((x) => x.favorite).length >= CONFIG.maxFavorites) return;
      if (!p.favorite && (p.goals >= 12 || (p.apps >= 45 && p.skill >= 6))) {
        p.favorite = true;
        Engine.addLog('⭐ ' + Selectors.playerName(p) + ' zostaje ULUBIEŃCEM TRYBUN! Babcie z pierwszego rzędu szyją mu szalik.', 'event');
      }
    });
  },

  endSeason() {
    const verdict = Engine.stingVerdict() || Engine.seasonDiscipline();   // wyrok w sprawie sprzedanych meczów albo kara za serię afer – zanim policzymy tabelę
    if (gameState.screen === 'gameover') return;
    const pos = Selectors.standings().findIndex((row) => row.team === US) + 1;
    const r = gameState.record;
    const level = gameState.club.leagueLevel;
    const maxLevel = DATA.leagueLevels.length - 1;
    const leagueName = Selectors.leagueName();
    const club = Selectors.clubDisplayName();
    gameState.stats.seasons++;
    // Podsumowanie roczne (ekran na cały ekran): zbieramy dane, zanim sezon się wyzeruje
    const topScorer = gameState.squad.slice().sort((a, b) => b.seasonGoals - a.seasonGoals)[0];
    const summary = {
      season: gameState.calendar.season, league: leagueName, pos, w: r.wins, d: r.draws, l: r.losses, gf: r.goalsFor, ga: r.goalsAgainst,
      scorer: topScorer && topScorer.seasonGoals > 0 ? { name: Selectors.playerName(topScorer), goals: topScorer.seasonGoals } : null,
      assister: (() => { const a = gameState.squad.slice().sort((x, y) => (y.seasonAssists || 0) - (x.seasonAssists || 0))[0]; return a && a.seasonAssists ? { name: Selectors.shortName(a), n: a.seasonAssists } : null; })(),
      seasonMvp: (() => { const minApps = Math.max(3, Math.round((gameState.season.rounds.length || 18) * 0.4)); const m = gameState.squad.filter((x) => (x.seasonRatingCount || 0) >= minApps).sort((x, y) => Selectors.avgRating(y) - Selectors.avgRating(x))[0]; return m ? { name: Selectors.shortName(m), avg: Math.round(Selectors.avgRating(m) * 100) / 100 } : null; })(),
      retired: [], toStaff: [], newcomers: [], left: [], loanBack: [], loanEnd: [], growth: [], seen: false,
      predicted: gameState.season.preview ? gameState.season.preview.pos : null,
      verdict,
    };
    const n = Selectors.leagueSize();
    const zone = Selectors.zoneOf(pos, n);
    Engine.addLog('🏁 KONIEC SEZONU ' + gameState.calendar.season + ' (' + leagueName + ')! Miejsce w tabeli: ' + pos + '/' + n + '. Bilans: ' + r.wins + 'W ' + r.draws + 'R ' + r.losses + 'P, bramki ' + r.goalsFor + ':' + r.goalsAgainst + '.', 'system');

    // --- Awans, spadek, tytuł ---
    let newLevel = level;
    let outcome = pos <= 3 ? 'podium' : 'mid';
    // Baraże: o awans (z drużyną z ligi wyżej albo play-off miejsc 3–6) i o utrzymanie (z wiceliderem ligi niżej)
    let promoted = zone === 'up';
    if (!gameState.season.forcedRelegation && (zone === 'upPO' || zone === 'downPO')) {
      summary.playoff = Engine.playPlayoff(zone === 'upPO' ? 'up' : 'down', pos);
      if (zone === 'upPO') {
        promoted = summary.playoff.won;
        if (!promoted) outcome = 'poLost';
      } else if (summary.playoff.won) outcome = 'poSafe';
    }
    if (gameState.season.forcedRelegation && level > 1) {
      newLevel = Selectors.prevLevel(level); outcome = 'forced';
      Engine.addLog('⚖️ PRZYMUSOWA DEGRADACJA! Wydział Dyscypliny za aferę korupcyjną zsyła klub do ligi niżej: ' + DATA.leagueLevels[newLevel].name + '.', 'system');
      Engine.xPost('portal', club + ' zdegradowany za korupcję! Czarny Passat odjechał, a klub razem z nim – ligę niżej. 🚗💨');
    } else if (promoted && level < maxLevel) {
      if (newLevel === level && Selectors.nextLevel(level) >= DATA.upgrades.var.licenseLevel && !gameState.stadium.upgrades.var && !gameState.season.promotionBan) {
        outcome = 'licBlock';   // brak VAR – licencja na I ligę i wyżej nie zostanie przyznana
        Engine.addLog('🚫 Awans wywalczony na boisku, ale bez systemu VAR Związek odmawia licencji na ' + DATA.leagueLevels[Selectors.nextLevel(level)].name + '. Zostajemy w lidze: ' + leagueName + '.', 'system');
        Engine.xPost('portal', 'Awans bez VAR-u? Nie w tym kraju. ' + club + ' zostaje w ' + leagueName + ' przez brak wozu z powtórkami. 📺🚫');
      } else if (gameState.season.promotionBan) {
        outcome = 'banned';
        Engine.addLog('🚫 Awans wywalczony na boisku, ale Wydział Dyscypliny trzyma zakaz awansu po aferze. Zostajemy w lidze: ' + leagueName + '.', 'system');
        Engine.xPost('sukces', 'Awans? Hahaha. Nie z tymi reklamówkami. 🤡🚫');
      } else {
        newLevel = Selectors.nextLevel(level); outcome = 'promo';
        Engine.addLog('🎉 AWANS!!! ' + club + ' zagra w następnym sezonie w lidze: ' + DATA.leagueLevels[newLevel].name + '! Pan Heniek płacze ze szczęścia do kosiarki.', 'system');
        Engine.xPost('portal', 'AWANS! ' + club + ' w lidze ' + DATA.leagueLevels[newLevel].name + '! Cała gmina świętuje, sołtys ogłosił dzień wolny od koszenia. 🎉');
        Engine.xPost('ultras', 'AWANS AWANS AWANS!!! ' + DATA.leagueLevels[newLevel].name + ' NASZA! Tego nie da się opisać 🔥🔥🔥');
      }
    } else if (pos === 1 && level === maxLevel) {
      outcome = 'title';
      gameState.stats.titles++;
      Engine.addLog('🏆 MISTRZ POLSKI!!! ' + club + ' – klub spod remizy na szczycie Ekstraklasy! Krowy pana Zdzicha dostają dzień wolny.', 'system');
      Engine.xPost('portal', 'SENSACJA STULECIA: ' + club + ' MISTRZEM POLSKI! Od B-klasy do tytułu. Pan Zenek: „To wszystko dzięki gięte z cebulką”. 🏆');
    } else if (zone === 'euro') {
      outcome = 'euro';
      const bonus = Math.round(1200 * Selectors.econ());
      Engine.applyEffects({ budget: bonus, fans: +8 }, 'Premia UEFA za miejsce pucharowe');
      Engine.addLog('🇪🇺 ' + pos + '. MIEJSCE – EUROPEJSKIE PUCHARY! ' + club + ' zagra w: ' + Selectors.euroQualLabel(Selectors.euroQualFor(pos)) + '. Premia ' + Utils.formatMoney(bonus) + '. [kibice +8%]', 'system');
      Engine.xPost('portal', club + ' w europejskich pucharach! Od remizy do Europy. Pan Zenek już szuka paszportu. 🇪🇺⚽');
    } else if (zone === 'down' || (zone === 'downPO' && !summary.playoff.won) || zone === 'last') {
      if (level > 1) {
        newLevel = Selectors.prevLevel(level); outcome = 'releg';
        Engine.addLog('📉 SPADEK' + (zone === 'downPO' ? ' PO BARAŻACH' : '') + '. ' + club + ' wraca do ligi: ' + DATA.leagueLevels[newLevel].name + '. Na trybunach cisza, tylko pies szczeka.', 'system');
        Engine.xPost('sukces', 'SPADEK. Wiedziałem od początku. ' + Selectors.presName() + ' do dymisji (piszę to od 3 sezonów). 📉🤡');
      } else {
        outcome = 'shame';
        Engine.applyEffects({ fans: -10 });
        Engine.addLog('🙈 Ostatnie miejsce w B-klasie. Niżej się nie da, ale wstyd na cały powiat. [kibice -10%]', 'system');
        Engine.xPost('ultras', 'Ostatnie miejsce… Chłopaki, my i tak zostajemy. Ale kto wyłączy światło w blaszaku, jak wszyscy odejdą? 💔');
        Engine.xPostRaw('😤', '@Fanatycy' + Selectors.handleFrom(gameState.league.rivals[0].name), 'Czerwona latarnia B-klasy 🏮😂 Nawet krowy pana Zdzicha grają lepiej.');
        Engine.pushDecision('lastPlaceShame');
      }
    }
    gameState.lastSeason = { pos, outcome, league: leagueName };
    if (pos === 1) Engine.addTrophy(level === maxLevel ? '🏆' : '🥇', level === maxLevel ? 'Mistrzostwo Polski' : 'Mistrzostwo: ' + leagueName, 'title', level);
    if (outcome === 'promo') Engine.addTrophy('🏅', 'Awans do: ' + DATA.leagueLevels[newLevel].name, 'medal', newLevel);
    if (Selectors.euroThisSeason() && gameState.euro.result && gameState.euro.result.startsWith('🏆')) Engine.addTrophy('🌟', 'Puchar ' + DATA.euro.comps[gameState.euro.comp].name);
    if (outcome === 'promo') {
      gameState.stats.promotions++;
      gameState.stats.topLevel = Math.max(gameState.stats.topLevel, newLevel);
      const outdated = Object.keys(DATA.staffSlots).filter((k) => { const r = Selectors.staffRawLevel(k); return r > 0 && r < Selectors.staffStandard(newLevel); });
      if (outdated.length) Engine.addLog('🔻 Sztab odstaje od nowej ligi: ' + outdated.map((k) => DATA.staffSlots[k].label + ' (' + gameState.staff[k].name + ')').join(', ') + '. Ich efekt spada o połowę – czas na lepszych fachowców (Sztab → Sztab).', 'system');
      Engine.checkLicense(newLevel);
      if (!Selectors.coachLicenseOk(newLevel)) { gameState.coach.licenseFor = newLevel; Engine.pushDecision('coachLicense'); }
    } else if (outcome === 'releg' || outcome === 'forced') {
      gameState.stats.relegations++;
    } else if (level >= 2 && Selectors.licenseMissing(level).length) {
      const fine = Math.round(500 * Selectors.econ());
      Engine.money('Kara: niewykonany nakaz budowy', -fine);
      Engine.addLog('📋 Nakaz budowy niewykonany (' + Selectors.licenseMissing(level).join(', ') + '). Związek nakłada kolejną karę: ' + Utils.formatMoney(fine) + '.', 'system');
    }
    if (outcome === 'poLost') Engine.addLog('💔 Baraż przegrany. Awans był o krok – zostajemy w lidze: ' + leagueName + '.', 'system');
    if (outcome === 'poSafe') Engine.addLog('😮‍💨 Utrzymanie wywalczone w barażach! ' + club + ' zostaje w lidze: ' + leagueName + '.', 'system');
    if (outcome === 'promo' || outcome === 'title' || outcome === 'podium' || outcome === 'euro') Engine.pushDecision('feta');
    // Zarząd i sponsor rozliczają sezon z prognozą przedsezonową
    if (summary.predicted && !['promo', 'title', 'euro'].includes(outcome)) {
      if (pos > summary.predicted + 2) {
        Engine.applyEffects({ fans: -5, lockerRoom: -3 });
        if (Selectors.hasRealSponsor()) gameState.sponsor.strikes = (gameState.sponsor.strikes || 0) + 1;
        summary.board = '📉 Zarząd i sponsor niezadowoleni: ' + pos + '. miejsce przy prognozie ' + summary.predicted + '. (kibice -5%, szatnia -3%)';
        Engine.addLog(summary.board, 'system');
      } else if (pos < summary.predicted - 1) {
        Engine.applyEffects({ fans: +3 });
        summary.board = '📈 Zarząd zachwycony: ' + pos + '. miejsce przy prognozie ' + summary.predicted + '. (kibice +3%)';
      }
    }

    // Starzenie, staż, legendy, emerytury
    const retiring = [];
    gameState.squad.forEach((p) => {
      p.prevSeason = { apps: p.seasonApps, goals: p.seasonGoals, assists: p.seasonAssists || 0, avg: Selectors.avgRating(p) };   // do okna transferowego
      p.age++; p.seasons++; p.seasonApps = 0; p.seasonGoals = 0; p.seasonAssists = 0; p.seasonRatingSum = 0; p.seasonRatingCount = 0;
      p.yellows = 0; p.seasonYellows = 0; p.seasonReds = 0; p.suspended = 0;   // kartki zerują się z nowym sezonem
      // młodzi rosną do swojego potencjału – tym szybciej, im więcej grali (Perełki i dobry asystent pomagają)
      const gain = p.loan ? 0 : Engine.develop(p, p.prevSeason.apps, false);
      if (gain) summary.growth.push(Selectors.playerName(p) + ' +' + gain + (p.prevSeason.apps >= 12 ? ' (regularna gra)' : p.prevSeason.apps >= 5 ? ' (rezerwowy)' : ' (ławka)'));
      if (p.age >= 33 && Math.random() < 0.4) p.skill = Math.max(1, p.skill - 1);   // starzy słabną
      if (p.favorite && !p.legend && p.seasons >= 5) {
        p.legend = true;
        Engine.addLog('🏆 ' + Selectors.playerName(p) + ' zostaje LEGENDĄ KLUBU! Jego zdjęcie wisi w blaszaku obok kalendarza z traktorami.', 'event');
      }
      if (p.age >= 35 && (p.age >= 39 || Math.random() < 0.45)) retiring.push(p);
    });
    retiring.forEach((p) => {
      gameState.squad = gameState.squad.filter((x) => x.id !== p.id);
      if (p.legend || p.favorite) {   // legendy żegnane z honorami – sztab to wyłącznie fachowcy z rynku
        summary.retired.push(Selectors.playerName(p) + ' (' + p.age + ' l.)' + (p.legend ? ' 🏆' : ' ⭐'));
        Engine.addLog('🎖️ ' + Selectors.playerName(p) + ' kończy karierę po ' + p.apps + ' meczach. Owacja na stojąco, szalik w gablocie.', 'event');
      } else {
        summary.retired.push(Selectors.playerName(p) + ' (' + p.age + ' l.)');
        Engine.addLog('👋 ' + Selectors.playerName(p) + ' (' + p.age + ' l.) kończy karierę. „Kolana mówią dość, żona mówi dość, ja mówię dość.”', 'event');
      }
    });
    Engine.settleLoans(summary);
    Engine.endExiles(summary);
    // Zapowiedziane w sezonie odejścia (odmowa podwyżki) – dopiero teraz, między sezonami
    gameState.squad.filter((p) => p.wantsOut).forEach((p) => {
      gameState.squad = gameState.squad.filter((x) => x.id !== p.id);
      summary.left.push(Selectors.playerName(p) + ' → ' + p.wantsOut);
      if (p.favorite) Engine.applyEffects({ fans: -8 });
      Engine.addLog('🚪 ' + Selectors.playerName(p) + ' odchodzi do ' + p.wantsOut + ', jak zapowiadał.' + (p.favorite ? ' Kibice wściekli – odszedł Ulubieniec Trybun! [kibice -8%]' : ''), 'event');
    });
    // Bolesny spadek: kluczowi zawodnicy nie chcą grać niżej – odchodzą albo żądają transferu
    if (outcome === 'releg' || outcome === 'forced') Engine.relegationRevolt(summary, DATA.leagueLevels[newLevel].name);
    Engine.queueRetirementDecision();

    // Szkółka: 2 juniorów; Były Ligowiec ściąga kogoś lepszego
    const idsBefore = gameState.squad.map((p) => p.id);
    Engine.u19SeasonEnd(summary);   // akademia: rozwój, 19-latkowie do decyzji, nabór
    if (Selectors.coach().attracts) Engine.coachBringsPlayer();
    summary.newcomers = gameState.squad.filter((p) => !idsBefore.includes(p.id)).map((p) => Selectors.playerName(p) + ' (' + p.age + ' l.)' + (p.talent ? ' 💎' : ''));

    // Puchary: wynik tegorocznej kampanii, ogranie w Europie, kwalifikacja na następny sezon
    if (Selectors.euroThisSeason()) {
      const eu = gameState.euro;
      if (!eu.done) Engine.euroOut('Koniec sezonu: ' + DATA.euro.comps[eu.comp].name + ', ' + DATA.euro.stages[eu.stage].label + '.');
      summary.euro = DATA.euro.comps[eu.comp].icon + ' ' + eu.result + ' · zarobione ' + Utils.formatMoney(eu.earned);
      gameState.squad.forEach((p) => {
        if ((p.euroSeasonApps || 0) >= 4 && p.age <= 30 && p.skill < 18 && Math.random() < 0.5) {
          p.skill++; p.potential = Math.max(p.potential || 0, p.skill);
          summary.growth.push(Selectors.playerName(p) + ' +1 (ogranie w Europie)');
        }
      });
    }
    gameState.squad.forEach((p) => { p.euroSeasonApps = 0; });
    let euroNext = level === maxLevel && newLevel === maxLevel && outcome !== 'forced' ? Selectors.euroQualFor(pos) : null;
    if (!euroNext && level === maxLevel && newLevel === maxLevel && gameState.cup && gameState.cup.won && gameState.cup.season === gameState.calendar.season) euroNext = { comp: 'UEL', path: 'cup' };   // zdobywca Pucharu Polski
    if (gameState.cup && gameState.cup.season === gameState.calendar.season) summary.cup = gameState.cup.won ? '🏆 Zdobywca Pucharu Polski!' : gameState.cup.wonRegional ? '🏆 ' + Selectors.cupName() + ' – za rok szczebel centralny!' : Selectors.cupName() + ': ' + (gameState.cup.history[0] || 'bez meczów').replace(/ ❌$/, '');
    if (euroNext) summary.euroQual = Selectors.euroQualLabel(euroNext);

    summary.debtNews = (gameState.debtNews || []).filter((d) => ['paidUs', 'stiffedUs', 'recovered', 'ourPaid'].includes(d.kind)).map((d) => d.text).slice(-5);
    gameState.calendar.season++;
    gameState.calendar.round = 0;
    gameState.dark.offersThisSeason = 0;
    Object.assign(gameState.record, { played: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 });
    if (newLevel !== level) {
      // Pensje idą za ligą: po awansie zawodnicy oczekują więcej, po spadku klub tnie kontrakty
      const ratio = DATA.leagueLevels[newLevel].econ / DATA.leagueLevels[level].econ;
      const factor = newLevel > level ? Math.pow(ratio, 0.7) : Math.pow(ratio, 0.8);
      const before = Selectors.squadWages();
      gameState.squad.forEach((p) => { if (!p.loan) p.wage = Math.max(5, Math.round(p.wage * factor / 5) * 5); });
      const after = Selectors.squadWages();
      summary.wages = (newLevel > level ? '📈 Nowe kontrakty po awansie: ' : '📉 Redukcja pensji po spadku: ') + Utils.formatMoney(before) + ' → ' + Utils.formatMoney(after) + ' tygodniowo';
      Engine.addLog(summary.wages + '.', 'finance');
      gameState.club.leagueLevel = newLevel;
      gameState.club.levelSince = gameState.calendar.season + 1;   // marka w nowej lidze buduje się od zera
      Engine.buildLeague(newLevel);
    }
    Engine.newSeason();
    if (euroNext) Engine.euroSetup(euroNext);
    Engine.openTransferWindow();
    Engine.refreshSponsors(true);
    summary.outcome = outcome;
    summary.newLeague = DATA.leagueLevels[newLevel].name;
