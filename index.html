/* ---------------------------------------------------------------------
   3. SILNIK / LOGIKA GRY
   --------------------------------------------------------------------- */
const Utils = {
  rand: (arr) => arr[Math.floor(Math.random() * arr.length)],
  randInt: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  randRange: (a, b) => a + Math.random() * (b - a),
  clamp: (v, min, max) => Math.max(min, Math.min(max, v)),
  shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  poisson: (lambda) => { const L = Math.exp(-lambda); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; },
  weightedPick: (items, weightFn) => {
    const total = items.reduce((s, x) => s + weightFn(x), 0);
    let r = Math.random() * total;
    for (const x of items) { r -= weightFn(x); if (r <= 0) return x; }
    return items[items.length - 1];
  },
  val: (x) => (typeof x === 'function' ? x() : x),
  formatMoney: (n) => Math.round(n).toLocaleString('pl-PL').replace(/,/g, ' ') + ' zł',
  signedMoney: (n) => (n > 0 ? '+' : '') + Utils.formatMoney(n),
  escape: (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
};

const Engine = {
  // Przyjmuje dane z Karty Rejestracyjnej albo samą nazwę (testy, stare wywołania).
  startGame(card) {
    if (typeof card === 'string') {
      const words = card.trim().split(/\s+/);
      card = { name: card, town: words.length > 1 ? words.slice(1).join(' ') : card, character: null, colors: null, stadium: '', president: '' };
    }
    const fresh = createInitialState();
    fresh.screen = 'game';
    Object.assign(fresh.club, { name: card.name, town: card.town, character: card.character, colors: card.colors, president: (card.president || '').trim() });
    fresh.stadium.baseName = (card.stadium || '').trim() || Selectors.defaultStadium(card.town);
    gameState = fresh;
    if (card.character === 'suburban') gameState.finance.budget += 500;
    if (card.character === 'rural') gameState.morale.lockerRoom += 5;

    Engine.newSeason();
    gameState.weather = Utils.rand(DATA.weather);
    const t = Selectors.townType();
    Engine.addLog(Selectors.presName() + ' obejmuje funkcję prezesa klubu ' + card.name + ' (' + card.town + (t ? ', ' + t.label.toLowerCase() : '') + '). W kasie ' + Utils.formatMoney(gameState.finance.budget) + ' i karton po bananach z dokumentami.', 'system');
    Engine.addLog('Karta rejestracyjna przyjęta przez OZPN. Obiekt: ' + gameState.stadium.baseName + '.' + (Selectors.colorsNick() ? ' Barwy: ' + DATA.clubColors[card.colors].label.toLowerCase() + '.' : ''), 'system');
    Engine.addLog('Poprzedni prezes zostawił na biurku klucze (nie wiadomo do czego) i niedopitą kawę z 2019. Drużynę tymczasowo prowadzi Pan Mirek, konserwator.', 'flavor');
    Engine.addLog('Liga (10 drużyn, 18 kolejek) rusza w Tygodniu ' + (CONFIG.preseasonWeeks + 1) + '. Pierwszy rywal: ' + Selectors.currentFixture().rival + '.', 'system');
    Engine.pushDecision('welcomeWojt');
    Engine.offerSeasonTickets();
  },

  addLog(text, type = 'flavor') {
    gameState.ui.lastLogId += 1;
    gameState.log.unshift({ id: gameState.ui.lastLogId, week: gameState.calendar.week, text, type });
    if (gameState.log.length > CONFIG.maxLogEntries) gameState.log.length = CONFIG.maxLogEntries;
  },

  // Każdy ruch pieniędzy przechodzi tędy – trafia do bilansu tygodnia, jeśli jest liczony.
  money(label, amount) {
    if (!amount) return;
    gameState.finance.budget += amount;
    if (gameState.report) gameState.report.lines.push({ label, amount });
  },

  // Jedyne miejsce, gdzie modyfikujemy statystyki – łatwo rozszerzyć o nowe.
  applyEffects(effects = {}, label = 'Inne') {
    if (effects.budget)     Engine.money(label, effects.budget);
    if (effects.lockerRoom) gameState.morale.lockerRoom = Utils.clamp(gameState.morale.lockerRoom + effects.lockerRoom, 0, 100);
    if (effects.fans)       gameState.morale.fans = Utils.clamp(gameState.morale.fans + effects.fans, 0, 100);
  },

  describeEffects(effects = {}) {
    const parts = [];
    if (effects.budget)     parts.push(Utils.signedMoney(effects.budget));
    if (effects.lockerRoom) parts.push('szatnia ' + (effects.lockerRoom > 0 ? '+' : '') + effects.lockerRoom + '%');
    if (effects.fans)       parts.push('kibice ' + (effects.fans > 0 ? '+' : '') + effects.fans + '%');
    return parts.length ? ' [' + parts.join(', ') + ']' : '';
  },

  addScandal(reason) {
    gameState.club.scandals += 1;
    Engine.addLog('📰 Skandal w kartotece klubu: ' + reason + ' (łącznie: ' + gameState.club.scandals + ').', 'event');
  },

  /* ----- Decyzje ----- */
  pushDecision(decisionId) {
    if (DATA.decisions[decisionId] && !gameState.pendingDecisions.includes(decisionId)) {
      gameState.pendingDecisions.push(decisionId);
    }
  },

  resolveDecision(decisionId, optionIndex) {
    const decision = DATA.decisions[decisionId];
    const option = decision && decision.options[optionIndex];
    if (!option || !gameState.pendingDecisions.includes(decisionId)) return;
    // Wszystko liczymy PRZED onChoose (onChoose może zmienić stan, z którego biorą się teksty).
    const effects = Utils.val(option.effects) || {};
    const log = Utils.val(option.log);
    const title = Utils.val(decision.title);
    gameState.pendingDecisions = gameState.pendingDecisions.filter((id) => id !== decisionId);
    Engine.applyEffects(effects, 'Decyzja: ' + title);
    Engine.addLog(log + Engine.describeEffects(effects), 'decision');
    if (option.onChoose) option.onChoose();   // może dodać kolejną decyzję (np. następny emeryt)
  },

  canAdvanceWeek() {
    return gameState.pendingDecisions.length === 0;
  },

  /* ----- Sezon, terminarz, tabela ----- */
  newSeason() {
    const s = gameState.season;
    const teams = Utils.shuffle([US].concat(gameState.league.rivals.map((r) => r.name)));
    // Metoda „kołowa”: każdy z każdym, 9 kolejek po 5 meczów; rewanże z zamienionym gospodarzem.
    const n = teams.length;
    const firstHalf = [];
    let rot = teams.slice(1);
    for (let r = 0; r < n - 1; r++) {
      const order = [teams[0]].concat(rot);
      const round = [];
      for (let i = 0; i < n / 2; i++) {
        const a = order[i], b = order[n - 1 - i];
        // Tablice Bergera: drużyna stała zmienia gospodarza co kolejkę, reszta wg parzystości pary
        // (najwyżej 3 mecze z rzędu u siebie / na wyjeździe zamiast całej rundy)
        const aHome = i === 0 ? r % 2 === 0 : i % 2 === 1;
        round.push(aHome ? { home: a, away: b } : { home: b, away: a });
      }
      firstHalf.push(round);
      rot = [rot[rot.length - 1]].concat(rot.slice(0, -1));
    }
    const secondHalf = firstHalf.map((round) => round.map((f) => ({ home: f.away, away: f.home })));
    s.rounds = firstHalf.concat(secondHalf);

    s.table = {};
    [US].concat(gameState.league.rivals.map((r) => r.name)).forEach((t) => { s.table[t] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
    s.lastResults = [];
    s.promotionBan = false;
    s.forcedRelegation = false;
    gameState.league.rivals.forEach((r) => {
      const prev = s.strength[r.name] || r.strength;
      // lekki dryf siły między sezonami, ale z powrotem w stronę „charakteru” klubu
      s.strength[r.name] = Utils.clamp(prev * 0.5 + r.strength * 0.5 + Utils.randRange(-0.1, 0.1), 0.8, 3);
    });
  },

  recordResult(home, away, hg, ag) {
    const t = gameState.season.table;
    const H = t[home], A = t[away];
    H.p++; A.p++; H.gf += hg; H.ga += ag; A.gf += ag; A.ga += hg;
    if (hg > ag) { H.w++; A.l++; H.pts += 3; }
    else if (hg < ag) { A.w++; H.l++; A.pts += 3; }
    else { H.d++; A.d++; H.pts++; A.pts++; }
  },

  simulateOtherMatches() {
    const round = gameState.season.rounds[gameState.calendar.round];
    const results = [];
    round.forEach((f) => {
      if (f.home === US || f.away === US) return;
      const hs = gameState.season.strength[f.home], as = gameState.season.strength[f.away];
      const hg = Utils.poisson(1.25 * Math.pow(hs / as, 1.3) * 1.1);
      const ag = Utils.poisson(1.25 * Math.pow(as / hs, 1.3) / 1.05);
      Engine.recordResult(f.home, f.away, hg, ag);
      results.push({ home: f.home, away: f.away, hg, ag });
    });
    return results;
  },

  /* ----- Karnety ----- */
  seasonTicketDemand(kind) {
    const fans = gameState.morale.fans;
    const mult = Selectors.econ() * gameState.bonuses.seasonTicketBoost;   // wyższa liga = więcej chętnych; feta = +10%
    return kind === 'vip' ? Math.round((4 + fans * 0.15) * mult) : Math.round((8 + fans * 0.3) * mult);
  },

  setSeasonTickets(holders) {
    gameState.bonuses.seasonTicketBoost = 1;
    gameState.seasonTickets.holders = holders;
    gameState.seasonTickets.roundsLeft = holders > 0 ? CONFIG.roundsPerRunda : 0;
  },

  offerSeasonTickets() {
    const key = 's' + gameState.calendar.season + 'r' + gameState.calendar.round;
    if (gameState.seasonTickets.lastOfferKey === key) return;
    gameState.seasonTickets.lastOfferKey = key;
    Engine.pushDecision('seasonTickets');
  },

  /* ----- Kadra: skład, chemia, siła ----- */
  // Jak bardzo profil zawodnika pasuje do stylu trenera (0..1)
  profileFit(player, style) {
    if (style === 'bal') return player.profile === 'uni' ? 1 : 0.6;
    if (player.profile === style) return 1;
    return player.profile === 'uni' ? 0.5 : 0;
  },

  // Trener NPC wybiera skład. Prezes nie ma tu nic do gadania.
  pickLineup(absentIds = []) {
    const coach = Selectors.coach();
    const style = DATA.styles[coach.style];
    const avail = gameState.squad.filter((p) => !absentIds.includes(p.id));
    // Obietnica dla „Naszych w Bawarii”: najmłodszy zawodnik musi grać
    const youngest = gameState.dda.youthPromise > 0 ? avail.slice().sort((a, b) => a.age - b.age)[0] : null;
    const score = (p) => {
      if (youngest && p.id === youngest.id) return 99;
      let s = p.skill + Engine.profileFit(p, coach.style) * 1.2;
      if (coach.prefers === 'veterans' && p.age >= 30) s += 1.5;
      if (coach.prefers === 'youth' && p.age <= 24) s += 1;
      return s;
    };
    const chosen = [];
    ['GK', 'DEF', 'MID', 'FWD'].forEach((pos, i) => {
      avail.filter((p) => p.pos === pos).sort((a, b) => score(b) - score(a)).slice(0, style.formation[i]).forEach((p) => chosen.push(p));
    });
    // Braki na pozycjach uzupełnia ktokolwiek (bramkarza też – ktoś musi stanąć).
    const rest = avail.filter((p) => !chosen.includes(p)).sort((a, b) => score(b) - score(a));
    while (chosen.length < 11 && rest.length) chosen.push(rest.shift());
    return chosen;
  },

  chemistry(lineup) {
    const coach = Selectors.coach();
    if (!lineup.length) return 0;
    const fit = lineup.reduce((s, p) => s + Engine.profileFit(p, coach.style), 0) / lineup.length;
    const staffChem = Object.values(gameState.staff).reduce((s, m) => s + (m ? m.chem : 0), 0);
    return Math.round(Utils.clamp(25 + fit * 70 + staffChem, 0, 100));
  },

  teamStrength(lineup, chem) {
    const avgSkill = lineup.reduce((s, p) => s + p.skill, 0) / Math.max(1, lineup.length);
    const missing = 11 - lineup.length;
    let s = 0.45 + avgSkill * 0.13;
    s *= 0.88 + chem * 0.0025;
    s *= 0.94 + gameState.morale.lockerRoom * 0.0012;
    s *= 1 + Selectors.coach().quality;
    s *= 1 - missing * 0.06;
    if (gameState.debt.strike) s *= 0.9;           // strajk: nie ma na paliwo, nie ma gry
    return s;
  },

  /* ----- Dzień meczowy ----- */
  // Szacunek bez losowości – używany też w UI do podglądu.
  estimateAttendance(fixture, weather = gameState.weather) {
    const rival = Selectors.rival(fixture.rival);
    const ticket = DATA.tickets[gameState.matchday.ticket];
    let base = (25 + gameState.morale.fans * 1.1) * Selectors.econ();
    Object.keys(DATA.upgrades).forEach((id) => { if (gameState.stadium.upgrades[id] && DATA.upgrades[id].attendance) base *= DATA.upgrades[id].attendance; });
    if (rival.derby) base *= 2;
    if (Selectors.coach().style === 'off') base *= 1.1;   // na widowisko przychodzi więcej ludzi
    if (Selectors.coach().style === 'def') base *= 0.9;   // na mur przychodzą tylko krzyżówkowicze
    if (gameState.x.hype) base *= 1.15;                   // pompka na Wirtualnym X
    // Letnicy z miasta nie liczą każdej złotówki na bilecie
    base *= gameState.club.character === 'suburban' && ticket.attendance < 1 ? 1 - (1 - ticket.attendance) / 2 : ticket.attendance;
    if (gameState.club.character === 'industrial') base *= 1.15;   // osada przemysłowa: ludzie i tak nie mają co robić w sobotę
    if (gameState.stadium.pitch < 25) base *= 0.85;
    let att = base * weather.attendance;
    if (weather.rain && gameState.stadium.upgrades.roof) att += Math.min(30, base - att);
    return Math.max(0, Math.round(att));
  },

  playMatchday() {
    const fixture = Selectors.currentFixture();
    const rival = Selectors.rival(fixture.rival);
    const weather = gameState.weather;
    const kolejka = gameState.calendar.round + 1;
    const report = gameState.report;
    const coachState = gameState.coach;
    const coach = Selectors.coach();
    report.homeMatch = fixture.home;

    // --- Kto nie dojechał ---
    const absent = gameState.squad.filter((p) =>
      (p.tag === 'worker' && Math.random() < 0.25) || (p.tag === 'party' && Math.random() < 0.15));
    absent.forEach((p) => Engine.addLog('🚧 ' + Selectors.playerName(p) + ' nie dojechał na mecz (' + (p.tag === 'worker' ? 'budowa się przeciągnęła' : 'wesele do 6 rano') + ').', 'event'));

    // --- Skład i chemia (wybiera trener) ---
    const lineup = Engine.pickLineup(absent.map((p) => p.id));
    if (gameState.dda.youthPromise > 0) {
      gameState.dda.youthPromise--;
      const kid = lineup.slice().sort((a, b) => a.age - b.age)[0];
      if (kid) Engine.addLog('🇩🇪 Zgodnie z obietnicą dla „Naszych w Bawarii” gra ' + Selectors.playerName(kid) + ' (' + kid.age + ' l.). Zostało meczów: ' + gameState.dda.youthPromise + '.', 'event');
    }
    let chem = Engine.chemistry(lineup);
    if (coach.disappears && Math.random() < coach.disappears) {
      chem = Math.max(0, chem - 25);
      Engine.addLog('🍺 Trener ' + coach.name + ' zniknął w piątek „w sprawach rodzinnych”. Skład w sobotę ustalał pan Rysiek z kartki.', 'event');
    }

    // --- Siła i oczekiwane gole ---
    const ourS = Engine.teamStrength(lineup, chem) * (1 + coachState.carpetBoost);
    coachState.carpetBoost = 0;
    const oppS = gameState.season.strength[rival.name];
    const style = DATA.styles[coach.style];
    const ratio = ourS / oppS;
    const homeAdv = fixture.home ? 1.12 : 1 / 1.08;
    let ourL = 1.25 * Math.pow(ratio, 1.3) * style.tempo * homeAdv;
    let oppL = 1.25 * Math.pow(1 / ratio, 1.3) * style.tempo / homeAdv;
    if (chem < 50) oppL *= 1 + (50 - chem) / 120;                   // głupie straty przy złym zgraniu
    if (coach.mudWeakness && weather.rain) oppL *= 1.35;            // tiki-taka w kałużach
    if (coach.mudWeakness && lineup.reduce((s, p) => s + p.skill, 0) / lineup.length < 5) oppL *= 1.2;
    const pitchChaos = fixture.home ? (100 - gameState.stadium.pitch) / 300 : 0.1;
    const chaos = Utils.clamp(weather.chaos + pitchChaos, 0, 0.9);
    const avg = (ourL + oppL) / 2;
    ourL = ourL * (1 - chaos) + avg * chaos;
    oppL = oppL * (1 - chaos) + avg * chaos;
    const fixedMatch = gameState.dark.fixed;
    if (fixedMatch === 'buy') { ourL *= 1.6; oppL *= 0.5; }        // „zmotywowany” sędzia i rywal
    let gf = Utils.poisson(Math.max(0.15, ourL));
    let ga = Utils.poisson(Math.max(0.15, oppL));
    if (fixedMatch === 'sell' && gf >= ga) ga = gf + 1;               // odpuszczony mecz
    const result = gf > ga ? 'W' : gf === ga ? 'D' : 'L';

    // --- Tabela: nasz mecz + reszta kolejki ---
    if (fixture.home) Engine.recordResult(US, rival.name, gf, ga);
    else Engine.recordResult(rival.name, US, ga, gf);
    const others = Engine.simulateOtherMatches();
    gameState.season.lastResults = [fixture.home ? { home: US, away: rival.name, hg: gf, ag: ga } : { home: rival.name, away: US, hg: ga, ag: gf }].concat(others);

    // --- Strzelcy i doświadczenie ---
    lineup.forEach((p) => { p.apps++; p.seasonApps++; });
    const scorerCount = {};
    for (let i = 0; i < gf; i++) {
      const w = (p) => ({ GK: 0.05, DEF: 0.7, MID: 2.5, FWD: 5 }[p.pos]) * p.skill * (p.tag === 'freekick' ? 1.5 : 1);
      const scorer = Utils.weightedPick(lineup, w);
      scorer.goals++; scorer.seasonGoals++;
      scorerCount[scorer.id] = (scorerCount[scorer.id] || 0) + 1;
    }
    const scorers = Object.entries(scorerCount).map(([id, n]) => {
      const p = gameState.squad.find((x) => x.id === id);
      return '„' + p.nick + '” ' + p.last + (n > 1 ? ' ×' + n : '');
    });

    const clubName = Selectors.clubDisplayName();
    const scoreLine = fixture.home
      ? clubName + ' ' + gf + ':' + ga + ' ' + rival.name
      : rival.name + ' ' + ga + ':' + gf + ' ' + clubName;
    const derbyTag = rival.derby ? ' (🔥 KOSA)' : '';
    let extra = '';
    if (result === 'W' && oppS > ourS && chaos >= 0.5) extra = ' SENSACJA NA BŁOCIE! Faworyt utonął w kałużach.';
    Engine.addLog('⚽ Kolejka ' + kolejka + derbyTag + ': ' + scoreLine + ' (' + (fixture.home ? 'u siebie, ' + gameState.club.town : 'wyjazd') + ', ' + weather.icon + ' ' +
      weather.label.charAt(0).toLowerCase() + weather.label.slice(1) + ').' + extra + (scorers.length ? ' Gole: ' + scorers.join(', ') + '.' : ''), 'match');

    // --- Statystyki ---
    const r = gameState.record;
    r.played++; r.goalsFor += gf; r.goalsAgainst += ga;
    if (result === 'W') { r.wins++; r.lossStreak = 0; r.winStreak++; }
    if (result === 'D') { r.draws++; r.lossStreak = 0; r.winStreak = 0; }
    if (result === 'L') { r.losses++; r.lossStreak++; r.winStreak = 0; }
    r.form.push(result); if (r.form.length > 5) r.form.shift();
    const st = gameState.stats;
    st.matches++; st.goalsFor += gf; st.goalsAgainst += ga;
    st[{ W: 'wins', D: 'draws', L: 'losses' }[result]]++;
    report.result = result;
    // Kontekst meczu dla Wirtualnego X (uzupełniany niżej o zatrucia, zadymy itd.)
    report.matchCtx = {
      result, gf, ga, home: fixture.home, rival: rival.name, derby: rival.derby, weather: weather.id,
      style: coach.style, coachId: coachState.id, coachName: coach.name,
      favScorers: Object.keys(scorerCount).map((id) => gameState.squad.find((x) => x.id === id)).filter((p) => p && p.favorite).map((p) => p.nick),
      poisoned: false, riot: false, hype: gameState.x.hype, fixed: fixedMatch,
    };

    // --- Nastroje: kibice kochają gole, nienawidzą muru ---
    const mult = rival.derby ? 2 : 1;
    let fans = { W: 4, D: 0, L: -4 }[result] * mult;
    if (result === 'L' && gameState.club.character === 'industrial') fans -= 2;   // surowsi kibice z osady
    if (gf + ga >= 5) fans += 2;
    if (gf >= 3) fans += 1;
    if (gf + ga <= 1 && result !== 'W') fans -= coach.style === 'def' ? 4 : 2;
    fans += coach.fanMod;
    if (gameState.x.hype) {                       // pompka na X: wygrana smakuje lepiej, porażka boli podwójnie
      fans += result === 'L' ? -6 : result === 'W' ? 2 : 0;
      gameState.x.hype = false;
    }
    const locker = { W: 5, D: 1, L: -4 }[result];
    Engine.applyEffects({ fans, lockerRoom: locker });

    // Ulubieniec Trybun na ławce = kibice niezadowoleni
    gameState.squad.filter((p) => p.favorite && !lineup.includes(p) && !absent.includes(p)).forEach((p) => {
      Engine.applyEffects({ fans: -2 });
      Engine.addLog('📣 Kibice skandują „' + p.nick.toUpperCase() + '! ' + p.nick.toUpperCase() + '!”, a ' + Selectors.playerName(p) + ' grzeje ławę. [kibice -2%]', 'event');
    });

    // Mur bez wygranych → kibice chcą głowy trenera
    if (coach.style === 'def' && result !== 'W' && gf <= 1) coachState.boringStreak++;
    else coachState.boringStreak = 0;
    if (coachState.boringStreak >= 3 && coachState.id !== 'mirek') {
      coachState.boringStreak = 0;
      Engine.pushDecision('fansVsCoach');
    }

    // --- Raport trenera ---
    let coachReport = Utils.rand(coach.reports[result]);
    if (chem < 50) coachReport += ' ' + coach.complaint;
    coachState.lastReport = coachReport;
    Engine.addLog('🗣️ Trener ' + coach.name + ': „' + coachReport + '”', 'coach');

    Engine.updateBadges();

    // --- Pieniądze z dnia meczowego ---
    if (fixture.home) Engine.homeMatchdayIncome(fixture, rival, weather);
    else Engine.money('Paliwo do busa (wyjazd)', -Utils.randInt(50, 90));

    // --- Karnety i kalendarz ligi ---
    if (gameState.seasonTickets.roundsLeft > 0) {
      gameState.seasonTickets.roundsLeft--;
      if (gameState.seasonTickets.roundsLeft === 0) gameState.seasonTickets.holders = 0;
    }
    Engine.resolveDarkDeal();
    gameState.matchday.security = null;
    gameState.calendar.round++;
    if (gameState.calendar.round >= gameState.season.rounds.length) Engine.endSeason();
  },

  homeMatchdayIncome(fixture, rival, weather) {
    const md = gameState.matchday;
    const ticket = DATA.tickets[md.ticket];
    const sausage = DATA.sausages[md.sausage];

    const att = Math.round(Engine.estimateAttendance(fixture, weather) * Utils.randRange(0.85, 1.15));
    const holdersIn = Math.min(gameState.seasonTickets.roundsLeft > 0 ? gameState.seasonTickets.holders : 0, att);
    const paying = att - holdersIn;
    const gate = paying * ticket.price;
    Engine.money('Bilety (' + paying + ' × ' + ticket.price + ' zł)', gate);

    const sold = Math.round(att * 0.6 * weather.grill * sausage.rate * Utils.randRange(0.8, 1.2));
    const grillProfit = sold * (sausage.price - sausage.cost);
    gameState.stats.sausages += sold;
    Engine.money('Budka u Pana Zenka (' + sold + ' szt.)', grillProfit);

    Engine.addLog('🏟️ Frekwencja: ' + att + ' widzów' + (holdersIn ? ' (w tym ' + holdersIn + ' karnetowiczów)' : '') +
      '. Bilety: ' + Utils.formatMoney(gate) + '. Budka Zenka: ' + sold + ' szt. „' + sausage.label + '” → ' + Utils.formatMoney(grillProfit) + ' zysku.', 'finance');

    const ticketFans = gameState.club.character === 'suburban' && ticket.fans < 0 ? Math.round(ticket.fans / 3) : ticket.fans;
    Engine.applyEffects({ fans: ticketFans + sausage.fans });

    if (Math.random() < sausage.poisonRisk) {
      Engine.applyEffects({ fans: -5 });
      Engine.addLog('🤢 Po przerwie trzech kibiców pobiegło w krzaki za trybuną. Pasztetowa zbiera żniwo. [kibice -5%]', 'event');
      Engine.addScandal('zatrucie w budce z kiełbaskami');
      Engine.shiftDNA(-3);
      gameState.report.matchCtx.poisoned = true;
    }

    if (rival.derby) {
      if (md.security === 'hired' || gameState.stadium.upgrades.monitoring) {
        Engine.addLog('🛡️ Byczki z Herkulesa stali przy bramie. Nikt nie odważył się rzucić nawet łupiną od słonecznika.', 'event');
      } else if (Math.random() < (gameState.club.character === 'industrial' ? 0.6 : 0.45)) {
        Engine.money('Kara Związku za zadymę', -Math.round(600 * Selectors.econ()));
        Engine.applyEffects({ fans: +2 });
        Engine.addLog('💥 ZADYMA! Przyjezdni kibice (' + rival.name + ') wtargnęli na murawę, wujek Staszek zgubił latarkę. Związek nalicza karę 600 zł. Miejscowi zachwyceni widowiskiem.', 'event');
        Engine.addScandal('zadyma na derbach');
        Engine.shiftDNA(-5);
        gameState.report.matchCtx.riot = true;
      } else {
        Engine.addLog('😅 Derby bez ochrony przeszły spokojnie. Wujek Staszek mówi, że to dzięki latarce.', 'event');
      }
    }

    const damage = 5 + weather.pitchDamage;
    gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch - damage, 0, 100);
    if (weather.pitchDamage >= 15) Engine.addLog('🟫 Mecz w deszczu zrył murawę (-' + damage + ' stanu boiska). Pan Heniek klnie pod nosem z grabiami w ręku.', 'event');
  },

  // Ulubieniec Trybun: gole albo dużo meczów przy dobrej klasie. Trybuny kochają naraz najwyżej kilku.
  updateBadges() {
    gameState.squad.forEach((p) => {
      if (gameState.squad.filter((x) => x.favorite).length >= CONFIG.maxFavorites) return;
      if (!p.favorite && (p.goals >= 12 || (p.apps >= 45 && p.skill >= 6))) {
        p.favorite = true;
        Engine.addLog('⭐ ' + Selectors.playerName(p) + ' zostaje ULUBIEŃCEM TRYBUN! Babcie z pierwszego rzędu szyją mu szalik.', 'event');
      }
    });
  },

  endSeason() {
    const pos = Selectors.standings().findIndex((row) => row.team === US) + 1;
    const r = gameState.record;
    const level = gameState.club.leagueLevel;
    const maxLevel = DATA.leagueLevels.length - 1;
    const leagueName = Selectors.leagueName();
    const club = Selectors.clubDisplayName();
    gameState.stats.seasons++;
    Engine.addLog('🏁 KONIEC SEZONU ' + gameState.calendar.season + ' (' + leagueName + ')! Miejsce w tabeli: ' + pos + '/10. Bilans: ' + r.wins + 'W ' + r.draws + 'R ' + r.losses + 'P, bramki ' + r.goalsFor + ':' + r.goalsAgainst + '.', 'system');

    // --- Awans, spadek, tytuł ---
    let newLevel = level;
    let outcome = pos <= 3 ? 'podium' : 'mid';
    if (gameState.season.forcedRelegation && level > 1) {
      newLevel = level - 1; outcome = 'forced';
      Engine.addLog('⚖️ PRZYMUSOWA DEGRADACJA! Wydział Dyscypliny za aferę korupcyjną zsyła klub do ligi niżej: ' + DATA.leagueLevels[newLevel].name + '.', 'system');
      Engine.xPost('portal', club + ' zdegradowany za korupcję! Czarny Passat odjechał, a klub razem z nim – ligę niżej. 🚗💨');
    } else if (pos <= CONFIG.promotionSpots && level < maxLevel) {
      if (gameState.season.promotionBan) {
        outcome = 'banned';
        Engine.addLog('🚫 Awans wywalczony na boisku, ale Wydział Dyscypliny trzyma zakaz awansu po aferze. Zostajemy w lidze: ' + leagueName + '.', 'system');
        Engine.xPost('sukces', 'Awans? Hahaha. Nie z tymi reklamówkami. 🤡🚫');
      } else {
        newLevel = level + 1; outcome = 'promo';
        Engine.addLog('🎉 AWANS!!! ' + club + ' zagra w następnym sezonie w lidze: ' + DATA.leagueLevels[newLevel].name + '! Pan Heniek płacze ze szczęścia do kosiarki.', 'system');
        Engine.xPost('portal', 'AWANS! ' + club + ' w lidze ' + DATA.leagueLevels[newLevel].name + '! Cała gmina świętuje, sołtys ogłosił dzień wolny od koszenia. 🎉');
        Engine.xPost('ultras', 'AWANS AWANS AWANS!!! ' + DATA.leagueLevels[newLevel].name + ' NASZA! Tego nie da się opisać 🔥🔥🔥');
      }
    } else if (pos === 1 && level === maxLevel) {
      outcome = 'title';
      gameState.stats.titles++;
      Engine.addLog('🏆 MISTRZ POLSKI!!! ' + club + ' – klub spod remizy na szczycie Ekstraklasy! Krowy pana Zdzicha dostają dzień wolny.', 'system');
      Engine.xPost('portal', 'SENSACJA STULECIA: ' + club + ' MISTRZEM POLSKI! Od B-klasy do tytułu. Pan Zenek: „To wszystko dzięki gięte z cebulką”. 🏆');
    } else if (pos === 10) {
      if (level > 1) {
        newLevel = level - 1; outcome = 'releg';
        Engine.addLog('📉 SPADEK. ' + club + ' wraca do ligi: ' + DATA.leagueLevels[newLevel].name + '. Na trybunach cisza, tylko pies szczeka.', 'system');
        Engine.xPost('sukces', 'SPADEK. Wiedziałem od początku. ' + Selectors.presName() + ' do dymisji (piszę to od 3 sezonów). 📉🤡');
      } else {
        outcome = 'shame';
        Engine.applyEffects({ fans: -10 });
        Engine.addLog('🙈 Ostatnie miejsce w B-klasie. Niżej się nie da, ale wstyd na cały powiat. [kibice -10%]', 'system');
        Engine.xPost('ultras', 'Ostatnie miejsce… Chłopaki, my i tak zostajemy. Ale kto wyłączy światło w blaszaku, jak wszyscy odejdą? 💔');
        Engine.xPostRaw('😤', '@Fanatycy' + Selectors.handleFrom(gameState.league.rivals[0].name), 'Czerwona latarnia B-klasy 🏮😂 Nawet krowy pana Zdzicha grają lepiej.');
        Engine.pushDecision('lastPlaceShame');
      }
    }
    gameState.lastSeason = { pos, outcome, league: leagueName };
    if (outcome === 'promo') {
      gameState.stats.promotions++;
      gameState.stats.topLevel = Math.max(gameState.stats.topLevel, newLevel);
      Engine.checkLicense(newLevel);
    } else if (outcome === 'releg' || outcome === 'forced') {
      gameState.stats.relegations++;
    } else if (level >= 2 && Selectors.licenseMissing(level).length) {
      const fine = Math.round(500 * Selectors.econ());
      Engine.money('Kara: niewykonany nakaz budowy', -fine);
      Engine.addLog('📋 Nakaz budowy niewykonany (' + Selectors.licenseMissing(level).join(', ') + '). Związek nakłada kolejną karę: ' + Utils.formatMoney(fine) + '.', 'system');
    }
    if (outcome === 'promo' || outcome === 'title' || outcome === 'podium') Engine.pushDecision('feta');

    // Starzenie, staż, legendy, emerytury
    const retiring = [];
    gameState.squad.forEach((p) => {
      p.age++; p.seasons++; p.seasonApps = 0; p.seasonGoals = 0;
      if (p.age <= 24 && Math.random() < (p.talent ? 0.85 : 0.5)) p.skill = Math.min(CONFIG.maxSkill, p.skill + 1);   // młodzi się rozwijają (Perełki szybciej)
      if (p.age >= 33 && Math.random() < 0.4) p.skill = Math.max(1, p.skill - 1);   // starzy słabną
      if (p.favorite && !p.legend && p.seasons >= 5) {
        p.legend = true;
        Engine.addLog('🏆 ' + Selectors.playerName(p) + ' zostaje LEGENDĄ KLUBU! Jego zdjęcie wisi w blaszaku obok kalendarza z traktorami.', 'event');
      }
      if (p.age >= 35 && (p.age >= 39 || Math.random() < 0.45)) retiring.push(p);
    });
    retiring.forEach((p) => {
      gameState.squad = gameState.squad.filter((x) => x.id !== p.id);
      if (p.favorite || p.legend) {
        gameState.retirees.push(p);
      } else {
        Engine.addLog('👋 ' + Selectors.playerName(p) + ' (' + p.age + ' l.) kończy karierę. „Kolana mówią dość, żona mówi dość, ja mówię dość.”', 'event');
      }
    });
    Engine.queueRetirementDecision();

    // Szkółka: 2 juniorów; Były Ligowiec ściąga kogoś lepszego
    for (let i = 0; i < 2; i++) Engine.youthIntake();
    if (Selectors.coach().attracts) Engine.coachBringsPlayer();

    gameState.calendar.season++;
    gameState.calendar.round = 0;
    gameState.dark.offersThisSeason = 0;
    Object.assign(gameState.record, { played: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 });
    if (newLevel !== level) {
      gameState.club.leagueLevel = newLevel;
      Engine.buildLeague(newLevel);
    }
    Engine.newSeason();
    if (newLevel !== level) Engine.addLog('📠 Nowy terminarz z faksu Związku. Rywale w lidze ' + Selectors.leagueName() + ': ' + gameState.league.rivals.map((x) => x.name).join(', ') + '.', 'system');
  },

  /* ----- Liga: nowi rywale po awansie/spadku ----- */
  buildLeague(level) {
    const L = DATA.leagueLevels[level];
    gameState.league.rivals = level === 1
      ? DATA.rivals.map((r) => ({ ...r }))
      : Utils.shuffle(L.pool).slice(0, 9).map((name, i) => ({
        name, derby: i < 2,
        strength: Math.round((L.rivalBase + Utils.randRange(-0.25, 0.25)) * 100) / 100,
      }));
    gameState.season.strength = {};
  },

  checkLicense(level) {
    const missing = Selectors.licenseMissing(level);
    const name = DATA.leagueLevels[level].name;
    if (!missing.length) {
      Engine.addLog('📋 Licencja na ' + name + ' przyznana bez uwag. Inspektor ze Związku nawet zjadł kiełbaskę.', 'system');
      return;
    }
    const fine = Math.round(300 * DATA.leagueLevels[level].econ);
    Engine.money('Kara licencyjna (warunkowa licencja)', -fine);
    Engine.addLog('📋 WARUNKOWA LICENCJA na ' + name + '! Związek: brak – ' + missing.join(', ') + '. Kara ' + Utils.formatMoney(fine) + ' i nakaz budowy do końca sezonu (inaczej kolejna kara).', 'system');
  },

  /* ----- Długi: odsetki, strajk, komornik, walne zebranie ----- */
  debtCheck() {
    const b = gameState.finance.budget;
    const t = Selectors.debtThresholds();
    const d = gameState.debt;
    d.strike = b < t.warn;
    if (d.strike) {
      const interest = Math.round(-b * 0.03);
      Engine.money('Odsetki karne – Bank Spółdzielczy', -interest);
      Engine.applyEffects({ lockerRoom: -3 });
      Engine.addLog('💸 Odsetki karne z Banku Spółdzielczego: ' + Utils.formatMoney(interest) + '. W szatni strajk: „Nie ma na paliwo, nie ma gry”. [szatnia -3%, słabsza gra]', 'event');
    }
    if (gameState.finance.budget < t.bailiff) {
      const fee = Math.round(-gameState.finance.budget * 0.04);
      Engine.money('Koszty egzekucji komorniczej', -fee);
      const owned = Object.keys(gameState.stadium.upgrades).filter((k) => gameState.stadium.upgrades[k]);
      if (owned.length && Math.random() < 0.35) {
        const id = Utils.rand(owned);
        const u = DATA.upgrades[id];
        gameState.stadium.upgrades[id] = false;
        Engine.money('Licytacja komornicza: ' + u.label, Math.round(u.cost * 0.3));
        if (id === 'boiler') Engine.applyEffects({ lockerRoom: -8 });
        Engine.addLog('⚖️ KOMORNIK NA OBIEKCIE! Zlicytował „' + u.label + '” za 30% wartości. Pan Heniek patrzył przez płot i płakał.', 'event');
        Engine.xPost('portal', 'Komornik na stadionie ' + Selectors.clubDisplayName() + '! Na licytacji poszło: ' + u.label + '. Kupił… prezes rywala. 🔨');
      } else {
        Engine.addLog('⚖️ KOMORNIK NA OBIEKCIE! Zajął utarg z bramki i sklepiku na poczet długu, opisał kosiarkę i nalicza koszty egzekucji (' + Utils.formatMoney(fee) + ').', 'event');
      }
    }
    if (gameState.finance.budget < t.gameOver) {
      d.deepWeeks++;
      const left = CONFIG.debtGameOverWeeks - d.deepWeeks;
      if (left > 0) Engine.addLog('☠️ WALNE ZGROMADZENIE ZWOŁANE! Dług ponad ' + Utils.formatMoney(-t.gameOver) + '. Jeśli nie wyjdziemy z tego w ' + left + ' tyg., członkowie w remizie odwołają Prezesa!', 'event');
    } else {
      d.deepWeeks = 0;
    }
  },

  /* ----- Płynny balanser trudności (w tle) ----- */
  maybeBalance() {
    const dda = gameState.dda;
    const w = gameState.calendar.week;
    const e = Selectors.econ();
    const b = gameState.finance.budget;
    const r = gameState.record;
    if (gameState.pendingDecisions.some((id) => id.startsWith('lifeline') || id.startsWith('brake'))) return;
    const drowning = (r.lossStreak >= 4 && b < -1000 * e) || b < -3000 * e;
    const cruising = r.winStreak >= 6 && b > 6000 * e;
    if (drowning && w - dda.lastLifeline >= 8) {
      dda.lastLifeline = w;
      Engine.pushDecision(Utils.rand(['lifelineRadny', 'lifelineEmigracja', 'lifelineTaca']));
    } else if (cruising && w - dda.lastBrake >= 8) {
      dda.lastBrake = w;
      Engine.pushDecision(Utils.rand(['brakeSanepid', 'brakeRoof', 'brakeBonus']));
    }
  },

  /* ----- Koniec gry ----- */
  checkGameOver() {
    if (gameState.screen !== 'game') return;
    if (gameState.debt.deepWeeks >= CONFIG.debtGameOverWeeks) {
      Engine.gameOver('Dług przekroczył ' + Utils.formatMoney(-Selectors.debtThresholds().gameOver) + ' przez ' + CONFIG.debtGameOverWeeks + ' tygodnie z rzędu. Walne Zgromadzenie w remizie odwołało Prezesa jednogłośnie (wstrzymał się tylko Pan Heniek).');
    } else if (gameState.morale.lockerRoom <= 0 && gameState.morale.fans <= 0) {
      Engine.gameOver('Szatnia i kibice w totalnym buncie (0% i 0%). Walne Zgromadzenie zebrało się w remizie bez zaproszenia Prezesa.');
    }
  },

  gameOver(reason) {
    gameState.gameOver = { reason, season: gameState.calendar.season, week: gameState.calendar.week, budget: gameState.finance.budget, league: Selectors.leagueName(), dna: Selectors.dnaLabel() };
    gameState.screen = 'gameover';
    Storage.clear();
  },

  queueRetirementDecision() {
    if (gameState.retirees.length) Engine.pushDecision('veteranStaff');
  },

  /* ----- Zawodnicy ----- */
  // Tworzy zawodnika bez dodawania do kadry (skauting też z tego korzysta).
  makePlayer({ ageMin = 18, ageMax = 32, skillMin = 3, skillMax = 6, wageMin = 10, wageMax = 30, pos = null, trait = null } = {}) {
    trait = trait || Utils.rand(DATA.traits);
    const positions = ['GK', 'DEF', 'DEF', 'DEF', 'MID', 'MID', 'MID', 'FWD', 'FWD'];
    // Bramkarz, gdy brakuje – reszta losowo
    const needGK = gameState.squad.filter((p) => p.pos === 'GK').length < 2;
    gameState.nextPlayerId++;
    const p = {
      id: 'p' + gameState.nextPlayerId,
      first: Utils.rand(DATA.names.first), nick: Utils.rand(DATA.names.nick), last: Utils.rand(DATA.names.last),
      age: Utils.randInt(ageMin, ageMax),
      pos: pos || (needGK ? 'GK' : Utils.rand(positions)),
      skill: Utils.clamp(Utils.randInt(skillMin, skillMax), 1, CONFIG.maxSkill),
      profile: trait.profile || Utils.rand(['off', 'def', 'uni']),
      wage: Math.round(Utils.randInt(wageMin, wageMax) / 5) * 5,
      trait: trait.text, tag: trait.tag || null,
      apps: 0, goals: 0, seasons: 1, seasonApps: 0, seasonGoals: 0,
      favorite: false, legend: false, talent: false,
    };
    return p;
  },

  generatePlayer(opts = {}) {
    const p = Engine.makePlayer(opts);
    gameState.squad.push(p);
    return p;
  },

  coachBringsPlayer() {
    if (gameState.squad.length >= CONFIG.maxSquad) return;
    const p = Engine.generatePlayer({ ageMin: 26, ageMax: 32, skillMin: 6 + Selectors.levelSkillBonus(), skillMax: 8 + Selectors.levelSkillBonus(), wageMin: Math.round(30 * Selectors.econ()), wageMax: Math.round(45 * Selectors.econ()) });
    Engine.addLog('🤝 Trener ' + Selectors.coach().name + ' ściągnął „kolegę z dawnych lat”: ' + Selectors.playerName(p) + ' (' + DATA.positions[p.pos].label.toLowerCase() + '). Chce ' + p.wage + ' zł/tydz. „na paliwo”.', 'event');
  },

  releasePlayer(id) {
    const p = gameState.squad.find((x) => x.id === id);
    if (!p || gameState.squad.length <= CONFIG.minSquad) return;
    gameState.squad = gameState.squad.filter((x) => x.id !== id);
    let effects = {};
    let text = '✂️ Prezes podziękował za grę: ' + Selectors.playerName(p) + '.';
    if (p.legend) {
      effects = { fans: -12, lockerRoom: -10 };
      text += ' WYRZUCIĆ LEGENDĘ?! Kibice palą szaliki, szatnia nie odzywa się do Prezesa.';
    } else if (p.favorite) {
      effects = { fans: -8 };
      text += ' Wyrzucony Ulubieniec Trybun! Na płocie pojawia się napis „PREZES DO DYMISJI”.';
    } else {
      text += ' Zabrał korki, ręcznik i dwie piłki klubowe.';
    }
    Engine.applyEffects(effects);
    Engine.addLog(text + Engine.describeEffects(effects), 'event');
  },

  /* ----- Trener ----- */
  severance() {
    return Selectors.coachWeekly() * 3;
  },

  setCoach(id) {
    const c = gameState.coach;
    c.id = id; c.hiredWeek = gameState.calendar.week; c.carpetBoost = 0; c.boringStreak = 0; c.lastReport = '';
    c.weekly = Selectors.coachOffer(DATA.coaches[id]).weekly;
  },

  hireCoach(id) {
    const coach = DATA.coaches[id];
    if (!coach || gameState.coach.id !== 'mirek' || id === 'mirek' || gameState.finance.budget < Selectors.coachOffer(coach).sign) return;
    Engine.money('Podpis trenera: ' + coach.name, -Selectors.coachOffer(coach).sign);
    Engine.setCoach(id);
    Engine.addLog('✍️ Nowy trener: ' + coach.name + ' (' + coach.title + '). Styl: ' + DATA.styles[coach.style].label + ' – „' + DATA.styles[coach.style].motto + '”. Pan Mirek z ulgą wraca do kosiarki.', 'decision');
    if (coach.attracts) Engine.coachBringsPlayer();
  },

  fireCoach(withSeverance) {
    const coach = Selectors.coach();
    if (gameState.coach.id === 'mirek') return;
    if (withSeverance) {
      Engine.money('Odprawa: ' + coach.name, -Engine.severance());
      Engine.addLog('📤 Trener ' + coach.name + ' zwolniony z odprawą ' + Utils.formatMoney(Engine.severance()) + '. Rozstanie w zgodzie, nawet uścisk dłoni.', 'decision');
    } else {
      Engine.applyEffects({ lockerRoom: -8 });
      Engine.addLog('📤 Trener ' + coach.name + ' zwolniony bez grosza odprawy. Szatnia strzela focha: „Tak się ludzi nie traktuje!”. [szatnia -8%]', 'decision');
    }
    Engine.setCoach('mirek');
  },

  carpetCoach() {
    const c = gameState.coach;
    if (gameState.calendar.week - c.lastCarpetWeek < CONFIG.carpetCooldown) return;
    c.lastCarpetWeek = gameState.calendar.week;
    const coach = Selectors.coach();
    if (Math.random() < 0.7) {
      c.carpetBoost = 0.08;
      Engine.addLog('🟥 Dywanik: ' + coach.carpetOk + ' [mobilizacja na najbliższy mecz]', 'decision');
    } else {
      c.carpetBoost = -0.03;
      Engine.applyEffects({ lockerRoom: -3 });
      Engine.addLog('🟥 Dywanik: ' + coach.carpetBad + ' [szatnia -3%]', 'decision');
    }
  },

  /* ----- Sztab pomocniczy ----- */
  hireStaff(slot) {
    const cand = DATA.staffCandidates[slot];
    if (!cand || (gameState.staff[slot] && gameState.staff[slot].kind !== 'volunteer')) return;
    const prev = gameState.staff[slot];
    gameState.staff[slot] = { name: cand.name, kind: 'external', wage: Math.round(cand.wage * Selectors.econ()), chem: cand.chem, lockerBase: cand.lockerBase, desc: cand.desc };
    Engine.addLog('🧑‍💼 Do sztabu dołącza ' + cand.name + ' (' + DATA.staffSlots[slot].label + ', ' + Math.round(cand.wage * Selectors.econ()) + ' zł/tydz.).' + (prev ? ' ' + prev.name + ' wraca do koszenia trawy.' : ''), 'decision');
  },

  fireStaff(slot) {
    const m = gameState.staff[slot];
    if (!m) return;
    gameState.staff[slot] = null;
    if (m.kind === 'veteran') {
      Engine.applyEffects({ fans: -3, lockerRoom: -5 });
      Engine.addLog('📤 Prezes zwolnił ze sztabu weterana: ' + m.name + '. Za dychę tygodniowo?! Wstyd na całą gminę. [kibice -3%, szatnia -5%]', 'decision');
    } else {
      Engine.addLog('📤 ' + m.name + ' nie jest już w sztabie.', 'decision');
    }
  },

  hireVeteranStaff() {
    const p = gameState.retirees.shift();
    if (!p) return;
    let slot = Selectors.freeStaffSlot();
    if (!slot) {
      // brak miejsca: weteran zastępuje osobę z najmniejszym wpływem
      slot = Object.keys(gameState.staff).sort((a, b) => {
        const v = (m) => (m ? m.chem + m.lockerBase : -1);
        return v(gameState.staff[a]) - v(gameState.staff[b]);
      })[0];
      Engine.addLog(gameState.staff[slot].name + ' ustępuje miejsca w sztabie zasłużonemu weteranowi.', 'event');
    }
    const v = DATA.veteranStaff;
    gameState.staff[slot] = {
      name: Selectors.playerName(p), kind: 'veteran', wage: v.wage, chem: v.chem, lockerBase: v.lockerBase,
      desc: (p.legend ? 'Legenda klubu' : 'Ulubieniec Trybun') + ', ' + p.apps + ' meczów, ' + p.goals + ' goli. Teraz: ' + DATA.staffSlots[slot].label.toLowerCase() + '.',
    };
    Engine.queueRetirementDecision();
  },

  /* ----- DNA klubu ----- */
  shiftDNA(delta) {
    const before = Selectors.dnaLabel();
    gameState.club.professionalism = Utils.clamp(gameState.club.professionalism + delta, -100, 100);
    const after = Selectors.dnaLabel();
    if (after !== before) Engine.addLog('🧬 DNA klubu się zmienia: teraz „' + after + '”.', 'system');
  },

  /* ----- Skauting: Szwagier ----- */
  sendScout() {
    const sc = gameState.scouting;
    if (sc.missionReturnWeek || gameState.finance.budget < Selectors.scoutTier().cost) return;
    Engine.money('Szwagier: benzyna i „załącznik” na festynie', -Selectors.scoutTier().cost);
    sc.missionReturnWeek = gameState.calendar.week + CONFIG.scoutWeeks;
    sc.festival = Utils.rand(DATA.festivals);
    sc.candidates = [];
    Engine.addLog('🚗 ' + Selectors.scoutTier().who + ' pojechał na zwiady (' + sc.festival + '). Wziął ' + Selectors.scoutTier().cost + ' zł „na benzynę i załącznik”. Wraca w Tygodniu ' + sc.missionReturnWeek + '.', 'decision');
  },

  scoutReport() {
    const sc = gameState.scouting;
    const tier = Selectors.scoutTier();
    const n = Utils.randInt(tier.count[0], tier.count[1]);
    const bonus = Selectors.levelSkillBonus() + tier.skillBonus;   // wyższa liga i lepsza siatka = lepsi kandydaci
    const e = Selectors.econ();
    sc.candidates = Utils.shuffle(DATA.scoutGossip).slice(0, n).map((g) => {
      const [ageMin, ageMax] = g.age || [19, 31];
      const p = Engine.makePlayer({ ageMin, ageMax, skillMin: g.skill[0] + bonus, skillMax: g.skill[1] + bonus, pos: g.pos, trait: g });
      p.wage = Math.max(5, Math.round((p.skill * 6 - 10) * e / 5) * 5);
      p.fee = Math.max(20, Math.round((30 + p.skill * 20 + Utils.randInt(-20, 20)) * e / 10) * 10);
      p.rumorSkill = Utils.clamp(p.skill + (Math.random() < tier.accuracy ? Utils.randInt(-1, 1) : 0), 1, CONFIG.maxSkill);
      return p;
    });
    sc.missionReturnWeek = 0;
    Engine.addLog('🕵️ ' + Selectors.scoutTier().who + ' wrócił ze zwiadów (' + sc.festival + '), ledwo trzymając się na nogach. W notesie ' + n + ' nazwiska. Raport w zakładce Skauting.', 'event');
  },

  upgradeScout() {
    const sc = gameState.scouting;
    const next = DATA.scoutTiers[sc.tier + 1];
    if (!next || gameState.club.leagueLevel < next.minLevel || gameState.finance.budget < next.upgradeCost || sc.missionReturnWeek) return;
    Engine.money('Skauting: ' + next.name, -next.upgradeCost);
    sc.tier++;
    Engine.addLog('🗂️ Skauting awansuje razem z klubem: od teraz „' + next.name + '”. Szwagier dostał dyplom uznania i bon do Biedronki.', 'decision');
  },

  signCandidate(id) {
    const sc = gameState.scouting;
    const p = sc.candidates.find((x) => x.id === id);
    if (!p || gameState.squad.length >= CONFIG.maxSquad || gameState.finance.budget < p.fee) return;
    const fee = p.fee;
    Engine.money('Odstępne: ' + Selectors.playerName(p), -fee);
    sc.candidates = sc.candidates.filter((x) => x.id !== id);
    delete p.fee; delete p.rumorSkill;
    gameState.squad.push(p);
    Engine.addLog('✍️ Kontrakt podpisany na masce Astry: ' + Selectors.playerName(p) + ' (' + DATA.positions[p.pos].label.toLowerCase() + ', ' + p.wage + ' zł/tydz.). Odstępne: ' + Utils.formatMoney(fee) + '. Szwagier: „A nie mówiłem?”', 'decision');
  },

  /* ----- Szkółka ----- */
  buyYouthUpgrade(id) {
    const u = DATA.youthUpgrades[id];
    const ups = gameState.scouting.youthUpgrades;
    if (!u || ups[id] || gameState.finance.budget < u.cost) return;
    Engine.money('Szkółka: ' + u.label, -u.cost);
    ups[id] = true;
    Engine.shiftDNA(+3);
    Engine.addLog('🎽 Inwestycja w szkółkę: ' + u.label + ' (' + Utils.formatMoney(u.cost) + '). Teraz: „' + DATA.youthLevels[Selectors.youthLevel()].label + '”.', 'finance');
  },

  youthIntake() {
    if (gameState.squad.length >= CONFIG.maxSquad) {
      Engine.addLog('🌱 Junior ze szkółki musi poczekać – w szatni nie ma wolnego haczyka (kadra ' + CONFIG.maxSquad + '/' + CONFIG.maxSquad + ').', 'event');
      return null;
    }
    const lvl = DATA.youthLevels[Selectors.youthLevel()];
    const talent = Math.random() < lvl.talentChance;
    const p = Engine.generatePlayer({ ageMin: 17, ageMax: 18, skillMin: (talent ? 5 : lvl.skillMin) + Selectors.levelSkillBonus(), skillMax: (talent ? 6 : lvl.skillMax) + Selectors.levelSkillBonus(), wageMin: 5, wageMax: 5 });
    p.talent = talent;
    Engine.addLog(talent
      ? '💎 PEREŁKA POWIATU! Ze szkółki wskakuje ' + Selectors.playerName(p) + ' (' + p.age + ' l., ' + DATA.positions[p.pos].label.toLowerCase() + '). Skauci z A-klasy już dzwonią do jego mamy.'
      : '🌱 Ze szkółki dołącza ' + Selectors.playerName(p) + ' (' + p.age + ' l., ' + DATA.positions[p.pos].label.toLowerCase() + ') – „' + Selectors.skillLabel(p.skill) + '”.', 'event');
    return p;
  },

  pullJunior() {
    const key = Selectors.youthPullKey();
    if (gameState.scouting.lastYouthPullKey === key || gameState.squad.length >= CONFIG.maxSquad) return;
    gameState.scouting.lastYouthPullKey = key;
    Engine.youthIntake();
  },

  /* ----- Wirtualny X ----- */
  xPostRaw(avatar, handle, text, official = false) {
    gameState.x.lastPostId++;
    gameState.feed.unshift({
      id: gameState.x.lastPostId, week: gameState.calendar.week, avatar, handle, text, official,
      likes: Utils.randInt(official ? 15 : 2, official ? 120 : 70), shares: Utils.randInt(0, 15), replies: Utils.randInt(0, 25),
    });

  xPost(accountId, text, official = false) {
    const acc = DATA.xAccounts[accountId];
    Engine.xPostRaw(acc.avatar, Utils.val(acc.handle), text, official);
  },

  // 2–4 posty po meczu: wynik + kontekst (styl, derby, ulubieńcy, afery)
  matchPosts(c) {
    const club = Selectors.clubDisplayName();
    const score = c.gf + ':' + c.ga;
    const total = c.gf + c.ga;
    const must = [], extra = [];
    if (c.result === 'W') {
      Engine.xPost('ultras', Utils.rand([
        'WYGRANA ' + score + ' z ' + c.rival + '! Cała wieś na rynku, ktoś przyniósł akordeon 🪗🔥',
        score + '!!! Tak się gra w tej gminie! Dziś pijemy zdrowie trenera 🍻',
        'Trzy punkty zostają u nas! ' + score + '. Kto nie skacze, ten z ' + Selectors.handleFrom(c.rival) + '! 🔥',
      ].concat(Selectors.colorsNick() ? ['Nasi ' + Selectors.colorsNick() + '! ' + score + ' z ' + c.rival + '! Cała ' + gameState.club.town + ' w barwach! 🎉'] : [])));
      if (Math.random() < 0.5) extra.push(['sukces', 'Zawsze w was wierzyłem!!! (pierwszy raz na meczu od 2015) 💪']);
    } else if (c.result === 'D') {
      Engine.xPost('ultras', Utils.rand([
        'Remis ' + score + '. Ani radość, ani smutek. Jak obiad u teściowej. 😐',
        score + ' z ' + c.rival + '. Punkt to punkt, ale serce chciało więcej.',
      ].concat(Selectors.colorsNick() ? ['Remis. ' + Selectors.colorsNick() + ' walczyli, ale w ' + gameState.club.town + ' oczekujemy więcej.'] : [])));
    } else {
      Engine.xPost('sukces', Utils.rand([
        score + '. Sprzedawczyki. ' + Selectors.presName() + ' do dymisji, trener do dymisji, ja też wychodzę. #KoniecZTymKlubem',
        score + ' z ' + c.rival + '?! Mój pies by lepiej zagrał. A pies ma trzy nogi.',
        'Przestaję kibicować. Od jutra. Albo od soboty, jak znowu przegramy. 😤',
      ]));
      if (Math.random() < 0.5) extra.push(['wyjadacz', 'Za moich czasów po takim meczu drużyna wracała do domu piechotą. I dobrze.']);
    }
    if (c.derby) {
      const rivalText = c.result === 'W'
        ? 'Sędzia kupiony, boisko krzywe, kiełbasa zimna. Wrócimy po swoje! 😤'
        : c.result === 'L' ? 'Hahaha ' + Selectors.clubHandle() + ' znowu na kolanach 😂 KOSA JEST NASZA!'
        : 'Remis u was to dla nas jak wygrana. Do zobaczenia w rewanżu 😤';
      must.push(['@Fanatycy' + Selectors.handleFrom(c.rival), rivalText]);
    }
    if (c.hype && c.result === 'L') must.push(['sukces', '„WSZYSCY NA STADION, BĘDZIE POGROM” – no i był pogrom. Nasz. 🤡🤡🤡']);
    if (c.poisoned) must.push(['portal', 'Zatrucie na stadionie w ' + club + '? Sanepid „przygląda się sprawie”. Pan Zenek: „To na pewno grzyby z wesela”.']);
    if (c.riot) must.push(['portal', 'Zadyma na derbach ' + club + ' – ' + c.rival + '! Wydział Dyscypliny analizuje nagrania z telefonu pani Krysi. 📹']);
    if (total >= 5) extra.push(['portal', 'Grad bramek: ' + total + ' goli w meczu ' + club + ' – ' + c.rival + '! „Tak się powinno grać w każdej wsi” – mówi pan Heniek, gospodarz obiektu.']);
    if (total <= 1 && c.result !== 'W' && c.style === 'def') extra.push(['ultras', 'Przyszliśmy na mecz, obejrzeliśmy budowę muru 🧱🧱🧱 ' + c.coachName.toUpperCase() + ' WON! Chcemy goli!']);
    if (c.style === 'def' && c.result === 'W' && c.gf <= 1) extra.push(['wyjadacz', 'Wygrali 1:0 i co z tego. Na mecz idzie się po gole, nie po krzyżówkę.']);
    if (c.style === 'off' && c.gf >= 2) extra.push(['soltys', c.coachId === 'kamil' ? 'Ten młody z laptopem to jakiś czarodziej. Gra się jak w telewizji, tylko kałuże te same. 👏' : 'Nareszcie ofensywa! Warto wyjść z domu w sobotę. 👏']);
    if ((c.weather === 'mud' || c.weather === 'rain') && c.result === 'W') extra.push(['soltys', 'Błoto po kolana, a chłopaki walczyli jak lwy. Pralka pani Krysi tego nie przeżyje. 💪']);
    if (c.favScorers.length) extra.push(['grazynka', c.favScorers[0] + ' znowu strzelił! Dziś mortadela dla niego gratis 🥩']);
    // Zawsze jest o czym pogadać pod sklepem
    extra.push(Utils.rand([
      ['wyjadacz', 'Sędzia dziś jak zwykle: widział tylko to, co chciał. Czyli nic.'],
      ['soltys', 'Dziękuję wszystkim za doping. Proszę nie parkować na trawniku przy kościele.'],
      ['grazynka', 'Po meczu kiełbasa -20%! Kto pierwszy, ten lepszy 🌭'],
      ['portal', 'Relacja z meczu ' + club + ' – ' + c.rival + ' już na naszym portalu. Zdjęcia robił wnuczek pani Krysi.'],
    ]));
    // Post o wyniku już poszedł; dokładamy 1–2 komentarze (afery i derby mają pierwszeństwo).
    const limit = Math.min(3, Math.max(Utils.randInt(1, 2), must.length));
    must.concat(Utils.shuffle(extra)).slice(0, limit).forEach(([who, text]) => {
      if (who.startsWith('@')) Engine.xPostRaw('😤', who, text);
      else Engine.xPost(who, text);
    });
  },

  // Oficjalny post klubu – raz na tydzień
  officialPost(tone) {
    const x = gameState.x;
    const t = DATA.xTones[tone];
    if (!t || x.lastPostWeek === gameState.calendar.week) return;
    x.lastPostWeek = gameState.calendar.week;
    const fx = Selectors.currentFixture();
    const derby = Selectors.rival(fx.rival).derby;
    let text, effects = {};
    if (tone === 'humble') {
      text = Utils.rand(t.texts);
      effects = { fans: +1 };
      // Same pokorne posty zrobią z klubu najwyżej „Ambitny Ludowy Klub” – na profesjonalizm trzeba zapracować czynami.
      if (gameState.club.professionalism < 40) Engine.shiftDNA(+2);
    } else if (tone === 'hype') {
      text = Utils.rand(t.texts)(fx.rival);
      effects = { fans: +4 };
      x.hype = true;
    } else {
      const target = derby ? 'rival' : Utils.rand(['ref', 'union']);
      text = t.texts[target](fx.rival);
      effects = derby ? { fans: +8, lockerRoom: +4 } : { fans: +8 };
      Engine.xPost('official', text, true);
      Engine.applyEffects(effects);
      Engine.addLog('📱 Oficjalny post na Wirtualnym X (' + t.label + '): „' + text + '”' + Engine.describeEffects(effects), 'decision');
      if (Math.random() < 0.35) {
        Engine.money('Kara OZPN: wpis na Wirtualnym X', -300);
        Engine.shiftDNA(-3);
        Engine.xPost('portal', 'Wydział Dyscypliny OZPN ukarał ' + Selectors.clubDisplayName() + ' karą 300 zł za „szkalowanie ' + t.targetLabel[target] + '” w mediach społecznościowych. Klub: „Odwołamy się”. Nie odwoła się.');
        Engine.addLog('⚖️ Wydział Dyscypliny OZPN wlepia 300 zł kary za „szkalowanie ' + t.targetLabel[target] + '”. Pani Halinka łapie się za głowę.', 'event');
      }
      return;
    }
    Engine.xPost('official', text, true);
    Engine.applyEffects(effects);
    Engine.addLog('📱 Oficjalny post na Wirtualnym X (' + t.label + '): „' + text + '”' + Engine.describeEffects(effects), 'decision');
  },

  /* ----- Telefony z szatni ----- */
  maybeLockerCall() {
    const c = gameState.calls;
    const suburban = gameState.club.character === 'suburban';   // letnicy płacą więcej, to i chłopaki wołają częściej
    if (gameState.pendingDecisions.includes('wageDemand') || gameState.calendar.week - c.lastWeek < (suburban ? 3 : 4) || Math.random() > (suburban ? 0.45 : 0.3)) return;
    const lineup = Engine.pickLineup([]);
    const pool = gameState.squad.filter((p) => p.favorite || (lineup.includes(p) && p.skill >= 5));
    if (!pool.length) return;
    const p = Utils.rand(pool);
    const partner = Math.random() < 0.4;
    Object.assign(c, {
      lastWeek: gameState.calendar.week, playerId: p.id,
      caller: partner ? 'partner' : 'self', callerName: partner ? Utils.rand(DATA.partners) : '',
      rival: Utils.rand(gameState.league.rivals).name,
    });
    Engine.pushDecision('wageDemand');
  },

  /* ----- Ciemna strona: „Spółdzielnia” ----- */
  maybePassat() {
    const d = gameState.dark;
    if (d.fixed || d.offersThisSeason >= 2 || gameState.calendar.week - d.lastOfferWeek < 4) return;
    const kolejka = gameState.calendar.round + 1;
    const broke = gameState.finance.budget < 0;
    if (!(kolejka >= 14 || broke) || Math.random() > 0.3) return;
    const t = gameState.season.table[US];
    const contender = t && t.p > 0 && Selectors.ourPosition() <= 3;
    d.lastOfferWeek = gameState.calendar.week;
    d.offersThisSeason++;
    Engine.pushDecision(contender && gameState.finance.budget >= Selectors.passatBuyAmount() ? 'passatBuy' : 'passatSell');
  },

  resolveDarkDeal() {
    const d = gameState.dark;
    if (!d.fixed) return;
    const kind = d.fixed;
    d.fixed = null;
    Engine.addLog(kind === 'sell'
      ? '🎭 Bramkarz trzy razy „poślizgnął się na mokrej trawie”. Było sucho. Kibice drapią się po głowach.'
      : '🎭 Sędzia widział dziś wszystko. Szczególnie to, czego nie było. Rywale wściekli.', 'event');
    if (!d.risky) return;
    d.risky = false;
    if (Math.random() < Selectors.aferaRisk()) {
      const c = gameState.club;
      c.corruptionCaught++;
      const fine = Math.round(1000 * Selectors.econ() * c.corruptionCaught);
      const points = c.corruptionCaught >= 2 ? 6 : 3;
      Engine.addScandal('AFERA KORUPCYJNA – nagranie z czarnego Passata');
      Engine.applyEffects({ fans: -20, lockerRoom: -10 });
      Engine.money('Kara Związku: afera korupcyjna', -fine);
      Engine.shiftDNA(-20);
      gameState.season.table[US].pts -= points;
      Engine.xPost('portal', 'AFERA W ' + Selectors.leagueName().toUpperCase() + '! Nagranie z dyktafonu: „reklamówka z Biedronki”, „nikt się nie dowie”. Związek odejmuje ' + Selectors.clubDisplayName() + ' ' + points + ' pkt i nakłada ' + Utils.formatMoney(fine) + ' kary! 🎙️');
      Engine.addLog('🎙️ AFERA! Ktoś nagrał rozmowę z panem z Passata dyktafonem z Pepco. Związek: -' + points + ' pkt i ' + Utils.formatMoney(fine) + ' kary. Kibice wściekli. [kibice -20%, szatnia -10%]', 'event');
      if (gameState.sponsor.active) Engine.endSponsor('💨 Sponsor ' + Selectors.sponsor().name + ' ucieka po aferze: „Nie będziemy się tłumaczyć prokuratorowi z waszych reklamówek”.');
      if (c.corruptionCaught >= 3) {
        Engine.gameOver('Trzecia afera korupcyjna. Wydział Dyscypliny zawiesił cały zarząd, a prokuratura zabezpieczyła czarnego Passata i reklamówkę z Biedronki jako dowody.');
      } else if (c.corruptionCaught === 2) {
        gameState.season.promotionBan = true;
        if (gameState.club.leagueLevel > 1) gameState.season.forcedRelegation = true;
        Engine.addLog('⛔ DRUGA WPADKA W KARIERZE! Zakaz awansu w tym sezonie' + (gameState.club.leagueLevel > 1 ? ' i przymusowa degradacja po sezonie' : '') + '. Nad zarządem wisi widmo zawieszenia – trzecia wpadka i koniec.', 'system');
      }
    } else {
      Engine.addLog('🤫 Nikt niczego nie nagrał. Na razie.', 'event');
    }
  },

  /* ----- Sklepik ----- */
  merchPrice(itemId) {
    return Math.round(DATA.merch[itemId].basePrice * DATA.merchMarkups[gameState.merch.markup].priceMod);
  },

  orderMerch(itemId) {
    const item = DATA.merch[itemId];
    if (!item || gameState.finance.budget < item.batch * item.unitCost) return;
    const cost = item.batch * item.unitCost;
    Engine.money('Zamówienie: ' + item.label, -cost);
    gameState.merch.stock[itemId] += item.batch;
    Engine.addLog('📦 Zamówiono ' + item.batch + ' szt. „' + item.label + '” za ' + Utils.formatMoney(cost) + '. Karton stoi w szatni, zawodnicy już przymierzają.', 'finance');
  },

  /* ----- Sponsor ----- */
  signSponsor(id) {
    const sp = DATA.sponsors[id];
    const s = gameState.sponsor;
    if (!sp || s.active || s.burned.includes(id)) return;
    s.active = id;
    s.signedWeek = gameState.calendar.week;
    s.scandalsAtSign = gameState.club.scandals;
    Engine.applyEffects(sp.signEffects);
    Engine.addLog('🤝 Podpisano umowę sponsorską z: ' + sp.name + ' (' + Utils.formatMoney(Selectors.sponsorWeekly(sp)) + '/tydz.).' + Engine.describeEffects(sp.signEffects), 'finance');
  },

  endSponsor(logText) {
    const s = gameState.sponsor;
    if (!s.active) return;
    s.burned.push(s.active);
    s.active = null;
    Engine.addLog(logText, 'event');
  },

  /* ----- Pożyczki ----- */
  takeLoan(id) {
    const l = DATA.lenders[id];
    if (!l || gameState.loans.taken.some((x) => x.id === id)) return;
    gameState.loans.taken.push({ id, remaining: l.installments, rate: l.rate });
    Engine.money('Pożyczka: ' + l.name, l.amount);
    Engine.addLog('💸 ' + l.name + ' pożyczył ' + Utils.formatMoney(l.amount) + '. Spłata: ' + l.installments + ' rat po ' + Utils.formatMoney(l.rate) + '. ' + l.note, 'finance');
  },

  lendMoney(id) {
    const b = DATA.borrowers[id];
    if (!b || gameState.loans.given.some((x) => x.id === id) || gameState.finance.budget < b.amount) return;
    gameState.loans.given.push({ id, dueWeek: gameState.calendar.week + b.weeks, returns: b.returns, risk: b.risk, delays: 0 });
    Engine.money('Pożyczono: ' + b.name, -b.amount);
    Engine.addLog('🤝 Pożyczono ' + Utils.formatMoney(b.amount) + ' – ' + b.name + '. Ma oddać ' + Utils.formatMoney(b.returns) + ' za ' + b.weeks + ' tyg. Przybił piątkę, więc na pewno odda.', 'finance');
  },

  /* ----- Infrastruktura ----- */
  buyUpgrade(id) {
    const u = DATA.upgrades[id];
    const cost = Selectors.upgradeCost(id);
    if (!u || gameState.stadium.upgrades[id] || gameState.finance.budget < cost) return;
    Engine.money('Inwestycja: ' + u.label, -cost);
    gameState.stadium.upgrades[id] = true;
    if (id === 'roller') gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch + 30, 0, 100);
    if (id === 'boiler') Engine.applyEffects({ lockerRoom: +8 });
    Engine.addLog('🔧 Inwestycja: ' + u.label + ' (' + Utils.formatMoney(cost) + '). Pan Heniek mówi, że „takiego luksusu tu nie było od Gierka”.', 'finance');
  },

  // Hooki wykonywane po kliknięciu [NASTĘPNY TYDZIEŃ], po kolei.
  // Rozliczają bieżący tydzień, a na końcu przesuwają kalendarz.
  weeklyHooks: [
    function openReport() {
      gameState.report = { week: gameState.calendar.week, lines: [], homeMatch: false, result: null };
    },
    function rollFlavor() {
      const entry = Utils.rand(DATA.weeklyFlavor);
      Engine.applyEffects(entry.effects, 'Zdarzenia losowe');
      Engine.addLog(entry.text + Engine.describeEffects(entry.effects), entry.effects ? 'event' : 'flavor');
    },
    function matchday() {
      if (Selectors.isMatchWeek()) Engine.playMatchday();
    },
    function socialFeed() {
      const ctx = gameState.report.matchCtx;
      if (ctx) Engine.matchPosts(ctx);
      else if (Math.random() < 0.6) { const [who, text] = Utils.rand(DATA.xGossip); Engine.xPost(who, text); }
    },
    function merchSales() {
      const m = gameState.merch;
      const markup = DATA.merchMarkups[m.markup];
      const favorites = gameState.squad.filter((p) => p.favorite).length;
      const parts = [];
      let income = 0;
      Object.keys(DATA.merch).forEach((id) => {
        if (m.stock[id] <= 0) return;
        const item = DATA.merch[id];
        let d = item.demand * Math.sqrt(Selectors.econ()) * (0.4 + gameState.morale.fans / 60) * markup.demandMod * Utils.randRange(0.5, 1.5);
        if (item.favoriteBoost) d *= 1 + 0.25 * Math.min(favorites, 4);   // koszulki z nazwiskiem ulubieńca
        if (gameState.report.result === 'W') d *= 1.5;
        if (gameState.report.homeMatch) d *= 1.4;
        const sold = Math.min(m.stock[id], Math.floor(d) + (Math.random() < d % 1 ? 1 : 0));
        if (sold <= 0) return;
        m.stock[id] -= sold;
        m.soldTotal += sold;
        income += sold * Engine.merchPrice(id);
        parts.push(item.label + ' ×' + sold);
      });
      if (income > 0) {
        Engine.money('Sklepik fanowski', income);
        Engine.addLog('🛍️ Sklepik: ' + parts.join(', ') + ' → ' + Utils.formatMoney(income) + '.', 'finance');
      }
    },
    function sponsorIncome() {
      // Gmina dokłada do sportu zawsze – mało, ale regularnie (wyżej: miasto, województwo)
      Engine.money('Dotacja gminna na sport', Math.round(CONFIG.municipalGrant * Selectors.econ()));
      const s = gameState.sponsor;
      if (!s.active) return;
      const sp = DATA.sponsors[s.active];
      if (sp.breaks(gameState)) { Engine.endSponsor('❌ ' + sp.breakLog); return; }
      Engine.money('Sponsor: ' + sp.name, Selectors.sponsorWeekly(sp));
      Engine.addLog('💼 Sponsor „' + sp.name + '”: ' + Utils.formatMoney(Selectors.sponsorWeekly(sp)) + ' wpłynęło na konto (a raczej przyszło w kopercie).', 'finance');
    },
    function payroll() {
      const players = Selectors.squadWages();
      const coach = Selectors.coachWeekly();
      const staff = Selectors.staffWages();
      Engine.money('Zawodnicy (paliwo, skrzynki, stypendia)', -players);
      Engine.money('Pensja trenera', -coach);
      Engine.money('Sztab pomocniczy', -staff);
      Engine.addLog('💵 Wypłaty: zawodnicy ' + Utils.formatMoney(players) + (coach ? ', trener ' + Utils.formatMoney(coach) : '') + (staff ? ', sztab ' + Utils.formatMoney(staff) : '') + '. Koperty rozdawał pan Rysiek w szatni.', 'finance');
    },
    function loansTick() {
      const L = gameState.loans;
      L.taken.forEach((loan) => {
        const lender = DATA.lenders[loan.id];
        if (gameState.finance.budget < loan.rate) Engine.addScandal(lender.name + ' rozpowiada po wsi, że klub nie ma na raty');
        Engine.money('Rata: ' + lender.name, -loan.rate);
        loan.remaining--;
        if (loan.remaining === 0) Engine.addLog('✅ Spłacono ostatnią ratę – ' + lender.name + '. Na pożegnanie postawił flaszkę.', 'finance');
      });
      L.taken = L.taken.filter((l) => l.remaining > 0);

      L.given = L.given.filter((loan) => {
        if (gameState.calendar.week < loan.dueWeek) return true;
        const b = DATA.borrowers[loan.id];
        if (Math.random() >= loan.risk) {
          Engine.money('Zwrot pożyczki: ' + b.name, loan.returns);
          Engine.addLog('💰 ' + b.name + ' oddał ' + Utils.formatMoney(loan.returns) + '. Z procentem! Cuda się zdarzają.', 'finance');
          return false;
        }
        loan.delays++;
        if (loan.delays >= 3) {
          const half = Math.round(DATA.borrowers[loan.id].amount / 2);
          Engine.money('Odzysk długu: ' + b.name, half);
          Engine.addLog('🥔 ' + b.name + ' w końcu „rozliczył się”: ' + Utils.formatMoney(half) + ' i worek ziemniaków. Reszta przepadła.', 'finance');
          return false;
        }
        loan.dueWeek += 2;
        loan.risk = Math.min(0.9, loan.risk + 0.15);
        Engine.addLog('🙄 ' + b.name + ' ' + Utils.rand(DATA.debtorExcuses) + ' Nowy termin: Tydzień ' + loan.dueWeek + '.', 'event');
        return true;
      });
    },
    function fixedCosts() {
      const e = Selectors.econ();
      const lime = Math.round(Utils.randInt(15, 25) * e * (gameState.club.character === 'rural' ? 0.8 : 1)), power = Math.round(Utils.randInt(20, 35) * e), laundry = Math.round(Utils.randInt(25, 40) * e);
      Engine.money('Koszty stałe (wapno, prąd, pranie)', -(lime + power + laundry));
      Engine.addLog('🧾 Koszty stałe: wapno do linii ' + lime + ' zł, prąd w blaszaku ' + power + ' zł, pranie strojów u pani Krysi ' + laundry + ' zł.', 'finance');
    },
    function stadiumUpkeep() {
      gameState.stadium.pitch = Utils.clamp(gameState.stadium.pitch + (gameState.stadium.upgrades.roller ? 6 : 3), 0, 100);
    },
    function squadTopUp() {
      // Za mało ludzi? Trener łapie kogoś spod sklepu.
      while (gameState.squad.length < CONFIG.minSquad) {
        const p = Engine.generatePlayer({ ageMin: 18, ageMax: 34, skillMin: 2 + Selectors.levelSkillBonus(), skillMax: 4 + Selectors.levelSkillBonus(), wageMin: 5, wageMax: Math.round(10 * Selectors.econ()) });
        Engine.addLog('🙋 Z łapanki spod sklepu: ' + Selectors.playerName(p) + ' (' + p.age + ' l.). „Grałem kiedyś w trampkarzach, to się nada.”', 'event');
      }
    },
    function moraleDrift() {
      const drift = (v, target) => (v < target ? v + 1 : v > target ? v - 1 : v);
      gameState.morale.lockerRoom = drift(gameState.morale.lockerRoom, Selectors.lockerBaseline());
      gameState.morale.fans = drift(gameState.morale.fans, 50);
    },
    function debts() {
      Engine.debtCheck();
    },
    function closeReport() {
      const rep = gameState.report;
      rep.total = rep.lines.reduce((sum, l) => sum + l.amount, 0);
      rep.budgetAfter = gameState.finance.budget;
      Engine.addLog('📊 Bilans tygodnia: ' + Utils.signedMoney(rep.total) + '. Stan konta: ' + Utils.formatMoney(rep.budgetAfter) + '.', 'summary');
      if (gameState.finance.budget < 0) Engine.addLog('⚠️ Konto na minusie! Pani z Banku Spółdzielczego dzwoni trzeci raz. Prezes udaje, że nie ma zasięgu.', 'event');
      gameState.lastReport = rep;
      gameState.report = null;
    },
    function advanceCalendar() {
      gameState.calendar.week += 1;
      gameState.weather = Utils.rand(DATA.weather);
    },
    function scoutReturn() {
      const sc = gameState.scouting;
      if (sc.missionReturnWeek && gameState.calendar.week >= sc.missionReturnWeek) Engine.scoutReport();
    },
    function scheduleDecisions() {
      if (!Selectors.isMatchWeek()) return;
      if (gameState.calendar.round % CONFIG.roundsPerRunda === 0) Engine.offerSeasonTickets();
      const fx = Selectors.currentFixture();
      if (fx.home && Selectors.rival(fx.rival).derby && !gameState.stadium.upgrades.monitoring) Engine.pushDecision('derbySecurity');
      Engine.maybeLockerCall();
      Engine.maybePassat();
      Engine.maybeBalance();
    },
  ],

  nextWeek() {
    if (!Engine.canAdvanceWeek()) return false;
    Engine.weeklyHooks.forEach((hook) => { if (gameState.screen === 'game') hook(); });
    Engine.checkGameOver();
    return true;
  },
};

/* Selektory – obliczenia pochodne od stanu (bez modyfikacji) */
const Selectors = {
  leagueName: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).name,
  econ: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).econ,
  levelSkillBonus: () => (DATA.leagueLevels[gameState.club.leagueLevel] || DATA.leagueLevels[1]).skillBonus,
  sponsorWeekly: (sp) => Math.round(sp.weekly * Selectors.econ()),
  coachOffer: (co) => ({ sign: Math.round(co.sign * Selectors.econ()), weekly: Math.round(co.weekly * Selectors.econ()) }),
  coachWeekly: () => (gameState.coach.id === 'mirek' ? 0 : (gameState.coach.weekly || Selectors.coach().weekly)),
  scoutTier: () => DATA.scoutTiers[gameState.scouting.tier] || DATA.scoutTiers[0],
  raiseAmount: () => Math.max(15, Math.round(15 * Selectors.econ() / 5) * 5),
  passatSellAmount: () => Math.round(1200 * Selectors.econ() / 100) * 100,
  passatBuyAmount: () => Math.round(800 * Selectors.econ() / 100) * 100,
  aferaRisk: () => (gameState.club.professionalism < -50 ? 0.75 : 0.25),   // „pod lupą” prokuratury
  underInvestigation: () => gameState.club.professionalism < -50,
  fetaCost: (base) => Math.round(base * Selectors.econ() / 10) * 10,
  lifelineAmount: (base) => Math.round(base * Selectors.econ() / 100) * 100,
  brakeAmount: (base) => Math.round(base * Selectors.econ() / 10) * 10,
  debtThresholds: () => {
    const e = Selectors.econ();
    return { warn: CONFIG.debtWarn * e, bailiff: CONFIG.debtBailiff * e, gameOver: CONFIG.debtGameOver * e };
  },
  licenseMissing: (level) => {
    const up = gameState.stadium.upgrades;
    const miss = [];
    if (level === 2 && !up.boiler && !up.roller) miss.push('Bojler albo Walec');
    if (level >= 3) {
      if (!up.boiler) miss.push(DATA.upgrades.boiler.label);
      if (!up.roller) miss.push(DATA.upgrades.roller.label);
    }
    Object.keys(DATA.upgrades).forEach((id) => {
      const u = DATA.upgrades[id];
      if (u.licenseLevel && level >= u.licenseLevel && !up[id]) miss.push(u.label);
    });
    return miss;
  },
  isMatchWeek: () => gameState.calendar.week > CONFIG.preseasonWeeks,
  fixtureAt: (roundIdx) => {
    const round = gameState.season.rounds[roundIdx];
    if (!round) return null;
    const f = round.find((x) => x.home === US || x.away === US);
    return { rival: f.home === US ? f.away : f.home, home: f.home === US };
  },
  currentFixture: () => Selectors.fixtureAt(gameState.calendar.round),
  rival: (name) => gameState.league.rivals.find((r) => r.name === name) || DATA.rivals.find((r) => r.name === name) || { name, strength: 1.3, derby: false },
  teamName: (id) => (id === US ? Selectors.clubDisplayName() : id),
  coach: () => DATA.coaches[gameState.coach.id] || DATA.coaches.mirek,
  sponsor: () => (gameState.sponsor.active ? DATA.sponsors[gameState.sponsor.active] : null),
  playerName: (p) => p.first + ' „' + p.nick + '” ' + p.last,
  clubDisplayName: () => {
    const sp = Selectors.sponsor();
    return sp && sp.clubPrefix ? sp.clubPrefix + ' ' + gameState.club.name : gameState.club.name;
  },
  stadiumName: () => {
    const sp = Selectors.sponsor();
    return sp && sp.stadiumName ? sp.stadiumName : gameState.stadium.baseName;
  },
  standings: () => Object.entries(gameState.season.table)
    .map(([team, r]) => ({ team, ...r }))
    .sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf),
  ourPosition: () => Selectors.standings().findIndex((r) => r.team === US) + 1,
  squadWages: () => gameState.squad.reduce((s, p) => s + p.wage, 0),
  staffWages: () => Object.values(gameState.staff).reduce((s, m) => s + (m ? m.wage : 0), 0),
  weeklyPayroll: () => Selectors.squadWages() + Selectors.coachWeekly() + Selectors.staffWages(),
  lockerBaseline: () => {
    const legends = gameState.squad.filter((p) => p.legend).length;
    const leaders = gameState.squad.filter((p) => p.tag === 'leader').length;
    const staff = Object.values(gameState.staff).reduce((s, m) => s + (m ? m.lockerBase : 0), 0);
    const boiler = gameState.stadium.upgrades.boiler ? 10 : 0;

  dnaLabel: () => {

/* ---------------------------------------------------------------------
   4. ZAPIS GRY (localStorage)
   --------------------------------------------------------------------- */
const Storage = {
  KEY: 'bklasa-prezes-save',

  save() {
    if (gameState.screen !== 'game') return;
    try { localStorage.setItem(Storage.KEY, JSON.stringify(gameState)); } catch (e) { /* brak miejsca / tryb prywatny */ }
  },

  load() {
    try {
      const raw = localStorage.getItem(Storage.KEY);
      if (!raw) return null;
      return Storage.migrate(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  },

  clear() {
    try { localStorage.removeItem(Storage.KEY); } catch (e) { /* ignorujemy */ }
  },

  // Nowe pola z createInitialState trafiają do starych zapisów automatycznie.
  migrate(saved) {
    const merge = (def, src) => {
      if (src === undefined) return def;
      if (def && typeof def === 'object' && !Array.isArray(def) && src && typeof src === 'object' && !Array.isArray(src)) {
        const out = { ...def };
        Object.keys(src).forEach((k) => { out[k] = merge(def[k], src[k]); });
        return out;
      }
      return src;
    };
    const oldVersion = saved.version || 1;
    const state = merge(createInitialState(), saved);
    state.version = CONFIG.saveVersion;
    state.ui.startError = '';
    if (!state.weather) state.weather = DATA.weather[1];
    if (!state.club.town) {
      const words = String(state.club.name || '').trim().split(/\s+/);
      state.club.town = words.length > 1 ? words.slice(1).join(' ') : (words[0] || 'Gmina');
    }
    if (oldVersion < 3 || !state.season.rounds || !state.season.rounds.length) {
      // Reforma ligi (10 drużyn): nowy terminarz od 1. kolejki.
      delete state.season.schedule;
      const prev = gameState; gameState = state;
      state.calendar.round = 0;
      Engine.newSeason();
      Engine.addLog('📠 Związek przysłał faksem nowy terminarz: liga rozszerzona do 10 drużyn, sezon liczy się od nowa. Kadra i sztab czekają w nowych zakładkach.', 'system');
      gameState = prev;
    }
    return state;
  },
};

const UI = {

  _uid: 0,                   // unikalne id dla clipPath w herbach SVG

  // Wspólne klasy kart
  CARD: 'bg-slate-800/70 border border-slate-700/80 rounded-xl shadow-lg shadow-black/20',

    UI._uid = 0;
    const screen = gameState.screen;
    UI.applyTheme(screen === 'start' ? gameState.ui.form.colors : gameState.club.colors);
    UI.root().innerHTML = screen === 'start' ? UI.startScreen()
      : screen === 'gameover' ? UI.gameOverScreen()
      : UI.gameScreen();
  },

  // Zostawione dla zgodności (nasłuch resize) – pływający przycisk nie potrzebuje przeliczeń.
  fitActionBar() {},

  /* ---------- Motyw: barwy klubu jako akcenty interfejsu ---------- */
  theme(colorsId) {
    const c = DATA.clubColors[colorsId] || { c1: '#10b981', c2: '#f59e0b' };
    const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const lum = (hex) => {
      const [r, g, b] = rgb(hex).map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    };
    const sat = (hex) => { const v = rgb(hex); return Math.max(...v) - Math.min(...v); };
    const usable = (hex) => lum(hex) > 0.02 && lum(hex) < 0.8 && sat(hex) > 0.2;   // bez bieli i czerni
    const pick = [c.c1, c.c2].filter(usable);
    const accent = pick.length ? pick[0] : c.c1;
    const accent2 = accent === c.c1 ? c.c2 : c.c1;
    const mix = (hex, t) => '#' + rgb(hex).map((v) => Math.round((v + (1 - v) * t) * 255).toString(16).padStart(2, '0')).join('');
    return {
      c1: c.c1, c2: c.c2, accent, accent2,
      accentText: lum(accent) < 0.2 ? mix(accent, 0.45) : accent,
      onAccent: lum(accent) > 0.4 ? '#0f172a' : '#ffffff',
    };
  },

  applyTheme(colorsId) {
    const t = UI.theme(colorsId);
    const st = document.documentElement.style;
    st.setProperty('--c1', t.c1); st.setProperty('--c2', t.c2);
    st.setProperty('--accent', t.accent); st.setProperty('--accent2', t.accent2);
    st.setProperty('--accent-text', t.accentText); st.setProperty('--on-accent', t.onAccent);
  },

  initials(name) {
    const words = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return '?';
    if (/^[A-ZĄĆĘŁŃÓŚŹŻ]{2,4}$/.test(words[0])) return words[0];
