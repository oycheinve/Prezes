    return `<h4 class="text-[11px] uppercase tracking-wide font-semibold text-ink-700 mt-2 mb-1">${text}</h4>`;
  },

  choice(action, value, active, title, desc) {
    return `
    <button data-action="${action}" data-value="${value}"
      class="btn-press w-full min-w-0 text-left px-2 py-1.5 border rounded-lg ${active ? 'border-amber-glow bg-amber-glow/15' : 'border-paper-300 bg-white'}">
      <span class="block text-[12px] leading-tight ${active ? 'font-bold' : 'font-semibold'}">${title}</span>
      ${desc ? `<span class="block text-[10.5px] leading-snug text-ink-700 mt-0.5">${desc}</span>` : ''}
    </button>`;
  },

  // Kafelki wyboru w jednym rzędzie; pełny opis tylko dla aktywnej opcji
  choiceRow(action, entries, current, title, desc) {
    const active = entries.find(([id]) => id === current);
    return `
      <div class="grid gap-1.5" style="grid-template-columns:repeat(${entries.length},minmax(0,1fr))">
        ${entries.map(([id, x]) => UI.choice(action, id, id === current, title(x, id), '')).join('')}
      </div>
      ${active ? `<p class="text-[11px] text-ink-700 leading-snug mt-1">${desc(active[1], active[0])}</p>` : ''}`;
  },

  smallBtn(action, attrs, label, disabled, variant = 'ink') {
    const colors = variant === 'stamp'
      ? 'bg-stamp text-paper-100 hover:bg-red-700'
      : 'bg-ink-900 text-paper-100 hover:bg-ink-700';
    return `<button data-action="${action}" ${attrs} ${disabled ? 'disabled' : ''}
      class="btn-press h-8 px-2.5 text-[12px] font-semibold rounded-md whitespace-nowrap ${disabled ? 'bg-paper-300 text-ink-700 opacity-60 cursor-not-allowed' : colors}">${label}</button>`;
  },

  bar(value, colorClass) {
    return `<div class="h-1 rounded-full bg-paper-300 mt-1 overflow-hidden"><div class="h-full rounded-full ${colorClass}" style="width:${Utils.clamp(value, 0, 100)}%"></div></div>`;
  },

  profileBadge(profile) {
    const pr = DATA.profiles[profile];
    const tone = { off: 'bg-rose-600 text-white', def: 'bg-sky-700 text-white', uni: 'bg-paper-300 text-ink-900' }[profile];
    return `<span class="inline-block px-1 rounded text-[9.5px] leading-[15px] font-bold ${tone}" title="Pasuje do: ${pr.label}">${pr.short}</span>`;
  },

  ratingBadge(r, prefix = '') {
    const tone = r == null ? 'bg-paper-300 text-ink-700' : r >= 7.5 ? 'bg-grass text-white' : r >= 6 ? 'bg-ink-900 text-paper-100' : r >= 4.5 ? 'bg-amber-400 text-ink-900' : 'bg-stamp text-white';
    return `<span class="inline-block px-1.5 rounded text-[11px] leading-[17px] font-bold whitespace-nowrap ${tone}">${prefix}${Selectors.ratingText(r)}</span>`;
  },

  formDots() {
    return gameState.record.form.map((r) => `<span class="inline-block w-2 h-2 rounded-full mr-0.5 ${{ W: 'bg-grass', D: 'bg-amber-400', L: 'bg-stamp' }[r]}" title="${{ W: 'Wygrana', D: 'Remis', L: 'Porażka' }[r]}"></span>`).join('');
  },

  /* ---------- ZAKŁADKA: BIURKO ---------- */
  deskTab() {
    const pending = gameState.pendingDecisions.length;
    // Jeden widok naraz: sprawy, gdy coś czeka, inaczej pulpit klubu (chyba że gracz wybrał sam).
    const view = gameState.ui.deskView === 'club' || (gameState.ui.deskView !== 'decisions' && !pending) ? 'club' : 'decisions';
    const v = gameState.ui.deskView === 'trophies' ? 'trophies' : view;
    return UI.segs('desk-view', v, [['decisions', '❗ Sprawy' + (pending ? ' (' + pending + ')' : '')], ['club', '🏠 Klub'], ['trophies', '🏆 Gablotka']])
      + (v === 'trophies' ? UI.trophyCabinet() : v === 'decisions' ? UI.decisions() : UI.clubDashboard());
  },

  // Jedna sprawa naraz – mieści się na ekranie razem z odpowiedziami
  decisions() {
    const pending = gameState.pendingDecisions;
    if (pending.length === 0) {
      return UI.panel('Biurko puste.', 'Tylko kubek z napisem „Najlepszy Dziadek” i pieczątka klubowa bez tuszu.',
        `<button data-action="desk-view" data-value="club" class="btn-press w-full h-9 mt-1 rounded-md bg-ink-900 text-paper-100 text-[13px] font-semibold">🏠 Pulpit klubu</button>`);
    }
    const d = DATA.decisions[pending[0]];
    const opts = d.options.map((o, i) => (o.show && !o.show() ? '' : `
      <button data-action="resolve-decision" data-decision="${d.id}" data-option="${i}"
        class="btn-press w-full min-w-0 text-left px-3 py-2 bg-white active:bg-paper-300 border border-paper-300 rounded-lg [overflow-wrap:anywhere]">
        <span class="text-[13.5px] font-semibold block leading-snug">${Utils.escape(Utils.val(o.label))}</span>
        <span class="text-[11px] text-ink-700 leading-snug block">${Utils.escape(Utils.val(o.hint))}</span>
      </button>`)).join('');
    const rest = pending.slice(1).map((id) => Utils.escape(Utils.val(DATA.decisions[id].title))).join(' · ');
    return `
      <article class="paper px-3 py-2.5">
        <div class="flex justify-between gap-2 text-[10.5px] text-ink-700">
          <span class="truncate">Od: ${Utils.escape(Utils.val(d.from))}</span>
          ${pending.length > 1 ? `<span class="whitespace-nowrap font-semibold">1 / ${pending.length}</span>` : ''}
        </div>
        <div class="text-[10.5px] text-ink-700 truncate">Do: ${Utils.escape(Selectors.presName())}, ${Utils.escape(Selectors.clubDisplayName())}</div>
        <h3 class="text-[16px] font-bold leading-tight mt-1 mb-1">${Utils.escape(Utils.val(d.title))}</h3>
        <p class="text-[13px] leading-snug text-ink-700 mb-2">${Utils.escape(Utils.val(d.body))}</p>
        ${d.player ? `<div class="-mt-1 mb-2">${UI.playerCard(d.player())}</div>` : ''}
        <div class="grid gap-1.5">${opts}</div>
      </article>
      ${rest ? `<p class="text-[11px] text-paper-400 mt-1.5 truncate">Dalej czeka: ${rest}</p>` : ''}
      ${d.player ? '' : `<div class="mt-2">${UI.tiles(UI.clubTiles().slice(0, 3))}</div>`}
      ${UI.recentEvents()}`;
  },

  // Kafelki pulpitu: cały klub na jeden rzut oka (pierwsze trzy także pod sprawą na Biurku)
  clubTiles() {
    const s = gameState;
    const rep = s.lastReport;
    const row = s.season.table[US] || { p: 0, w: 0, d: 0, l: 0 };
    const chem = Engine.chemistry(Selectors.projectedLineup());
    const sp = Selectors.sponsor();
    const dna = s.club.professionalism;
    return [
      UI.tile('Pozycja', row.p ? Selectors.ourPosition() + '.' : '–', Selectors.leagueName()),
      UI.tile('Bilans tyg.', rep ? Utils.signedMoney(rep.total) : '–', 'wypłaty ' + Utils.formatMoney(Selectors.weeklyPayroll()), rep ? (rep.total < 0 ? 'text-stamp' : 'text-grass') : ''),
      UI.tile('Mecze W-R-P', row.w + '-' + row.d + '-' + row.l, UI.formDots() || 'jeszcze bez formy'),
      UI.tile('Chemia', chem + '%', Selectors.chemLabel(chem)),
      UI.tile('Kadra', s.squad.length + '/' + CONFIG.maxSquad, 'baza szatni ' + Selectors.lockerBaseline() + '%'),
      UI.tile('Murawa', s.stadium.pitch + '%', Selectors.pitchLabel(s.stadium.pitch)),
      UI.tile('Prognoza', Selectors.seasonPreview().pos + '. msc', '★'.repeat(Selectors.seasonPreview().stars) + '☆'.repeat(5 - Selectors.seasonPreview().stars) + ' media'),
      UI.tile('Sponsor', sp ? Utils.formatMoney(Selectors.sponsorWeekly(sp)) : 'brak', sp ? Utils.escape(sp.name) : 'nikt nie płaci'),
      UI.tile('DNA klubu', (dna > 0 ? '+' : '') + dna, '„' + Utils.escape(Selectors.dnaLabel()) + '”'),
    ];
  },

  u19Tab() {
    const u = gameState.u19;
    if (!u) return UI.panel('Akademia', '', '<p class="text-[12px]">Akademia jeszcze nie ruszyła.</p>');
    const view = UI.sub('u19', 'squad');
    const segs = UI.subSegs('u19', view, [['squad', '👦 Kadra'], ['league', '📊 Tabela'], ['stats', '★ Statystyki'], ['base', '🏗️ Baza']]);
    const budget = gameState.finance.budget;
    const rec = Selectors.u19Lvl('recruiter');
    const st = Selectors.u19Standings();
    const pos = st.findIndex((r) => r.team === Selectors.u19Name()) + 1;
    if (view === 'league') {
      const rows = st.map((r, i) => `<tr class="border-b border-paper-300 last:border-0 ${r.team === Selectors.u19Name() ? 'bg-amber-glow/25 font-bold' : ''}"><td class="py-[3px] pl-1 text-right">${i + 1}.</td><td class="pl-1 max-w-0 w-full truncate">${Utils.escape(r.team)}</td><td class="text-center px-1">${r.p}</td><td class="text-center px-1 whitespace-nowrap">${r.gf}:${r.ga}</td><td class="text-right pr-1.5 font-bold">${r.pts}</td></tr>`).join('');
      return segs + UI.panel('📊 Liga juniorów', u.last ? 'Ostatnio: ' + Utils.escape(Selectors.u19Name()) + ' ' + u.last.gf + ':' + u.last.ga + ' ' + Utils.escape(u.last.opp) : 'Juniorzy grają w każdej kolejce razem z pierwszą drużyną.',
        `<table class="w-full text-[11.5px]"><tr class="text-[10px] uppercase text-ink-700"><th></th><th class="text-left pl-1">Drużyna</th><th>M</th><th>Br</th><th class="text-right pr-1.5">Pkt</th></tr>${rows}</table>`);
    }
    if (view === 'stats') {
      const me = u.table[Selectors.u19Name()] || { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
      const avgR = (p) => (p.u19RatingN ? p.u19RatingSum / p.u19RatingN : null);
      const scorers = u.squad.filter((p) => p.u19Goals > 0).sort((a, b) => b.u19Goals - a.u19Goals).slice(0, 5);
      const rated = u.squad.filter((p) => avgR(p) != null).sort((a, b) => avgR(b) - avgR(a)).slice(0, 6);
      const dots = (u.form || []).map((r) => `<span class="inline-block w-2 h-2 rounded-full mr-0.5 ${{ W: 'bg-grass', D: 'bg-amber-400', L: 'bg-stamp' }[r]}"></span>`).join('');
      const trend = (p) => { const f = p.u19Form || []; if (f.length < 2) return ''; const d = f[f.length - 1] - f[0]; return d > 0.5 ? ' 📈' : d < -0.5 ? ' 📉' : ''; };
      return segs + UI.tiles([
        UI.tile('Bilans', me.w + '-' + me.d + '-' + me.l, me.p + ' meczów'),
        UI.tile('Bramki', me.gf + ':' + me.ga, me.pts + ' pkt · ' + (pos || '–') + '. miejsce'),
        UI.tile('Forma', dots || '–', u.last ? 'ost. ' + u.last.gf + ':' + u.last.ga : 'brak meczów'),
      ]) + UI.panel('⚽ Strzelcy U19', 'Sezon: gole i asysty · w nawiasie gole łącznie w akademii', scorers.length ? `<table class="w-full text-[12px]">${scorers.map((p, i) => `<tr class="border-b border-paper-300 last:border-0"><td class="py-1 w-5 text-ink-700">${i + 1}.</td><td class="max-w-0 w-full truncate"><b>${Utils.escape(Selectors.shortName(p))}</b> <span class="text-[10.5px] text-ink-700">${p.age} l.</span></td><td class="text-right font-bold">${p.u19Goals}</td><td class="text-right pl-2 whitespace-nowrap">${p.u19Assists || 0} as.</td><td class="text-right pl-2 text-ink-700">(${p.u19GoalsTotal || 0})</td></tr>`).join('')}</table>` : '<p class="text-[12px] text-ink-700">Jeszcze nikt nie strzelił.</p>')
        + UI.panel('⭐ Noty i forma przed 19. urodzinami', 'Średnia nota w sezonie · mecze · trend', rated.length ? `<table class="w-full text-[12px]">${rated.map((p) => `<tr class="border-b border-paper-300 last:border-0"><td class="py-1 max-w-0 w-full truncate">${p.talent ? '💎 ' : ''}${Utils.escape(Selectors.shortName(p))} <span class="text-[10.5px] text-ink-700">${p.age} l.${p.age >= 18 ? ' · ostatni rok' : ''}</span></td><td class="text-right text-ink-700 px-1">${p.u19RatingN}</td><td class="text-right pl-1 whitespace-nowrap">${UI.ratingBadge(Math.round(avgR(p) * 10) / 10)}${trend(p)}</td></tr>`).join('')}</table>` : '<p class="text-[12px] text-ink-700">Brak not – liga juniorów jeszcze nie ruszyła.</p>');
    }
    if (view === 'base') {
      const folds = gameState.ui.folds || {};
      const al = Selectors.academyLevel();
      const baseRows = DATA.academyLevels.map((a, i) => i === 0 ? '' : UI.row(`${i <= al ? '✅ ' : ''}${Utils.escape(a.name)} <span class="font-normal text-ink-700">– ${Utils.formatMoney(a.cost)}</span>`,
        'nabór ' + a.cands + '/sezon · sufit +' + a.room + ' · 💎 ' + Math.round(a.talent * 100) + '%',
        i <= al ? '<span class="text-[11px] font-bold text-grass">STOI</span>' : i === al + 1 ? UI.smallBtn('build-academy', '', 'Buduj', budget < a.cost) : '<span class="text-[11px] text-ink-700">później</span>', '', true)).join('');
      const staffGroup = (role, title, effect) => {
        const cur = u[role];
        const rows = DATA.u19Staff[role].map((c, i) => UI.row(Utils.escape(c.name), 'poziom ' + c.level + ' · ' + Utils.formatMoney(Math.round(c.wage * Selectors.econ())) + '/tydz.',
          cur && cur.name === c.name ? UI.smallBtn('fire-u19', `data-role="${role}"`, 'Zwolnij', false, 'stamp') : UI.smallBtn('hire-u19', `data-role="${role}" data-idx="${i}"`, 'Zatrudnij', false), '', true)).join('');
        return `<details data-fold="u19-${role}" class="mt-1.5" ${folds['u19-' + role] ? 'open' : ''}>
          <summary class="flex items-center justify-between h-9 px-2 rounded-md bg-paper-200 text-[12.5px] font-semibold cursor-pointer select-none"><span>${title}</span><span class="flex items-center gap-2"><span class="text-[11px] text-ink-700 truncate max-w-[130px]">${cur ? 'poz. ' + cur.level : 'wakat'}</span><span class="fold-chevron text-ink-700">⌄</span></span></summary>
          <p class="text-[10.5px] text-ink-700 px-1 mt-1">${effect}</p>${rows}</details>`;
      };
      return segs + UI.panel('🏗️ Baza i sztab akademii', '', `
        <details data-fold="u19-base" class="mt-0.5" ${folds['u19-base'] ? 'open' : ''}>
          <summary class="flex items-center justify-between h-9 px-2 rounded-md bg-paper-200 text-[12.5px] font-semibold cursor-pointer select-none"><span>🏟️ Baza treningowa U19</span><span class="flex items-center gap-2"><span class="text-[11px] text-ink-700">poziom ${al}/${DATA.academyLevels.length - 1}</span><span class="fold-chevron text-ink-700">⌄</span></span></summary>
          ${baseRows}
        </details>
        ${staffGroup('coach', '🧑‍🏫 Trener juniorów', 'Szybszy rozwój juniorów i lepsze wyniki U19.')}
        ${staffGroup('recruiter', '🔭 Rekruter talentów', 'Większy nabór i więcej perełek; ostrzega, gdy łowcy z innych klubów obserwują naszych juniorów (bez niego dowiesz się dopiero po fakcie).')}`);
    }
    const rows = u.squad.slice().sort((a, b) => b.age - a.age || b.skill - a.skill).map((p) => {
      const gem = Selectors.isGem(p);
      const flags = (p.talent ? ' 💎' : '') + (p.secured ? ' 🔒' : '') + (p.watch && rec ? ' 👀' : '');
      const action = p.secured ? '<span class="text-[10.5px] text-grass font-bold">UMOWA</span>'
        : (p.age >= 17 || gem ? `<button data-action="u19-secure" data-id="${p.id}" ${budget < Selectors.secureCost(p) ? 'disabled' : ''} class="btn-press h-6 px-2 rounded-md text-[11px] font-bold whitespace-nowrap ${budget < Selectors.secureCost(p) ? 'bg-paper-300 text-ink-700 opacity-60' : 'bg-ink-900 text-paper-100'}">🔒 ${Utils.formatMoney(Selectors.secureCost(p))}</button>` : '');
      return `<div class="flex items-center gap-1.5 py-[2px] border-b border-paper-300 last:border-0">
        ${UI.ovrBadge(p)}
        <div class="min-w-0 flex-1"><div class="text-[12px] font-bold truncate leading-tight">${Utils.escape(Selectors.shortName(p))}${flags}</div>
        <div class="text-[10px] text-ink-700 truncate leading-tight">${DATA.positions[p.pos].icon} ${p.age} l. · sufit ${UI.potentialText(p)}${gem && !p.secured && p.age >= 17 ? ' · <b class="text-stamp">perełka bez umowy</b>' : ''}</div></div>
        ${action}
      </div>`;
    }).join('');
    return segs + UI.panel('🌱 ' + Utils.escape(Selectors.u19Name()), (pos ? pos + '. miejsce w lidze juniorów · ' : '') + u.squad.length + ' juniorów · w wieku 19 lat decyzja: pierwsza drużyna albo do widzenia',
      rows || '<p class="text-[12px] italic">Akademia pusta.</p>')
      + (gameState.squad.some((p) => p.exiled) ? `<p class="text-[10.5px] text-amber-glow leading-snug truncate">⬇️ Zesłani karnie do końca sezonu: ${gameState.squad.filter((p) => p.exiled).map((p) => Utils.escape(Selectors.shortName(p))).join(', ')}</p>` : '')
      + ((gameState.u19Loans || []).length ? `<p class="text-[10.5px] text-paper-300 leading-snug truncate">📤 Na wypożyczeniu: ${gameState.u19Loans.map((l) => Utils.escape(Selectors.shortName(l.player)) + ' → ' + Utils.escape(l.club)).join(', ')}</p>` : '')
      + (u.squad.length > 14 ? '' : `<p class="text-[10.5px] text-paper-400 leading-snug">🔒 Niezabezpieczone perełki mogą zostać podkradzione po okienku transferowym.${rec ? '' : ' Bez rekrutera nie zobaczysz, kto obserwuje naszych juniorów.'}</p>`);
  },

  // Gablotka: wszystkie trofea w historii klubu + bieżąca edycja Pucharu Polski
  // Trofeum jako grafika: puchar inny dla każdego szczebla, medal za awans, Puchar Polski i europejskie
  trophyArt(t) {
    const name = t.name || '';
    const lvlOf = (s) => { const i = DATA.leagueLevels.findIndex((L) => L && s.includes(L.name)); return i > 0 ? i : 0; };
    const kind = t.kind || (name.startsWith('Awans') ? 'medal' : name === 'Puchar Polski' ? 'pp' : name.startsWith('Mistrzostwo Polski') ? 'title' : name.startsWith('Mistrzostwo') ? 'title' : name.startsWith('Puchar ') ? 'euro' : 'title');
    const lvl = t.kind ? (t.lvl || 1) : name.startsWith('Mistrzostwo Polski') ? 8 : lvlOf(name) || 1;
    // metal: brąz → srebro → złoto; Ekstraklasa z biało-czerwoną wstęgą
    const M = [null, ['#c98a4b', '#7a4a1f'], ['#d9dee4', '#8b95a1'], ['#7fc8a0', '#2f6f4c'], ['#9cc3ff', '#3d5f97'], ['#e8b86b', '#8a5a1c'], ['#f2d36b', '#9a7a14'], ['#ffe27a', '#a97f00'], ['#ffe9a0', '#b8860b']][Utils.clamp(lvl, 1, 8)];
    const g = 'g' + Math.random().toString(36).slice(2, 7);
    const grad = (a, b) => `<defs><linearGradient id="${g}" x1="0" x2="1"><stop offset="0" stop-color="${b}"/><stop offset=".45" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`;
    if (kind === 'medal') {
      const roman = ['', 'B', 'A', 'KO', 'IV', 'III', 'II', 'I', 'E'][Utils.clamp(lvl, 1, 8)];
      return `<svg viewBox="0 0 40 50" width="38" height="48">${grad(M[0], M[1])}<path d="M10 0h8l4 16h-8zM30 0h-8l-4 16h8z" fill="${lvl >= 8 ? '#d23c3c' : lvl >= 5 ? '#1e4fa3' : '#2f8f4c'}"/><path d="M14 0h3l3 14h-3z" fill="#fff" opacity=".8"/><circle cx="20" cy="32" r="13" fill="url(#${g})" stroke="${M[1]}" stroke-width="1.5"/><circle cx="20" cy="32" r="9.5" fill="none" stroke="${M[1]}" stroke-width=".8" stroke-dasharray="2 1.5"/><text x="20" y="35.5" text-anchor="middle" font-size="${roman.length > 2 ? 7.5 : 9.5}" font-weight="800" fill="${M[1]}">${roman}</text></svg>`;
    }
    if (kind === 'pp') return `<svg viewBox="0 0 40 50" width="38" height="48">${grad('#f4f1ff', '#7a6fb0')}<path d="M8 6h24c0 12-4 20-12 22C12 26 8 18 8 6z" fill="url(#${g})" stroke="#5a4f90"/><path d="M8 9C2 9 2 19 10 20M32 9c6 0 6 10-2 11" fill="none" stroke="#7a6fb0" stroke-width="2"/><path d="M17 28h6v9h-6z" fill="#7a6fb0"/><path d="M11 37h18v6H11z" fill="#3b2f73"/><path d="M14 13l6-4 6 4-6 8z" fill="#d23c3c" opacity=".85"/><rect x="11" y="44" width="18" height="3" fill="#2a2155"/></svg>`;
    if (kind === 'euro') return `<svg viewBox="0 0 40 50" width="38" height="48">${grad('#e6f0ff', '#6a86b8')}<path d="M10 4h20l-2 16c-1 6-4 9-8 9s-7-3-8-9z" fill="url(#${g})" stroke="#4a6696"/><path d="M10 6C1 6 3 22 12 21M30 6c9 0 7 16-2 15" fill="none" stroke="#6a86b8" stroke-width="2.4"/><path d="M17 29h6v8h-6z" fill="#6a86b8"/><path d="M10 37h20v8H10z" fill="#1d2f57"/><text x="20" y="18" text-anchor="middle" font-size="9" fill="#ffd54a">★</text></svg>`;
    // puchar mistrzowski: kształt zależny od szczebla
    const shapes = {
      1: `<path d="M12 10h16l-2 10c-1 4-3 6-6 6s-5-2-6-6z" fill="url(#${g})" stroke="${M[1]}"/><path d="M18 26h4v8h-4z" fill="${M[1]}"/><path d="M13 34h14v6H13z" fill="#5a3a1a"/>`,
      2: `<path d="M10 8h20l-3 13c-1 4-4 6-7 6s-6-2-7-6z" fill="url(#${g})" stroke="${M[1]}"/><path d="M10 11c-5 0-5 8 2 8M30 11c5 0 5 8-2 8" fill="none" stroke="${M[1]}" stroke-width="1.8"/><path d="M18 27h4v8h-4z" fill="${M[1]}"/><path d="M12 35h16v6H12z" fill="#3a3f47"/>`,
      3: `<path d="M9 9h22c0 9-4 17-11 18C13 26 9 18 9 9z" fill="url(#${g})" stroke="${M[1]}"/><path d="M9 11c-6 0-5 10 3 9M31 11c6 0 5 10-3 9" fill="none" stroke="${M[1]}" stroke-width="2"/><path d="M18 27h4v7h-4z" fill="${M[1]}"/><path d="M11 34h18v7H11z" fill="#1f3d2c"/>`,
      4: `<path d="M13 4h14l-1 6h-12z" fill="${M[1]}"/><path d="M11 10h18l-2 12c-1 4-4 6-7 6s-6-2-7-6z" fill="url(#${g})" stroke="${M[1]}"/><path d="M18 28h4v7h-4z" fill="${M[1]}"/><path d="M11 35h18v7H11z" fill="#1f2d4a"/>`,
      5: `<ellipse cx="20" cy="9" rx="12" ry="3" fill="${M[1]}"/><path d="M8 9h24l-4 14c-1 4-4 5-8 5s-7-1-8-5z" fill="url(#${g})" stroke="${M[1]}"/><path d="M8 11c-6 1-4 9 2 9M32 11c6 1 4 9-2 9" fill="none" stroke="${M[1]}" stroke-width="2"/><path d="M17 28h6v6h-6z" fill="${M[1]}"/><path d="M10 34h20v8H10z" fill="#4a2f12"/>`,

      7: `<circle cx="20" cy="4" r="2.5" fill="${M[1]}"/><path d="M11 6h18l-1 4H12z" fill="${M[1]}"/><path d="M8 10h24l-3 13c-1 5-5 7-9 7s-8-2-9-7z" fill="url(#${g})" stroke="${M[1]}"/><path d="M8 12C0 12 1 25 10 24M32 12c8 0 7 13-2 12" fill="none" stroke="${M[1]}" stroke-width="2.4"/><path d="M17 30h6v5h-6z" fill="${M[1]}"/><path d="M8 35h24v8H8z" fill="#1b1b1b"/><path d="M8 38h24v2H8z" fill="${M[0]}" opacity=".7"/>`,

  },

  trophyCabinet() {
    const all = (gameState.trophies || []).slice().reverse();
    const shown = all.slice(0, 12);
    const count = (pred) => all.filter(pred).length;
    const cup = gameState.cup;
    const cupLine = cup && cup.season === gameState.calendar.season
      ? (cup.won ? '🏆 Zdobyty w tym sezonie!' : cup.alive ? 'W grze · następna runda: <b>' + DATA.cupRounds[cup.idx].label + '</b>' : 'Odpadliśmy: ' + Utils.escape(cup.history[0] || ''))
      : 'Nowa edycja wystartuje z sezonem.';
    const tiles = shown.map((t) => `
      <div class="rounded-lg bg-gradient-to-b from-paper-100 to-paper-300 border border-paper-300 px-1.5 pt-1.5 pb-1 text-center">
        <div class="h-[50px] flex items-end justify-center">${UI.trophyArt(t)}</div>
        <div class="text-[10px] font-bold leading-tight mt-0.5 line-clamp-2">${Utils.escape(t.name.replace('Mistrzostwo: ', 'Mistrz ').replace('Awans do: ', 'Awans: '))}</div>
        <div class="text-[10px] text-ink-700">sezon ${t.season}</div>
      </div>`).join('');
    return UI.tiles([
      UI.tile('Puchary Polski', String(count((t) => t.name === 'Puchar Polski')), 'w gablotce'),
      UI.tile('Mistrzostwa', String(count((t) => t.name.startsWith('Mistrzostwo'))), 'wszystkie szczeble'),
      UI.tile('Awanse', String(count((t) => t.name.startsWith('Awans'))), 'medale za awans'),
    ]) + UI.panel('🏆 Gablotka w gabinecie prezesa', 'Każde trofeum zostaje tu na zawsze. Pani Halinka przeciera je co piątek.',
      (tiles ? `<div class="grid grid-cols-4 gap-1">${tiles}</div>${all.length > 12 ? '<p class="text-[10.5px] text-ink-700 mt-1">…i ' + (all.length - 12) + ' starszych trofeów na zapleczu.</p>' : ''}` : '<p class="text-[12px] italic text-ink-700">Gablotka pusta. Na razie stoi w niej tylko proporczyk z turnieju halowego z 1987 roku.</p>'))
      + UI.panel('🏆 Puchar Polski · sezon ' + gameState.calendar.season, '', `<p class="text-[12px] leading-snug">${cupLine}</p>${cup && cup.history.length ? '<ul class="text-[11.5px] text-ink-700 mt-1 space-y-0.5">' + cup.history.slice(0, 3).map((x) => '<li class="truncate">' + Utils.escape(x) + '</li>').join('') + '</ul>' : ''}`);
  },

  clubDashboard() {
    const s = gameState;
    const fx = Selectors.currentFixture();
    const rival = Selectors.rival(fx.rival);
    const inPre = !Selectors.isMatchWeek();
    const tiles = UI.tiles(UI.clubTiles());
    const match = UI.panel(`${s.weather.icon} ${inPre ? 'Start ligi za ' + (CONFIG.preseasonWeeks + 1 - s.calendar.week) + ' tyg.' : 'Kolejka ' + (s.calendar.round + 1)} · ${fx.home ? 'vs' : '@'} ${Utils.escape(fx.rival)}${rival.derby ? ' <span class="text-stamp">🔥 KOSA</span>' : ''}`, '',
      `<p class="text-[11.5px] text-ink-700">${fx.home ? 'u siebie' : 'wyjazd'}${!inPre && fx.home ? ' · ~' + Engine.estimateAttendance(fx) + ' widzów' : ''} · ${Utils.escape(s.weather.label)}</p>${(() => { const cup = !inPre && Selectors.cupAt(s.calendar.round + 1); return cup && cup.next ? `<p class="text-[11.5px] font-semibold mt-0.5">🏆 W środę Puchar Polski (${Utils.escape(cup.R.label.split(' – ')[0])}): ${cup.next.home || cup.next.final ? 'vs' : '@'} ${Utils.escape(cup.next.opp)}</p>` : ''; })()}`);

    return tiles + match + UI.recentEvents() + `<p class="text-[10.5px] text-grass text-center">💾 Autozapis: Tydzień ${s.calendar.week}</p>`;

  // Ostatnie wydarzenia: jedna linijka na tydzień – wynik meczu i bilans kasy (z wpisów, które zapisuje silnik)
  weekDigest(week) {
    const entries = gameState.log.filter((e) => e.week === week);
    const match = entries.find((e) => e.type === 'match' && e.text.startsWith('⚽'));
    const summary = entries.find((e) => e.type === 'summary' && e.text.includes('Bilans tygodnia'));
    let result = '<span class="text-ink-700">Bez meczu</span>';
    const m = match && match.text.match(/^⚽ Kolejka \d+(?: \(🔥 KOSA\))?: (.+) (\d+):(\d+) (.+?) \((u siebie|wyjazd)/);
    if (m) {
      const home = m[5] === 'u siebie';
      const gf = +(home ? m[2] : m[3]), ga = +(home ? m[3] : m[2]);
      const rival = home ? m[4] : m[1];
      const [label, tone] = gf > ga ? ['Wygrana', 'text-grass'] : gf < ga ? ['Porażka', 'text-stamp'] : ['Remis', 'text-ink-700'];
      result = `<b class="${tone}">${label} ${gf}:${ga}</b> ${home ? 'z' : '@'} ${Utils.escape(rival)}`;
    }
    const cash = summary && summary.text.match(/Bilans tygodnia: (.+?) zł/);
    const money = cash ? `<span class="whitespace-nowrap font-semibold ${cash[1].startsWith('-') ? 'text-stamp' : 'text-grass'}">${Utils.escape(cash[1])} zł</span>` : '<span class="text-ink-700">–</span>';
    return `
      <li class="flex items-center gap-2 h-7 border-b border-paper-300 last:border-0 text-[12px]">
        <span class="w-8 flex-shrink-0 text-[11px] font-bold text-ink-700">T${week}</span>
        <span class="flex-1 min-w-0 truncate">${result}</span>
        <span class="text-[10.5px] text-ink-700">Kasa</span>${money}
      </li>`;
  },

  recentEvents() {
    const weeks = [...new Set(gameState.log.map((e) => e.week))]
      .filter((w) => w < gameState.calendar.week).slice(0, 3);
    if (!weeks.length) return '';
    return UI.panel('Ostatnie wydarzenia', '', `<ul>${weeks.map((w) => UI.weekDigest(w)).join('')}</ul>`);
  },

  /* ---------- ZAKŁADKA: TABELA ---------- */
  tableTab() {
    const view = UI.sub('table', 'table');
    const segs = UI.subSegs('table', view, [['table', '📊 Tabela'], ['fixtures', '📅 Terminarz'], ['stats', '★ Staty'], ['money', '💼 Kasa']].concat(gameState.euro ? [['euro', '🇪🇺 Europa']] : []));
    const pv = Selectors.seasonPreview();
    const bigLeague = Selectors.leagueSize() > 12;
    const title = `<p class="text-[11px] text-paper-400 mb-1">${Selectors.leagueName()} · Sezon ${gameState.calendar.season}${bigLeague ? '' : ' · Wywieszona na drzwiach remizy. Ktoś długopisem dopisał nam 3 punkty – nieważne.'}</p>
      <div class="rounded-lg bg-desk-800 px-2.5 py-1 mb-1 text-[11px] text-paper-200 leading-snug">📰 <b>Prognoza:</b> ${pv.pos}. miejsce · <span class="text-amber-glow">${'★'.repeat(pv.stars)}${'☆'.repeat(5 - pv.stars)}</span> · kurs na awans <b>${pv.odds}</b>${bigLeague ? '' : `<br><span class="italic text-paper-400">${pv.quote}</span>`}</div>`;
    if (view === 'fixtures') return segs + title + UI.fixturesView();
    if (view === 'stats') return segs + UI.teamStatsCard();
    if (view === 'money') return segs + UI.leagueMoneyView();
    if (view === 'euro' && gameState.euro) return segs + UI.euroView();

    const n = Selectors.leagueSize();
    const big = n > 12;
    const zoneEdge = { title: 'border-l-amber-400', up: 'border-l-grass', upPO: 'border-l-sky-500', euro: 'border-l-sky-500', downPO: 'border-l-orange-400', down: 'border-l-stamp', last: 'border-l-stamp' };
    const rows = Selectors.standings().map((r, i) => {
      const us = r.team === US;
      const rival = Selectors.rival(r.team);
      const edge = zoneEdge[Selectors.zoneOf(i + 1, n)] || 'border-l-transparent';
      const py = big ? 'py-[1.5px]' : 'py-[5px]';
      return `
      <tr class="border-b border-paper-300 last:border-0 ${us ? 'bg-amber-glow/25 font-bold' : ''}">
        <td class="${py} pl-1 pr-1 text-right border-l-[3px] ${edge}">${i + 1}.</td>
        <td class="${py} pr-1 max-w-0 w-full truncate">${Utils.escape(Selectors.teamName(r.team))}${rival && rival.derby ? ' <span class="text-stamp">🔥</span>' : ''}</td>
        <td class="text-center px-1">${r.p}</td><td class="text-center px-1 text-ink-700">${r.w}</td><td class="text-center px-1 text-ink-700">${r.d}</td><td class="text-center px-1 text-ink-700">${r.l}</td>
        <td class="text-center px-1 whitespace-nowrap">${r.gf}:${r.ga}</td>
        <td class="text-right pr-1.5 font-bold">${r.pts}</td>
      </tr>`;
    }).join('');
    const lvl = gameState.club.leagueLevel;
    const rl = Selectors.leagueRules();
    const upName = rl.top ? '' : DATA.leagueLevels[lvl + 1].name, downName = lvl > 1 ? DATA.leagueLevels[lvl - 1].name : '';
    const range = (a, b) => (a === b ? a : a + '–' + b);
    const dot = (c) => `<span class="inline-block w-2 h-2 ${c} align-middle"></span>`;
    const legend = [];
    if (rl.top) legend.push(dot('bg-amber-400') + ' 1: Mistrz Polski (el. LM)');
    if (rl.up) legend.push(dot('bg-grass') + ' ' + range(1, rl.up) + ': awans');
    if (rl.upPO.length) legend.push(dot('bg-sky-500') + ' ' + range(rl.upPO[0], rl.upPO[rl.upPO.length - 1]) + ': baraż o awans');
    if (rl.euro.length) legend.push(dot('bg-sky-500') + ' 2: el. LM · 3: el. LE · 4: el. LKE');
    if (rl.downPO) legend.push(dot('bg-orange-400') + ' ' + rl.downPO + ': baraż o utrzymanie');
    if (rl.down) legend.push(dot('bg-stamp') + ' ' + range(n - rl.down + 1, n) + ': spadek' + (downName ? ' (' + downName + ')' : ''));
    if (!rl.down) legend.push(dot('bg-stamp') + ' ' + n + ': wstyd na cały powiat');
    return segs + title + `
      <section class="paper py-0.5 mb-1.5 overflow-hidden">
        <table class="w-full ${big ? 'text-[11px]' : 'text-[12px]'}">
          <tr class="text-[10px] uppercase text-ink-700"><th></th><th class="text-left">Drużyna</th><th>M</th><th>W</th><th>R</th><th>P</th><th>Br</th><th class="text-right pr-1.5">Pkt</th></tr>
          ${rows}
        </table>
      </section>
      <p class="text-[10.5px] text-paper-400 leading-snug">${n} drużyn${upName ? ' · wyżej: ' + upName : ''} · ${legend.join(' · ')}
        ${gameState.season.promotionBan ? ' · <b class="text-stamp">⛔ ZAKAZ AWANSU (afera)</b>' : ''}</p>`;
  },

  // Europejskie puchary: rozgrywki, etap, terminarz, premie
  euroView() {
    const eu = gameState.euro;
    const C = DATA.euro.comps[eu.comp], O = DATA.euro.comps[eu.origin];
    const live = Selectors.euroLive();
    const st = DATA.euro.stages[eu.stage];
    let next = '';
    if (live) {
      const k = eu.stage === 'LP' ? Selectors.euroKolejka(st.kolejki[eu.lp.played]) : Selectors.euroKolejka(st.kolejka);
      next = st.label + (eu.stage === 'LP' ? ' – mecz ' + (eu.lp.played + 1) + '/' + C.lpGames : '') + ' · w tygodniu ' + k + '. kolejki';
    }
    const guarantee = eu.origin === 'UCL' ? 'Odpadnięcie w eliminacjach LM = start w Lidze Europy (porażka w play-off LM daje fazę ligową LE).'
      : eu.origin === 'UEL' ? 'Odpadnięcie w eliminacjach LE = Liga Konferencji (porażka w play-off LE daje fazę ligową LKE).' : 'Liga Konferencji: bez siatki bezpieczeństwa – porażka w eliminacjach kończy przygodę.';
    const hist = eu.history.slice(0, 6).map((x) => `<li class="truncate">${Utils.escape(x.text)}</li>`).join('');
    return UI.panel(`${C.icon} ${C.name} · sezon ${eu.season}`, eu.season === gameState.calendar.season ? 'Start: ' + Selectors.euroQualLabel({ comp: eu.origin, path: eu.path }) : 'Poprzednia kampania',
      `<div class="grid grid-cols-3 gap-1.5 text-center">
        <div class="rounded-md bg-paper-200 py-1"><div class="text-[10px] uppercase text-ink-700">Etap</div><b class="text-[12px] block truncate px-1">${eu.done ? 'koniec' : Utils.escape(st.label)}</b></div>
        <div class="rounded-md bg-paper-200 py-1"><div class="text-[10px] uppercase text-ink-700">Faza ligowa</div><b class="text-[12px]">${eu.lp ? eu.lp.pts + ' pkt' + (eu.lp.rank ? ' · ' + eu.lp.rank + '.' : '') : '–'}</b></div>
        <div class="rounded-md bg-paper-200 py-1"><div class="text-[10px] uppercase text-ink-700">Premie</div><b class="text-[12px]">${Utils.formatMoney(eu.earned)}</b></div>
      </div>
      <p class="text-[11.5px] mt-1.5 leading-snug">${live ? '📅 Następny europejski wieczór: <b>' + Utils.escape(next) + '</b>' : '<b>' + Utils.escape(eu.result || '') + '</b>'}</p>
      <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">🛡️ ${guarantee}${eu.comp !== eu.origin ? ' Teraz gramy w: ' + C.name + ' (start: ' + O.name + ').' : ''}</p>`)
      + UI.panel('📜 Mecze w Europie', 'Dwumecze w eliminacjach i fazie pucharowej, finał na neutralnym stadionie',
        hist ? `<ul class="text-[12px] space-y-0.5">${hist}</ul>` : '<p class="text-[12px] text-ink-700">Pierwszy europejski wieczór dopiero przed nami.</p>')
      + `<p class="text-[10.5px] text-paper-400 leading-snug">⭐ Zawodnicy z meczami w Europie mogą osiągnąć OVR do 99 – w samej lidze sufit to 92. Najlepszy wynik klubu: ${Utils.escape(gameState.stats.euroBest || '–')}${gameState.stats.euroTrophies ? ' · 🏆×' + gameState.stats.euroTrophies : ''}</p>`;
  },

  // Finanse całej ligi: kasa, zdolność kredytowa i pożyczki każdego klubu
  leagueMoneyView() {
    const rows = [US].concat(gameState.league.rivals.map((r) => r.name)).map((name) => {
      if (name === US) {
        const owed = gameState.loans.taken.reduce((s, l) => s + l.remaining * l.rate, 0);
        return { name: Selectors.clubDisplayName(), us: true, cash: gameState.finance.budget, credit: Selectors.creditScore(), owed };
      }
      const ec = Engine.clubEco(name);
      // status spłat: 💀 niewypłacalny niedawno, ⚠️ zalega z ratami, ✅ spłacił dług, 📉 kryzys
      const status = (ec.blockedUntil || 0) > gameState.calendar.week ? '💀 ' : ec.loan && ec.loan.missed ? '⚠️ ' : ec.paidOff && !ec.loan ? '✅ ' : ec.crisis ? '📉 ' : '';
      return { name, cash: ec.cash, credit: Selectors.clubCredit(name), owed: ec.loan ? ec.loan.remaining * ec.loan.rate : 0, status };
    }).sort((a, b) => b.cash - a.cash);
    const big = rows.length > 12;
    return `<p class="text-[11px] text-paper-400 mb-1 leading-snug">${big ? 'Kasa i wiarygodność klubów.' : 'Kasa klubów według plotek z powiatu. Bogaci inwestują w skład, zadłużeni słabną; w dołku każdy bierze pożyczkę – ile dostanie, zależy od kondycji i historii spłat.'} ✅ spłacił · ⚠️ zalega · 💀 niewypłacalny</p>

      <section class="paper py-0.5 mb-2 overflow-hidden">
        <table class="w-full ${big ? 'text-[11px]' : 'text-[12px]'}">
          <tr class="text-[10px] uppercase text-ink-700"><th class="text-left pl-2">Klub</th><th class="text-right">Kasa</th><th class="text-center">Zdolność</th><th class="text-right pr-2">Dług</th></tr>
          ${rows.map((r) => { const c = Selectors.creditLabel(r.credit); return `
          <tr class="border-b border-paper-300 last:border-0 ${r.us ? 'bg-amber-glow/25 font-bold' : ''}">
            <td class="${big ? 'py-[1.5px]' : 'py-[5px]'} pl-2 pr-1 max-w-0 w-full truncate">${r.status || ''}${Utils.escape(r.name)}</td>
            <td class="text-right whitespace-nowrap px-1 ${r.cash < 0 ? 'text-stamp' : ''}">${Utils.formatMoney(r.cash)}</td>
            <td class="text-center px-1 whitespace-nowrap" title="${c[1]}">${c[0]}</td>
            <td class="text-right pr-2 whitespace-nowrap text-ink-700">${r.owed ? Utils.formatMoney(r.owed) : '–'}</td>
          </tr>`; }).join('')}
        </table>
      </section>`;
  },

  fixturesView() {
    const results = gameState.season.lastResults.map((m) => {
      const us = m.home === US || m.away === US;
      return `<li class="flex gap-1 ${us ? 'font-bold' : ''}"><span class="flex-1 min-w-0 truncate text-right">${Utils.escape(Selectors.teamName(m.home))}</span><b class="w-10 text-center">${m.hg}:${m.ag}</b><span class="flex-1 min-w-0 truncate">${Utils.escape(Selectors.teamName(m.away))}</span></li>`;
    }).join('');
    const upcoming = [];
    for (let i = gameState.calendar.round; i < Math.min(gameState.calendar.round + 6, gameState.season.rounds.length); i++) {
      const f = Selectors.fixtureAt(i);
      upcoming.push(`<li class="flex gap-2"><span class="w-8 text-ink-700">K${i + 1}</span><span class="w-16 text-ink-700">${f.home ? 'u siebie' : 'wyjazd'}</span><b class="flex-1 min-w-0 truncate">${Utils.escape(f.rival)}</b>${Selectors.rival(f.rival).derby ? '<span class="text-stamp">🔥 KOSA</span>' : ''}</li>`);
      const cup = Selectors.cupAt(i + 1);
      if (cup && cup.next) upcoming.push(`<li class="flex gap-2 rounded bg-amber-glow/20 -mx-1 px-1"><span class="w-8 text-ink-700 whitespace-nowrap">🏆</span><span class="w-16 text-ink-700 truncate">${cup.next.final ? 'Narodowy' : cup.next.home ? 'u siebie' : 'wyjazd'}</span><b class="flex-1 min-w-0 truncate">${Utils.escape(cup.next.opp)}</b><span class="text-[10.5px] text-ink-700 whitespace-nowrap">PP · ${Utils.escape(cup.R.label.split(' – ')[0])} · śr.</span></li>`);
    }
    const cupLast = gameState.cup && gameState.cup.season === gameState.calendar.season && gameState.cup.history[0];
    return UI.panel('⚽ Ostatnia kolejka', 'Wyniki zebrane telefonicznie przez pana Ryśka', (results ? `<ul class="text-[12px] space-y-0.5">${results}</ul>` : '<p class="text-[12px]">Liga jeszcze nie ruszyła.</p>') + (cupLast ? `<p class="text-[11.5px] text-ink-700 mt-1 truncate">🏆 Puchar Polski · ${Utils.escape(cupLast)}</p>` : ''), UI.formDots() ? `<span class="whitespace-nowrap">${UI.formDots()}</span>` : '')
      + UI.panel('📅 Najbliższe mecze', 'Terminarz z faksu Związku', upcoming.length ? `<ul class="text-[12px] space-y-0.5">${upcoming.join('')}</ul>` : '<p class="text-[12px]">Koniec sezonu.</p>');
  },

  // Strzelcy i średnie noty naszej drużyny
  teamStatsCard() {
    const squad = gameState.squad;
    const scorers = squad.filter((p) => p.seasonGoals > 0 || p.goals > 0 || (p.seasonAssists || 0) > 0)
      .sort((a, b) => b.seasonGoals - a.seasonGoals || (b.seasonAssists || 0) - (a.seasonAssists || 0) || b.goals - a.goals).slice(0, 5);
    const rated = squad.filter((p) => Selectors.avgRating(p) != null)
      .sort((a, b) => Selectors.avgRating(b) - Selectors.avgRating(a) || b.seasonRatingCount - a.seasonRatingCount).slice(0, 5);
    const row = (i, p, right) => `
      <tr class="border-b border-paper-300 last:border-0">
        <td class="py-1 pr-1 text-ink-700 w-5">${i + 1}.</td>
        <td class="py-1 pr-1 max-w-0 w-full truncate"><b>${Utils.escape(Selectors.shortName(p))}</b> <span class="text-[10.5px] text-ink-700">${DATA.positions[p.pos].label.toLowerCase()}</span></td>
        ${right}
      </tr>`;
    const scorersHtml = scorers.length ? `<table class="w-full text-[12px]">
        <tr class="text-[10px] uppercase text-ink-700"><th></th><th class="text-left">Zawodnik</th><th class="text-right">Gole</th><th class="text-right pl-2">Asysty</th><th class="text-right pl-2">Kariera</th></tr>
        ${scorers.map((p, i) => row(i, p, `<td class="py-1 text-right font-bold text-[13px]">${p.seasonGoals}</td><td class="py-1 text-right pl-2 font-semibold">${p.seasonAssists || 0}</td><td class="py-1 text-right pl-2 text-ink-700 whitespace-nowrap">${p.goals}/${p.assists || 0}</td>`)).join('')}
      </table>` : '<p class="text-[12px] text-ink-700">Nikt jeszcze nie strzelił. Napastnicy twierdzą, że to wina wiatru.</p>';
    const ratedHtml = rated.length ? `<table class="w-full text-[12px]">
        <tr class="text-[10px] uppercase text-ink-700"><th></th><th class="text-left">Zawodnik</th><th class="text-right">Mecze</th><th class="text-right pl-2">Śr. nota</th></tr>
        ${rated.map((p, i) => row(i, p, `<td class="py-1 text-right text-ink-700">${p.seasonRatingCount}</td><td class="py-1 text-right pl-2">${UI.ratingBadge(Selectors.avgRating(p))}</td>`)).join('')}
      </table>` : '<p class="text-[12px] text-ink-700">Brak not – sezon jeszcze się nie zaczął.</p>';
    return `<p class="text-[11px] text-paper-400 mb-1.5">Sezon ${gameState.calendar.season} · noty od 1.0 do 10.0 wystawia trener po każdym meczu</p>`
      + UI.panel('⚽ Strzelcy i asystenci klubu', '', scorersHtml)
      + UI.panel('⭐ Najwyższa średnia ocen w sezonie', '', ratedHtml);
  },

  /* ---------- ZAKŁADKA: SZTAB I TRENER ---------- */
  staffTab() {
    const c = gameState.coach;
    const coach = Selectors.coach();
    const style = DATA.styles[coach.style];
    const lineup = Selectors.projectedLineup();
    const chem = Engine.chemistry(lineup);
    const chemColor = chem >= 65 ? 'bg-grass' : chem >= 45 ? 'bg-amber-glow' : 'bg-stamp';
    const carpetReady = gameState.calendar.week - c.lastCarpetWeek >= CONFIG.carpetCooldown;
    const isTemp = c.id === 'mirek';
    const view = UI.sub('staff', 'coach');
    const segs = UI.subSegs('staff', view, [['coach', '🧢 Trener'], ['market', '🤝 Giełda'], ['crew', '🧰 Sztab'], ['director', '🧑‍💼 Dyrektor']]);
    const intro = '<p class="text-[11px] text-paper-400 mb-1.5">Prezes nie ustawia składu ani taktyki. Prezes zatrudnia, zwalnia i wzywa na dywanik.</p>';

    if (view === 'director') {
      const d = gameState.director;
      const cur = d.hired;
      const rows = DATA.directors.map((c, i) => UI.row(Utils.escape(c.name) + ' <span class="font-normal text-ink-700">· poziom ' + c.level + '</span>', Utils.escape(c.desc) + ' · ' + Utils.formatMoney(Math.round(c.wage * Selectors.econ())) + '/tydz.',
        cur && cur.name === c.name ? UI.smallBtn('fire-director', '', 'Zwolnij', false, 'stamp') : UI.smallBtn('hire-director', `data-idx="${i}"`, cur ? 'Zamień' : 'Zatrudnij', false), '', true)).join('');
      const modeBtns = cur ? UI.segs('director-mode', d.mode, [['manual', '🙋 Sam kupuję'], ['auto', '🧑‍💼 Dyrektor kupuje']]) : '';
      return segs + UI.panel('🧑‍💼 Dyrektor Sportowy', cur ? cur.name + ' · ' + (d.mode === 'auto' ? 'w oknie transferowym sam kupuje pod potrzeby składu, styl trenera i budżet' : 'czeka na polecenia – transfery robisz sam') : 'Wakat. Transfery robisz sam na giełdzie.',
        modeBtns + `${(d.log || []).length ? '<ul class="text-[11.5px] text-ink-700 mt-1.5 space-y-0.5">' + d.log.slice(0, 3).map((x) => '<li class="truncate">• ' + Utils.escape(x) + '</li>').join('') + '</ul>' : ''}` + UI.h4('Kandydaci') + rows)
        + `<p class="text-[10.5px] text-paper-400 leading-snug">${cur ? '💰 Sprzedaż zawodników: +' + Math.round(Selectors.directorSellBonus() * 100) + '% dzięki negocjacjom dyrektora. ' : 'Dyrektor podnosi kwoty ze sprzedaży zawodników (+8% na poziom). '}W trybie automatycznym wydaje do ok. ${30 + (cur ? cur.level * 7 : 0)}% wolnej kasy; im lepszy, tym trafniej kupuje.</p>`;
    }

    if (view === 'market') {
      const market = Selectors.coachMarket().map((co) => {
        const id = co.id;
        const st = DATA.styles[co.style];
        const testLineup = (() => { const prev = c.id, prevCustom = c.custom; c.id = id; c.custom = DATA.coaches[id] ? null : co; const l = Engine.pickLineup([]); const ch = Engine.chemistry(l); c.id = prev; c.custom = prevCustom; return ch; })();
        const offer = Selectors.coachOffer(co);
        const traits = (co.traits || []).map((t) => `<span class="whitespace-nowrap">${DATA.coachTraits[t].label} <span class="text-grass">+${DATA.coachTraits[t].pro}</span> <span class="text-stamp">−${DATA.coachTraits[t].con}</span></span>`).join(' · ');
        return UI.row(`${Utils.escape(co.name)} <span class="font-normal text-ink-700">· ${Utils.escape(co.title)} · jakość ${Math.round((co.quality + 0.1) * 100)}</span>`,
          `<b>${st.label}</b> · 📜 ${DATA.coachLicenses[co.license || 0]}${(co.license || 0) < Selectors.coachLicenseReq() ? ' <span class="text-stamp">(za mało)</span>' : ''} · ${Utils.formatMoney(offer.sign)} + <b>${Utils.formatMoney(offer.weekly)}/tydz.</b> · chemia ${testLineup}%${traits ? '<br>' + traits : ''}`,
          UI.smallBtn('hire-coach', `data-id="${id}"`, 'Zatrudnij', !isTemp || gameState.finance.budget < offer.sign), '', true);
      }).join('');
      return segs + intro + UI.panel('Giełda Trenerów', isTemp ? 'Pan Mirek chętnie odda gwizdek. Wybierz następcę.' : 'Żeby zatrudnić nowego, najpierw zwolnij obecnego.', market);
    }

    if (view === 'crew') {
      const folds = gameState.ui.folds || {};
      const openSlot = Object.keys(DATA.staffSlots).find((s) => folds['staff-' + s]);
      const staffRows = Object.entries(DATA.staffSlots).map(([slot, def]) => {
        const m = gameState.staff[slot];
        const pool = DATA.staffPool[slot] || [];
        const canHireExt = !m || m.kind === 'volunteer';
        const key = 'staff-' + slot;
        if (openSlot !== slot) {
          // zwinięta rola: nazwisko i realny efekt w dwóch linijkach (stuknięcie otwiera szczegóły i kandydatów)
          const eff = m ? Selectors.staffEffect(slot) : '';
          return `
        <details data-fold="${key}" class="border-b border-paper-300 last:border-0">
          <summary class="flex items-center justify-between gap-2 py-1 text-[12px] cursor-pointer select-none">
            <span class="min-w-0"><span class="block truncate"><span class="text-ink-700">${def.icon} ${def.label}:</span> <b>${m ? Utils.escape(m.name) : 'wakat'}</b></span>${openSlot ? '' : `<span class="block text-[10.5px] truncate ${eff ? 'text-grass font-semibold' : 'text-ink-700'}">${eff ? '⚡ ' + eff : m ? 'wsparcie atmosfery' : 'stuknij, by zatrudnić'}</span>`}</span><span class="fold-chevron text-ink-700">⌄</span>
          </summary>
        </details>`;
        }
        return `
        <div class="py-1.5 border-b border-paper-300 last:border-0">
          <div class="text-[10px] uppercase tracking-wide text-ink-700 font-medium">${def.icon} ${def.label}</div>
          ${m ? UI.row(`${m.kind === 'veteran' ? '🏅 ' : ''}${Utils.escape(m.name)}`,
            `${Selectors.staffEffect(slot) ? '<b class="text-grass">⚡ ' + Selectors.staffEffect(slot) + '</b><br>' : ''}${Utils.escape(m.desc)} · ${m.wage ? Utils.formatMoney(m.wage) + '/tydz.' : 'społecznie'}${m.chem ? ' · chemia +' + m.chem : ''}${m.lockerBase ? ' · atmosfera +' + m.lockerBase : ''}`,
            m.kind === 'volunteer' ? '' : UI.smallBtn('fire-staff', `data-slot="${slot}"`, 'Zwolnij', false, 'stamp'), '!py-0.5 !border-0', true)
            : '<div class="text-[12px] italic text-ink-700">Wakat. Krzesło stoi puste, na nim worek z piłkami.</div>'}
          <details data-fold="${key}" class="mt-1" ${folds[key] ? 'open' : ''}>
            <summary class="flex items-center justify-between h-7 px-2 rounded-md bg-paper-200 text-[11.5px] font-semibold cursor-pointer select-none">
              <span>${canHireExt ? 'Kandydaci (' + pool.length + ')' : 'Kandydaci – najpierw zwolnij obecnego'}</span><span class="fold-chevron text-ink-700">⌄</span>
            </summary>
            ${pool.map((cand, i) => UI.row(Utils.escape(cand.name),
              `${Utils.escape(cand.desc)} · ${Utils.formatMoney(Math.round(cand.wage * Selectors.econ()))}/tydz.${cand.chem ? ' · chemia +' + cand.chem : ''}${cand.lockerBase ? ' · atmosfera +' + cand.lockerBase : ''}`,
              UI.smallBtn('hire-staff', `data-slot="${slot}" data-idx="${i}"`, 'Zatrudnij', !canHireExt), 'px-1', true)).join('')}
          </details>
        </div>`;
      }).join('');
      return segs + (openSlot ? '' : intro) + UI.panel('Sztab Pomocniczy', openSlot ? '' : 'Każda rola daje realny efekt (⚡) – im lepszy fachowiec, tym mocniejszy. Stuknij rolę, by zobaczyć kandydatów.', staffRows + `
        <p class="text-[11px] text-ink-700 mt-1.5">Koszt sztabu: <b>${Utils.formatMoney(Selectors.staffWages())}/tydz.</b> Sztab to wyłącznie fachowcy z rynku – zatrudniasz ich tutaj.</p>`);
    }

    return segs + intro + UI.tiles([
      UI.tile('Styl', style.label, 'ustawienie ' + style.formation.slice(1).join('-')),
      UI.tile('Pensja', Utils.formatMoney(Selectors.coachWeekly()), 'na tydzień'),
      UI.tile('Chemia', chem + '%', Selectors.chemLabel(chem)),
    ]) + UI.panel('Trener: ' + Utils.escape(coach.name), Utils.escape(coach.title) + ', ' + coach.age + ' l. · w klubie od Tygodnia ' + c.hiredWeek, `
      <p class="text-[12px] leading-snug mb-1">${Utils.escape(coach.desc)}</p>
      <p class="text-[11px] leading-snug mb-1">⚽ ${style.label}: ${style.effect}${(coach.traits || []).length ? ' · ' + coach.traits.map((t) => DATA.coachTraits[t].label).join(', ') : ''}</p>
      <p class="text-[11px] text-ink-700 mb-1.5">„${style.motto}” · ${coach.prefers === 'veterans' ? 'Faworyzuje starych wyjadaczy' : coach.prefers === 'youth' ? 'Stawia na młodzież' : 'Wybiera po umiejętnościach'}</p>
      <p class="text-[11.5px] mb-1.5">📜 Licencja: <b>${DATA.coachLicenses[Selectors.coachLicense()]}</b> · wymagana w lidze: <b>${DATA.coachLicenses[Selectors.coachLicenseReq()]}</b>${Selectors.coachLicenseOk() ? ' <span class="text-grass font-bold">✓</span>' : ' <span class="text-stamp font-bold">brak!</span>'}${gameState.coach.figurehead ? ' · figurant: ' + DATA.coachLicenses[gameState.coach.figurehead.license] : ''}${!Selectors.coachLicenseOk() && gameState.coach.id !== 'mirek' ? ' ' + UI.smallBtn('coach-course', '', '🎓 Kurs ' + DATA.coachLicenses[Selectors.coachLicenseReq()] + ' (' + Utils.formatMoney(Selectors.courseCost(Selectors.coachLicenseReq())) + ')', gameState.finance.budget < Selectors.courseCost(Selectors.coachLicenseReq())) : ''}</p>
      <div class="flex justify-between text-[12px]"><span>Chemia taktyczna: <b>${Selectors.chemLabel(chem)}</b></span><span>${chem}%</span></div>
      ${UI.bar(chem, chemColor)}
      <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">Zgranie stylu trenera z profilami zawodników w jego wyjściowej jedenastce (+ wpływ sztabu). Niska chemia = głupie straty i narzekania w raportach.</p>
      ${c.lastReport ? `<blockquote class="border-l-2 border-grass pl-2 italic text-[12px] my-1.5">„${Utils.escape(c.lastReport)}”</blockquote>` : ''}
      <div class="flex flex-wrap gap-1.5 mt-1.5">
        ${UI.smallBtn('carpet-coach', '', '🟥 Wezwij na dywanik', !carpetReady)}
        ${isTemp ? '' : UI.smallBtn('fire-coach', 'data-mode="severance"', 'Zwolnij z odprawą (' + Utils.formatMoney(Engine.severance()) + ')', gameState.finance.budget < Engine.severance(), 'stamp')}
        ${isTemp ? '' : UI.smallBtn('fire-coach', 'data-mode="cold"', 'Zwolnij bez odprawy (' + Math.round(Selectors.fireFochChance(false) * 100) + '% foch)', false, 'stamp')}
      </div>
      <p class="text-[10.5px] text-ink-700 mt-1">${carpetReady ? 'Dywanik: krótka rozmowa ostrzegawcza. Zwykle mobilizuje, czasem obraża.' : 'Na dywanik można wezwać ponownie w Tygodniu ' + (c.lastCarpetWeek + CONFIG.carpetCooldown) + '.'}</p>
    `);
  },

  /* ---------- ZAKŁADKA: KADRA I SZATNIA ---------- */
  squadTab() {
    const coach = Selectors.coach();
    const lineup = Selectors.projectedLineup();
    const chem = Engine.chemistry(lineup);
    const sort = gameState.ui.squadSort || 'pos';
    const byPos = (a, b) => DATA.positions[a.pos].order - DATA.positions[b.pos].order || b.skill - a.skill;
    const squad = gameState.squad.slice().sort(
      sort === 'goals' ? (a, b) => (b.seasonGoals + (b.seasonAssists || 0)) - (a.seasonGoals + (a.seasonAssists || 0)) || b.seasonGoals - a.seasonGoals || byPos(a, b)
      : sort === 'rating' ? (a, b) => (Selectors.avgRating(b) ?? -1) - (Selectors.avgRating(a) ?? -1) || byPos(a, b)
      : byPos);
    const cols = 'grid grid-cols-[16px_minmax(0,1fr)_22px_22px_18px_18px_34px_28px] items-center gap-1';
    const marks = (p) => (p.id === gameState.star.playerId ? (gameState.star.rebel ? ' 🔥' : ' 🌟') : '') + (p.injured > 0 ? ' 🩹' : '') + (p.suspended > 0 ? ' ⛔' : '') + (p.loan ? ' 🔁' : '') + (p.benched ? ' 🚫' : '') + (p.exiled ? ' ⬇️U19' : '');

    // Gęsta tabela; stuknięcie w wiersz otwiera dolną szufladę ze szczegółami zawodnika
    const rows = squad.map((p) => {
      const inXI = lineup.includes(p);
      return `
      <button data-action="player-open" data-id="${p.id}" class="${cols} w-full text-left h-[27px] px-1.5 text-[12px] border-b border-paper-300 last:border-0 border-l-[3px] ${inXI ? 'border-l-grass' : 'border-l-transparent'} ${gameState.ui.playerSheet === p.id ? 'bg-amber-glow/15' : 'active:bg-paper-200'}">
        <span class="text-[11px]">${DATA.positions[p.pos].icon}</span>
        <span class="truncate"><b>${Utils.escape(Selectors.shortName(p))}</b>${marks(p)}${p.listed ? ' 📋' : ''}${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}${p.talent ? ' 💎' : ''}</span>
        <span class="text-center text-ink-700">${p.age}</span>
        <span class="text-center">${p.seasonApps}</span>
        <span class="text-center font-semibold">${p.seasonGoals}</span>
        <span class="text-center">${p.seasonAssists || 0}</span>
        <span class="text-right">${UI.ratingBadge(Selectors.avgRating(p))}</span>
        <span class="text-right">${UI.ovrBadge(p)}</span>
      </button>`;
    }).join('');

    return UI.tiles([
      UI.tile('Chemia', chem + '%', Selectors.chemLabel(chem)),
      UI.tile('Kadra', gameState.squad.length + '/' + CONFIG.maxSquad, 'OVR składu: ' + Selectors.teamOvr()),
      UI.tile('Koszt', Utils.formatMoney(Selectors.squadWages()), 'na tydzień'),
      UI.tile('Baza szatni', Selectors.lockerBaseline() + '%', 'legendy, sztab, bojler'),
    ], 4)
    + (gameState.transfer.open ? `<button data-action="open-transfer" class="btn-press w-full h-9 mb-2 rounded-lg bg-amber-glow text-ink-900 text-[13px] font-bold">🔁 Okno transferowe otwarte do 1. kolejki – wejdź</button>` : '')
    + UI.segs('squad-sort', sort, [['xi', '⚽ Jedenastka'], ['pos', 'Pozycja'], ['goals', 'G+A'], ['rating', 'Nota']])
    + (sort === 'xi' ? UI.lineupView(lineup, coach) : `<section class="paper overflow-hidden mb-1.5">
        <div class="${cols} h-6 px-1.5 border-l-[3px] border-l-transparent text-[9.5px] uppercase font-semibold text-ink-700 bg-paper-200">
          <span></span><span>Zawodnik · ${DATA.styles[coach.style].label.toLowerCase()}</span><span class="text-center">Wiek</span><span class="text-center">M</span><span class="text-center">G</span><span class="text-center">A</span><span class="text-right">Nota</span><span class="text-right">OVR</span>
        </div>
        ${rows}
      </section>
      <p class="text-[10.5px] text-paper-400 leading-snug">Skład ustala trener ${Utils.escape(coach.name)}. Prezes może najwyżej komuś podziękować – i liczyć się z reakcją trybun. Zielony pasek = jedenastka trenera; stuknij zawodnika po szczegóły i akcje.${gameState.transfer.open ? '' : ' 🔒 Skład zamknięty do okna transferowego.'}</p>`);
  },

  // Jedenastka trenera na boisku (napastnicy u góry) i rezerwy pod spodem
  lineupView(lineup, coach) {
    const chip = (p) => `
      <button data-action="player-open" data-id="${p.id}" class="btn-press min-w-0 max-w-[84px] flex-1 rounded-md bg-white/95 px-1 py-0.5 text-center text-ink-900">
        <div class="text-[11px] font-bold truncate">${Utils.escape(p.nick)}${p.favorite ? '⭐' : ''}</div>
        <div class="text-[10px] leading-tight">${UI.ovrBadge(p)}</div>
      </button>`;
    const rows = ['FWD', 'MID', 'DEF', 'GK'].map((pos) => {
      const ps = lineup.filter((p) => p.pos === pos);
      return ps.length ? `<div class="flex justify-center gap-1.5">${ps.map(chip).join('')}</div>` : '';
    }).join('');
    const bench = gameState.squad.filter((p) => !lineup.includes(p))
      .sort((a, b) => DATA.positions[a.pos].order - DATA.positions[b.pos].order || b.skill - a.skill)
      .map((p) => `<button data-action="player-open" data-id="${p.id}" class="flex items-center gap-1 min-w-0 text-left text-[11.5px] h-7"><span class="text-[10px]">${DATA.positions[p.pos].icon}</span><b class="truncate">${Utils.escape(p.nick)}</b><span class="text-ink-700">${p.injured > 0 ? '🩹 ' + p.injured + ' tyg.' : p.benched ? '🚫' : p.loan ? '🔁' : Selectors.ratingText(Selectors.avgRating(p))}</span></button>`).join('');
    return `
      <section class="rounded-xl bg-grass px-2 py-2.5 mb-2 space-y-2.5 relative overflow-hidden" style="background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 22px, transparent 22px 44px);">
        <div class="text-[10px] uppercase tracking-wide text-white/80 font-semibold text-center">Jedenastka · ${DATA.styles[coach.style].label} ${DATA.styles[coach.style].formation.slice(1).join('-')} · OVR ${Selectors.teamOvr()}</div>
        ${rows}
      </section>
      <section class="paper px-2.5 py-1.5 mb-1.5">
        <div class="text-[10px] uppercase tracking-wide text-ink-700 font-semibold mb-0.5">Ławka i rezerwy (${gameState.squad.length - lineup.length})</div>
        <div class="grid grid-cols-2 gap-x-2">${bench || '<p class="text-[12px] text-ink-700">Nikogo na ławce.</p>'}</div>
      </section>`;
  },

  // Ostrzeżenia w nagłówku: długi, komornik, walne zebranie, prokuratura
  threats() {
    const t = Selectors.debtThresholds();
    const b = gameState.finance.budget;
    const items = [];
    const ratio = Selectors.debtRatio();
    if (gameState.debt.deepWeeks > 0) items.push('<span class="text-stamp font-bold">☠️ Upadłość za ' + (CONFIG.debtGameOverWeeks - gameState.debt.deepWeeks) + ' tyg.! (dług ' + Math.round(ratio) + '/' + CONFIG.debtBankruptRatio + ' tyg. przychodów)</span>');
    else if (ratio > CONFIG.debtBailiffRatio) items.push('<span class="text-stamp font-bold">⚖️ Komornik · dług ' + Math.round(ratio) + '/' + CONFIG.debtBankruptRatio + ' tyg. przychodów</span>');
    else if (b < t.warn) items.push('<span class="text-amber-glow font-bold">💸 Odsetki + strajk</span>');
    if (gameState.dark.caseOpen) items.push('<span class="text-stamp font-bold">⚖️ Postępowanie w Związku</span>');
    if (gameState.season.promotionBan) items.push('<span class="text-stamp font-bold">⛔ Zakaz awansu</span>');
    if ((gameState.star.slumpUntil || 0) > gameState.calendar.week) items.push('<span class="text-stamp font-bold">📉 Kryzys formy (' + (gameState.star.slumpUntil - gameState.calendar.week) + ' tyg.)</span>');
    if (Selectors.rebel()) items.push('<span class="text-stamp font-bold">🔥 Bunt: „' + Utils.escape(Selectors.starPlayer().nick) + '”</span>');
    return items.length ? `<div class="text-[11px] mt-1 truncate space-x-2">${items.join(' ')}</div>` : '';
  },

  /* ---------- EKRAN KOŃCA GRY ---------- */
  gameOverScreen() {
    const g = gameState.gameOver || {};
    const st = gameState.stats;
    const row = (k, v) => `<tr class="border-b border-paper-300"><td class="py-1.5 pr-3">${k}</td><td class="py-1.5 text-right font-bold">${v}</td></tr>`;
    return `
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-2xl">
        <header class="text-center mb-6">
          <p class="text-paper-400 text-[11px] font-medium tracking-wider uppercase mb-3">Protokół z Walnego Zgromadzenia · Remiza OSP · Sezon ${g.season}, Tydzień ${g.week}</p>

  /* ---------- ZAKŁADKA: WIRTUALNY X ---------- */
  virtualXTab() {
    const x = gameState.x;
    const dna = gameState.club.professionalism;
    const locked = Selectors.strategyLocked();
    const current = Selectors.mediaStrategy();
    const view = UI.sub('virtualx', locked ? 'feed' : 'post');
    const segs = UI.subSegs('virtualx', view, [['post', '🎯 Strategia'], ['feed', '📰 Feed']]);
    const intro = '<p class="text-[11px] text-paper-400 mb-1.5">Dawniej Twitter, w gminie zwany „Fejsem”. Tu się rodzą gównoburze i legendy.</p>';

    if (view === 'feed') {
      const feed = gameState.feed.slice(0, 40).map((p) => `
        <article class="flex gap-2 py-1.5 border-b border-paper-300 last:border-0 ${p.official ? 'border-l-2 border-l-amber-glow pl-1.5' : ''}">
          <div class="w-7 h-7 flex-shrink-0 rounded-full bg-ink-900 flex items-center justify-center text-[14px]">${p.avatar}</div>
          <div class="min-w-0 flex-1">
            <div class="text-[11.5px] truncate"><b>${Utils.escape(p.handle)}</b> <span class="text-ink-700">· T${p.week}</span>${p.official ? ' <span class="text-[9.5px] bg-amber-glow px-1 rounded font-bold">✔ OFICJALNY</span>' : ''}</div>
            <p class="text-[12.5px] leading-snug break-words">${Utils.escape(p.text)}</p>
            <div class="text-[10.5px] text-ink-700 flex gap-3"><span>💬 ${p.replies}</span><span>🔁 ${p.shares}</span><span>❤️ ${p.likes}</span></div>
          </div>
        </article>`).join('');
      return segs + `<section class="paper px-2.5 py-1">${feed || '<p class="text-[12px] py-1.5">Cisza w sieci. Nawet @KibicSukcesu88 jeszcze nic nie napisał.</p>'}</section>`;
    }

    const st = DATA.mediaStrategies[current];
    const cards = Object.entries(DATA.mediaStrategies).map(([id, s]) => {
      const active = locked && id === current;
      const can = !locked;
      return `
      <button data-action="set-strategy" data-value="${id}" ${can ? '' : 'disabled'}
        class="btn-press w-full text-left px-2.5 py-2 border rounded-lg ${active ? 'border-amber-glow bg-amber-glow/15' : can ? 'border-paper-300 bg-white' : 'border-paper-300 bg-paper-200 opacity-60 cursor-not-allowed'}">
        <div class="flex items-baseline justify-between gap-2">
          <span class="text-[13.5px] font-bold">${s.icon} ${s.label}</span>
          <span class="text-[10px] text-ink-700 whitespace-nowrap">presja mediów ${'●'.repeat(s.pressure)}${'○'.repeat(3 - s.pressure)}</span>
        </div>
        <div class="text-[11px] text-ink-700 italic">${s.sub}</div>
        <div class="text-[11px] leading-snug mt-0.5">${s.effects.join(' · ')}</div>
      </button>`;
    }).join('');
    return segs + intro + UI.tiles([
      UI.tile('Strategia', locked ? st.icon + ' ' + st.label : 'do wyboru', locked ? 'sezon ' + x.strategySeason : 'ustal raz na sezon'),
      UI.tile('Presja mediów', locked ? '●'.repeat(st.pressure) + '○'.repeat(3 - st.pressure) : '–', locked ? ['', 'niska', 'średnia', 'wysoka'][st.pressure] : ''),
      UI.tile('DNA klubu', (dna > 0 ? '+' : '') + dna, '„' + Utils.escape(Selectors.dnaLabel()) + '”'),
    ]) + UI.panel('Strategia medialna na sezon ' + gameState.calendar.season, locked
        ? 'Ustalona na cały sezon – Pani Halinka postuje sama, zgodnie z linią klubu. Zmiana w następnym sezonie.'
        : 'Wybierz raz – działa pasywnie przez cały sezon. Pani Halinka postuje sama co dwa tygodnie.', `
        <div class="grid gap-1.5">${cards}</div>`)
      + UI.panel('🧬 DNA klubu', 'Od Prowincjonalnej Patologii do Wiejskiego Profesjonalizmu', `
        ${UI.bar((dna + 100) / 2, dna >= 25 ? 'bg-grass' : dna > -25 ? 'bg-amber-glow' : 'bg-stamp')}
        <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">Podnoszą: neutralna strategia, inwestycje w szkółkę, odmowa „Spółdzielni”. Obniżają: zadymy, zatrucia, kary, reklamówki z Passata. Sponsor „Ostatnia Prosta” patrzy na to bardzo uważnie.</p>`);
  },

  /* ---------- ZAKŁADKA: FINANSE I STADION ---------- */
  financeTab() {
    const view = UI.sub('finance', 'report');
    const rep = gameState.lastReport;
    const views = { report: UI.reportCard, tickets: UI.ticketsCard, food: UI.foodCard, merch: UI.merchCard, sponsor: UI.sponsorCard, loans: UI.loansCard, stadium: UI.stadiumCard };
    // Otwarta grupa inwestycji potrzebuje miejsca – kafelki finansowe wracają po jej zwinięciu
    const roomy = view === 'stadium' && ['st-build', 'st-youth', 'st-lic', 'st-fans', 'st-team'].some((k) => (gameState.ui.folds || {})[k]);
    return (roomy ? '' : UI.tiles([
      UI.tile('Kasa', Utils.formatMoney(gameState.finance.budget), 'stan konta', gameState.finance.budget < 0 ? 'text-stamp' : ''),
      UI.tile('Wypłaty', Utils.formatMoney(Selectors.weeklyPayroll()), 'na tydzień'),
      UI.tile('Ostatni tydzień', rep ? Utils.signedMoney(rep.total) : '–', rep ? 'Tydzień ' + rep.week : 'brak rozliczenia', rep ? (rep.total < 0 ? 'text-stamp' : 'text-grass') : ''),
    ])) + UI.subSegs('finance', view, [['report', 'Bilans'], ['tickets', 'Bilety'], ['food', 'Budka'], ['merch', 'Sklep'], ['sponsor', 'Sponsor'], ['loans', 'Pożyczki'], ['stadium', 'Obiekt']])
      + (views[view] || UI.reportCard)();
  },

  // Kryzys: cięcia kosztów stałych i wyprzedaż zawodników w jednym miejscu
  crisisCutsCard() {
    const e = Selectors.econ();
    const staff = Object.entries(DATA.staffSlots).map(([slot, def]) => ({ slot, def, m: gameState.staff[slot] })).filter((x) => x.m && x.m.kind !== 'volunteer' && x.m.wage > 0);
    const d = gameState.director && gameState.director.hired;
    const u = gameState.u19 || {};
    const cut = (icon, role, name, wage, action, attrs) => `
      <div class="flex items-center gap-1.5 py-[3px] border-b border-paper-300 last:border-0 text-[12px]">
        <span class="w-5 text-center">${icon}</span><span class="min-w-0 flex-1 truncate"><b>${Utils.escape(role)}</b> · ${Utils.escape(name)}</span>
        <span class="text-ink-700 whitespace-nowrap">${Utils.formatMoney(wage)}/tydz.</span>${UI.smallBtn(action, attrs, 'Zwolnij', false, 'stamp')}
      </div>`;
    const cuts = staff.map((x) => cut(x.def.icon, x.def.label.split(' ')[0], x.m.name, x.m.wage, 'fire-staff', `data-slot="${x.slot}"`)).join('')
      + (d ? cut('🧑‍💼', 'Dyrektor', d.name, Math.round(d.wage * e), 'fire-director', '') : '')
      + (u.coach ? cut('🌱', 'Trener U19', u.coach.name, Math.round(u.coach.wage * e), 'fire-u19', 'data-role="coach"') : '')
      + (u.recruiter ? cut('🔭', 'Rekruter U19', u.recruiter.name, Math.round(u.recruiter.wage * e), 'fire-u19', 'data-role="recruiter"') : '');
    const canSell = gameState.squad.length > CONFIG.minSquad;
    const sale = gameState.squad.filter((p) => !p.loan).sort((a, b) => Selectors.sellPrice(b) - Selectors.sellPrice(a)).slice(0, 5).map((p) => `
      <div class="flex items-center gap-1.5 py-[3px] border-b border-paper-300 last:border-0 text-[12px]">
        ${UI.ovrBadge(p)}<span class="min-w-0 flex-1 truncate"><b>${Utils.escape(Selectors.shortName(p))}</b>${p.favorite ? ' ⭐' : ''}${p.legend ? ' 🏆' : ''}</span>
        <span class="whitespace-nowrap text-[11px]"><s class="text-ink-700">${Utils.formatMoney(Selectors.sellPrice(p))}</s> <b class="text-stamp">${Utils.formatMoney(Selectors.fireSalePrice(p))}</b></span>${UI.smallBtn('fire-sale', `data-id="${p.id}"`, 'Sprzedaj', !canSell, 'stamp')}
      </div>`).join('');
    const ratio = Selectors.debtRatio();
    const pct = Utils.clamp(ratio / CONFIG.debtBankruptRatio * 100, 0, 100);
    const meter = `<div class="rounded-md bg-paper-200 px-2 py-1 mb-1"><div class="flex justify-between gap-2 text-[11px] whitespace-nowrap"><span>Dług ${Utils.formatMoney(Selectors.debtHole())} = <b class="${ratio > CONFIG.debtBailiffRatio ? 'text-stamp' : ''}">${Math.round(ratio)} tyg.</b> przychodów</span><span class="text-ink-700">upadłość: ${CONFIG.debtBankruptRatio} tyg.</span></div><div class="h-1.5 rounded-full bg-paper-300 mt-0.5 overflow-hidden"><div class="h-full ${ratio > CONFIG.debtBailiffRatio ? 'bg-stamp' : 'bg-amber-glow'}" style="width:${pct}%"></div></div><div class="text-[10px] text-ink-700 mt-0.5">Przychody klubu ~${Utils.formatMoney(Math.round(Selectors.incomeWeekly()))}/tydz. · komornik od ${CONFIG.debtBailiffRatio} tyg.</div></div>`;
    return UI.panel('🔥 Ratowanie budżetu', 'Liczy się dług względem przychodów, nie sam minus. Cięcia oszczędzają co tydzień, ale zabierają bonusy sztabu.', meter + `
      ${UI.h4('✂️ Zwolnienia w sztabie')}
      ${cuts || '<p class="text-[11.5px] text-ink-700">Nie ma już kogo zwalniać – zostali sami społecznicy.</p>'}
      ${UI.h4('💸 Wyprzedaż „po taniości” – kluby widzą naszą desperację (~45% wartości)')}
      ${sale}
      <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">Sprzedaż działa także poza oknem transferowym. Szatnia i kibice źle to znoszą – zwłaszcza odejście ulubieńców.</p>
    `);
  },

      : `<table class="w-full text-[12.5px]">
          ${rep.lines.map((l) => `<tr class="border-b border-paper-300"><td class="py-1 pr-2">${Utils.escape(l.label)}</td><td class="py-1 text-right font-bold whitespace-nowrap ${l.amount < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(l.amount)}</td></tr>`).join('')}
          <tr><td class="pt-1.5 font-semibold">Razem</td><td class="pt-1.5 text-right font-bold text-[14px] whitespace-nowrap ${rep.total < 0 ? 'text-stamp' : 'text-grass'}">${Utils.signedMoney(rep.total)}</td></tr>
        </table>`;

      + (Selectors.debtCrisis() ? `<button data-action="show-bilans" class="btn-press w-full h-8 rounded-md bg-stamp text-white text-[12px] font-bold">🔥 Ratowanie budżetu: cięcia i wyprzedaż</button>` : `<p class="text-[10.5px] text-paper-400 leading-snug">Księgowa pani Halinka przychodzi we wtorki. Do tego czasu wszystko jest „na zeszyt”.</p>`);
  },

  ticketsCard() {
    const md = gameState.matchday;
    const next = Selectors.nextHomeFixture();
    const preview = next
      ? `<p class="text-[12px] leading-snug">Najbliższy mecz u siebie: <b>Kolejka ${next.kolejka} vs ${Utils.escape(next.fixture.rival)}</b>${Selectors.rival(next.fixture.rival).derby ? ' <span class="text-stamp font-bold">🔥 KOSA – podwójne zainteresowanie!</span>' : ''}. Bilety kupowane na bramce w dniu meczu.</p>`
      : '<p class="text-[12px]">W tym sezonie u siebie już nie gramy.</p>';
    const policies = Object.entries(DATA.tickets).map(([id, t]) => {
      const ok = Engine.canSetTicket(id);
      const active = (md.ticketNext || md.ticket) === id;
      const f = Engine.ticketForecast(id);
      return `
        <button data-action="set-ticket" data-value="${id}" ${ok ? '' : 'disabled'}
          class="btn-press w-full text-left px-2 py-1.5 border rounded-lg flex items-center gap-2 ${active ? 'border-amber-glow bg-amber-glow/15' : ok ? 'border-paper-300 bg-white' : 'border-paper-300 bg-paper-200 opacity-60 cursor-not-allowed'}">
          <span class="text-[18px] w-6 text-center">${ok || active ? t.icon : '🔒'}</span>
          <span class="min-w-0 flex-1">
            <span class="block text-[12.5px] ${active ? 'font-bold' : 'font-semibold'} leading-tight">${t.policy} · ${t.price} zł</span>
            <span class="block text-[10.5px] text-ink-700 leading-snug">${f ? '~' + f.att + ' widzów · ~' + Utils.formatMoney(f.gate) + ' z biletów na mecz' : 'brak meczów u siebie'}${t.fans ? ' · nastroje ' + (t.fans > 0 ? '↑' : '↓') + ' (co miesiąc)' : ''}</span>
          </span>
        </button>`;
    }).join('');

    return UI.panel('Bilety na mecze', 'Kasa na bramce: pan Heniek i zeszyt w kratkę.', `
      <div class="bg-paper-200 rounded-md px-2 py-1.5 mb-1">${preview}</div>
      <p class="text-[11.5px] leading-snug mb-1 truncate">${Selectors.passPolicy().icon} Karnety: <b>${Selectors.passPolicy().label}</b>${Selectors.passHolders() ? ' · ' + Selectors.passHolders() + ' szt. (' + Utils.formatMoney(gameState.matchday.pass.revenue) + ' z góry)' : ''}</p>
      ${UI.h4('Polityka cenowa biletów na bramce')}
      <div class="grid gap-1.5">${policies}</div>
      <p class="text-[11px] font-semibold mt-0.5 text-ink-700">✅ Nowy cennik działa od razu · reakcja kibiców rozliczana co miesiąc (przy dobrych wynikach łagodniej).</p>
      <button data-action="sub-view" data-tab="finance" data-value="food" class="btn-press w-full mt-1.5 h-8 rounded-md bg-paper-200 text-[12px] font-semibold text-left px-2">🌭 Budka Pana Zenka: ${Selectors.budkaMenu().length} poz. w menu – ceny i rozbudowa ›</button>
      <p class="text-[10.5px] text-ink-700 mt-1 leading-snug">📈 Nastroje po wynikach: <b>${Selectors.formLabel()}</b> do frekwencji, gastro i sklepu · ☀️ w słońcu grill +30%.</p>
    `);
  },

  // Budka: menu rośnie z rozbudową, cena każdej pozycji ustawiana osobno
  foodCard() {
    const b = gameState.budka;
    const L = DATA.budka.levels[b.level || 1];
    const next = DATA.budka.levels[(b.level || 1) + 1];
    const nextCost = next ? Math.round(next.cost * Selectors.econ() / 10) * 10 : 0;
    const pi = Selectors.budkaPriceIndex();
    const rows = Selectors.budkaMenu().map((id) => {
      const it = DATA.budka.items[id];
      const pr = Selectors.budkaPrice(id), cost = Selectors.budkaCost(id);
      const last = b.last && b.last[id];
      const tone = pr > it.base * 1.25 ? 'text-stamp' : pr < it.base * 0.9 ? 'text-grass' : '';
      return `
      <div class="flex items-center gap-1.5 py-[3px] border-b border-paper-300 last:border-0">
        <span class="text-[17px] w-6 text-center">${it.icon}</span>
        <span class="min-w-0 flex-1"><span class="block text-[12px] font-semibold truncate">${Utils.escape(it.label)}</span><span class="block text-[10px] text-ink-700 truncate">koszt ${cost} zł${it.meat && b.cheapMeat ? ' 🥩' : ''} · uczciwie ~${it.base} zł${last ? ' · ost. ' + last.n + ' szt.' : ''}</span></span>
        <button data-action="budka-price" data-id="${id}" data-value="-1" class="btn-press w-7 h-7 rounded-md bg-paper-200 font-bold">−</button>
        <b class="w-10 text-center text-[13px] ${tone}">${pr} zł</b>
        <button data-action="budka-price" data-id="${id}" data-value="1" class="btn-press w-7 h-7 rounded-md bg-paper-200 font-bold">+</button>
      </div>`;
    }).join('');
    const lastTotal = b.last ? Object.values(b.last).reduce((s, x) => s + x.profit, 0) : 0;
    return UI.panel('🌭 ' + L.name + ' · poziom ' + (b.level || 1) + '/' + (DATA.budka.levels.length - 1), 'Menu zależy od rozbudowy. Ty ustalasz ceny – za drogo kolejka znika, a kibice marudzą; za tanio schodzi wszystko, ale marża mała.', `
      ${rows}
      <div class="flex justify-between text-[11.5px] mt-1.5"><span>Cennik vs „uczciwe” ceny: <b class="${pi > 1.15 ? 'text-stamp' : pi < 0.9 ? 'text-grass' : ''}">${Math.round(pi * 100)}%</b>${pi > 1.15 ? ' · kibice narzekają' : pi < 0.85 ? ' · kibice chwalą' : ''}</span><span>Ost. mecz: <b class="text-grass">${Utils.signedMoney(lastTotal)}</b></span></div>
      ${b.cheapMeat ? '<p class="text-[10.5px] text-stamp mt-1 leading-snug">🥩 Mięso od rzeźnika Waldka: mięsne pozycje o połowę tańsze w zakupie. Papierów brak…</p>' : ''}
      ${next ? `<button data-action="budka-upgrade" ${gameState.finance.budget < nextCost ? 'disabled' : ''} class="btn-press w-full mt-1.5 rounded-md bg-amber-glow text-ink-900 px-2 py-1.5 text-left disabled:opacity-50"><span class="block text-[12.5px] font-bold">🏗️ Rozbuduj: ${Utils.escape(next.name)} · ${Utils.formatMoney(nextCost)}</span><span class="block text-[10.5px]">Nowe w menu: ${next.items.map((id) => DATA.budka.items[id].icon + ' ' + DATA.budka.items[id].label).join(', ')}</span></button>` : '<p class="text-[11px] text-grass font-semibold mt-1.5">🏆 Budka w pełni rozbudowana.</p>'}
    `);
  },

  merchCard() {
    const m = gameState.merch;
    const favorites = gameState.squad.filter((p) => p.favorite).length;
    const items = Selectors.shopItems();
    const rows = items.map((id) => {
      const item = DATA.merch[id];
      const cost = item.batch * item.unitCost;
      const pr = Engine.merchPrice(id);
      const tone = pr > item.basePrice * 1.3 ? 'text-stamp' : pr < item.unitCost ? 'text-stamp' : pr < item.basePrice * 0.85 ? 'text-grass' : '';
      return `
      <div class="flex items-center gap-1 py-[3px] border-b border-paper-300 last:border-0">
        <span class="text-[16px] w-5 text-center">${item.icon}</span>
        <span class="min-w-0 flex-1"><span class="block text-[12px] font-semibold truncate">${Utils.escape(item.label)}</span><span class="block text-[10px] truncate ${m.stock[id] ? 'text-ink-700' : 'text-stamp font-semibold'}">mag. ${m.stock[id]} · hurt ${item.unitCost} zł${m.last && m.last[id] ? ' · ost. ' + m.last[id] + ' szt.' : ''}</span></span>
        <button data-action="merch-price" data-id="${id}" data-value="-1" class="btn-press w-6 h-7 rounded-md bg-paper-200 font-bold">−</button>
        <b class="w-11 text-center text-[12.5px] ${tone}">${pr} zł</b>
        <button data-action="merch-price" data-id="${id}" data-value="1" class="btn-press w-6 h-7 rounded-md bg-paper-200 font-bold">+</button>
        <button data-action="order-merch" data-item="${id}" ${gameState.finance.budget < cost ? 'disabled' : ''} class="btn-press h-7 px-1.5 rounded-md bg-amber-glow text-ink-900 text-[10.5px] font-bold leading-tight disabled:opacity-40">📦+${item.batch}<br>${Utils.formatMoney(cost)}</button>

    const shopLine = gameState.lastReport && gameState.lastReport.lines.find((l) => l.label === 'Sklepik fanowski');

    const nextCost = next ? Math.round(next.cost * Selectors.econ() / 10) * 10 : 0;

    return UI.tiles([
      UI.tile('Magazyn', stock + ' szt.', 'zamrożone ' + Utils.formatMoney(frozen)),
      UI.tile('Ostatni tydz.', shopLine ? Utils.signedMoney(shopLine.amount) : '0 zł', 'wpływ ze sklepu', shopLine ? 'text-grass' : ''),
      UI.tile('Sprzedano', m.soldTotal + ' szt.', 'od początku'),
    ]) + UI.panel('🛍️ ' + DATA.shopLevels[m.level || 1].name + ' · poziom ' + (m.level || 1) + '/' + (DATA.shopLevels.length - 1), 'Asortyment rośnie z rozbudową. Cenę każdego gadżetu ustalasz sam; za drogo = nikt nie kupuje i kibice marudzą.', `
      ${rows}
      <div class="flex justify-between text-[11px] mt-1"><span>Ceny vs bazowe: <b class="${spi > 1.3 ? 'text-stamp' : spi < 0.8 ? 'text-grass' : ''}">${Math.round(spi * 100)}%</b>${spi > 1.3 ? ' · kibice marudzą' : spi < 0.75 ? ' · kibice chwalą' : ''}</span><span class="text-ink-700">⭐ ulubieńcy: ${favorites} → koszulki</span></div>
      ${next ? `<button data-action="shop-upgrade" ${gameState.finance.budget < nextCost ? 'disabled' : ''} class="btn-press w-full mt-1.5 rounded-md bg-amber-glow text-ink-900 px-2 py-1 text-left disabled:opacity-50"><span class="block text-[12px] font-bold">🏗️ Rozbuduj: ${Utils.escape(next.name)} · ${Utils.formatMoney(nextCost)}</span><span class="block text-[10.5px] truncate">Nowe: ${next.items.map((id) => DATA.merch[id].icon + ' ' + DATA.merch[id].label).join(', ')}</span></button>` : '<p class="text-[11px] text-grass font-semibold mt-1">🏆 Sklep w pełni rozbudowany.</p>'}
    `);

          </div>

  loansCard() {
    const L = gameState.loans;
    const score = Selectors.creditScore();
    const [dot, label, level] = Selectors.creditLabel(score);
    const crisis = gameState.finance.budget < 0;
    const owedAll = L.taken.reduce((s, l) => s + l.remaining * l.rate, 0);
    const takenRows = Object.entries(DATA.lenders).filter(([id, l]) => !l.crisisOnly || crisis || L.taken.some((x) => x.id === id)).map(([id, l]) => {
      const o = Selectors.loanOffer(id);
      const active = l.stack ? (o.available ? null : L.taken.find((x) => x.id === id)) : L.taken.find((x) => x.id === id);
